m":"无人机在特定区域内执行任务时（）。","options":[{"key":"A","text":"不需要对该区域地图进行校准准"},{"key":"B","text":"只需首次对该区域地图进行校准"},{"key":"C","text":"需要每次对该区域地图进行校准"}],"answer":"B","analysis":"提示：首次\n解析：一般情况下，当无人机在特定区域内执行任务时，只需首次对该区域地图进行校准即可，后续如果没有重大的地图变化或设备调整等情况，不需要每次都进行校准。而完全不需要校准的说法不准确，可能会存在一些误差累积等情况需要首次校准来保证准确性。每次对该区域地图进行校准过于繁琐且通常没有必要，","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0349","type":"single","difficulty":1,"stem":"下列哪一项是飞行重规划要考虑的内容？","options":[{"key":"A","text":"已知威胁区域"},{"key":"B","text":"未知威胁区域"},{"key":"C","text":"无人机自身约束条件"}],"answer":"B","analysis":"提示：未知威胁\n解析：飞行重规划通常是在飞行过程中遇到突发情况时进行。已知威胁区域在初始规划时一般就会考虑到并进行规避，而飞行重规划主要是针对在飞行过程中出现的未知威胁区域进行调整，以确保安全飞行。无人机自身约束条件在初始规划和重规划中都会考虑，但不是重规划特有的主要考虑内容。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0350","type":"single","difficulty":1,"stem":"下列哪种感觉是无人机操纵员在操纵无人机时无法感知的?","options":[{"key":"A","text":"视觉"},{"key":"B","text":"听觉"},{"key":"C","text":"前庭觉"}],"answer":"C","analysis":"提示：前庭觉\n解析：无人机操纵员无法感知前庭觉。前庭觉主要是人体对自身运动状态和头部位置的感知，操纵员无法通过操纵无人机获得这种感觉。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0351","type":"single","difficulty":1,"stem":"下列哪种规划是任务规划的主体核心？","options":[{"key":"A","text":"任务分配规划"},{"key":"B","text":"航迹规划"},{"key":"C","text":"应急预案规划"}],"answer":"B","analysis":"提示：航迹规划→任务的主体和核心\n解析：航迹规划是任务规划的主体核心，直接决定无人机飞行路径，","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0352","type":"single","difficulty":1,"stem":"下列哪种控制方式不属于无人机仪表飞行?","options":[{"key":"A","text":"自主控制"},{"key":"B","text":"姿态遥控"},{"key":"C","text":"舵面遥控"}],"answer":"A","analysis":"提示：选错的，自主\n解析：根据蓝皮书 7.5 无人机仪表飞行的特点 表述：我们可以把无人机飞行操作手利用飞行摇杆在姿态遥控或直接操作舵面方式下的飞行定义为无人机的仪表飞行。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0353","type":"single","difficulty":1,"stem":"下列哪种卫星导航系统是由俄罗斯构建的?","options":[{"key":"A","text":"GPS"},{"key":"B","text":"格洛纳斯"},{"key":"C","text":"伽利略"}],"answer":"B","analysis":"提示：格洛纳斯\n解析：格洛纳斯卫星导航系统是由俄罗斯构建的GPS是美国的卫星导航系统，伽利略是欧洲的卫星导航系统。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0354","type":"single","difficulty":1,"stem":"下列哪种信息不是GPS发送的?","options":[{"key":"A","text":"经纬度"},{"key":"B","text":"高程"},{"key":"C","text":"空速"}],"answer":"C","analysis":"提示：选错的。GPS管速度不管空速\n解析：GPS发送的信息包括经纬度和高程等位置信息，但不包括空速信息。空速一般由飞机自身的空速管等设备测量得到","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0355","type":"single","difficulty":1,"stem":"相比于夏天，在冬天的时候飞机的飞行时间变长还是缩短?(不考虑电池原因，只看气压对飞行时间的影响)","options":[{"key":"A","text":"夏天飞行时间长"},{"key":"B","text":"冬天飞行时间长"},{"key":"C","text":"一样长，气压的变化对飞机飞行时长没有影响"}],"answer":"B","analysis":"提示：不考虑电池就反着选，冬天飞的久\n解析：冬天飞行时间长。冬天大气密度大，气压高，飞机升力大，在相同动力下飞行阻力相对小一些，所以飞行时间变长。而夏天大气密度小，气压低，飞行时间相对缩短","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0356","type":"single","difficulty":1,"stem":"校准地图时选取的校准点（）。","options":[{"key":"A","text":"不能在同一直线上"},{"key":"B","text":"不能在同一纬度上"},{"key":"C","text":"不能在同一经度上"}],"answer":"A","analysis":"提示：不在同一直线上\n解析：校准地图时选取的校准点不能在同一直线上，因为如果在同一直线上，无法准确确定平面坐标的转换参数","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0357","type":"single","difficulty":1,"stem":"以下任务规划流程，正确的是（）。","options":[{"key":"A","text":"接收任务-任务理解-环境评估-任务分配-航迹规划-航迹优化-生成计划"},{"key":"B","text":"接收任务-任务理解-任务分配-环境评估-航迹规划-航迹优化-生成计划"},{"key":"C","text":"接收任务-任务理解-任务分配-航迹规划-环境评估-航迹优化-生成计划"}],"answer":"A","analysis":"提示：任务理解→环境评估\n解析：本题考察的是“理解任务”之后“下一步”是什么.辅助操作人员进行任务理解之后,要分析任务执行的地理区域、时间区间, 任务所包含的目标航点数,各个航点的位置、重要程度等情况。根据任务涉及的区域查询并显示地形概况、禁飞区和障碍物分布情况及气象信息,为航迹规划提供环境情况依据。 以上整个过程就是“环境评估”。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0358","type":"single","difficulty":1,"stem":"应急航线的主要目的是确保飞机安全返航，规划一条安全返航通道和（），以及（）。","options":[{"key":"A","text":"安全着陆点，安全着陆策略"},{"key":"B","text":"应急迫降点，航线转移策略"},{"key":"C","text":"应急迫降点，安全返航策略"}],"answer":"B","analysis":"提示：安全返航不带安全\n解析：应急航线的主要目的是确保飞机安全返航规划一条安全返航通道和应急迫降点。以及航线转移策略。应急迫降点用于在紧急情况下飞机无法返回基地时的迫降，航线转移策略则是在出现意外情况时如何调整儼自航线以确保安全，","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0359","type":"single","difficulty":1,"stem":"由于加载的电子地图与实际操作时的地理位置信息有偏差，需要在使用前对地图进行（）。","options":[{"key":"A","text":"标注"},{"key":"B","text":"更新"},{"key":"C","text":"校准"}],"answer":"C","analysis":"提示：偏差校准\n解析：由于加载的电子地图与实际操作时的地理位置信息有偏差，需要在使用前对地图进行校准。通过校准可以使电子地图与实际地理位置更加准确地对应，提高导航和任务规划的准确性，","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0360","type":"single","difficulty":1,"stem":"在飞行任务书中，应当明确（）。","options":[{"key":"A","text":"飞行任务、起飞时间、航线、高度、允许机长飞行的最低气象条件以及其他有关事项"},{"key":"B","text":"飞行任务、机组成员、起飞时间、航线、高度、允许机长飞行的最低气象条件以及其他有关事项"},{"key":"C","text":"飞行任务、起飞时间、航线、允许机长飞行的最低气象条件以及其他有关事项"}],"answer":"A","analysis":"提示：有高度无机组成员\n解析：根据2001年颁布，至今仍有效的《中华人民共和国飞行基本规则》第67条明确说明：在飞行任务书中，应当明确飞行任务、起飞时间、航线、高度、允许机长飞行的最低气象条件以及其他有关事项。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0361","type":"single","difficulty":1,"stem":"一般来说，油动民用无人机与电动民用无人机在冬天飞行（）。","options":[{"key":"A","text":"油动航时比夏天长、电动航时比夏天短"},{"key":"B","text":"油动航时比夏天短、电动航时比夏天长"},{"key":"C","text":"油动航时比夏天长、电动航时也比夏天长"}],"answer":"A","analysis":"提示：油动冬天长，电动夏天长\n解析：油动无人机冬季航时更长：低温环境下，空气密度更高，燃油燃烧时能获得更多氧气，燃烧效率提升；发动机在低温下散热更快，不易因过热导致功率下降，动力输出更稳定，间接延长了有效航时。电动无人机冬季航时更短：核心限制来自锂电池，低温会显著降低其活性，导致充放电效率下降，实际可用容量减少；电池在低温下内阻增大，能量损耗加快，即使满电，也难以支撑与夏季相同的飞行时长。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0362","type":"single","difficulty":1,"stem":"哪种对地拍摄或成像的无人机任务设备基本不会受到云层与雾霾的影响?","options":[{"key":"A","text":"合成孔径雷达"},{"key":"B","text":"可见光CCD"},{"key":"C","text":"红外摄像机"}],"answer":"A","analysis":"提示：雷达√\n解析：合成孔径雷达使用微波进行主动探测，具有较强的穿云、穿雾和抗雾霾能力，基本不受云层和雾霾影响。√ 可见光 CCD 容易被云雾和霾遮挡；×红外摄像机虽然受光照影响较小，但仍会受到云层、雾霾和水汽衰减的影响。×","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0363","type":"single","difficulty":1,"stem":"以下旋翼数量不属于多旋翼无人机的是哪个?","options":[{"key":"A","text":"两个"},{"key":"B","text":"三个"},{"key":"C","text":"四个"}],"answer":"A","analysis":"提示：选错的。两个×\n解析：两个旋翼的不属于多旋翼无人机，多旋翼无人机通常有三个及以上桨叶。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0364","type":"single","difficulty":1,"stem":"6S4P12000mAh3C锂电池最大电流是多少?","options":[{"key":"A","text":"36A"},{"key":"B","text":"3.6A"},{"key":"C","text":"360A"}],"answer":"A","analysis":"提示：6S4P一共的电流是12A，3C放点后最大电流12*3=36\n解析：在理想情况下，如果按照3C的放电倍率来计算 ，6S4P12000mAh电池的最大放电电流应为:12000mAhx3C=36000mA= 36A","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0365","type":"single","difficulty":1,"stem":"KV1000的无刷电机搭配11.1V电池，空载转速是（）。","options":[{"key":"A","text":"1110转/分"},{"key":"B","text":"1110转/秒"},{"key":"C","text":"11100转/分"}],"answer":"C","analysis":"提示：1000x11.1\n解析：空载转速=KV值x电池电压=1000x11.1=11100转/分。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0366","type":"single","difficulty":1,"stem":"八轴飞行器安装有（）。","options":[{"key":"A","text":"8个顺时针旋转螺旋桨"},{"key":"B","text":"2个顺时针旋转螺旋桨，6个逆时针旋转螺旋桨"},{"key":"C","text":"4个顺时针旋转螺旋桨，4个逆时针旋转螺旋桨"}],"answer":"C","analysis":"提示：44平衡\n解析：八轴飞行器八轴飞行器由于其多轴设计，安装有4个顺时针旋转螺旋桨，4个逆时针旋转螺旋桨。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0367","type":"single","difficulty":1,"stem":"八轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是（）电机。","options":[{"key":"A","text":"对角"},{"key":"B","text":"俯视顺时针方向下一个"},{"key":"C","text":"俯视逆时针方向下一个"}],"answer":"A","analysis":"提示：对角停\n解析：一个电机故障会造成升力分布不对称并产生倾覆力矩。停止其对角电机，可使升力损失关于飞行器重心对称，减小横滚和俯仰失衡；再由其余正常电机增速补偿总升力，以维持飞行并实施紧急降落。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0368","type":"single","difficulty":1,"stem":"标有60A的电调中，选用多大的电池合适？","options":[{"key":"A","text":"大于60A"},{"key":"B","text":"等于60A"},{"key":"C","text":"小于60A"}],"answer":"A","analysis":"提示：电池电调5-30/10-50/＞60\n解析：核心逻辑：电源能给的> 控制器能扛的 > 负载峰值要的 ≥ 负载平时用的 电源最大放电电流>电调＞3-5倍稳定电流≥动力电池持续输出电流知识点1：电池放电能力需大于电调额定电流电池的最大放电能力，必须大于电调的额定电流，否则会出现 “电池拖不动电调” 的情况。电调的额定电流，是它能从电池中 “抽取” 的最大持续电流；而电池的最大持续放电电流，必须大于电调的额定电流，才能保证有这么多的稳定电流可被抽取，否则会出现两个严重问题：①电池无法提供足够电流，导致动力不足、电压骤降，飞行器失控。②电池长期超负荷放电，会过热、鼓包甚至起火，存在严重安全隐患。因此，如电调标有60A，必须选用大于60A（最大放电能力）的电池，才能带来持续稳定的与电调电机相匹配的电流。--------------------------------------------本题与另一提知识点容易混淆，做个区分--------------------------------------------知识点2：电调额定电流的安全冗余设计电调的额定持续电流，必须大于飞行器的最大可能工作电流（含稳定飞行 + 突发工况的峰值），且必须预留充足安全冗余。因为实际飞行中，飞行器会遇到机动飞行、大风、负载变化等情况，电流会瞬间大幅超过悬停 / 稳定飞行的电流（通常可达悬停电流的 2~4 倍甚至更高）。因此，如电机持续输出电流为5A/10A ，选用的电调要比电机高3-5倍的裕度，也就是15-25/30-50A。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0369","type":"single","difficulty":1,"stem":"部分多旋翼飞行器螺旋桨根部标有CCW字样，其意义为（）？","options":[{"key":"A","text":"此螺旋桨由CCW公司生产"},{"key":"B","text":"此螺旋桨为顶视顺时针旋转"},{"key":"C","text":"此螺旋桨为顶视逆时针旋转"}],"answer":"C","analysis":"提示：CW顺 CCW逆\n解析：CCW = Counter Clockwise中文翻译：反着顺时针 = 逆时针","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0370","type":"single","difficulty":1,"stem":"常规的电子调速器上，中等粗细的几根线是用来连接（）的。","options":[{"key":"A","text":"自驾仪或遥控接收机"},{"key":"B","text":"电池"},{"key":"C","text":"电机"}],"answer":"C","analysis":"提示：粗电池，中电机，细电调，杜邦飞控\n解析：常规电子调速器上中等粗细的线是用来连接电机的。这些线负责传输控制信号和电力，以驱动和调整电机的转速。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0371","type":"single","difficulty":1,"stem":"地线根据绞层数，断股数达到（绞层数-1)时(单层除外)，属于（）。","options":[{"key":"A","text":"其他缺陷"},{"key":"B","text":"一般缺陷"},{"key":"C","text":"重大缺陷"}],"answer":"C","analysis":"提示：一个括号选一般 两个括号选重大\n解析：根据《输电设备缺陷定级标准》底线跟据绞层数，断股数达到(绞层数-1)时(单层除外)，属于重大缺陷。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0372","type":"single","difficulty":1,"stem":"电调的作用不包括哪些?","options":[{"key":"A","text":"改变电机转速"},{"key":"B","text":"直流电变交流电"},{"key":"C","text":"改变电流大小"}],"answer":"C","analysis":"提示：电调不改电流大小\n解析：电调，即电子调速器，简称ESC，主要用于调节电动机的转速。电调的作用不包括直接改变电流大小。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0373","type":"single","difficulty":1,"stem":"电调上最粗的红线和黑线用来连接（）。","options":[{"key":"A","text":"动力电池"},{"key":"B","text":"电动机"},{"key":"C","text":"机载遥控接收机"}],"answer":"A","analysis":"提示：粗电池，中电机，细电调，杜邦飞控\n解析：电调上最粗的红线和黑线用来连接动力电池。电调上的红线通常代表正极，黑线代表负极。最粗的红线和黑线是用来连接主要电源，即动力电池，以提供足够的电流来驱动电动机。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0374","type":"single","difficulty":1,"stem":"电调是多旋翼无人机最重要的部件之一，不属于飞行器电调功能的是（）。","options":[{"key":"A","text":"变压供电"},{"key":"B","text":"调节电机转速"},{"key":"C","text":"实现电机反转"}],"answer":"C","analysis":"提示：选错的。反转不是功能，不改变电流大小\n解析：电调的四个主要功能为：直流变交流、给电机变压供电、调节电机转速与扭矩、接收和反馈控制信号。以上都是电调的主动功能。虽然调换电调连接电机3跟线中的两个能实现电机反转，但这是被动的连接效果，并不是电调有主动的 “反转控制” 功能，电调本身没有专门的控制模块或者信号来主动让电机反转，所以不属于电调的功能。本题记忆关键字：反转不是功能。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0375","type":"single","difficulty":1,"stem":"电子调速器英文缩写是（）。","options":[{"key":"A","text":"BEC"},{"key":"B","text":"ESC"},{"key":"C","text":"MCS"}],"answer":"B","analysis":"提示：电子E\n解析：电调，即电子调速器(Electronic SpeedControl，简称ESC)，主要用于调节电动机的转速。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0376","type":"single","difficulty":1,"stem":"对于多旋翼飞行器，（）。","options":[{"key":"A","text":"旋翼只起升力面的作用"},{"key":"B","text":"旋翼只充当纵横向和航向的操纵面"},{"key":"C","text":"旋翼既是升力面又是纵横向和航向的操纵面"}],"answer":"C","analysis":"提示：即又\n解析：多旋翼的旋翼既产生升力，又通过分别改变各旋翼的转速产生操纵力矩：差动调速控制横滚；差动调速控制俯仰；改变旋向相反旋翼的转速差控制偏航。因此，旋翼同时是升力面和纵向、横向、航向的操纵面。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0377","type":"single","difficulty":1,"stem":"对于多旋翼飞行器动力电源充电，以下哪种充电方法是错误的?","options":[{"key":"A","text":"聚合物锂电池单体充至4.6V满电"},{"key":"B","text":"聚合物锂电池单体充至4.2V满电"},{"key":"C","text":"磷酸铁锂电池单体充至3.6V满电"}],"answer":"A","analysis":"提示：选错的。4.6V错\n解析：聚合物锂电池的标称电压通常为3.7V，在充电过程中，其电压会逐渐上升，但一般充电至4.2V左右即达到满电状态。如果继续充电至4.6V，可能会超出电池的安全充电电压范围，导致电池内部压力过大，从而引发电池鼓胀、漏液甚至爆炸等安全问题。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0378","type":"single","difficulty":1,"stem":"对于混合燃油发动机，冬天的燃油机油混合比针对夏天应如何调整?","options":[{"key":"A","text":"燃油机油混合比适量减小"},{"key":"B","text":"燃油机油混合比适量增大"},{"key":"C","text":"燃油机油混合比不变"}],"answer":"B","analysis":"提示：冬天混比增大\n解析：本题考察的原理来自二冲程发动机。二冲程发动机混合油比例通常以燃油与机油的体积比表示。常见的基础比例范围为25:1至50:1。夏季高温时，机油容易变稀，配比可以适当浓一点，推荐25:1。（机油占比 4% 机油多）冬季低温时，机油流动性变差，配比可调整至40:1。（机油占比 2.5% 机油少）问题拆解：冬天的燃油机油混合比针对夏天应如何调整?（问的是到了冬天如何调整，不是夏天）冬天应该燃油多，机油少→燃油机油比变大（冬40:1＞夏25:1）A.燃油机油混合比适量减小（燃油少 机油多 ×）B.燃油机油混合比适量增大（燃油多 机油少 √）C.燃油机油混合比不变（不变 肯定×）","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0379","type":"single","difficulty":1,"stem":"多旋翼飞行器的旋翼旋转方向一般为（）。","options":[{"key":"A","text":"俯视多旋翼飞行器顺时针旋翼"},{"key":"B","text":"俯视顺时针/逆时针旋翼相对排布"},{"key":"C","text":"俯视顺时针/逆时针旋翼依次相邻排布"}],"answer":"C","analysis":"提示：依次相邻排布\n解析：多旋翼飞行器的旋翼旋转方向一般为俯视顺时针/逆时针旋翼依次相邻排布。这种排布方式有助于保持飞行器的稳定性和控制性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0380","type":"single","difficulty":1,"stem":"多旋翼飞行器，电调和电机一般通过3根单色线连接，如任意调换其中2根与电机的连接顺序，会出现（）。","options":[{"key":"A","text":"该电机停转"},{"key":"B","text":"该电机出现过热并烧毁"},{"key":"C","text":"该电机反向运转"}],"answer":"C","analysis":"提示：32反转\n解析：无刷电机的三根动力线对应三相绕组。任意调换其中两根线，会改变电机的换相顺序和旋转方向，因此电机通常会反向运转。调换三根线中的任意两根，方向都会反转；若要恢复原方向，再交换任意两根即可。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0381","type":"single","difficulty":1,"stem":"多旋翼飞行器GPS定位中，最少达到几颗星，才能够在飞行中保证基本的安全?","options":[{"key":"A","text":"2-3颗"},{"key":"B","text":"4-5颗"},{"key":"C","text":"6-7颗"}],"answer":"B","analysis":"提示：4-5颗\n解析：GPS 定位的底层逻辑是 “三角测距定位法”，4 颗卫星是实现三维定位（经纬度 + 海拔高度）的最低门槛。其中3 颗卫星用来确定平面位置，第 4 颗卫星用来校准时间误差并计算高度，满足无人机基本的定位和悬停需求。所以至少4颗，选4-5颗。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0382","type":"single","difficulty":1,"stem":"多旋翼飞行器常用螺旋桨的剖面形状是（）。","options":[{"key":"A","text":"对称型"},{"key":"B","text":"凹凸型"},{"key":"C","text":"S型"}],"answer":"B","analysis":"提示：凹凸\n解析：多旋翼常用螺旋桨的桨叶通常采用具有一定弯度的凹凸型剖面，并非上下对称。桨叶旋转时，这种凹凸型剖面有利于使气流偏转，并形成产生拉力所需的压力分布，","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0383","type":"single","difficulty":1,"stem":"多旋翼飞行器的飞控硬件尽量安装在（）。","options":[{"key":"A","text":"飞行器前部"},{"key":"B","text":"飞行器底部"},{"key":"C","text":"飞行器中心"}],"answer":"C","analysis":"提示：电池在上，飞控中间\n解析：将飞控硬件安装在飞行器中心有助于保持飞行器的稳定性。当飞控硬件安装在飞行器中心，即质心处时，线加速度计测量的准确锃最高。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0384","type":"single","difficulty":1,"stem":"多旋翼飞行器的螺旋桨（）。","options":[{"key":"A","text":"桨根处迎角小于桨尖处迎角"},{"key":"B","text":"桨根处迎角大于桨尖处迎角"},{"key":"C","text":"桨根处迎角等于桨尖处迎角"}],"answer":"B","analysis":"提示：根角大于桨尖 根速小于桨尖\n解析：螺旋桨旋转时，桨尖线速度大于桨根。为使桨叶各处产生较合理、均匀的拉力，桨叶通常采用扭转设计，使桨根处安装角和迎角较大，桨尖处较小。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0385","type":"single","difficulty":1,"stem":"多旋翼飞行器的螺旋桨（）。","options":[{"key":"A","text":"桨根处线速度小于桨尖处线速度"},{"key":"B","text":"桨根处线速度大于桨尖处线速度"},{"key":"C","text":"桨根处线速度等于桨尖处线速度"}],"answer":"A","analysis":"提示：根角大于桨尖 根速小于桨尖\n解析：多旋翼飞行器的螺旋桨桨根处迎角大于桨尖桨根处线速度小于桨尖处线速度处迎角，主桨根处升力系数大于桨尖处升力系数。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0386","type":"single","difficulty":1,"stem":"多旋翼飞行器的螺旋桨（）。","options":[{"key":"A","text":"桨根处升力系数小于桨尖处升力系数"},{"key":"B","text":"桨根处升力系数大于桨尖处升力系数"},{"key":"C","text":"桨根处升力系数等于桨尖处升力系数"}],"answer":"B","analysis":"提示：根升大于桨尖\n解析：多旋翼飞行器的螺旋桨桨根处迎角大于桨尖处迎角，桨根处线速度小于桨尖处线速度桨根处升力系数大于桨尖处升力系数。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0387","type":"single","difficulty":1,"stem":"多旋翼飞行器的旋翼旋转方向一般为（）。","options":[{"key":"A","text":"俯视多轴飞行器顺时针旋翼"},{"key":"B","text":"俯视多轴飞行器逆时针旋翼"},{"key":"C","text":"俯视多轴飞行器两两对应"}],"answer":"C","analysis":"提示：两两对应\n解析：多旋翼飞行器的旋翼旋转方向一般为两两对应，相邻旋翼反向旋转，以确保飞行器的稳定性和控制性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0388","type":"single","difficulty":1,"stem":"多旋翼飞行器动力电池充电尽量选用（）。","options":[{"key":"A","text":"便携充电器"},{"key":"B","text":"快速充电器"},{"key":"C","text":"平衡充电器"}],"answer":"C","analysis":"提示：平衡充电器\n解析：多旋翼动力电池通常由多节电芯串联组成。平衡充电器能监测并调整各节电芯的电压，避免某一节先充满后继续过充，有利于电池安全和寿命。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0389","type":"single","difficulty":1,"stem":"多旋翼飞行器动力系统主要使用（）。","options":[{"key":"A","text":"无刷电机"},{"key":"B","text":"有刷电机"},{"key":"C","text":"四冲程发动机"}],"answer":"A","analysis":"提示：外转无刷\n解析：多旋翼飞行器动力系统主要使用无刷电机。无刷电机广泛应用于多旋翼飞行器、无人机和遥控飞机等模型领域。相比于有刷电机无刷电机具有高效、寿命长、噪音小和不易受干扰的优点。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0390","type":"single","difficulty":1,"stem":"多旋翼飞行器动力系统主要使用（）。","options":[{"key":"A","text":"步进电机"},{"key":"B","text":"内转子电机"},{"key":"C","text":"外转子电机"}],"answer":"C","analysis":"提示：外传无刷\n解析：外转子电机是无刷电机的一种。外转子电机的主要特点是转子在外部，定子在内部。多旋翼飞行器动力系统主要使用外转子电机。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0391","type":"single","difficulty":1,"stem":"多旋翼飞行器动力装置多为电动系统的最主要原因是（）。","options":[{"key":"A","text":"电动系统尺寸较小且较为廉价"},{"key":"B","text":"电动系统形式简单且电机速度响应快"},{"key":"C","text":"电动系统干净且不依赖传统生物燃料"}],"answer":"B","analysis":"提示：电动响应快\n解析：多旋翼飞行器动力装置多为电动系统的最主要原因是电动系统形式简单且电机速度响应快。电动系统的组成相对简单，主要包括电池、电机和控制器等组件。电动系统中的电机，特别是无刷直流电机，具有极高的速度响应能力。电动系统通常具有较高的能量转换效率，能够将电池中的电能更高效地转化为机械能。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0392","type":"single","difficulty":1,"stem":"多旋翼飞行器飞控计算机的功能不包括（）。","options":[{"key":"A","text":"稳定飞行器姿态"},{"key":"B","text":"接收地面控制信号"},{"key":"C","text":"导航"}],"answer":"B","analysis":"提示：飞控不接受信号\n解析：飞行控制系统简称飞控，可以看作飞行器的大脑。多旋翼飞行器的飞行、悬停，姿态变化等等都是由多种传感器将飞行器本身的姿态数据传回飞控，再由飞控通过运算和判断下达指令，由执行机构完成动作和飞行姿态调整。飞控系统主要用于飞行姿态控制和导航，不包含接收地面控制信号。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0393","type":"single","difficulty":1,"stem":"多旋翼飞行器控制电机转速的直接设备为（）。","options":[{"key":"A","text":"电源"},{"key":"B","text":"电调"},{"key":"C","text":"飞控"}],"answer":"B","analysis":"提示：飞控控电调，电调控电机\n解析：电调（ESC）是控制电机转速的直接设备。其基本关系是：飞控发出转速控制信号 → 电调调节输出电流或驱动频率 → 电机改变转速。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0394","type":"single","difficulty":1,"stem":"多旋翼飞行器螺旋桨从结构上说，更接近于（）。","options":[{"key":"A","text":"风力发电机叶片"},{"key":"B","text":"直升机旋翼"},{"key":"C","text":"固定翼飞机螺旋桨"}],"answer":"C","analysis":"提示：问题对答案，螺旋桨对螺旋桨\n解析：多旋翼螺旋桨结构： 桨叶+桨毂 √风力发电机叶片结构： 叶片 + 轮毂法兰刚性连接直升机旋翼结构：桨叶+桨毂+水平铰、垂直铰、轴向铰等固定翼飞机螺旋桨结构： 桨叶+桨毂 √","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0395","type":"single","difficulty":1,"stem":"多旋翼飞行器每个“轴”上，一般连接（）。","options":[{"key":"A","text":"1个电调，1个电机"},{"key":"B","text":"2个电调，1个电机"},{"key":"C","text":"1个电调，2个电机"}],"answer":"A","analysis":"提示：1轴1机1电调\n解析：多旋翼的每个 “轴” 是一个独立的动力输出单元，电调是单独控制电机的设备，一个电调只能对应控制一个电机，所以每个轴上会搭配 1 个电调 + 1 个电机，以此保证每个轴的动力都可以被独立、精准的控制，进而实现无人机的姿态调整。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0396","type":"single","difficulty":1,"stem":"多旋翼飞行器上的电信号传播顺序一般为（）。","options":[{"key":"A","text":"飞控-机载遥控接收机-电机-电调"},{"key":"B","text":"机载遥控接收机-飞控-电调-电机"},{"key":"C","text":"飞控-电调-机载遥控接收机-电机"}],"answer":"B","analysis":"提示：机飞电电\n解析：信号接收机（机载接收机）接入飞控输入端口 → 飞控运算后输出信号至 ESC 电调 → 电调驱动无刷电机","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0397","type":"single","difficulty":1,"stem":"多旋翼飞行器上的链路天线应尽量（）飞控和GPS天线安装。","options":[{"key":"A","text":"贴合"},{"key":"B","text":"靠近"},{"key":"C","text":"远离"}],"answer":"C","analysis":"提示：远离，因为互干扰\n解析：多旋翼飞行器上的链路天线应尽量远离飞控和GPS天线安装。因为链路天线与其他天线的电磁干扰可能会影响信号质量，从而影响飞行器的稳定性和通信效果。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0398","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的电调通常被划分为（）。","options":[{"key":"A","text":"有刷电调和无刷电调"},{"key":"B","text":"直流电调和交流电调"},{"key":"C","text":"有极电调和无极电调"}],"answer":"A","analysis":"提示：电调有刷无刷\n解析：多旋翼飞行器电调分为有刷和无刷电调。无刷电调因效率高、寿命长而更常用，满足高性能需求。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0399","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的电调一般为（）。","options":[{"key":"A","text":"双向电调"},{"key":"B","text":"有刷电调"},{"key":"C","text":"无刷电调"}],"answer":"C","analysis":"提示：外转无刷\n解析：多旋翼通常使用无刷电机，配套使用无刷电调。无刷电调把电池提供的直流电转换为按顺序变化的多相电流，驱动无刷电机并调节其转速。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0400","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的动力电池一般为（）。","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"铅酸电池"},{"key":"C","text":"银锌电池"}],"answer":"A","analysis":"提示：锂电池\n解析：多旋翼飞行器使用的动力电池一般为锂聚合物电池(Li-po)。锂聚合物电池作为锂离子电池的一种变种，具有更高的能量密度和更轻的重量，非常适合用于多旋翼飞行器等需要高性能电池的应用场景。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0401","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的锂聚合物动力电池，其单体标称电压为（）。","options":[{"key":"A","text":"4.2V"},{"key":"B","text":"11.1V"},{"key":"C","text":"3.7V"}],"answer":"C","analysis":"提示：标称3.7\n解析：锂聚合物电池单体标称电压是3.7V。1.2V一般是镍氢电池等的标称电压，11.1V通常是由3个3.7V的锂聚合物电池串联后的电压。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0402","type":"single","difficulty":1,"stem":"多旋翼飞行器中的GPS天线应尽量安装在（）。","options":[{"key":"A","text":"飞行器顶部"},{"key":"B","text":"飞行器中心"},{"key":"C","text":"飞行器尾部"}],"answer":"A","analysis":"提示：GPS装顶部 （电池在上面，飞控在中间）\n解析：多旋翼飞行器中的GPS天线应尽量安装在飞行器顶部，以便获得更开阔的视野，减少信号遮挡，从而提高GPS信号的接收质量和稳定性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0403","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行时地面人员手里拿的“控”指的是（）。","options":[{"key":"A","text":"地面遥控发射机"},{"key":"B","text":"导航飞控系统"},{"key":"C","text":"链路系统"}],"answer":"A","analysis":"提示：人拿遥控\n解析：地面遥控发射机是地面操作人员用来控制多轴飞行器飞行状态的关键设备，通过发射无线电信号与飞行器上的接收机通信，实现对飞行器的远程操控。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0404","type":"single","difficulty":1,"stem":"多旋翼无人机，电调上较细的白红黑3色排线，也叫杜邦线，用来连接（）。","options":[{"key":"A","text":"电机"},{"key":"B","text":"机载遥控接收机"},{"key":"C","text":"飞控"}],"answer":"C","analysis":"提示：粗电池，中电机，细电调，杜邦飞控\n解析：在无人机中，电调上的白、红、黑细线通常用杜邦类插针连接器接到飞控，用于传输控制信号和提供低压电源。它与美国杜邦公司开发的插接端子体系有关，所以得名“杜邦线”。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0405","type":"single","difficulty":1,"stem":"关于多旋翼使用的无刷电调和有刷电调，说法正确的是（）。","options":[{"key":"A","text":"无刷电调驱动直流电机，无法调速"},{"key":"B","text":"三相交流电机通过交流电调将电池直流变为交流作为电机输入"},{"key":"C","text":"有刷电调便于调速和驱动交流电机"}],"answer":"B","analysis":"提示：三相\n解析：无刷电调用于驱动无刷电机(三相交流电机)，它可以调速。有刷电调用于驱动有刷电机，有刷电机是直流电机。三相交流电机需要通过无刷电调将电池直流电转换为交流电来驱动。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0406","type":"single","difficulty":1,"stem":"关于多旋翼飞行器机桨与电机匹配描述错误的是（）。","options":[{"key":"A","text":"3S电池下，KV900-1000的电机匹配1060或1047桨"},{"key":"B","text":"3S电池下，KV1200-1400的电机匹配3寸桨"},{"key":"C","text":"2S电池下，KV1300-1500的电机匹配9050桨"}],"answer":"B","analysis":"提示：3寸\n解析：KV 值：电机每 1V 电压空载每分钟转多少圈，KV 越高转速越快。螺旋桨：桨越大、桨叶越长，转动时阻力越大、能产生的拉力越大，但难带动、转速上不去。电机转速≈KV×电压搭配原理：同电压下，大螺旋桨搭配低KV,小螺旋桨搭配高KV实际搭配：航拍与巡检：追求力效比、续航与静音。多采用400-900KV 低 KV 电机 + 6S 高压电池，搭配15-22 英寸大直径桨。大桨低速可搅动更大体积空气，以低转速获得大推力，同时降低桨叶尖啸噪音。竞速与穿越：强调爆发力、转速响应。多采用1600-2800KV 高 KV 电机 + 4S-6S 电池，主流搭配5-7 英寸两叶 / 三叶桨。小直径桨转动惯量小，配合中高螺距，能实现极速升降速、油门跟手。3S电池：KV900-1000的电机配10寸桨 合理√（例：好盈 XRotor 3115）3S电池：KV1200-1400的电机配3寸桨 不合理×2S电池：KV1300-1500的电机配9寸桨 合理√ （例：华科尔 420）","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0407","type":"single","difficulty":1,"stem":"关于多旋翼飞行器机桨与电机匹配描述正确的是（）。","options":[{"key":"A","text":"大螺旋桨要用低KV电机"},{"key":"B","text":"大螺旋桨要用高KV电机"},{"key":"C","text":"小螺旋桨要用低KV电机"}],"answer":"A","analysis":"提示：大螺旋桨低 KV\n解析：大螺旋桨由于其较大的面积和重量，需要更大的扭力来驱动。因此，选择低KV值的电机更为合适，因为低KV值电机在相同电压下转速较低，但扭力较大，能够更好地匹配大螺旋桨的需求。KV值是每V电压下电机空载下可以达到的转速，单位是rpmV。在相同的电机结构和尺寸下，不同的KV值表示电机绕组的匝数不同。绕线匝数多的电机，KV值低，但扭力大;绕线匝数少的电机，KV值高，但扭力小。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0408","type":"single","difficulty":1,"stem":"关于多旋翼飞行器使用的动力电机KV值描述正确的是（）。","options":[{"key":"A","text":"外加1V电压对应的每分钟负载转速"},{"key":"B","text":"外加1V电压对应的每分钟空转转速"},{"key":"C","text":"额定电压值时电机每分钟空转转速"}],"answer":"B","analysis":"提示：外加 1v空转转速\n解析：KV值是电机的一个重要参数，它代表了电机在空载状态下，每增加1V电压时转速增加的值。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0409","type":"single","difficulty":1,"stem":"关于多旋翼使用的无刷电机与有刷电机，说法正确的","options":[{"key":"A","text":"有刷电调驱动交流电机"},{"key":"B","text":"无刷电调驱动交流电机"},{"key":"C","text":"无刷电调驱动直流电机"}],"answer":"B","analysis":"提示：有刷直流 无刷交流\n解析：有刷电机通过电刷和换向器切换绕组电流；无刷电机没有电刷，由无刷电调根据转子位置依次给各相绕组供电，使电机持续旋转。无刷电调以电池直流电为输入，输出交变的多相电流，驱动三相无刷电机。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0410","type":"single","difficulty":1,"stem":"经测试，某多旋翼飞行器稳定飞行时，动力电池的持续输出电流为10安培，该多旋翼可以选用（）。","options":[{"key":"A","text":"50A的电调"},{"key":"B","text":"15A的电调"},{"key":"C","text":"10A的电调"}],"answer":"A","analysis":"提示：电池电调（5选30）（10选50）\n解析：核心逻辑：电源能给的> 控制器能扛的 > 负载峰值要的 ≥ 负载平时用的 电源最大放电电流>电调＞3-5倍稳定电流≥动力电池持续输出电流知识点1：电调额定电流的安全冗余设计电调的额定持续电流，必须大于飞行器的最大可能工作电流（含稳定飞行 + 突发工况的峰值），且必须预留充足安全冗余。因为实际飞行中，飞行器会遇到机动飞行、大风、负载变化等情况，电流会瞬间大幅超过悬停 / 稳定飞行的电流（通常可达悬停电流的 2~4 倍甚至更高）。因此，如电机持续输出电流为5A/10A ，选用的电调要比电机高3-5倍的裕度，也就是15-25/30-50A。--------------------------------------------本题与另一提知识点容易混淆，做个区分--------------------------------------------知识点2：电池放电能力需大于电调额定电流电池的最大放电能力，必须大于电调的额定电流，否则会出现 “电池拖不动电调” 的情况。电调的额定电流，是它能从电池中 “抽取” 的最大持续电流；而电池的最大持续放电电流，必须大于电调的额定电流，才能保证有这么多的稳定电流可被抽取，否则会出现两个严重问题：①电池无法提供足够电流，导致动力不足、电压骤降，飞行器失控。②电池长期超负荷放电，会过热、鼓包甚至起火，存在严重安全隐患。因此，如电调标有60A，必须选用大于60A（最大放电能力）的电池，才能带来持续稳定的与电调电机相匹配的电流。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0411","type":"single","difficulty":1,"stem":"经测试，某多旋翼飞行器稳定飞行时，动力电池的持续输出电流为5安培，该多旋翼可以选用（）。","options":[{"key":"A","text":"5A的电调"},{"key":"B","text":"10A的电调"},{"key":"C","text":"30A的电调"}],"answer":"C","analysis":"提示：电池电调（5选30）（10选50）\n解析：核心逻辑：电源能给的> 控制器能扛的 > 负载峰值要的 ≥ 负载平时用的 电源最大放电电流>电调＞3-5倍稳定电流≥动力电池持续输出电流知识点1：电调额定电流的安全冗余设计电调的额定持续电流，必须大于飞行器的最大可能工作电流（含稳定飞行 + 突发工况的峰值），且必须预留充足安全冗余。因为实际飞行中，飞行器会遇到机动飞行、大风、负载变化等情况，电流会瞬间大幅超过悬停 / 稳定飞行的电流（通常可达悬停电流的 2~4 倍甚至更高）。因此，如电机持续输出电流为5A/10A ，选用的电调要比电机高3-5倍的裕度，也就是15-25/30-50A。--------------------------------------------本题与另一提知识点容易混淆，做个区分--------------------------------------------知识点2：电池放电能力需大于电调额定电流电池的最大放电能力，必须大于电调的额定电流，否则会出现 “电池拖不动电调” 的情况。电调的额定电流，是它能从电池中 “抽取” 的最大持续电流；而电池的最大持续放电电流，必须大于电调的额定电流，才能保证有这么多的稳定电流可被抽取，否则会出现两个严重问题：①电池无法提供足够电流，导致动力不足、电压骤降，飞行器失控。②电池长期超负荷放电，会过热、鼓包甚至起火，存在严重安全隐患。因此，如电调标有60A，必须选用大于60A（最大放电能力）的电池，才能带来持续稳定的与电调电机相匹配的电流。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0412","type":"single","difficulty":1,"stem":"六轴飞行器安装有（）。","options":[{"key":"A","text":"6个顺时针旋转螺旋桨"},{"key":"B","text":"3个顺时针旋转螺旋桨，3个逆时针旋转螺旋桨"},{"key":"C","text":"4个顺时针旋转螺旋桨，2个逆时针旋转螺旋桨"}],"answer":"B","analysis":"提示：3顺3逆\n解析：六轴飞行器安装有3个顺时针旋转螺旋桨和3个逆时针旋转螺旋桨。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0413","type":"single","difficulty":1,"stem":"六轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是（）电机。","options":[{"key":"A","text":"俯视顺时针方向下一个"},{"key":"B","text":"对角"},{"key":"C","text":"俯视逆时针方向下一个"}],"answer":"B","analysis":"提示：对角停\n解析：六轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是对角电机。当其中一个电机发生故障时，为了保持飞行器的平衡和防止翻滚，与其对角位置的电机需要相应地调整其工作状态，以模拟故障电机的停止工作效果。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0414","type":"single","difficulty":1,"stem":"某多旋翼电调上标有“30A”字样，意思是指（）。","options":[{"key":"A","text":"电调所能承受的稳定工作电流是30安培"},{"key":"B","text":"电调所能承受的最大瞬间电流是30安培"},{"key":"C","text":"电调所能承受的最小工作电流是30安培"}],"answer":"B","analysis":"提示：考试选瞬时电流给分\n解析：虽然常规应该是持续最大电流，但是根据2个考场反馈，综合10题出现这题，考试选瞬时电流给分无人机电调（ESC）上最明显标注的电流通常是持续电流（持续安培数），通常以字母“A”表示，例如30A、40A等。此外，部分电调还会标注瞬时电流（峰值电流），通常以“X”或“XX”开头，例如X30A表示瞬时电流可达30A。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0415","type":"single","difficulty":1,"stem":"某多旋翼电调上有BEC 5V字样，意思是指（）。","options":[{"key":"A","text":"电调需要从较粗的红线与黑线输入5V的电压"},{"key":"B","text":"电调能从较粗的红线与黑线向外输出5V的电压"},{"key":"C","text":"电调能从较细的红线与黑线向外输出5V的电压"}],"answer":"C","analysis":"提示：细线红黑\n解析：动力电机的调速系统称为电调,全称为电子调速器。电调一般有电源输出功能(BEC),即在信号线的正负极之间有5V左右的电压输出,通过信号线为接收机及舵机供电。电调向外输出 5V 供电时，电流偏小、负载轻，直接使用红黑细导线接线即可，无需粗线。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0416","type":"single","difficulty":1,"stem":"某多旋翼电机标有1000KV字样，意义是指（）。","options":[{"key":"A","text":"对应每V电压，电机提供1000000转转速"},{"key":"B","text":"电机提供1000转转速对应每V电压，"},{"key":"C","text":"电机最大耐压1000KV"}],"answer":"B","analysis":"提示：1000KV等于1000转转速\n解析：-个电机的KV值为1000，那么当外加电压为1V时，该电机在空载状态下的转速将增加1000rpm(转/分钟)。需要注意的是这个转速是在空载条件下测得的，当电机实际带动螺旋桨等负载飞行时，其转速会受到负载大小的影响而有所降低。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0417","type":"single","difficulty":1,"stem":"某多旋翼电机标有2208字样，意思是指（）。","options":[{"key":"A","text":"该电机最大承受22V电压，最小承受8V电压"},{"key":"B","text":"该电机转子高度为22毫米"},{"key":"C","text":"该电机定子直径为22毫米"}],"answer":"C","analysis":"提示：22定子直径08定子轴向长度\n解析：无人机电机型号中，常见的 “XXYY” 格式，XX代表直径，YY代表高度，单位均为毫米。如 2208，前两位数字XX代表直径，后两位YY代表高度，因此2208 表示直径22 毫米，高度 8 毫米。（选题中有时候将定子与转子混在一起，不管是定子还是转子，看选项表述，XX代表直径，YY代表高度即为正确选项）","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0418","type":"single","difficulty":1,"stem":"某多旋翼电机标有3810字样，意思是指()。","options":[{"key":"A","text":"该电机最大承受38V电压，最小承受10V电压"},{"key":"B","text":"该电机定子直径为38毫米"},{"key":"C","text":"该电机定子高度为38毫米"}],"answer":"B","analysis":"提示：前两位直径，后两位高度\n解析：无人机电机型号中，常见的 “XXYY” 格式，XX代表直径，YY代表高度，单位均为毫米。如 3810，前两位数字XX代表直径，后两位YY代表高度，因此 3810 表示转子直径 38 毫米，高度 10 毫米。（选题中有时候将定子与转子混在一起，不管是定子还是转子，看选项表述，XX代表直径，YY代表高度即为正确选项）","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0419","type":"single","difficulty":1,"stem":"某多旋翼电机标有500KV字样，意义是指（）。","options":[{"key":"A","text":"对应每V电压，电机提供每小时500KV即50万转的转速"},{"key":"B","text":"电机最大耐压500KV"},{"key":"C","text":"对应每V电压，电机提供每分钟500转转速"}],"answer":"C","analysis":"提示：每伏电压 500转\n解析：一个电机的KV值为500，那么当外加电压为1V时，该电机在空载状态下的转速将增加500转/分钟(rpm)。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0420","type":"single","difficulty":1,"stem":"某多旋翼电机转速为3000转，是指（）。","options":[{"key":"A","text":"每分钟3000转"},{"key":"B","text":"每秒钟3000转"},{"key":"C","text":"每小时3000转"}],"answer":"A","analysis":"提示：3000转/分\n解析：转速”通常指的是电机每分钟旋转的圈数:也就是“转/分钟”(rpm)。某多轴电机转速为3000转，是指每分钟3000转。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0421","type":"single","difficulty":1,"stem":"某多旋翼动力电池标有3S2P字样，代表（）。","options":[{"key":"A","text":"电池由3S2P公司生产"},{"key":"B","text":"电池组先由2个单体串联，再将串联后的3组并联"},{"key":"C","text":"电池组先由3个单体串联，再将串联后的2组并联"}],"answer":"C","analysis":"提示：s串联 p并联\n解析：“S”代表串联(Series)。“P”代表并联(“3S2P”即表示电池组先由3个Parallel)单体串联，再将这样的串联组并联2组。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0422","type":"single","difficulty":1,"stem":"某多旋翼动力电池容量为10Ah，表示（）。","options":[{"key":"A","text":"理论上，以10mA电流放电，可放电1小时"},{"key":"B","text":"理论上，以10000mA电流放电，可放电1小时"},{"key":"C","text":"理论上，以10A电流放电，可放电10小时"}],"answer":"B","analysis":"提示：1Ah=1000mAh\n解析：理论放电时间可按下式计算：t=电池容量（Ah）/ 放电电流（A）以题干中 10A=10000mA 放电：t=电池容量（Ah）/ 放电电流（A）= 10Ah / 10A=1h","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0423","type":"single","difficulty":1,"stem":"某多旋翼动力电池容量为6000mAh，表示（）。","options":[{"key":"A","text":"理论上，以6A电流放电，可放电1小时"},{"key":"B","text":"理论上，以60A电流放电，可放电1小时"},{"key":"C","text":"理论上，以6000A电流放电，可放电1小时"}],"answer":"A","analysis":"提示：1A=1000mA\n解析：理论上，6000mAh的电池容量等于6Ah，以6A电流放电，可放电1小时。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0424","type":"single","difficulty":1,"stem":"某多旋翼飞行器动力电池标有11.1V，它是（）。","options":[{"key":"A","text":"6S锂电池"},{"key":"B","text":"11.1S锂电池"},{"key":"C","text":"3S锂电池"}],"answer":"C","analysis":"提示：电池 3.7-4.2，11.1/3.7=3\n解析：“S”通常用来表示电池串联的数量。对于锂聚合物电池，单个电芯的标称电压通常是3.7V。3S锂电池:表示3个电芯串联总电压为3.7Vx3=11.1V。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0425","type":"single","difficulty":1,"stem":"某多旋翼飞行器动力电池标有22.2V，是（）。","options":[{"key":"A","text":"6S锂电池"},{"key":"B","text":"22.2S锂电池"},{"key":"C","text":"3S锂电池"}],"answer":"A","analysis":"提示：22.2/3.7=6\n解析：单节锂聚合物电池的标称电压通常为3.7V22.2/3.7=6串联电流不变，电压叠加因此，22.2V表示由6节电芯串联组成，即6S锂电池。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0426","type":"single","difficulty":1,"stem":"某多旋翼飞行器螺旋桨标有“CW”字样表明该螺旋桨（）。","options":[{"key":"A","text":"俯视多轴飞行器顺时针旋翼"},{"key":"B","text":"俯视多轴飞行器逆时针旋翼"},{"key":"C","text":"该螺旋桨为“CW”牌"}],"answer":"A","analysis":"提示：CW顺 CCW逆\n解析：CW = Clockwise中文翻译：顺时针","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0427","type":"single","difficulty":1,"stem":"某多轴螺旋桨长254毫米，螺距114毫米，那么它的型号可表述为（）。","options":[{"key":"A","text":"2511"},{"key":"B","text":"1045"},{"key":"C","text":"254114"}],"answer":"B","analysis":"提示：1045 带螺距换算成英寸 英寸=毫米/25.4\n解析：英寸=毫米/25.4，桨径254毫米=10英寸，螺距114毫米≈4.5英寸，因此多轴螺旋桨长254毫米，螺距114毫米，那么他的型号可表述为1045。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0428","type":"single","difficulty":1,"stem":"某多轴螺旋桨长381毫米，螺距127毫米，那么它的型号可表述为（）。","options":[{"key":"A","text":"3812"},{"key":"B","text":"15x5"},{"key":"C","text":"38x12"}],"answer":"B","analysis":"提示：15x5 带螺距换算成英寸 英寸=毫米/25.4\n解析：英寸=毫米/25.4，桨径381毫米=15英寸，螺距127毫米=5英寸，因此多轴螺旋桨长381毫米，螺距127毫米，那么他的型号可表述为15x5。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0429","type":"single","difficulty":1,"stem":"某螺旋桨是正桨，是指（）。","options":[{"key":"A","text":"从多轴飞行器下方观察，该螺旋桨逆时针旋转"},{"key":"B","text":"从多轴飞行器上方观察，该螺旋桨顺时针旋转"},{"key":"C","text":"从多轴飞行器上方观察，该螺旋桨逆时针旋转"}],"answer":"C","analysis":"提示：上方观察，正逆反顺\n解析：当从多轴飞行器上方观察时，螺旋桨逆时针旋转，这样的螺旋桨被称为正桨。相反如果从同一视角观察，螺旋桨顺时针旋转，则被称为反桨。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0430","type":"single","difficulty":1,"stem":"目前多旋翼飞行器飞控市场上的APM飞控特点是（）。","options":[{"key":"A","text":"可以应用于各种特种飞行器"},{"key":"B","text":"基于Android开发"},{"key":"C","text":"配有地面站软件，代码开源"}],"answer":"C","analysis":"提示：没有便宜就选代码\n解析：APM（ArduPilot Mega）是开源自动驾驶仪项目，通常配套 Mission Planner 等地面站软件，可用于参数设置、任务规划、飞行监控和数据分析。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0431","type":"single","difficulty":1,"stem":"目前多旋翼飞行器飞控市场上的KK飞控具有的优点是（）。","options":[{"key":"A","text":"功能强大，可以实现全自主飞行"},{"key":"B","text":"价格便宜，硬件结构简单"},{"key":"C","text":"配有地面站软件，代码开源"}],"answer":"B","analysis":"提示：有便宜选便宜 没有便宜就选代码\n解析：KK飞控属于较早期、入门级的多旋翼飞控，主要用于基本姿态稳定和手动操纵，特点是成本较低、结构简单、设置方便。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0432","type":"single","difficulty":1,"stem":"目前多旋翼飞行器飞控市场上的MWC飞控特点是（）。","options":[{"key":"A","text":"可以应用于各种特种飞行器"},{"key":"B","text":"基于Android开发"},{"key":"C","text":"配有地面站软件，代码开源"}],"answer":"C","analysis":"提示：没有便宜就选代码\n解析：多旋翼飞行器飞控市场上的MWC飞控特点是配有地面站软件，代码开源。MWC飞控在多旋翼飞行器领域具有较高的灵活性和可定制性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0433","type":"single","difficulty":1,"stem":"目前多旋翼飞行器飞控市场上的DJINAZA飞控特点是（）。","options":[{"key":"A","text":"可以应用于各种特种飞行器"},{"key":"B","text":"稳定，商业软件，代码不开源"},{"key":"C","text":"配有地面站软件，代码开源"}],"answer":"B","analysis":"提示：大疆特殊，大疆稳定\n解析：DJINAZA飞控的特点是稳定，商业软件代码不开源。其作为商业软件，不开源但稳定可靠，适合多轴旋翼飞行器的飞行控制需求。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0434","type":"single","difficulty":1,"stem":"目前技术条件下，燃油发动机不适合作为多旋翼飞行器动力的原因，表述不正确的是（）。","options":[{"key":"A","text":"生物燃料能量密度低于锂电池"},{"key":"B","text":"调速时响应较慢，且出于安全性原因需要稳定转速工作"},{"key":"C","text":"尺寸，重量较大"}],"answer":"A","analysis":"提示：选错的。生物燃料\n解析：生物燃料与锂电池的能量密度比较并非决定燃油发动机是否适合的关键因素。更关键的是燃油发动机的尺寸、重量较大，且调速响应较慢，这些因素对多旋翼飞行器的性能有显著影响。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0435","type":"single","difficulty":1,"stem":"前三点固定翼降落最佳接地方式是（）。","options":[{"key":"A","text":"前机轮先着地"},{"key":"B","text":"后机轮先着地"},{"key":"C","text":"机轮同时着地"}],"answer":"B","analysis":"提示：三点着陆，后轮先\n解析：前三点固定翼降落最佳接地方式是后机轮先着地。大多数固定翼飞机采用前三点式设计，即飞机重心在主轮之前，两个主轮位于飞机后部。在降落时，后部的主轮先接触地面，能够更有效地吸收垂直载荷并起到减震作用，从而保证飞机降落的稳定性和安全性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0436","type":"single","difficulty":1,"stem":"轻型微型无人机常用定距螺旋桨，尺寸通常用X*Y来表示，其中Y代表（）。","options":[{"key":"A","text":"螺距"},{"key":"B","text":"叶片数量"},{"key":"C","text":"桨径（螺旋桨直径）"}],"answer":"A","analysis":"提示：X桨径 Y螺距\n解析：轻型、微型无人机常用定距螺旋桨,尺寸通常用X×Y来表示,其中X代表螺旋桨直径,单位为英寸(in), Y代表螺距,即螺旋桨在空气中旋转一圈桨平面经过的距离,单位为英寸(in)。例如,22×10的螺旋桨尺寸为: 桨径22in,约为 55.88cm, 螺距10in,约为25.4cm。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0437","type":"single","difficulty":1,"stem":"请选出以下哪一只螺旋桨升力最大?","options":[{"key":"A","text":"18x7(两叶螺旋桨)"},{"key":"B","text":"16x4.5(三叶螺旋桨)"},{"key":"C","text":"15x4(四叶螺旋桨)"}],"answer":"A","analysis":"提示：前桨径后螺距 18x7两个数据都完胜\n解析：桨径和螺距越大，螺旋桨的升力越大。18x7(两叶螺旋桨):桨径为18英寸，螺距为7英寸。16x4.5(三叶螺旋桨):桨径为16英寸，螺距为4.5英寸。15x4(四叶螺旋桨):桨径为15英寸，螺距为4英寸。可以看出，18x7的两叶螺旋桨具有最大的桨径和螺距，因此它产生的升力将是最大的。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0438","type":"single","difficulty":1,"stem":"如不考虑结构、尺寸、安全性等其他因素，单纯从气动效率出发，同样起飞重量的8轴飞行器与4轴飞行器（）。","options":[{"key":"A","text":"4轴效率高"},{"key":"B","text":"8轴效率高"},{"key":"C","text":"效率一样"}],"answer":"A","analysis":"提示：4高8稳\n解析：在单纯考虑气动效率的情况下，4轴飞行器由于其较少的旋翼数量和相对较小的阻力往往能够表现出更高的气动效率。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0439","type":"single","difficulty":1,"stem":"如果多旋翼飞行器安装的螺旋桨与电动机不匹配，桨尺寸过大，会带来的坏处不包括（）。","options":[{"key":"A","text":"电机电流过大，造成损坏"},{"key":"B","text":"电调电流过大，造成损坏"},{"key":"C","text":"飞控电流过大，造成损坏"}],"answer":"C","analysis":"提示：选错的。飞控电流\n解析：螺旋桨尺寸过大主要影响的是电动机和电调，而不太可能直接影响飞控。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0440","type":"single","difficulty":1,"stem":"同样容量不同类型的电池，最轻的是（）。","options":[{"key":"A","text":"铅酸蓄电池"},{"key":"B","text":"碱性电池"},{"key":"C","text":"Li-po(锂聚合物电池)"}],"answer":"C","analysis":"提示：锂电最轻，容量能量大\n解析：同样容量不同类型的电池中，最轻的是Li-po(锂聚合物电池)。这种电池不仅重量轻，而且比能量大。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0441","type":"single","difficulty":1,"stem":"同样重量不同类型的动力电池，容量最大的是（）。","options":[{"key":"A","text":"Li-po(锂聚合物电池)"},{"key":"B","text":"Ni-Cd(镍镉电池)"},{"key":"C","text":"Ni-MH(镍氢电池)"}],"answer":"A","analysis":"提示：锂电最轻，容量能量大\n解析：同样重量不同类型的动力电池中，容量最大的是Li-po(锂聚合物电池)。锂聚合物电池的高能量密度和比容量特性，使得其在相同重量下能够提供更大的电能容量。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0442","type":"single","difficulty":1,"stem":"同一架多旋翼飞行器，在同样做好动力匹配的前提下（）。","options":[{"key":"A","text":"两叶桨的效率高"},{"key":"B","text":"三叶桨的效率高"},{"key":"C","text":"两种桨效率一样高"}],"answer":"A","analysis":"提示：浆少效率高 浆多稳定（跟4高8稳一样）\n解析：同样动力匹配，两叶桨的效率高。因为桨叶越多，旋转时，桨叶之间的气流干涉、下洗气流相互干扰越严重，诱导阻力增大，气动效率下降。所以，同动力、同直径、同转速下：两叶桨效率 ＞ 三叶桨 ＞ 四叶桨","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0443","type":"single","difficulty":1,"stem":"同质量电池，单位价格最便宜的是?","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"镍氢电池"}],"answer":"B","analysis":"提示：镍镉最便宜\n解析：在同质量电池的比较中，单位价格最便宜的电池是镍镉电池。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0444","type":"single","difficulty":1,"stem":"无刷电机与有刷电机的区别有（）。","options":[{"key":"A","text":"无刷电机效率较高"},{"key":"B","text":"有刷电机效率较高"},{"key":"C","text":"两类电机效率差不多"}],"answer":"A","analysis":"提示：有刷转速高，无刷效率高\n解析：无刷电机通过电子控制器来实现定子磁场的旋转，从而驱动转子上的永磁体旋转。由于没有电刷和换向器，减少了机械摩擦和能量损失，因此具有更高的运行效率。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0445","type":"single","difficulty":1,"stem":"线圈匝数越高，其KV值（）。","options":[{"key":"A","text":"越高"},{"key":"B","text":"越低"},{"key":"C","text":"无关"}],"answer":"B","analysis":"提示：圈数多 KV小\n解析：线圈匝数越高，其KV值越低。KV值是指电机在空载情况下每增加1V电压，电机转速的增加量。线圈匝数增加，会使电机的电感增大，电阻也会相应增大。在相同的电压下，电感增大使得电流变化率减小，从而导致电机的转速降低，即KV值降低。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0446","type":"single","difficulty":1,"stem":"一般锂聚合物电池上都有2组线。1组是输出线(粗，红黑各1根);1组是单节锂电引出线(细，与s数有关)，用以监视平衡充电时的单体电压。下面说法正确的是（）。","options":[{"key":"A","text":"6S电池有5根红色引出线，1根黑色引出线"},{"key":"B","text":"6S电池有7根引出线"},{"key":"C","text":"6S电池有6根引出线"}],"answer":"B","analysis":"提示：6s7根\n解析：在平衡充电时，每一节单体锂电池都需要一根单独的引出线来监测电压，所以6S电池就需要6根细线来分别监测每一节电池的电压，再加上一根较粗的黑色的共用负极线，总共7根引出线。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0447","type":"single","difficulty":1,"stem":"一架4轴飞行器，在其他任何设备都不更换的前提下，安装了4个大得多的螺旋桨，下面说法不一定正确的是（）。","options":[{"key":"A","text":"升力变大"},{"key":"B","text":"转速变慢"},{"key":"C","text":"桨盘载荷变小"}],"answer":"A","analysis":"提示：选错的。升力变大×\n解析：通常情况下，安装大得多的螺旋桨后，桨叶面积增大，在相同的转速等条件下会产生更大的升力。但是，如果新安装的大螺旋桨与原飞行器的动力系统不匹配，或者由于螺旋桨尺寸过大导致空气动力学特性发生变化，使得螺旋桨的效率降低，那么就不一定会产生更大的升力。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0448","type":"single","difficulty":1,"stem":"以下电池记忆效应最强的是（）。","options":[{"key":"A","text":"Li-Po"},{"key":"B","text":"Ni-Cd"},{"key":"C","text":"Ni-MH"}],"answer":"B","analysis":"提示：记忆Ni-Cd(镍镉 niè gé 电池）\n解析：电池记忆效应最高的是Ni-Cd(镍镉电池）镍镉电池如果在不完全放电的状态下充电，容易使电池极板产生结晶，导致电池容量降低，这就是所谓的记忆效应。相比之下，Li-PO(锂聚合物电池)基本没有记忆效应，Ni-MH(镍氢电池)的记忆效应也较小。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0449","type":"single","difficulty":1,"stem":"以下关于翼型相对厚度和相对弯度正确的是?","options":[{"key":"A","text":"翼型相对厚度越大，相对弯度就越大，能产生的升力就越大"},{"key":"B","text":"翼型中弧线的最高点距弦线的最大距离与翼弦长的比值称为相对弯度"},{"key":"C","text":"翼型上下表面垂直于翼弦的距离最长的距离值称为相对厚度"}],"answer":"B","analysis":"提示：相对都是比值\n解析：相对厚度：又称厚弦比，是翼型最大厚度与翼弦长度的比值。相对弯度：是翼型中弧线距翼弦线的最大距离与翼弦长度的比值。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0450","type":"single","difficulty":1,"stem":"以下哪种动力电池放电电流最大?","options":[{"key":"A","text":"20000mAh，5C"},{"key":"B","text":"2000mAh，30C"},{"key":"C","text":"8000mAh，20C"}],"answer":"C","analysis":"提示：mAh换算Ah，乘以C （2*30；20*5；8*20）\n解析：根据最大放电电流计算公式：Imax=容量（Ah） x 放电倍率（C）将选项数值毫安时mah，换算成安时Ah，乘以放电倍率，对比结果，谁的数值大，谁的放电电流就大20000mAh = 20Ah→2 x 5= 100A2000mAh = 2Ah→2 x 30= 60A 8000mAh = 8Ah→8 x 20 = 160A √最大","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0451","type":"single","difficulty":1,"stem":"以下哪种动力电池放电电流最大?","options":[{"key":"A","text":"30000mAh，5C"},{"key":"B","text":"2Ah，30C"},{"key":"C","text":"20000mAh，5C"}],"answer":"A","analysis":"提示：mAh换算Ah，乘以C （2*30；30*5；20*5）\n解析：根据最大放电电流计算公式：Imax=容量（Ah） x 放电倍率（C）将选项数值毫安时mah，换算成安时Ah，乘以放电倍率，对比结果，谁的数值大，谁的放电电流就大30000mAh = 30Ah→30 x 5= 150A √最大2x30=60A20000mAh =20Ah→20 x 5 = 100A","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0452","type":"single","difficulty":1,"stem":"以下哪种动力电池在没有充分放电的前提下，不能够以大电流充电?","options":[{"key":"A","text":"LAB(铅酸蓄电池)"},{"key":"B","text":"Ni-Cd(镍镉电池)"},{"key":"C","text":"Li-po(锂聚合物电池)"}],"answer":"B","analysis":"提示：Ni-Cd有记忆，未放不能大\n解析：Ni-Cd(镍镉电池)在没有充分放电的前提下，不能够以大电流充电。镍镉电池具有较强的记忆效应，如果在没有充分放电的情况下进行充电，容易导致电池容量下降和性能受损.铅酸蓄电池相对来说记忆效应较弱，在一些情况下可以在未充分放电时进行充电。锂聚合物电池基本没有记忆效应，可以在未充分放电时进行充电。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0453","type":"single","difficulty":1,"stem":"用遥控器设置电调，需要（）。","options":[{"key":"A","text":"断开电机"},{"key":"B","text":"接上电机"},{"key":"C","text":"断开动力电源"}],"answer":"B","analysis":"提示：设置电调要接电机\n解析：电调本身没有独立的状态显示装置，所以完全依靠电机的鸣音来传递调试的状态信息，遥控器设置常包含油门行程校准、启动模式匹配等关键步骤，需电机参与才能让电调准确识别并记录控制信号范围，确保后续调速精准。可以简单理解为 “电调调试依赖电机鸣音反馈”，所以必须接上电机，才能完成整个调试流程。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0454","type":"single","difficulty":1,"stem":"有2个输出功率相同的电机，前者型号3508，后者型号2820，以下表述错误的是（）。","options":[{"key":"A","text":"3508适合带动更大的螺旋桨"},{"key":"B","text":"2820适用于更高的转速"},{"key":"C","text":"尺寸上，2820粗一些，3508高一些"}],"answer":"C","analysis":"提示：选错的。3508直径粗，2820高度高\n解析：电机前两位数字表示电机转子的直径，后两位数字表示电机转子的高度。3508电机 转子直径35mm，转子高度是8mm；更粗2820电机 转子直径28mm，转子高度是20mm。更高因此，3508电机直径更粗，2820电机高度更高。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0455","type":"single","difficulty":1,"stem":"在高海拔、寒冷、空气稀薄地区，飞行负载不变，飞行状态会（）。","options":[{"key":"A","text":"功率损耗增大，飞行时间减少"},{"key":"B","text":"最大起飞重量增加"},{"key":"C","text":"飞行时间变长"}],"answer":"A","analysis":"提示：密度小，升力小，功率损耗多，飞行时间减少 （高原飞行，除了损耗增大，其他都减少）\n解析：在高海拔空气密度低，无人机升力减小。如果飞机负载不变，只能通过飞控或电调，让电机增加转速，提升旋翼的升力，这个过程可以想象成“加油门”，电池的电量消耗的更快，飞行时间就减少了。高转速下的电机发热、空气阻力都是消耗，所以功率损耗也增大。所以本题可以记忆：高原飞行，除了损耗增大，其他都减少","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0456","type":"single","difficulty":1,"stem":"在高海拔地区，多旋翼飞行器出现较难离地时，最有效的应对措施是（）。","options":[{"key":"A","text":"减重"},{"key":"B","text":"更换大桨"},{"key":"C","text":"更换大容量电池"}],"answer":"A","analysis":"提示：减重起飞\n解析：在高海拔地区，多旋翼飞行器出现较难离地时，最有效的应对措施是减重。在高海拔地区，由于空气稀薄，飞行器的升力会受到一定影响，导致起飞难度增加。通过减重，可以减少飞行器在起飞时所需克服的重力，从而降低起飞难度。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0457","type":"single","difficulty":1,"stem":"在横侧操纵中，操纵杆左右活动的每-个位置，都对应着一个（）。","options":[{"key":"A","text":"坡度"},{"key":"B","text":"滚转角速度"},{"key":"C","text":"旋转角度"}],"answer":"B","analysis":"提示：横侧操纵→滚转角速度\n解析：滚转角速度是飞机绕其纵轴(即机头到机尾的线)旋转的速度。在横侧操纵中，操纵杆的左右活动通过改变副翼的角度来产生滚转力矩，从而使飞机绕纵轴旋转。因此，操纵杆的每一个位置都对应着一个特定的滚转角速度，这是与操纵杆位置直接相关的参数。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0458","type":"single","difficulty":1,"stem":"直接控制电机转速的是（）。","options":[{"key":"A","text":"电池"},{"key":"B","text":"电调"},{"key":"C","text":"飞控"}],"answer":"B","analysis":"提示：飞控控电调，电调控电机\n解析：直接控制电机转速的是电调电调(电子调速器)的主要作用就是根据控制信号来调节电机的转速， 电池只是为整个系统提供电能，不能直接控制电机的转速，飞控主要负责整个飞行器的姿态稳定和航线规划等，但不直接控制电机的转速。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0459","type":"single","difficulty":1,"stem":"4轴飞行器，改变航向时（）。","options":[{"key":"A","text":"相邻的2个桨加速，另2个桨减速"},{"key":"B","text":"相对的2个桨加速，另2个桨减速"},{"key":"C","text":"4个桨均加速"}],"answer":"B","analysis":"提示：相对加减\n解析：4轴飞行器，改变航向时相对的2个桨加速，另2个桨减速。通过相对的两个桨加速，另外相对的两个桨减速，可以产生扭矩差，从而实现飞行器的航向改变。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0460","type":"single","difficulty":1,"stem":"4轴飞行器飞行运动中有（）。","options":[{"key":"A","text":"沿3轴移动，绕3轴转动"},{"key":"B","text":"沿3个轴移动"},{"key":"C","text":"绕4个轴转动"}],"answer":"A","analysis":"提示：33\n解析：4轴飞行器飞行运动中有6个自由度（沿3绕3）6个自由度分别是:沿X轴的平移、沿Y轴的平移、沿Z轴的平移，绕X轴的旋转(横滚)、绕Y轴的旋转(俯仰)、绕Z轴的旋转(偏航)。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0461","type":"single","difficulty":1,"stem":"4轴飞行器有“X”模式和“+”模式两大类，其中（）。","options":[{"key":"A","text":"“+”模式操纵性好"},{"key":"B","text":"“X”模式操纵性好"},{"key":"C","text":"两种模式操纵性没有区别"}],"answer":"B","analysis":"提示：X操纵好\n解析：“+”模式中，机头正对一根机臂。进行俯仰或横滚时，主要由对应方向上的两个电机增减转速产生控制力矩。“X”模式中，机头位于两根机臂之间。无论俯仰还是横滚，四个电机都具有相应力臂，飞控可以让四个电机共同增减转速。因此，“X”模式的控制力矩分配更均匀，单个电机不容易先达到输出极限，横滚和俯仰控制余量通常更大、响应更灵活。X”模式操纵更好。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0462","type":"single","difficulty":1,"stem":"X模式的4轴飞行器，左前方的旋翼一般多为（）。","options":[{"key":"A","text":"俯视顺时针旋转"},{"key":"B","text":"俯视逆时针旋转"},{"key":"C","text":"左视逆时针旋转"}],"answer":"A","analysis":"提示：左前-俯视顺时针旋转（抚顺）\n解析：X模式4轴飞行器，左前方的旋翼一般多为俯视顺时针旋转。在X模式中，对角线上的旋翼旋转方向相同，通常情况下，左前方和右后方的旋翼为顺时针旋转，右前方和左后方的旋翼为逆时针旋转。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0463","type":"single","difficulty":1,"stem":"X模式4轴飞行器从悬停转换到前进,哪两个轴需要加速?","options":[{"key":"A","text":"后方两轴"},{"key":"B","text":"左侧两轴"},{"key":"C","text":"右侧两轴"}],"answer":"A","analysis":"提示：同向减速，对向加速\n解析：X模式4轴飞行器从悬停转换到前进，后方两轴需要加速。在X模式中，要实现向前飞行，后方的两个轴需要加速，产生更大的推力，从而使飞行器向前移动。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0464","type":"single","difficulty":1,"stem":"X模式6轴飞行器从悬停转换到向左平移，哪两个轴需要减速?","options":[{"key":"A","text":"后方两轴"},{"key":"B","text":"左侧两轴"},{"key":"C","text":"右侧两轴"}],"answer":"B","analysis":"提示：同向减速，对向加速\n解析：在X模式中，要实现向左平移，左侧的两个轴需要减速，右侧的两个轴加速，从而产生向左的推力，使飞行器向左移动。（中间 2 个旋翼是 “左右对称中心”，纯升力补充，在左右平移时无需变化。）","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0465","type":"single","difficulty":1,"stem":"保持油门持续爬升，电机功率会（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"C","analysis":"提示：电机功率不变（发动机持续减小）\n解析：保持油门持续爬升，电机功率会不变。因为在爬升过程中，如果油门保持不变,即输入的能量不变，那么电机功率也会保持不变。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0466","type":"single","difficulty":1,"stem":"部分多旋翼飞行器会安装垂尾,（）。","options":[{"key":"A","text":"会减小高速前飞时的稳定性，增加悬停时的稳定性"},{"key":"B","text":"会增加高速前飞时的稳定性，增加悬停时的稳定性"},{"key":"C","text":"会增加高速前飞时的稳定性，减小悬停时的稳定性"}],"answer":"C","analysis":"提示：垂尾前稳，减悬停\n解析：对于部分多旋翼飞行器安装垂尾的情况:会增加高速前飞时的稳定性，减小悬停时的稳定性。 安装垂尾在高速前飞时可以提供方向稳定性，减少偏航的可能性，但在悬停时可能会增加阻力，从而减小悬停时的稳定性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0467","type":"single","difficulty":1,"stem":"部分多旋翼飞行器螺旋桨加有外框，其主要作用是（）。","options":[{"key":"A","text":"提高螺旋桨效率"},{"key":"B","text":"增加外形的美观"},{"key":"C","text":"防止磕碰提高安全性"}],"answer":"C","analysis":"提示：安全\n解析：部分多旋翼飞行器螺旋桨加有外框，其主要作用是防止磕碰提高安全性。加外框可以避免螺旋桨在高速旋转时与人或物体发生碰撞，减少意外伤害的风险。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0468","type":"single","difficulty":1,"stem":"部分商用多旋翼飞行器有收放脚架功能或机架整体变形功能，其主要目的是（）。","options":[{"key":"A","text":"改善机载任务设备视野"},{"key":"B","text":"调整重心增加飞行器稳定性"},{"key":"C","text":"减小前飞废阻力"}],"answer":"A","analysis":"提示：减少遮挡改善视野\n解析：商用多旋翼常配备收放脚架或可变形机架，主要是为了在航拍、测绘等任务中：避免起落架或机臂遮挡摄像机、云台视野；提高云台转动范围；减少拍摄盲区。此三项均为改善视野服务。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0469","type":"single","difficulty":1,"stem":"垂直爬升时升限为海拔1000米的多旋翼飞行器，如果在性能范围内前飞中爬升，其升限（）。","options":[{"key":"A","text":"将降低"},{"key":"B","text":"将升高"},{"key":"C","text":"将保持不变"}],"answer":"B","analysis":"提示：有气流，升力↑升限↑\n解析：垂直爬升时升限为海拔1000米的多旋翼飞行器，如果在前飞中爬升，其升限将升高。前飞时的相对气流速度增加，会提高飞行器的升力，从而使其升限升高。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0470","type":"single","difficulty":1,"stem":"大多数多旋翼飞行器自主飞行过程利用（）实现高度感知。","options":[{"key":"A","text":"气压高度计"},{"key":"B","text":"GPS"},{"key":"C","text":"超声波高度计"}],"answer":"B","analysis":"提示：GPS-位置高度速度\n解析：根据100分考生反馈 本题选GPS","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0471","type":"single","difficulty":1,"stem":"大多数多旋翼飞行器自主飞行过程利用（）实现速度感知。","options":[{"key":"A","text":"惯导"},{"key":"B","text":"空速管"},{"key":"C","text":"GPS"}],"answer":"C","analysis":"提示：速度感知→GPS（感知，螺旋仪）\n解析：大多数多旋翼飞行器自主飞行过程利用GPS实现速度感知。GPS可以通过测量飞行器在不同时刻的位置变化，计算出其速度。惯导主要用于测量飞行器的姿态和加速度等信息，对于速度的测量精度相对较低。空速管在多旋翼飞行器上应用较少。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0472","type":"single","difficulty":1,"stem":"大多数多旋翼飞行器自主飞行过程利用（）实现位置感知。","options":[{"key":"A","text":"平台惯导"},{"key":"B","text":"捷联惯导"},{"key":"C","text":"GPS"}],"answer":"C","analysis":"提示：位置，必然GPS\n解析：大多数多旋翼飞行器自主飞行过程利用GPS实现位置感知。GPS能够提供较为精确的地理位置信息包括经纬度和高度。 平台惯导和捷联惯导虽然也能提供位置信息，但在多旋翼飞行器的自主飞行中，GPS是更常用和主要的位置感知手段。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0473","type":"single","difficulty":1,"stem":"当多旋翼飞行器地面站出现飞行器电压过低报警时，第一时刻采取的措施不包括（）。","options":[{"key":"A","text":"迅速将油门收到0"},{"key":"B","text":"一键返航"},{"key":"C","text":"控制姿态，逐渐降低高度，迫降至地面"}],"answer":"A","analysis":"提示：选错的。不能油门收到0\n解析：当多旋翼飞行器地面站出现飞行器电压过低报警时，第一时刻采取的措施不包括迅速将油门收到0。 迅速将油门收到0可能会导致飞行器直接坠落，造成损坏。较为合理的措施是控制姿态，逐渐降低高度，迫降至地面，或者一键返航。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0474","type":"single","difficulty":1,"stem":"当多旋翼飞行器飞远超出视线范围无法辨别机头方向时，应对方式错误的是（）。","options":[{"key":"A","text":"加大油门"},{"key":"B","text":"一键返航"},{"key":"C","text":"云台复位通过图像确定机头方向"}],"answer":"A","analysis":"提示：选错的。加油门跑更远\n解析：当多旋翼飞行器飞远超出视线范围无法辨别机头方向时，应对方式错误的是加大油门。加大油门可能会使飞行器飞得更远，增加失控的风险。正确的做法是一键返航或者云台复位通过图像确定机头方向。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0475","type":"single","difficulty":1,"stem":"电动机电子线圈圈数的多少与转速的关系，（）。","options":[{"key":"A","text":"线圈圈数越多转速越快"},{"key":"B","text":"线圈圈数越多转速越慢"},{"key":"C","text":"线圈圈数与转速无关"}],"answer":"B","analysis":"提示：圈多转慢\n解析：线圈圈数越多转速越慢。 电动机的转速与多个因素有关，其中线圈匝数是一个重要因素。当线圈匝数增加时。电机的电感增大，会使电流的变化率减小，从而导致电机的转速降低。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0476","type":"single","difficulty":1,"stem":"对于多旋翼飞行器，飞行速度影响航拍设备曝光，以下正确的是（）。","options":[{"key":"A","text":"速度越快，需提高曝光度，保证正常曝光"},{"key":"B","text":"速度越快，需降低曝光度，保证正常曝光"},{"key":"C","text":"速度快慢，不影响拍摄曝光"}],"answer":"A","analysis":"提示：速度↑曝光度↑\n解析：飞行速度快时，单位时间内进入镜头的光线减少，所以需要提高曝光度来保证正常曝光。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0477","type":"single","difficulty":1,"stem":"对于多旋翼航拍飞行器云台说法正确的是（）。","options":[{"key":"A","text":"云台保证无人机在云层上飞行的安全"},{"key":"B","text":"云台是航拍设备的增稳和操纵装置"},{"key":"C","text":"云台的效果与传统舵机一样"}],"answer":"B","analysis":"提示：云台增稳\n解析：云台的主要作用是通过电机和传感器等技术，对航拍设备进行稳定和精确的控制，减少飞行器震动和姿态变化对拍摄画面的影响，同时能够实现对拍摄角度和方向的灵活操纵。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0478","type":"single","difficulty":1,"stem":"多旋翼无人机机体一般不使用（）的材料。","options":[{"key":"A","text":"玻璃纤维材料"},{"key":"B","text":"碳纤维材料"},{"key":"C","text":"高强度工程塑料"}],"answer":"A","analysis":"提示：选错的。不用玻璃纤维\n解析：根据蓝皮书表述：轻型、微型无人机一般使用2叶桨,少数使用3叶桨或4叶桨等。桨径20in以下的螺旋桨有木材、工程塑料或碳纤维等材质,需要根据实际需要选用。 实际应用中，玻璃纤维密度比碳纤维大、重量更高，脆性更强、抗振动疲劳差，仅极少数廉价玩具机少量使用，多旋翼无人机一般不采用作为主体结构材料。简单总结：碳纤、工程塑料（高强度塑料）是行业常规用材，玻璃纤维因偏重、韧性差，极少用于正规多旋翼无人机。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0479","type":"single","difficulty":1,"stem":"多轴的“轴”指（）。","options":[{"key":"A","text":"舵机轴"},{"key":"B","text":"飞行器运动坐标轴"},{"key":"C","text":"旋翼轴"}],"answer":"C","analysis":"提示：旋翼机旋翼轴\n解析：“多轴飞行器”中的“轴”，指各个旋翼围绕其旋转的轴线，也可以理解为安装电机和螺旋桨的动力轴。例如：四轴飞行器：4个旋翼轴六轴飞行器：6个旋翼轴八轴飞行器：8个旋翼轴","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0480","type":"single","difficulty":1,"stem":"多旋翼飞行器（）。","options":[{"key":"A","text":"有自转下滑能力"},{"key":"B","text":"无自转下滑能力"},{"key":"C","text":"有部分自转下滑能力"}],"answer":"B","analysis":"提示：无（没动力后，多旋翼飞行器直接掉下来，没有自转下滑能力，安全降落的能力）\n解析：多旋翼飞行器无自转下滑能力。自转下滑是指在动力装置失效后，飞行器能够像固定翼飞机一样，利用机翼的自转(如螺旋浆在气流作用下继续旋转)产生一定的升力，从而实现安全下滑降落。多旋翼飞行器的动力系统通常由多个电机和螺旋桨组成，通过电机的转速控制来实现飞行姿态和动作。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0481","type":"single","difficulty":1,"stem":"多旋翼飞行器不属于以下哪个概念范畴?","options":[{"key":"A","text":"自转旋翼机"},{"key":"B","text":"重于空气的航空器"},{"key":"C","text":"直升机"}],"answer":"A","analysis":"提示：选错的。多轴不自转\n解析：多旋翼飞行器不属于自转旋翼机的概念范畴。多旋翼飞行器是通过多个电机带动螺旋桨旋转产生升力来飞行的，其飞行原理和结构与棛自转旋翼机有很大不同。多旋翼飞行器属于重于空气的航空器，因为它依靠空气动力来克服自身重力实现飞行。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0482","type":"single","difficulty":1,"stem":"多旋翼飞行器的操纵不包括（）。","options":[{"key":"A","text":"俯仰操纵"},{"key":"B","text":"航向操纵"},{"key":"C","text":"周期变距"}],"answer":"C","analysis":"提示：选错的。周期变距\n解析：常规多旋翼有俯仰操纵和航向操纵，主要通过改变各旋翼转速来实现；周期变距是传统直升机通过周期性改变旋翼桨叶桨距来控制姿态的方式，不属于常规多旋翼的操纵方式。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0483","type":"single","difficulty":1,"stem":"多旋翼飞行器的遥控器一般有（）。","options":[{"key":"A","text":"2个通道"},{"key":"B","text":"3个通道"},{"key":"C","text":"4个及以上通道"}],"answer":"C","analysis":"提示：4以上通道\n解析：多旋翼飞行器的遥控器一般有4个及以上通道。通常包括油门、横滚、俯仰、偏航等控制通道。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0484","type":"single","difficulty":1,"stem":"多旋翼飞行器定点半径画圆飞行时，如何能得到最佳航拍画面?","options":[{"key":"A","text":"平移画面"},{"key":"B","text":"绕圈一周"},{"key":"C","text":"边绕圈边上升"}],"answer":"C","analysis":"提示：绕圈+上升\n解析：多旋翼飞行器定点半径画圆飞行时，边绕圈边上升能得到最佳航拍画面。这样可以获得更丰富的视角和画面层次。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0485","type":"single","difficulty":1,"stem":"多旋翼飞行器都有哪些用途:①应急救灾;②军用侦察;③警用监视;④娱乐;⑤广电行业。","options":[{"key":"A","text":"①④⑤"},{"key":"B","text":"②③④"},{"key":"C","text":"①②③④⑤"}],"answer":"C","analysis":"提示：全选\n解析：多旋翼能够悬停、低速飞行并搭载相机等设备，因此可用于应急救灾、军用侦察、警用监视、娱乐，以及广电航拍等领域。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0486","type":"single","difficulty":1,"stem":"多旋翼飞行器飞控板上一般会安装（）。","options":[{"key":"A","text":"6个角速率陀螺"},{"key":"B","text":"1个角速率陀螺"},{"key":"C","text":"3个角速率陀螺"}],"answer":"C","analysis":"提示：3个陀螺仪\n解析：消费级多旋翼飞行器通常装一套IMU（惯性测量单元）内含3个单轴的加速度计和3个单轴的陀螺仪高端机会采取双IMU冗余设计,或3套IMU","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0487","type":"single","difficulty":1,"stem":"多旋翼飞行器飞控软件使用中要特别注意的事项，不包括（）。","options":[{"key":"A","text":"版本"},{"key":"B","text":"文件大小"},{"key":"C","text":"各通道正反逻辑设置"}],"answer":"B","analysis":"提示：选错的。软件大小与性能无关\n解析：使用飞控软件需要注意版本兼容性、各通道正反逻辑设置、固件升级、参数配置，不包含文件大小。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0488","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行时，使用哪种模式驾驶员的压力最大?","options":[{"key":"A","text":"GPS模式"},{"key":"B","text":"增稳模式"},{"key":"C","text":"纯手动模式"}],"answer":"C","analysis":"提示：纯手动无额外辅助 手忙脚乱压力大\n解析：多旋翼飞行器飞行时，纯手动模式驾驶员的压力最大。在纯手动模式下，飞行器的所有控制都完全依赖驾驶员的操作，没有自动辅助功能。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0489","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行中，图像叠加OSD信息显示的电压一般为电池的（）。","options":[{"key":"A","text":"空载电压"},{"key":"B","text":"负载电压"},{"key":"C","text":"已使用电压"}],"answer":"B","analysis":"提示：飞行中负载中\n解析：多旋翼在飞行过程中，动力电池正在为电机、飞控等设备供电，OSD显示的是电池在带负载工作状态下的实时端电压，因此属于负载电压。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0490","type":"single","difficulty":1,"stem":"多旋翼飞行器航拍中，果冻效应或水波纹效应产生的原因是（）。","options":[{"key":"A","text":"高频振动传递到摄像机"},{"key":"B","text":"低频振动传递到摄像机"},{"key":"C","text":"摄像机无云台增稳"}],"answer":"A","analysis":"提示：高频→果冻水波纹\n解析：多旋翼飞行器航拍中，果冻效应或水波纹效应产生的原因是高频振动传递到摄像机。当多旋翼飞行器在飞行过程中产生高频振动时，这些振动会传递到安装在飞行器上的摄像机，导致拍摄的画面出现扭曲、变形或类似果冻抖动、水波纹的效果。低频振动不会。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0491","type":"single","difficulty":1,"stem":"多旋翼飞行器起降时接触地面的是（）。","options":[{"key":"A","text":"机架"},{"key":"B","text":"云台架"},{"key":"C","text":"脚架"}],"answer":"C","analysis":"提示：最下脚架\n解析：多旋翼飞行器正常起飞、降落时，主要由脚架与地面接触，承担支撑和缓冲作用。机架是飞行器的主要承力结构，云台架用于安装和保护云台设备，二者都不是正常起降时的主要接地部件。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0492","type":"single","difficulty":1,"stem":"多旋翼飞行器前飞时，单个旋翼（）。","options":[{"key":"A","text":"前行桨叶相对气流速度小于后行桨叶相对气流速度"},{"key":"B","text":"前行桨叶相对气流速度大于后行桨叶相对气流速度"},{"key":"C","text":"前行桨叶相对气流速度等于后行桨叶相对气流速度"}],"answer":"B","analysis":"提示：气流：同向大\n解析：多旋翼飞行器前飞时，单个旋翼前行桨叶相对气流速度大于后行桨叶相对气流速度。在前飞过程中，由于飞行器整体向前移动，使得前行桨叶与空气的相对速度增加，而后行桨叶与空气的相对速度减小。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0493","type":"single","difficulty":1,"stem":"多旋翼飞行器悬停时的平衡不包括（）。","options":[{"key":"A","text":"俯仰平衡"},{"key":"B","text":"方向平衡"},{"key":"C","text":"前飞废阻力平衡"}],"answer":"C","analysis":"提示：选错的。悬停无废阻力，不用平衡\n解析：多旋翼悬停状态：升力平衡、俯仰平衡、横滚平衡、方向平衡俯仰平衡：前后机头上下的平衡，悬停必须保持，包含在内。方向平衡：机头朝向、偏航旋转的平衡，悬停要稳住机头不打转，包含在内。前飞废阻力平衡：只有向前飞行时才会产生前飞阻力，悬停没有前飞运动，不需要平衡前飞废阻力。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0494","type":"single","difficulty":1,"stem":"多旋翼飞行器在风中悬停时下列影响正确的是（）。","options":[{"key":"A","text":"与无风悬停相比，逆风悬停机头稍低，且逆风速越大，机头越低"},{"key":"B","text":"一般情况下，多轴飞行器应尽量在顺风中悬停"},{"key":"C","text":"侧风的作用将使多轴飞行器沿风的去向位移，因此，侧风悬停时应向风来的反方向压杆"}],"answer":"A","analysis":"提示：逆风悬停低头\n解析：当多旋翼飞行器在逆风中悬停时，迎面吹来的风会增加飞行器的升力，为了保持悬停高度不变，飞控会自动降低电机转速，导致机头稍低。逆风速越大，升力增加越多机头就会越低。一般情况下，多旋翼飞行器不应尽量在顺风中悬停，因为顺风可能导致飞行器失去位置控制或被吹走。 侧风悬停时，不应向风来的反方向压杆，而是需要根据风向和风速调整姿态和电机转速来保持位置稳定。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0495","type":"single","difficulty":1,"stem":"多旋翼飞行器在没有发生机械结构改变的前提下，如发生漂移，不能直线飞行时，不需关注的是（）。","options":[{"key":"A","text":"GPS定位"},{"key":"B","text":"指南针校准"},{"key":"C","text":"调整重心位置"}],"answer":"C","analysis":"提示：结构不变重心不变。不用调整\n解析：多旋翼飞行器在没有发生机械结构改变的前提下，如发生漂移，不能直线飞行时，不需关注的是调整重心位置。如果飞行器没有机械结构改变，重心位置通常是固定的且不是导致漂移的主要原因。此时更应关注GPS定位是否准确，以及指南针校准是否正确。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0496","type":"single","difficulty":1,"stem":"多旋翼飞行器在前飞中必然会产生（）变化。","options":[{"key":"A","text":"偏航角"},{"key":"B","text":"横滚角"},{"key":"C","text":"俯仰角"}],"answer":"C","analysis":"提示：飞行必然俯仰角\n解析：常规多旋翼主动前飞时，会向前倾斜，使总拉力产生向前的分量，因此俯仰角会发生变化；(偏航角决定机头朝向。机头保持朝前不转向，也可以一直前飞，所以偏航角不必改变。)(横滚角决定机身向左或向右倾斜。沿机头正前方直飞时，不需要左右倾斜，所以横滚角也不必改变)","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0497","type":"single","difficulty":1,"stem":"多旋翼飞行器在运输过程中的注意事项是（）。","options":[{"key":"A","text":"做好减震措施，固定云台并安装云台固定支架，装箱运输"},{"key":"B","text":"装箱运输，也可行李箱运输"},{"key":"C","text":"可随意拆装运输"}],"answer":"A","analysis":"提示：运输减震\n解析：做好减震措施能够减少运输过程中的震动对飞行器造成的损害。固定云台可以防止云台在运输中受到碰撞和损坏，安装云台固定支架能进一步增强稳定性。装箱运输能够提供更好的保护，避免飞行器受到外界的挤压和碰撞。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0498","type":"single","difficulty":1,"stem":"多旋翼飞行器重心过高于或过低于桨平面会（）。","options":[{"key":"A","text":"降低稳定性"},{"key":"B","text":"降低机动性"},{"key":"C","text":"显著影响电力消耗"}],"answer":"B","analysis":"提示：重心过高低→降低机动性\n解析：当重心过高或过低时，飞行器在姿态变化和动作执行时会变得更加迟缓、不灵活，从而降低了机动性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0499","type":"single","difficulty":1,"stem":"多旋翼航拍飞行器难以完成哪种工作?","options":[{"key":"A","text":"测绘"},{"key":"B","text":"直播"},{"key":"C","text":"超远距离监控"}],"answer":"C","analysis":"提示：超远监控（续航跟信号都有限）\n解析：多轴航拍飞行器的续航能力和通信距离通常有限，难以实现超远距离的监控。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0500","type":"single","difficulty":1,"stem":"多旋翼航拍中往往需要使用相机的位移补偿功能，导致使用此功能的原因是（）。","options":[{"key":"A","text":"飞行器的速度"},{"key":"B","text":"风速"},{"key":"C","text":"飞行器姿态不稳"}],"answer":"A","analysis":"提示：有速度=有位移，需要位移补偿功能\n解析：当多轴飞行器在飞行过程中具有一定速度时，相机相对于被拍摄物体的位置会不断变化，为了获得稳定清晰的拍摄画面，需要使用位移补偿功能来抵消这种位置变化的影响。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0501","type":"single","difficulty":1,"stem":"飞行中的多旋翼飞行器所承受的力和力矩不包括（）。","options":[{"key":"A","text":"自身重力"},{"key":"B","text":"旋翼桨叶的铰链力矩"},{"key":"C","text":"旋翼的反扭矩和桨毂力矩"}],"answer":"B","analysis":"提示：选错的。不包括铰链\n解析：常规多旋翼桨叶通常没有传统直升机那种供桨叶挥舞的铰链，因此不存在相应的桨叶铰链力矩。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0502","type":"single","difficulty":1,"stem":"给遥控发射机安装增益天线，在使用时一定能提高其遥控范围。","options":[{"key":"A","text":"正确"},{"key":"B","text":"错误"},{"key":"C","text":"不一定"}],"answer":"C","analysis":"提示：增益天线，不一定\n解析：给遥控发射机安装增益天线，在使用时不一定能提高其遥控范围。虽然增益天线理论上可以增强信号的发射和接收能力，但实际效果还受到多种因素的影响。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0503","type":"single","difficulty":1,"stem":"关于部分多旋翼飞行器采用机臂上反角设计，下列描述正确的是？","options":[{"key":"A","text":"提高稳定性"},{"key":"B","text":"提高机动性"},{"key":"C","text":"减少电力损耗"}],"answer":"A","analysis":"提示：上反角→提高稳定性\n解析：机臂上反角能够增加飞行器的滚转稳定性。当飞行器受到侧风等干扰产生滚转趋势时，上反角会产生一个反向的力矩，有助于飞行器恢复平衡，从而提高稳定性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0504","type":"single","difficulty":1,"stem":"关于多旋翼飞行器的反扭矩说法不正确的是（）。","options":[{"key":"A","text":"单个旋翼的反扭矩会迫使多轴飞行器向旋翼旋转的反方向偏转"},{"key":"B","text":"单个旋翼反扭矩的大小取决于电动机转速"},{"key":"C","text":"多轴飞行器的俯仰运动通过改变各个旋翼的反扭矩来实现"}],"answer":"C","analysis":"提示：选错的。反扭矩与俯仰角无关\n解析：· 电动机转速是决定单个旋翼反扭矩大小的“关键主导因素”。 √ · 俯仰靠前后桨“拉力差”产生力矩，与反扭矩无关；反扭矩只影响偏航。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0505","type":"single","difficulty":1,"stem":"关于多旋翼飞行器的优势描述不正确的是（）。","options":[{"key":"A","text":"成本低廉"},{"key":"B","text":"气动效率高"},{"key":"C","text":"结构简单便携"}],"answer":"B","analysis":"提示：选错的。气动效率高×\n解析：多旋翼的典型优势是结构相对简单、便于携带 √常见小型机的制造和维护成本也相对较低 √但在巡航时，其气动效率通常低于固定翼飞机；与传统直升机相比，其效率通常也不占优势。因此，“气动效率高”不是多旋翼的典型优势，","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0506","type":"single","difficulty":1,"stem":"关于多旋翼飞行器定义描述正确的是（）。","options":[{"key":"A","text":"具有两个及以上旋翼轴的旋翼航空器"},{"key":"B","text":"具有不少于四个旋翼轴的无人旋翼航空器"},{"key":"C","text":"具有三个及以上旋翼轴的旋翼航空器"}],"answer":"C","analysis":"提示：多轴，≥3\n解析：三个旋翼轴及以上就可以称为多旋翼飞行器。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0507","type":"single","difficulty":1,"stem":"描述一个多轴无人机地面遥控发射机是“美国手”，是指（）。","options":[{"key":"A","text":"右手上下动作控制油门或高度"},{"key":"B","text":"左手上下动作控制油门或高度"},{"key":"C","text":"左手左右动作控制油门或高度"}],"answer":"B","analysis":"提示：美左上下油门","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0508","type":"single","difficulty":1,"stem":"描述一个多轴无人机地面遥控发射机是“日本手”，是指（）。","options":[{"key":"A","text":"右手上下动作控制油门或高度"},{"key":"B","text":"左手上下动作控制油门或高度"},{"key":"C","text":"左手左右动作控制油门或高度"}],"answer":"A","analysis":"提示：日右上下油门","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0509","type":"single","difficulty":1,"stem":"民航旅客行李中携带锂电池的额定能量超过（）严禁携带。","options":[{"key":"A","text":"100Wh"},{"key":"B","text":"120Wh"},{"key":"C","text":"160Wh"}],"answer":"C","analysis":"提示：禁带160Wh\n解析：民航旅客行李中携带锂电池的额定能量超过160Wh严禁携带。在民航运输中，对锂电池的携带有着严格的规定。这是出于飞行安全的考虑。一般来说，对于额定能量在100Wh至160Wh的锂电池，需要经过航空公司的批准才能携带。而超过160Wh的锂电池，由于其潜在的安全风险较大，是严禁携带的。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0510","type":"single","difficulty":1,"stem":"使用多旋翼飞行器作业过程中，必须紧急返航的情况是","options":[{"key":"A","text":"距离过远，高度过高，超出视线范围"},{"key":"B","text":"监视器显示无人机电池电量过低"},{"key":"C","text":"图传监视器有干扰不稳定"}],"answer":"B","analysis":"提示：电低→紧急返航\n解析：电池电量过低可能导致飞行器失去动力而坠落。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0511","type":"single","difficulty":1,"stem":"使用多旋翼飞行器，航拍过程中，关于曝光描述错误的是（）。","options":[{"key":"A","text":"全自动拍摄"},{"key":"B","text":"以拍摄主体为主，预先设定好曝光量"},{"key":"C","text":"最好用高ISO来拍摄"}],"answer":"C","analysis":"提示：选错的。高ISO\n解析：使用多旋翼飞行器，航拍过程中，关于曝光描述错误的是最好用高ISO来拍摄。高ISO会增加噪点，降低图像质量，一般不建议在航拍中使用高ISO来拍摄。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0512","type":"single","difficulty":1,"stem":"使用多旋翼飞行器，航拍过程中，为了保证画面明暗稳定，相机尽量设定为（）。","options":[{"key":"A","text":"光圈固定"},{"key":"B","text":"快门固定"},{"key":"C","text":"ISO固定"}],"answer":"C","analysis":"提示：明暗→ISO固定\n解析：航拍手动/半自动模式下，画面明暗程度取决于三个参数的组合。固定其中一个参数，另外两个可以调整。光圈：控制进光孔大小 → 影响景深与进光量快门：控制传感器曝光时间长短 → 影响运动模糊ISO：控制传感器对光线的敏感程度 → ISO越高照片越亮问题是：固定哪个参数对调整画面明暗的“意义最大”？ISO对画质的影响最不可逆。先固定ISO，再配合调整光圈与快门，是所有拍摄的底层逻辑。在无人机航拍中，固定快门的主要目的是“保证画面不模糊”或“创造动感”，而非为了调整明暗。相比之下，固定ISO是最普适、最符合“画质优先”原则的选择，也是手动控制曝光时最合理的起点。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0513","type":"single","difficulty":1,"stem":"使用多旋翼飞行器，拍摄夜景时，应（）。","options":[{"key":"A","text":"降低飞行速度，保证正常曝光"},{"key":"B","text":"降低飞行高度，保证正常曝光"},{"key":"C","text":"与白天没有明显区别"}],"answer":"A","analysis":"提示：夜景→降低飞速保证曝光\n解析：使用多旋翼飞行器，拍摄夜景时，应降低飞行速度，保证正常曝光，因为在夜间光线较暗，降低飞行速度可以让相机有足够的时间进行曝光，以获得清晰、明亮的画面。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0514","type":"single","difficulty":1,"stem":"使用多旋翼飞行器航拍过程中，温度对摄像机的影响描述正确的是（）。","options":[{"key":"A","text":"在温差较大的环境中拍摄要注意镜头的结雾"},{"key":"B","text":"在温度较高的环境拍摄摄像机电池使用时间短"},{"key":"C","text":"在温度较低的环境拍摄摄像机电池使用时间长"}],"answer":"A","analysis":"提示：温差大，镜头易结雾\n解析：在从寒冷的室外进入温暖的室内时，镜头容易因为温差而结雾，影响拍摄效果。在温度较高的环境中，摄像机电池的性能可能会受到影响，使用时间不一定短;在温度较低的环境中，摄像机电池的性能会下降，使用时间通常会变短。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0515","type":"single","difficulty":1,"stem":"使用多旋翼飞行器航拍时，以下哪种方法可以改善画面的“水波纹”现象?","options":[{"key":"A","text":"提高飞行速度"},{"key":"B","text":"改善云台和电机的减震性能"},{"key":"C","text":"改用姿态模式飞行"}],"answer":"B","analysis":"提示：高频→水波纹，减震改善\n解析：良好的减震性能能够减少飞行器震动对相机的影响，从而减少“水波纹”现象。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0516","type":"single","difficulty":1,"stem":"使用多旋翼飞行器作业，（）。","options":[{"key":"A","text":"应在人员密集区，如公园、广场等"},{"key":"B","text":"在规定空域使用，且起飞前提醒周边人群远离"},{"key":"C","text":"不受环境影响"}],"answer":"B","analysis":"提示：操作远离人群\n解析：使用多旋翼飞行器作业，应在规定空域使用，且起飞前提醒周边人群远离，这样可以确保飞行安全，避免对人员和其他设施造成潜在的危险。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0517","type":"single","difficulty":1,"stem":"绕多旋翼飞行器横轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"B","analysis":"提示：横俯仰，立偏航\n解析：飞机在空中飞行,可以产生俯仰运动、偏航运动和滚转运动,绕横轴oz的运动为俯仰运动,绕立轴oy的运动为偏航运动,绕纵轴ox的运动为滚转运动,","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0518","type":"single","difficulty":1,"stem":"绕多旋翼飞行器立轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"C","analysis":"提示：横俯仰，立偏航\n解析：飞机在空中飞行,可以产生俯仰运动、偏航运动和滚转运动,绕横轴oz的运动为俯仰运动,绕立轴oy的运动为偏航运动,绕纵轴ox的运动为滚转运动,","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0519","type":"single","difficulty":1,"stem":"绕多旋翼飞行器纵轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"A","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：飞机在空中飞行,可以产生俯仰运动、偏航运动和滚转运动,绕横轴oz的运动为俯仰运动,绕立轴oy的运动为偏航运动,绕纵轴ox的运动为滚转运动,","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0520","type":"single","difficulty":1,"stem":"为了克服旋翼旋转产生的反作用（），常见的做法是用另一个小型旋翼，即尾桨，在机身尾部产生抵消反向作用的力矩。","options":[{"key":"A","text":"力"},{"key":"B","text":"力矩"},{"key":"C","text":"扭矩"}],"answer":"C","analysis":"提示：扭矩抵消力矩\n解析：为了克服旋翼旋转产生的反作用扭矩，常见的做法是用另一个小型旋翼，即尾桨在机身尾部产生抵消反向作用的力矩。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0521","type":"single","difficulty":1,"stem":"无人机的轴指的是（）。","options":[{"key":"A","text":"舵机轴"},{"key":"B","text":"旋翼轴"},{"key":"C","text":"方向轴"}],"answer":"B","analysis":"提示：旋翼机→旋翼轴\n解析：无人机中的“轴”通常指旋翼的旋转轴，也就是电机带动螺旋桨旋转的轴线。舵机轴是舵机部件 ×方向轴非规范称呼 ×","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0522","type":"single","difficulty":1,"stem":"无人机飞行控制系统速率陀螺是感知飞行器平台（）的传感器。","options":[{"key":"A","text":"姿态角"},{"key":"B","text":"角速度"},{"key":"C","text":"航向角"}],"answer":"B","analysis":"提示：陀螺仪→角速度\n解析：无人机飞行控制系统速率陀螺是感知飞行器平台角速度的传感器，速率陀螺能够测量飞行器平台在各个方向上的角速度变化，从而为飞行控制系统提供重要的数据以实现稳定的飞行控制。当飞行器进行姿态调整或受到外界干扰时，速率陀螺能迅速感知角速度的变化，并将信息反馈给飞行控制系统进行相应的调整和补偿。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0523","type":"single","difficulty":1,"stem":"无人直升机或多旋翼飞行器飞行时间的含义是指（）。","options":[{"key":"A","text":"起飞离地到着陆接地的瞬间"},{"key":"B","text":"起飞滑跑至着陆滑跑终止的瞬间"},{"key":"C","text":"旋翼开始转动至旋翼停止转动的瞬间"}],"answer":"C","analysis":"提示：多旋翼飞行时间跟旋翼机状态相关\n解析：无人直升机或多旋翼飞行器飞行时间的含义是指旋翼开始转动至旋翼停止转动的瞬间，这是因为飞行时间的计算通常是以飞行器动力系统开始工作(即旋翼开始转动)到动力系统停止工作(即旋翼停止转动)的这段时间来衡量的。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0524","type":"single","difficulty":1,"stem":"下列哪个选项中的直升机的分类方式是相同的?","options":[{"key":"A","text":"3代直升机，变模态无人旋翼机，复合无人旋翼机"},{"key":"B","text":"微型直升机，轻型无人直升机，四轴飞行器"},{"key":"C","text":"单旋翼带尾桨式无人直升机，双旋翼共轴式无人直升机，多轴无人飞行器"}],"answer":"C","analysis":"提示：3种无人\n解析：单旋翼带尾桨式无人直升机，双旋翼共轴式无人直升机，多轴无人飞行器的分类方式是相同的，这一组都是按照直升机的旋翼结构和数量来进行分类的。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0525","type":"single","difficulty":1,"stem":"下列哪个因素对多旋翼航拍效果影响最大？","options":[{"key":"A","text":"风速"},{"key":"B","text":"负载体积"},{"key":"C","text":"负载类型"}],"answer":"A","analysis":"提示：航拍→飞行速度&风速\n解析：风速对多旋翼航拍效果影响最大，因为风会引起：机体姿态和位置不断变化；悬停稳定性下降；云台产生修正动作，画面抖动；航线和构图保持困难；电机负荷增大，续航时间缩短。“负载体积”和“负载类型”也会影响飞行，但前提是负载的重量、重心、安装方式等不合理。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0526","type":"single","difficulty":1,"stem":"下列哪个姿态角的变化对多旋翼航拍影响最大?","options":[{"key":"A","text":"俯仰角"},{"key":"B","text":"横滚角"},{"key":"C","text":"航向角"}],"answer":"C","analysis":"提示：多轴航拍→航向角\n解析：航向角的改变会直接导致拍摄方向的变化。比如原本在拍摄一个固定的目标或场景，航向角突然变化可能会使拍摄的主体丢失或偏离预期的拍摄范围。俯仰角的变化主要影响拍摄的上下角度，横滚角的变化主要影响拍摄的左右倾斜角度。虽然它们也会对拍摄效果产生影响，但相对来说，航向角的变化更容易导致整个拍摄画面的大幅度改变。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0527","type":"single","difficulty":1,"stem":"下列哪种方式可以使多旋翼飞行器搭载的摄影装备拍摄角度实现全仰拍摄且不穿帮?","options":[{"key":"A","text":"多轴飞行器使用折叠式脚架"},{"key":"B","text":"多轴飞行器搭载下沉式云台"},{"key":"C","text":"多轴飞行器搭载前探式云台"}],"answer":"C","analysis":"提示：前探云台\n解析：前探式云台能够让摄影设备向前探出，从而实现全仰拍摄并且不会被飞行器的机身或其他部件遮挡，保证拍摄画面的完整性和连贯性。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0528","type":"single","difficulty":1,"stem":"下列哪种方式有可能提高多旋翼飞行器的载重?","options":[{"key":"A","text":"桨叶直径不变，电机功率变小且桨叶总距变小"},{"key":"B","text":"桨叶总距不变，电机功率变大且桨叶直径变大"},{"key":"C","text":"电机功率不变，桨叶直径变大且桨叶总距变大"}],"answer":"B","analysis":"提示：载重要提高，电机功率不能减少或不变\n解析：多旋翼的载重能力，核心取决于旋翼能产生的升力大小，升力越大，载重能力越强。而升力的提升需要「电机能提供足够的动力」+「桨叶能把动力转化为更多升力」单纯的说，电机功率增大、桨叶直径增大、桨叶总距增大，都能提升升力，但是要动力与桨叶相配合。（简单可以理解为，电机与桨叶 要大一起大 才能起到效果）A 选项：电机功率不变，相当于动力的上限固定了，这时候单纯的桨叶直径变大以及总距变大，会让电机的负载超过它能承受的上限，电机转不动或者转速下降，升力反而会降低。B 选项：桨叶总距不变，电机功率变大+ 桨叶直径变大，这两个变化是互相配合的，动力足够的同时，桨叶能把动力转化为更多升力，所以可以提升载重C 选项：电机功率变小+ 桨叶总距变小，这两个变化都会让升力降低，载重能力只会下降","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0529","type":"single","difficulty":1,"stem":"下列哪种形式的旋翼飞行器不是直升机?","options":[{"key":"A","text":"多轴飞行器"},{"key":"B","text":"共轴双旋翼式"},{"key":"C","text":"自转旋翼式"}],"answer":"C","analysis":"提示：自转（直升直上直下，直接掉下来，不自转）\n解析：多轴飞行器通常依靠多个旋翼协同工作来实现飞行和控制;共轴双旋翼式是直升机的一种常见形式，通过上下两个共轴的旋翼来产生升力和控制。 而自转旋翼式飞行器，其旋翼在飞行中是依靠前方来流吹动自转产生升力，与直升机通过发动机驱动旋翼旋转产生升力的方式不同。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0530","type":"single","difficulty":1,"stem":"下列属于现今多旋翼飞行器典型应用的是（）。","options":[{"key":"A","text":"高空长航时侦查"},{"key":"B","text":"航拍、电影取景"},{"key":"C","text":"侦打一体化"}],"answer":"B","analysis":"提示：选非军事→电影\n解析：高空长航时侦查强调长续航，并非常规多旋翼的优势；侦打一体化属于军事任务，不是典型民用应用；多旋翼能悬停、低速飞行，便于灵活调整机位，因此航拍、电影取景是其典型民用应用 √","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0531","type":"single","difficulty":1,"stem":"下面关于多旋翼的说法错误的是（）。","options":[{"key":"A","text":"本质上讲旋翼是一个能量转换部件，它把电动机传来的旋转动能转换成旋翼拉力"},{"key":"B","text":"旋翼的基本功能是产生旋翼拉力"},{"key":"C","text":"旋翼的基本功能是产生前进推力"}],"answer":"C","analysis":"提示：选错的。前进不全面\n解析：多旋翼旋翼的基本功能是产生拉力 √ 旋翼拉力也随之倾斜，其向前的分力推动飞行器前飞。因此，“产生前进推力”不是旋翼的基本功能，","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0532","type":"single","difficulty":1,"stem":"下面说法正确的是（）。","options":[{"key":"A","text":"一般来讲，多旋翼飞行器反扭矩的数值是比较大的"},{"key":"B","text":"多旋翼飞行器在稳定垂直上升时，所有旋翼总的反扭之和增加"},{"key":"C","text":"多旋翼飞行器的反扭矩通过旋翼两两互相平衡"}],"answer":"C","analysis":"提示：多轴→反扭矩两两平衡\n解析：多轴飞行器在稳定垂直上升时，所有旋翼总的反扭之和不变。多轴飞行器通过设计不同旋翼的旋转方向，使其反扭矩两两互相平衡，从而保持飞行器的稳定飞行。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0533","type":"single","difficulty":1,"stem":"相对于传统直升机，多旋翼最大的优势是（）。","options":[{"key":"A","text":"气动效率高"},{"key":"B","text":"载重能力强"},{"key":"C","text":"结构与控制简单"}],"answer":"C","analysis":"提示：优势→简单\n解析：相对于传统直升机，多旋翼通常不需要复杂的旋翼变距机构和尾桨机构，主要通过调节各电机转速来控制姿态，因此机械结构和操纵方式相对简单。但这不等于飞控算法简单。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0534","type":"single","difficulty":1,"stem":"悬停状态的六轴飞行器如何实现向前移动?","options":[{"key":"A","text":"纵轴右侧的螺旋桨减速，纵轴左侧的螺旋桨加速"},{"key":"B","text":"横轴前侧的螺旋桨减速，横轴后侧的螺旋桨加速"},{"key":"C","text":"横轴前侧的螺旋桨加速，横轴后侧的螺旋桨减速"}],"answer":"B","analysis":"提示：同向减速，对向加速\n解析：当悬停状态的六轴飞行器横轴前侧的螺旋桨减速，横轴后侧的螺旋桨加速时，会导致飞行器前部的升力减小，后部的升力增大，从而使飞行器向前倾斜，产生向前的分力，实现向前移动。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0535","type":"single","difficulty":1,"stem":"悬停状态的四轴飞行器如何实现向后移动?","options":[{"key":"A","text":"纵轴右侧的螺旋桨减速，纵轴左侧的螺旋桨加速"},{"key":"B","text":"横轴前侧的螺旋桨减速，横轴后侧的螺旋桨加速"},{"key":"C","text":"横轴前侧的螺旋桨加速，横轴后侧的螺旋桨减速"}],"answer":"C","analysis":"提示：同向减速，对向加速\n解析：当悬停状态的四轴飞行器横轴前侧的螺旋桨加速，横轴后侧的螺旋桨减速时，飞行器的升力增大，后部的升力减小，这会使飞行器向后倾斜。由于飞行器向后倾斜，从而产生一个向后銆的分力，实现向后移动。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0536","type":"single","difficulty":1,"stem":"悬停状态的四轴飞行器如何实现向左移动?","options":[{"key":"A","text":"纵轴右侧的螺旋桨减速，纵轴左侧的螺旋桨加速"},{"key":"B","text":"纵轴右侧的螺旋桨加速，纵轴左侧的螺旋桨减速"},{"key":"C","text":"横轴前侧的螺旋桨加速，横轴后侧的螺旋桨减速"}],"answer":"B","analysis":"提示：同向减速，对向加速\n解析：当悬停状态的四轴飞行器纵轴右侧的螺旋桨加速，纵轴左侧的螺旋桨减速时，飞行器右侧的升力增大，左侧的升力减小。 这会导致飞行器向左倾斜，进而产生向左的分力，实现向左移动。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0537","type":"single","difficulty":1,"stem":"悬停状态下，多旋翼飞行器单个旋翼形成（）。","options":[{"key":"A","text":"正锥体"},{"key":"B","text":"平面"},{"key":"C","text":"倒锥体"}],"answer":"C","analysis":"提示：倒锥\n解析：在悬停时，由于多旋翼飞行器的旋翼需要产生升力来克服重力并保持平衡，每个旋翼的拉力方向都指向飞行器的重心，从而形成了倒锥体的形状。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0538","type":"single","difficulty":1,"stem":"旋翼机下降过程中，正确的方法是（）。","options":[{"key":"A","text":"一直保持快速垂直下降"},{"key":"B","text":"先慢后快"},{"key":"C","text":"先快后慢"}],"answer":"C","analysis":"提示：下降→先快后慢\n解析：旋翼机下降过程中，正确的方法是先快后慢，在旋翼机下降的初始阶段，可以适当保持较快的下降速度，但在接近地面时，需要逐渐减慢下降速度，以确保平稳着陆减少冲击和损坏的风险。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0539","type":"single","difficulty":1,"stem":"飞行器是否轴数越多载重能力越大？","options":[{"key":"A","text":"是"},{"key":"B","text":"不是"},{"key":"C","text":"不一定"}],"answer":"C","analysis":"提示：不一定\n解析：多轴飞行器的载重能力不仅仅取决于轴的数量，还与电机功率、桨叶尺寸和质量、飞行器的整体结构设计等多种因素有关。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0540","type":"single","difficulty":1,"stem":"以下不是多旋翼飞行器优点的是（）。","options":[{"key":"A","text":"结构简单"},{"key":"B","text":"成本低廉"},{"key":"C","text":"气动效率高"}],"answer":"C","analysis":"提示：选错的。气动效率高×\n解析：多旋翼飞行器的结构简单，易于制造和维护，成本相对较低，这是其优点。但在气动效率方面，多旋翼飞行器通常不如固定翼飞行器。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0541","type":"single","difficulty":1,"stem":"以下飞行器不是多旋翼飞行器的是（）。","options":[{"key":"A","text":"Phantom精灵"},{"key":"B","text":"Inspire悟"},{"key":"C","text":"Uh-60黑鹰"}],"answer":"C","analysis":"提示：黑鹰（常规直升机）\n解析：Phantom精灵和Inspire悟都是知名的多旋翼飞行器品牌，它们通常配备有多个旋翼(如四轴、六轴等)，以实现稳定的飞行和拍摄功能。Uh-60黑鹰则是一种常规直升机，它采用单旋翼带尾桨的布局，与多旋翼飞行器的设计原理和结构有显著不同。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0542","type":"single","difficulty":1,"stem":"以下说法错误的是（）？","options":[{"key":"A","text":"一般来讲，常规直升机尺度较大，多轴飞行器尺度较小"},{"key":"B","text":"一般来讲，常规直升机以油动为主，多轴飞行器基本都是电动力"},{"key":"C","text":"一般来讲，常规直升机飞行中主要改变转速，多轴飞行器飞行中主要改变桨距"}],"answer":"C","analysis":"提示：选错的。多轴改转速，直升改桨距\n解析：常规直升机主要通过改变旋翼桨距控制飞行；常规多旋翼主要通过改变各旋翼转速控制飞行。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0543","type":"single","difficulty":1,"stem":"影响悬停稳定性的因素不包括（）。","options":[{"key":"A","text":"起落架形式"},{"key":"B","text":"风的影响"},{"key":"C","text":"地面效应"}],"answer":"A","analysis":"提示：选错的。起落架形式 （地面效应为地面热气流，影响飞行稳定）\n解析：影响悬停稳定性的因素不包括起落架形式，风的影响会导致飞行器受到不稳定的外力，地面效应会改变飞行器周围的气流从而影响悬停稳定性。起落架形式主要影响飞行器的起降性能和地面操作便利性，对悬停稳定性没有直接影响。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0544","type":"single","difficulty":1,"stem":"在多旋翼飞行器航空摄影中，日出日落拍摄时，摄像机白平衡调整应调整为（）以拍出正常白平衡画面。","options":[{"key":"A","text":"高色温值"},{"key":"B","text":"低色温值"},{"key":"C","text":"闪光灯模式"}],"answer":"B","analysis":"提示：白平衡→低色温\n解析：白平衡是摄像机的一个重要参数，它用于调整图像中白色物体的颜色，以确保在不同光照条件下拍摄出的图像颜色准确。日出日落时，由于太阳位置较低，光线经过大气层的折射和散射，使得光线中的红色橙色等暖色调成分增加，导致整体色温偏低。 在多旋翼飞行器航空摄影中，日出日落拍摄时，摄像机白平衡调整应调整为低色温值以拍出正常自平衡画面。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0545","type":"single","difficulty":1,"stem":"在多旋翼飞行任务中，触发失控返时，应如何打断飞控当前任务，取回手动控制权?","options":[{"key":"A","text":"GPS手动模式切换"},{"key":"B","text":"云台状态切换"},{"key":"C","text":"航向锁定切换"}],"answer":"A","analysis":"提示：问题对答案，手动对手动\n解析：主流飞控执行失控返航、定点悬停、航线等任务时，唯一合法打断方式就是：遥控切手动模式，立刻终止自动任务，回归人工操控。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0546","type":"single","difficulty":1,"stem":"在升高与下降过程中，无人直升机与多旋翼飞行器表述正确的是（）。","options":[{"key":"A","text":"无人直升机主要改变旋翼总距，多轴飞行器主要改变旋翼转速"},{"key":"B","text":"无人直升机主要改变旋翼转速，多轴飞行器主要改变旋翼总距"},{"key":"C","text":"无人直升机主要改变旋翼转速，多轴飞行器同样改变旋翼转速"}],"answer":"A","analysis":"提示：多轴改转速，直升改总距\n解析：常规无人直升机升降时，主要通过改变旋翼的总距来调节升力；常规多旋翼使用定距螺旋桨，主要通过改变各旋翼的转速来调节总拉力。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0547","type":"single","difficulty":1,"stem":"X模式6轴飞行器从悬停转换到向左平移，哪两个轴需要减速?","options":[{"key":"A","text":"横轴右侧"},{"key":"B","text":"纵轴左侧"},{"key":"C","text":"横轴左侧"}],"answer":"B","analysis":"提示：6悬左→纵左\n解析：在X模式中，要实现向左平移，左侧的两个轴需要减速，右侧的两个轴加速，从而产生向左的推力，使飞行器向左移动。（中间 2 个旋翼是 “左右对称中心”，纯升力补充，在左右平移时无需变化。）","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0548","type":"single","difficulty":1,"stem":"关于部分多旋翼飞行器，机臂上反角设计描述错误的是（）？","options":[{"key":"A","text":"提高稳定性"},{"key":"B","text":"提高机动性"},{"key":"C","text":"提高载荷作业空间"}],"answer":"B","analysis":"提示：选错的。上反角→机动性×\n解析：机臂上反角设计的核心价值在于优化飞行稳定性和作业实用性，而非增强机动性，这一设计的功能逻辑与机动性提升存在直接冲突。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0549","type":"single","difficulty":1,"stem":"关于桨叶的剖面形状说法错误的是（）？","options":[{"key":"A","text":"桨叶的剖面形状为桨叶翼型"},{"key":"B","text":"一般用相对厚度、最大厚度位置、相对弯度、最大弯度位置等参数来说明桨叶翼型"},{"key":"C","text":"桨叶翼型常见的有平凸型、双凸型和非对称型"}],"answer":"C","analysis":"提示：选错的。凸×\n解析：桨叶翼型常见的有平凸型、双凸型等，但平凸型和双凸型本质上都属于非对称翼型，因此将“非对称型”与平凸型和双凸型并列是不准确的。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0550","type":"single","difficulty":1,"stem":"下列说法错误的是(没有提到的条件则视为相同)？","options":[{"key":"A","text":"旋翼直径越大则桨盘载荷越小"},{"key":"B","text":"旋翼直径越大则悬停诱导速度越大"},{"key":"C","text":"旋翼直径越大则拉力越大"}],"answer":"B","analysis":"提示：选错的。直径大诱导大×\n解析：悬停诱导速度与旋翼直径成反比。 直径越大，气流在桨盘处的加速越平缓，诱导速度越小。 (知识点来自蓝皮书-8.1.2旋翼带尾桨无人直升机:大的旋翼直径可以有效地提高旋翼拉力,因为旋翼拉力同旋翼半径的四次方成正比。旋翼直径大,则旋翼的桨盘载荷小,悬停诱导速度就小,这样可以有效地降低旋翼诱阻功率)","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0551","type":"single","difficulty":1,"stem":"四轴飞行器如何实现控制？","options":[{"key":"A","text":"通过调整不同旋翼之间的总距"},{"key":"B","text":"通过调整不同旋翼之间倾斜角度"},{"key":"C","text":"通过调整不同旋翼之间相对转速"}],"answer":"C","analysis":"提示：4轴控制→转速\n解析：四轴飞行器通过改变四个电机的转速来改变旋翼转速 ，实现升力的变化 ，从而控制飞行器姿态的姿态和位置。直升机是改变尾桨的桨距，固定翼是靠偏转舵面。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0552","type":"single","difficulty":1,"stem":"多旋翼飞行器的螺旋桨（）。","options":[{"key":"A","text":"桨根处角速度等于桨尖处角速度"},{"key":"B","text":"桨根处线速度大于桨尖处线速度"},{"key":"C","text":"桨根处升力系数小于桨尖处升力系数"}],"answer":"A","analysis":"提示：半径↑角速度相同 线速度↑升力系数↓\n解析：螺旋桨作为刚性整体，绕中心轴同步旋转，各点的角速度（单位时间内转过的角度）完全相同，与该点到轴心的距离（半径）无关。这是刚性旋转体的基本物理属性。而线速度和升力系数则随半径变化。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0553","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的动力电池一般为（）。","options":[{"key":"A","text":"Li-po"},{"key":"B","text":"Ni-Cd"},{"key":"C","text":"Ni-MH"}],"answer":"A","analysis":"提示：锂电池\n解析：多旋翼飞行器使用的动力电池一般为锂聚合物电池(Li-po)。锂聚合物电池作为锂离子电池的一种变种，具有更高的能量密度和更轻的重量，非常适合用于多旋翼飞行器等需要高性能电池的应用场景。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0554","type":"single","difficulty":1,"stem":"聚合物锂电池单体充满电后的电压一般为（）。","options":[{"key":"A","text":"4.2V"},{"key":"B","text":"3.7V"},{"key":"C","text":"3.3V"}],"answer":"A","analysis":"提示：充满4.2\n解析：单节电池电压一般为 3.7V,充满约 4.2V","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0555","type":"single","difficulty":1,"stem":"以下种类的电池，具有记忆效应的是（）。","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"铅酸电池"}],"answer":"B","analysis":"提示：记忆效应镍镉\n解析：记忆效应会导致电池容量下降，即若未完全放电就充电，电池会 “记住” 未放电部分，后续仅能在该范围内充放电。聚合物锂电池和铅酸电池基本无记忆效应，使用时无需刻意完全放电，可随用随充，而镍镉电池需定期完全充放电以缓解记忆效应。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0556","type":"single","difficulty":1,"stem":"一块聚合物锂电池上标有25C字样，C代表( )。","options":[{"key":"A","text":"充电倍率"},{"key":"B","text":"容量倍率"},{"key":"C","text":"放电倍率"}],"answer":"C","analysis":"提示：大数放电倍率\n解析：在电池领域，C 值（C-rate）是衡量电池充放电电流大小的单位，是按照电池的标称容量最大可达到多大的放电电流。1C表示电池在1小时内完全放电的电流值。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0557","type":"single","difficulty":1,"stem":"多旋翼飞行器通过改变（）控制飞行轨迹。","options":[{"key":"A","text":"总距杆"},{"key":"B","text":"转速"},{"key":"C","text":"尾桨"}],"answer":"B","analysis":"提示：转速控制飞行轨迹\n解析：多旋翼飞行器的飞行控制核心逻辑是通过调整不同电机的转速，改变各旋翼的升力，进而控制飞行轨迹，这与固定翼或单旋翼直升机的控制方式有本质区别。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0558","type":"single","difficulty":1,"stem":"当多旋翼飞行器地面站出现飞行器电压过低报警时，第一时刻采取的措施是()？","options":[{"key":"A","text":"一键返航"},{"key":"B","text":"控制姿态，逐渐减低高度，迫降至地面"},{"key":"C","text":"结合飞行器位置判断是否满足安全返航条件"}],"answer":"C","analysis":"提示：先判断再操作\n解析：电压过低意味着飞行器电量已接近临界值，继续飞行可能导致动力丧失，直接坠落。一键返航虽然方便，但如果电量不足，飞行器可能在返航途中坠毁或失联。直接迫降虽然能避免坠落，但如果当前位置不安全，可能造成更大损失。因此，第一时间判断当前位置是否安全、是否具备返航条件是最合理的操作，之后再决定是返航还是迫降。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0559","type":"single","difficulty":1,"stem":"多旋翼飞行器悬停时的平衡不包括（）。","options":[{"key":"A","text":"诱导阻力平衡"},{"key":"B","text":"俯仰平衡"},{"key":"C","text":"升力平衡"}],"answer":"A","analysis":"提示：选错的。诱导阻力×\n解析：多旋翼悬停状态：升力平衡、俯仰平衡、横滚平衡、方向平衡俯仰平衡：前后机头上下的平衡，悬停必须保持，包含在内。升力平衡：悬停升力 = 重力，必须平衡。诱导阻力平衡：诱导阻力是旋翼向前、向后、侧向机动飞行时才明显存在的附加阻力；悬停静止无诱导阻力，不需要平衡。","tags":[],"chapter":"多旋翼","
