版《中华人民共和国民用航空法》第三十七条:具有中华人民共和国国籍的民用航空器，应当持有国务院民用航空主管部门颁发的适航证书，方可飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0702","type":"single","difficulty":1,"stem":"从事飞行的民用航空器不需要携带的文件是（）。","options":[{"key":"A","text":"飞行人员相应的执照或合格证"},{"key":"B","text":"民用航空器适航证书"},{"key":"C","text":"飞行记录本"}],"answer":"C","analysis":"提示：个人飞行记录本× 不带\n解析：根据旧版《中华人民共和国民用航空法》第九十条，民用航空器适航证书√ 机组人员相应的执√都要携带！“飞行记录本”是飞行人员个人的飞行经历记录本，而不是航空器的“航行记录簿”。所以不用×","tags":[],"bankId":"uav-selected"},{"id":"sel-0703","type":"single","difficulty":1,"stem":"无人机驾驶员在执行飞行任务时，应当随身携带（）。","options":[{"key":"A","text":"驾驶员执照或合格证"},{"key":"B","text":"飞机适航证书"},{"key":"C","text":"飞行记录本"}],"answer":"A","analysis":"提示：驾驶员执照或合格=开车驾照\n解析：执行飞行任务时，驾驶员应随身携带能够证明其操控资格的执照或合格证。驾驶员执照或合格证类似于开车时的驾驶证，驾驶员执行任务时应随身携带。","tags":[],"bankId":"uav-selected"},{"id":"sel-0704","type":"single","difficulty":1,"stem":"《中华人民共和国民用航空法》自（）起施行。","options":[{"key":"A","text":"1996年01月01日"},{"key":"B","text":"1996年03月01日"},{"key":"C","text":"1997年01月01日"}],"answer":"B","analysis":"提示：法施行631\n解析：《中华人民共和国民用航空法》于1995年10月30日通过，并自1996年3月1日起施行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0705","type":"single","difficulty":1,"stem":"对于多旋翼飞行器，（）。","options":[{"key":"A","text":"旋翼只起升力面的作用"},{"key":"B","text":"旋翼只充当纵横向和航向的操纵面"},{"key":"C","text":"旋翼既是升力面又是纵横向和航向的操纵面"}],"answer":"C","analysis":"提示：即又\n解析：多旋翼的旋翼既产生升力，又通过分别改变各旋翼的转速产生操纵力矩：差动调速控制横滚；差动调速控制俯仰；改变旋向相反旋翼的转速差控制偏航。因此，旋翼同时是升力面和纵向、横向、航向的操纵面。","tags":[],"bankId":"uav-selected"},{"id":"cmp-0001","type":"single","difficulty":1,"stem":"(电台、接收机、调速器、电池、GPS、电机)多旋翼无人机以下哪个组设备连接是正确的?","options":[{"key":"A","text":"调速-电机-GPS-接收机"},{"key":"B","text":"接收机-调速器-电池-电台"},{"key":"C","text":"电池-调速器-电机"}],"answer":"C","analysis":"提示：3项，电-调-电，无GPS\n解析：对于多旋翼无人机，电池连接调速器，调速器连接电机，接收机接收信号并与其他设备如电台等交互，所以正确的连接是电池-调速器-电机。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0002","type":"single","difficulty":1,"stem":"10000mAh/6S/15C的电池充电，设置安全电流多少安?","options":[{"key":"A","text":"150A"},{"key":"B","text":"10A"},{"key":"C","text":"60A"}],"answer":"B","analysis":"提示：安全电流=电池容量10000mAh=10Ah\n解析：C代表放电倍率，15C表示以电池容量的15倍放电安全充电电流一般为1C，即电池容量为10000mAh，换算为10A。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0003","type":"single","difficulty":1,"stem":"10000mAh电池1A充电，充电倍率是多少?","options":[{"key":"A","text":"1.0C"},{"key":"B","text":"0.1C"},{"key":"C","text":"10C"}],"answer":"B","analysis":"提示：10000mAh=10Ah 充电倍率=充电电流:电池容量 1A/10A=0.1\n解析：10000mAh 电池以1A充电，充电倍率=充电电流:电池容量，1A:10000mAh=1A:10Ah=0.1C。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0004","type":"single","difficulty":1,"stem":"1045 CCW其含义是（）。","options":[{"key":"A","text":"桨叶直径10in，螺距45in，顺时针"},{"key":"B","text":"桨叶直径10mm，螺距4.5mm，逆时针"},{"key":"C","text":"桨叶直径10in，螺距4.5in，逆时针"}],"answer":"C","analysis":"提示：尺寸英寸in，CCW逆时针\n解析：桨叶直径10in(英寸)，螺距4.5in(英寸)，逆时针旋转CCW即counter-clockwise的缩写)","tags":[],"bankId":"uav-qa"},{"id":"cmp-0005","type":"single","difficulty":1,"stem":"1865桨300KV电机，2045桨500KV电机同一架多轴，如果在高海拔地区飞行，应该选择哪种桨和电机的组合?","options":[{"key":"A","text":"2045桨500KV电机"},{"key":"B","text":"1865桨300KV电机"},{"key":"C","text":"都可以"}],"answer":"A","analysis":"提示：海拔高需要高KV+大直径\n解析：高海拔地区空气稀薄，需要更大的桨叶直径和更高的电机KV值来保持足够的升力。2045桨直径大且500KV电机比 1865桨和300KV电机组合能提供更大的升力，所以应该选择2045桨500KV电机组合。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0006","type":"single","difficulty":1,"stem":"1英寸等于多少厘米?","options":[{"key":"A","text":"2.54厘米"},{"key":"B","text":"25.4厘米"},{"key":"C","text":"254厘米"}],"answer":"A","analysis":"提示：2.54\n解析：1英寸等于2.54厘米","tags":[],"bankId":"uav-qa"},{"id":"cmp-0007","type":"single","difficulty":1,"stem":"4S，16000毫安时电池1.5C充电，充电器应设置充电电流多少安培?","options":[{"key":"A","text":"12"},{"key":"B","text":"18"},{"key":"C","text":"24"}],"answer":"C","analysis":"提示：16000毫安时0=16A时 16*1.5C=24A\n解析：对于4S(4节串联)、16000毫安时电池，1.5C充电，C 代表电池容量倍率，1C就是1倍电池容量的电流。16000毫安时=16安时，1.5C充电电流为16x1.5=24安培。所以充电器应设置充电电流24安培。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0008","type":"single","difficulty":1,"stem":"4S5000mAh，2C充电，多久充满?","options":[{"key":"A","text":"1小时"},{"key":"B","text":"2小时"},{"key":"C","text":"0.5小时"}],"answer":"C","analysis":"提示：充满时间仅与C值有关。 2C: 1/2=0.5小时（如为10C，则1/10=0.1小时）\n解析：2C充电意味着电池可以在其额定容量的两倍电流下充电，即在半小时内充满电池。对于5000mAh的电池，1C充电电流就是5000mA(5A)，而2C充电电流则是这个数值的两倍，即10000mA(10A)。充电时间(小时)=电池容量(mAh)/充电电流(mA)。充电时间=5000mAh/10000mA=0.5小时。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0009","type":"single","difficulty":1,"stem":"6S，30000mAh电池它驱动电机的功率怎么算?","options":[{"key":"A","text":"6*30000mAh"},{"key":"B","text":"25.2*30mAh"},{"key":"C","text":"25.2*30A"}],"answer":"C","analysis":"提示：30000mAh=30Ah 单节电池电压3.7-4.2 6S串联，电压累积，电流不变。4.2*6=25.2 功率=电压x电流 功率=25.2*30\n解析：6S表示6节电池串联，单节电池电压一般为3.7V(充满约 4.2V)，6S总电压约为 6x4.2=25.2V，30000mAh=30Ah功率=电压x电流，电流单位为安(A)，30000mAh换算为30A，功率为25.2x30A。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0010","type":"single","difficulty":1,"stem":"6S15000mAh电池，0.5C充电，应该调成几安充电?","options":[{"key":"A","text":"30A"},{"key":"B","text":"15A"},{"key":"C","text":"7.5A"}],"answer":"C","analysis":"提示：6S串联电流不变15000mAh/1000=15Ah 15*0.5=7.5\n解析：对于6S15000mAh电池，0.5C充电。C表示电池容量倍率，1C就是1倍电池容量的电流，15000mAh=15Ah，0.5C充电电流为 15x0.5=7.5A.","tags":[],"bankId":"uav-qa"},{"id":"cmp-0011","type":"single","difficulty":1,"stem":"6S1P、10000mAh、20C电池，当两块电池并联，最大放电电流多少安?","options":[{"key":"A","text":"200A"},{"key":"B","text":"120A"},{"key":"C","text":"400A"}],"answer":"C","analysis":"提示：10000mAh=10Ah 10*20C=200 2块并联，电压不变电流*2 200*2=400\n解析：一块6S1P、10000mAh、20C电池，最大放电电流为 10000mAhx20=10Ax20=200A。当两块电池并联时，最大放电电流为200Ax2=400A。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0012","type":"single","difficulty":1,"stem":"CW1545和CCW14X6螺旋桨，哪个螺距大?","options":[{"key":"A","text":"CW1545"},{"key":"B","text":"CCW14X6"},{"key":"C","text":"一样大"}],"answer":"B","analysis":"提示：螺距后两位，X6等于6X=60>45\n解析：CW1545螺旋桨的螺距为4.5英寸，CCW14X6螺旋桨的螺距为6英寸，因此是CCW14X6的螺距大。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0013","type":"single","difficulty":1,"stem":"飞机飞行中通过什么与地面站连接?","options":[{"key":"A","text":"飞控，GPS"},{"key":"B","text":"WiFi模块，电台"},{"key":"C","text":"接收机，遥控器"}],"answer":"B","analysis":"提示：wifi 电台\n解析：飞机飞行中通过WIFI模块、电台与地面站连接。飞控和 GPS主要用于飞机自身的飞行控制和定位，不是与地面站连接的主要方式；接收机和遥控器是飞机与操控者之间的局部连接，不是与地面站连接的方式。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0014","type":"single","difficulty":1,"stem":"飞行前检查的第一项是（）。","options":[{"key":"A","text":"重心"},{"key":"B","text":"紧固件"},{"key":"C","text":"电压"}],"answer":"B","analysis":"提示：紧固件第一\n解析：飞行前检查的第一项是紧固件。紧固件的检查确保飞机结构的稳固性，是飞行安全的重要基础。重心检查通常在紧固件等关键结构检查之后;电压检查一般也在结构检查之后进行。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0015","type":"single","difficulty":1,"stem":"飞行中地面站里显示滚转角为零，目视飞机有明显的坡度，原因是什么?","options":[{"key":"A","text":"GPS故障"},{"key":"B","text":"磁罗盘故障"},{"key":"C","text":"陀螺仪故障"}],"answer":"C","analysis":"提示：陀螺仪负责角度（GPS定位，罗盘方向）\n解析：飞行中地面站里显示滚转角为零，目视飞机有明显的坡度，原因是陀螺仪故障。陀螺仪主要负责测量飞机的角速度和角度，如果陀螺仪故障，可能会导致角度显示错误。GPS故障主要影响定位;磁罗盘故障主要影响方向。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0016","type":"single","difficulty":1,"stem":"把无人机螺旋桨换成小桨，做同样的动作，角速度怎么变化?","options":[{"key":"A","text":"角速度转数减少"},{"key":"B","text":"角速度转数增加"},{"key":"C","text":"角速度转数不变"}],"answer":"B","analysis":"提示：同样动作，大慢小快，转数↑\n解析：什么是角速度？单位时间内转过的角除以时间 就是角速度直白的说：每秒 / 每分钟转了多大角度，就是角速度。螺旋桨从大桨换成小桨叶，完成同样的动作就要转的更快才行，角速度必然增加。（就比如自行车从原来是大轮子，换成小轮子以后，想在同样时间完成一样的距离，就要蹬的更快，对于车轮来说，同样时间内转的角度更多了，角速度就更大）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0017","type":"single","difficulty":1,"stem":"保持油门不变飞机匀速上升，螺旋桨转速怎么变化?","options":[{"key":"A","text":"增加"},{"key":"B","text":"不变"},{"key":"C","text":"减小"}],"answer":"A","analysis":"提示：高度↑，空气密度↓，升力↓，想保持匀速上升，必须转速↑\n解析：油门不变表示发送给电调或发动机的控制指令不变，不代表螺旋桨转速或实际输出功率不变。随着飞机上升，空气密度降低，螺旋桨受到的空气阻力转矩减小。在油门保持不变的情况下，发动机或电机会加速至新的转矩平衡状态，因此螺旋桨转速增加。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0018","type":"single","difficulty":1,"stem":"保持油门持续爬升，电机功率会增加还是减小?","options":[{"key":"A","text":"增加"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"C","analysis":"提示：电动机功率不变\n解析：在保持油门持续爬升的情况下，电机功率不变。油门控制发动机燃料供应，调节输出功率。持续爬升时，油门位置不变，虽发动机功率用于克服重力，但电机功率本身不变，它取决于设计参数和工作条件非高度变化所自动调整。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0019","type":"single","difficulty":1,"stem":"扁粗电机和细长电机的特点是（）。","options":[{"key":"A","text":"扁粗电机扭矩大，转速高;细长电机扭矩相对较小，转速小"},{"key":"B","text":"扁粗电机扭矩小，转速低;细长电机扭矩相对较高，转速高"},{"key":"C","text":"扁粗电机扭矩大，转速低;细长电机扭矩相对较小，转速高"}],"answer":"C","analysis":"提示：粗大低，细小高\n解析：扁粗电机通常具有扭矩大、转速低的特点。这是因为其结构设计使得电机在较低转速下能够产生较大的扭力，适用于需要较大扭矩输出的场合。 细长电机则扭矩相对较小，转速高。其外形设计有利于提高电机的转速，适用于对转速要求较高而扭矩需求相对较小的情况。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0020","type":"single","difficulty":1,"stem":"标有4S-6S的电调，最大允许多大电压?","options":[{"key":"A","text":"22.2V"},{"key":"B","text":"25.2V"},{"key":"C","text":"44.4V"}],"answer":"B","analysis":"提示：串联电压累积 单节电池电压3.7-4.2 4.2*6=25.2\n解析：一般情况下，单节锂电池的电压范围约为3.7V- 4.2V。 4S即4节锂电池串联，总电压为 4x4.2=16.8；6S即6节锂电池串联，总电压为6x4.2=25.2V。 标有4S-6S的电调，最大允许25.2V电压。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0021","type":"single","difficulty":1,"stem":"伯努利定理，指的是（）。","options":[{"key":"A","text":"由于能量守恒定律，同一流管内横截面积大的地方静压更小"},{"key":"B","text":"由于能量守恒定律，同一流管内流速快的地方静压大"},{"key":"C","text":"由于能量守恒定律，同一流管内流速快的地方静压小"}],"answer":"C","analysis":"提示：伯努利，流速大,静压小\n解析：伯努利定理指出，在同一流管中，由于能量守恒定律，流速快的地方静压小。这是因为流速增加时，动能增加，而总能量（动能+静压能)保持不变，所以静压能减小。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0022","type":"single","difficulty":1,"stem":"常规布局直升机尾桨的作用不包括（）。","options":[{"key":"A","text":"抵消反扭矩"},{"key":"B","text":"改变航向"},{"key":"C","text":"减少噪声"}],"answer":"C","analysis":"提示：选错的，噪声×\n解析：常规布局直升机的尾桨主要作用是抵消主旋翼产生的反扭矩，以保持直升机的航向稳定性，同时也可以通过调整尾桨的推力来改变直升机的航向。减少噪声并非其主要作用。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0023","type":"single","difficulty":1,"stem":"常用电调线的数量不包括（）。","options":[{"key":"A","text":"8根"},{"key":"B","text":"7根"},{"key":"C","text":"6根"}],"answer":"C","analysis":"提示：选错的。78都√，6×\n解析：在常用的电调线配置中，通常包括的信号线有电源线、地线、信号线以及可能存在的其他功能线，总数一般为7根或8根，具体取决于电调的设计和功能需求。6根不是常用配置。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0024","type":"single","difficulty":1,"stem":"常用地面站卡尔曼滤波正常值是多 少?","options":[{"key":"A","text":"正负5以内"},{"key":"B","text":"正负10以上"},{"key":"C","text":"正负10以内"}],"answer":"C","analysis":"提示：正负 10 以内\n解析：在地面站使用卡尔曼滤波进行数据处理时，其正常值的波动范围通常应在正负10以内。这个范围反映了滤波算法的稳定性和准确性，确保数据处理的可靠性和有效性。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0025","type":"single","difficulty":1,"stem":"成品6S12000mAh30C电池，该电池单片电芯容量多少mAh，该电池电压多少适合存放?","options":[{"key":"A","text":"12000mAh，22.8-23.4"},{"key":"B","text":"12000mAh，22.2-25.2"},{"key":"C","text":"12000mAh，21.6-22.8"}],"answer":"A","analysis":"提示：存放电压，比亏多比满少，40%至50%， 介于22.2-25.2之间， 选22.8-23.4\n解析：对于成品6S12000mAh30C电池，其单片电芯容量直接由产品规格给出，即12000mAh。关于存放电压，锂电池通常有一个推荐的存放电压范围22.8-23.4V是一个常见范围。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0026","type":"single","difficulty":1,"stem":"成品lipo 6S 1p 12000mAh30C电池，该电池单片电芯容量是（）。","options":[{"key":"A","text":"12000mAh"},{"key":"B","text":"72000mAh"},{"key":"C","text":"24000mAh"}],"answer":"A","analysis":"提示：电芯容量单位Ah 串联电流不变，单片还是 12000mAh （30C,C代表放电倍率,与本题无关不但与计算）\n解析：对于成品lipo 6s 1p 12000mAh30c电池，6s 1p表明电池由6个电芯串联和1个电芯并联组成，而“12000mAh”表示整个电池的容量。由于并联数为1，单片电芯容量即整个电池容量，因此是12000mAh。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0027","type":"single","difficulty":1,"stem":"成品lipo1p10000mAh25C(3C)电池，请问该电池可设定的最大充电电流为多少安?","options":[{"key":"A","text":"20A"},{"key":"B","text":"30A"},{"key":"C","text":"40A"}],"answer":"B","analysis":"提示：10000mAh=10Ah 10*3=30 （大值C放电倍率，小值C充电倍率）\n解析：对于成品lipo1p10000mAh25C(3C)电池“10000mAh”代表电池容量，“3C”表示该电池的最大充电倍率为3C。因此，最大充电电流为电池容量乘以充电倍率，即10000mAh*3=30000mA=30A。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0028","type":"single","difficulty":1,"stem":"伺服舵机由哪几部分组成?","options":[{"key":"A","text":"外壳，控制电路，电机，减速齿轮组，电位器"},{"key":"B","text":"外壳，控制电路，减速齿轮组，电位器"},{"key":"C","text":"控制电路，电机，减速齿轮组，电位器"}],"answer":"A","analysis":"提示：5部分，外壳带电机\n解析：伺服舵机主要由外壳、控制电路、电机、减速齿轮组和电位器五部分组成。外壳用于保护内部结构，控制电路负责接收和处理信号，电机提供动力，减速齿轮组降低转速增加扭矩，电位器用于反馈位置信息。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0029","type":"single","difficulty":1,"stem":"单块电池容量为6000mAh，3S4P电池组满电下提供的电压和容量分别为多少?","options":[{"key":"A","text":"电压:12.6V，容量:24000mAh"},{"key":"B","text":"电压:12.6V，容量:6000mAh"},{"key":"C","text":"电压:11.1V，容量:24000mAh"}],"answer":"A","analysis":"提示：3S4P，3块串联，4组并联 电压：4.2*3=12.6 容量：6000*4=24000\n解析：对于3S4P电池组，“3S”表示3个电芯串联，通常单个锂电芯的满电电压为4.2V，所以3S的满电电压为4.2V*3=12.6V;“4P”表示4个电芯并联，容量相加，所以总容量为6000mAh*4=24000mAh。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0030","type":"single","difficulty":1,"stem":"单旋翼带尾桨直升机典型尾桨构造是（）。","options":[{"key":"A","text":"无轴承式"},{"key":"B","text":"多叶铰接式、多叶万向接头式"},{"key":"C","text":"以上都是"}],"answer":"C","analysis":"提示：以上都是\n解析：单旋翼带尾桨直升机的典型尾桨构造有多种，其中包括无轴承式、多叶铰接式、多叶万向接头式等，这些不同的构造方式各有特点，共同为直升机的稳定飞行提供支持。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0031","type":"single","difficulty":1,"stem":"地面站链路属于（）。","options":[{"key":"A","text":"上行"},{"key":"B","text":"下行"},{"key":"C","text":"上下行"}],"answer":"C","analysis":"提示：地面站上下行\n解析：地面站链路既包括上行链路，即从地面站向飞行器发送控制信号等;也包括下行链路，即飞行器向地面站回传数据、图像等信息，所以地面站链路属于上下行。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0032","type":"single","difficulty":1,"stem":"地面站中无线电波长越长，绕射能力越（）。","options":[{"key":"A","text":"强"},{"key":"B","text":"弱"},{"key":"C","text":"没变化"}],"answer":"A","analysis":"提示：波长长，绕开强，穿透弱\n解析：无线电波长越长，绕射能力越强。波长较长的无线电波能够更容易地绕过障碍物，如建筑物、山脉等。而波长短的无线电波更倾向于直线传播，绕射能力较弱。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0033","type":"single","difficulty":1,"stem":"地面站中无线电频率越小，穿透能力越（）。","options":[{"key":"A","text":"强"},{"key":"B","text":"弱"},{"key":"C","text":"没变化"}],"answer":"B","analysis":"提示：频率小，波长长，绕开强，穿透弱\n解析：无线电频率越小，波长越长。长波长的无线电波绕射能力强，但穿透能力弱。而频率高、波长短的无线电波穿透能力相对较强，所以频率越小，穿透能力越弱。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0034","type":"single","difficulty":1,"stem":"地面站，飞机电，遥控器，哪个是检查程序中最后一项?","options":[{"key":"A","text":"地面站"},{"key":"B","text":"飞机电"},{"key":"C","text":"遥控器"}],"answer":"B","analysis":"提示：手上地上天上（遥地天）\n解析：检查程序中，一般先检查遥控器的功能是否正常，接着检查地面站的各项参数设置等，最后检查飞行器本身的状态，包括飞机电等部件，确保飞行安全。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0035","type":"single","difficulty":1,"stem":"典型的无人直升机由哪几部分组成?","options":[{"key":"A","text":"旋翼系统、传动系统、发动机、尾桨系统"},{"key":"B","text":"旋翼系统、传动系统、发动机、尾桨翼"},{"key":"C","text":"旋翼系统、传动系统、发动机、副翼"}],"answer":"A","analysis":"提示：发动机+3系统\n解析：典型的无人直升机由旋翼系统提供升力和控制方向，传动系统传递动力，发动机提供动力源，尾桨系统用于平衡主旋翼产生的扭矩，共同组成无人直升机的主要部分。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0036","type":"single","difficulty":1,"stem":"电池放在机体哪里方式飞行更灵活?","options":[{"key":"A","text":"中间"},{"key":"B","text":"上面"},{"key":"C","text":"下面"}],"answer":"B","analysis":"提示：上面灵活下面稳\n解析：将电池放在机体上面的方式飞行更灵活。因为将电池放在上面可以使飞机的重心相对靠上，飞机在做动作时反应更加灵敏，机动性更好，从而飞行更灵活。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0037","type":"single","difficulty":1,"stem":"电调的主要作用不包括（）。","options":[{"key":"A","text":"改变电机转速"},{"key":"B","text":"直流电变交流电"},{"key":"C","text":"改变电流大小"}],"answer":"C","analysis":"提示：电调主要功能不包括“改变电流大小” 属于间接功能\n解析：电调全称为电子调速器核心作用：直流变交流√、调节电机转速与扭矩√、给电机供电、接收和反馈控制信号附加作用：测温与过热保护、失控保护、测速、定速、BEC输出、刹车、其他可调作用：进角、油门曲线","tags":[],"bankId":"uav-qa"},{"id":"cmp-0038","type":"single","difficulty":1,"stem":"电调杜邦线连接什么?","options":[{"key":"A","text":"接收机"},{"key":"B","text":"飞控"},{"key":"C","text":"电机"}],"answer":"B","analysis":"提示：杜邦接飞控 （粗电池，细电机，杜邦飞控）\n解析：电调杜邦线连接飞控。电调通过杜邦线与飞控连接，接收飞控的信号来控制电机的转速等，从而实现对飞行器的飞行控制。接收机主要接收遥控器的信号并传给飞控等，电机由电调来驱动","tags":[],"bankId":"uav-qa"},{"id":"cmp-0039","type":"single","difficulty":1,"stem":"电调上的两根线，三根线，杜邦线分别连接（）。","options":[{"key":"A","text":"电源，电机，飞控"},{"key":"B","text":"电机，电源，飞控"},{"key":"C","text":"飞控，电机，电源"}],"answer":"A","analysis":"提示：2电源，3电机，杜邦飞控\n解析：电调上的两根线通常连接电源，为电调提供工作所需的电力;三根线连接电机，用于控制电机的运转;杜邦线连接飞控，接收飞控的指令来调整电机的转速等参数，","tags":[],"bankId":"uav-qa"},{"id":"cmp-0040","type":"single","difficulty":1,"stem":"电调最粗的两根硅胶线连接什么?","options":[{"key":"A","text":"电池"},{"key":"B","text":"电机"},{"key":"C","text":"飞控"}],"answer":"A","analysis":"提示：粗电池，细电机，杜邦飞控\n解析：电调最粗的两根硅胶线连接电池。这两根线主要用于从电池获取电力输入给电调，电调再通过较细的三根线连接电机来控制电机的运转，而杜邦线连接飞控用于接收控制信号。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0041","type":"single","difficulty":1,"stem":"电动多旋翼桨可以做到尽量大，从而可以用最少的旋翼数实现最大载荷，是否正确？","options":[{"key":"A","text":"正确"},{"key":"B","text":"不正确"},{"key":"C","text":"不一定"}],"answer":"C","analysis":"提示：不一定\n解析：不完全正确。对于一定起飞重量以下的多旋翼飞行器，这个说法是成立的;但在大尺寸多旋翼飞行器中，由于转动惯量增大、成本与技术难度增加以及结构尺寸与重量问题等因素的限制，这个说法并不适用。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0042","type":"single","difficulty":1,"stem":"定向天线的优点是（）。","options":[{"key":"A","text":"覆盖范围广"},{"key":"B","text":"辐射距离远"},{"key":"C","text":"绕射能力强"}],"answer":"B","analysis":"提示：定向远，全向广\n解析：把天线发射的信号想象成嘴里含的一口水：定向天线：可以想象为对准一个方向用力喷出去所以喷得远（辐射距离远） 信号直直向前，拐弯能力差，所以绕射能力弱 全向天线：可以想象为向四周四面八方散开喷能量分散，喷不远，辐射距离近但各个方向都有水，覆盖范围广","tags":[],"bankId":"uav-qa"},{"id":"cmp-0043","type":"single","difficulty":1,"stem":"对于混合燃油发动机，冬天的燃油机油混合比针对夏天应如何调整?","options":[{"key":"A","text":"燃油机油混合比适当减小"},{"key":"B","text":"燃油机油混合比适当增大"},{"key":"C","text":"燃油机油混合比不变"}],"answer":"B","analysis":"提示：冬天混合比↑\n解析：本题考察的原理来自二冲程发动机。二冲程发动机混合油比例通常以燃油与机油的体积比表示。常见的基础比例范围为25:1至50:1。夏季高温时，机油容易变稀，配比可以适当浓一点，推荐25:1。（机油占比 4% 机油多）冬季低温时，机油流动性变差，配比可调整至40:1。（机油占比 2.5% 机油少）问题拆解：冬天的燃油机油混合比针对夏天应如何调整?（问的是到了冬天如何调整，不是夏天）冬天应该燃油多，机油少→燃油机油比变大（冬40:1＞夏25:1）A.燃油机油混合比适量减小（燃油少 机油多 ×）B.燃油机油混合比适量增大（燃油多 机油少 √）C.燃油机油混合比不变（不变 肯定×）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0044","type":"single","difficulty":1,"stem":"对于直升机，多旋翼无人机的旋翼或固定翼无人机的螺旋桨，保持角速度一定，更换直径较小的旋翼或螺旋桨，会导致（）。","options":[{"key":"A","text":"桨尖速度变大"},{"key":"B","text":"桨尖速度不变"},{"key":"C","text":"桨尖速度减小"}],"answer":"C","analysis":"提示：角速度一定，直径↓桨尖速度↓\n解析：什么是角速度？单位时间内转过的角除以时间 就是角速度直白的说：每秒 / 每分钟转了多大角度，就是角速度。什么是桨尖速度？单位时间内，螺旋桨桨尖运动划过的路程通俗的记：桨叶最外端转圈跑的快慢角速度一定→螺旋桨转的快慢一定，此时螺旋桨尺寸变小了→桨叶最外端单位时间内划过的路程就变小了。（就比有两个自行车，一个大轮子，一个小轮子，两人同时转一圈，角速度都相同，但是大轮子转一圈走的路程长，也就是桨尖速度更大；小轮子转一圈走的路程短，也就是桨尖速度更小）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0045","type":"single","difficulty":1,"stem":"多旋翼1.1米轴距代表什么意思?","options":[{"key":"A","text":"对角电机之间的直径距离为1.1米"},{"key":"B","text":"相邻电机之间的直径距离为1.1米"},{"key":"C","text":"对角电机之间的半径距离为1.1米"}],"answer":"A","analysis":"提示：轴距→对直\n解析：多旋翼轴距通常是指对角电机之间的直线距离，1.1米轴距即对角电机之间的直径距离为1.1米。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0046","type":"single","difficulty":1,"stem":"多旋翼飞行器如果重新组装后，必须校准哪些传感器?","options":[{"key":"A","text":"磁罗盘，陀螺仪"},{"key":"B","text":"电调，GPS"},{"key":"C","text":"接收机，IMU"}],"answer":"A","analysis":"提示：陀螺仪负责角度，罗盘方向， 方向角度最敏感最重要\n解析：磁罗盘容易受到周围磁场干扰，重新组装可能会改变其周围磁场环境，所以需要校准。陀螺仪用于感知飞行器的姿态变化，重新组装后可能会影响其准确性，也需要校准。 电调一般不需要在重新组装后校准。GPS通常在其信号接收出现问题等特定情况下才需要校准，重新组装一般不涉及对GPS的校准。接收机主要接收遥控器信号，重新组装一般也不需要对其校准。IMU惯性测量单元通常在特定故障或性能异常时才需要校准，一般重新组装后不一定需要立即校准。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0047","type":"single","difficulty":1,"stem":"多旋翼的桨叶为（）。","options":[{"key":"A","text":"数目不固定"},{"key":"B","text":"2"},{"key":"C","text":"3"}],"answer":"A","analysis":"提示：不固定\n解析：多旋翼的桨叶数目不固定。多旋翼飞行器有不同的类型和规格，桨叶数目可以有两叶、三叶、四叶甚至更多，根据不同的设计需求和性能要求进行选择，并非固定为某个特定的数目。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0048","type":"single","difficulty":1,"stem":"多旋翼电调与电机如何匹配?","options":[{"key":"A","text":"电调的额定电压要比电机的最大电流高"},{"key":"B","text":"电调的额定电流要比电机的最大电流低"},{"key":"C","text":"电调的额定电流要比电机的最大电流高"}],"answer":"C","analysis":"提示：电调高于电机（看清选项，电流对电流）\n解析：电调的额定电流要比电机的最大电流高。这样才能保证在电机工作在最大负载时，电调能够稳定地为电机提供足够的电流，而不会因电流不足导致电机性能下降或电调损坏。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0049","type":"single","difficulty":1,"stem":"多旋翼动力系统由哪几部分组成?每部分有几根线?","options":[{"key":"A","text":"电池（两根动力线），电调（八根线），电机（两根线）"},{"key":"B","text":"电池（两根动力线），电调（八根线），电机（三根线）"},{"key":"C","text":"电池（两根动力线），电调（三根线），电机（三根线）"}],"answer":"B","analysis":"提示：283（2电源，3电机，杜邦飞控）\n解析：多旋翼动力系统由电池、电调、电机组成，电池有两根动力线用于提供电能；电调一般有八根线，包括电源线、信号线等;电机有三根线，用于连接电调并接收电流驱动电机运转。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0050","type":"single","difficulty":1,"stem":"多旋翼飞行器如果重新组装后，不需要校准哪些传感器?","options":[{"key":"A","text":"GPS"},{"key":"B","text":"磁罗盘"},{"key":"C","text":"气压计"}],"answer":"C","analysis":"提示：气压不要校准\n解析：多旋翼飞行器重新组装后，通常需要校准磁罗盘和GPS。 磁罗盘容易受到周围磁场环境变化的影响，重新组装可能改变其周围磁场，所以需要校准。 GPS在重新组装后可能由于安装位置等因素变化而需要校准以确保定位准确。 而气压计一般情况下在重新组装后通常不需要校准，因为其主要是通过测量大气压力氧确定高度等信息，重新组装一般不会对其测量产生较大影响","tags":[],"bankId":"uav-qa"},{"id":"cmp-0051","type":"single","difficulty":1,"stem":"多旋翼飞行器上各种天线设备布置有什么要求?","options":[{"key":"A","text":"GPS接收天线安装在机腹"},{"key":"B","text":"数传天线布置于机腹"},{"key":"C","text":"数传天线，图传天线尽量靠近布置"}],"answer":"B","analysis":"提示：数传机腹（GPS上，WIFI下，尽量不靠近）\n解析：考虑天线布置的一般原则: 天线应尽可能远离其他电子设备，以减少电磁干扰。 GPS天线需要清晰的天空视野。 数传和图传天线应尽量避免相互干扰。因此选择“数传天线布置于机腹”。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0052","type":"single","difficulty":1,"stem":"多旋翼飞行器通常相对桨叶旋转方向相反，其主要目的是?","options":[{"key":"A","text":"效率更高"},{"key":"B","text":"产生更大升力"},{"key":"C","text":"抵消反扭矩"}],"answer":"C","analysis":"提示：转向不一样→抵消反扭矩\n解析：多旋翼飞行器相对的桨旋转方向不一样是为了抵消反扭矩。当多个旋翼以相同的方向旋转时，会产生一个使飞行器整体旋转的反扭矩。通过让相对的桨以相反方向旋转，可以有效抵消这个反扭矩，使飞行器更加稳定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0053","type":"single","difficulty":1,"stem":"多旋翼飞行一段时间后，应对电机安装位置如何检查?","options":[{"key":"A","text":"应用水平尺校准，保证每个电机水平不应该出现倾斜"},{"key":"B","text":"让其适当倾斜"},{"key":"C","text":"应用垂直尺校准"}],"answer":"A","analysis":"提示：水平尺\n解析：多旋翼飞行一段时间后，应对电机安装位置进行检查，以确保其水平度。应用水平尺校准每个电机的安装位置，保证它们不应该出现倾斜，这是为了维持飞行器的平衡和稳定，防止因电机倾斜导致的飞行问题。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0054","type":"single","difficulty":1,"stem":"多旋翼控制前后飞行时，油门需要怎么变化，为什么?","options":[{"key":"A","text":"前后飞行时，飞机会产生倾斜角，导致升力水平分量不足以抵销重力，所以需要适量增加油门"},{"key":"B","text":"前后飞行时，飞机会产生倾斜角，导致升力垂直分量不足以抵销重力，所以需要适量增加油门"},{"key":"C","text":"前后飞行时，飞机会产生倾斜角，导致升力垂直分量不足以抵销重力，所以需要适量减小油门"}],"answer":"B","analysis":"提示：垂直分量，增加油门\n解析：多旋翼在前后飞行时，会产生倾斜角，导致升力的垂直分量减小，不足以完全抵销重力。为了保持飞行高度和速度，需要适量增加油门，以增加升力，保持飞行稳定","tags":[],"bankId":"uav-qa"},{"id":"cmp-0055","type":"single","difficulty":1,"stem":"多旋翼无人机的螺旋桨是（）。","options":[{"key":"A","text":"定距螺旋桨"},{"key":"B","text":"变距螺旋桨"},{"key":"C","text":"有定距也有变距"}],"answer":"A","analysis":"提示：多旋翼→定距\n解析：多旋翼无人机的螺旋桨通常是定距螺旋桨。定距螺旋桨的桨距(即螺旋桨叶片与旋转平面的夹角)是固定的，不会随飞行条件的变化而改变。这种设计简化了无人机的结构和控制系统，使其更易于制造和操作。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0056","type":"single","difficulty":1,"stem":"多旋翼无人机要实现在悬停中向右偏航，不同螺旋桨如何变化?","options":[{"key":"A","text":"逆时针桨减速，顺时针桨加速"},{"key":"B","text":"机体轴左边螺旋桨加速，右边螺旋桨减速"},{"key":"C","text":"逆时针桨加速，顺时针桨减速"}],"answer":"C","analysis":"提示：偏右→逆加顺减\n解析：本题要分清“从悬停到向右平移”与“从悬停到向右偏航”有偏航不是右平移，是原地直接右转基础理论题考的都是“平移”，选左右侧。综合问答题考的是“偏航”，选顺逆时针。原理：X轴无人机逆时针与顺时针之间有反扭力差值左右平移→同侧反扭力相互抵消，只剩升力差→同侧增减速度实现平移左右偏航→同组顺逆变化，拉大反扭力差值，扭力不平衡 → 机身原地偏转","tags":[],"bankId":"uav-qa"},{"id":"cmp-0057","type":"single","difficulty":1,"stem":"多旋翼无人机以下哪个下降速度较为合理?","options":[{"key":"A","text":"2m/s"},{"key":"B","text":"5m/s"},{"key":"C","text":"8m/s"}],"answer":"A","analysis":"提示：越慢越好，2m/s\n解析：多旋翼无人机的下降速度需要综合考虑飞行安全、任务需求和电池续航等因素。2m/s是一个相对较慢且可控的下降速度，有利于保证飞行的稳定性和安全性，同时也较为节能。5m/s和8m/s的下降速度过快，可能增加飞行风险。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0058","type":"single","difficulty":1,"stem":"多旋翼无人机在使用地面站超视距飞行时，数传上行链路中断，该如何处理?","options":[{"key":"A","text":"检查上行链路设备恢复通信"},{"key":"B","text":"继续飞行，会自动连接"},{"key":"C","text":"暂停飞行，尝试重新连接，点击一键返航"}],"answer":"A","analysis":"提示：问题对答案，链路对链路\n解析：多旋翼无人机在使用地面站超视距飞行时，若数传上行链路中断，应首先检查上行链路设备，尝试恢复通信。继续飞行存在风险，因为无法实时监控无人机状态。一键返航应在确保通信恢复无望时再考虑，以确保安全。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0059","type":"single","difficulty":1,"stem":"多旋翼无人机在使用地面站超视距飞行中，数传下行链路故障中断，该如何处理?","options":[{"key":"A","text":"继续飞行，自动连接"},{"key":"B","text":"暂停飞行，尝试重新连接，点击原地悬停"},{"key":"C","text":"暂停飞行，尝试重新连接，点击一键返航"}],"answer":"C","analysis":"提示：上行恢复，下行返航\n解析：多旋翼无人机在使用地面站超视距飞行中，若数传下行链路故障中断，意味着地面站无法接收无人机传回的数据，无法监控无人机状态。此时应暂停飞行，尝试重新连接。若无法恢复，应点击一键返航，确保无人机安全返回。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0060","type":"single","difficulty":1,"stem":"多旋翼无人机在姿态遥控状态下，如出现动力失效，则正确的处理方法是（）。","options":[{"key":"A","text":"遥控器油门保持中间略上位置"},{"key":"B","text":"接地瞬间将油门收至最小"},{"key":"C","text":"始终保持油门最大位置试图恢复动力"}],"answer":"B","analysis":"提示：动力失效，油门最小\n解析：多旋翼无人机在姿态遥控状态下，如遇动力失效，正确的处理方法是接地瞬间将油门收至最小。这样做可以减少无人机坠地时的冲击力，降低损坏风险，同时也有助于无人机稳定着陆。保持油门中间略上或最大位置均不利于安全着陆","tags":[],"bankId":"uav-qa"},{"id":"cmp-0061","type":"single","difficulty":1,"stem":"多旋翼遥控状态下，动力失效（）。","options":[{"key":"A","text":"利用旋翼旋转安全降落"},{"key":"B","text":"有伞开伞"},{"key":"C","text":"落在任意地方"}],"answer":"B","analysis":"提示：动力失效，有伞开伞\n解析：多旋翼遥控状态下动力失效时，若有伞可开伞实现相对安全的降落","tags":[],"bankId":"uav-qa"},{"id":"cmp-0062","type":"single","difficulty":1,"stem":"多旋翼有几个自由度，滚转运动是绕哪个轴?","options":[{"key":"A","text":"6个，横轴"},{"key":"B","text":"6个，纵轴"},{"key":"C","text":"3个，纵轴"}],"answer":"B","analysis":"提示：6个纵\n解析：多旋翼有6个自由度，分别是沿三个坐标轴的移动和绕三个坐标轴的转动。滚转运动是绕纵轴转动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0063","type":"single","difficulty":1,"stem":"多旋翼有三轴布局的形式，这种布局中间轴多了一个舵机，这个舵机的作用是什么?","options":[{"key":"A","text":"抵消反扭矩"},{"key":"B","text":"收起起落架"},{"key":"C","text":"改变旋翼螺距"}],"answer":"A","analysis":"提示：三轴布局抵消反扭矩\n解析：在多旋翼三轴布局形式中，中间轴多的一个舵机主要作用是抵消反扭矩。多旋翼飞行器在飞行时，旋翼旋转会产生反扭矩，这个舵机可以通过调整中间轴的动力输出等方式来抵消反扭矩，以保持飞行器的稳定飞行。 收起起落架一般由专门的起落架收放机构完成，与中间轴的舵机无关。改变旋翼螺距通常不是由这个舵机来实现。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0064","type":"single","difficulty":1,"stem":"多旋翼在测试电机转动方向最重要的安全措施是（）。","options":[{"key":"A","text":"拆卸螺旋桨"},{"key":"B","text":"拆卸机臂"},{"key":"C","text":"拆卸电机"}],"answer":"A","analysis":"提示：螺旋桨，绞肉机，危险\n解析：在测试多旋翼电机转动方向时，最重要的安全镐措施是拆卸螺旋桨。如果不拆卸螺旋桨直接测试电机转动方向，电机一旦转动起来，螺旋桨高速旋转可能会对人造成严重伤害。而拆卸机臂和拆卸电机并非针对测试电机转动方向的关键安全措施。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0065","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行平台由哪些设备组成？","options":[{"key":"A","text":"飞控、电调、电机、螺旋桨、机架、接收机"},{"key":"B","text":"飞控、电调、电机、螺旋桨、机架、倾斜盘"},{"key":"C","text":"飞控、电调、电机、螺旋桨、机架、遥控器"}],"answer":"A","analysis":"提示：飞行平台→接收机\n解析：多旋翼飞行器飞行平台主要由飞控(飞行控制器)、电调(电子调速器)、电机、螺旋桨、机架和接收机组成。 飞控用于控制飞行器的姿态和飞行;电调用于控制电机的转速;电机带动螺旋桨产生升力;机架起到支撑和固定各个部件的作用;接收机接收遥控器的信号并传输给飞控。 倾斜盘主要是直升机上的部件，多旋翼飞行器一般没有倾斜盘。遥控器不属于飞行平台的组成部分，而是用于操控飞行器的外部设备。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0066","type":"single","difficulty":1,"stem":"多旋翼在测试电机、电调时，最重要的安全措施是（）。","options":[{"key":"A","text":"卸下螺旋桨"},{"key":"B","text":"卸下电机"},{"key":"C","text":"不接动力电"}],"answer":"A","analysis":"提示：螺旋桨，绞肉机，危险\n解析：在测试电机、电调时，最重要的安全措施是卸下螺旋桨。如果不卸下螺旋桨，电机一旦转动，螺旋桨高速旋转会带来极大的安全风险，可能会对人造成严重伤害。卸下电机不是常规的主要安全措施，且比较麻烦;不接动力电在某些情况下可能无法完全测试电机和电调的性能，也不是最关键的安全措施。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0067","type":"single","difficulty":1,"stem":"多轴无人机各种天线设备位置有什么要求?","options":[{"key":"A","text":"GPS天线要高出机体竖直向上，WiFi模块天线要垂直向上，接收机两根天线互相垂直"},{"key":"B","text":"GPS天线要高出机体竖直向上，WiFi模块天线要垂直向下，接收机两根天线互相垂直"},{"key":"C","text":"GPS天线要低出机体竖直向下，WiFi模块天线要垂直向下，接收机两根天线互相垂直"}],"answer":"B","analysis":"提示：GPS上，WIFI下\n解析：GPS天线要高出机体竖直向上，这样可以更好地接收卫星信号，减少机体对信号的遮挡。 WIFI模块天线要垂直向下，避免与其他天线产生过多干扰且保证信号传输稳定。 接收机两根天线互相垂直布置可以保证更好地接收遥控器信号，减少信号盲区和多径干扰。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0068","type":"single","difficulty":1,"stem":"多轴无人机一般以双数螺旋桨配置可否有奇数的配置，怎么配?","options":[{"key":"A","text":"可以"},{"key":"B","text":"不可以"},{"key":"C","text":"可以，但需要加个矢量舵机"}],"answer":"C","analysis":"提示：可以+矢量\n解析：奇数螺旋桨的配置在无人机中是相对少见的，因为它打破了传统的平衡布局。但是，通过增加一个矢量舵机，可以调整无人机的飞行姿态和方向，从而弥补奇数螺旋桨带来的不平衡问题。矢量舵机可以调整螺旋桨的推力方向，使得无人机在飞行中仍然能够保持稳定的姿态。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0069","type":"single","difficulty":1,"stem":"舵面操控是什么控制量?","options":[{"key":"A","text":"开关控制量"},{"key":"B","text":"模拟控制量"},{"key":"C","text":"模拟控制量也叫比例控制量"}],"answer":"C","analysis":"提示：模拟也叫比例\n解析：舵面操控需要的是连续、平滑的控制，以便根据飞行需求实时调整舵面的角度和位置。因此，正确的答案是“模拟控制量”也可以称为“比例控制量”。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0070","type":"single","difficulty":1,"stem":"发动机燃油在哪里喷射?","options":[{"key":"A","text":"进气口"},{"key":"B","text":"点火位置"},{"key":"C","text":"排气口"}],"answer":"A","analysis":"提示：喷射在进气口\n解析：发动机燃油的喷射位置主要取决于燃油喷射方式。对于歧管喷射方式，燃油主要在进气歧管(即进气口附近)喷射。而缸内直喷则是将燃油直接喷入气缸内。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0071","type":"single","difficulty":1,"stem":"飞机上的GPS/COMPSS模块不能给无人机提供哪些数据?","options":[{"key":"A","text":"方向"},{"key":"B","text":"位置"},{"key":"C","text":"加速度"}],"answer":"C","analysis":"提示：GPS/COMPASS =位置/方向 选错的。加速度×\n解析：飞机上的GPS/COMPASS模块可以为无人机提供位置信息(经纬度等)和方向信息(航向等)。但是不能提供加速度数据，加速度一般由专门的加速度传感器来测量。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0072","type":"single","difficulty":1,"stem":"飞控中的气压高度传感器经过修正参数以后所获得的高度数据是（）。","options":[{"key":"A","text":"相对高度"},{"key":"B","text":"海拔高度"},{"key":"C","text":"真实高度"}],"answer":"A","analysis":"提示：修正完→相对高度\n解析：首先，飞控中的气压高度传感器测量的是大气压强，换算为相对高度。 其次，修正的是气压计数据和高度换算误差，得到的是更精准的相对高度，不是把它修正成海拔高度。 想要获取海拔高度，还需要靠超声波、TOF、激光/雷达高度计或地形数据库。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0073","type":"single","difficulty":1,"stem":"飞行器检查时，多旋翼电机震动，在排除电机故障后，检查动力电路，应检查（）。","options":[{"key":"A","text":"输入端"},{"key":"B","text":"输出端"},{"key":"C","text":"不用检查"}],"answer":"B","analysis":"提示：输出端\n解析：在飞行器检查中，若多旋翼电机出现震动，并且在已排除电机本身故障的情况下，应进一步检查动力电路。由于电机震动可能由电路问题引起，特别是输出端的异常因此应重点检查动力电路的输出端。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0074","type":"single","difficulty":1,"stem":"飞行中地面站显示滚转角度为零，目视飞机有明显的坡度，不太可能的原因是（）。","options":[{"key":"A","text":"飞控故障"},{"key":"B","text":"上行链路中断"},{"key":"C","text":"传感器故障"}],"answer":"B","analysis":"提示：选错的。上行链路中断直接没信号\n解析：如果飞行中地面站显示滚转角度为零，目视飞机有明显的坡度，可能是飞控故障导致显示错误或者传感器故障使得测量的角度不准确。 而上行链路中断只是地面站与飞机之间的通信出现问题，不会直接导致地面站显示的滚转角度与实际飞机坡度不符。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0075","type":"single","difficulty":1,"stem":"高海拔地区，以下哪个尺寸的螺旋桨更适用?","options":[{"key":"A","text":"1835"},{"key":"B","text":"1855"},{"key":"C","text":"1035"}],"answer":"A","analysis":"提示：高海拔1835\n解析：在高海拔下，选择高KV、大直径小螺距的螺旋桨及电机配置可以有效地提高飞行器的航时和载重能力，使其能够在恶劣的环境条件下稳定运行。根据前桨径后螺距的原则，后边先选一个小螺距35，同样的螺距，选大直径18，最后确定1835","tags":[],"bankId":"uav-qa"},{"id":"cmp-0076","type":"single","difficulty":1,"stem":"高海拔地区选用什么样的桨叶效率最高?","options":[{"key":"A","text":"二叶桨"},{"key":"B","text":"三叶桨"},{"key":"C","text":"多叶桨"}],"answer":"A","analysis":"提示：高海拔二叶桨\n解析：在高海拔地区，空气稀薄，二叶桨效率最高。二叶桨相比三叶桨和多叶桨，桨叶的面积和重量相对较小，空气阻力也小，在高海拔空气稀薄的情况下，发动机的动力能更有效地转化为升力，所以二叶桨效率更高。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0077","type":"single","difficulty":1,"stem":"各长度鞭状天线架设方式必须和通讯 方向（）。","options":[{"key":"A","text":"垂直"},{"key":"B","text":"平行"},{"key":"C","text":"相同方向"}],"answer":"A","analysis":"提示：鞭状→垂直\n解析：鞭状天线的架设方式与通讯方向的关系对于信号传输效率至关重要。垂直架设的天线能够在垂直方向上更好地辐射和接收信号，而与通讯方向垂直可以确保信号传输的直接性和效率。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0078","type":"single","difficulty":1,"stem":"共轴直升机通过改变什么改变航向?","options":[{"key":"A","text":"上下旋翼转速"},{"key":"B","text":"上下旋翼桨距"},{"key":"C","text":"倾斜盘倾斜方向"}],"answer":"B","analysis":"提示：共轴→上下旋翼桨距\n解析：共轴直升机改变航向主要是通过改变上下旋翼的桨距来实现的。具体来说，是通过所谓的上下旋翼总距差动产生不平衡扭矩来实现航向操纵。共轴双旋翼直升机的上下旋翼桨距变化，可以使得直升机在不改变旋翼转速的情况下，通过改变旋翼的桨距来增加或减少旋翼的升力，从而实现航向的控制。这种改变桨距的方式，允许直升机在垂直飞行状态下也能进行航向的调整，而不需要依赖水平速度来产生转向力矩。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0079","type":"single","difficulty":1,"stem":"关于升阻比和载荷因数（子），以下说法错误的是?","options":[{"key":"A","text":"载荷因数（子）与升阻比成正比"},{"key":"B","text":"在最小阻力迎角下飞行，可以获得最大的升阻比"},{"key":"C","text":"升力与重力的比值称为载荷因数（子）"}],"answer":"A","analysis":"提示：选错的。两者不成正比\n解析：1.“载荷因子”和“载荷因数”，在航空和无人机工程领域，通常指的是同一个核心概念。 在考试中，表述为：“升力与重力的比值”或“飞机承受的载荷(除重力外)与重力的比值” 可以笼统的理解为“升力最大时，载荷因子最大”2. “升阻比”是升力与阻力的比值。 根据升力与阻力公式，在机翼不变的情况下，影响升力系数与阻力系数唯一的因素就是迎角。 升阻比随迎角的改变而改变。 从下图可以看出 升阻比并不随着升力的增加而持续增大。3.三个选项表述都不严谨，错的最多的选“两者成正比” 一个理论上可以随整理增加持续增加，一个到达峰值后会减小，明显不成正比","tags":[],"bankId":"uav-qa"},{"id":"cmp-0080","type":"single","difficulty":1,"stem":"关于失速，下面说法不正确的是（）。","options":[{"key":"A","text":"失速会导致升力系数急剧减小，阻力系数缓慢减小"},{"key":"B","text":"机翼迎角超过临界迎角，导致升力急剧降低的飞行状态称为失速"},{"key":"C","text":"旋翼类无人机前飞速度过快，可能导致后行旋翼出现失速"}],"answer":"A","analysis":"提示：选错的。缓慢×（快不会导致失速，过快会）\n解析：失速与临界迎角密切相关。飞机失速的核心原因就是迎角超过临界迎角。升力阻力：升力急剧降低、阻力急剧增大。升力系数阻力系数：升力系数急剧降低、阻力系数急剧增大。后行桨叶与失速：前飞过快→后行桨叶气流变慢→被迫加大迎角→超临界迎角就失速。旋翼无人机（直升机）高速前飞时，桨叶分前行、后行两种状态：前行桨叶顺着飞行方向，相对气流速度变大，升力偏大；后行桨叶迎着飞行反方向，气流速度变小，升力偏小。为了平衡两边升力，飞行器会自动减小前行桨叶迎角、增大后行桨叶迎角。一旦前飞速度过快，后行桨叶迎角会突破临界迎角，气流和桨叶表面分离，直接引发后行旋翼失速，造成升力暴跌、飞机操控和稳定性变差。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0081","type":"single","difficulty":1,"stem":"关于无人机GPS天线与遥控接收机天线的说法错误的是（）。","options":[{"key":"A","text":"GPS卫星位置信号(一般为顶端蘑菇头)"},{"key":"B","text":"地面遥控发射机遥控信号(一般为90度布置)"},{"key":"C","text":"GPS天线一般为定向天线，位于机体下方"}],"answer":"C","analysis":"提示：选错的。GPS→全向，不是定向\n解析：无人机的GPS天线和遥控接收机天线有其特定的设计和布置方式。GPS天线通常设计为全向天线，以接收来自天空中GPS卫星的信号，且往往被安装在机体的上方以确保良好的信号接收。而遥控接收机天线则负责接收地面遥控发射机的信号，其布置方式可能根据具体设计有所不同，但并非特定为90度布置。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0082","type":"single","difficulty":1,"stem":"关于诱导阻力，以下说法错误的是（）。","options":[{"key":"A","text":"滑翔机为了减小诱导阻力，常将机翼设计成又长又窄的高展弦比机翼"},{"key":"B","text":"有的机翼上加装了翼梢小翼，目的是增强气流的下洗以增大升力，从而减小诱导阻力"},{"key":"C","text":"飞行速度越快，诱导阻力越小"}],"answer":"B","analysis":"提示：选错的。诱导阻力下洗错\n解析：诱导阻力是飞行器在飞行过程中，由于机翼产生升力而诱导产生的一种阻力。为了减小诱导阻力，滑翔机常采用高展弦比的机翼设计，即机翼又长又窄。加装翼梢小翼的目的是减小机翼尖部的涡流，从而降低诱导阻力，而非增强气流的下洗以增大升力。飞行速度越快，诱导阻力通常会越小，因为高速飞行时，机翼产生的升力相对更大，而诱导阻力与升力的产生有关。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0083","type":"single","difficulty":1,"stem":"结合遥控器说说民用无人机系统有哪几条链路?","options":[{"key":"A","text":"遥控器下行、图传下行、数传上下行"},{"key":"B","text":"遥控器上行、图传下行、数传上下行"},{"key":"C","text":"遥控器上行、图传上下行、数传下行"}],"answer":"B","analysis":"提示：遥控器上 图传下 数传上下\n解析：民用无人机系统有三条主要链路。遥控器发指令给无人机：上行无人机传图回来： 下行数据来回传输： 上下（鼠鼠老师的话：我们想想一下，我们在地上，用遥控器遥控天上的无人机，发出去的“指令”往上走，所以是“上传”; 无人机通过摄像头拍到影像回传到地面，图像往下走，所以是下行。地面站、飞行相关数据需要实时来回反馈调整，所以是上下行）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0084","type":"single","difficulty":1,"stem":"空速明显大于地速的原因是（）。","options":[{"key":"A","text":"逆风"},{"key":"B","text":"顺风"},{"key":"C","text":"无风"}],"answer":"A","analysis":"提示：顺风地大 逆风空大（大地顺风）\n解析：在飞行中，空速是飞机相对于空气的速度，而地速是飞机相对于地面的速度。当飞机遇到逆风时，风的方向与飞机的飞行方向相反，这会增加飞机相对于空气的速度即空速，而地速会相应减少。因此，逆风情况下，空速会明显大于地速，","tags":[],"bankId":"uav-qa"},{"id":"cmp-0085","type":"single","difficulty":1,"stem":"连接电机的三根线是以（）方式给无刷电机供电的?","options":[{"key":"A","text":"直流"},{"key":"B","text":"交流"},{"key":"C","text":"交流、直流都可以"}],"answer":"B","analysis":"提示：无刷交流\n解析：无刷电机通过电子调速器将直流电转换为三相交流电，由连接电机的三根线以交流方式给无刷电机供电，所以是交流。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0086","type":"single","difficulty":1,"stem":"连接无人机电机为什么是三根线?","options":[{"key":"A","text":"三相交流电，变换任意两根线电机会发生反转"},{"key":"B","text":"三相直流电，变换任意两根线电机会发生反转"},{"key":"C","text":"两相直流电，变换任意两根线电机会发生反转"}],"answer":"A","analysis":"提示：无刷交流，32反转\n解析：连接无人机电机是三根线的原因是因为无刷电机需要三相交流电来驱动，而三根线正好可以传输三相交流电，并且变换任意两根线电机会发生反转。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0087","type":"single","difficulty":1,"stem":"连续性定理，指的是（）。","options":[{"key":"A","text":"由于质量守恒定律，同一流管单位时间内流经不同横截面的流体质量一定"},{"key":"B","text":"由于质量守恒定律，同一流管横截面积大的地方流速更快"},{"key":"C","text":"由于质量守恒定律，同一流管横截面积大的地方静压小"}],"answer":"A","analysis":"提示：定理一定\n解析：连续性定理指的是，由于质量守恒定律，同一流管单位时间内流经不同横截面的流体质量一定。这意味着在不可压缩流体的流动中，流体的质量流量在不同横截面上是保持不变的。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0088","type":"single","difficulty":1,"stem":"两块16000mAh6s25c电池，一种方式串联，一种方式并联，哪种方式能输出电流更大?","options":[{"key":"A","text":"不联"},{"key":"B","text":"并联"},{"key":"C","text":"串联"}],"answer":"B","analysis":"提示：串联电压累积，电流不变 并联电流累积，电压不变\n解析：两块电池并联能输出电流更大。因为并联时电压不变，电流等于各支路电流之和，所以并联方式输出电流更大。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0089","type":"single","difficulty":1,"stem":"两块电池6S、5000mAh的电池并联用2C充电，充电的功率是多少?","options":[{"key":"A","text":"202W"},{"key":"B","text":"504W"},{"key":"C","text":"404W"}],"answer":"B","analysis":"提示：功率=电压x电流 单组电流5000mAh=5Ah 电压4.2*6=25.2V 并联后电流5*2=10 充电2C=20Ah 并联电压不变 20*25.2=504\n解析：首先计算总电池容量，两块5000mAh的电池并联，总容量为10000mAh。2C充电意味着充电电流为电池容量的两倍，即20000ma(或20A)。6S表示6节电池串联单节电池电压一般为3.7V(充满约 4.2V)，6S总电压约为 6x4.2=25.2V，10000mAh=10AH，功率=电压x电流功率为 25.2x20A=504W。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0090","type":"single","difficulty":1,"stem":"螺旋桨1045 CCW，其含义是什么?","options":[{"key":"A","text":"桨叶直径10mm，桨叶宽度4.5mm，逆时针旋转的螺旋桨"},{"key":"B","text":"桨叶直径10英寸，螺距4.5英寸，逆时针旋转的螺旋桨"},{"key":"C","text":"桨叶直径10英寸，螺距45英寸，顺时针旋转的螺旋桨"}],"answer":"B","analysis":"提示：1英寸 2 CCW逆时针 3 前直径后螺距 直螺英寸逆\n解析：数字部分(1045)的“10”表示螺旋桨的直径是10英寸。“45”则代表螺距是4.5英寸“CCW”是Counter-Clockwise(逆时)的缩写。螺旋桨“1045 CCW”是一个直径为10英寸、螺距为4.5英寸、逆时针旋转的螺旋桨。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0091","type":"single","difficulty":1,"stem":"螺旋桨的螺距是什么?","options":[{"key":"A","text":"螺距是指螺旋桨旋转一周所上升或前进的距离"},{"key":"B","text":"螺距是指螺旋桨旋转一周所上升的距离"},{"key":"C","text":"螺距是指螺旋桨旋转一周所前进的距离"}],"answer":"A","analysis":"提示：上升或前进，都\n解析：螺距是指螺旋桨旋转一周所上升或前进的距离。这包括了上升和前进两个方向。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0092","type":"single","difficulty":1,"stem":"螺旋桨的主要技术参数有哪些?","options":[{"key":"A","text":"直径、螺距、材料"},{"key":"B","text":"直径、螺距、桨叶数"},{"key":"C","text":"直径、螺距、桨叶数、材料"}],"answer":"C","analysis":"提示：四种\n解析：螺旋桨的主要技术参数包括直径、螺距、桨叶数和材料。这些参数共同决定了螺施桨的性能和适用性。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0093","type":"single","difficulty":1,"stem":"每到一个新的地方必须校准什么传感器?","options":[{"key":"A","text":"GPS"},{"key":"B","text":"气压计"},{"key":"C","text":"地磁传感器"}],"answer":"C","analysis":"提示：地磁传感器\n解析：地磁传感器是用于感知地球磁场方向的传感器，对于无人机的方向定位和导航至关重要。每到一个新的地方，由于地理位置和地磁场的变化，需要校准地磁传感器以确保无人机能够准确感知方向。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0094","type":"single","difficulty":1,"stem":"民用无人机调整中的基本感度是（）。","options":[{"key":"A","text":"飞控PID调节中的P比例系数"},{"key":"B","text":"飞控PID调节中的I积分系数"},{"key":"C","text":"飞控PID调节中的D微分系数"}],"answer":"A","analysis":"提示：P\n解析：在无人机飞控系统中，PID调节(比例-积分-微分调节)是常用的控制策略。其中，比例项P的系数决定了系统对偏差的响应速度，是基本感度的重要组成部分。因此调整中的基本感度通常指的是比例项P的系数。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0095","type":"single","difficulty":1,"stem":"民用无人机运行多处于低空速环境下，主要受到的阻力有:1.摩擦阻力;2.循环阻力;3.干扰阻力;4.激波阻力;5.诱导阻力;6.压差阻力。","options":[{"key":"A","text":"1234"},{"key":"B","text":"1256"},{"key":"C","text":"1356"}],"answer":"C","analysis":"提示：循环阻力×激波阻力× 1356\n解析：在低空速环境下，民用无人机主要受到的阻力包括摩擦阻力、干扰阻力、诱导阻力和压差阻力。循环阻力和激波阻力在高速飞行时更为显著，不属于低空速环境下的主要阻力。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0096","type":"single","difficulty":1,"stem":"目前常用的无人机常用什么类型电机?","options":[{"key":"A","text":"外转子三相交流无刷同步电机"},{"key":"B","text":"外转子三相交流无刷异步电机"},{"key":"C","text":"内转子直流有刷电机"}],"answer":"A","analysis":"提示：外三交无同\n解析：目前常用的无人机电机类型是外转子三相交流无刷同步电机。这种电机具有高效率、高功率密度和长寿命等优点，适用于无人机的动力需求。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0097","type":"single","difficulty":1,"stem":"目前无人机平台常用动力电池类型为锂聚电池，关于其特点错误的是（）。","options":[{"key":"A","text":"无记忆效应"},{"key":"B","text":"标称电压一般为3.7V"},{"key":"C","text":"充满电压一般为4.7V"}],"answer":"C","analysis":"提示：选错的。4.7× 3.7标-4.2满\n解析：锂聚合物电池无记忆效应，标称电压一般为3.7V。 而锂聚合物电池充满电压一般为4.2V左右，不是4.7V。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0098","type":"single","difficulty":1,"stem":"哪个可以设定教练主控，学员副控?","options":[{"key":"A","text":"Trainer"},{"key":"B","text":"Display"},{"key":"C","text":"METRIC"}],"answer":"A","analysis":"提示：trainer训练者\n解析：在很多遥控器设置中，“Trainer”选项可以设定教练主控，学员副控，方便进行教学飞行。 “Display”一般是与显示相关的设置; “METRIC”通常是与度量单位等相关的设置","tags":[],"bankId":"uav-qa"},{"id":"cmp-0099","type":"single","difficulty":1,"stem":"哪种电池能量密度最大?","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"镍氢电池"},{"key":"C","text":"铅酸电池"}],"answer":"A","analysis":"提示：锂电最轻，容量能量大\n解析：锂聚合物电池的能量密度最大。 锂聚合物电池具有高能量密度、轻量化、可定制形状等优点。相比之下，镍氢电池和铅酸电池的能量密度要低得多。镍氢电池在循环寿命和环保性方面有一定优势，但能量密度不如锂聚合物电池。铅酸电池则主要用于一些对重量和体积要求不高的场合，其能量密度较低，且比较笨重，","tags":[],"bankId":"uav-qa"},{"id":"cmp-0100","type":"single","difficulty":1,"stem":"能否使用高KV电机带动远大于适配桨大小的桨?","options":[{"key":"A","text":"能"},{"key":"B","text":"不能"},{"key":"C","text":"无所谓"}],"answer":"B","analysis":"提示：不能，马拉超大车，累死\n解析：高KV值电机通常转速较高，如果带动远大于适配桨大小的桨，会导致电机负载过大，可能出现以下问题:一是电机可能因过载而烧毁;二是无法发挥电机的正常性能，效率低下;三是可能对电子调速器等其他部件造成损坏。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0101","type":"single","difficulty":1,"stem":"起飞前无人机、遥控器、地面控制站正确安全的通电顺序应是（）。","options":[{"key":"A","text":"地面站、遥控器、无人机"},{"key":"B","text":"遥控器、无人机、地面站"},{"key":"C","text":"无人机、地面站、遥控器"}],"answer":"A","analysis":"提示：检查：遥地天 通电：地遥天\n解析：起飞前无人机、遥控器、地面控制站正确安全的通电顺序应是地面站、遥控器、无人机。首先，地面控制站作为整个无人机系统的中枢，负责监控和控制无人机的飞行状态，因此需要先通电以确保其处于正常工作状态。接着，遥控器作为连接地面控制站和无人机的桥梁，也需要通电以建立与无人机的通信链路。最后，无人机在接收到地面控制站和遥控器的指令后，进行通电和起飞准备，以确保整个飞行过程的安全和顺利进行。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0102","type":"single","difficulty":1,"stem":"气压传感器测的是以下哪个高度?","options":[{"key":"A","text":"相对高度"},{"key":"B","text":"海拔高度"},{"key":"C","text":"无线电高度"}],"answer":"A","analysis":"提示：相对高度\n解析：根据《民用航空自动气象观测系统气压传感器校准规范》，民用航空自动气象观测系统中的气压传感器用于测量大气压力，主要为气象观测提供气压数据，以辅助航空气象保障等相关工作。气压传感器核心测量的是大气压（绝对压力）。海拔高度和相对高度都是基于气压值换算得出的。这题经过2025年10月份月中同一考场2个学员共同验证选海拔高度均不得分，故选相对高度。感谢各位教练学员的验证反馈，感谢支持","tags":[],"bankId":"uav-qa"},{"id":"cmp-0103","type":"single","difficulty":1,"stem":"汽油机随着高度的增加，功率会增大还是减小?","options":[{"key":"A","text":"增大"},{"key":"B","text":"不变"},{"key":"C","text":"减小"}],"answer":"C","analysis":"提示：汽油在高空燃烧不充分，功率↓\n解析：随着高度的增加，大气压力和氧气浓度都会降低，这会影响汽油机的燃烧效率。由于燃烧不充分，汽油机的功率会随之减小。因此，汽油机随着高度的增加，功率会减小。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0104","type":"single","difficulty":1,"stem":"倾斜盘是CCPM的直升机，当飞机往后飞时，多少个舵机在动?","options":[{"key":"A","text":"3"},{"key":"B","text":"2"},{"key":"C","text":"1"}],"answer":"A","analysis":"提示：后飞，3个舵机\n解析：在CCPM直升机中，倾斜盘是关键组件，用于分配发动机功率到各个旋翼，实现飞机姿态和动作控制。当直升机往后飞时，倾斜盘调整角度，改变旋翼攻角以产生推力。此过程中，所有与倾斜盘相连的舵机均会工作，确保倾斜盘正确调整。标准CCPM配置中，通常有三个舵机与倾斜盘相连因此飞机往后飞时，这三个舵机都会动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0105","type":"single","difficulty":1,"stem":"请将多旋翼无人机以下部件正确连接:IMU、ESC、起落架、电机、螺旋桨。","options":[{"key":"A","text":"ESC-IMU-螺旋桨"},{"key":"B","text":"IMU-ESC-螺旋桨"},{"key":"C","text":"ESC-电机-螺旋桨"}],"answer":"C","analysis":"提示：E电螺\n解析：多旋翼无人机部件正确连接为 ESC-电机-螺旋桨。ESC(电子调速器)控制电机的转速，电机带动螺旋桨旋转产生升力。MU(惯性测量单元)主要用于感知无人机姿态等信息，不直接与螺旋桨连接。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0106","type":"single","difficulty":1,"stem":"请将固定翼无人机以下部件连接:发动机、IMU、起落架、螺旋桨、水平尾翼。","options":[{"key":"A","text":"IMU-发动机"},{"key":"B","text":"发动机-螺旋桨"},{"key":"C","text":"起落架-水平尾翼"}],"answer":"B","analysis":"提示：发螺\n解析：固定翼无人机部件连接为发动机-螺旋桨。发动机为螺旋桨提供动力使其旋转产生拉力。IMU用于感知飞机姿态等，与发动机无直接连接;起落架和水平尾翼各自独立发挥作用，也不存在直接连接关系。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0107","type":"single","difficulty":1,"stem":"若一架无人机在飞行中可以进行舵面遥控，但无实时图像信号，地面站有各类仪表信息，但无法编辑航点航线，请问该无人机的遥控器（）正常，图传（）故障，数传电台（）正常，（）故障。","options":[{"key":"A","text":"下行链路，上行链路、下行链路、上行链路"},{"key":"B","text":"上行链路、下行链路、下行链路、上行链路"},{"key":"C","text":"上行链路、上行链路、下行链路、下行链路"}],"answer":"B","analysis":"提示：上下｜下上\n解析：遥控器上行链路正常，因为能控制飞机;图传下行链路故障，所以无图像信号;数传电台下行链路正常，有仪表信息;上行链路故障，无法编辑航点航线","tags":[],"bankId":"uav-qa"},{"id":"cmp-0108","type":"single","difficulty":1,"stem":"设置遥控器的某一开关键为飞行模式的切换，主要通过哪个功能菜单实现?","options":[{"key":"A","text":"EndPoint"},{"key":"B","text":"Condition"},{"key":"C","text":"Function"}],"answer":"C","analysis":"提示：Function\n解析：设置遥控器的某一开关键为飞行模式的切换，主要通过 Function(功能)菜单实现，可在该菜单下设置特定按键的功能为切换飞行模式。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0109","type":"single","difficulty":1,"stem":"什么电池记忆能力最强?","options":[{"key":"A","text":"镍氢电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"锂电池"}],"answer":"B","analysis":"提示：niè gé 镍镉\n解析：固定翼无人机中，发动机驱动螺旋桨产生推力，是核心动力部件。而镍镉电池相较于其他类型电池，具有更强的“记忆效应”即电池会“记住”之前的充电状态，使用时需先放电再充电。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0110","type":"single","difficulty":1,"stem":"升力公式L=1/2ρv²SCL中，各字母的含义分别是（）。","options":[{"key":"A","text":"CL为升力系数，ρ是运行环境大气密度，v是地速，S是机体迎风面积"},{"key":"B","text":"CL为升力系数，ρ是机体材密度，v是真空速，S是机体迎风面积"},{"key":"C","text":"CL为升力系数，ρ是运行环境大气密度，v是真空速，S是机翼面积"}],"answer":"C","analysis":"提示：S是机翼面积\n解析：升力公示L=1/2ρv²SCL，即:升力L=1/2*空气密度（运行环境大气密度）*真空速度的平方*机翼面积*升力系数。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0111","type":"single","difficulty":1,"stem":"使用独立电调的无人机，ESC上一般共有几根线?最粗的两根线连接的是（），最细的三根杜邦线连接的是（）。","options":[{"key":"A","text":"7或8、电源、飞控"},{"key":"B","text":"7或8、电源、电机"},{"key":"C","text":"5、电源、电机"}],"answer":"A","analysis":"提示：杜邦飞控\n解析：使用独立电调的无人机，ESC上一般共有7或8根线。其中，最粗的两根线连接的是电源，用于提供电能;最细的三根杜邦线连接的是飞控，用于接收飞控指令并控制电机。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0112","type":"single","difficulty":1,"stem":"使用遥控器遥控飞行时，如果无人机反映时断时续或无反应，不可能的原因是（）。","options":[{"key":"A","text":"遥控器电力不足"},{"key":"B","text":"磁场干扰"},{"key":"C","text":"动力电池电量不够"}],"answer":"C","analysis":"提示：选错的。通讯不好与动力电池无关\n解析：使用遥控器遥控飞行时，如果无人机反映时断时续或无反应，可能的原因包括遥控器电力不足、磁场干扰等。而动力电池电量不够主要影响无人机的飞行时间和性能，不会导致遥控器与无人机之间的通信问题。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0113","type":"single","difficulty":1,"stem":"四轴飞行器和八轴飞行器的区别是（）。","options":[{"key":"A","text":"四轴飞行时间短，效率高。八轴更稳"},{"key":"B","text":"四轴飞行时间久，效率高。八轴更稳"},{"key":"C","text":"八轴飞行时间久，效率高。四轴更稳"}],"answer":"B","analysis":"提示：四久八稳\n解析：四轴飞行器电机数量少，整体重量较轻，且每个电机分担的负载较低，因此在相同电池容量下，四轴的飞行时间更长，能源利用效率更高。八轴飞行器需要驱动更多电机，总能耗更大，飞行时间通常较短。八轴飞行器因多冗余设计(如电机故障时仍可平衡)，抗干扰能力更强，尤其在复杂气流或载重情况下更稳定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0114","type":"single","difficulty":1,"stem":"外转子电机规格2208、9T、KV1000分别代表什么含义?","options":[{"key":"A","text":"定子线圈直径22英寸，定子线圈高度8英寸，每分钟转速为1000转"},{"key":"B","text":"定子线圈直径22英寸，定子线圈高度8英寸，每伏特电压能达到的每分钟转速为1000转"},{"key":"C","text":"定子线圈直径22毫米，定子线圈高度8毫米，每伏特电压能达到的每分钟转速为1000转"}],"answer":"C","analysis":"提示：电机毫米，螺旋桨英寸\n解析：2208通常表示电机定子直径为22毫米、定子高度为8毫米；9T表示电机绕组为9匝；KV1000表示电机在空载状态下，每伏电压对应的理论转速约为1000转/分钟。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0115","type":"single","difficulty":1,"stem":"外转子电机和内转子电机，在相同电压、相同电流下，哪个转速快?","options":[{"key":"A","text":"外转子电机"},{"key":"B","text":"内转子电机"},{"key":"C","text":"一样大"}],"answer":"B","analysis":"提示：内转快\n解析：在相同电压、相同电流下，内转子电机转速快。内转子电机的转子在定子内部，转动惯量相对较小，容易达到较高的转速。外转子电机的转子在定子外部，转动惯量较大，转速相对较慢。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0116","type":"single","difficulty":1,"stem":"无人机GPS模式下人工管（）。","options":[{"key":"A","text":"姿态和位置"},{"key":"B","text":"位置"},{"key":"C","text":"位置修正量"}],"answer":"C","analysis":"提示：位置修正量\n解析：GPS模式下，飞控自动保持无人机的姿态和位置；驾驶员通过操纵杆给出位置移动或修正指令。松杆后，飞控通常会在新的位置保持悬停。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0117","type":"single","difficulty":1,"stem":"无人机的基本感度是什么感度?","options":[{"key":"A","text":"磁罗盘的感度"},{"key":"B","text":"姿态角的感度"},{"key":"C","text":"陀螺仪的感度"}],"answer":"C","analysis":"提示：陀螺仪负责角度（GPS定位，罗盘方向） 陀螺仪→角度→姿态、感度\n解析：无人机的基本感度是陀螺仪的感度。陀螺仪用于测量无人机的角速度，是维持无人机稳定飞行的关键传感器,对无人机的姿态稳定起着关键作用。磁罗盘主要用于确定方向，姿态角是由陀螺仪等多种传感器综合计算得出,其感度决定了无人机对姿态变化的响应程度。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0118","type":"single","difficulty":1,"stem":"无人机系统中的GPS模块为飞控提供了哪些信息?","options":[{"key":"A","text":"位置，高度与地速"},{"key":"B","text":"传感器，姿态与加速度"},{"key":"C","text":"经纬度，高度与空速"}],"answer":"A","analysis":"提示：GPS→地速\n解析：无人机系统中的GPS模块为飞控提供位置，高度与地速。GPS可以准确确定无人机的经纬度位置，同时通过测量信号传播时间差等方式获取高度信息，以及根据位置变化和时间计算出地速。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0119","type":"single","difficulty":1,"stem":"无人机用无刷电机的主要技术参数有哪些?","options":[{"key":"A","text":"转子直径、转子高度、KV值、功率W"},{"key":"B","text":"定子直径、转子高度、KV值、功率W"},{"key":"C","text":"定子直径、定子高度、KV值、功率W"}],"answer":"C","analysis":"提示：定定KW\n解析：无人机用无刷电机的主要技术参数有定子直径、定子高度、KV值、功率W。定子的尺寸决定了电机的大小和性能，KV值反映电机转速与电压的关系，功率则表示电机的做功能力。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0120","type":"single","difficulty":1,"stem":"无人机在姿态模式下（）。","options":[{"key":"A","text":"飞控参与外回路"},{"key":"B","text":"飞控参与内回路"},{"key":"C","text":"内外均参与"}],"answer":"B","analysis":"提示：姿态：内√，外×\n解析：姿态模式下，飞控通过内回路稳定无人机的姿态角和角速度；√姿态模式仅使用姿态稳定辅助功能，不使用位置修正辅助功能，因此飞控不参与位置外回路控制","tags":[],"bankId":"uav-qa"},{"id":"cmp-0121","type":"single","difficulty":1,"stem":"无人直升机遥控状态下动力失效最恰当的处置方式是?","options":[{"key":"A","text":"势能换动能，打负总距使旋翼高速下降，在离地面数米高时，再将总距变最大，迅速制止快速下沉，缓慢着陆"},{"key":"B","text":"无法安全降落，让其降落在人员稀少的地方"},{"key":"C","text":"开启降落伞"}],"answer":"A","analysis":"提示：缓慢着陆\n解析：本题与另一题“直升机动力失效”答案一致“总距 先最小再最大”直升机发动机失效后通过旋翼自转实现可控垂直下降的应急飞行状态，称为“自转下滑/自传下降”。发动机没了动力 → 打负总距，减小桨叶迎角、让旋翼靠下降气流自己转起来、转得很快（储存动能） → 离地数米时，猛地提总距，把旋翼的转动能量一下子挤成向上的升力，像垫了一个气垫，直升机就能轻缓落地。(直升机失去动力而下降、旋翼转速逐渐降低，这时要先“收总距”，旋翼阻力减小使得转速不会快速下降至危险的低转速。随着直升机下降速度的增加，风车效应使旋翼逐渐加速至期望的稳定转速状态。)（依据：中国航空协会发布的《直升机典型关键技术“自转着陆”解密》）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0122","type":"single","difficulty":1,"stem":"无刷电机如果遇到旋转方向相反，需要换向时如何处理?","options":[{"key":"A","text":"电调与飞控的连线进行对换"},{"key":"B","text":"电调与电源的连线进行对换"},{"key":"C","text":"电调与电机的连线3根任意对换2根"}],"answer":"C","analysis":"提示：换向 32\n解析：无刷电机如果遇到旋转方向相反，需要换向时电调与电机的连线3根任意对换2根。这样可以改变电机的磁场方向，从而改变电机的旋转方向。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0123","type":"single","difficulty":1,"stem":"下列属于定向天线的是（）。","options":[{"key":"A","text":"各长度鞭状天线"},{"key":"B","text":"蘑菇头天线"},{"key":"C","text":"八木天线"}],"answer":"C","analysis":"提示：定向：八木 全向：蘑菇头、鞭状\n解析：八木天线属于定向天线。八木天线具有较强的方向性，能将信号集中在特定方向上发射和接收。各长度鞭状天线和蘑菇头天线一般为全向天线。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0124","type":"single","difficulty":1,"stem":"现有两组10000mAh、6S、15C的电池将两组电池并联后使用1C充电，充满电后电源组的电压是多少?","options":[{"key":"A","text":"25.2V"},{"key":"B","text":"22.2V"},{"key":"C","text":"11.1V"}],"answer":"A","analysis":"提示：串联电压累积 单节电池电压3.7-4.2 充满4.2 4.2*6=25.2\n解析：6S表示6节电池串联，单节电池电压般为 3.7V(充满约 4.2V)，6S 总电压约为6x4.2=25.2V。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0125","type":"single","difficulty":1,"stem":"现有螺旋桨1845、1555和电机5035、4012，请写出最优组合（）。","options":[{"key":"A","text":"1845和4012，1555和4012"},{"key":"B","text":"1845和5035，1555和4012"},{"key":"C","text":"1845和4012，1555和5035"}],"answer":"B","analysis":"提示：大配大，小配小 1845和5035，1555和4012\n解析：较大尺寸的螺旋桨1845可能需要更大扭力和功率的电机来驱动，以达到理想的推力效果。因此，将其与较大功率的电机5035搭配可能是合适的。而较小尺寸的螺旋桨1555则可以选择与功率较小的电机4012搭配。最优组合应为1845和5035，1555和4012。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0126","type":"single","difficulty":1,"stem":"现有一块聚合物锂电池可能会长时间不使用，充放电至电量多少，电压多少储存合适?","options":[{"key":"A","text":"80%;4.7V"},{"key":"B","text":"20%;3.2V"},{"key":"C","text":"40%至50%;3.8V"}],"answer":"C","analysis":"提示：单节电池电压3.7-4.2 充满4.2 电量保持在40%至50%，选居中电压3.8\n解析：聚合物锂电池长时间储存时，建议电量保持在40%至50%，电压约为3.8V，以减缓容量流失。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0127","type":"single","difficulty":1,"stem":"现在常见的直升机中，平衡周期变距，克服挥舞的部件是（）。","options":[{"key":"A","text":"电子陀螺仪"},{"key":"B","text":"机械陀螺仪"},{"key":"C","text":"副翼"}],"answer":"A","analysis":"提示：挥舞电子\n解析：在直升机中，电子陀螺仪用于平衡周期变距并克服挥舞现象，它通过感知和调整施翼的角度，确保飞行稳定性。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0128","type":"single","difficulty":1,"stem":"需要灵活操控性能的飞机，选用（）电机。","options":[{"key":"A","text":"高直径"},{"key":"B","text":"高转速"},{"key":"C","text":"高扭矩"}],"answer":"B","analysis":"提示：高直径就是高扭矩，选剩下的转速\n解析：需要灵活操控性能的飞机，选用高转速电机。 高转速电机能够在单位时间内输出更高的转速，使得飞机能够快速响应操控指令，实现快速的加速、减速和转向等动作，从而提高飞机的灵活操控性能。 高直径电机通常在扭矩等方面有优势，但不一定能提供更好的灵活操控性。 高扭矩电机一般更适合需要大力矩输出的场景，而不是以灵活操控性能为主的情况。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0129","type":"single","difficulty":1,"stem":"旋翼飞行器从悬停到高速前飞的增速过程中，需用功率如何变化?","options":[{"key":"A","text":"一直增大"},{"key":"B","text":"一直减小"},{"key":"C","text":"先减小后增大"}],"answer":"C","analysis":"提示：先小后大\n解析：旋翼飞行器从悬停到高速前飞的增速过程中，需用功率会先减小后增大，这是因为在增速初期，诱导功率减小导致总需用功率减小，而随着速度增加，型阻功率增大导致总需用功率增大","tags":[],"bankId":"uav-qa"},{"id":"cmp-0130","type":"single","difficulty":1,"stem":"选择哪一个功能选项，在手动遥控飞行时，可以改变各通道的操作灵敏度?","options":[{"key":"A","text":"微调比例"},{"key":"B","text":"行程比例"},{"key":"C","text":"通道速度"}],"answer":"B","analysis":"提示：行程比例改灵敏\n解析：D/R（Dual Rate） = 大小舵 = 双重比例 = 行程比例根据各遥控器说明书：行程比例即通道输出比例，单独设置各通道最大输出占比，以此改变对应通道的操作灵敏度。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0131","type":"single","difficulty":1,"stem":"遥控器、图传、地面站与飞行器之间数据链路分别是（）。","options":[{"key":"A","text":"上行链路，下行链路，上行链路"},{"key":"B","text":"上行链路，下行链路，上下行链路并存"},{"key":"C","text":"下行链路，下行链路，上行链路"}],"answer":"B","analysis":"提示：上下并存\n解析：民用无人机系统有三条主要链路。遥控器发指令给无人机：上行无人机传图回来：下行(地面站/飞行)数据来回： 上下（鼠鼠老师的话：我们想想一下，我们在地上，用遥控器遥控天上的无人机，发出去的“指令”往上走，所以是“上传”; 无人机通过摄像头拍到影像回传到地面，图像往下走，所以是下行。地面站、飞行相关数据需要实时来回反馈调整，所以是上下行）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0132","type":"single","difficulty":1,"stem":"遥控器菜单中FAIL SAFE代表什么意思?","options":[{"key":"A","text":"飞行模式切换"},{"key":"B","text":"失控保护"},{"key":"C","text":"通道反向"}],"answer":"B","analysis":"提示：FAIL SAFE→失败安全→失控保护\n解析：遥控器菜单中“FAIL SAFE”代表失控保护。当遥控器信号丢失或出现异常情况时系统会根据预先设置的失控保护模式进行相应的操作，以降低风险","tags":[],"bankId":"uav-qa"},{"id":"cmp-0133","type":"single","difficulty":1,"stem":"遥控器菜单中SUBTRIM代表什么意思?","options":[{"key":"A","text":"通道反向"},{"key":"B","text":"中立微调"},{"key":"C","text":"失控保护"}],"answer":"B","analysis":"提示：S中立微调\n解析：遥控器菜单中“SUBTRIM”代表中立微调。用于微调通道的中立位置，使飞行器或模型在静止状态下能够保持更好的平衡和稳定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0134","type":"single","difficulty":1,"stem":"遥控器设置菜单中REV是设置什么的?","options":[{"key":"A","text":"通道行程"},{"key":"B","text":"通道反向"},{"key":"C","text":"失控保护"}],"answer":"B","analysis":"提示：R→倒档→反向\n解析：遥控器设置菜单中“REV”是设置通道反向的。可以根据实际需求将某个通道的控制方向进行反向设置。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0135","type":"single","difficulty":1,"stem":"遥控器中升降舵、副翼、方向舵、油门的英文简称是什么?","options":[{"key":"A","text":"ELE、THR、RUD、AIL"},{"key":"B","text":"RUD、AIL、ELE、THR"},{"key":"C","text":"ELE、AIL、RUD、THR"}],"answer":"C","analysis":"提示：eart\n解析：遥控器中升降舵(Elevator)英文简称是ELE;副翼(Aileron)英文简称是 AIL;方向舵(Rudder)英文简称是 RUD;油门(Throttle)英文简称是 THR,","tags":[],"bankId":"uav-qa"},{"id":"cmp-0136","type":"single","difficulty":1,"stem":"一般不用来给无人机提供高度信息的传感器是（）。","options":[{"key":"A","text":"GPS、气压计"},{"key":"B","text":"温度传感器、大气湿度传感器"},{"key":"C","text":"无线电高度表、超声波传感器"}],"answer":"B","analysis":"提示：选错的。温度湿度高度无关\n解析：温度传感器和大气湿度传感器一般不用来给无人机提供高度信息。GPS、气压计、无线电高度表、超声波传感器等可以用于获取无人机的高度信息。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0137","type":"single","difficulty":1,"stem":"一般情况下，无人机使用电机5022和4025哪个电机的KV值大些?","options":[{"key":"A","text":"5022"},{"key":"B","text":"4025"},{"key":"C","text":"一样快"}],"answer":"B","analysis":"提示：4025 KV 值大\n解析：电机型号中的前两位数字一般表示电机定子的直径，后两位数字表示电机定子的高度。通常情况下，电机尺寸越小，KV值越大。4025电机尺寸小于5022电机,所以 4025电机的KV值大些。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0138","type":"single","difficulty":1,"stem":"一般情况下，要增加直升机最大负载，最合适的办法是（）。","options":[{"key":"A","text":"增加转速，增大桨距"},{"key":"B","text":"增加转速，减小桨距"},{"key":"C","text":"减小转速，增大桨距"}],"answer":"B","analysis":"提示：增加负载：加速减距\n解析：一般情况下，要增加直升机最大负载，最合适的办法是增加转速，减小桨距。直升机的升力主要由旋翼产生，而旋翼的升力与其转速密切相关。随着旋翼转速的增加升力也会相应增大。因此，增加转速有助于提升直升机的负载能力。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0139","type":"single","difficulty":1,"stem":"已知某锂电池标记为6S2P3C，单片锂电池容量为16000mAh，则该电池最大放电电流是（）。","options":[{"key":"A","text":"16A"},{"key":"B","text":"96A"},{"key":"C","text":"48A"}],"answer":"B","analysis":"提示：16000mAh=16Ah 并联2P: 2*16=32 放电3C: 3*32=96\n解析：已知某锂电池标记为6S2P3C，单片锂电池容量为 16000mAh。6S表示由6节电池串联，2P表示2组并联，3C 表示最大放电倍数为3倍。先计算并联后的总容量为16000x2=32000mAh，6节串联后的电压约为 6x3.7V=22.2V(以锂电池标称电压3.7V计算)。根据最大放电电流=容量*放电倍数，可得最大放电电流为 32000mAhx3=96000mA=96A.","tags":[],"bankId":"uav-qa"},{"id":"cmp-0140","type":"single","difficulty":1,"stem":"以6S5000mAh20C(3C)锂电池为例子，最大放电电流是多少?","options":[{"key":"A","text":"30A"},{"key":"B","text":"15A"},{"key":"C","text":"100A"}],"answer":"C","analysis":"提示：5000mAh=5Ah 串联电流不变 放电倍数20C: 20*5=100 （大值C放电倍率，小值C充电倍率）\n解析：以6S5000mAh20C(3C)锂电池为例子最大放电电流为容量 x最大放电倍数即5000mAhx20=100000mA=100A。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0141","type":"single","difficulty":1,"stem":"以下不属于直升机的是?","options":[{"key":"A","text":"单旋翼带尾桨"},{"key":"B","text":"倾转旋翼机"},{"key":"C","text":"共轴双旋翼"}],"answer":"B","analysis":"提示：选错的。倾转×\n解析：倾转旋翼机=固定翼+直升机· 直升机的旋翼必须全程水平旋转，同时提供升力和推进力；· 倾转旋翼机的旋翼可以改变角度，在水平飞行阶段，升力由机翼承担，旋翼主要提供推进力，不再是直升机定义里的 “由水平旋转的旋翼提供升力和推进力” 的航空器","tags":[],"bankId":"uav-qa"},{"id":"cmp-0142","type":"single","difficulty":1,"stem":"以下关于舵面遥控(纯手动)、姿态遥控、人工修正(即GPS模式)说法不正确的是?","options":[{"key":"A","text":"人工修正模式下，飞控内外回路都参与工作"},{"key":"B","text":"姿态遥控模式下，飞控内回路不参与工作，外回路参与工作提供位置信息"},{"key":"C","text":"舵面遥控模式下，飞控内外回路都不参与工作"}],"answer":"B","analysis":"提示：人工修正：都 舵面：都不 姿态：一个参与一个不参与\n解析：飞控外环控制器对高度速度和航向进行控制，而内环控制器对姿态角进行控制。 纯手动（舵面遥控）→人管舵面，飞控不管：飞控内外都不管姿态遥控（飞控参与控制内回路，不使用位置修正辅助功能）：飞控只管内 不管外GPS模式（人工修正模式）→飞控管理内外回路，人只负责修正：飞控 内外都要参与 知识点1：来自蓝皮书《无人机驾驶员航空知识手册》表述： (1)舵面遥控。这种控制方式是由控制站上的操纵杆直接控制无人机的能面, 遥控无人机的飞行。 (2)姿态遥控。姿态遥控是在无人机具有姿态稳定控制机构的基础上,通过 操纵杆控制无人机的俯仰角、滚转角和偏航角,从而改变无人机的运动。 (3)指令控制。这种方式是通过上行链路发送控制指令,机载计算机接收到指令后按预定的控制模式执行。这种方式必须在机载自动驾驶仪或机裁飞行管理与控制系统自动控制的基础上实施。指令方式一般包括:俯仰角选择与控制、高度选择与保持、飞行速度控制、滚转选择与控制、航向选择与保持、航迹控制。 知识点2：来自北航自动化科学与电气工程学院《底层飞控控制实验》课件：科学与电气工程学院自动化科学与电气工 固定翼无人机的底层飞行控制主要分为两个环路，分别为姿态控制环路和高度速度控制环路。 固定翼无人机采用内外环的控制策略。外环控制器对高度速度和航向进行控制，而内环控制器对姿态角进行控制。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0143","type":"single","difficulty":1,"stem":"以下关于翼型相对厚度和相对弯度正确的是?","options":[{"key":"A","text":"翼型相对厚度越大，相对弯度就越大，能产生的升力就越大"},{"key":"B","text":"翼型中弧线的最高点距翼弦线的最大距离与翼弦长的比值称为相对弯度"},{"key":"C","text":"翼型上下表面垂直于翼弦的距离最长的距离值称为相对厚度"}],"answer":"B","analysis":"提示：相对都是比值\n解析：相对厚度:这是指翼型的最大厚度与其弦长之比。 相对弯度:这是翼型中弧线的最大弯度与其弦长之比。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0144","type":"single","difficulty":1,"stem":"以下哪一只螺旋桨升力最大?","options":[{"key":"A","text":"18x7(两叶螺旋桨)"},{"key":"B","text":"16x4.5(三叶螺旋桨)"},{"key":"C","text":"15x4(四叶螺旋桨)"}],"answer":"A","analysis":"提示：18x7，直径和螺距都大\n解析：螺旋桨的升力大小与桨叶直径和螺距有关一般来说，直径越大、螺距越大，升力越大。18x7的螺旋桨直径为18，螺距为7;16x4.5的螺旋桨直径为16，螺距为45；15x4的螺旋桨直径为15，螺距为4。相比之下，18x7的螺旋桨直径最大且螺距也较大，所以升力最大。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0145","type":"single","difficulty":1,"stem":"以下哪种多旋翼是H型机架?","options":[{"key":"A","text":"悟"},{"key":"B","text":"经纬M600"},{"key":"C","text":"MAVIC"}],"answer":"A","analysis":"提示：悟\n解析：“悟”是 H 型机架，大疆“悟”Inspire 系列无人机采用了可变形的H型机架设计。经纬M600是传统的多轴机架设计，MAVIC(大疆御系列)也不是H型机架","tags":[],"bankId":"uav-qa"},{"id":"cmp-0146","type":"single","difficulty":1,"stem":"以下是共轴双旋翼直升机的优点的是（）。","options":[{"key":"A","text":"操作结构简单"},{"key":"B","text":"自转下滑性能优异"},{"key":"C","text":"纵向尺寸小"}],"answer":"C","analysis":"提示：共轴→尺寸小，\n解析：共轴双旋翼直升机的优点是纵向尺寸小。共轴双旋翼直升机的两副旋翼上下共轴反转，没有尾桨，使得直升机的纵向尺寸大大减小，更适合在狭窄空间中使用。操作结构并不简单，比单旋翼直升机结构更复杂;自转下滑性能也不是其突出优点。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0147","type":"single","difficulty":1,"stem":"以下无人机部件：数传电台、飞控、电子调速器、OSD、5.8G图传、电机、摄像头等，连接方式正确的是?","options":[{"key":"A","text":"OSD - 5.8G图传 - 电机"},{"key":"B","text":"电机 - 电子调速器 - 数传电台 - 飞控"},{"key":"C","text":"电机 - 电子调速器 -飞控 - 数传电台"}],"answer":"C","analysis":"提示：电子飞数（电子飞鼠）\n解析：无人机相关部件的正确连接方式为电机连接电子调速器，电子调速器连接飞控，飞控连接数传电台。数传电台用于实现地面站与飞控之间的数据传输;电子调速器用于控制电机的转速;飞控是无人机的核心控制部件。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0148","type":"single","difficulty":1,"stem":"用于起降遥控器中的AIL，RUD，分别控制多旋翼无人机，（）。","options":[{"key":"A","text":"AIL(左右移动)，RUD(左右水平旋转)"},{"key":"B","text":"AIL(左右水平旋转)，RUD(左右移动)"},{"key":"C","text":"AIL(前后移动)，RUD(上下移动)"}],"answer":"A","analysis":"提示：RUD旋转\n解析：在起降遥控器中，AIL(Aileron)是副翼通道，控制多旋翼无人机的左右移动; RUD(Rudder)是方向舵通道，控制多旋翼无人机的左右水平旋转。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0149","type":"single","difficulty":1,"stem":"有三种规格的电机: (1)3s30000mAh400kv;(2)4s20000mAh600kv;(3)6s10000mAh800kv，哪个转速高？","options":[{"key":"A","text":"第(1)种"},{"key":"B","text":"第(2)种"},{"key":"C","text":"第(3)种"}],"answer":"C","analysis":"提示：转速=电压x电机 KV 3*400 、4*600 、6*800，选大的\n解析：电机的转速可以通过公式: 转速(RPM)=电压(V)x电机 KV 值 来计算。 对于规格(1):3S 表示 3节锂电池串联每节锂电池标准电压约 3.7V，充满电约4.2V，所以 3S 电池的电压大约为 11.1-12.6V。取平均值 11.85V，转速约为 11.85Vx 400kv = 47400 RPM。 对于规格(2):4S 电池的电压大约为14.8-16.8V，取平均值 15.8V，转速约为 15.8Vx600kv=94800 RPM。 对于规格(3):6S 电池的电压大约为22.2-25.2V，取平均值 23.7V，转速约为23.7Vx800kv=189600 RPM。通过计算可知，规格(3)的转速最高。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0150","type":"single","difficulty":1,"stem":"在自主飞行过程中，遥控器油门的位置应处于（）。","options":[{"key":"A","text":"油门处与中间略上"},{"key":"B","text":"油门处于最下方"},{"key":"C","text":"油门处于最上方"}],"answer":"A","analysis":"提示：油门中间略上\n解析：在自主飞行过程中，遥控器油门的位置应处于油门处与中间略上，这样可以在需要时随时接管控制并进行调整，同时也避免意外触碰导致的错误操作。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0151","type":"single","difficulty":1,"stem":"直升机的重心位置在（）。","options":[{"key":"A","text":"直升机主轴后处"},{"key":"B","text":"直升机主轴前处"},{"key":"C","text":"直升机发动机处"}],"answer":"B","analysis":"提示：重心一般在前边 （重心→机翼焦点→飞机焦点）\n解析：直升机的重心位置一般在直升机主轴前处，这样可以使直升机在飞行过程中更加稳定，并且有利于操纵。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0152","type":"single","difficulty":1,"stem":"直升机旋翼头有几种结构形式?","options":[{"key":"A","text":"铰链式旋翼星型柔性桨毂"},{"key":"B","text":"无铰式旋翼万向接头式"},{"key":"C","text":"以上都是"}],"answer":"C","analysis":"提示：铰链都是\n解析：直升机旋翼头有多种结构形式，包括铰链式旋翼星型柔性桨毂、无铰式旋翼万向接头式等。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0153","type":"single","difficulty":1,"stem":"直升机在飞行过程中，若尾旋翼失效，飞机将（）。","options":[{"key":"A","text":"继续保持原来飞行姿态"},{"key":"B","text":"自旋"},{"key":"C","text":"自旋几圈后恢复原来姿态"}],"answer":"B","analysis":"提示：尾旋翼失效将自旋\n解析：直升机在飞行过程中，若尾旋翼失效，飞机将自旋。尾旋翼的主要作用是平衡主旋翼产生的扭矩，若尾旋翼失效，直升机将失去平衡扭矩的作用而发生自旋。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0154","type":"single","difficulty":1,"stem":"众所周知，物体运动的速度是一个矢量，关于飞行过程中空速与地速的关系，下列正确的是?","options":[{"key":"A","text":"正侧风时，空速=地速"},{"key":"B","text":"无论何时，空速+风速=地速"},{"key":"C","text":"逆风时，空速<地速"}],"answer":"B","analysis":"提示：空速+风速=地速\n解析：无论何时，空速与风速的矢量和等于地速。正侧风时，空速与地速大小不相等;逆风时，空速大于地速，","tags":[],"bankId":"uav-qa"},{"id":"cmp-0155","type":"single","difficulty":1,"stem":"自动定高飞行时，飞行器持续升高或下降，不可能的原因是（）。","options":[{"key":"A","text":"角速度故障"},{"key":"B","text":"动力系统故障"},{"key":"C","text":"高度传感器故障"}],"answer":"A","analysis":"提示：选错的。陀螺仪负责角度，不是高度\n解析：自动定高飞行时，飞行器持续升高或下降可能是高度传感器故障或者动力系统故障。高度传感器故障会导致飞行器无法准确感知高度从而出现高度异常;动力系统故障可能导致升力变化从而引起高度变化。而角速度故障一般不会直接导致飞行器持续升高或下降。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0156","type":"single","difficulty":1,"stem":"自动驾驶仪中的陀螺是用来测量哪些物理量的?","options":[{"key":"A","text":"角速度"},{"key":"B","text":"加速度"},{"key":"C","text":"方向"}],"answer":"A","analysis":"提示：陀螺仪负责角度\n解析：自动驾驶仪中的陀螺是用来测量角速度的。陀螺仪通过测量飞行器的角速度来感知飞行器的姿态变化，为自动驾驶仪提供姿态信息。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0157","type":"single","difficulty":1,"stem":"自动驾驶仪中的陀螺是用来测量哪些物理量?","options":[{"key":"A","text":"飞机角速度或飞机姿态"},{"key":"B","text":"飞机角速率或飞机姿态角"},{"key":"C","text":"飞机角速度或飞机姿态角"}],"answer":"C","analysis":"提示：陀螺仪负责角度 角速度+姿态角\n解析：自动驾驶仪中的陀螺是用来测量飞机角速度或飞机姿态角，陀螺能够感知飞机绕名个轴的旋转角速度，从而为自动驾驶仪提供飞机姿态变化的信息。同时，也可以测量飞机的姿态角，如俯仰角、滚转角和偏航角等。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0158","type":"single","difficulty":1,"stem":"一般冬天和夏天相比，我们返航电压应该怎么设置?为什么?","options":[{"key":"A","text":"冬天要高于夏天。冬天温度低，锂离子活性变低，持续放电时间短"},{"key":"B","text":"冬天要低于夏天。冬天温度低，锂离子活性变低，持续放电时间短"},{"key":"C","text":"冬天要高于夏天。冬天温度低，锂离子活性变高，持续放电时间短"}],"answer":"A","analysis":"提示：跟手机一样，冬天不耐用，电压设置要高才够\n解析：一般冬天和夏天相比，返航电压应该冬天要高于夏天。因为冬天温度低，锂离子活性变低，持续放电时间短，设置较高的返航电压可以确保无人机有足够的电量安全返航。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0159","type":"single","difficulty":1,"stem":"无人机过于灵敏，应该调整遥控器上的什么感度?","options":[{"key":"A","text":"IMU感度"},{"key":"B","text":"飞控感度"},{"key":"C","text":"姿态感度"}],"answer":"C","analysis":"提示：过于灵敏调姿势\n解析：无人机过于灵敏，应该调整遥控器上的姿态感度。姿态感度调整可以控制无人机对姿态变化的响应速度，降低姿态感度可以使无人机的动作变得更加平缓，不那么灵敏。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0160","type":"single","difficulty":1,"stem":"无人机视距外飞行丢星怎么办?","options":[{"key":"A","text":"自动悬停"},{"key":"B","text":"降高度"},{"key":"C","text":"升高度"}],"answer":"C","analysis":"提示：丢星→丢失卫星信号 升高→离卫星更近\n解析：无人机视距外飞行丢星时，可以升高高度。在较高的高度上，无人机可能更容易接收到卫星信号。自动悬停可能会因为没有卫星定位而无法准确保持位置;降高度不一定能解决丢星问题。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0161","type":"single","difficulty":1,"stem":"无人机怎么飞最省油或最省电?","options":[{"key":"A","text":"匀速"},{"key":"B","text":"高速"},{"key":"C","text":"低速"}],"answer":"A","analysis":"提示：跟汽车电动车一样\n解析：当无人机匀速飞行时，动力系统的输出功率相对稳定，不会因为频繁的加速和减速而造成能量的额外消耗。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0162","type":"single","difficulty":1,"stem":"高海拔下航时及载重能力将大大缩短，此时应如何配置螺旋桨及电机?","options":[{"key":"A","text":"高KV，小直径，小螺距"},{"key":"B","text":"低KV，大直径，大螺距"},{"key":"C","text":"高KV，大直径，小螺距"}],"answer":"C","analysis":"提示：高高大小（海拔高需要高KV大直径）\n解析：在高海拔下，选择高KV、大直径、小螺距的螺旋桨及电机配置可以有效地提高飞行器的航时和载重能力，使其能够在恶劣的环境条件下稳定运行。高KV值电机具有较高的转速。在高海拔地区，空气密度降低，飞行器需要更快的桨叶转速来推动空气产生升力。高KV值电机能够在相同电压下提供更高的转速，从而使螺旋桨以更快的速度旋转，以弥补空气稀薄带来的升力不足问题。大直径螺旋桨增加升力面积，小螺距降低电机负载。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0163","type":"single","difficulty":1,"stem":"高原地区16*8两叶，17*6两叶，15*5三叶，灵活性最好的是哪一个?最省电是哪一个？","options":[{"key":"A","text":"灵活15*5三叶，最省电17*6两叶"},{"key":"B","text":"灵活16*8两叶，最省电17*6两叶"},{"key":"C","text":"灵活15*5三叶，最省电16*8两叶"}],"answer":"A","analysis":"提示：三页灵活，叶片越大最省电，17最大\n解析：15*5三叶配置在灵活性方面表现最佳，因为其三叶设计和较小的叶片尺寸提供了更好的灵活性和稳定性。而17*6两叶配置可能在某些风速条件下更省电，因为其较大的叶片面积能更有效地捕获风能，同时两叶设计产生的阻力较小。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0164","type":"single","difficulty":1,"stem":"某多轴电调上标有“15A”字样，意思是指( )。","options":[{"key":"A","text":"电调所能承受的稳定工作电流是15安培"},{"key":"B","text":"电调所能承受的最大瞬间电流是15安培"},{"key":"C","text":"电调所能承受的最小工作电流是15安培"}],"answer":"B","analysis":"提示：考试选瞬时电流给分\n解析：虽然常规应该是持续最大电流，但是根据2个考场反馈，综合10题出现这题，考试选瞬时电流给分无人机电调（ESC）上最明显标注的电流通常是持续电流（持续安培数），通常以字母“A”表示，例如30A、40A等。此外，部分电调还会标注瞬时电流（峰值电流），通常以“X”或“XX”开头，例如X30A表示瞬时电流可达30A。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0165","type":"single","difficulty":1,"stem":"固定翼无人机在姿态遥控状态下，如出现动力失效则正确的处理方法是（）。","options":[{"key":"A","text":"保持略大于平飞速度的速度建立下滑航线飞回本场或迫降无人区"},{"key":"B","text":"势能换动能，低头俯冲"},{"key":"C","text":"仅剩的动能转换势能，保持上仰姿态与安全高度"}],"answer":"A","analysis":"提示：动力失效就迫降\n解析：当飞行过程中的固定翼无人机出现动力失效，正确处理方法是保持略大于平飞速度的速度建立下滑航线飞回本场或迫降无人区。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0166","type":"single","difficulty":1,"stem":"多旋翼飞行器上的链路天线应尽量（）飞控和GPS天线安装。","options":[{"key":"A","text":"贴合"},{"key":"B","text":"靠近"},{"key":"C","text":"远离"}],"answer":"C","analysis":"提示：远离，因为互干扰\n解析：多旋翼飞行器上的链路天线应尽量远离飞控和GPS天线安装。因为链路天线与其他天线的电磁干扰可能会影响信号质量，从而影响飞行器的稳定性和通信效果。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0167","type":"single","difficulty":1,"stem":"遥控器上舵机反向的英文菜单名是（）？","options":[{"key":"A","text":"REVERSE"},{"key":"B","text":"FAIL SAFE"},{"key":"C","text":"D/R.EXP"}],"answer":"A","analysis":"提示：RE反向\n解析：REVERSE：中文含义为 “反向、反转”，在遥控器菜单中专门用于设置舵机（如方向舵、升降舵、副翼等）的运动方向，当舵机实际动作与操作指令相反时，通过该功能可调整至正确方向，是对应 “舵机反向” 的核心选项。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0168","type":"single","difficulty":1,"stem":"遥控器上双比率/指数曲线的英文菜单名是（）？","options":[{"key":"A","text":"REVERSE"},{"key":"B","text":"FAIL SAFE"},{"key":"C","text":"D/R.EXP"}],"answer":"C","analysis":"提示：比率带除号/\n解析：D/R.EXP：是 “Dual Rate（双比率）” 和 “Exponential（指数曲线）” 的组合缩写。其中 “Dual Rate” 用于调整舵机的最大行程量（如调整转向角度大小），“Exponential” 用于优化操作杆的灵敏度（使操作杆在中间位置时更细腻，边缘位置灵敏度降低或提升），二者共同对应 “双比率 / 指数曲线” 功能。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0169","type":"single","difficulty":1,"stem":"遥控器上微调的英文菜单名是（）？","options":[{"key":"A","text":"END POINT"},{"key":"B","text":"SUB TRIM"},{"key":"C","text":"TRIM"}],"answer":"C","analysis":"提示：微调TRIM\n解析：遥控器上微调的英文菜单名是TRIM，中文含义为 “微调”。其核心功能是在不改变主操作杆位置时，对舵机（如油门、方向、升降舵等）的中立位置或微小行程做精细修正，比如消除模型轻微跑偏、让油门稳定怠速，是日常操控中高频使用的实时微调功能，满足精准控制需求。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0170","type":"single","difficulty":1,"stem":"遥控器上行程量的英文菜单名是（）？","options":[{"key":"A","text":"END POINT"},{"key":"B","text":"SUB TRIM"},{"key":"C","text":"TRIM"}],"answer":"A","analysis":"提示：行程量-结束点END\n解析：遥控器上行程量的英文菜单名是 END POINT。其核心功能是调整并限制舵机的最大运动行程，比如控制方向舵的最大转向角度、升降舵或副翼的最大偏转幅度。通过设定合适的行程量，可避免舵机因行程过大导致模型机械结构损坏，同时能精准匹配不同模型的操控需求，确保舵机动作在安全且高效的范围内运行。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0171","type":"single","difficulty":1,"stem":"围绕横轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"B","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：围绕多轴飞行器横轴的是俯仰运动，比如飞行器向前或向后倾斜飞行就是围绕横轴的俯仰运动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0172","type":"single","difficulty":1,"stem":"围绕纵轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"A","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：围绕多轴飞行器纵轴的是滚转运动，当飞行器向左或向右横滚就是围绕纵轴的滚转运动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0173","type":"single","difficulty":1,"stem":"围绕立轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"C","analysis":"提示：横俯仰，立偏航\n解析：围绕多轴飞行器立轴的是偏航运动，像飞行器原地向左或向右旋转就是围绕立轴的偏航运动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0174","type":"single","difficulty":1,"stem":"翼型弦长是指（）的距离。","options":[{"key":"A","text":"左翼尖到右翼尖"},{"key":"B","text":"机身中心线到翼尖"},{"key":"C","text":"机翼前缘到后缘"}],"answer":"C","analysis":"提示：翼弦缘 翼展尖\n解析：指翼型前缘（最前端点）与后缘（最后端点）之间的连线长度，这条连线被称为 “弦线”，弦线的实际长度就是弦长。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0175","type":"single","difficulty":1,"stem":"机翼之所以能产生升力，是因为（）。","options":[{"key":"A","text":"主机翼和水平尾翼之间产生了压力差"},{"key":"B","text":"机翼上下表面产生了压力差"},{"key":"C","text":"机翼前后产生了压力差"}],"answer":"B","analysis":"提示：下上压力差\n解析：机翼的设计特点使其下表面为正压，上表面为负压，这种压力差产生了升力，使飞机能够飞行。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0176","type":"single","difficulty":1,"stem":"机翼失速是因为（）。","options":[{"key":"A","text":"超过了最大爬升角"},{"key":"B","text":"超过了最大迎角"},{"key":"C","text":"超过了临界迎角"}],"answer":"C","analysis":"提示：失速-临界迎角\n解析：失速是指机翼迎角超过临界迎角时，气流从机翼上表面分离，导致升力急剧降低、阻力急剧增大的一种飞行状态。对于旋翼无人机，前飞速度快可能使后行旋翼迎角过大而出现失速。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0177","type":"single","difficulty":1,"stem":"有2个输出功率相同的电机，前者型号3508，后者型号2820，以下表述正确的是（）。","options":[{"key":"A","text":"2820合带动更大的螺旋桨"},{"key":"B","text":"3508适用于更高的转速"},{"key":"C","text":"尺寸上，2820高一些，3508粗一些"}],"answer":"C","analysis":"提示：3508直径粗，2820高度高\n解析：前两位数字表示电机转子的直径，后两位数字表示电机转子的高度。所以3508电机转子的直径是35mm，高度是8mm；2820电机转子的直径是28mm，高度是20mm。因此，3508电机直径更粗，2820电机高度更高。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0178","type":"single","difficulty":1,"stem":"用遥控器设置电调，需要（）。","options":[{"key":"A","text":"断开电机"},{"key":"B","text":"接上电机"},{"key":"C","text":"断开动力电源"}],"answer":"B","analysis":"提示：设置电调要接电机\n解析：在设置电调（电子调速器）时，通常需要接上电机，因为电调的设置过程往往涉及与电机之间的信号校准和测试，主要是检查电机的正反转。如果断开电机，电调可能无法正确识别或完成设置流程。但是要注意为了安全，不连接桨叶。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0179","type":"single","difficulty":1,"stem":"有些飞机的翼尖部位安装了翼梢小翼，它的功用是()。","options":[{"key":"A","text":"减小摩擦阻力"},{"key":"B","text":"减小压差阻力"},{"key":"C","text":"减小诱导阻力"}],"answer":"C","analysis":"提示：诱导阻→升力和翼展长度和翼尖 干扰阻→ 部件平整度 （诱导阻→增大展弦比，减小诱导阻力，与翼型无关）\n解析：翼尖安装翼梢小翼的功用是减小诱导阻力。它改变了翼尖处的气流流动，减少翼尖涡的强度。翼尖涡导致诱导阻力产生，翼梢小翼通过阻挡上下表面气流的横向流动，降低涡的强度，从而减小诱导阻力。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0180","type":"single","difficulty":1,"stem":"民用无人机的空机重量（）。","options":[{"key":"A","text":"不包含载荷的无人机重量"},{"key":"B","text":"不包含载荷、电池和燃料的无人机重量"},{"key":"C","text":"不包含载荷、燃料的无人机重量"}],"answer":"C","analysis":"提示：不包含载荷、燃料\n解析：民用无人机的空机重量，指的是不包含载荷、燃料的无人机自身的重量，即空机重量是指无人机在没有任何外部载荷(如相机、货物等)和燃料(如电池电量耗尽时)的情况下的重量。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0181","type":"single","difficulty":1,"stem":"民用无人机上的舵机一般输出行程为（）。","options":[{"key":"A","text":"正负120°"},{"key":"B","text":"正负20°"},{"key":"C","text":"正负60°"}],"answer":"B","analysis":"提示：民用舵机，正负20度\n解析：民用无人机上的舵机一般输出行程为正负20度。舵机能够从其中立位置向两个方向名转动20度，总共覆盖40度的范围。这个输出行程对于大多数无人机飞行控制来说是足够的，因为它允许无人机进行必要的方向调整和姿态控制。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0182","type":"single","difficulty":1,"stem":"无人机飞行员在操纵飞机平飞时，遇到强烈的垂直上升气流时，为了防止过载超规定应（）。","options":[{"key":"A","text":"适当减小飞行速度"},{"key":"B","text":"加大油门迅速脱离"},{"key":"C","text":"以最大上升率增大高度"}],"answer":"A","analysis":"提示：减速保平安（上升气流，减速）\n解析：在遇到强烈的垂直上升气流时，无人机飞行员应适当减小飞行速度，以防止过载超过规定。加大油门迅速脱离可能导致过载，而以最大上升率增大高度也可能增加过载风险。适当减小速度是最安全的应对措施。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0183","type":"single","difficulty":1,"stem":"遥控器上油门舵的英文菜单名是（）。","options":[{"key":"A","text":"THROTTLE CUT"},{"key":"B","text":"THROTTLE"},{"key":"C","text":"AUX-CH"}],"answer":"B","analysis":"提示：油门THROTTLE\n解析：“THROTTLE” 在遥控器操作语境中，核心含义为 “油门、节气门”，是直接对应 “油门舵” 功能的标准英文表述。其主要作用是控制航模、车模等设备的动力输出大小，是调节设备速度或动力强弱的核心操控菜单标识。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0184","type":"single","difficulty":1,"stem":"遥控器上油门关闭的英文菜单名是（）。","options":[{"key":"A","text":"THROTTLE CUT"},{"key":"B","text":"THROTTLE"},{"key":"C","text":"AUX-CH"}],"answer":"A","analysis":"提示：关闭CUT\n解析：“THROTTLE CUT” 由 “THROTTLE（油门）” 和 “CUT（切断、关闭）” 组合而成，核心功能是紧急关闭设备（如航模、车模）的油门动力，是实现 “油门关闭” 的标准英文菜单标识，常见于需要快速中断动力的操控场景。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0185","type":"single","difficulty":1,"stem":"遥控器上通道设置的英文菜单名是（）。","options":[{"key":"A","text":"THROTTLE CUT"},{"key":"B","text":"THROTTLE"},{"key":"C","text":"AUX-CH"}],"answer":"C","analysis":"提示：通道AUX-CH\n解析：“AUX-CH” 全称为 “Auxiliary Channel”，即 “辅助通道”，是遥控器通道设置里用于标识和配置辅助功能通道的菜单名，可连接并控制起落架、灯光、云台等非核心动力部件，是通道设置中的重要选项。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0186","type":"single","difficulty":1,"stem":"遥控器如何恢复初始设置？","options":[{"key":"A","text":"SUB TRIM"},{"key":"B","text":"DATA RESET"},{"key":"C","text":"REVERSE"}],"answer":"B","analysis":"提示：恢复初始RESET\n解析：“DATA RESET” 意为 “数据重置”，常见于各类遥控器的设置菜单中，用于将遥控器的所有设置恢复到出厂默认状态。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0187","type":"single","difficulty":1,"stem":"遥控器指令链路属于（）。","options":[{"key":"A","text":"单向上行链路"},{"key":"B","text":"单向下行链路"},{"key":"C","text":"双向链路"}],"answer":"A","analysis":"提示：遥控器-单上\n解析：民用无人机系统有三条主要链路。发指令给无人机：上行无人机传图回来：下行飞行数据来回： 上下（鼠鼠老师的话：我们想想一下，我们在地上，用遥控器遥控天上的无人机，发出去的“指令”往上走，所以是“上传”; 无人机通过摄像头拍到影像回传到地面，图像往下走，所以是下行。地面站相关数据需要实时来回反馈调整，所以是上下行）（另外，本文问的是遥控器的指令链路属于哪种，没问遥控器能干什么，也没问遥控器有多少种链路。单就发送指令这一功能来说，属于上行。如果遥控去能看地面站也具备下行功能，但是题目问的只是“指令链路”仅对应上行）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0188","type":"single","difficulty":1,"stem":"图传链路属于（）。","options":[{"key":"A","text":"单向上行链路"},{"key":"B","text":"单向下行链路"},{"key":"C","text":"双向链路"}],"answer":"B","analysis":"提示：图传-单下\n解析：图传链路核心是受控设备将拍摄画面传输给遥控器 / 地面接收端。信号仅从设备（下端）单向传输至地面接收端（上端），无反向指令交互，符合 “单向上行链路” 仅一端向另一端单向传信号的特征。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0189","type":"single","difficulty":1,"stem":"数据传输链路属于（）。","options":[{"key":"A","text":"单向上行链路"},{"key":"B","text":"单向下行链路"},{"key":"C","text":"双向链路"}],"answer":"C","analysis":"提示：数传-双向\n解析：数据传输链路需实现双向信息交互，既包含从控制端到设备的指令下行，也涵盖设备向控制端的状态数据上行，形成完整双向通信，符合 “双向链路” 双向数据传输的核心特征。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0190","type":"single","difficulty":1,"stem":"属于开关控制量的是（）。","options":[{"key":"A","text":"云台俯仰"},{"key":"B","text":"襟翼"},{"key":"C","text":"副翼"}],"answer":"B","analysis":"提示：开关控制量-襟翼\n解析：开关控制量指通过 “开 / 关” 或固定档位切换实现控制，而非连续调节。襟翼通常仅需切换 “收起”“放下” 等固定状态，符合开关控制量的离散控制特征，不同于云台俯仰、副翼的连续调节模式。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0191","type":"single","difficulty":1,"stem":"多旋翼沿横轴（）。","options":[{"key":"A","text":"上升下降"},{"key":"B","text":"左飞右飞"},{"key":"C","text":"前进后退"}],"answer":"B","analysis":"提示：横轴-左右运动\n解析：横轴（oz）是从一边的机翼末端，穿过机翼、机身，再从另一边机翼延伸到末端穿出来的轴线，无人机沿着横轴的水平运动称为左右运动，围绕横轴的运动称为俯仰运动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0192","type":"single","difficulty":1,"stem":"多旋翼沿纵轴（）。","options":[{"key":"A","text":"上升下降"},{"key":"B","text":"左飞右飞"},{"key":"C","text":"前进后退"}],"answer":"C","analysis":"提示：纵轴-前后运动\n解析：纵轴（ox）是从机头穿透机身的中心，从机尾穿出来的轴线，方向指向前，无人机沿着纵轴的水平运动称为前后运动，围绕纵轴的运动称为滚转运动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0193","type":"single","difficulty":1,"stem":"多旋翼沿立轴（）。","options":[{"key":"A","text":"上升下降"},{"key":"B","text":"左飞右飞"},{"key":"C","text":"前进后退"}],"answer":"A","analysis":"提示：立轴-升降运动\n解析：立轴（oy）是由上往下通过无人机重心，并与纵轴（ox）和横轴（oz）相互垂直的轴线无人机沿着立轴的运动称为升降运动，围绕立轴的运动称为偏航运动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0194","type":"single","difficulty":1,"stem":"空速明显小于地速，可能的原因是（）。","options":[{"key":"A","text":"无风飞行"},{"key":"B","text":"顺风飞行"},{"key":"C","text":"逆风飞行"}],"answer":"B","analysis":"提示：空速小顺风\n解析：空速是飞行器相对空气的速度，地速是相对地面的速度。顺风时，空气与地面同向运动，地速 = 空速 + 风速，导致地速显著大于空速，符合 “空速明显小于地速” 的场景。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0195","type":"single","difficulty":1,"stem":"保持指示空速飞行，随着高度的增加，真空速会（）。","options":[{"key":"A","text":"越来越大"},{"key":"B","text":"越来越小"},{"key":"C","text":"保持不变"}],"answer":"A","analysis":"提示：真空速越来越大\n解析：指示空速依赖空气压力测量，高度增加时空气密度降低，相同指示空速下，飞行器相对空气的实际速度（真空速）需增大，才能维持同等压力差，故真空速随高度升高而变大。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0196","type":"single","difficulty":1,"stem":"风速越大，无人机平飞时产生的升力（）。","options":[{"key":"A","text":"越大"},{"key":"B","text":"越小"},{"key":"C","text":"变化不确定"}],"answer":"C","analysis":"提示：风速大但没有指定风向，升力不确定\n解析：由于题目只说明了“风速越大”，但没有指定风向，因此无人机为了保持平飞，其空速可能增加也可能减少，导致产生的升力变化方向不确定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0197","type":"single","difficulty":1,"stem":"固定翼无人机等油门爬升时，逆风越大，轨迹爬升角（）。","options":[{"key":"A","text":"越大"},{"key":"B","text":"越小"},{"key":"C","text":"不变"}],"answer":"A","analysis":"提示：逆风大爬升角大\n解析：等油门爬升时，发动机推力和飞机升阻特性相对稳定。逆风越大，飞机相对气流速度越快，升力增加更显著，在垂直方向的爬升分量增强，水平前进速度受逆风抑制，因此轨迹爬升角（爬升轨迹与水平面夹角）会变大。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0198","type":"single","difficulty":1,"stem":"固定翼无人机在约等于空速的大逆风中飞行，当进行180度转弯时，是否会失速？","options":[{"key":"A","text":"会"},{"key":"B","text":"不会"},{"key":"C","text":"不确定"}],"answer":"B","analysis":"提示：180不会失速\n解析：失速取决于空速与迎角，而非地速。在大逆风中，无人机与空气的相对速度（空速）依然可以保持高于失速速度。进行180度转弯时，只要飞行员控制得当，保持足够的空速并避免迎角过大，就不会失速。风向的改变不影响这一原理。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0199","type":"single","difficulty":1,"stem":"纯手动操纵多旋翼前后飞行时，是否需要同时增加油门？","options":[{"key":"A","text":"需要"},{"key":"B","text":"不需要"},{"key":"C","text":"不确定"}],"answer":"A","analysis":"提示：纯手动前后飞+油门\n解析：纯手动操纵多旋翼前后飞行时，需要同时增加油门。因为多旋翼前后飞行时，需要通过改变不同电机的转速来产生前后的拉力，这个拉力是升力的水平分量。当多旋翼产生前后倾斜角度时，升力在重力方向的分量会减小，如果不增加油门，总升力就会小于重力，飞行器就会降低高度，所以需要同时增加油门来保持高度。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0200","type":"single","difficulty":1,"stem":"固定翼飞行从逆风场进入顺风场，其高度将（）。","options":[{"key":"A","text":"升高"},{"key":"B","text":"下降"},{"key":"C","text":"不变"}],"answer":"B","analysis":"提示：逆顺下降\n解析：固定翼升力与相对气流速度平方成正比。从逆风场进入顺风场时，气流相对机翼的速度会突然降低，导致升力急剧减小。若未及时调整（如增大迎角、提高速度），升力将不足以平衡重力，飞机高度随之下降。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0201","type":"single","difficulty":1,"stem":"翼型相对厚度是指（）。","options":[{"key":"A","text":"翼型各剖面厚度的平均值"},{"key":"B","text":"翼型最大厚度与弦长的比值"},{"key":"C","text":"翼型最大厚度与展长的比值"}],"answer":"B","analysis":"提示：相对厚度：厚度弦比\n解析：翼型相对厚度是衡量翼型厚薄的关键参数，需明确两个核心指标：一是翼型的 “最大厚度”（翼型上下表面最远距离），二是 “弦长”（翼型前缘到后缘的连线长度）。其定义为两者的比值，而非厚度平均值或与展长（机翼左右翼尖距离）的比值。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0202","type":"single","difficulty":1,"stem":"翼型相对厚度大，意味着（）。","options":[{"key":"A","text":"翼型弯"},{"key":"B","text":"翼型薄"},{"key":"C","text":"翼型厚"}],"answer":"C","analysis":"提示：翼型厚\n解析：翼型相对厚度是翼型最大厚度与弦长（翼型前缘到后缘的连线）的比值。该比值越大，表明在相同弦长下，翼型的最大厚度越大，即翼型更厚；反之则翼型更薄，与翼型弯曲程度（弯度）无关。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0203","type":"single","difficulty":1,"stem":"翼型相对弯度的含义是指（）。","options":[{"key":"A","text":"翼型中弧线距弦线的平均距离"},{"key":"B","text":"翼型中弧线距弦线的最大距离与弦长的比值"},{"key":"C","text":"翼型中弧线距弦线的最大距离与翼型最大厚度的比值"}],"answer":"B","analysis":"提示：弦线弦长比值\n解析：相对弯度是描述翼型弯曲程度的关键参数，需结合 “最大距离” 与 “弦长” 两个核心要素。翼型中弧线是翼型上下表面的中线，其距弦线（翼型前缘到后缘的连线）的最大距离，与弦长（翼型前后缘距离）的比值，即为相对弯度；并非平均距离，也不与翼型最大厚度关联。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0204","type":"single","difficulty":1,"stem":"机翼失速时，（）。","options":[{"key":"A","text":"升力增大，阻力减小"},{"key":"B","text":"升力减小，阻力增大"},{"key":"C","text":"升力减小，阻力减小"}],"answer":"B","analysis":"提示：失速：升小，阻大\n解析：机翼失速的关键是迎角超过临界值，翼面气流发生严重分离，破坏了正常升力产生的条件。此时，机翼上下表面压力差大幅减小，导致升力急剧下降；同时，气流分离产生大量涡流，气流与机翼表面的摩擦和扰动加剧，使得阻力显著增大。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0205","type":"single","difficulty":1,"stem":"机翼失速时，（）。","options":[{"key":"A","text":"机翼升力的向上力和水平尾翼向下的力都降低"},{"key":"B","text":"机翼升力的向上力和水平尾翼向上的力都降低"},{"key":"C","text":"机翼升力的向下力和水平尾翼向上的力都降低"}],"answer":"A","analysis":"提示：向上向下都降低\n解析：机翼失速的核心是迎角超过临界值，翼面气流分离，机翼向上的升力大幅降低。水平尾翼通常产生向下的力（平衡机翼低头力矩），其升力（向下的力本质是尾翼的 “升力”）依赖气流顺畅流过，机翼失速时气流紊乱也会影响尾翼，导致其向下的力同步降低，而非产生向上的力或机翼出现向下的力。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0206","type":"single","difficulty":1,"stem":"飞机速度增加时，（）。","options":[{"key":"A","text":"所有阻力都增大"},{"key":"B","text":"废阻力增大，诱导阻力减小"},{"key":"C","text":"摩擦阻力增大，干扰阻力减小"}],"answer":"B","analysis":"提示：废大诱小\n解析：飞机阻力分为废阻力（含摩擦阻力、形阻、干扰阻力）和诱导阻力。速度增加时，气流与机体摩擦、压力差作用更强，废阻力随速度平方成正比增大；而诱导阻力由翼尖涡产生，速度越高，下洗流影响越弱，其随速度平方成反比减小，并非所有阻力都增大或干扰阻力减小。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0207","type":"single","difficulty":1,"stem":"涡阻力是指什么？","options":[{"key":"A","text":"诱导阻力"},{"key":"B","text":"干扰阻力"},{"key":"C","text":"压差阻力"}],"answer":"A","analysis":"提示：涡阻诱导\n解析：涡阻力本质即诱导阻力。机翼飞行时，翼尖会产生涡系（翼尖涡），涡系引发的下洗流改变机翼局部气流方向，产生与飞行方向相反的分力，此分力即为涡阻力，其与干扰阻力（部件间气流干扰产生）、压差阻力（前后压力差产生）本质不同。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0208","type":"single","difficulty":1,"stem":"翼型阻力(又称型面阻力)是指什么？","options":[{"key":"A","text":"摩擦阻力和形状阻力"},{"key":"B","text":"干扰阻力和诱导阻力"},{"key":"C","text":"压差阻力和诱导阻力"}],"answer":"A","analysis":"提示：摩+形\n解析：翼型阻力是气流流经翼型产生的阻力，核心包含两类：摩擦阻力源于气流与翼型表面的粘性摩擦；形状阻力（又称压差阻力）因翼型前后气流压力差形成，二者共同构成翼型阻力，与干扰阻力（不同部件间干扰产生）、诱导阻力（机翼涡系产生）无关。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0209","type":"single","difficulty":1,"stem":"阻力与速度的关系为？","options":[{"key":"A","text":"蒙皮摩阻和形阻与v²成正比，涡诱导阻力与1/v²成正比"},{"key":"B","text":"蒙皮摩阻和形阻与v²成反比，涡诱导阻力与1/v²成反比"},{"key":"C","text":"蒙皮摩阻和形阻与v²成正比，涡诱导阻力与1/v²成反比"}],"answer":"A","analysis":"提示：正比正比\n解析：飞机的总阻力主要由寄生阻力（含蒙皮摩擦阻力和形阻）和诱导阻力（涡诱导阻力）组成。 寄生阻力（蒙皮摩阻和形阻）与动压（½ρv²）成正比，因此与速度v的平方成正比。 诱导阻力与升力的平方成正比，与速度v的平方成反比。因此，正确描述是前者与v²成正比，后者与1/v²成正比。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0210","type":"single","difficulty":1,"stem":"影响飞机纵向稳定性的主要因素是什么？","options":[{"key":"A","text":"重心位置"},{"key":"B","text":"水平尾翼"},{"key":"C","text":"垂直尾翼"}],"answer":"A","analysis":"提示：纵稳：重心\n解析：一句话总结：飞机必须满足重心位于气动中心（焦点）之前，才能具备纵向静稳定性。重心位置是否合理是飞机能否纵向稳定性的基础、主要因素。-----------------------------根据蓝皮书 第3章 飞行原理与飞行性能3.5.1飞机的纵向稳定性表述：当飞机受微小扰动面偏离原来纵向平衡状态(俯仰方向),并在扰动消失以 后,飞机能自动恢复到原来纵向平衡状态的特性,叫作飞机的纵向稳定性。 在飞行过程中,作用于飞机的俯仰力矩主要是机翼力矩和水平尾翼力矩。当飞机的迎角发生变化时,在机翼和尾翼上都会产生一定的附加升力,这个附加升力的合力作用点称为飞机的焦点。当飞机受到扰动面机头上仰时,机翼和水平尾翼的迎角增大,产生一个向上的附加升力。如果飞机重心位于焦点位置的前面, 则此向上的附加升力会对飞机产生一个下俯的稳定力矩,使飞机趋向于恢复原来的飞行状态。反之,当飞机受扰动而机头下俯时,机翼和水平尾翼的迎角减小, 会产生向下的附加升力,此附加升力对重心形成一个上仰的稳定力矩,也使飞机趋向于恢复原来的稳定状态。 因此,飞机的纵向稳定性主要取决于飞机重心的位置,只有当飞机的重心位于焦点前面时,飞机才是纵向稳定的;如果飞机的重心位于焦点之后,飞机则是纵向不稳定的。重心前移可以增加飞机的纵向静稳定性,但并不是静稳定性越大越好。例如,静稳定性过大,升降舵的操纵力矩就难以使飞机抬头。因此,如果重心前移使稳定性过大,会导致飞机的操纵性变差。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0211","type":"single","difficulty":1,"stem":"无人机主要产生方向稳定性的部件是什么？","options":[{"key":"A","text":"水平尾翼"},{"key":"B","text":"垂直尾翼"},{"key":"C","text":"主机翼"}],"answer":"B","analysis":"提示：方向稳垂直尾\n解析：垂直尾翼是无人机方向稳定性的核心部件。它通过自身的气动外形，在无人机出现偏航（航向偏离）时，产生与偏航方向相反的气动力矩，将无人机航向拉回原方向，从而维持航向稳定；水平尾翼主要负责俯仰稳定，主机翼主要提供升力和滚转相关稳定，均不主导方向稳定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0212","type":"single","difficulty":1,"stem":"固定翼产生滚转稳定性的因素包括哪些？","options":[{"key":"A","text":"机翼的上反角，机翼后掠角"},{"key":"B","text":"上单翼，垂尾"},{"key":"C","text":"以上都是"}],"answer":"C","analysis":"提示：因素选都是\n解析：固定翼滚转稳定性由多因素共同作用：机翼上反角、后掠角可通过气流作用，在飞机侧滑时产生恢复滚转的力矩；上单翼布局因重心低于机翼，侧滑时会形成滚转恢复力；垂尾可通过航向稳定间接辅助滚转稳定，避免偏航加剧滚转失衡，故三者均属滚转稳定性因素。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0213","type":"single","difficulty":1,"stem":"容易导致荷兰滚的条件是什么？","options":[{"key":"A","text":"垂尾面积过大，上反角过小"},{"key":"B","text":"垂尾面积过小，上反角过大"},{"key":"C","text":"垂尾面积过大，上反角过大"}],"answer":"B","analysis":"提示：垂小反大\n解析：荷兰滚是横航向周期性振荡，因横向与方向静稳定性失衡。垂尾面积小则方向静稳定性弱，难纠正偏航；上反角大则横向静稳定性过强，遇扰动时滚转快但偏航难消，二者结合引发偏航与滚转交替，形成荷兰滚。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0214","type":"single","difficulty":1,"stem":"持续依赖外界条件的导航设备是哪些？","options":[{"key":"A","text":"GPS导航、无线电导航、惯性导航仪"},{"key":"B","text":"GPS导航、无线电导航、磁航向仪"},{"key":"C","text":"GPS导航、惯性导航仪、磁航向仪"}],"answer":"B","analysis":"提示：惯导不依赖\n解析：GPS 导航依赖卫星信号，无线电导航依赖地面发射的无线电波，磁航向仪依赖地球磁场，三者均需持续借助外界条件（卫星、地面设备、地球磁场）才能正常工作；而惯性导航仪通过内部传感器（陀螺仪、加速度计）自主计算位置，不依赖外界条
