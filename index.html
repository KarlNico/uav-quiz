ons":[{"key":"A","text":"保持不变"},{"key":"B","text":"逐渐增加"},{"key":"C","text":"逐渐减小"}],"answer":"B","analysis":"提示：马赫增加\n解析：马赫数 = 飞行速度 ÷ 当地声速飞行速度：匀速爬升时，飞行速度不变；当地声速：指的是飞机飞行到不用高度是，对应的声速。 （声速靠温度变化：声音靠空气传播，温度越低，空气分子运动越平缓，声音传播越慢，声速越小。）对应本题条件：对流层的特点就是 “高度越高，温度越低”，所以随着飞机爬升，当地声速会逐渐减小，也导致在飞行速度不变的情况下，由于声速越来越小，马赫数逐步增加。马赫数 = 飞行速度 （不变）÷ 当地声速（逐渐减小）导致马赫数逐渐增加","tags":[],"bankId":"uav-selected"},{"id":"sel-0259","type":"single","difficulty":1,"stem":"在对流层内，空气的温度（）。","options":[{"key":"A","text":"随高度增加保持不变"},{"key":"B","text":"随高度增加而升高"},{"key":"C","text":"随高度增加而降低"}],"answer":"C","analysis":"提示：对流层，高度升温度降 平流层，高度升温度升\n解析：在对流层内，空气的温度随高度的增加而降低。这是因为对流层是大气层中最低的一层，其中包含了大量的水汽和尘埃，这些物质在吸收太阳辐射后会释放出热量但随着高度的增加，这些物质的含量减少，导致温度逐渐降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0260","type":"single","difficulty":1,"stem":"平流层对航空活动有利的方面是（）。","options":[{"key":"A","text":"气流平稳、能见度好、空气阻力小"},{"key":"B","text":"气温低、飞机载重量增加、飞机真空速增大"},{"key":"C","text":"气流平稳、无恶劣天气、发动机推力增大"}],"answer":"A","analysis":"提示：平流-阻力小，能见度好\n解析：平流层对航空活动有利的方面主要体现在其气流平稳、能见度好、空气阻力小。这些条件使得飞机在平流层中飞行更加稳定减少了飞行中的颠簸和阻力，有利于航空活动的进行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0261","type":"single","difficulty":1,"stem":"下列叙述属于平流层的特点是（）。","options":[{"key":"A","text":"空气中几乎没有水蒸气"},{"key":"B","text":"空气没有上下对流"},{"key":"C","text":"高度升高气温下降"}],"answer":"B","analysis":"提示：平流层很平静\n解析：平流层的特点之一是空气几乎没有上下对流，这是因为平流层中的气温随高度增加而增加，形成稳定的温度层结，不利于空气垂直运动。其他选项不符合平流层的特点。","tags":[],"bankId":"uav-selected"},{"id":"sel-0262","type":"single","difficulty":1,"stem":"气象上把气温垂直递减率等于零（即γ=0）的气层称为（）。","options":[{"key":"A","text":"等温层"},{"key":"B","text":"不稳定气层"},{"key":"C","text":"逆温层"}],"answer":"A","analysis":"提示：γ=0，温度不变，等温\n解析：在气象学中，气温垂直递减率等于零的气层被称为等温层。这意味着在该气层中气温不随高度变化，保持恒定。逆温层是指气温随高度增加而升高的气层，不稳定气层则指气温垂直递减率较大的气层。","tags":[],"bankId":"uav-selected"},{"id":"sel-0263","type":"single","difficulty":1,"stem":"夜间温度降低，低层常常出现逆温，会使得（）。","options":[{"key":"A","text":"早晨天气晴朗"},{"key":"B","text":"早晨有雾和烟幕"},{"key":"C","text":"早晨有大风"}],"answer":"B","analysis":"提示：逆温早上有雾\n解析：夜间温度降低时，地面散失热量，使得近地面空气温度降低，形成逆温层。逆温层会抑制空气的对流运动，使得污染物和水汽不易扩散，从而在早晨容易形成雾和烟幕。","tags":[],"bankId":"uav-selected"},{"id":"sel-0264","type":"single","difficulty":1,"stem":"一般而言，气团的垂直高度可达几公里到十几公里，常常从地面伸展到对流层顶，水平范围为（）。","options":[{"key":"A","text":"几公里到几百公里"},{"key":"B","text":"几十公里到几百公里"},{"key":"C","text":"几十公里到几千公里"}],"answer":"C","analysis":"提示：几十到几千\n解析：气团的水平范围通常较大，可以从几十公里扩展到几千公里，这取决于其形成的环境条件和移动路径。气团在垂直方向上可以从地面伸展到对流层顶，但在水平方向上其范围更为广泛。","tags":[],"bankId":"uav-selected"},{"id":"sel-0265","type":"single","difficulty":1,"stem":"下列何种性质描述了气团的特征?","options":[{"key":"A","text":"能形成结构不同的云"},{"key":"B","text":"能覆盖大片地区，温度和湿度等特征性相对均匀"},{"key":"C","text":"气团内部各地天气差异很大"}],"answer":"B","analysis":"提示：气团特征：大大小， 气团内部都差不多，相对均匀\n解析：气团是覆盖大片地区，温度和湿度等特征性相对均匀的大块空气。它能形成相对一致的天气，而内部各地的天气差异不大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0266","type":"single","difficulty":1,"stem":"下面关于气团的叙述哪一个正确？","options":[{"key":"A","text":"我国地域广大，能形成各种气团"},{"key":"B","text":"气团离开源地，其性质将会发生变化"},{"key":"C","text":"气团只形成于极地和大洋地区"}],"answer":"B","analysis":"提示：离开源地，垫面变化，气团性质变化\n解析：严格的说，北冰洋气团、极地气团、热带气团、赤道气团，这四种气团我国本土都形不成，只能受外来气团影响；其中北冰洋气团是我国完全接触不到，自身更无法形成，当气团在源地形成后，气团中的部分空气会离开源地移到与源地性质不同的地面，气团中的空气与新地表产生了热量与水分的交换，（由于下垫面性质、大气环流条件等因素的变化，其性质如温度、湿度往往会发生变化）这样气团的物理属性就会逐渐发生变化，这种变化称为气团的变性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0267","type":"single","difficulty":1,"stem":"气团是指气象要素（主要指温度湿度）在水平分布上比较均匀的大范围空气团。下列不正确的是（）。","options":[{"key":"A","text":"垂直范围大"},{"key":"B","text":"水平温度梯度大"},{"key":"C","text":"水平范围大"}],"answer":"B","analysis":"提示：气团有类似题几十到几千，但是温度梯度小，大大小\n解析：气团是指气象要素在水平分布上比较均匀的大范围空气团。气团的水平范围大，垂直范围相对较小，且水平温度梯度小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0268","type":"single","difficulty":1,"stem":"大气中某一高度的一团空气，如受到某种外力的作用后，产生向上或向下运动时，称为稳定状态的是（）。","options":[{"key":"A","text":"移动后逐渐减速，并有返回原来高度的趋势"},{"key":"B","text":"移动后，加速向上或向下运动"},{"key":"C","text":"外力作用消失后，以匀速持续运动"}],"answer":"A","analysis":"提示：移动又返回-稳定\n解析：当大气中某一高度的空气团受到外力作用产生向上或向下运动时，若其移动后逐渐减速，并有返回原来高度的趋势，则称为稳定状态。这是因为空气团在垂直方向上受到了平衡力的作用。","tags":[],"bankId":"uav-selected"},{"id":"sel-0269","type":"single","difficulty":1,"stem":"气团的分类方法正确的是？","options":[{"key":"A","text":"暖气团和湿气团"},{"key":"B","text":"冷气团和干气团"},{"key":"C","text":"北冰洋气团、极地气团，热带气团、赤道气团"}],"answer":"C","analysis":"提示：冷对暖，干对湿，只剩最长的对\n解析：气团的分类主要依据其源地和热力性质，按气团的发源地：北冰洋气团、极地气团、热带气团、赤道气团。按照热力性质，可以分为冷气团和暖气团。","tags":[],"bankId":"uav-selected"},{"id":"sel-0270","type":"single","difficulty":1,"stem":"关于锋面，下列哪种描述正确？","options":[{"key":"A","text":"锋面就是温度、湿度等物理性质不同的两种气团的交界面"},{"key":"B","text":"锋面就是风场与地面的交线，也简称为锋"},{"key":"C","text":"锋面就是不同方向的风交汇的界面"}],"answer":"A","analysis":"提示：锋面：冷暖气团交界面\n解析：锋面是指温度、湿度等物理性质不同的两种气团的交界面，是天气系统中的重要组成部分，曾常伴随着天气变化，如降水、风切变等。冷、暖气团之间的交界面称为锋面。锋面与地面的交线称为锋线，锋面与锋线统称为锋。","tags":[],"bankId":"uav-selected"},{"id":"sel-0271","type":"single","difficulty":1,"stem":"在锋面经过机场时，要特别注意的是（）。","options":[{"key":"A","text":"可能出现风沙天气"},{"key":"B","text":"可能出现高度极低的风切变"},{"key":"C","text":"雨层云中的连续性小雨"}],"answer":"B","analysis":"提示：锋面经过机场，不安全不飞\n解析：锋面经过时，由于冷暖气团的交汇，常伴随有风切变现象，特别是高度极低的风切变，对飞行安全构成威胁。风沙天气和雨层云中的连续性小雨虽也可能出现，但不是最主要的风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0272","type":"single","difficulty":1,"stem":"快速移动的冷锋受实际锋面后远处的强烈压力系统推动，在快速移动的冷锋之后，（）。","options":[{"key":"A","text":"阵风减缓和温度升高"},{"key":"B","text":"天空通常很快放晴"},{"key":"C","text":"可能出现乌云密布的天空和下雨"}],"answer":"B","analysis":"提示：快速冷风，快速放晴\n解析：快速移动的冷锋过后，由于冷空气取代了暖空气，天空通常很快放晴。这是因为冷空气通常较为干燥且稳定，不易形成云层因此天空会变得晴朗。","tags":[],"bankId":"uav-selected"},{"id":"sel-0273","type":"single","difficulty":1,"stem":"暖锋是指（）。","options":[{"key":"A","text":"温度较高与温度较低的两个气团交汇时，温度高的一侧"},{"key":"B","text":"锋面在移动过程中，暖空气推动锋面向冷气团一侧移动的锋"},{"key":"C","text":"一侧气团温度明显高于另一侧气团温度的锋"}],"answer":"B","analysis":"提示：移动，暖推冷\n解析：暖锋是指锋面在移动过程中，暖空气推动锋面向冷气团一侧移动的锋。这种锋面移动时，暖空气沿锋面爬升，形成云层并可能带来降水，是天气系统中的重要组成部分。","tags":[],"bankId":"uav-selected"},{"id":"sel-0274","type":"single","difficulty":1,"stem":"暖锋和冷锋在特性上是非常不同的，（）。","options":[{"key":"A","text":"冷锋以10-25英里每小时速度移动"},{"key":"B","text":"暖锋以20-35英里每小时速度移动"},{"key":"C","text":"暖锋产生差的能见度和下雨，冷锋产生突发的阵风，紊流"}],"answer":"C","analysis":"提示：紊流\n解析：暖锋和冷锋在特性上确实不同。暖锋通常产生差的能见度和连续性降雨，而冷锋则往往带来突发的阵风、紊流和天气快速变化。冷锋和暖锋不能以具体速度表示。","tags":[],"bankId":"uav-selected"},{"id":"sel-0275","type":"single","difficulty":1,"stem":"风吹来时，那种局地风向不断改变，风速一阵大一阵小的现象称为（）。","options":[{"key":"A","text":"风切变"},{"key":"B","text":"风向不定"},{"key":"C","text":"风的阵性"}],"answer":"C","analysis":"提示：一阵大一阵小：阵风\n解析：风吹来时，局地风向不断改变，地面上障碍物会分散风的流向，产生会快速改变方向和速度的阵风，风速一阵大一阵小的现象称为风的阵性。这是风的一种特性，表现为风向和风速的不稳定变化。","tags":[],"bankId":"uav-selected"},{"id":"sel-0276","type":"single","difficulty":1,"stem":"能够产生有一定影响的低空风切变的天气背景主要有三类：","options":[{"key":"A","text":"山地气流、昼夜交替天气、春夏之交天气"},{"key":"B","text":"强对流天气、锋面天气、辐射逆温型的低空急流天气"},{"key":"C","text":"大风天气、强降雨天气、寒冷天气"}],"answer":"B","analysis":"提示：强对流锋面辐射逆温\n解析：能够产生有一定影响的低空风切变的天气背景主要有三类:强对流天气、锋面天气、辐射逆温型的低空急流天气。这些天气条件都可能导致风速和风向的突然变化:即风切变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0277","type":"single","difficulty":1,"stem":"关于风切变出现的地方，下述说法正确的是：","options":[{"key":"A","text":"在大气中任何高度上存在风向或风速变化的地方"},{"key":"B","text":"在气压和温度急剧下降的地方出现"},{"key":"C","text":"仅在雷暴中出现"}],"answer":"A","analysis":"提示：风切变，找变化\n解析：风切变是指大气中任何高度上风向或风速的变化，它不仅出现在雷暴中，也可能在其他气象条件下出现，如锋面、地形影响等。","tags":[],"bankId":"uav-selected"},{"id":"sel-0278","type":"single","difficulty":1,"stem":"发生在低层的风切变严重影响航空器的起降，将发生在这一气层中的风切变称为低空风切变。低空风切变距地面一般约（）。","options":[{"key":"A","text":"小于1000米"},{"key":"B","text":"小于600米"},{"key":"C","text":"小于100米"}],"answer":"B","analysis":"提示：低空风切500（600） （有500选500 ，没有500选600）\n解析：发生在低层(距地面500m)的风切变严重影响航空器的起降,将发生在这一气层中的风切变称为低空风切变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0279","type":"single","difficulty":1,"stem":"严重的低空风切变，气流常从高空急速下冲，易引发坠落事件。当飞机进入该区域时，（ ）。","options":[{"key":"A","text":"先遇强逆风，后遇猛烈的上升气流，随后又是强顺风"},{"key":"B","text":"先遇强顺风，后遇猛烈的上升气流，随后又是强逆风"},{"key":"C","text":"先遇强逆风，后遇猛烈的下沉气流，随后又是强顺风"}],"answer":"C","analysis":"提示：危害大→坠机→猛烈下沉气流\n解析：严重的低空风切变，常发生在低空急流即狭长的强风区，对飞行安全威胁极大。这种风切变气流常从高空急速下冲，像向下倾泻的巨型水龙头，当飞机进入该区域时，先遇强逆风，后遇猛烈的下沉气流，随后又是强顺风，飞机就像狂风中的树叶被抛上抛下而失去控制，因此，极易发生严重的坠落事件。","tags":[],"bankId":"uav-selected"},{"id":"sel-0280","type":"single","difficulty":1,"stem":"风切变的仪表判断法，以下不正确的是（）。","options":[{"key":"A","text":"发动机转速和地速快速变化"},{"key":"B","text":"俯仰角指示快速变化"},{"key":"C","text":"空速表指示的非理性变化"}],"answer":"A","analysis":"提示：选错的。跟转速地速没关系！\n解析：风切变仪表判断法： 空速表指示的非理性变化√ 高度表的不正常变化√ 升降速度表波动√ 俯仰姿态指示器变化快√ 发动机转速和地速的快速变化×","tags":[],"bankId":"uav-selected"},{"id":"sel-0281","type":"single","difficulty":1,"stem":"对流层因为空气有强烈的对流运动而得名，它的底界为地面，上界高度随纬度、季节、天气等因素而变化，同一地区对流层上界高度( )。","options":[{"key":"A","text":"冬季大于夏季"},{"key":"B","text":"夏季大于冬季"},{"key":"C","text":"冬季与夏季相同"}],"answer":"B","analysis":"提示：对流层，夏季>冬季\n解析：对流层上界高度夏季大于冬季。这是因为夏季地表温度高，空气受热上升，对流运动强烈，使得对流层上界升高;而冬季地表温度低，空气下沉，对流运动减弱，对流层上界降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0282","type":"single","difficulty":1,"stem":"相比于夏天，在冬天的时候飞机的飞行时间变长还是缩短?(不考虑电池原因，只看气压对飞行时间的影响)","options":[{"key":"A","text":"夏天飞行时间长"},{"key":"B","text":"冬天飞行时间长"},{"key":"C","text":"一样长，气压的变化对飞机飞行时长没有影响"}],"answer":"B","analysis":"提示：不考虑电池就反着选，冬天飞的久\n解析：冬天飞行时间长。冬天大气密度大，气压高，飞机升力大，在相同动力下飞行阻力相对小一些，所以飞行时间变长。而夏天大气密度小，气压低，飞行时间相对缩短","tags":[],"bankId":"uav-selected"},{"id":"sel-0283","type":"single","difficulty":1,"stem":"飞机在比标准大气冷的空气中飞行时，气压高度表所示高度将比实际飞行高度（）。","options":[{"key":"A","text":"高"},{"key":"B","text":"低"},{"key":"C","text":"相同"}],"answer":"A","analysis":"提示：高冷\n解析：气压高度表只看“静压”这一条输入。同一高度上，天冷→空气密度大→静压比标准值高。仪表把“比标准高的气压”当成“标准大气里更低的高度”，于是指示高度 < 实际高度（表少指）。但题目问的是“飞机在比标准大气冷的空气中飞行”，它隐含的前提是：飞机已飞到某一实际高度，外界静压已经“因为冷”而比标准值低（密度大，压降快）。仪表仍按标准换算，就会把“比标准低的那个气压”当成“更高高度”的气压，于是指示高度 > 实际高度（表多指）。所以“天冷”本身既可能让静压“偏高”也可能“偏低”，关键看你是“固定高度”还是“固定气压”来讨论。题目里默认“飞机已到达某一实际高度”，冷天密度大→该高度上的静压比标准值低→表多指。因此在比标准大气冷的空气中飞行，气压高度表所示高度比实际高度高 。","tags":[],"bankId":"uav-selected"},{"id":"sel-0284","type":"single","difficulty":1,"stem":"以下哪种不是卫星云图种类？","options":[{"key":"A","text":"可见光卫星云图"},{"key":"B","text":"多光谱卫星云图"},{"key":"C","text":"红外卫星云图"}],"answer":"B","analysis":"提示：选错的。类似：红外可见，无光谱\n解析：卫星云图主要分为红外卫星云图和可见光卫星云图。红外卫星云图主要显示云顶的温度信息，而可见光卫星云图则显示云的反射率。多光谱卫星云图不是标准的卫星云图分类，它可能指的是结合了多种光谱信息的卫星图像，但在气象学中，通常不将其单独作为一类卫星云图。","tags":[],"bankId":"uav-selected"},{"id":"sel-0285","type":"single","difficulty":1,"stem":"卫星云图主要可分为哪两类？","options":[{"key":"A","text":"红外云图和可见光卫星云图"},{"key":"B","text":"红外云图和色调强化卫星云图"},{"key":"C","text":"色调强化卫星云图和可见光卫星云图"}],"answer":"A","analysis":"提示：红外，可见光\n解析：卫星云图主要分为红外云图和可见光卫星云图。红外云图主要显示云顶的温度信息，而可见光卫星云图则显示云的反射率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0286","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是中云特征？","options":[{"key":"A","text":"在红外线云图上，中云呈深灰色，介于高低云之间的色调"},{"key":"B","text":"在可见光云图上，中云呈灰白色到白色，色调的差异判定云的厚度"},{"key":"C","text":"在卫星云图上，中云与天气系统相连，表现为大范围的带状、涡旋状、逗点状"}],"answer":"A","analysis":"提示：选错的。深灰色×\n解析：根据蓝皮书描述，“在红外线云图上，中云呈中等程度灰色”不是“深灰色”，所以A错了。","tags":[],"bankId":"uav-selected"},{"id":"sel-0287","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是层云（雾）特征？","options":[{"key":"A","text":"在可见光云图上，层云（雾）表现为光滑均匀的云区"},{"key":"B","text":"在红外云图上，层云色调较亮，与地面色调相差较大"},{"key":"C","text":"层云（雾）边界整齐清楚，与山脉、河流、海岸线走向相一致"}],"answer":"B","analysis":"提示：选错的。相差较大×，没有括号的×\n解析：层云(雾)在红外云图上通常与地面色调相差不大，因为其温度接近地面温度，且云层较薄。","tags":[],"bankId":"uav-selected"},{"id":"sel-0288","type":"single","difficulty":1,"stem":"在卫星云图上，红外云图的色调取决于（）。","options":[{"key":"A","text":"目标的高低"},{"key":"B","text":"目标的温度"},{"key":"C","text":"目标反射太阳辐射的大小"}],"answer":"B","analysis":"提示：可见色调-辐射，红外色调-温度\n解析：红外云图是通过测量云顶辐射的红外能量来生成的，其色调主要取决于目标的温度。温度越高的云顶，在红外云图上呈现的颜色越亮。因此，红外云图的色调与目标的温度密切相关。","tags":[],"bankId":"uav-selected"},{"id":"sel-0289","type":"single","difficulty":1,"stem":"在卫星云图上，可见光云图的色调取决于（）。","options":[{"key":"A","text":"目标的温度"},{"key":"B","text":"目标的高低"},{"key":"C","text":"目标反射太阳辐射的大小"}],"answer":"C","analysis":"提示：可见色调-辐射，红外色调-温度\n解析：可见光云图是通过测量云层反射的太阳光来生成的，因此其色调主要取决于目标反射太阳辐射的大小。反射的太阳辐射越多，云层在可见光云图上呈现的颜色越亮。","tags":[],"bankId":"uav-selected"},{"id":"sel-0290","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是卷状云特征？","options":[{"key":"A","text":"在红外云图上，卷云顶温度很低，呈白色"},{"key":"B","text":"无论可见光还是红外云图，卷云没有纤维结构"},{"key":"C","text":"在可见光云图上，卷云呈灰--深灰色"}],"answer":"B","analysis":"提示：选错的。纤维\n解析：在可见光云图上，卷云呈灰--深灰色。在红外云图上，卷云温度很低，呈白色 无论可见光还是红外云图，卷云都有纤维结构，这是其典型特征之一。","tags":[],"bankId":"uav-selected"},{"id":"sel-0291","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是积雨云特征？","options":[{"key":"A","text":"无论可见光还是红外云图，积雨云的色调最白"},{"key":"B","text":"积雨云的尺度相差不大。"},{"key":"C","text":"在卫星图像上的积雨云常是几个雷暴单体的集合"}],"answer":"B","analysis":"提示：选错的。相差不大\n解析：在卫星图像上的积雨云常是几个雷暴单体的集合 ，无论可见光还是红外云图，积雨云的色调最白。积雨云的尺度可以有很大的变化，从初生的小尺度到成熟时可能发展得非常庞大，相差很大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0292","type":"single","difficulty":1,"stem":"当在山谷、山脊或山区作低空飞行时，在什么时候最容易碰到乱流造成危险?","options":[{"key":"A","text":"在山的背风面顺风飞行"},{"key":"B","text":"在山的背风面逆风飞行"},{"key":"C","text":"在山的迎风面逆风飞行"}],"answer":"A","analysis":"提示：背顺\n解析：在山谷、山脊或山区作低空飞行时，最容易在山的背风面顺风飞行时碰到乱流造成危险。这是因为背风面顺风飞行时，飞机可能会进入山谷风或山风形成的乱流区域","tags":[],"bankId":"uav-selected"},{"id":"sel-0293","type":"single","difficulty":1,"stem":"山地对风的影响，以下描述错误的是（）。","options":[{"key":"A","text":"山体本身的障碍影响，使气流被阻滞不前"},{"key":"B","text":"一般山底和峡谷风口的风速增大"},{"key":"C","text":"一般山顶和峡谷风口的风速增大"}],"answer":"B","analysis":"提示：选错误。山底风速比较平稳，不增大\n解析：山地对风的影响主要表现在山体本身的障碍作用，使气流被阻滞不前，同时山顶和峡谷风口的风速通常更大。而山底由于地形的阻挡，风速通常会减小，而不是增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0294","type":"single","difficulty":1,"stem":"在山区飞行时应当注意，最强的乱流出现在（）。","options":[{"key":"A","text":"山谷中间"},{"key":"B","text":"山的背风坡"},{"key":"C","text":"山的迎风坡"}],"answer":"B","analysis":"提示：最强背风坡\n解析：在迎风坡：当气流遇到山脉阻挡时，会沿山坡被迫上升。抬升过程是持续的、受地形引导的，通常不会立即产生强烈乱流。在背风坡：越过山顶后，空气开始沿背风坡下降。由于空气在山顶附近经历剧烈垂直运动，可能形成湍流涡旋或重力波破碎。下降过程中，空气压缩增温，形成干热的“焚风”。乱流强烈会对飞行安全构成威胁。根据CAAC网站公布相关驾驶员执照理论考试学习资料，明确表示，乱流最强区域在背风区。","tags":[],"bankId":"uav-selected"},{"id":"sel-0295","type":"single","difficulty":1,"stem":"在山地背风坡中的下降气流中飞行时，除造成飞机掉高度外，还可造成严重危害的原因是（）。","options":[{"key":"A","text":"地速减小"},{"key":"B","text":"空速表误差增大"},{"key":"C","text":"气压式高度表读数高于实际高度"}],"answer":"C","analysis":"提示：背风坡→读数高于实际\n解析：在山地背风坡中的下降气流中飞行时，由于气压随高度降低而增大，气压式高度表的读数会高于实际高度，这可能导致飞机在不知情的情况下掉高度，造成安全隐患。","tags":[],"bankId":"uav-selected"},{"id":"sel-0296","type":"single","difficulty":1,"stem":"下面关于山谷风的叙述正确的是（）。","options":[{"key":"A","text":"气流越山而过，称为山风"},{"key":"B","text":"山谷风是由于海陆差异而形成的热力环流"},{"key":"C","text":"白天风由山谷吹向山坡"}],"answer":"C","analysis":"提示：白天上山坡\n解析：山谷风：白天山坡升温快，空气上升，风由山谷吹向山坡","tags":[],"bankId":"uav-selected"},{"id":"sel-0297","type":"single","difficulty":1,"stem":"和地面建筑物有关的湍流强度依赖于障碍物的大小和风的基本速度，在山地区域时这种情况甚至更加明显。风越过山脊时（）。","options":[{"key":"A","text":"风沿着迎风侧湍流逐渐增加"},{"key":"B","text":"风沿着迎风侧平稳地向上流动"},{"key":"C","text":"风沿着背风侧平稳地向下流动"}],"answer":"B","analysis":"提示：迎风而上\n解析：山脊的抬升作用，在迎风坡上，风速随高度的增加而增加风沿着迎风侧平稳地向上流动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0298","type":"single","difficulty":1,"stem":"下列哪种属于动力对流冲击力？","options":[{"key":"A","text":"山坡迎风面对空气的抬升"},{"key":"B","text":"气温变化造成的空气抬升或下降"},{"key":"C","text":"气流符合辐散时造成的空气水平运动"}],"answer":"A","analysis":"提示：对流冲击-山坡抬升\n解析：动力对流冲击力指的是地形对气流的影响，如山坡迎风面对空气的抬升作用。气流被迫上升，形成对流，这是动力对流冲击力的典型表现。","tags":[],"bankId":"uav-selected"},{"id":"sel-0299","type":"single","difficulty":1,"stem":"使静止空气产生垂直运动的作用力，称为（）。","options":[{"key":"A","text":"热力作用力"},{"key":"B","text":"气动作用力"},{"key":"C","text":"对流冲击力"}],"answer":"C","analysis":"提示：垂直对流\n解析：使原来静止的空气产生垂直运动的作用力称为对流冲击力。这种力是由于地面受热不均或其他原因导致的空气垂直运动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0300","type":"single","difficulty":1,"stem":"在下述各类飞机积冰中，对飞行影响最大的是（）。","options":[{"key":"A","text":"明冰和毛冰"},{"key":"B","text":"毛冰和霜"},{"key":"C","text":"雾凇和毛冰"}],"answer":"A","analysis":"提示：双冰，冰冰\n解析：在飞机积冰中，明冰和毛冰对飞行的影响最大。明冰表面光滑，不易脱落，对飞机的气动性能影响显著;毛冰则容易在飞机表面形成粗糙的冰层，同样会影响飞机的飞行性能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0301","type":"single","difficulty":1,"stem":"飞行高度不同，飞机积冰频率也不同，以下正确的是（）。","options":[{"key":"A","text":"冬季在3000米以上各高度上飞行时，积冰几乎占56%"},{"key":"B","text":"在6000米以上高度上飞行时，积冰占56%"},{"key":"C","text":"冬季在3000米以下各高度上飞行时，积冰几乎占56%"}],"answer":"C","analysis":"提示：积冰3000下\n解析：冬季在3000米以下各高度上飞行时，积冰几乎占56%。这是因为在这个高度范围内温度较低且存在大量过冷水滴，容易导致飞机积冰。","tags":[],"bankId":"uav-selected"},{"id":"sel-0302","type":"single","difficulty":1,"stem":"飞机结冰是指飞机机体表面某些部位聚集冰层的现象，飞机积冰主要分为三大种","options":[{"key":"A","text":"坚冰、松冰、霜冰"},{"key":"B","text":"明冰、毛冰、白冰"},{"key":"C","text":"冰、雾凇、霜"}],"answer":"C","analysis":"提示：雾凇\n解析：飞机结冰主要分为冰、雾松、霜三种。这是飞机结冰的基本分类，每种类型的结冰对飞机的影响和应对措施都有所不同。","tags":[],"bankId":"uav-selected"},{"id":"sel-0303","type":"single","difficulty":1,"stem":"关于飞机积冰，下列正确的是（）。","options":[{"key":"A","text":"飞机积冰一般发生在-1～-15℃的温度范围内"},{"key":"B","text":"强烈的积冰主要发生在-4～-8℃的温度范围内"},{"key":"C","text":"在-2～-10℃温度范围内遭遇积冰的次数最多"}],"answer":"C","analysis":"提示：-2～-10℃\n解析：负2 ~负10℃温度范围是飞机遭遇积冰次数最多的区间，符合实际情况。","tags":[],"bankId":"uav-selected"},{"id":"sel-0304","type":"single","difficulty":1,"stem":"下面关于飞机积冰的叙述哪一个正确？","options":[{"key":"A","text":"中云温度低于0℃，云层较厚，水滴含量大，积冰最严重"},{"key":"B","text":"低云云高低于2000米，温度高，不含过冷水滴，所以一般不出现飞机积冰"},{"key":"C","text":"高云由于高度高、温度低，大多由冰晶构成，不容易形成飞机积冰"}],"answer":"A","analysis":"提示：中云\n解析：中云温度低于0°C，云层较厚，水滴含量大，是飞机积冰最严重的云层。","tags":[],"bankId":"uav-selected"},{"id":"sel-0305","type":"single","difficulty":1,"stem":"积冰的形状主要取决于冰的种类，飞行速度和气流绕过飞行器的不同部位的情况，积冰的形状一般分为（）。","options":[{"key":"A","text":"凸状冰、凹状冰和混合冰"},{"key":"B","text":"圆形冰、方形冰和混合冰"},{"key":"C","text":"槽状冰、楔形冰和混合冰"}],"answer":"C","analysis":"提示：槽锲混\n解析：积冰的形状主要取决于冰的种类、飞行速度和气流绕过飞行器的不同部位。在这些因素的作用下，积冰会形成不同的形状，主要包括槽状冰、楔形冰和混合冰。","tags":[],"bankId":"uav-selected"},{"id":"sel-0306","type":"single","difficulty":1,"stem":"积冰强度可分为（）。","options":[{"key":"A","text":"微弱、弱、中度和强"},{"key":"B","text":"霜、雾凇和冰"},{"key":"C","text":"轻度、中度和重度"}],"answer":"C","analysis":"提示：程度3:轻中重\n解析：积冰强度是指积冰对飞行器的影响程度，它可以根据积冰的厚度和密度进行分类。通常将积冰强度分为轻度、中度和重度:以描述其对飞行器的潜在危害。轻度结冰，长时间飞行有危险，如果用除冰设备不影响飞行。中度结冰，积聚率很快，短时间内就会构成危险。严重结冰，积聚率非常快，除冰设备也不能控制危险，必须立即返航。","tags":[],"bankId":"uav-selected"},{"id":"sel-0307","type":"single","difficulty":1,"stem":"飞机积冰的产生，主要是由于云中存在（）。","options":[{"key":"A","text":"雪花和冰晶"},{"key":"B","text":"过冷水滴"},{"key":"C","text":"大小不等的水滴"}],"answer":"B","analysis":"提示：过冷水滴不稳定，稍受震动，即冻结成冰\n解析：飞机积冰的产生，主要是由于云中存在过冷水滴。过冷水滴在飞机表面冻结，形成积冰。这是飞机积冰的主要原因","tags":[],"bankId":"uav-selected"},{"id":"sel-0308","type":"single","difficulty":1,"stem":"当机翼和尾翼积冰时，下列不正确的描述是（）。","options":[{"key":"A","text":"翼型失真（变形）"},{"key":"B","text":"导致摩擦阻力减少"},{"key":"C","text":"压差阻力都增大"}],"answer":"B","analysis":"提示：不正确的-摩擦力减少\n解析：当机翼和尾翼积冰时，会导致翼型失真(变型)同时压差阻力会增大。而积冰会增加表面的粗糙度，从而增大摩擦阻力，而不是减少，","tags":[],"bankId":"uav-selected"},{"id":"sel-0309","type":"single","difficulty":1,"stem":"飞机前缘结冰对飞行的主要影响()。","options":[{"key":"A","text":"增大了飞机重量，使起飞困难"},{"key":"B","text":"增大了临界攻角，使飞机易失速"},{"key":"C","text":"相同迎角，升力系数下降"}],"answer":"C","analysis":"提示：前缘结冰，升力下降\n解析：飞机前缘结冰会改变机翼的形状，从而影响其气动性能。结冰会导致机翼前缘变得不光滑，增加气流分离的可能性，降低升力系数。","tags":[],"bankId":"uav-selected"},{"id":"sel-0310","type":"single","difficulty":1,"stem":"在相同飞行速度和迎角情况下，翼面不清洁或前缘结冰的机翼升力()。","options":[{"key":"A","text":"大于基本翼型升力"},{"key":"B","text":"等于基本翼型升力"},{"key":"C","text":"小于基本翼型升力"}],"answer":"C","analysis":"提示：小于 不清洁，升力小\n解析：翼面不清洁或结冰会破坏气流的平滑流动，升力小于基本翼型升力。不清洁或结冰导致气流分离提前，升力系数减小，升力降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0311","type":"single","difficulty":1,"stem":"进气道结冰将导致危险的后果，下列描述不正确的是？","options":[{"key":"A","text":"冰屑脱离，进入压气机，而造成压气机的机械损伤"},{"key":"B","text":"结冰堵塞进气道，使得进入压气机的气流明显减少，导致发动机富油停车"},{"key":"C","text":"使进气速度场分布不均匀和使气流发生局部分离，引起压气机叶片的振动"}],"answer":"B","analysis":"提示：选错的。富油\n解析：进气道结冰会导致危险的后果，包括使进气速度场分布不均匀、气流局部分离、压气机叶片振动以及冰屑脱离进入压气机造成机械损伤。但结冰不会堵塞进气道导致发动机富油停车。","tags":[],"bankId":"uav-selected"},{"id":"sel-0312","type":"single","difficulty":1,"stem":"飞机外表面的冰霜雪等，（）。","options":[{"key":"A","text":"会出现指令仰角变化和滚转"},{"key":"B","text":"会使外表面变得粗糙，增加阻力，减少升力"},{"key":"C","text":"会引起飞机操纵效能增加"}],"answer":"B","analysis":"提示：加阻力，减升力（减操控）\n解析：飞机外表面的冰霜雪等会使飞机外表面变得粗糙，增加飞行时的阻力，并减少升力对飞行性能产生不利影响。因此，需要及时清除飞机外表面的冰霜雪等附着物。","tags":[],"bankId":"uav-selected"},{"id":"sel-0313","type":"single","difficulty":1,"stem":"表面脏污的机翼与表面光洁的机翼相比()。","options":[{"key":"A","text":"最大升力系数下降，阻力系数增大"},{"key":"B","text":"相同升力系数时其迎角减小"},{"key":"C","text":"同迎角下升力系数相同，阻力系数加大"}],"answer":"A","analysis":"提示：脏了升力下降，阻力增大\n解析：机翼表面的脏污会影响其空气动力学性能，导致最大升力系数下降，同时脏污的表面也会增加阻力系数。","tags":[],"bankId":"uav-selected"},{"id":"sel-0314","type":"single","difficulty":1,"stem":"流体的粘性与温度之间的关系是（）。","options":[{"key":"A","text":"液体的粘性随温度的升高而增大"},{"key":"B","text":"气体的粘性随温度的升高而增大"},{"key":"C","text":"液体的粘性与温度无关"}],"answer":"B","analysis":"提示：气体温度越高粘性越高，液体温度越高粘性越低（温度低凝固）\n解析：流体的粘性与温度之间的关系是，对于气体而言，其粘性随温度的升高而增大。这是因为气体分子的热运动随温度升高而加剧，导致分子间的相互作用增强，从而粘性增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0315","type":"single","difficulty":1,"stem":"下列不是影响空气粘性的因素是()。","options":[{"key":"A","text":"空气的流动位置"},{"key":"B","text":"气流的流速"},{"key":"C","text":"空气的粘性系数"}],"answer":"A","analysis":"提示：粘性与位置无关\n解析：空气的粘性主要受温度和气压的影响，与空气的流动位置无关。","tags":[],"bankId":"uav-selected"},{"id":"sel-0316","type":"single","difficulty":1,"stem":"影响空气粘性力的主要因素是（）。","options":[{"key":"A","text":"空气温度"},{"key":"B","text":"空气清洁度"},{"key":"C","text":"相对湿度"}],"answer":"A","analysis":"提示：温度影响粘性\n解析：空气的温度是影响其粘性的主要因素。随着温度的升高，空气分子的运动加快，导致粘性力增加。清洁度和相对湿度对空气粘性的影响较小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0317","type":"single","difficulty":1,"stem":"气压一定时，气温露点的高低可以表示（）。","options":[{"key":"A","text":"空气中凝结核的含量"},{"key":"B","text":"空气的饱和程度"},{"key":"C","text":"空气中的水汽含量"}],"answer":"C","analysis":"提示：露点→露珠→水\n解析：露点：空气在水汽含量和气压都不改变的条件下，气温降低到使空气达到水汽饱和的温度。形象地说，就是空气中的水蒸气变为露珠时候的温度叫露点。因此可以表示空气中的水汽含量。露点温度越接近实际温度，说明空气中的水汽含量越高，空气越接近饱和状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0318","type":"single","difficulty":1,"stem":"空气中容纳水汽的数量随气温变化，气温越高，则（）。","options":[{"key":"A","text":"可以容纳的水汽就越少"},{"key":"B","text":"当空气不能再容纳更多水汽时，温度就会变化"},{"key":"C","text":"可以容纳的水汽就越多"}],"answer":"C","analysis":"提示：气温高，水汽多\n解析：气温越高，则空气中能容纳的水汽量越多这是因为温度的升高会增加空气中的水分保持气态的能力，使得空气中可以包含更多的水汽而不凝结成液态水。","tags":[],"bankId":"uav-selected"},{"id":"sel-0319","type":"single","difficulty":1,"stem":"下述物理量中，反映大气潮湿程度的量是","options":[{"key":"A","text":"相对湿度"},{"key":"B","text":"饱和水气压"},{"key":"C","text":"露点温度"}],"answer":"A","analysis":"提示：湿度表示潮湿度\n解析：相对湿度是大气的实际水汽压与同温度下饱和水汽压的比值，它反映了大气中水汽的接近饱和程度，是衡量大气潮湿程度的重要指标。饱和水气压只是表示在一定温度下空气可能含有的最大水汽量，而不反映实际的潮湿程度。露点温度则是指空气在水汽含量和气压都不改变的条件下，冷却到饱和时的温度，它更多用于表示空气达到饱和时的状态，而非当前的潮湿程度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0320","type":"single","difficulty":1,"stem":"露点温度指空气在水汽含量和气压都不改变的条件下，冷却到饱和时的温度。形象地说，就是空气中的水蒸气变为露珠时候的温度叫露点温度。下述哪个正确？","options":[{"key":"A","text":"当空气中水汽已达到饱和时，气温与露点温度相同"},{"key":"B","text":"当水汽未达到饱和时，气温一定低于露点温度"},{"key":"C","text":"在100%的相对湿度时，周围环境的温度高于露点温度"}],"answer":"A","analysis":"提示：露点温度相同\n解析：露点温度是指空气在水汽含量和气压都不改变的条件下，冷却到饱和时的温度。当空气中水汽已达到饱和时，气温与露点温度相同，因为此时空气已经处于饱和状态，无法再容纳更多的水汽。当水汽未达到饱和时，气温高于露点温度。相对湿度越大，容纳的水汽就越少，周围环境的温度低于露点温度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0321","type":"single","difficulty":1,"stem":"地表和潮湿物体表面的水分蒸发进入大气就形成了大气中的水汽。大气中的水汽含量平均约占整个大气体积的0-5%左右，并随着高度的增加而逐渐（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"不变"},{"key":"C","text":"减少"}],"answer":"C","analysis":"提示：水重，越高越少\n解析：地表和潮湿物体表面的水分蒸发进入大气就形成了大气中的水汽。大气中的水汽含量平均约占整个大气体积的0~5%左右，并随着高度的增加而逐渐减少。这是因为随着高度的增加，温度和压力都逐渐降低不利于水汽的存在。","tags":[],"bankId":"uav-selected"},{"id":"sel-0322","type":"single","difficulty":1,"stem":"在温度不变情况下，空气的密度（）。","options":[{"key":"A","text":"与压力成正比"},{"key":"B","text":"与压力成反比"},{"key":"C","text":"与压力无关"}],"answer":"A","analysis":"提示：空气密度与压力成正比 密度大，压力大\n解析：温度不变时，空气被压缩，压力增大，体积减小，密度增大，与压力成正比。","tags":[],"bankId":"uav-selected"},{"id":"sel-0323","type":"single","difficulty":1,"stem":"飞机的飞行性能主要受大气密度的影响，当实际大气密度大于标准大气密度时（）。","options":[{"key":"A","text":"空气作用于飞机上的力要加大，发动机推力减小"},{"key":"B","text":"空气作用于飞机上的力要减小，发动机推力增大"},{"key":"C","text":"空气作用于飞机上的力要加大，发动机推力增大"}],"answer":"C","analysis":"提示：密度↑→升力、阻力、推力均↑\n解析：飞机的飞行性能主要受大气密度的影响。当实际大气密度大于标准大气密度时，空气作用于飞机上的力(如升力和阻力)会加大，同时发动机推力也会增大，因为发动机吸入的空气密度更大，可以产生更多的推力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0324","type":"single","difficulty":1,"stem":"气温对飞机最大平飞速度的影响为（）。","options":[{"key":"A","text":"气温低时，空气密度大，飞机发动机的推力增大，最大平飞速度增加"},{"key":"B","text":"气温低时，空气密度大，空气的阻力增加，最大平飞速度减小"},{"key":"C","text":"气温高时，空气密度小，空气的阻力减小，最大平飞速度增加"}],"answer":"A","analysis":"提示：气温低，全都大\n解析：气温对飞机最大平飞速度的影响表现为气温低时，空气密度大，飞机发动机的推力增大，因此最大平飞速度增加。相反气温高时，空气密度减小，推力减小，速度降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0325","type":"single","difficulty":1,"stem":"在大气层内，大气压强（）。","options":[{"key":"A","text":"随高度增加而减小"},{"key":"B","text":"随高度增加而增加"},{"key":"C","text":"在同温层内随高度增加保持不变"}],"answer":"A","analysis":"提示：海拔高，密度低，气压低\n解析：在大气层内，随着高度的增加，大气压逐渐降低，导致大气密度也随之减小。这是因为随着海拔的升高，空气分子间的距离增大，从而使得密度减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0326","type":"single","difficulty":1,"stem":"同一架无人机于某日中午和傍晚进行两次GPS高度200米的巡航飞行，地面基准气压相同的前提下，（）。","options":[{"key":"A","text":"中午的气压高度高"},{"key":"B","text":"傍晚的气压高度高"},{"key":"C","text":"中午和傍晚的气压高度一样高"}],"answer":"B","analysis":"提示：傍晚气压全天最低→气压高度表读数偏高 （气压越低的地方，高度越高，比如高原，空气稀薄，气压低，高度高）\n解析：2026年5月22日修改。根据“国家气象科学数据中心”“中国科学院科普云台”相关气压资料：气压是一个动态的物理量，它随时间的变化而不断调整。这种变化既包含周期性的波动，也包含非周期性的变化。周期性变化是指气压按照一定的时间规律进行波动。气压一般随高度升高按指数律递减。气压有日变化和年变化。一年之中，冬季比夏季气压高。在一昼夜之内，气压会呈现出明显的日变化。通常，上午9-10点会出现一天中的最高气压，随后气压逐渐下降，至下午15-16点时降至最低。之后，气压又逐渐回升，至21-22点时达到次高值，至次日凌晨3-4点则再次降至次低值。所以：· 中午，气压较高，同样的高度对应的气压高于“全天平均值”，此时气压高度表表示的高度偏低· 傍晚，气压全天最低，同样的高度对应的气压低于“全天平均值”，此时气压对应的高度读数偏高“气压高度” 指的是气压对应的高度，不是气压值本身。所以傍晚的气压高度计的高度高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0327","type":"single","difficulty":1,"stem":"对于空气密度如下说法正确的是（）。","options":[{"key":"A","text":"空气密度正比于压力和绝对温度"},{"key":"B","text":"空气密度正比于压力，反比于绝对温度"},{"key":"C","text":"空气密度反比于压力，正比于绝对温度"}],"answer":"B","analysis":"提示：密度正压反温\n解析：空气密度正比于压力，反比于绝对温度。这是理想气体状态方程的基本内容，也是大气科学中的常识。","tags":[],"bankId":"uav-selected"},{"id":"sel-0328","type":"single","difficulty":1,"stem":"温度对飞机的升限有影响，关于升限，下列何种叙述是正确的？","options":[{"key":"A","text":"气温升高，所有飞机的升限都要减小"},{"key":"B","text":"气温升高，大型飞机的升限要升高"},{"key":"C","text":"气温变化对喷气式飞机的升限没有影响"}],"answer":"A","analysis":"提示：温高密低,升力↓升限↓\n解析：气温升高导致空气密度减小，飞机发动机产生的推力在较稀薄的空气中效率降低，因此所有飞机的升限都会减小。这是因为升力主要由空气密度和速度决定，气温升高降低了空气密度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0329","type":"single","difficulty":1,"stem":"垂直爬升时升限为海拔1000米的多旋翼飞行器，如果在性能范围内前飞中爬升，其升限（）。","options":[{"key":"A","text":"将降低"},{"key":"B","text":"将升高"},{"key":"C","text":"将保持不变"}],"answer":"B","analysis":"提示：有气流，升力↑升限↑\n解析：垂直爬升时升限为海拔1000米的多旋翼飞行器，如果在前飞中爬升，其升限将升高。前飞时的相对气流速度增加，会提高飞行器的升力，从而使其升限升高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0330","type":"single","difficulty":1,"stem":"国际标准大气的定义是什么？","options":[{"key":"A","text":"海平面附近常温常压下空气的密度"},{"key":"B","text":"对流层附近常温常压下空气的密度"},{"key":"C","text":"地表层附近常温常压下空气的密度"}],"answer":"A","analysis":"提示：海拔-海平；标准大气压-海平\n解析：国际标准大气是定义在海平面附近常温常压下的空气的密度、温度、压力等参数的标准大气模型，用于气象学和航空学等领域的计算和模拟。","tags":[],"bankId":"uav-selected"},{"id":"sel-0331","type":"single","difficulty":1,"stem":"地面天气图上填写的气压是（）。","options":[{"key":"A","text":"本站气压"},{"key":"B","text":"场面气压"},{"key":"C","text":"海平面气压"}],"answer":"C","analysis":"提示：地图→海平面气压\n解析：地面天气图上填写的气压通常是海平面气压，这是因为海平面气压是一个标准化的参考点，有助于比较不同地点的气压差异并用于天气分析和预报。","tags":[],"bankId":"uav-selected"},{"id":"sel-0332","type":"single","difficulty":1,"stem":"雷暴是由强烈的积雨云产生的，形成强烈的积雨云需要三个条件（）。","options":[{"key":"A","text":"深厚而明显的不稳定气层、充沛的水汽、足够的冲击力"},{"key":"B","text":"强大的风力、充沛的水气、足够的冲击力"},{"key":"C","text":"深厚而明显的不稳定气层、剧烈的温差、足够的冲击力"}],"answer":"A","analysis":"提示：1不稳定，2水汽\n解析：形成强烈的积雨云需要三个基本条件:深厚而明显的不稳定气层、充沛的水汽、足够的冲击力。这三个条件共同作用，使得空气上升、冷却、凝结，最终形成积雨云。","tags":[],"bankId":"uav-selected"},{"id":"sel-0333","type":"single","difficulty":1,"stem":"一般雷暴单体的生命史根据垂直气流状况可分为三个阶段（）。","options":[{"key":"A","text":"温升阶段、降雨阶段、消散阶段"},{"key":"B","text":"积云阶段、成风阶段、雷雨阶段"},{"key":"C","text":"积云阶段、成熟阶段、消散阶段"}],"answer":"C","analysis":"提示：积云、成熟、消散（积成消）\n解析：雷暴单体的生命史通常分为三个阶段:积云阶段、成熟阶段和消散阶段。在积云阶段，雷暴开始形成并发展;在成熟阶段雷暴达到最强，伴随着强烈的雷电和降水;在消散阶段，雷暴逐渐减弱并消失。","tags":[],"bankId":"uav-selected"},{"id":"sel-0334","type":"single","difficulty":1,"stem":"雷暴处于发展阶段时( )。","options":[{"key":"A","text":"地面气压持续下降"},{"key":"B","text":"地面气压持续上升"},{"key":"C","text":"地面气压保持不变"}],"answer":"A","analysis":"提示：上升气流→地面降压。雷暴发低气压。\n解析：雷暴处于发展阶段时，由于雷暴内部的上升气流和降水过程，地面气压会持续下降。这是雷暴发展阶段的典型特征，与地面气压持续上升或保持不变的情况不同。","tags":[],"bankId":"uav-selected"},{"id":"sel-0335","type":"single","difficulty":1,"stem":"在雷暴的生存周期中，哪一阶段的特征使云中充满下降气流？","options":[{"key":"A","text":"消散阶段"},{"key":"B","text":"成熟阶段"},{"key":"C","text":"积云阶段"}],"answer":"A","analysis":"提示：上升成熟，下降消散\n解析：在雷暴的生存周期中，消散阶段的特征是云中充满下降气流。这是因为在此阶段，雷暴开始减弱，上升气流减弱并转变为下降气流，导致云体消散。","tags":[],"bankId":"uav-selected"},{"id":"sel-0336","type":"single","difficulty":1,"stem":"形成雷暴的基本条件是（）。","options":[{"key":"A","text":"浓积云，充足的水汽和锋区"},{"key":"B","text":"充足的水汽和上升运动"},{"key":"C","text":"充足的水汽、不稳定的大气和上升运动"}],"answer":"C","analysis":"提示：不稳定暴脾气\n解析：形成雷暴的基本条件是:1.深厚而明显的不稳定气层（提供能源）2.充沛的水汽（形成云体、释放潜热）3.足够的冲击力（促使空气上升）。这三个条件共同作用，使得水汽在上升过程中凝结、释放潜热，形成雷电和降水。","tags":[],"bankId":"uav-selected"},{"id":"sel-0337","type":"single","difficulty":1,"stem":"在地表的风向稍微不同于地表之上几千英尺高度的风向的原因是（）。","options":[{"key":"A","text":"风和地面之间的磨擦作用"},{"key":"B","text":"当地地形影响气压"},{"key":"C","text":"地面有较强的地转偏向力"}],"answer":"A","analysis":"提示：地表风向靠摩擦\n解析：地表的风向受地面摩擦力的影响，风速和风向都会发生变化。而地表之上几千英尺高度的风向则受摩擦力影响较小，主要受大气环流控制。因此，两者风向会有所不同。","tags":[],"bankId":"uav-selected"},{"id":"sel-0338","type":"single","difficulty":1,"stem":"形成海陆风的对流性环流的原因是因为（）。","options":[{"key":"A","text":"从水面吹向陆地的空气较暖，密度小，导致空气上升"},{"key":"B","text":"陆地吸收和散发热量比水面快"},{"key":"C","text":"从水面吹向陆地的空气冷，密度大，使空气上升"}],"answer":"B","analysis":"提示：海陆风，选陆地\n解析：白天，陆地升温快，气温高，空气膨胀上升，近地面空气密度变小，就形成低压；海洋升温慢，气温低，空气收缩下沉，近地面空气密度大，就形成高压，于是风从高压吹向低压，即从海洋吹向陆地，所以主要原因是因为陆地吸收和散发热量比水面快","tags":[],"bankId":"uav-selected"},{"id":"sel-0339","type":"single","difficulty":1,"stem":"关于气流运动正确的说法是（）。","options":[{"key":"A","text":"因为空气总是寻找低压区域，所以气流会从高压区域向低压的区域流动"},{"key":"B","text":"因为空气总是寻找高压区域，所以气流会从低压区域向高压的区域流动"},{"key":"C","text":"是风产生了压力，所以风的尽头压力高"}],"answer":"A","analysis":"提示：空气找低压，高压流向低压\n解析：空气总是从高压区域流向低压区域，这是因为高压区域的空气分子密度大，压力大，会向压力低的区域扩散，形成气流。这是大气物理学的基本原理。","tags":[],"bankId":"uav-selected"},{"id":"sel-0340","type":"single","difficulty":1,"stem":"空气在作水平运动时，是什么力阻止了空气直接从高压区流向低压区？","options":[{"key":"A","text":"惯性离心力"},{"key":"B","text":"地转偏向力"},{"key":"C","text":"摩擦力"}],"answer":"B","analysis":"提示：流向选偏向\n解析：空气在水平运动时，会受到地转偏向力的影响，这使得空气不会直接从高压区流向低压区，而是发生偏转。地转偏向力是由于地球自转而产生的，它会影响大气运动的方向。","tags":[],"bankId":"uav-selected"},{"id":"sel-0341","type":"single","difficulty":1,"stem":"和地面建筑物有关的湍流强度依赖于（），这会影响任何飞机的起飞和着陆性能，也会引发非常严重的危险。","options":[{"key":"A","text":"障碍物的大小和风的基本方向"},{"key":"B","text":"障碍物的大小和风的基本速度"},{"key":"C","text":"障碍物的多少和风的基本速度"}],"answer":"B","analysis":"提示：大小速递\n解析：湍流强度与障碍物的大小和风的基本速度密切相关。障碍物越大，对风的阻碍作用越明显，产生的湍流越强;风的基本速度越快，湍流强度也越大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0342","type":"single","difficulty":1,"stem":"地面的地形和大的建筑物会（）。","options":[{"key":"A","text":"产生会快速改变方向和速度的阵风"},{"key":"B","text":"产生稳定方向和速度的阵风"},{"key":"C","text":"汇聚风的流向"}],"answer":"A","analysis":"提示：乱流，变速阵风\n解析：地面的地形和大的建筑物会对风产生阻碍和扰动，使得风的流向和速度发生快速改变，从而产生阵风。这种阵风的特点就是方向和速度都会快速改变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0343","type":"single","difficulty":1,"stem":"无人机的轴指的是()。","options":[{"key":"A","text":"舵机轴"},{"key":"B","text":"旋翼轴"},{"key":"C","text":"方向轴"}],"answer":"B","analysis":"提示：旋翼机→旋翼轴\n解析：无人机中的“轴”通常指旋翼的旋转轴，也就是电机带动螺旋桨旋转的轴线。舵机轴是舵机部件 ×方向轴非规范称呼 ×","tags":[],"bankId":"uav-selected"},{"id":"sel-0344","type":"single","difficulty":1,"stem":"多轴的“轴”指( )。","options":[{"key":"A","text":"舵机轴"},{"key":"B","text":"飞行器运动坐标轴"},{"key":"C","text":"旋翼轴"}],"answer":"C","analysis":"提示：旋翼机旋翼轴\n解析：“多轴飞行器”中的“轴”，指各个旋翼围绕其旋转的轴线，也可以理解为安装电机和螺旋桨的动力轴。例如：四轴飞行器：4个旋翼轴六轴飞行器：6个旋翼轴八轴飞行器：8个旋翼轴","tags":[],"bankId":"uav-selected"},{"id":"sel-0345","type":"single","difficulty":1,"stem":"4轴飞行器飞行运动中有()。","options":[{"key":"A","text":"沿3轴移动，绕3轴转动"},{"key":"B","text":"沿3个轴移动"},{"key":"C","text":"绕4个轴转动"}],"answer":"A","analysis":"提示：33\n解析：4轴飞行器飞行运动中有6个自由度（沿3绕3）6个自由度分别是:沿X轴的平移、沿Y轴的平移、沿Z轴的平移，绕X轴的旋转(横滚)、绕Y轴的旋转(俯仰)、绕Z轴的旋转(偏航)。","tags":[],"bankId":"uav-selected"},{"id":"sel-0346","type":"single","difficulty":1,"stem":"多旋翼飞行器的旋翼旋转方向一般为()。","options":[{"key":"A","text":"俯视多轴飞行器顺时针旋翼"},{"key":"B","text":"俯视多轴飞行器逆时针旋翼"},{"key":"C","text":"俯视多轴飞行器两两对应"}],"answer":"C","analysis":"提示：两两对应\n解析：多旋翼飞行器的旋翼旋转方向一般为两两对应，相邻旋翼反向旋转，以确保飞行器的稳定性和控制性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0347","type":"single","difficulty":1,"stem":"多旋翼飞行器的旋翼旋转方向一般为（）。","options":[{"key":"A","text":"俯视多旋翼飞行器顺时针旋翼"},{"key":"B","text":"俯视顺时针/逆时针旋翼相对排布"},{"key":"C","text":"俯视顺时针/逆时针旋翼依次相邻排布"}],"answer":"C","analysis":"提示：依次相邻\n解析：多旋翼飞行器的旋翼旋转方向一般为俯视顺时针/逆时针旋翼依次相邻排布。这种排布方式有助于保持飞行器的稳定性和控制性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0348","type":"single","difficulty":1,"stem":"六轴飞行器安装有()。","options":[{"key":"A","text":"6个顺时针旋转螺旋桨"},{"key":"B","text":"3个顺时针旋转螺旋桨，3个逆时针旋转螺旋桨"},{"key":"C","text":"4个顺时针旋转螺旋桨，2个逆时针旋转螺旋桨"}],"answer":"B","analysis":"提示：3顺3逆\n解析：六轴飞行器安装有3个顺时针旋转螺旋桨和3个逆时针旋转螺旋桨。","tags":[],"bankId":"uav-selected"},{"id":"sel-0349","type":"single","difficulty":1,"stem":"八轴飞行器安装有()。","options":[{"key":"A","text":"8个顺时针旋转螺旋桨"},{"key":"B","text":"2个顺时针旋转螺旋桨，6个逆时针旋转螺旋桨"},{"key":"C","text":"4个顺时针旋转螺旋桨，4个逆时针旋转螺旋桨"}],"answer":"C","analysis":"提示：44平衡\n解析：八轴飞行器八轴飞行器由于其多轴设计，安装有4个顺时针旋转螺旋桨，4个逆时针旋转螺旋桨。","tags":[],"bankId":"uav-selected"},{"id":"sel-0350","type":"single","difficulty":1,"stem":"下面说法正确的是()。","options":[{"key":"A","text":"一般来讲，多旋翼飞行器反扭矩的数值是比较大的"},{"key":"B","text":"多旋翼飞行器在稳定垂直上升时，所有旋翼总的反扭之和增加"},{"key":"C","text":"多旋翼飞行器的反扭矩通过旋翼两两互相平衡"}],"answer":"C","analysis":"提示：多轴→反扭矩两两平衡\n解析：多轴飞行器在稳定垂直上升时，所有旋翼总的反扭之和不变。多轴飞行器通过设计不同旋翼的旋转方向，使其反扭矩两两互相平衡，从而保持飞行器的稳定飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0351","type":"single","difficulty":1,"stem":"六轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是（）电机。","options":[{"key":"A","text":"俯视顺时针方向下一个"},{"key":"B","text":"对角"},{"key":"C","text":"俯视逆时针方向下一个"}],"answer":"B","analysis":"提示：对角停\n解析：六轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是对角电机。当其中一个电机发生故障时，为了保持飞行器的平衡和防止翻滚，与其对角位置的电机需要相应地调整其工作状态，以模拟故障电机的停止工作效果。","tags":[],"bankId":"uav-selected"},{"id":"sel-0352","type":"single","difficulty":1,"stem":"4轴飞行器，改变航向时()。","options":[{"key":"A","text":"相邻的2个桨加速，另2个桨减速"},{"key":"B","text":"相对的2个桨加速，另2个桨减速"},{"key":"C","text":"4个桨均加速"}],"answer":"B","analysis":"提示：相对加减\n解析：4轴飞行器，改变航向时相对的2个桨加速，另2个桨减速。通过相对的两个桨加速，另外相对的两个桨减速，可以产生扭矩差，从而实现飞行器的航向改变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0353","type":"single","difficulty":1,"stem":"多旋翼飞行器前飞时，单个旋翼()。","options":[{"key":"A","text":"前行桨叶相对气流速度小于后行桨叶相对气流速度"},{"key":"B","text":"前行桨叶相对气流速度大于后行桨叶相对气流速度"},{"key":"C","text":"前行桨叶相对气流速度等于后行桨叶相对气流速度"}],"answer":"B","analysis":"提示：气流：同向大\n解析：多旋翼飞行器前飞时，单个旋翼前行桨叶相对气流速度大于后行桨叶相对气流速度。在前飞过程中，由于飞行器整体向前移动，使得前行桨叶与空气的相对速度增加，而后行桨叶与空气的相对速度减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0354","type":"single","difficulty":1,"stem":"如不考虑结构、尺寸、安全性等其他因素，单纯从气动效率出发，同样起飞重量的8轴飞行器与4轴飞行器()。","options":[{"key":"A","text":"4轴效率高"},{"key":"B","text":"8轴效率高"},{"key":"C","text":"效率一样"}],"answer":"A","analysis":"提示：4高8稳\n解析：在单纯考虑气动效率的情况下，4轴飞行器由于其较少的旋翼数量和相对较小的阻力往往能够表现出更高的气动效率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0355","type":"single","difficulty":1,"stem":"悬停状态的六轴飞行器如何实现向前移动?","options":[{"key":"A","text":"纵轴右侧的螺旋桨减速，纵轴左侧的螺旋桨加速"},{"key":"B","text":"横轴前侧的螺旋桨减速，横轴后侧的螺旋桨加速"},{"key":"C","text":"横轴前侧的螺旋桨加速，横轴后侧的螺旋桨减速"}],"answer":"B","analysis":"提示：同向减速，对向加速\n解析：当悬停状态的六轴飞行器横轴前侧的螺旋桨减速，横轴后侧的螺旋桨加速时，会导致飞行器前部的升力减小，后部的升力增大，从而使飞行器向前倾斜，产生向前的分力，实现向前移动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0356","type":"single","difficulty":1,"stem":"悬停状态的四轴飞行器如何实现向左移动?","options":[{"key":"A","text":"纵轴右侧的螺旋桨减速，纵轴左侧的螺旋桨加速"},{"key":"B","text":"纵轴右侧的螺旋桨加速，纵轴左侧的螺旋桨减速"},{"key":"C","text":"横轴前侧的螺旋桨加速，横轴后侧的螺旋桨减速"}],"answer":"B","analysis":"提示：同向减速，对向加速\n解析：当悬停状态的四轴飞行器纵轴右侧的螺旋桨加速，纵轴左侧的螺旋桨减速时，飞行器右侧的升力增大，左侧的升力减小。 这会导致飞行器向左倾斜，进而产生向左的分力，实现向左移动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0357","type":"single","difficulty":1,"stem":"X模式4轴飞行器从悬停转换到前进,哪两个轴需要加速?","options":[{"key":"A","text":"后方两轴"},{"key":"B","text":"左侧两轴"},{"key":"C","text":"右侧两轴"}],"answer":"A","analysis":"提示：同向减速，对向加速\n解析：X模式4轴飞行器从悬停转换到前进，后方两轴需要加速。在X模式中，要实现向前飞行，后方的两个轴需要加速，产生更大的推力，从而使飞行器向前移动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0358","type":"single","difficulty":1,"stem":"悬停状态下，多旋翼飞行器单个旋翼形成()。","options":[{"key":"A","text":"正锥体"},{"key":"B","text":"平面"},{"key":"C","text":"倒锥体"}],"answer":"C","analysis":"提示：倒锥\n解析：在悬停时，由于多旋翼飞行器的旋翼需要产生升力来克服重力并保持平衡，每个旋翼的拉力方向都指向飞行器的重心，从而形成了倒锥体的形状。","tags":[],"bankId":"uav-selected"},{"id":"sel-0359","type":"single","difficulty":1,"stem":"多旋翼飞行器悬停时的平衡不包括()。","options":[{"key":"A","text":"俯仰平衡"},{"key":"B","text":"方向平衡"},{"key":"C","text":"前飞废阻力平衡"}],"answer":"C","analysis":"提示：选错的。悬停无废阻力，不用平衡\n解析：多旋翼悬停状态：升力平衡、俯仰平衡、横滚平衡、方向平衡俯仰平衡：前后机头上下的平衡，悬停必须保持，包含在内。方向平衡：机头朝向、偏航旋转的平衡，悬停要稳住机头不打转，包含在内。前飞废阻力平衡：只有向前飞行时才会产生前飞阻力，悬停没有前飞运动，不需要平衡前飞废阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0360","type":"single","difficulty":1,"stem":"影响悬停稳定性的因素不包括()。","options":[{"key":"A","text":"起落架形式"},{"key":"B","text":"风的影响"},{"key":"C","text":"地面效应"}],"answer":"A","analysis":"提示：选错的。起落架形式 （地面效应为地面热气流，影响飞行稳定）\n解析：影响悬停稳定性的因素不包括起落架形式，风的影响会导致飞行器受到不稳定的外力，地面效应会改变飞行器周围的气流从而影响悬停稳定性。起落架形式主要影响飞行器的起降性能和地面操作便利性，对悬停稳定性没有直接影响。","tags":[],"bankId":"uav-selected"},{"id":"sel-0361","type":"single","difficulty":1,"stem":"绕多旋翼飞行器横轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"B","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：飞机在空中飞行,可以产生俯仰运动、偏航运动和滚转运动,绕横轴oz的运动为俯仰运动,绕立轴oy的运动为偏航运动,绕纵轴ox的运动为滚转运动,","tags":[],"bankId":"uav-selected"},{"id":"sel-0362","type":"single","difficulty":1,"stem":"绕多旋翼飞行器纵轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"A","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：飞机在空中飞行,可以产生俯仰运动、偏航运动和滚转运动,绕横轴oz的运动为俯仰运动,绕立轴oy的运动为偏航运动,绕纵轴ox的运动为滚转运动,","tags":[],"bankId":"uav-selected"},{"id":"sel-0363","type":"single","difficulty":1,"stem":"常规的电子调速器上，中等粗细的几根线是用来连接()的。","options":[{"key":"A","text":"自驾仪或遥控接收机"},{"key":"B","text":"电池"},{"key":"C","text":"电机"}],"answer":"C","analysis":"提示：粗电池，中电机，细电调，杜邦飞控\n解析：常规电子调速器上中等粗细的线是用来连接电机的。这些线负责传输控制信号和电力，以驱动和调整电机的转速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0364","type":"single","difficulty":1,"stem":"电调上最粗的红线和黑线用来连接（）。","options":[{"key":"A","text":"动力电池"},{"key":"B","text":"电动机"},{"key":"C","text":"机载遥控接收机"}],"answer":"A","analysis":"提示：粗电池，中电机，细电调，杜邦飞控\n解析：电调上最粗的红线和黑线用来连接动力电池。电调上的红线通常代表正极，黑线代表负极。最粗的红线和黑线是用来连接主要电源，即动力电池，以提供足够的电流来驱动电动机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0365","type":"single","difficulty":1,"stem":"关于多旋翼飞行器的反扭矩说法不正确的是（）。","options":[{"key":"A","text":"单个旋翼的反扭矩会迫使多轴飞行器向旋翼旋转的反方向偏转"},{"key":"B","text":"单个旋翼反扭矩的大小取决于电动机转速"},{"key":"C","text":"多轴飞行器的俯仰运动通过改变各个旋翼的反扭矩来实现"}],"answer":"C","analysis":"提示：选错的。反扭矩与俯仰角无关\n解析：· 电动机转速是决定单个旋翼反扭矩大小的“关键主导因素”。 √ · 俯仰靠前后桨“拉力差”产生力矩，与反扭矩无关；反扭矩只影响偏航。","tags":[],"bankId":"uav-selected"},{"id":"sel-0366","type":"single","difficulty":1,"stem":"多旋翼飞行器的螺旋桨()。","options":[{"key":"A","text":"桨根处迎角小于桨尖处迎角"},{"key":"B","text":"桨根处迎角大于桨尖处迎角"},{"key":"C","text":"桨根处迎角等于桨尖处迎角"}],"answer":"B","analysis":"提示：根角大于桨尖 根速小于桨尖\n解析：螺旋桨旋转时，桨尖线速度大于桨根。为使桨叶各处产生较合理、均匀的拉力，桨叶通常采用扭转设计，使桨根处安装角和迎角较大，桨尖处较小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0367","type":"single","difficulty":1,"stem":"下列哪项是飞行控制的方式之一?","options":[{"key":"A","text":"指令控制"},{"key":"B","text":"陀螺控制"},{"key":"C","text":"载荷控制"}],"answer":"A","analysis":"提示：飞控：指令、姿态、舵面\n解析：遥控方式是通过数据链路对无人机实施的飞行控制操纵，一般包括舵面遥控、姿态遥控和指令控制三种方式。","tags":[],"bankId":"uav-selected"},{"id":"sel-0368","type":"single","difficulty":1,"stem":"无人机飞行摇杆常规操作方式是()。","options":[{"key":"A","text":"姿态遥控和舵面遥控"},{"key":"B","text":"自主控制"},{"key":"C","text":"人工修正"}],"answer":"A","analysis":"提示：姿态+舵面\n解析：无人机飞行摇杆的常规操作方式主要包括姿态遥控和舵面遥控。姿态遥控通过控制无人机的姿态来改变其飞行方向和高度，而舵面遥控则通过调整舵面角度来实现飞行姿态的调整。这两种方式是无人机飞行中最为常用的操作方式。","tags":[],"bankId":"uav-selected"},{"id":"sel-0369","type":"single","difficulty":1,"stem":"舵面遥控状态时，平飞中向后稍拉升降舵杆量，飞行器的迎角()。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"先增大后减小"}],"answer":"A","analysis":"提示：前小后大，顺左逆右\n解析：在舵面遥控状态时，平飞中向后稍拉升降舵杆量，相当于增加了升降舵的上偏角，导致飞行器抬头，迎角增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0370","type":"single","difficulty":1,"stem":"舵面遥控状态时，平飞中向前稍推升降舵杆量，飞行器的迎角()。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"先减小后增大"}],"answer":"B","analysis":"提示：前小后大，顺左逆右\n解析：平飞中向前稍推升降舵杆量，相当于减小了升降舵的上偏角，飞行器低头，迎角减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0371","type":"single","difficulty":1,"stem":"舵面遥控状态时，平飞中向右稍压副翼杆量，无人机()。","options":[{"key":"A","text":"右翼升力大于左翼升力"},{"key":"B","text":"左翼升力大于右翼升力"},{"key":"C","text":"左翼升力等于右翼升力"}],"answer":"B","analysis":"提示：跷跷板，右压左升\n解析：飞机靠副翼沿着纵轴控制“横滚”动作。“向右稍压副翼杆量”会造成右副翼向上偏，左副翼向下偏。副翼下偏机翼整体弯度增加，升力系数增加，升力变大；反之，副翼上偏升力变小。（鼠鼠老师教大家一个秘诀：副翼压谁谁小，本题压右则左升力大。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0372","type":"single","difficulty":1,"stem":"无人机驾驶员舵面遥控操纵飞机时，（）。","options":[{"key":"A","text":"拉杆飞机转入下降"},{"key":"B","text":"推油门飞机转入下降"},{"key":"C","text":"推杆飞机转入下降"}],"answer":"C","analysis":"提示：推杆减小迎角，下降\n解析：无人机驾驶员舵面遥控操纵飞机时，推杆会使飞机转入下降状态，因为推杆会减小飞机的迎角，导致升力减小，飞机下降。","tags":[],"bankId":"uav-selected"},{"id":"sel-0373","type":"single","difficulty":1,"stem":"无人机制造商编写的文档《无人机所有者/信息手册》()。","options":[{"key":"A","text":"可以替代《无人机飞行手册》"},{"key":"B","text":"一般情况下可以替代《无人机飞行手册》"},{"key":"C","text":"不能替代《无人机飞行手册》"}],"answer":"C","analysis":"提示：（所有者/信息），不批准不替代\n解析：（此题不要与《无人机飞行手册》混淆，飞行手册很重要，需要按照要求编写，并需要局方审批）本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。无人机制造商也可编写操作细节更加详细的《无人机驾驶员操作手册》(POH),其中应包含局方批准的《无人机飞行手册》信息,并提交局方备案。如果以《无人机驾驶员操作手册》作为主要参考,那么相关段落要声明由局方批准可代替《无人机飞行手册》。《无人机所有者/信息手册》也是由无人机制造商编写的文档,包含关于无人机制造和型号方面的一般信息。《无人机所有者/信息手册》不经过局方批准,也不特定于具体注册号的飞机。这个手册提供飞机运行有关的一般信息,不保持内容最新,所以不能代替《无人机飞行手册》或者《无人机驾驶员操作手册》。","tags":[],"bankId":"uav-selected"},{"id":"sel-0374","type":"single","difficulty":1,"stem":"如果无人机制造商使用编写的细节更加详细的《无人机驾驶员操作手册》作为主要参考( )《无人机飞行手册》。","options":[{"key":"A","text":"由局方批准后可以替代"},{"key":"B","text":"不可替代"},{"key":"C","text":"一般情况下可以替代"}],"answer":"A","analysis":"提示：局方批准后可\n解析：（《操作手册》被局方批准后可替代《飞行手册》）本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。无人机制造商也可编写操作细节更加详细的《无人机驾驶员操作手册》(POH),其中应包含局方批准的《无人机飞行手册》信息,并提交局方备案。如果以《无人机驾驶员操作手册》作为主要参考,那么相关段落要声明由局方批准可代替《无人机飞行手册》。《无人机所有者/信息手册》也是由无人机制造商编写的文档,包含关于无人机制造和型号方面的一般信息。《无人机所有者/信息手册》不经过局方批准,也不特定于具体注册号的飞机。这个手册提供飞机运行有关的一般信息,不保持内容最新,所以不能代替《无人机飞行手册》或者《无人机驾驶员操作手册》。","tags":[],"bankId":"uav-selected"},{"id":"sel-0375","type":"single","difficulty":1,"stem":"属于减升装置的辅助操纵面是()。","options":[{"key":"A","text":"扰流板"},{"key":"B","text":"副翼"},{"key":"C","text":"前缘缝翼"}],"answer":"A","analysis":"提示：扰流板减升\n解析：扰流板是一种减升装置，它通过增加阻力来减小飞机的升力，通常用于着陆或低速飞行时的减速和姿态控制。","tags":[],"bankId":"uav-selected"},{"id":"sel-0376","type":"single","difficulty":1,"stem":"下列关于扰流板的叙述哪项说法错误?","options":[{"key":"A","text":"扰流板可作为减速板缩短飞机滑跑距离"},{"key":"B","text":"可辅助副翼实现飞机横向操纵"},{"key":"C","text":"可代替副翼实现飞机横向操纵"}],"answer":"C","analysis":"提示：选错的，不可替代\n解析：扰流板可作为减速板缩短飞机滑跑距离，这是正确的。同时，扰流板也可以辅助副翼实现飞机横向操纵，通过增加一侧机翼的阻力来帮助飞机进行横向移动。然而，扰流板并不能代替副翼实现飞机横向操纵。副翼是飞机主要的横向操纵面，通过改变其角度来控制飞机的横向移动。扰流板只是辅助装置，不能替代副翼的功能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0377","type":"single","difficulty":1,"stem":"飞行中操作扰流板伸出()。","options":[{"key":"A","text":"增加机翼上翼面的面积以提高升力"},{"key":"B","text":"阻挡气流的流动，增大阻力"},{"key":"C","text":"增加飞机抬头力矩，辅助飞机爬升"}],"answer":"B","analysis":"提示：扰流板→扰动的气流 增阻力\n解析：我们从图片中也可以看出，无论是副翼、襟翼还是缝翼，它们展开后，都是顺着气流方向，保持着翼面的流线型。而扰流板，顾名思义，它向上竖起后，会直接破坏机翼的流线型，扰乱上表面的气流，从而快速减小升力、大幅增加阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0378","type":"single","difficulty":1,"stem":"属于增升装置的辅助操纵面是()。","options":[{"key":"A","text":"扰流板"},{"key":"B","text":"副翼"},{"key":"C","text":"前缘襟翼"}],"answer":"C","analysis":"提示：前缘襟翼增升\n解析：前缘襟翼是一种增升装置，它通过改变机翼前缘的形状来增加升力系数，特别是在起飞和着陆时。这允许飞机在更低的速度和更高的迎角下飞行而不失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0379","type":"single","difficulty":1,"stem":"前缘缝翼的功用有()。","options":[{"key":"A","text":"增大机翼的安装角"},{"key":"B","text":"增加飞机的稳定性"},{"key":"C","text":"增大最大升力系数"}],"answer":"C","analysis":"提示：前缘，增大升力系数\n解析：前缘缝翼的主要作用是在低速时增加机翼的升力系数，特别是在起飞和着陆时。","tags":[],"bankId":"uav-selected"},{"id":"sel-0380","type":"single","difficulty":1,"stem":"前缘缝翼的主要作用是()。","options":[{"key":"A","text":"放出前缘缝翼，可增大飞机的临界迎角"},{"key":"B","text":"增大机翼升力"},{"key":"C","text":"减小阻力"}],"answer":"A","analysis":"提示：前缘，增大升力系数，增大临界迎角\n解析：放出前缘缝翼，能增大飞机的临界迎角提高飞机的升力性能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0381","type":"single","difficulty":1,"stem":"放全襟翼下降，无人机能以()。","options":[{"key":"A","text":"较大的下降角，较小的速度下降"},{"key":"B","text":"较小的下降角，较大的速度下降"},{"key":"C","text":"较大的下降角，较大的速度下降"}],"answer":"A","analysis":"提示：全襟翼下降，大角小速度\n解析：放全襟翼增加了机翼面积和弯度，增大了升力系数，使得无人机能以较大的下降角，但速度较小的方式下降。","tags":[],"bankId":"uav-selected"},{"id":"sel-0382","type":"single","difficulty":1,"stem":"对于带襟翼无人机，放下襟翼，飞机的升力将()，阻力将()。","options":[{"key":"A","text":"增大、减小"},{"key":"B","text":"增大、增大"},{"key":"C","text":"减小、减小"}],"answer":"B","analysis":"提示：放下襟翼，升力↑阻力↑\n解析：放下襟翼增加机翼面积和弯度，升力和阻力都会增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0383","type":"single","difficulty":1,"stem":"飞机着陆时使用后缘襟翼的作用是()。","options":[{"key":"A","text":"提高飞机的操纵灵敏性"},{"key":"B","text":"增加飞机的稳定性"},{"key":"C","text":"增加飞机的升力"}],"answer":"C","analysis":"提示：后缘襟翼→升力\n解析：着陆时速度降低，使用后缘襟翼可增大机翼弯度和面积，从而增加飞机升力，有助于平稳着陆。","tags":[],"bankId":"uav-selected"},{"id":"sel-0384","type":"single","difficulty":1,"stem":"空速适度减小时，为保持高度，应实施的操纵是()。","options":[{"key":"A","text":"增大迎角，使升力的增加大于阻力的增加"},{"key":"B","text":"增大迎角，以保持升力不变"},{"key":"C","text":"减小迎角，以保持阻力不变"}],"answer":"B","analysis":"提示：空速减小，增大迎角\n解析：当空速减小时，如果迎角增大，可以保持升力不变，从而保持飞机的高度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0385","type":"single","difficulty":1,"stem":"飞机以一定地速逆风起飞时()。","options":[{"key":"A","text":"滑跑距离将减小"},{"key":"B","text":"滑跑距离将增大"},{"key":"C","text":"滑跑距离将不变"}],"answer":"A","analysis":"提示：逆风滑跑距离减小\n解析：飞机逆风起飞时，相对风速增大，升力和阻力均增大，使得飞机更早离地，滑跑距离减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0386","type":"single","difficulty":1,"stem":"使飞机获得最大下滑距离的速度是（）。","options":[{"key":"A","text":"最大下滑速度"},{"key":"B","text":"失速速度"},{"key":"C","text":"下滑有利速度"}],"answer":"C","analysis":"提示：下滑有利速度\n解析：使飞机获得最大下滑距离的速度是下滑有利速度，这个速度下，飞机能够以最远的距离下滑着陆，既不过快也不过慢。","tags":[],"bankId":"uav-selected"},{"id":"sel-0387","type":"single","difficulty":1,"stem":"下滑有利速度使()。","options":[{"key":"A","text":"飞机下滑阻力最小"},{"key":"B","text":"飞机下滑角最大"},{"key":"C","text":"飞机下滑升力最大"}],"answer":"A","analysis":"提示：下滑阻力最小\n解析：下滑有利速度是指使飞机下滑阻力最小的速度，这样飞机可以以最远的距离下滑着陆。","tags":[],"bankId":"uav-selected"},{"id":"sel-0388","type":"single","difficulty":1,"stem":"用下滑有利速度下滑，飞机的（）。","options":[{"key":"A","text":"升阻比最大"},{"key":"B","text":"升力最大"},{"key":"C","text":"下滑角最大"}],"answer":"A","analysis":"提示：有利速度下滑，升阻比最大\n解析：用下滑有利速度下滑时，飞机的升阻比达到最大，这意味着飞机在下滑过程中能够获得最佳的飞行效率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0389","type":"single","difficulty":1,"stem":"无人机在积水道上起飞，其起飞距离比正常情况下（）。","options":[{"key":"A","text":"长"},{"key":"B","text":"短"},{"key":"C","text":"相等"}],"answer":"A","analysis":"提示：水地滑，摩擦力小，跑远点\n解析：无人机在积水道上起飞时，由于跑道表面湿滑，轮胎与地面的摩擦力减小，导致起飞时需要更长的距离才能达到足够的起飞速度。因此，相比正常情况下的起飞距离，积水道上的起飞距离会更长。","tags":[],"bankId":"uav-selected"},{"id":"sel-0390","type":"single","difficulty":1,"stem":"气温高低，如何影响飞机滑跑距离？","options":[{"key":"A","text":"气温低时，空气密度小，飞机增速快，飞机升力减小，起飞滑跑距离要长"},{"key":"B","text":"气温高时，空气密度大，飞机增速快，飞机升力增大，起飞滑跑距离要短"},{"key":"C","text":"气温高时，空气密度小，飞机增速慢，飞机的离地速度增大，起飞滑跑距离要长"}],"answer":"C","analysis":"提示：气温高，密度小，起飞距离长\n解析：气温高低对飞机滑跑距离的影响是，气温高时，空气密度小，飞机在跑道上增速慢达到离地速度所需的距离增大，因此起飞滑跑距离要长。反之，气温低时，滑跑距离缩短。","tags":[],"bankId":"uav-selected"},{"id":"sel-0391","type":"single","difficulty":1,"stem":"大气压力的降低对飞机性能有显著的影响，在较高的高度，伴随着降低的大气压力（）。","options":[{"key":"A","text":"起飞和着陆距离会增加，爬升率会减小"},{"key":"B","text":"起飞和着陆距离会增加，爬升率也会增加"},{"key":"C","text":"起飞和着陆距离会减小，爬升率也会减小"}],"answer":"A","analysis":"提示：密度↓→离地速度↑→所需距离↑；功率↓→爬升率↓\n解析：在较高的高度，伴随着降低的大气压力空气密度减小，导致飞机的起飞和着陆距离增加，同时爬升率也会减小，因为飞机需要更多的时间来达到相同的爬升高度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0392","type":"single","difficulty":1,"stem":"当多旋翼飞行器地面站出现飞行器电压过低报警时，第一时刻采取的措施不包括( )。","options":[{"key":"A","text":"迅速将油门收到0"},{"key":"B","text":"一键返航"},{"key":"C","text":"控制姿态，逐渐降低高度，迫降至地面"}],"answer":"A","analysis":"提示：选错的。不能油门收到0\n解析：当多旋翼飞行器地面站出现飞行器电压过低报警时，第一时刻采取的措施不包括迅速将油门收到0。 迅速将油门收到0可能会导致飞行器直接坠落，造成损坏。较为合理的措施是控制姿态，逐渐降低高度，迫降至地面，或者一键返航。","tags":[],"bankId":"uav-selected"},{"id":"sel-0393","type":"single","difficulty":1,"stem":"当多旋翼飞行器飞远超出视线范围无法辨别机头方向时，应对方式错误的是( )。","options":[{"key":"A","text":"加大油门"},{"key":"B","text":"一键返航"},{"key":"C","text":"云台复位通过图像确定机头方向"}],"answer":"A","analysis":"提示：选错的。加油门跑更远\n解析：当多旋翼飞行器飞远超出视线范围无法辨别机头方向时，应对方式错误的是加大油门。加大油门可能会使飞行器飞得更远，增加失控的风险。正确的做法是一键返航或者云台复位通过图像确定机头方向。","tags":[],"bankId":"uav-selected"},{"id":"sel-0394","type":"single","difficulty":1,"stem":"转弯时，为保持高度和空速，应()。","options":[{"key":"A","text":"增大迎角和油门"},{"key":"B","text":"增大迎角、减小拉力"},{"key":"C","text":"减小迎角、增大拉力"}],"answer":"A","analysis":"提示：转弯为保持高度与空速，增大迎角和油门\n解析：在转弯时，为了保持高度和空速，飞机需要增大迎角以产生足够的升力来抵消重力的影响，从而保持高度。同时，为了保持空速，飞机需要增大油门以增加推力。因此，正确的操作是增大迎角和油门。","tags":[],"bankId":"uav-selected"},{"id":"sel-0395","type":"single","difficulty":1,"stem":"飞行手册中规定着陆不能刹车状态接地，主要是因为()。","options":[{"key":"A","text":"可能使刹车装置失效"},{"key":"B","text":"可能导致滑跑时拖胎"},{"key":"C","text":"使机轮起转力矩增大而损坏"}],"answer":"C","analysis":"提示：刹车着陆损坏力矩\n解析：飞行手册中规定着陆不能刹车状态接地主要是因为使机轮起转力矩增大而损坏。在接地瞬间刹车会导致机轮受到过大的冲击和力矩，增加损坏的风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0396","type":"single","difficulty":1,"stem":"关于粗猛着陆描述正确的是()。","options":[{"key":"A","text":"粗猛着陆就是使飞机接地的动作太快"},{"key":"B","text":"不按规定的着陆高度、速度及接地角，导致受地面撞击力超过规定"},{"key":"C","text":"粗猛着陆时前轮先接地"}],"answer":"B","analysis":"提示：粗猛=不按规定\n解析：粗猛着陆是指不按规定的着陆高度、速度及接地角，导致受地面撞击力超过规定。如果飞机接地时速度过大、高度过高或接地角不正确，就可能造成粗猛着陆，对飞机结构和乘客安全带来威胁。","tags":[],"bankId":"uav-selected"},{"id":"sel-0397","type":"single","difficulty":1,"stem":"航空器起飞着陆时使用跑道主要取决于( )。","options":[{"key":"A","text":"地面风向风速"},{"key":"B","text":"机型"},{"key":"C","text":"进场航迹与跑道中心延长线夹角大小"}],"answer":"A","analysis":"提示：起飞着陆 要看风\n解析：航空器起飞着陆时使用跑道主要取决于地面风向风速。逆风有助于增加飞机的升力，缩短滑跑距离，所以通常会选择逆风的跑道起降","tags":[],"bankId":"uav-selected"},{"id":"sel-0398","type":"single","difficulty":1,"stem":"飞机着陆进入地面效应区时，将（）。","options":[{"key":"A","text":"出现短暂的机头上仰变化"},{"key":"B","text":"经历诱导阻力减小的过程，需要减小动力"},{"key":"C","text":"需要增大迎角以保持相同的升力系数"}],"answer":"B","analysis":"提示：地面效应，减小动力\n解析：飞机着陆进入地面效应区时，升力增大，诱导阻力减小，为保持下滑姿态和速度，需减小动力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0399","type":"single","difficulty":1,"stem":"飞机在y方向上的“过载”是指()。","options":[{"key":"A","text":"飞机升力与飞机重力的比值"},{"key":"B","text":"飞机升力与飞机阻力的比值"},{"key":"C","text":"飞机推力与飞机阻力的比值"}],"answer":"A","analysis":"提示：x，横轴，推阻；y，竖轴，升重\n解析：（这里的过载不是我们生活中的说的“超过载荷”，它在题目中是飞机工程领域专有名词，是个比值）“过载”就是飞机结构或飞行员感受到的“载荷倍数”，用 G表示： 过载 ＝ 飞机当前所受总升力（或总法向力）/ 飞机重量1G ＝ 升力正好等于重量，平飞状态；0 G ＝ 失重，自由落体；负G ＝ 升力方向倒过来。","tags":[],"bankId":"uav-selected"},{"id":"sel-0400","type":"single","difficulty":1,"stem":"无人机飞行员操纵方向舵时，飞行器将绕( )。","options":[{"key":"A","text":"横轴运动"},{"key":"B","text":"纵轴运动"},{"key":"C","text":"立轴运动"}],"answer":"C","analysis":"提示：副纵升横 航向立\n解析：操纵方向舵时，飞行器将绕立轴运动，即进行偏航运动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0401","type":"single","difficulty":1,"stem":"无人机飞行员操纵升降舵时，飞行器将绕( )。","options":[{"key":"A","text":"横轴运动"},{"key":"B","text":"纵轴运动"},{"key":"C","text":"立轴运动"}],"answer":"A","analysis":"提示：副纵升横 航向立\n解析：操纵升降舵时，飞行器将绕横轴运动，即进行俯仰运动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0402","type":"single","difficulty":1,"stem":"无人机驾驶员操纵副翼时，飞行器将绕( )。","options":[{"key":"A","text":"横轴运动"},{"key":"B","text":"纵轴运动"},{"key":"C","text":"立轴运动"}],"answer":"B","analysis":"提示：副纵升横 航向立\n解析：操纵副翼时，飞行器将绕纵轴运动，即进行滚转运动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0403","type":"single","difficulty":1,"stem":"飞机的纵向安定性有利于()。","options":[{"key":"A","text":"防止飞机绕立轴偏转过快"},{"key":"B","text":"防止飞机绕纵轴滚转过快"},{"key":"C","text":"防止飞机抬头过高或低头过低"}],"answer":"C","analysis":"提示：俯仰-横轴\n解析：飞机的纵向安定性是指飞机在受到扰动后，能够自动恢复到原来飞行状态的能力，特别是有利于防止飞机抬头过高或低头过低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0404","type":"single","difficulty":1,"stem":"飞机的纵向和航向稳定性之间()。","options":[{"key":"A","text":"互相独立"},{"key":"B","text":"必须匹配适当"},{"key":"C","text":"纵向稳定性好，航向稳定性就差"}],"answer":"A","analysis":"提示：横航匹配，纵航无关。\n解析：飞机的纵向稳定性和航向稳定性是两个相对独立的概念。纵向稳定性主要关注飞机在俯仰方向上的稳定性，而航向稳定性则关注飞机在偏航方向上的稳定性。它们之间的相互影响相对较小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0405","type":"single","difficulty":1,"stem":"飞机的横向和航向稳定性之间（）。","options":[{"key":"A","text":"互相独立"},{"key":"B","text":"必须匹配适当"},{"key":"C","text":"横向稳定性好，航向稳定性就差"}],"answer":"B","analysis":"提示：横航匹配，纵航无关。\n解析：飞机的横向和航向稳定性之间必须匹配适当。如果两者匹配不当，会影响飞机的飞行品质和操纵性能。横向稳定性过强而航向稳定性不足，可能导致飞机难以转弯；反之，若航向稳定性过强而横向稳定性不足，飞机可能在转弯时出现不稳定的情况。只有两者匹配适当，飞机才能在飞行中保持良好的稳定性和操纵性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0406","type":"single","difficulty":1,"stem":"飞机横向稳定性是指飞机受到扰动后（）。","options":[{"key":"A","text":"产生绕纵轴转动，扰动消失后转角自动回到零"},{"key":"B","text":"产生绕纵轴转动，扰动消失后自动恢复原飞行姿态"},{"key":"C","text":"产生绕横轴转动，扰动消失后转角自动回到零"}],"answer":"B","analysis":"提示：稳定性→“恢复原飞行姿态” 航向立，纵向横，横向纵\n解析：飞机的稳定性就是指飞机受到小扰动后，偏离原平衡状态，并在扰动消失后，自动恢复到原平衡状态的特性。 不管题目问的是横向、纵向还是航向，只要选项里出现 “自动恢复原飞行姿态”，就是正确答案。 同时根据口诀“航向立，纵向横，横向纵”找到轴与对应的稳定性 本题横向纵","tags":[],"bankId":"uav-selected"},{"id":"sel-0407","type":"single","difficulty":1,"stem":"飞机绕横轴的稳定性称为()。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"航向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"A","analysis":"提示：航向立，纵向横，横向纵\n解析：纵向稳定性定义：当飞机受微小扰动后，偏离原来纵向平衡状态(俯仰方向),并在扰动消失以后,飞机能自动恢复到原来纵向平衡状态的特性,叫作飞机的纵向稳定性。简易理解：飞机绕横轴的稳定性 = 纵向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"bankId":"uav-selected"},{"id":"sel-0408","type":"single","difficulty":1,"stem":"飞机绕立轴的稳定性称为()。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"航向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"B","analysis":"提示：航向立，纵向横，横向纵\n解析：航向稳定性定义：飞机受到扰动以致方向平衡状态遭到破坏,而在扰动消失后,飞机如能趋向于恢复原来的平衡状态,就具有航向稳定性。简易理解：飞机绕立轴的稳定性 =（方向平衡） 航向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"bankId":"uav-selected"},{"id":"sel-0409","type":"single","difficulty":1,"stem":"飞机绕纵轴的稳定性称为()。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"航向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"C","analysis":"提示：航向立，纵向横，横向纵\n解析：横向稳定性定义：飞机受扰动以致横侧向平衡状态遭到破坏,而在扰动消失后,如飞机自身产生一个恢复力矩,使飞机趋向于恢复原来的平衡状态,就具有横侧向稳定性;反之,就没有横侧向稳定性。简易理解：飞机绕纵轴的稳定性 = 横向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"bankId":"uav-selected"},{"id":"sel-0410","type":"single","difficulty":1,"stem":"增加垂直安定面面积产生的影响将( )。","options":[{"key":"A","text":"增加升力"},{"key":"B","text":"增加横向稳定性"},{"key":"C","text":"增加纵向静稳定性"}],"answer":"B","analysis":"提示：垂直安定面→横向稳定性\n解析：垂直安定面=垂直尾翼，直接影响方向稳定性。但是选项中没有“方向稳定性”。分析选项：垂直安定面不产生升力，排除A； 纵向稳定性靠水平尾翼，排除C。根据CAAC2023运输航线机长考试知识点“垂尾及上单翼设计可产生横侧稳定力矩。”确定垂尾也可影响横向稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0411","type":"single","difficulty":1,"stem":"对飞机方向稳定性影响最大的是()。","options":[{"key":"A","text":"飞机的最大迎风面积"},{"key":"B","text":"水平尾翼"},{"key":"C","text":"垂直尾翼"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：垂直尾翼对飞机方向稳定性影响最大，能有效抵抗侧风等干扰保持方向稳定。","tags":[],"bankId":"uav-selected"},{"id":"sel-0412","type":"single","difficulty":1,"stem":"飞机的方向阻尼力矩主要由（）。","options":[{"key":"A","text":"水平尾翼产生"},{"key":"B","text":"垂直尾翼产生"},{"key":"C","text":"机翼产生"}],"answer":"B","analysis":"提示：横机，纵水，方垂直\n解析：飞机的航向阻尼力矩是指绕立轴偏航阻尼。当飞机偏航摆动时，机头左右偏转。机头向左/右偏，垂尾向左/右运动，形成侧向气动力差。垂尾侧向力差形成反向力矩，阻碍偏航摆动运动，就是航向（方向）阻尼力矩，主要由垂直尾翼提供。","tags":[],"bankId":"uav-selected"},{"id":"sel-0413","type":"single","difficulty":1,"stem":"飞机的横向阻尼力矩主要由（）。","options":[{"key":"A","text":"水平尾翼产生"},{"key":"B","text":"垂直尾翼产生"},{"key":"C","text":"机翼产生"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：飞机的横向阻尼力矩是指绕纵轴滚转阻尼。 当飞机滚转时，机翼一侧高一侧低。 下沉机翼相对来流速度增大、有效迎角↑升力↑；上扬机翼迎角↓、升力↓。 左右升力差形成反向力矩，阻碍滚转运动，就是横向阻尼力矩，主要由机翼提供。","tags":[],"bankId":"uav-selected"},{"id":"sel-0414","type":"single","difficulty":1,"stem":"飞机横向平衡中的滚转力矩主要包括( )。","options":[{"key":"A","text":"机翼阻力力矩"},{"key":"B","text":"机翼升力力矩"},{"key":"C","text":"水平尾翼力矩"}],"answer":"B","analysis":"提示：横升\n解析：飞机横向平衡中的滚转力矩主要由机翼升力力矩构成。机翼在飞行时产生的升力不仅支撑飞机重量，还产生使飞机保持横向平衡力矩。","tags":[],"bankId":"uav-selected"},{"id":"sel-0415","type":"single","difficulty":1,"stem":"飞机纵向阻尼力矩的主要由（）。","options":[{"key":"A","text":"后掠机翼产生"},{"key":"B","text":"垂直尾翼产生"},{"key":"C","text":"水平尾翼产生"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：飞机的纵向阻尼力矩是指绕横轴俯仰阻尼。当飞机俯仰摆动时，机头一上一下。机头下俯，平尾向上运动，相对气流有效迎角↑、平尾升力↑；机头上仰，平尾向下运动，有效迎角↓、平尾升力↓。平尾升力变化形成反向力矩，阻碍俯仰摆动运动，就是纵向阻尼力矩，主要由水平尾翼提供。","tags":[],"bankId":"uav-selected"},{"id":"sel-0416","type":"single","difficulty":1,"stem":"下列哪种变化情况肯定会增加飞机方向静稳定性?","options":[{"key":"A","text":"增加机翼面积"},{"key":"B","text":"增加垂直尾翼面积"},{"key":"C","text":"增加水平尾翼面积"}],"answer":"B","analysis":"提示：横机，纵水，方垂直\n解析：飞机的方向静稳定性是指飞机在受到方向扰动后，能否自动恢复到原来飞行方向的能力。增加垂直尾翼面积可以增大飞机在偏航时产生的偏航力矩，从而增强飞机的方向静稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0417","type":"single","difficulty":1,"stem":"下列哪种变化情况肯定会增加飞机纵向静稳定性?","options":[{"key":"A","text":"增加机翼面积"},{"key":"B","text":"增加垂直尾翼面积"},{"key":"C","text":"增加水平尾翼面积"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：飞机的纵向静稳定性是指飞机在受到纵向扰动后，能否自动恢复到原来飞行姿态的能力。增加水平尾翼面积可以增大飞机在俯仰时产生的俯仰力矩，从而增强飞机的纵向静稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0418","type":"single","difficulty":1,"stem":"飞机的方向安定性过强，而横侧安定性相对过弱，飞机容易出现()。","options":[{"key":"A","text":"飘摆(荷兰滚)"},{"key":"B","text":"螺旋不稳定"},{"key":"C","text":"转弯困难"}],"answer":"B","analysis":"提示：方强横弱 ，螺不稳\n解析：飞机的方向安定性过强，横侧安定性相对过弱，飞机容易出现螺旋不稳定。这种情况下飞机在飞行中可能会突然进入螺旋状态，难以保持稳定的飞行姿态。而飘摆通常与横侧安定性相关，转弯困难则更多与操纵性有关。","tags":[],"bankId":"uav-selected"},{"id":"sel-0419","type":"single","difficulty":1,"stem":"飞行中发现飞机非指令的时而左滚，时而右滚，同时伴随机头时而左偏，时而右偏的现象，此迹象表明()。","options":[{"key":"A","text":"飞机进入了飘摆(荷兰滚)"},{"key":"B","text":"飞机进入了失速"},{"key":"C","text":"飞机进入了螺旋"}],"answer":"A","analysis":"提示：四个时而“荷兰滚”\n解析：荷兰滚是飞行器 \"横滚\" 与 \"偏航\" 耦合的周期性振荡，属于飞行动力学中典型的横航向模态。表现为一边左右滚转、一边左右摇头甩尾，像钟摆式 “摇摆 + 蛇行” 的复合运动，也常被称作飘摆。","tags":[],"bankId":"uav-selected"},{"id":"sel-0420","type":"single","difficulty":1,"stem":"使飞机绕横轴转动的力矩称为()。","options":[{"key":"A","text":"倾斜力矩"},{"key":"B","text":"俯仰力矩"},{"key":"C","text":"滚转力矩"}],"answer":"B","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：绕横轴转动的力矩称为俯仰力矩，控制飞机的俯仰姿态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0421","type":"single","difficulty":1,"stem":"使飞机绕立轴作旋转运动的力矩称为()。","options":[{"key":"A","text":"俯仰力矩"},{"key":"B","text":"纵向力矩"},{"key":"C","text":"偏航力矩"}],"answer":"C","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：绕立轴旋转的力矩称为偏航力矩，影响飞机偏航运动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0422","type":"single","difficulty":1,"stem":"使飞机绕纵轴产生侧倾的力矩称为()。","options":[{"key":"A","text":"俯仰力矩"},{"key":"B","text":"偏航力矩"},{"key":"C","text":"滚转力矩"}],"answer":"C","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：绕纵轴的力矩称为滚转力矩，决定飞机的侧倾僖动作。","tags":[],"bankId":"uav-selected"},{"id":"sel-0423","type":"single","difficulty":1,"stem":"具有后掠角的飞机有侧滑角时，会产生()。","options":[{"key":"A","text":"滚转力矩"},{"key":"B","text":"俯仰力矩"},{"key":"C","text":"不产生任何力矩"}],"answer":"A","analysis":"提示：后侧滚，反侧偏\n解析：具有后掠角的机翼发生侧滑时，两侧机翼的相对气流和升力分布不同，会产生左右升力差，从而形成滚转力矩，使飞机出现滚转趋势。","tags":[],"bankId":"uav-selected"},{"id":"sel-0424","type":"single","difficulty":1,"stem":"具有上反角的飞机有侧滑角时，会产生()。","options":[{"key":"A","text":"偏航力矩"},{"key":"B","text":"俯仰力矩"},{"key":"C","text":"不产生任何力矩"}],"answer":"A","analysis":"提示：后侧滚，反侧偏\n解析：上反角是指机翼的后缘相对于机身底面向上倾斜的设计。在飞机侧滑角度存在时，上反角会导致飞机产生偏航力矩。","tags":[],"bankId":"uav-selected"},{"id":"sel-0425","type":"single","difficulty":1,"stem":"飞机的重心位置影响飞机的()。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"方向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"A","analysis":"提示：重心纵（谐音 重心重）\n解析：重心前后位置会改变重心与升力作用点之间的关系，从而影响飞机的俯仰平衡和纵向静稳定性。(方向稳定性主要与垂直尾翼有关)(横向稳定性主要与上反角、后掠角等有关)","tags":[],"bankId":"uav-selected"},{"id":"sel-0426","type":"single","difficulty":1,"stem":"焦点在重心之后，焦点位置向后移()。","options":[{"key":"A","text":"增加纵向稳定性"},{"key":"B","text":"提高纵向操纵性"},{"key":"C","text":"减小纵向稳定性"}],"answer":"A","analysis":"提示：焦后，纵向稳\n解析：焦点在重心之后，焦点后移会增加飞机恢复原有姿态的趋势，从而增加纵向稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0427","type":"single","difficulty":1,"stem":"焦点在重心之后，向后移焦点，飞机的()。","options":[{"key":"A","text":"操纵性与此无关"},{"key":"B","text":"操纵性增强"},{"key":"C","text":"操纵性减弱"}],"answer":"C","analysis":"提示：焦后，操纵弱\n解析：焦点后移会使飞机操纵性减弱，因为飞机恢复原有姿态的趋势增强，操纵难度加大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0428","type":"single","difficulty":1,"stem":"无人机配平的主要考虑是（）沿纵轴的前后位置。","options":[{"key":"A","text":"发动机"},{"key":"B","text":"气动焦点"},{"key":"C","text":"重心"}],"answer":"C","analysis":"提示：配平找重心\n解析：无人机的配平主要考虑重心沿纵轴的前后位置。重心不一定是一个固定点, 它的位置取决于重量在无人机上的分布。无人机驾驶员应该认识到,如果无人机的重心沿纵轴太靠前,就会产生头重现象;相反,如果重心沿纵轴太靠后,就会产生后重现象。不适当的重心位置可能会导致无人机出现不稳定状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0429","type":"single","difficulty":1,"stem":"在装载时，由于飞机重心偏右，可导致在巡航飞行时，飞机的阻力()。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"A","analysis":"提示：重心偏右，阻力大\n解析：飞机重心偏右导致巡航时两侧升力不平衡，需增加阻力以修正，因此飞机阻力增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0430","type":"single","difficulty":1,"stem":"研究飞机运动时选用的机体坐标，其()。","options":[{"key":"A","text":"以飞机重心为原点，纵轴和横轴确定的平面为对称面"},{"key":"B","text":"以全机焦点为原点，纵轴和立轴确定的平面为对称面"},{"key":"C","text":"以飞机重心为原点，纵轴和立轴确定的平面为对称面"}],"answer":"C","analysis":"提示：重心为原点，纵立对称\n解析：在研究飞机运动时，通常选用机体坐标来描述飞机的运动状态。机体坐标以飞机重心为原点，其中纵轴(X轴)沿飞机机身方向，立轴(Z轴)垂直于飞机对称面并指向机身下方，横轴(Y轴)则垂直于纵轴和立轴构成的平面。因此，机体坐标是以飞机重心为原点，纵轴和立轴确定的平面为对称面。","tags":[],"bankId":"uav-selected"},{"id":"sel-0431","type":"single","difficulty":1,"stem":"下列叙述错误的是()。","options":[{"key":"A","text":"飞机焦点位于飞机重心之后有利于飞机的纵向安定性"},{"key":"B","text":"飞机焦点位于飞机重心之前有利于飞机的纵向安定性"},{"key":"C","text":"飞机的重心位置与飞机的装载情况有关，与飞机的飞行状态无关"}],"answer":"B","analysis":"提示：选错的。焦后纵向稳，不是前\n解析：飞机的焦点位置与飞机的安定性有关。当飞机焦点位于飞机重心之后时，飞机具有纵向安定性，即飞机在受到纵向扰动后能够自动恢复到原来的飞行姿态。而当飞机焦点位于飞机重心之前时，飞机则不具有纵向安定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0432","type":"single","difficulty":1,"stem":"多旋翼飞行器重心过高于或过低于桨平面会()。","options":[{"key":"A","text":"降低稳定性"},{"key":"B","text":"降低机动性"},{"key":"C","text":"显著影响电力消耗"}],"answer":"B","analysis":"提示：重心过高低→降低机动性\n解析：当重心过高或过低时，飞行器在姿态变化和动作执行时会变得更加迟缓、不灵活，从而降低了机动性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0433","type":"single","difficulty":1,"stem":"具有纵向安定性的飞机，飞机重心（）。","options":[{"key":"A","text":"位于压力中心前"},{"key":"B","text":"位于压力中心后"},{"key":"C","text":"与压力中心重合"}],"answer":"A","analysis":"提示：纵前，横后\n解析：具有纵向安定性的飞机，其重心位于压力中心前方，这样设计可以使得飞机在受到扰动时具有恢复原来飞行姿态的趋势。","tags":[],"bankId":"uav-selected"},{"id":"sel-0434","type":"single","difficulty":1,"stem":"重心靠后，飞机的纵向安定性()。","options":[{"key":"A","text":"变强"},{"key":"B","text":"减弱"},{"key":"C","text":"保持不变"}],"answer":"B","analysis":"提示：纵向，重心前强后弱\n解析：飞机的纵向安定性是指飞机在受到扰动后，能否恢复到原来飞行状态的能力。当飞机的重心靠后时，其纵向安定性会减弱，因为重心后移会使得飞机在受到扰动时更容易产生俯仰运动，且恢复稳定的能力降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0435","type":"single","difficulty":1,"stem":"重心靠前，飞机的纵向安定性()。","options":[{"key":"A","text":"变强"},{"key":"B","text":"减弱"},{"key":"C","text":"不受影响"}],"answer":"A","analysis":"提示：纵向，重心前强后弱\n解析：与重心靠后相反，当飞机的重心靠前时，其纵向安定性会增强。这是因为重心前移会使得飞机在受到扰动时更不容易产生俯仰运动，且能更快地恢复到原来的飞行状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0436","type":"single","difficulty":1,"stem":"飞机重心位置的表示方法是()。","options":[{"key":"A","text":"用重心到平均气动力弦前缘的距离和平均气动力弦长之比的百分数来表示"},{"key":"B","text":"用重心到平均几何弦后缘的距离和平均几何弦长之比的百分数来表示"},{"key":"C","text":"用重心到机体基准面的距离和平均气动力弦长之比的百分数来表示"}],"answer":"A","analysis":"提示：前缘\n解析：重心位置用重心到平均气动力弦前缘的距离和平均气动力弦长之比的百分数来表示，这是常用且准确的方法，","tags":[],"bankId":"uav-selected"},{"id":"sel-0437","type":"single","difficulty":1,"stem":"常规布局的飞机，机翼升力对飞机重心的力矩常为使飞机机头的( )力矩。","options":[{"key":"A","text":"上仰"},{"key":"B","text":"下俯"},{"key":"C","text":"偏转"}],"answer":"B","analysis":"提示：机翼下，平尾上\n解析：常规布局的飞机重心在前，焦点在后，平尾在最后。 我们模拟一个场景：飞机以重心为跷跷板支点，整个飞机是平衡的。 如果 给平尾一个向下的力（平尾负升力），机头上仰； 如果 给机翼一个向上的力（升力向上），机头下俯；","tags":[],"bankId":"uav-selected"},{"id":"sel-0438","type":"single","difficulty":1,"stem":"常规布局的飞机，平尾升力对飞机重心的力矩常为使飞机机头的( )力矩。","options":[{"key":"A","text":"上仰"},{"key":"B","text":"下俯"},{"key":"C","text":"偏转"}],"answer":"A","analysis":"提示：机翼下，平尾上\n解析：常规布局的飞机重心在前，焦点在后，平尾在最后。 我们模拟一个场景：飞机以重心为跷跷板支点，整个飞机是平衡的。 如果 给平尾一个向下的力（平尾负升力），机头上仰； 如果 给机翼一个向上的力（升力向上），机头下俯；（鼠鼠老师的话：题干中平尾升力 其实是对力的统称，需要考生自行判断，这个力是负的还是正的）（对于常规布局的飞机来说，除了个别情况，飞机飞行的大部分的时候，平尾相对气流处于负迎角，专门产生可控的向下力。据此考试可以判断，本题题干中的“平尾升力”指的是为负值的时候）","tags":[],"bankId":"uav-selected"},{"id":"sel-0439","type":"single","difficulty":1,"stem":"飞机航向稳定性是指飞机受到扰动后（）。","options":[{"key":"A","text":"产生绕立轴转动，扰动消失后转角自动回到零"},{"key":"B","text":"产生绕立轴转动，扰动消失后自动回复原飞行姿态"},{"key":"C","text":"产生绕横轴转动，扰动消失后自动恢复原飞行姿态"}],"answer":"B","analysis":"提示：稳定性→“恢复原飞行姿态” 航向立，纵向横，横向纵\n解析：飞机的稳定性就是指飞机受到小扰动后，偏离原平衡状态，并在扰动消失后，自动恢复到原平衡状态的特性。 不管题目问的是横向、纵向还是航向，只要选项里出现 “自动恢复原飞行姿态”，就是正确答案。同时根据口诀“航向立，纵向横，横向纵”找到轴与对应的稳定性 本题航向立","tags":[],"bankId":"uav-selected"},{"id":"sel-0440","type":"single","difficulty":1,"stem":"飞机的横侧安定性有助于()。","options":[{"key":"A","text":"使机翼恢复到水平状态"},{"key":"B","text":"使飞机保持航向"},{"key":"C","text":"使飞机保持迎角"}],"answer":"A","analysis":"提示：横测安定，有助水平\n解析：飞机的横侧安定性有助于使机翼恢复到水平状态，即当飞机受到横侧扰动时，横侧安怫定性会使飞机趋于恢复原来的横侧平衡状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0441","type":"single","difficulty":1,"stem":"飞机焦点的位置()。","options":[{"key":"A","text":"随仰角变化而改变"},{"key":"B","text":"不随仰角变化而改变"},{"key":"C","text":"随滚转角变化而改变"}],"answer":"B","analysis":"提示：焦点和重心都不改\n解析：飞机焦点的位置不随仰角变化而改变。焦点位置是固定的，它决定了飞机在受到外力作用时的旋转中心。","tags":[],"bankId":"uav-selected"},{"id":"sel-0442","type":"single","difficulty":1,"stem":"飞机机翼的焦点指的是()。","options":[{"key":"A","text":"升力的着力点"},{"key":"B","text":"附加升力的着力点"},{"key":"C","text":"重力的着力点"}],"answer":"B","analysis":"提示：机翼焦点→附加升力着力点\n解析：飞机机翼的焦点是指附加升力的着力点。 它影响飞机的稳定性和操纵性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0443","type":"single","difficulty":1,"stem":"飞机上的总空气动力的作用线与飞机纵轴的交点称为()。","options":[{"key":"A","text":"全机重心"},{"key":"B","text":"全机的压力中心"},{"key":"C","text":"机体坐标的原点"}],"answer":"B","analysis":"提示：动力找压力\n解析：飞机上的总空气动力的作用线与飞机纵轴的交点称为全机的压力中心，直接关系到飞机的稳定性和操纵性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0444","type":"single","difficulty":1,"stem":"下列说法错误的是()。","options":[{"key":"A","text":"裕度越大，稳定性就越强"},{"key":"B","text":"重心的移动不会改变静稳定裕度"},{"key":"C","text":"配重的任何变化都将需要新的升降舵配平以维持水平飞行"}],"answer":"B","analysis":"提示：重心改变影响静稳定裕度\n解析：静稳定裕度与重心的位置密切相关。直接带来2个知识点：1.重心的移动必然改变静稳定裕度2.任何配重变化都必然影响重心，必然需要新的升降舵配平以维持水平飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0445","type":"single","difficulty":1,"stem":"多旋翼飞行器在没有发生机械结构改变的前提下，如发生漂移，不能直线飞行时，不需关注的是()。","options":[{"key":"A","text":"GPS定位"},{"key":"B","text":"指南针校准"},{"key":"C","text":"调整重心位置"}],"answer":"C","analysis":"提示：结构不变重心不变。不用调整\n解析：多旋翼飞行器在没有发生机械结构改变的前提下，如发生漂移，不能直线飞行时，不需关注的是调整重心位置。如果飞行器没有机械结构改变，重心位置通常是固定的且不是导致漂移的主要原因。此时更应关注 GPS 定位是否准确，以及指南针校准是否正确。","tags":[],"bankId":"uav-selected"},{"id":"sel-0446","type":"single","difficulty":1,"stem":"飞机的压力中心是()。","options":[{"key":"A","text":"压力最低的点"},{"key":"B","text":"压力最高的点"},{"key":"C","text":"升力的着力点"}],"answer":"C","analysis":"提示：有压力才有升的动力\n解析：飞机的压力中心是升力作用线上的一个点，是升力的着力点，对飞机的稳定性和操纵性有重要影响。","tags":[],"bankId":"uav-selected"},{"id":"sel-0447","type":"single","difficulty":1,"stem":"飞机迎角增大，压力中心的位置会（）。","options":[{"key":"A","text":"前移"},{"key":"B","text":"后移"},{"key":"C","text":"保持不变"}],"answer":"A","analysis":"提示：迎角增大，压力前移（大前小后）\n解析：飞机的迎角是指飞机机身与风向之间的夹角，也称为攻角。随着迎角的增大，飞机的气动中心(压力中心)会前移。","tags":[],"bankId":"uav-selected"},{"id":"sel-0448","type":"single","difficulty":1,"stem":"如果对称机翼相对来流仰头旋转了一个迎角，驻点()。","options":[{"key":"A","text":"稍稍向前缘的上表面移动"},{"key":"B","text":"稍稍向前缘的下表面移动"},{"key":"C","text":"不会移动"}],"answer":"B","analysis":"提示：飞机仰头， 气流从飞机下方比较容易通过\n解析：当对称机翼相对来流仰头旋转了一个迎角时，驻点会稍稍向前缘的下表面移动，这是因为气流在机翼上表面的流速增加，压力降低，导致驻点位置改变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0449","type":"single","difficulty":1,"stem":"在机翼上，驻点处是()。","options":[{"key":"A","text":"空气与前缘相遇的地方"},{"key":"B","text":"空气与后缘相遇的地方"},{"key":"C","text":"都不正确"}],"answer":"A","analysis":"提示：驻点在前缘\n解析：驻点是空气流过机翼时，首先与前缘相遇的地方。这是空气动力学中的一个基本概念。","tags":[],"bankId":"uav-selected"},{"id":"sel-0450","type":"single","difficulty":1,"stem":"常规布局飞机失速时，()。","options":[{"key":"A","text":"机翼向上的力和尾翼向下的力都降低"},{"key":"B","text":"机翼向上的力和尾翼向下的力都增加"},{"key":"C","text":"机翼向上的力和尾翼向下的力恒都为零"}],"answer":"A","analysis":"提示：失速，都降低\n解析：飞机失速时，气流分离，机翼向上的升力和尾翼向下的力都会降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0451","type":"single","difficulty":1,"stem":"对于带襟翼无人机，放下襟翼，飞机的失速速度将()。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"B","analysis":"提示：失速就是速度减少\n解析：放下襟翼增加升力系数，使得飞机能在更小的速度下保持飞行，即失速速度减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0452","type":"single","difficulty":1,"stem":"飞机发生螺旋现象的原因是()。","options":[{"key":"A","text":"飞行员方向舵操纵不当"},{"key":"B","text":"飞行员压杆过多"},{"key":"C","text":"飞机失速后机翼自转"}],"answer":"C","analysis":"提示：失速自转→螺旋\n解析：飞机发生螺旋现象的原因是飞机失速后机翼自转，导致飞机无法维持正常的飞行姿态和航向。","tags":[],"bankId":"uav-selected"},{"id":"sel-0453","type":"single","difficulty":1,"stem":"飞机失速的原因是（）。","options":[{"key":"A","text":"飞机速度太小"},{"key":"B","text":"飞机速度太大"},{"key":"C","text":"飞机迎角超过临界迎角"}],"answer":"C","analysis":"提示：失速，迎角>临界\n解析：飞机失速的原因是飞机迎角超过临界迎角，导致气流无法顺畅流过机翼，升力急剧下降，飞机无法维持正常飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0454","type":"single","difficulty":1,"stem":"飞机水平转弯，坡度增大，失速速度（）。","options":[{"key":"A","text":"减小"},{"key":"B","text":"保持不变，因为临界迎角不变"},{"key":"C","text":"增大"}],"answer":"C","analysis":"提示：坡度大，失速大\n解析：飞机水平转弯时，坡度增大导致升力水平分量增大，为维持升力平衡，迎角需增大，进而失速速度增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0455","type":"single","difficulty":1,"stem":"如飞机出现失速，飞行员应()。","options":[{"key":"A","text":"立即蹬舵"},{"key":"B","text":"立即推杆到底"},{"key":"C","text":"立即拉杆"}],"answer":"B","analysis":"提示：失速推杆到底\n解析：当飞机出现失速时，飞行员应立即推杆到底，减小迎角，恢复飞机的正常飞行状态。拉杆会增加迎角，加剧失速状况。","tags":[],"bankId":"uav-selected"},{"id":"sel-0456","type":"single","difficulty":1,"stem":"失速的直接原因是()。","options":[{"key":"A","text":"低速飞行"},{"key":"B","text":"高速飞行"},{"key":"C","text":"迎角过大"}],"answer":"C","analysis":"提示：失速迎角过大\n解析：失速的直接原因是迎角过大，当迎角超过临界迎角时，气流无法紧贴机翼上表面流过，导致升力急剧下降，飞机失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0457","type":"single","difficulty":1,"stem":"“失速”指的是()。","options":[{"key":"A","text":"飞机失去速度"},{"key":"B","text":"飞机速度太快"},{"key":"C","text":"飞机以大于临界迎角飞行"}],"answer":"C","analysis":"提示：大于迎角就失速\n解析：失速是指飞机在飞行过程中，当迎角超过临界迎角时，飞机的升力会突然下降，导致飞机无法维持正常飞行高度和速度的状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0458","type":"single","difficulty":1,"stem":"“失速迎角”就是“临界迎角”，指的是()。","options":[{"key":"A","text":"飞机飞的最高时的迎角"},{"key":"B","text":"飞机飞的最快时的迎角"},{"key":"C","text":"飞机升力系数最大时的迎角"}],"answer":"C","analysis":"提示：失速迎角升力最大\n解析：临界迎角是飞机在飞行中能够产生的最大升力系数所对应的迎角。当迎角超过这个值时，飞机的升力会突然下降，导致失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0459","type":"single","difficulty":1,"stem":"飞机在平飞时载重量越大其失速速度()。","options":[{"key":"A","text":"越大"},{"key":"B","text":"角越大"},{"key":"C","text":"与重量无关"}],"answer":"A","analysis":"提示：载重越大，失速越大\n解析：飞机平飞载重量越大，失速速度越大。因为重量增加需更大升力，对应更大速度才不失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0460","type":"single","difficulty":1,"stem":"飞机在飞行中出现的失速现象的原因是()。","options":[{"key":"A","text":"翼梢出现较强的旋涡，产生很大的诱导阻力"},{"key":"B","text":"由于迎角达到临界迎角，造成机翼 上表面附面层大部分分离"},{"key":"C","text":"由于机翼表面粗糙，使附面层由层流变为紊流"}],"answer":"B","analysis":"提示：失速迎角过大达到临界（失速找迎角，）\n解析：迎角达临界迎角会使机翼上表面附面层大部分分离，导致升力急剧下降，产生失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0461","type":"single","difficulty":1,"stem":"关于飞机失速下列说法哪些是正确的？","options":[{"key":"A","text":"飞机失速是通过加大发动机动力就可以克服的飞行障碍"},{"key":"B","text":"亚音速飞行只会出现大迎角失速"},{"key":"C","text":"在大迎角或高速飞行状态下都可能出现飞机失速现象"}],"answer":"C","analysis":"提示：都可能\n解析：飞机失速是一种复杂的飞行状态，不是仅靠加大发动机动力就能克服;亚音速飞行也会有多种失速情况;大迎角或高速飞行都可能出现失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0462","type":"single","difficulty":1,"stem":"（）下发动机处于小油门状态，或怠速甚至关机。","options":[{"key":"A","text":"俯冲状态"},{"key":"B","text":"爬升状态"},{"key":"C","text":"滑翔状态"}],"answer":"C","analysis":"提示：滑翔等于滑行挂空挡--省油\n解析：滑翔状态下，发动机通常处于小油门、怠速或关机状态，以节省燃料或进行特定飞行动作。","tags":[],"bankId":"uav-selected"},{"id":"sel-0463","type":"single","difficulty":1,"stem":"下列哪种方式有可能提高多旋翼飞行器的载重?","options":[{"key":"A","text":"桨叶直径不变，电机功率变小且桨叶总距变小"},{"key":"B","text":"桨叶总距不变，电机功率变大且桨叶直径变大"},{"key":"C","text":"电机功率不变，桨叶直径变大且桨叶总距变大"}],"answer":"B","analysis":"提示：载重要提高，电机功率不能减少或不变。\n解析：多旋翼的载重能力，核心取决于旋翼能产生的升力大小，升力越大，载重能力越强。而升力的提升需要「电机能提供足够的动力」+「桨叶能把动力转化为更多升力」单纯的说，电机功率增大、桨叶直径增大、桨叶总距增大，都能提升升力，但是要动力与桨叶相配合。（简单可以理解为，电机与桨叶 要大一起大 才能起到效果）A 选项：电机功率不变，相当于动力的上限固定了，这时候单纯的桨叶直径变大以及总距变大，会让电机的负载超过它能承受的上限，电机转不动或者转速下降，升力反而会降低。B 选项：桨叶总距不变，电机功率变大+ 桨叶直径变大，这两个变化是互相配合的，动力足够的同时，桨叶能把动力转化为更多升力，所以可以提升载重C 选项：电机功率变小+ 桨叶总距变小，这两个变化都会让升力降低，载重能力只会下降","tags":[],"bankId":"uav-selected"},{"id":"sel-0464","type":"single","difficulty":1,"stem":"飞机转弯的向心力是()。","options":[{"key":"A","text":"飞机的拉力"},{"key":"B","text":"方向舵上产生的气动力"},{"key":"C","text":"飞机升力的水平分力"}],"answer":"C","analysis":"提示：飞机转弯，都是升力\n解析：飞机转弯的向心力主要由飞机升力的水平分力提供，它使飞机能够沿着转弯轨迹运动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0465","type":"single","difficulty":1,"stem":"飞机转弯时，坡度有继续增大的倾向，原因是()。","options":[{"key":"A","text":"转弯外侧阻力比内侧的大"},{"key":"B","text":"转弯外侧升力比内侧的大"},{"key":"C","text":"转弯外侧阻力比内侧的小"}],"answer":"B","analysis":"提示：飞机转弯，大外升\n解析：飞机转弯时，由于外侧机翼的迎角相对增大，导致转弯外侧升力比内侧的大，因此坡度有继续增大的倾向。","tags":[],"bankId":"uav-selected"},{"id":"sel-0466","type":"single","difficulty":1,"stem":"飞机转弯时，为保持高度需要增大迎角，原因是()。","options":[{"key":"A","text":"保持升力垂直分量不变"},{"key":"B","text":"用以使机头沿转弯方向转动"},{"key":"C","text":"保持升力水平分量不变"}],"answer":"A","analysis":"提示：高度垂直，方向水平\n解析：飞机转弯时，为保持高度需要增大迎角，以保持升力垂直分量不变，从而抵消重力，维持飞行高度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0467","type":"single","difficulty":1,"stem":"偏转副翼使飞机右转弯时，为修正逆偏转的影响，应()。","options":[{"key":"A","text":"向左偏转方向舵"},{"key":"B","text":"向右偏转方向舵"},{"key":"C","text":"向左压杆"}],"answer":"B","analysis":"提示：左转配左舵，右转配右舵\n解析：使用副翼使飞机向右滚转时，右副翼上偏、左副翼下偏，左机翼升力和阻力增大。阻力差使飞机产生向左的逆偏航，即机头向左、机尾向右。为修正逆偏航，应向右蹬方向舵，使机头向右、机尾向左，抵消阻力差造成的左偏航，实现协调转弯。","tags":[],"bankId":"uav-selected"},{"id":"sel-0468","type":"single","difficulty":1,"stem":"偏转副翼使飞机转弯时，两翼的阻力是()。","options":[{"key":"A","text":"内侧机翼阻力大"},{"key":"B","text":"外侧机翼阻力大"},{"key":"C","text":"相等"}],"answer":"B","analysis":"提示：外侧机翼阻力大\n解析：偏转副翼使飞机转弯时，外侧机翼的副翼向下偏，机翼有效弯度、局部迎角增大，升力更大，诱导阻力随之增大，同时阻力也更大；内侧机翼的副翼向上偏，机翼有效弯度、局部迎角减小，升力下降，诱导阻力相应减小，同时阻力也减小。所以，升力和阻力，都是外大内小因此外侧机翼总阻力大于内侧机翼，进而产生逆偏航。（依据：FAA《飞行员航空知识手册》第六章 飞行操纵：由于向下偏转的副翼会产生更多升力，它也会产生更多阻力。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0469","type":"single","difficulty":1,"stem":"《一般运行和飞行规则》的颁布目的是：①为了维护国家领空主权②为了规范民用航空器的运行③保证飞行的正常与安全","options":[{"key":"A","text":"①②③"},{"key":"B","text":"②③"},{"key":"C","text":"①②"}],"answer":"B","analysis":"提示：①是航空法，只选②③\n解析：《一般运行和飞行规则》第91.1条:目的和依据。为了规范民用航空器的运行，保证飞行的正常与安全。①为了维护国家领空主权是迷惑选项，是《中华人民共和国民用航空法》、《中华人民共和国飞行基本规则》与《中华人民共和国国家安全法》颁布的目的。","tags":[],"bankId":"uav-selected"},{"id":"sel-0470","type":"single","difficulty":1,"stem":"电子围栏功能包括：①阻挡即将侵入该地区的航空器；②阻挡即将离开该地区的航空器；③报警功能","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②"},{"key":"C","text":"①③"}],"answer":"C","analysis":"提示：主要为①③，管进不管出\n解析：根据2015年12月发布的《轻小无人机运行规定（试行）》3.17无人机云系统对侵入电子围栏的无人机具有报警功能。 3.18 电子围栏，是指为阻挡即将侵入特定区域的航空器，在 相应电子地理范围中画出特定区域，并配合飞行控制系统、 保障区域安全的软硬件系统。","tags":[],"bankId":"uav-selected"},{"id":"sel-0471","type":"single","difficulty":1,"stem":"颁发国内三个层次航空法规的部门分别是:①全国人大或全国人大常委会;②国务院、中央军委;③民航局;④民航地区管理局。","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②④"},{"key":"C","text":"③④"}],"answer":"A","analysis":"提示：没有④（④只管理不颁发）\n解析：颁发国内三个层次航空法规的部门分别是①全国人大或全国人大常委会;②)国务院、中央军委;③民航局。全国人大或全国人大常委会制定的是法律层面的航空法规。国务院、中央军委制定的是行政法规和规章， 民航局制定的是部门规章和规范性文件等民航地区管理局一般是依据上述部门制定的法规进行具体的管理和执行工作，而不是直接颁发航空法规。","tags":[],"bankId":"uav-selected"},{"id":"sel-0472","type":"single","difficulty":1,"stem":"X模式6轴飞行器从悬停转换到向左平移，哪侧轴需要减速?","options":[{"key":"A","text":"横轴右侧"},{"key":"B","text":"纵轴左侧"},{"key":"C","text":"横轴左侧"}],"answer":"B","analysis":"提示：6悬左→纵左\n解析：在X模式中，要实现向左平移，左侧的两个轴需要减速，右侧的两个轴加速，从而产生向左的推力，使飞行器向左移动。（中间 2 个旋翼是 “左右对称中心”，纯升力补充，在左右平移时无需变化。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0473","type":"single","difficulty":1,"stem":"无人机的回收方式可归纳为伞降回收空中回收起落架轮式着陆拦阻网回收气垫着陆和垂直着陆等类型。下列说法错误的是（）。","options":[{"key":"A","text":"空中回收，在大飞机上必须有空中回收系统，在无人机上除了有阻力伞和主伞之外，还需有钩挂伞、吊索和可旋转的脱落结构"},{"key":"B","text":"起落架轮式着陆，有些无人机的起落架局部被设计成较坚固"},{"key":"C","text":"用拦截网系统回收无人机是目前世界小型无人机较普遍采用的回收方式之一"}],"answer":"B","analysis":"提示：起落架较坚固×\n解析：B选项写反了，起落架轮式着陆，有些无人机的起落架局部被设计成“较脆弱的结构”,允许着陆时撞地损坏,吸收能量。","tags":[],"bankId":"uav-selected"},{"id":"sel-0474","type":"single","difficulty":1,"stem":"无人机的发射方式可归纳为手抛发射、零长发射、弹射发射、起落架滑跑起飞、母机空中发射、容器式发射装置发射和垂直起飞等类型。下列说法正确的是（ ）。","options":[{"key":"A","text":"在地面发射时，无人机使用较为广泛的发射方式是母机空中发射与零长发射"},{"key":"B","text":"无人机安装在轨道式发射装置上，在压缩空气、橡筋或液压等弹射装置作用下起飞，无人机飞离发射装置后，在辅助发动机作用下完成飞行任务"},{"key":"C","text":"容器式发射装置是一种封闭式发射装置，兼备发射与贮存无人机功能。它有单室式和多室式两种类型"}],"answer":"C","analysis":"提示：容器式发射装置√\n解析：在地面发射时,无人机使用较为广泛的发射方式是零长发射与弹射发射方式。无人机安装在轨道式发射装置上,在压缩空气、橡皮筋或液压等弹射装置作用下起飞,无人机飞离发射装置后,在主发动机作用下完成飞行任务。","tags":[],"bankId":"uav-selected"},{"id":"sel-0475","type":"single","difficulty":1,"stem":"（）是在无人机具有姿态稳定控制机构的基础上，通过操纵杆控制无人机的俯仰角、滚转角和偏航角，从而改变无人机的运动。","options":[{"key":"A","text":"指令控制"},{"key":"B","text":"舵面遥控"},{"key":"C","text":"姿态遥控"}],"answer":"C","analysis":"提示：各种角→姿态控制\n解析：该控制方式的核心是直接操纵无人机的姿态角（俯仰、滚转、偏航），并依赖其自身的姿态稳定机构维持姿态，最终实现运动状态的改变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0476","type":"single","difficulty":1,"stem":"关于部分多旋翼飞行器，机臂上反角设计描述错误的是（）。","options":[{"key":"A","text":"提高稳定性"},{"key":"B","text":"提高机动性"},{"key":"C","text":"提高载荷作业空间"}],"answer":"B","analysis":"提示：选错的。上反角→机动性×\n解析：机臂上反角设计的核心价值在于优化飞行稳定性和作业实用性，而非增强机动性，这一设计的功能逻辑与机动性提升存在直接冲突。","tags":[],"bankId":"uav-selected"},{"id":"sel-0477","type":"single","difficulty":1,"stem":"关于桨叶的剖面形状说法错误的是（）。","options":[{"key":"A","text":"桨叶的剖面形状为桨叶翼型"},{"key":"B","text":"一般用相对厚度、最大厚度位置、相对弯度、最大弯度位置等参数来说明桨叶翼型"},{"key":"C","text":"桨叶翼型常见的有平凸型、双凸型和非对称型"}],"answer":"C","analysis":"提示：选错的。凸×\n解析：桨叶翼型常见的有平凸型、双凸型等，但平凸型和双凸型本质上都属于非对称翼型，因此将“非对称型”与平凸型和双凸型并列是不准确的。","tags":[],"bankId":"uav-selected"},{"id":"sel-0478","type":"single","difficulty":1,"stem":"下列说法错误的是(没有提到的条件则视为相同)？","options":[{"key":"A","text":"旋翼直径越大则桨盘载荷越小"},{"key":"B","text":"旋翼直径越大则悬停诱导速度越大"},{"key":"C","text":"旋翼直径越大则拉力越大"}],"answer":"B","analysis":"提示：选错的。直径大诱导大×\n解析：悬停诱导速度与旋翼直径成反比。 直径越大，气流在桨盘处的加速越平缓，诱导速度越小。 (知识点来自蓝皮书-8.1.2旋翼带尾桨无人直升机:大的旋翼直径可以有效地提高旋翼拉力,因为旋翼拉力同旋翼半径的四次方成正比。旋翼直径大,则旋翼的桨盘载荷小,悬停诱导速度就小,这样可以有效地降低旋翼诱阻功率)","tags":[],"bankId":"uav-selected"},{"id":"sel-0479","type":"single","difficulty":1,"stem":"四轴飞行器如何实现控制？","options":[{"key":"A","text":"通过调整不同旋翼之间的总距"},{"key":"B","text":"通过调整不同旋翼之间倾斜角度"},{"key":"C","text":"通过调整不同旋翼之间相对转速"}],"answer":"C","analysis":"提示：4轴控制→转速\n解析：四轴飞行器通过改变四个电机的转速来改变旋翼转速 ，实现升力的变化 ，从而控制飞行器姿态的姿态和位置。直升机是改变尾桨的桨距，固定翼是靠偏转舵面。","tags":[],"bankId":"uav-selected"},{"id":"sel-0480","type":"single","difficulty":1,"stem":"为了解决大速度下空气压缩性的影响和噪音问题，可以对桨叶进行何种处理（）？","options":[{"key":"A","text":"采用矩形桨叶"},{"key":"B","text":"把桨叶尖部做成后掠形"},{"key":"C","text":"采用尖削桨叶"}],"answer":"B","analysis":"提示：后掠减噪音\n解析：大速度飞行时，桨叶尖部容易先达到音速，引发空气压缩性效应和强烈噪音。后掠形设计能有效延迟尖部气流达到音速的时间，可有效减少涡流和噪音。","tags":[],"bankId":"uav-selected"},{"id":"sel-0481","type":"single","difficulty":1,"stem":"发动机火花塞出现问题，会（）。","options":[{"key":"A","text":"无法启动"},{"key":"B","text":"突然熄火"},{"key":"C","text":"以上都有可能"}],"answer":"C","analysis":"提示：火花塞问题都有可能\n解析：火花塞是点火系统核心部件，故障会直接影响点火效果。严重积碳、电极过度磨损等会使其无法产生足够电火花，致发动机无法启动；运行中突然失效，如内部线路断裂，也可能引发突然熄火。","tags":[],"bankId":"uav-selected"},{"id":"sel-0482","type":"single","difficulty":1,"stem":"一般来说，油动民用无人机与电动民用无人机在冬天飞行（）。","options":[{"key":"A","text":"油动航时比夏天长、电动航时比夏天短"},{"key":"B","text":"油动航时比夏天短、电动航时比夏天长"},{"key":"C","text":"油动航时比夏天长、电动航时也比夏天长"}],"answer":"A","analysis":"提示：油动冬天长，电动夏天长\n解析：油动无人机冬季航时更长：低温环境下，空气密度更高，燃油燃烧时能获得更多氧气，燃烧效率提升；发动机在低温下散热更快，不易因过热导致功率下降，动力输出更稳定，间接延长了有效航时。电动无人机夏季航时更长：核心限制来自锂电池，低温会显著降低其活性，导致充放电效率下降，实际可用容量减少；电池在低温下内阻增大，能量损耗加快，即使满电，也难以支撑与夏季相同的飞行时长。","tags":[],"bankId":"uav-selected"},{"id":"sel-0483","type":"single","difficulty":1,"stem":"多旋翼飞行器的螺旋桨（）。","options":[{"key":"A","text":"桨根处角速度等于桨尖处角速度"},{"key":"B","text":"桨根处线速度大于桨尖处线速度"},{"key":"C","text":"桨根处升力系数小于桨尖处升力系数"}],"answer":"A","analysis":"提示：半径↑角速度相同 线速度↑升力系数↓\n解析：螺旋桨作为刚性整体，绕中心轴同步旋转，各点的角速度（单位时间内转过的角度）完全相同，与该点到轴心的距离（半径）无关。这是刚性旋转体的基本物理属性。而线速度和升力系数则随半径变化。","tags":[],"bankId":"uav-selected"},{"id":"sel-0484","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的动力电池一般为（）。","options":[{"key":"A","text":"Li-po"},{"key":"B","text":"Ni-Cd"},{"key":"C","text":"Ni-MH"}],"answer":"A","analysis":"提示：Ni-MH\n解析：多旋翼飞行器使用的动力电池一般为锂聚合物电池(Li-po)。锂聚合物电池作为锂离子电池的一种变种，具有更高的能量密度和更轻的重量，非常适合用于多旋翼飞行器等需要高性能电池的应用场景。","tags":[],"bankId":"uav-selected"},{"id":"sel-0485","type":"single","difficulty":1,"stem":"聚合物锂电池单体充满电后的电压一般为（）。","options":[{"key":"A","text":"4
