bankId":"uav-theory"},{"id":"thc-0560","type":"single","difficulty":1,"stem":"飞行中的多旋翼飞行器所承受的力和力矩不包括（）。","options":[{"key":"A","text":"旋翼诱导阻力"},{"key":"B","text":"旋翼桨叶的摆振力矩"},{"key":"C","text":"旋翼的反扭矩和桨毂力矩"}],"answer":"B","analysis":"提示：选错的。摆振力矩×\n解析：常规多旋翼桨叶通常没有传统直升机旋翼的摆振铰链，因此不涉及摆振铰链处的力矩。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0561","type":"single","difficulty":1,"stem":"关于旋翼的反扭矩说法正确的是( )。","options":[{"key":"A","text":"旋翼的反扭矩会迫使直升机向旋翼旋转的反方向偏转"},{"key":"B","text":"旋翼反扭矩的大小取决于发动机最大功率的大小"},{"key":"C","text":"发动机带动旋翼旋转时，旋翼诱导阻力力矩为发动机传递给旋翼轴的扭矩所平衡"}],"answer":"A","analysis":"提示：反扭矩反方向偏转（反反）\n解析：根据牛顿第三定律，发动机驱动旋翼旋转时，旋翼会产生反向的反扭矩。该反扭矩作用于机身，会迫使直升机向旋翼旋转的反方向偏转，这也是直升机需设计尾桨（或共轴反桨）来抵消反扭矩的核心原因。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0562","type":"single","difficulty":1,"stem":"螺旋桨叶本身是扭转的，因此桨叶角从毂轴到叶尖是变化的。最大安装角或者最大桨距在（）。","options":[{"key":"A","text":"毂轴处"},{"key":"B","text":"叶尖处"},{"key":"C","text":"桨叶中部"}],"answer":"A","analysis":"提示：最大桨距毂轴处\n解析：螺旋桨设计为扭转形态，核心是平衡不同位置升力。其安装角（桨距）分布与线速度相反：毂轴（桨根）半径最小，旋转线速度最低，需最大安装角来增大迎角，弥补线速度不足以产生足够升力；叶尖半径最大、线速度最高，安装角需最小，避免气流分离；中部安装角介于两者间。因此最大安装角在毂轴处。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0563","type":"single","difficulty":1,"stem":"民用无人机运行多处于低空速环境下，主要受到的阻力有:①摩擦阻力、②循环阻力、③干扰阻力、④激波阻力、⑤诱导阻力、⑥压差阻力","options":[{"key":"A","text":"①②③④"},{"key":"B","text":"①②⑤⑥"},{"key":"C","text":"①③⑤⑥"}],"answer":"C","analysis":"提示：循环阻力×激波阻力× 1356\n解析：航空领域核心阻力仅分为摩擦阻力、干扰阻力、诱导阻力、压差阻力、激波阻力五类，“循环阻力” 并非标准分类，属于陷阱选项，直接排除；“激波阻力”是 “高速专属”，低空低速场景直接排除，答案只能是①③⑤⑥","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0564","type":"single","difficulty":1,"stem":"根据无人机行业习惯，通常定义右旋前进的螺旋桨为（）。","options":[{"key":"A","text":"拉桨"},{"key":"B","text":"正桨"},{"key":"C","text":"反桨"}],"answer":"B","analysis":"提示：右旋前进→正桨\n解析：根据孙毅 主编的《无人机驾驶员航空知识手册》2.1.2.5螺旋桨1.定距螺旋桨：根据无人机行业习惯,通常定义右旋前进的螺旋桨为正桨,左旋前进的螺旋桨为反桨。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0565","type":"single","difficulty":1,"stem":"高海拔地区，以下哪个尺寸的螺旋桨更适用?","options":[{"key":"A","text":"1835"},{"key":"B","text":"1855"},{"key":"C","text":"1035"}],"answer":"A","analysis":"提示：高海拔1835\n解析：在高海拔下，选择高KV、大直径小螺距的螺旋桨及电机配置可以有效地提高飞行器的航时和载重能力，使其能够在恶劣的环境条件下稳定运行。根据前桨径后螺距的原则，后边先选一个小螺距35，同样的螺距，选大直径18，最后确定1835","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0566","type":"single","difficulty":1,"stem":"高海拔地区，以下哪个尺寸的螺旋桨更适用?","options":[{"key":"A","text":"1835"},{"key":"B","text":"1855"},{"key":"C","text":"1035"}],"answer":"A","analysis":"提示：高海拔1835\n解析：在高海拔下，选择高KV、大直径小螺距的螺旋桨及电机配置可以有效地提高飞行器的航时和载重能力，使其能够在恶劣的环境条件下稳定运行。根据前桨径后螺距的原则，后边先选一个小螺距35，同样的螺距，选大直径18，最后确定1835","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0567","type":"single","difficulty":1,"stem":"外转子电机规格2208、9T、KV1000分别代表什么含义?","options":[{"key":"A","text":"定子线圈直径22英寸，定子线圈高度8英寸，每分钟转速为1000转"},{"key":"B","text":"定子线圈直径22英寸，定子线圈高度8英寸，每伏特电压能达到的每分钟转速为1000转"},{"key":"C","text":"定子线圈直径22毫米，定子线圈高度8毫米，每伏特电压能达到的每分钟转速为1000转"}],"answer":"C","analysis":"提示：电机毫米，螺旋桨英寸\n解析：2208通常表示电机定子直径为22毫米、定子高度为8毫米；9T表示电机绕组为9匝；KV1000表示电机在空载状态下，每伏电压对应的理论转速约为1000转/分钟。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0568","type":"single","difficulty":1,"stem":"某多旋翼动力电池容量为8000mAh(8Ah)，表示()。","options":[{"key":"A","text":"理论上，以8A电流放电，可放电1小时"},{"key":"B","text":"理论上，以80A电流放电，可放电1小时"},{"key":"C","text":"理论上，以8000A电流放电，可放电1小时"}],"answer":"A","analysis":"提示：1A=1000mA\n解析：1Ah=1000mAh，8000mAh的电池容量等于8Ah，以8A电流放电，可放电1小时。理论放电时间可按下式计算：t=电池容量（Ah）/ 放电电流（A）以题干中电池容量 8000mAh=8Ah 放电：t=电池容量（Ah）/ 放电电流（A）= 8Ah / 8A=1h","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0569","type":"single","difficulty":1,"stem":"以下哪个是小型电动无人机常用的动力电池类型？","options":[{"key":"A","text":"Li-Po"},{"key":"B","text":"Ni-MH"},{"key":"C","text":"Ni-Cd"}],"answer":"A","analysis":"提示：锂电池最常用\n解析：小型电动无人机对电池的重量和输出功率要求较高。Li-Po 电池具有质量轻、能量密度高、放电倍率大、单体电压高等特点，能够为电机提供较大的瞬时电流。Ni-MH 和 Ni-Cd 同容量下通常更重、能量密度较低，其中 Ni-Cd 还有明显的记忆效应和镉污染问题。 因此，小型电动无人机通常使用 Li-Po 电池。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0570","type":"single","difficulty":1,"stem":"以下哪个是小型电动无人机常用的动力电池类型？","options":[{"key":"A","text":"银锌电池"},{"key":"B","text":"锂电池"},{"key":"C","text":"铅酸电池"}],"answer":"B","analysis":"提示：铅酸电池\n解析：小型电动无人机对电池的重量和输出功率要求较高。锂电池具有质量轻、能量密度高、放电倍率大、单体电压高等特点，能够为电机提供较大的瞬时电流。银锌电池成本较高，铅酸电池重量较大，通常不适合作为小型无人机的动力电池。 因此，小型电动无人机通常使用锂电池。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0571","type":"single","difficulty":1,"stem":"以下电池类型中，记忆效应最强的是（）。","options":[{"key":"A","text":"锂电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"镍氢电池"}],"answer":"B","analysis":"提示：记忆效应镍镉\n解析：镍镉电池具有较明显的记忆效应。如果经常在电量未完全释放时充电，可能出现可用容量降低的现象。 锂电池没有记忆效应。镍氢电池也可能出现较轻微的类似现象，但远弱于镍镉电池。","tags":[],"chapter":"多旋翼","bankId":"uav-theory"},{"id":"thc-0572","type":"single","difficulty":1,"stem":"航空器起飞着陆时使用跑道主要取决于（）。","options":[{"key":"A","text":"地面风向风速"},{"key":"B","text":"机型"},{"key":"C","text":"进场航迹与跑道中心延长线夹角大小"}],"answer":"A","analysis":"提示：起飞着陆 要看风\n解析：航空器起飞着陆时使用跑道主要取决于地面风向风速。逆风有助于增加飞机的升力，缩短滑跑距离，所以通常会选择逆风的跑道起降","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0573","type":"single","difficulty":1,"stem":"向逼近的冷锋飞行时（）。","options":[{"key":"A","text":"云层从低空分散逐渐向高空分散变化，大气压力不断升高"},{"key":"B","text":"云层从高空分散逐渐向低空分散变化，大气压力不断升高"},{"key":"C","text":"云层从高空分散逐渐向低空分散变化，大气压力不断下降"}],"answer":"C","analysis":"提示：冷锋双低\n解析：背景知识点：北半球中纬度日常飞行中，带来云、降水、颠簸等明显天气的地面冷锋、暖锋，位于地面低压槽线处。“向逼近的冷锋飞行” = 向低压槽飞行，所以气压才会不断下降飞机飞越槽线（冷锋锋面）后，进入锋后冷气团区域，气压迅速回升（鼠鼠老师的话：本题难点：选项中的气压与冷锋后的冷气团“气压高”无关冷气团冷、密度大，所以锋后冷气团区域气压偏高，但这是槽线后方的特征；槽线本身是环流形成的气压低值区，二者不冲突。）","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0574","type":"single","difficulty":1,"stem":"多旋翼飞行器正常作业受自然环境影响的主要因素是（）。","options":[{"key":"A","text":"地表是否凹凸平坦"},{"key":"B","text":"风向"},{"key":"C","text":"温度、风力"}],"answer":"C","analysis":"提示：影响主因→风力温度\n解析：多旋翼飞行器正常作业受自然环境影响的主要因素是温度、风力。 温度会影响多旋翼飞行器的电池性能、电子设备的工作稳定性等。在高温环境下，电池性能可能下降，续航时间缩短，同时电子设备也可能因过热出现故障;在低温环境下，电池的放电能力会降低，也会影响飞行器的性能。 风力对多旋翼飞行器的影响较大。强风可能使飞行器难以稳定飞行，增加操控难度，甚至可能将飞行器吹离预定航线或导致失 控。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0575","type":"single","difficulty":1,"stem":"一般来讲，多旋翼飞行器在地面风速大于（）时作业，会对飞行器安全和拍摄稳定有影响。","options":[{"key":"A","text":"2级"},{"key":"B","text":"4级"},{"key":"C","text":"6级"}],"answer":"B","analysis":"提示：4级风\n解析：地面风速大于4级时，风对多旋翼的姿态保持和画面稳定可能产生明显影响。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0576","type":"single","difficulty":1,"stem":"进气道结冰将导致危险的后果，下列描述不正确的是？","options":[{"key":"A","text":"冰屑脱离，进入压气机，而造成压气机的机械损伤"},{"key":"B","text":"结冰堵塞进气道，使得进入压气机的气流明显减少，导致发动机富油停车"},{"key":"C","text":"使进气速度场分布不均匀和使气流发生局部分离，引起压气机叶片的振动"}],"answer":"B","analysis":"提示：选错的。富油\n解析：进气道结冰会导致危险的后果，包括使进气速度场分布不均匀、气流局部分离、压气机叶片振动以及冰屑脱离进入压气机造成机械损伤。但结冰不会堵塞进气道导致发动机富油停车。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0577","type":"single","difficulty":1,"stem":"下面大气分层的主要依据哪个是正确的？","options":[{"key":"A","text":"气层中风的垂直变化特点"},{"key":"B","text":"气层气温的垂直分布特点"},{"key":"C","text":"气层气压的垂直分布特点"}],"answer":"B","analysis":"提示：大气分层→气层气温\n解析：大气分层的主要依据是气层气温的垂直分布特点。不同的大气层(如对流层、平流层、中间层等)具有不同的气温垂直分布特征，这是划分它们的主要标准。气压和风的垂直变化也是重要特征，但不是主要分层依据。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0578","type":"single","difficulty":1,"stem":"以下哪种不是卫星云图种类？","options":[{"key":"A","text":"可见光卫星云图"},{"key":"B","text":"多光谱卫星云图"},{"key":"C","text":"红外卫星云图"}],"answer":"B","analysis":"提示：选错的。类似：红外可见，无光谱\n解析：卫星云图主要分为红外卫星云图和可见光卫星云图。红外卫星云图主要显示云顶的温度信息，而可见光卫星云图则显示云的反射率。多光谱卫星云图不是标准的卫星云图分类，它可能指的是结合了多种光谱信息的卫星图像，但在气象学中，通常不将其单独作为一类卫星云图。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0579","type":"single","difficulty":1,"stem":"在下述各类飞机积冰中，对飞行影响最大的是（）。","options":[{"key":"A","text":"明冰和毛冰"},{"key":"B","text":"毛冰和霜"},{"key":"C","text":"雾凇和毛冰"}],"answer":"A","analysis":"提示：双冰冰冰\n解析：在飞机积冰中，明冰和毛冰对飞行的影响最大。明冰表面光滑，不易脱落，对飞机的气动性能影响显著;毛冰则容易在飞机表面形成粗糙的冰层，同样会影响飞机的飞行性能。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0580","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是中云特征？","options":[{"key":"A","text":"在红外线云图上，中云呈深灰色，介于高低云之间的色调"},{"key":"B","text":"在可见光云图上，中云呈灰白色到白色，色调的差异判定云的厚度"},{"key":"C","text":"在卫星云图上，中云与天气系统相连，表现为大范围的带状、涡旋状、逗点状"}],"answer":"A","analysis":"提示：选错的。深灰色×\n解析：根据蓝皮书描述，“在红外线云图上，中云呈中等程度灰色”不是“深灰色”，所以A错了。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0581","type":"single","difficulty":1,"stem":"机场上吹东风时，飞机起飞着陆的最好方向应是（）。","options":[{"key":"A","text":"由东向西"},{"key":"B","text":"由西向东"},{"key":"C","text":"由北向南"}],"answer":"B","analysis":"提示：自西向东，逆风起降\n解析：机场上吹东风时，飞机起飞着陆的最好方向是由西向东，这样可以利用风的助力，减少起飞和着陆时的地速要求，提高安全性，","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0582","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是层云（雾）特征？","options":[{"key":"A","text":"在可见光云图上，层云（雾）表现为光滑均匀的云区"},{"key":"B","text":"在红外云图上，层云色调较亮，与地面色调相差较大"},{"key":"C","text":"层云（雾）边界整齐清楚，与山脉、河流、海岸线走向相一致"}],"answer":"B","analysis":"提示：选错的。相差较大×，没有（）×\n解析：层云(雾)在红外云图上通常与地面色调相差不大，因为其温度接近地面温度，且云层较薄。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0583","type":"single","difficulty":1,"stem":"飞行高度不同，飞机积冰频率也不同，以下正确的是（）。","options":[{"key":"A","text":"冬季在3000米以上各高度上飞行时，积冰几乎占56%"},{"key":"B","text":"在6000米以上高度上飞行时，积冰占56%"},{"key":"C","text":"冬季在3000米以下各高度上飞行时，积冰几乎占56%"}],"answer":"C","analysis":"提示：积冰3000下\n解析：冬季在3000米以下各高度上飞行时，积冰几乎占56%。这是因为在这个高度范围内温度较低且存在大量过冷水滴，容易导致飞机积冰。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0584","type":"single","difficulty":1,"stem":"对流层中，按气流和天气现象分布的特点，可分为下、中、上三个层次，代表对流层中层气流的基本趋势是（）。","options":[{"key":"A","text":"气流相对平稳"},{"key":"B","text":"水汽含量很少"},{"key":"C","text":"气流混乱"}],"answer":"A","analysis":"提示：中层稳定\n解析：对流层中层气流相对平稳，这是对流层中层气流的基本趋势。在对流层中，下层气流混乱，上层水汽含量少，而中层则相对平稳。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0585","type":"single","difficulty":1,"stem":"山地对风的影响，以下描述错误的是（）。","options":[{"key":"A","text":"山体本身的障碍影响，使气流被阻滞不前"},{"key":"B","text":"一般山底和峡谷风口的风速增大"},{"key":"C","text":"一般山顶和峡谷风口的风速增大"}],"answer":"B","analysis":"提示：选错误。山底风速比较平稳，不增大\n解析：山地对风的影响主要表现在山体本身的障碍作用，使气流被阻滞不前，同时山顶和峡谷风口的风速通常更大。而山底由于地形的阻挡，风速通常会减小，而不是增大。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0586","type":"single","difficulty":1,"stem":"航路天气预报通常在起飞前几小时，由飞航站气象台向机组提供？","options":[{"key":"A","text":"2小时"},{"key":"B","text":"3小时"},{"key":"C","text":"1小时"}],"answer":"C","analysis":"提示：越新鲜越好，久了不具参考性，选最短\n解析：航路天气预报通常在起飞前1小时由飞航站气象台向机组提供，以确保机组有足够的时间了解飞行路线上的天气状况，做出必要的飞行准备。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0587","type":"single","difficulty":1,"stem":"雷暴到达成熟阶段以后，随着积雨云中迅速下沉的冷空气到达地面后，风向突转，风力迅速增大，阵风风速常在（）。","options":[{"key":"A","text":"30m/s"},{"key":"B","text":"10m/s"},{"key":"C","text":"20m/s"}],"answer":"C","analysis":"提示：雷暴20\n解析：雷暴处于发展阶段时,地面风很小;雷暴到达成熟阶段以后,随着积雨云中迅速下沉的冷空气到达地面后,风向突转,风力迅速增大,阵风风速常在20m/s,有时强烈的可以达到25m/s或以上,这种现象常常是雷雨即将来临的先兆;随着雷暴的远离,当地风力迅速减小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0588","type":"single","difficulty":1,"stem":"能见度，是反映大气透明度的一个指标，测量大气能见度的错误方法（）。","options":[{"key":"A","text":"使用大气透射仪"},{"key":"B","text":"使用激光能见度自动测量仪"},{"key":"C","text":"用望远镜目测"}],"answer":"C","analysis":"提示：选错的。目测直接看，不用望远镜\n解析：测量大气能见度的科学方法通常使用专业仪器，如大气透射仪或激光能见度自动测量仪。用望远镜目测是一种非标准、不准确的方法，因此是错误的。能见度，是反映大气透明度的一个指标。航空界定义为具有正常视力的人在当时的天气条件下能够看清楚日标轮廓的最大距离。测量大气能见度一般可用目测的方法，也可以使用大气透射仪、激光能见度自动测量仪等测量仪器测试。 （可直接目测，但人工目测一般是用肉眼识别已知距离的目标物，不是用望远镜。）","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0589","type":"single","difficulty":1,"stem":"机场上常用风向袋来估计风速，当风向袋吹平时，风速已达（）。","options":[{"key":"A","text":"6-10米/秒"},{"key":"B","text":"3-4米/秒"},{"key":"C","text":"20-26米/秒"}],"answer":"A","analysis":"提示：跟风速有关都选4级：4级风的风速范围为5.5-7.9米/秒\n解析：根据2015年中国民用航空局机场司发布的《风向标技术要求》4.7风向袋的展开：风向袋从进风口到尾端的锥形设计在风速为7.8m/s时应当能完全打开。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0590","type":"single","difficulty":1,"stem":"在山区飞行时应当注意，最强的乱流出现在（）。","options":[{"key":"A","text":"山谷中间"},{"key":"B","text":"山的背风坡"},{"key":"C","text":"山的迎风坡"}],"answer":"B","analysis":"提示：最强背风坡\n解析：在迎风坡：当气流遇到山脉阻挡时，会沿山坡被迫上升。抬升过程是持续的、受地形引导的，通常不会立即产生强烈乱流。在背风坡：越过山顶后，空气开始沿背风坡下降。由于空气在山顶附近经历剧烈垂直运动，可能形成湍流涡旋或重力波破碎。下降过程中，空气压缩增温，形成干热的“焚风”。乱流强烈会对飞行安全构成威胁。根据CAAC网站公布相关驾驶员执照理论考试学习资料，明确表示，乱流最强区域在背风区。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0591","type":"single","difficulty":1,"stem":"热雷暴的形成原因是（）。","options":[{"key":"A","text":"地面受热不均"},{"key":"B","text":"冷空气冲击暖空气而形成上升运动"},{"key":"C","text":"地面水汽蒸发"}],"answer":"A","analysis":"提示：热雷暴，受热不均\n解析：热雷暴的形成原因是地面受热不均。热雷暴常由夏季炎热的午后，地面强烈受热，使近地层大气被加热而形成不稳定的大气层结，从而产生强烈的上升气流，当上升气流中的水汽冷却凝结成云后，若水汽不断补充，强烈的上升气流可冲破稳定的云层形成热雷暴。地面水汽蒸发本身并不直接形成热雷暴;冷空气冲击暖空气形成的是锋面雷暴等，而非热雷暴。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0592","type":"single","difficulty":1,"stem":"对流层（）的空气运动受地形扰动和地表摩擦作用最大，气流混乱。","options":[{"key":"A","text":"下层"},{"key":"B","text":"中层"},{"key":"C","text":"上层"}],"answer":"A","analysis":"提示：下层与地表接触，有摩擦\n解析：对流层的下层越靠近地面，越容易受到地形起伏、建筑物、地表粗糙度和摩擦作用影响，因此空气运动最不规则，湍流和乱流也更明显。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0593","type":"single","difficulty":1,"stem":"雾通常发生在接近地面的空气温度冷却到空气的露点时，是从地表开始（）。","options":[{"key":"A","text":"50英尺内的云"},{"key":"B","text":"80英尺内的云"},{"key":"C","text":"100英尺内的云"}],"answer":"A","analysis":"提示：雾-50英尺的云\n解析：雾是从地表开始50ft（英尺）内的云。它通常发生在接近地面的空气温度冷却到空气的露点时。这时，空气中的水蒸气凝结，变成雾这种可见的形式。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0594","type":"single","difficulty":1,"stem":"和地面建筑物有关的湍流强度依赖于障碍物的大小和风的基本速度，在山地区域时这种情况甚至更加明显。风越过山脊时（）。","options":[{"key":"A","text":"风沿着迎风侧湍流逐渐增加"},{"key":"B","text":"风沿着迎风侧平稳地向上流动"},{"key":"C","text":"风沿着背风侧平稳地向下流动"}],"answer":"B","analysis":"提示：迎风而上\n解析：山脊的抬升作用，在迎风坡上，风速随高度的增加而增加风沿着迎风侧平稳地向上流动。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0595","type":"single","difficulty":1,"stem":"卫星云图主要可分为哪两类？","options":[{"key":"A","text":"红外云图和可见光卫星云图"},{"key":"B","text":"红外云图和色调强化卫星云图"},{"key":"C","text":"色调强化卫星云图和可见光卫星云图"}],"answer":"A","analysis":"提示：红外，可见光\n解析：卫星云图主要分为红外云图和可见光卫星云图。红外云图主要显示云顶的温度信息，而可见光卫星云图则显示云的反射率。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0596","type":"single","difficulty":1,"stem":"气温高低，如何影响飞机滑跑距离？","options":[{"key":"A","text":"气温低时，空气密度小，飞机增速快，飞机升力减小，起飞滑跑距离要长"},{"key":"B","text":"气温高时，空气密度大，飞机增速快，飞机升力增大，起飞滑跑距离要短"},{"key":"C","text":"气温高时，空气密度小，飞机增速慢，飞机的离地速度增大，起飞滑跑距离要长"}],"answer":"C","analysis":"提示：气温高，密度小，摩檫力小，滑跑距离长\n解析：气温高低对飞机滑跑距离的影响是，气温高时，空气密度小，飞机在跑道上增速慢达到离地速度所需的距离增大，因此起飞滑跑距离要长。反之，气温低时，滑跑距离缩短。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0597","type":"single","difficulty":1,"stem":"在卫星云图上，红外云图的色调取决于（）。","options":[{"key":"A","text":"目标的高低"},{"key":"B","text":"目标的温度"},{"key":"C","text":"目标反射太阳辐射的大小"}],"answer":"B","analysis":"提示：可见色调-辐射，红外色调-温度\n解析：红外云图是通过测量云顶辐射的红外能量来生成的，其色调主要取决于目标的温度。温度越高的云顶，在红外云图上呈现的颜色越亮。因此，红外云图的色调与目标的温度密切相关。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0598","type":"single","difficulty":1,"stem":"和地面建筑物有关的湍流强度依赖于（），这会影响任何飞机的起飞和着陆性能，也会引发非常严重的危险。","options":[{"key":"A","text":"障碍物的大小和风的基本方向"},{"key":"B","text":"障碍物的大小和风的基本速度"},{"key":"C","text":"障碍物的多少和风的基本速度"}],"answer":"B","analysis":"提示：大小速度\n解析：湍流强度与障碍物的大小和风的基本速度密切相关。障碍物越大，对风的阻碍作用越明显，产生的湍流越强;风的基本速度越快，湍流强度也越大。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0599","type":"single","difficulty":1,"stem":"一般而言，气团的垂直高度可达几公里到十几公里，常常从地面伸展到对流层顶，水平范围为（）。","options":[{"key":"A","text":"几公里到几百公里"},{"key":"B","text":"几十公里到几百公里"},{"key":"C","text":"几十公里到几千公里"}],"answer":"C","analysis":"提示：几十到几千\n解析：气团的水平范围通常较大，可以从几十公里扩展到几千公里，这取决于其形成的环境条件和移动路径。气团在垂直方向上可以从地面伸展到对流层顶，但在水平方向上其范围更为广泛。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0600","type":"single","difficulty":1,"stem":"风吹来时，那种局地风向不断改变，风速一阵大一阵小的现象称为（）。","options":[{"key":"A","text":"风切变"},{"key":"B","text":"风向不定"},{"key":"C","text":"风的阵性"}],"answer":"C","analysis":"提示：一阵大一阵小：阵风\n解析：风吹来时，局地风向不断改变，地面上障碍物会分散风的流向，产生会快速改变方向和速度的阵风，风速一阵大一阵小的现象称为风的阵性。这是风的一种特性，表现为风向和风速的不稳定变化。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0601","type":"single","difficulty":1,"stem":"在卫星云图上，可见光云图的色调取决于（）。","options":[{"key":"A","text":"目标的温度"},{"key":"B","text":"目标的高低"},{"key":"C","text":"目标反射太阳辐射的大小"}],"answer":"C","analysis":"提示：可见色调-辐射，红外色调-温度\n解析：可见光云图是通过测量云层反射的太阳光来生成的，因此其色调主要取决于目标反射太阳辐射的大小。反射的太阳辐射越多，云层在可见光云图上呈现的颜色越亮。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0602","type":"single","difficulty":1,"stem":"发生在低层的风切变严重影响航空器的起降，将发生在这一气层中的风切变称为低空风切变。低空风切变距地面一般约（）。","options":[{"key":"A","text":"小于1000米"},{"key":"B","text":"小于600米"},{"key":"C","text":"小于100米"}],"answer":"B","analysis":"提示：低空风切500（600） （有500选500 ，没有500选600）\n解析：发生在低层(距地面500m)的风切变严重影响航空器的起降,将发生在这一气层中的风切变称为低空风切变。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0603","type":"single","difficulty":1,"stem":"形成雷暴的基本条件是（）。","options":[{"key":"A","text":"浓积云，充足的水汽和锋区"},{"key":"B","text":"充足的水汽和上升运动"},{"key":"C","text":"充足的水汽、不稳定的大气和上升运动"}],"answer":"C","analysis":"提示：不稳定暴脾气\n解析：形成雷暴的基本条件是:1.深厚而明显的不稳定气层（提供能源）2.充沛的水汽（形成云体、释放潜热）3.足够的冲击力（促使空气上升）。这三个条件共同作用，使得水汽在上升过程中凝结、释放潜热，形成雷电和降水。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0604","type":"single","difficulty":1,"stem":"露点温度指空气在水汽含量和气压都不改变的条件下，冷却到饱和时的温度。形象地说，就是空气中的水蒸气变为露珠时候的温度叫露点温度。下述哪个正确？","options":[{"key":"A","text":"当空气中水汽已达到饱和时，气温与露点温度相同"},{"key":"B","text":"当水汽未达到饱和时，气温一定低于露点温度"},{"key":"C","text":"在100%的相对湿度时，周围环境的温度高于露点温度"}],"answer":"A","analysis":"提示：露点温度相同\n解析：露点温度是指空气在水汽含量和气压都不改变的条件下，冷却到饱和时的温度。当空气中水汽已达到饱和时，气温与露点温度相同，因为此时空气已经处于饱和状态，无法再容纳更多的水汽。当水汽未达到饱和时，气温高于露点温度。相对湿度越大，容纳的水汽就越少，周围环境的温度低于露点温度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0605","type":"single","difficulty":1,"stem":"32华氏度是0摄氏度，那么59华氏度是多少摄氏度？","options":[{"key":"A","text":"0摄氏度"},{"key":"B","text":"27摄氏度"},{"key":"C","text":"15摄氏度"}],"answer":"C","analysis":"提示：（59-32）*0.55=14.85 ，差不多对半\n解析：华氏度与摄氏度之间的转换公式为C=(F-32)*5/9。将59华氏度代入公式，得到C=(59-32)*5/9=15摄氏度。因此，59华氏度等于15摄氏度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0606","type":"single","difficulty":1,"stem":"起飞场地从北京移至拉萨，对哪类无人机的高度性能影响最严重？","options":[{"key":"A","text":"电动固定翼"},{"key":"B","text":"电动多轴"},{"key":"C","text":"油动固定翼"}],"answer":"C","analysis":"提示：油动需要进气，电动不用进气\n解析：拉萨位于高原地区，海拔高、空气稀薄，对油动固定翼无人机的高度性能影响最严重。高原环境下，发动机功率下降，空气密度低，影响无人机的升力和飞行高度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0607","type":"single","difficulty":1,"stem":"从什么资料上可以预先了解到航线高度的风、云、气温及颠簸、积冰等情况？","options":[{"key":"A","text":"航路天气预告图"},{"key":"B","text":"等压面预告图"},{"key":"C","text":"重要天气预告图"}],"answer":"A","analysis":"提示：问题对答案，航线对航路\n解析：航路天气预告图上可以预先了解到航线高度的风、云、气温及颠簸、积冰等情况。这是飞行员和航空气象学家常用的工具用于预测航线上的天气状况。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0608","type":"single","difficulty":1,"stem":"飞机外表面的冰霜雪等，（）。","options":[{"key":"A","text":"会出现指令仰角变化和滚转"},{"key":"B","text":"会使外表面变得粗糙，增加阻力，减少升力"},{"key":"C","text":"会引起飞机操纵效能增加"}],"answer":"B","analysis":"提示：加阻力，减升力（减操控）\n解析：飞机外表面的冰霜雪等会使飞机外表面变得粗糙，增加飞行时的阻力，并减少升力对飞行性能产生不利影响。因此，需要及时清除飞机外表面的冰霜雪等附着物。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0609","type":"single","difficulty":1,"stem":"三大气象要素为（）。","options":[{"key":"A","text":"气温、风和云"},{"key":"B","text":"风、云和降水"},{"key":"C","text":"气温、气压和空气湿度"}],"answer":"C","analysis":"提示：三气\n解析：三大气象要素是指气温、气压和空气湿度，它们是气象观测和预报中的基础参数。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0610","type":"single","difficulty":1,"stem":"能够产生有一定影响的低空风切变的天气背景主要有三类：","options":[{"key":"A","text":"山地气流、昼夜交替天气、春夏之交天气"},{"key":"B","text":"强对流天气、锋面天气、辐射逆温型的低空急流天气"},{"key":"C","text":"大风天气、强降雨天气、寒冷天气"}],"answer":"B","analysis":"提示：强对流锋面辐射逆温\n解析：能够产生有一定影响的低空风切变的天气背景主要有三类:强对流天气、锋面天气、辐射逆温型的低空急流天气。这些天气条件都可能导致风速和风向的突然变化:即风切变。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0611","type":"single","difficulty":1,"stem":"平流层对航空活动有利的方面是（）。","options":[{"key":"A","text":"气流平稳、能见度好、空气阻力小"},{"key":"B","text":"气温低、飞机载重量增加、飞机真空速增大"},{"key":"C","text":"气流平稳、无恶劣天气、发动机推力增大"}],"answer":"A","analysis":"提示：平流-阻力小，能见度好\n解析：平流层对航空活动有利的方面主要体现在其气流平稳、能见度好、空气阻力小。这些条件使得飞机在平流层中飞行更加稳定减少了飞行中的颠簸和阻力，有利于航空活动的进行。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0612","type":"single","difficulty":1,"stem":"暖锋是指（）。","options":[{"key":"A","text":"温度较高与温度较低的两个气团交汇时，温度高的一侧"},{"key":"B","text":"锋面在移动过程中，暖空气推动锋面向冷气团一侧移动的锋"},{"key":"C","text":"一侧气团温度明显高于另一侧气团温度的锋"}],"answer":"B","analysis":"提示：移动，暖推冷\n解析：暖锋是指锋面在移动过程中，暖空气推动锋面向冷气团一侧移动的锋。这种锋面移动时，暖空气沿锋面爬升，形成云层并可能带来降水，是天气系统中的重要组成部分。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0613","type":"single","difficulty":1,"stem":"飞机结冰是指飞机机体表面某些部位聚集冰层的现象，飞机积冰主要分为三大种（）。","options":[{"key":"A","text":"坚冰、松冰、霜冰"},{"key":"B","text":"明冰、毛冰、白冰"},{"key":"C","text":"冰、雾凇、霜"}],"answer":"C","analysis":"提示：雾凇\n解析：飞机结冰主要分为冰、雾松、霜三种。这是飞机结冰的基本分类，每种类型的结冰对飞机的影响和应对措施都有所不同。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0614","type":"single","difficulty":1,"stem":"夜间温度降低，低层常常出现逆温，会使得（）。","options":[{"key":"A","text":"早晨天气晴朗"},{"key":"B","text":"早晨有雾和烟幕"},{"key":"C","text":"早晨有大风"}],"answer":"B","analysis":"提示：逆温早上有雾\n解析：夜间温度降低时，地面散失热量，使得近地面空气温度降低，形成逆温层。逆温层会抑制空气的对流运动，使得污染物和水汽不易扩散，从而在早晨容易形成雾和烟幕。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0615","type":"single","difficulty":1,"stem":"气团的性质是（）。","options":[{"key":"A","text":"水平范围大、垂直范围大、水平温度梯度小"},{"key":"B","text":"水平范围小、垂直范围大、水平温度梯度小"},{"key":"C","text":"水平范围大、垂直范围小、水平温度 梯度小"}],"answer":"A","analysis":"提示：大大小，水平大垂直大梯度小\n解析：气团可以简单理解为：一个特别高又特别宽，且内部温度湿度都差不多的大气球所以不管是水平范围还是垂直范围，都很大！内部温差，又很小！根据蓝皮书，对气团的描述在章节 4.5气团与锋的概念及锋面天气 4.5.1 气团 气团气团是指气象要素(主要指温度和湿度)水平分布比较均匀的大范围的空气团。在同一气团中,各地气象要素的重点分布几乎相同,天气现象也大致一样气团的水平范围可达儿千公里,重直高度可达几公里到十几公里,常常从地面伸展到对流层顶。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0616","type":"single","difficulty":1,"stem":"气团是指气象要素（主要指温度湿度）在水平分布上比较均匀的大范围空气团。下列不正确的是（）。","options":[{"key":"A","text":"垂直范围大"},{"key":"B","text":"水平温度梯度大"},{"key":"C","text":"水平范围大"}],"answer":"B","analysis":"提示：气团有类似题几十到几千，但是温度梯度小，大大小\n解析：气团是指气象要素在水平分布上比较均匀的大范围空气团。气团的水平范围大，垂直范围相对较小，且水平温度梯度小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0617","type":"single","difficulty":1,"stem":"在山地背风坡中的下降气流中飞行时，除造成飞机掉高度外，还可造成严重危害的原因是（）。","options":[{"key":"A","text":"地速减小"},{"key":"B","text":"空速表误差增大"},{"key":"C","text":"气压式高度表读数高于实际高度"}],"answer":"C","analysis":"提示：背风坡→读数高于实际\n解析：在山地背风坡中的下降气流中飞行时，由于气压随高度降低而增大，气压式高度表的读数会高于实际高度，这可能导致飞机在不知情的情况下掉高度，造成安全隐患。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0618","type":"single","difficulty":1,"stem":"下述物理量中，反映大气潮湿程度的量是（）。","options":[{"key":"A","text":"相对湿度"},{"key":"B","text":"饱和水气压"},{"key":"C","text":"露点温度"}],"answer":"A","analysis":"提示：湿度表示潮湿度\n解析：相对湿度是大气的实际水汽压与同温度下饱和水汽压的比值，它反映了大气中水汽的接近饱和程度，是衡量大气潮湿程度的重要指标。饱和水气压只是表示在一定温度下空气可能含有的最大水汽量，而不反映实际的潮湿程度。露点温度则是指空气在水汽含量和气压都不改变的条件下，冷却到饱和时的温度，它更多用于表示空气达到饱和时的状态，而非当前的潮湿程度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0619","type":"single","difficulty":1,"stem":"低空风切变主要的形成原因是什么？","options":[{"key":"A","text":"雷暴、低空急流和锋面活动"},{"key":"B","text":"气流经过特定环境时产生"},{"key":"C","text":"具体原因还不是特别明了"}],"answer":"A","analysis":"提示：问题对答案，低空对低空\n解析：低空风切变主要的形成原因是雷暴、低空急流和锋面活动。这些气象条件变化剧烈常导致风向和风速的突然改变，对飞行安全构成严重威胁。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0620","type":"single","difficulty":1,"stem":"大气系统热量的主要来源是吸收太阳辐射，下列说法哪个正确？","options":[{"key":"A","text":"当太阳辐射通过大气层时，有24%被大气直接吸收"},{"key":"B","text":"当太阳辐射通过大气层时，有34%被大气直接吸收"},{"key":"C","text":"当太阳辐射通过大气层时，有44%被大气直接吸收"}],"answer":"A","analysis":"提示：24%被吸收\n解析：大气系统热量的主要来源是吸收太阳辐射(短波)。当太阳辐射通过大气层时,有24%被大气直接吸收,31%被大气反射和散射到宇宙空间,余下的45%到达地表。地面吸收其大部分后,又以反射和辐射(长波)的形式回到大气中,大部分被大气吸收。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0621","type":"single","difficulty":1,"stem":"手抛电动固定翼民用无人机，一般在几级风以上就难以自驾飞行（）。","options":[{"key":"A","text":"2级"},{"key":"B","text":"6级"},{"key":"C","text":"4级"}],"answer":"C","analysis":"提示：2飞4难6别想\n解析：对常见手抛电动固定翼无人机，风速超过4级时，手抛起飞和保持预定航迹的难度通常增加。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0622","type":"single","difficulty":1,"stem":"下面关于雾说法不正确的是（）。","options":[{"key":"A","text":"大雾会影响无人机的起降手动操作"},{"key":"B","text":"大雾会影响无人机航拍任务设备效果"},{"key":"C","text":"大雾会影响无人机的航线自主飞行"}],"answer":"C","analysis":"提示：航线自主飞行依靠GPS,大雾不影响\n解析：大雾对无人机的影响主要表现在视觉和传感器方面。大雾会影响无人机的起降手动操作，因为飞行员可能无法清晰地看到跑道或周围环境。同时，大雾也会影响无人机航拍任务设备的效果，因为雾会降低图像的清晰度和色彩饱和度。然而，无人机的航向自主飞行主要依赖GPS等导航系统，大雾对其影响较小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0623","type":"single","difficulty":1,"stem":"目视判断风切变的参照物，以下不正确的是（）。","options":[{"key":"A","text":"雷暴云体下垂的雨幡"},{"key":"B","text":"雷暴冷性外流气流的尘卷风（云）"},{"key":"C","text":"卷积云带来的降雨"}],"answer":"C","analysis":"提示：选错的。最短的，卷积云不具有代表性\n解析：飞行员判断和识别低空风切变，如采用目测法，有三个主要参照物：1、雷暴冷性外流气流的尘卷风(云)2、滚轴状云3、雷暴云体下垂的雨幡卷积云属于高云，通常不产生降雨，也不是判断低空风切变的典型参照物。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0624","type":"single","difficulty":1,"stem":"飞机积冰的产生，主要是由于云中存在（）。","options":[{"key":"A","text":"雪花和冰晶"},{"key":"B","text":"过冷水滴"},{"key":"C","text":"大小不等的水滴"}],"answer":"B","analysis":"提示：过冷水滴不稳定，稍受震动，即冻结成冰\n解析：飞机积冰的产生，主要是由于云中存在过冷水滴。过冷水滴在飞机表面冻结，形成积冰。这是飞机积冰的主要原因","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0625","type":"single","difficulty":1,"stem":"一般雷暴单体的生命史根据垂直气流状况可分为三个阶段（）。","options":[{"key":"A","text":"温升阶段、降雨阶段、消散阶段"},{"key":"B","text":"积云阶段、成风阶段、雷雨阶段"},{"key":"C","text":"积云阶段、成熟阶段、消散阶段"}],"answer":"C","analysis":"提示：积云、成熟、消散\n解析：雷暴单体的生命史通常分为三个阶段:积云阶段、成熟阶段和消散阶段。在积云阶段，雷暴开始形成并发展;在成熟阶段雷暴达到最强，伴随着强烈的雷电和降水;在消散阶段，雷暴逐渐减弱并消失。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0626","type":"single","difficulty":1,"stem":"气温、气压和空气湿度的变化都会对飞机性能和仪表指示造成一定的影响，这种影响主要通过他们对空气密度的影响而实现，下列描述哪个正确？","options":[{"key":"A","text":"空气密度与气压成正比，与气温成反比"},{"key":"B","text":"空气密度与气压成反比，与气温成正比"},{"key":"C","text":"空气密度与气压成正比，与气温也成正比"}],"answer":"A","analysis":"提示：气温高，密度小，气压小（密度 气压正 气温反）\n解析：根据P=ρVg/S，气压与密度成正比，相同温度下，空气密度越大，气压越大。根据PV=nRT，n为摩尔数，R为常量，等质量的气体，压强不变的情况下，温度和密度成反比","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0627","type":"single","difficulty":1,"stem":"暖锋和冷锋在特性上是非常不同的，（）。","options":[{"key":"A","text":"冷锋以10-25英里每小时速度移动"},{"key":"B","text":"暖锋以20-35英里每小时速度移动"},{"key":"C","text":"暖锋产生差的能见度和下雨，冷锋产生突发的阵风、紊流"}],"answer":"C","analysis":"提示：紊流\n解析：暖锋和冷锋在特性上确实不同。暖锋通常产生差的能见度和连续性降雨，而冷锋则往往带来突发的阵风、紊流和天气快速变化。冷锋和暖锋不能以具体速度表示。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0628","type":"single","difficulty":1,"stem":"飞机在着陆时突然遇到逆风切变，会出现下述何种现象？","options":[{"key":"A","text":"飞机高度下降，空速减小，未到正常着陆点即提前着陆"},{"key":"B","text":"飞机空速突然减小，升力减小，飞机将掉至正常下滑线以下"},{"key":"C","text":"飞机空速突然增大，升力增加，飞机上仰并上升到下滑线之上"}],"answer":"C","analysis":"提示：切变着陆，逆上顺下\n解析：飞机在起飞或着陆时遇到逆风切变。（风切变劲儿贼大）可以理解为：飞机想着陆，但是突然遇到了逆着飞行方向的强烈大风，大风想把飞机头掀起来。给飞机增加了本不需要的额外的托举力（升力），让飞机有上仰趋势。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0629","type":"single","difficulty":1,"stem":"（干洁）空气的主要组成是（）。","options":[{"key":"A","text":"78%的氮气，21%的氧气以及1%的其他气体"},{"key":"B","text":"75%的氮气，24%的氧气以及1%的其他气体"},{"key":"C","text":"78%的氮气，20%的氧气以及2%的其他气体"}],"answer":"A","analysis":"提示：21%氧气\n解析：干洁空气主要由氮气、氧气和少量其他气体组成。其中氮气约占78%，氧气约占21%，氩气、二氧化碳等其他气体约占1%。水汽含量变化较大，通常不计入干洁空气组成。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0630","type":"single","difficulty":1,"stem":"风切变的仪表判断法，以下不正确的是（）。","options":[{"key":"A","text":"发动机转速和地速快速变化"},{"key":"B","text":"俯仰角指示快速变化"},{"key":"C","text":"空速表指示的非理性变化"}],"answer":"A","analysis":"提示：选错的。跟转速地速没关系！\n解析：风切变仪表判断法： 空速表指示的非理性变化√ 高度表的不正常变化√ 升降速度表波动√ 俯仰姿态指示器变化快√ 发动机转速和地速的快速变化×","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0631","type":"single","difficulty":1,"stem":"在雷暴的生存周期中，哪一阶段的特征使云中充满下降气流？","options":[{"key":"A","text":"消散阶段"},{"key":"B","text":"成熟阶段"},{"key":"C","text":"积云阶段"}],"answer":"A","analysis":"提示：上升成熟，下降消散\n解析：在雷暴的生存周期中，消散阶段的特征是云中充满下降气流。这是因为在此阶段，雷暴开始减弱，上升气流减弱并转变为下降气流，导致云体消散。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0632","type":"single","difficulty":1,"stem":"地面天气图上填写的气压是（）。","options":[{"key":"A","text":"本站气压"},{"key":"B","text":"场面气压"},{"key":"C","text":"海平面气压"}],"answer":"C","analysis":"提示：地图→海平面气压\n解析：地面天气图上填写的气压通常是海平面气压，这是因为海平面气压是一个标准化的参考点，有助于比较不同地点的气压差异并用于天气分析和预报。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0633","type":"single","difficulty":1,"stem":"大气中某一高度的一团空气，如受到某种外力的作用后，产生向上或向下运动时，称为稳定状态的是（）。","options":[{"key":"A","text":"移动后逐渐减速，并有返回原来高度的趋势"},{"key":"B","text":"移动后，加速向上或向下运动"},{"key":"C","text":"外力作用消失后，以匀速持续运动"}],"answer":"A","analysis":"提示：移动又返回-稳定\n解析：当大气中某一高度的空气团受到外力作用产生向上或向下运动时，若其移动后逐渐减速，并有返回原来高度的趋势，则称为稳定状态。这是因为空气团在垂直方向上受到了平衡力的作用。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0634","type":"single","difficulty":1,"stem":"某个风力标志箭头长的像“F”，并且两个横杠一样长，代表（）。","options":[{"key":"A","text":"2级风"},{"key":"B","text":"3级风"},{"key":"C","text":"4级风"}],"answer":"C","analysis":"提示：F4\n解析：在气象上，一条长风尾代表4m/s的风，一条短风尾代表2m/s的风。两根长风羽代表8m/s的风。根据风力等级表，四级风的风速范围为5.5-7.9m/s，严格来讲，8m/s的风速属于五级风。不过在实际应用方面，尤其是在公共服务、科普宣传方面，0.1m/s的风速差异微乎其微，甚至难以精确测量，8m/s的符号与7.9m/s的四级风上限接近。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0635","type":"single","difficulty":1,"stem":"根据地面天气图上分析的等压线，我们能观察出（）。","options":[{"key":"A","text":"槽线位置"},{"key":"B","text":"气压梯度"},{"key":"C","text":"降水区域"}],"answer":"B","analysis":"提示：问题对答案，等压对气压\n解析：等压线是连接气压相等各点的曲线。天气图中相邻等压线的气压差通常相等，因此可以根据等压线的疏密程度判断气压梯度的大小：等压线越密，气压梯度越大；等压线越疏，气压梯度越小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0636","type":"single","difficulty":1,"stem":"雷暴是由强烈的积雨云产生的，形成强烈的积雨云需要三个条件（）。","options":[{"key":"A","text":"深厚而明显的不稳定气层、充沛的水汽、足够的冲击力"},{"key":"B","text":"强大的风力、充沛的水气、足够的冲击力"},{"key":"C","text":"深厚而明显的不稳定气层、剧烈的温差、足够的冲击力"}],"answer":"A","analysis":"提示：1不稳定，2水汽\n解析：形成强烈的积雨云需要三个基本条件:深厚而明显的不稳定气层、充沛的水汽、足够的冲击力。这三个条件共同作用，使得空气上升、冷却、凝结，最终形成积雨云。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0637","type":"single","difficulty":1,"stem":"飞机在比标准大气冷的空气中飞行时，气压高度表所示高度将比实际飞行高度（）。","options":[{"key":"A","text":"高"},{"key":"B","text":"低"},{"key":"C","text":"相同"}],"answer":"A","analysis":"提示：高冷\n解析：气压高度表只看“静压”这一条输入。同一高度上，天冷→空气密度大→静压比标准值高。仪表把“比标准高的气压”当成“标准大气里更低的高度”，于是指示高度 < 实际高度（表少指）。但题目问的是“飞机在比标准大气冷的空气中飞行”，它隐含的前提是：飞机已飞到某一实际高度，外界静压已经“因为冷”而比标准值低（密度大，压降快）。仪表仍按标准换算，就会把“比标准低的那个气压”当成“更高高度”的气压，于是指示高度 > 实际高度（表多指）。所以“天冷”本身既可能让静压“偏高”也可能“偏低”，关键看你是“固定高度”还是“固定气压”来讨论。题目里默认“飞机已到达某一实际高度”，冷天密度大→该高度上的静压比标准值低→表多指。因此在比标准大气冷的空气中飞行，气压高度表所示高度比实际高度高 。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0638","type":"single","difficulty":1,"stem":"气团的分类方法正确的是？","options":[{"key":"A","text":"暖气团和湿气团"},{"key":"B","text":"冷气团和干气团"},{"key":"C","text":"北冰洋气团、极地气团，热带气团、赤道气团"}],"answer":"C","analysis":"提示：冷对暖，干对湿，只剩最长的对\n解析：气团的分类主要依据其源地和热力性质，按气团的发源地：北冰洋气团、极地气团、热带气团、赤道气团。按照热力性质，可以分为冷气团和暖气团。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0639","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是卷状云特征？","options":[{"key":"A","text":"在红外云图上，卷云顶温度很低，呈白色"},{"key":"B","text":"无论可见光还是红外云图，卷云没有纤维结构"},{"key":"C","text":"在可见光云图上，卷云呈灰--深灰色"}],"answer":"B","analysis":"提示：选错的。纤维\n解析：在可见光云图上，卷云呈灰--深灰色。在红外云图上，卷云温度很低，呈白色 无论可见光还是红外云图，卷云都有纤维结构，这是其典型特征之一。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0640","type":"single","difficulty":1,"stem":"严重的低空风切变，气流常从高空急速下冲，易引发坠落事件。当飞机进入该区域时，（ ）。","options":[{"key":"A","text":"先遇强逆风，后遇猛烈的上升气流，随后又是强顺风"},{"key":"B","text":"先遇强顺风，后遇猛烈的上升气流，随后又是强逆风"},{"key":"C","text":"先遇强逆风，后遇猛烈的下沉气流，随后又是强顺风"}],"answer":"C","analysis":"提示：危害大→坠机→猛烈下沉气流\n解析：严重的低空风切变，常发生在低空急流即狭长的强风区，对飞行安全威胁极大。这种风切变气流常从高空急速下冲，像向下倾泻的巨型水龙头，当飞机进入该区域时，先遇强逆风，后遇猛烈的下沉气流，随后又是强顺风，飞机就像狂风中的树叶被抛上抛下而失去控制，因此，极易发生严重的坠落事件。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0641","type":"single","difficulty":1,"stem":"地面的地形和大的建筑物会（）。","options":[{"key":"A","text":"产生会快速改变方向和速度的阵风"},{"key":"B","text":"产生稳定方向和速度的阵风"},{"key":"C","text":"汇聚风的流向"}],"answer":"A","analysis":"提示：乱流，变速阵风\n解析：地面的地形和大的建筑物会对风产生阻碍和扰动，使得风的流向和速度发生快速改变，从而产生阵风。这种阵风的特点就是方向和速度都会快速改变。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0642","type":"single","difficulty":1,"stem":"关于飞机积冰，下列正确的是（）。","options":[{"key":"A","text":"飞机积冰一般发生在-1～-15℃的温度范围内"},{"key":"B","text":"强烈的积冰主要发生在-4～-8℃的温度范围内"},{"key":"C","text":"在-2～-10℃温度范围内遭遇积冰的次数最多"}],"answer":"C","analysis":"提示：-2～-10℃\n解析：负2-负10℃温度范围是飞机遭遇积冰次数最多的区间，符合实际情况。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0643","type":"single","difficulty":1,"stem":"下面关于飞机积冰的叙述哪一个正确？","options":[{"key":"A","text":"中云温度低于0℃，云层较厚，水滴含量大，积冰最严重"},{"key":"B","text":"低云云高低于2000米，温度高，不含过冷水滴，所以一般不出现飞机积冰"},{"key":"C","text":"高云由于高度高、温度低，大多由冰晶构成，不容易形成飞机积冰"}],"answer":"A","analysis":"提示：中云\n解析：中云温度低于0°C，云层较厚，水滴含量大，是飞机积冰最严重的云层。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0644","type":"single","difficulty":1,"stem":"积冰的形状主要取决于冰的种类，飞行速度和气流绕过飞行器的不同部位的情况，积冰的形状一般分为（）。","options":[{"key":"A","text":"凸状冰、凹状冰和混合冰"},{"key":"B","text":"圆形冰、方形冰和混合冰"},{"key":"C","text":"槽状冰、楔形冰和混合冰"}],"answer":"C","analysis":"提示：槽锲混\n解析：积冰的形状主要取决于冰的种类、飞行速度和气流绕过飞行器的不同部位。在这些因素的作用下，积冰会形成不同的形状，主要包括槽状冰、楔形冰和混合冰。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0645","type":"single","difficulty":1,"stem":"下面关于气团的叙述哪一个正确？","options":[{"key":"A","text":"我国地域广大，能形成各种气团"},{"key":"B","text":"气团离开源地，其性质将会发生变化"},{"key":"C","text":"气团只形成于极地和大洋地区"}],"answer":"B","analysis":"提示：离开源地，垫面变化，气团性质变化\n解析：严格的说，北冰洋气团、极地气团、热带气团、赤道气团，这四种气团我国本土都形不成，只能受外来气团影响；其中北冰洋气团是我国完全接触不到，自身更无法形成，当气团在源地形成后，气团中的部分空气会离开源地移到与源地性质不同的地面，气团中的空气与新地表产生了热量与水分的交换，（由于下垫面性质、大气环流条件等因素的变化，其性质如温度、湿度往往会发生变化）这样气团的物理属性就会逐渐发生变化，这种变化称为气团的变性。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0646","type":"single","difficulty":1,"stem":"气团变性的主要原因是（）。","options":[{"key":"A","text":"太阳辐射的变化"},{"key":"B","text":"天气系统的移动"},{"key":"C","text":"下垫面性质发生了变化"}],"answer":"C","analysis":"提示：离开源地，垫面变化，气团性质变化\n解析：气团变性是指气团在移动过程中，由于下垫面性质(如海陆分布、地形起伏、地表覆盖等)的变化而逐渐改变其原有性质的过程。这是气团变性的主要原因。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0647","type":"single","difficulty":1,"stem":"空气在作水平运动时，是什么力阻止了空气直接从高压区流向低压区？","options":[{"key":"A","text":"惯性离心力"},{"key":"B","text":"地转偏向力"},{"key":"C","text":"摩擦力"}],"answer":"B","analysis":"提示：流向选偏向\n解析：空气在水平运动时，会受到地转偏向力的影响，这使得空气不会直接从高压区流向低压区，而是发生偏转。地转偏向力是由于地球自转而产生的，它会影响大气运动的方向。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0648","type":"single","difficulty":1,"stem":"形成风的原动力是（）。","options":[{"key":"A","text":"水平地转偏向力"},{"key":"B","text":"地球的旋转运动"},{"key":"C","text":"水平气压梯度力"}],"answer":"C","analysis":"提示：风：高压到低压，唯一气压相关\n解析：风的形成主要是由于大气中的水平气压梯度力作用。这种力是由于地球表面大气压力分布不均而产生的，它推动空气从高压区流向低压区，从而形成风。水平地转偏向力主要影响风的运动方向，而非风的原动力。地球的旋转运动虽然对大气运动有一定影响，但它不是形成风的直接原动力。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0649","type":"single","difficulty":1,"stem":"机场上空高度较低的云会直接影响飞机的起降。其中，危害最大的云是（）。","options":[{"key":"A","text":"卷状云"},{"key":"B","text":"层状云"},{"key":"C","text":"对流云"}],"answer":"C","analysis":"提示：对流云危害最大\n解析：机场上空高度较低的云会使飞行员看不清跑道,直接影响飞机的起降。 其中,危害最大的云是对流云。 飞机一旦进入，易遭到电击，使仪表失灵，油箱爆炸，或者造成强烈颠簸、结冰，使操纵失灵,发生飞行事故。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0650","type":"single","difficulty":1,"stem":"最小能见度是指（）。","options":[{"key":"A","text":"能见度因方向而异时，垂直和水平能见度最小的距离"},{"key":"B","text":"能见度因方向而异时，其中最小的能见距离"},{"key":"C","text":"能看到最近的物体距离"}],"answer":"B","analysis":"提示：问题对答案。最小能见度对最小的能见距离\n解析：最小能见度是指在能见度因方向而异时其中最小的能见距离。这是因为能见度可能因天气、光照等条件在不同方向上有所不同，所以取最小值作为参考标准。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0651","type":"single","difficulty":1,"stem":"气压一定时，气温露点的高低可以表示（）。","options":[{"key":"A","text":"空气中凝结核的含量"},{"key":"B","text":"空气的饱和程度"},{"key":"C","text":"空气中的水汽含量"}],"answer":"C","analysis":"提示：露点→露珠→水\n解析：露点：空气在水汽含量和气压都不改变的条件下，气温降低到使空气达到水汽饱和的温度。形象地说，就是空气中的水蒸气变为露珠时候的温度叫露点。因此可以表示空气中的水汽含量。露点温度越接近实际温度，说明空气中的水汽含量越高，空气越接近饱和状态。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0652","type":"single","difficulty":1,"stem":"在地表的风向稍微不同于地表之上几千英尺高度的风向的原因是（）。","options":[{"key":"A","text":"风和地面之间的摩擦作用"},{"key":"B","text":"当地地形影响气压"},{"key":"C","text":"地面有较强的地转偏向力"}],"answer":"A","analysis":"提示：地表风向靠摩擦\n解析：地表的风向受地面摩擦力的影响，风速和风向都会发生变化。而地表之上几千英尺高度的风向则受摩擦力影响较小，主要受大气环流控制。因此，两者风向会有所不同。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0653","type":"single","difficulty":1,"stem":"形成海陆风的对流性环流的原因是因为（）。","options":[{"key":"A","text":"从水面吹向陆地的空气较暖，密度小，导致空气上升"},{"key":"B","text":"陆地吸收和散发热量比水面快"},{"key":"C","text":"从水面吹向陆地的空气冷，密度大，使空气上升"}],"answer":"B","analysis":"提示：海陆风，选陆地\n解析：白天，陆地升温快，气温高，空气膨胀上升，近地面空气密度变小，就形成低压；海洋升温慢，气温低，空气收缩下沉，近地面空气密度大，就形成高压，于是风从高压吹向低压，即从海洋吹向陆地，所以主要原因是因为陆地吸收和散发热量比水面快","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0654","type":"single","difficulty":1,"stem":"相对湿度，是指（）。","options":[{"key":"A","text":"空气中水汽压与饱和水汽压的百分比"},{"key":"B","text":"空气中水分占空气总量的百分比"},{"key":"C","text":"空气中水汽含量与饱和水汽含量的百分比"}],"answer":"A","analysis":"提示：双压/两压一比\n解析：相对湿度是指空气中实际水汽压与同温度下饱和水汽压之比，用百分比表示。它反映了空气接近饱和的程度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0655","type":"single","difficulty":1,"stem":"地表和潮湿物体表面的水分蒸发进入大气就形成了大气中的水汽。大气中的水汽含量平均约占整个大气体积的0-5%左右，并随着高度的增加而逐渐（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"不变"},{"key":"C","text":"减少"}],"answer":"C","analysis":"提示：水重，越高越少\n解析：地表和潮湿物体表面的水分蒸发进入大气就形成了大气中的水汽。大气中的水汽含量平均约占整个大气体积的0~5%左右，并随着高度的增加而逐渐减少。这是因为随着高度的增加，温度和压力都逐渐降低不利于水汽的存在。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0656","type":"single","difficulty":1,"stem":"一般我们说的4级风，风速为（）。","options":[{"key":"A","text":"8.0-10.7m/s"},{"key":"B","text":"10.8-13.8m/s"},{"key":"C","text":"5.5-7.9m/s"}],"answer":"C","analysis":"提示：每级风2m/s\n解析：按照气象、航海、航空等领域通用的风级评定标准 ，4级风为和风，风速范围通常是：5.5～7.9 m/s","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0657","type":"single","difficulty":1,"stem":"当来自北方的冷气团和来自南方的暖气团，两者势均力敌、强度相当时，它们的交锋区很少移动，这种锋面称为（）。","options":[{"key":"A","text":"融合锋"},{"key":"B","text":"静止锋"},{"key":"C","text":"交错锋"}],"answer":"B","analysis":"提示：很少移动，就是静止\n解析：当来自北方的冷气团和来自南方的暖气团两者势均力敌、强度相当时。它们的交锋区很少移动。这种锋面称为静止锋。春季、初夏(梅雨)和秋季的连阴雨天气和梅雨天气就是受静止锋影响而造成的。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0658","type":"single","difficulty":1,"stem":"以下选项哪个不是对流层的主要特征（）。","options":[{"key":"A","text":"气温随高度升高而升高"},{"key":"B","text":"空气具有强烈的垂直混合"},{"key":"C","text":"气温、湿度的水平分布很不均匀"}],"answer":"A","analysis":"提示：选错的。温度高而升高错误！\n解析：对流层的主要特征包括气温、湿度的水平分布很不均匀，以及空气具有强烈的垂直混合。而对流层内气温通常是随高度升高而降低的，而不是升高。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0659","type":"single","difficulty":1,"stem":"18000英尺高度的大气重量仅仅是海平面时的（）。","options":[{"key":"A","text":"三分之一"},{"key":"B","text":"一半"},{"key":"C","text":"四分之一"}],"answer":"B","analysis":"提示：一半\n解析：这里的“大气重量”实际指单位面积上方空气柱的重量，也就是大气压力，不是空气密度。根据标准大气压公式计算可得，18000英尺处，上方空气柱的重量约为海平面的 50%。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0660","type":"single","difficulty":1,"stem":"在锋面经过机场时，要特别注意的是（）。","options":[{"key":"A","text":"可能出现风沙天气"},{"key":"B","text":"可能出现高度极低的风切变"},{"key":"C","text":"雨层云中的连续性小雨"}],"answer":"B","analysis":"提示：锋面经过机场，不安全不飞\n解析：锋面经过时，由于冷暖气团的交汇，常伴随有风切变现象，特别是高度极低的风切变，对飞行安全构成威胁。风沙天气和雨层云中的连续性小雨虽也可能出现，但不是最主要的风险。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0661","type":"single","difficulty":1,"stem":"积冰强度可分为（）。","options":[{"key":"A","text":"微弱、弱、中度和强"},{"key":"B","text":"霜、雾凇和冰"},{"key":"C","text":"轻度、中度和重度"}],"answer":"C","analysis":"提示：程度3:轻中重\n解析：积冰强度是指积冰对飞行器的影响程度，它可以根据积冰的厚度和密度进行分类。通常将积冰强度分为轻度、中度和重度:以描述其对飞行器的潜在危害。轻度结冰，长时间飞行有危险，如果用除冰设备不影响飞行。中度结冰，积聚率很快，短时间内就会构成危险。严重结冰，积聚率非常快，除冰设备也不能控制危险，必须立即返航。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0662","type":"single","difficulty":1,"stem":"风向270度，航向90度，这时无人机在（）。","options":[{"key":"A","text":"顺风飞行"},{"key":"B","text":"逆风飞行"},{"key":"C","text":"侧风飞行"}],"answer":"A","analysis":"提示：风向:风来的方向 航向:飞机前进方向飞机\n解析：风向270度表示风来自西方，航向90度表示无人机朝东飞行。因此，风的方向与无人机的飞行方向相同，是顺风飞行。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0663","type":"single","difficulty":1,"stem":"卫星云图上下列哪个不是积雨云特征？","options":[{"key":"A","text":"无论可见光还是红外云图，积雨云的色调最白"},{"key":"B","text":"积雨云的尺度相差不大。"},{"key":"C","text":"在卫星图像上的积雨云常是几个雷暴单体的集合"}],"answer":"B","analysis":"提示：选错的。相差不大\n解析：在卫星图像上的积雨云常是几个雷暴单体的集合，无论可见光还是红外云图，积雨云的色调最白。积雨云的尺度可以有很大的变化，从初生的小尺度到成熟时可能发展得非常庞大，相差很大。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0664","type":"single","difficulty":1,"stem":"温度对飞机的升限有影响，关于升限，下列何种叙述是正确的？","options":[{"key":"A","text":"气温升高，所有飞机的升限都要减小"},{"key":"B","text":"气温升高，大型飞机的升限要升高"},{"key":"C","text":"气温变化对喷气式飞机的升限没有影响"}],"answer":"A","analysis":"提示：温高密低,升力↓升限↓\n解析：气温升高导致空气密度减小，飞机发动机产生的推力在较稀薄的空气中效率降低，因此所有飞机的升限都会减小。这是因为升力主要由空气密度和速度决定，气温升高降低了空气密度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0665","type":"single","difficulty":1,"stem":"当机翼和尾翼积冰时，下列不正确的描述是（）。","options":[{"key":"A","text":"翼型失真（变形）"},{"key":"B","text":"导致摩擦阻力减少"},{"key":"C","text":"压差阻力都增大"}],"answer":"B","analysis":"提示：不正确的-摩擦力减少\n解析：当机翼和尾翼积冰时，会导致翼型失真(变型)同时压差阻力会增大。而积冰会增加表面的粗糙度，从而增大摩擦阻力，而不是减少，","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0666","type":"single","difficulty":1,"stem":"对流层的主要特征，哪个正确？","options":[{"key":"A","text":"空气具有强烈的垂直混合"},{"key":"B","text":"气温、湿度的水平分布均匀"},{"key":"C","text":"气温随高度不变"}],"answer":"A","analysis":"提示：垂直\n解析：对流层的主要特征是空气具有强烈的垂直混合。这是因为对流层内气温随高度变化导致空气上升或下沉，形成强烈的对流运动，从而使得空气在垂直方向上充分混合。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0667","type":"single","difficulty":1,"stem":"关于风切变出现的地方，下述说法正确的是（）。","options":[{"key":"A","text":"在大气中任何高度上存在风向或风速变化的地方"},{"key":"B","text":"在气压和温度急剧下降的地方出现"},{"key":"C","text":"仅在雷暴中出现"}],"answer":"A","analysis":"提示：风切变，找变化\n解析：风切变是指大气中任何高度上风向或风速的变化，它不仅出现在雷暴中，也可能在其他气象条件下出现，如锋面、地形影响等。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0668","type":"single","difficulty":1,"stem":"地球自转产生的地球自转偏向力对风向产生影响，下列哪个是正确的？","options":[{"key":"A","text":"北半球，地球自转偏向力使得空气向西偏转"},{"key":"B","text":"北半球，地球自转偏向力使得空气向东偏转"},{"key":"C","text":"北半球，地球自转偏向力使得空气先向东再向西偏转"}],"answer":"B","analysis":"提示：北半球：东（右）\n解析：根据蓝皮书 4.3.1 对流产生的原因 的表述： 地球自转产生的地球自转偏向力对风向产生了影响。 以北半球为例, 地球自转偏向力使得空气向右偏转(东),偏转的程度根据纬度的不同而变化,在极地最大,在赤道降低为零。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0669","type":"single","difficulty":1,"stem":"关于锋面，下列哪种描述正确？","options":[{"key":"A","text":"锋面就是温度、湿度等物理性质不同的两种气团的交界面"},{"key":"B","text":"锋面就是风场与地面的交线，也简称为锋"},{"key":"C","text":"锋面就是不同方向的风交汇的界面"}],"answer":"A","analysis":"提示：锋面：冷暖气团交界面\n解析：锋面是指温度、湿度等物理性质不同的两种气团的交界面，是天气系统中的重要组成部分，曾常伴随着天气变化，如降水、风切变等。冷、暖气团之间的交界面称为锋面。锋面与地面的交线称为锋线，锋面与锋线统称为锋。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0670","type":"single","difficulty":1,"stem":"接近地面的对流气流会影响驾驶员操控的能力，下列说法哪种正确？","options":[{"key":"A","text":"在一大片水体或者稠密植被的区域之上进近会趋于会产生漂浮效应，导致飞过预期的着陆点"},{"key":"B","text":"在一大片水体或者稠密植被的区域之上进近会趋于产生一个下沉效应，导致着陆在不到预期的着陆点"},{"key":"C","text":"在最后进近时，来自全无植被的地形的下降气流有时会产生下沉效应，导致飞过预期的着陆点"}],"answer":"B","analysis":"提示：一大片水体，不到预期着陆点\n解析：接近地面的对流气流会影响驾驶员操控的能力。在一大片水体或者稠密植被的区域之上进近时，地面的冷却效应，会产生下沉气流，导致飞机下沉，导致不警惕的飞行员着陆在不到预期的着陆点。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0671","type":"single","difficulty":1,"stem":"下列哪种属于动力对流冲击力？","options":[{"key":"A","text":"山坡迎风面对空气的抬升"},{"key":"B","text":"气温变化造成的空气抬升或下降"},{"key":"C","text":"气流符合辐散时造成的空气水平运动"}],"answer":"A","analysis":"提示：对流冲击-山坡抬升\n解析：动力对流冲击力指的是地形对气流的影响，如山坡迎风面对空气的抬升作用。气流被迫上升，形成对流，这是动力对流冲击力的典型表现。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0672","type":"single","difficulty":1,"stem":"气温的变化，会严重影响电动无人机的哪项性能？","options":[{"key":"A","text":"载荷性能"},{"key":"B","text":"速度性能"},{"key":"C","text":"续航性能"}],"answer":"C","analysis":"提示：气温影响电池活性-续航\n解析：首先，温度影响的是电池的续航能力。其次，对于无人机的锂电池来说，太冷、太热，续航均降低，常温最优。温度高（35℃）续航下降；温度低（0℃及以下）续航也下降。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0673","type":"single","difficulty":1,"stem":"在重要天气预告图上用黑色的断线围起来的区域，表示有（）。","options":[{"key":"A","text":"晴天积云"},{"key":"B","text":"西风急流"},{"key":"C","text":"晴空颠簸"}],"answer":"C","analysis":"提示：黑色颠簸\n解析：晴空颠簸(Clear Air Turbulence)在重要天气预告图（WAS）图上用黑色断线(虚线)围成区域表示。 这是国际通用的航空气象符号，用于提醒飞行员该区域可能存在无云情况下的气流颠簸。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0674","type":"single","difficulty":1,"stem":"下述何种天气现象是稳定大气的特征？","options":[{"key":"A","text":"能见度极好"},{"key":"B","text":"能见度较差"},{"key":"C","text":"有阵性降水"}],"answer":"A","analysis":"提示：天好万里无云，能见度好（本题与平流层对流层无关）\n解析：稳定大气条件下，大气层结稳定，不易发生对流和降水，因此能见度往往极好。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0675","type":"single","difficulty":1,"stem":"绝对温度的零度是（）。","options":[{"key":"A","text":"-273℃"},{"key":"B","text":"-273K"},{"key":"C","text":"-273℉"}],"answer":"A","analysis":"提示：温度找摄氏度，摄氏度℃。\n解析：在理想情况下，温度降低到这个点时，分子热运动达到最低极限，不能再继续降低。 所以开尔文温标把这个最低点规定为 0 K。 开尔文温标和摄氏温标的零点不同 ， 经过换算，0 K ≈ -273℃","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0676","type":"single","difficulty":1,"stem":"下面关于山谷风的叙述正确的是（）。","options":[{"key":"A","text":"气流越山而过，称为山风"},{"key":"B","text":"山谷风是由于海陆差异而形成的热力环流"},{"key":"C","text":"白天风由山谷吹向山坡"}],"answer":"C","analysis":"提示：白天上山坡\n解析：山谷风：白天山坡升温快，空气上升，风由山谷吹向山坡","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0677","type":"single","difficulty":1,"stem":"空气中容纳水汽的数量随气温变化，气温越高，则（）。","options":[{"key":"A","text":"可以容纳的水汽就越少"},{"key":"B","text":"当空气不能再容纳更多水汽时，温度就会变化"},{"key":"C","text":"可以容纳的水汽就越多"}],"answer":"C","analysis":"提示：气温高，水汽多\n解析：气温越高，则空气中能容纳的水汽量越多这是因为温度的升高会增加空气中的水分保持气态的能力，使得空气中可以包含更多的水汽而不凝结成液态水。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0678","type":"single","difficulty":1,"stem":"快速移动的冷锋受实际锋面后远处的强烈压力系统推动，在快速移动的冷锋之后，（）。","options":[{"key":"A","text":"阵风减缓和温度升高"},{"key":"B","text":"天空通常很快放晴"},{"key":"C","text":"可能出现乌云密布的天空和下雨"}],"answer":"B","analysis":"提示：快速冷风，快速放晴\n解析：快速移动的冷锋过后，由于冷空气取代了暖空气，天空通常很快放晴。这是因为冷空气通常较为干燥且稳定，不易形成云层因此天空会变得晴朗。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0679","type":"single","difficulty":1,"stem":"飞机的飞行性能主要受大气密度的影响，当实际大气密度大于标准大气密度时（）。","options":[{"key":"A","text":"空气作用于飞机上的力要加大，发动机推力减小"},{"key":"B","text":"空气作用于飞机上的力要减小，发动机推力增大"},{"key":"C","text":"空气作用于飞机上的力要加大，发动机推力增大"}],"answer":"C","analysis":"提示：密度↑→升力、阻力、推力均↑\n解析：飞机的飞行性能主要受大气密度的影响。当实际大气密度大于标准大气密度时，空气作用于飞机上的力(如升力和阻力)会加大，同时发动机推力也会增大，因为发动机吸入的空气密度更大，可以产生更多的推力。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0680","type":"single","difficulty":1,"stem":"大气压力的降低对飞机性能有显著的影响，在较高的高度，伴随着降低的大气压力（）。","options":[{"key":"A","text":"起飞和着陆距离会增加，爬升率会减小"},{"key":"B","text":"起飞和着陆距离会增加，爬升率也会增加"},{"key":"C","text":"起飞和着陆距离会减小，爬升率也会减小"}],"answer":"A","analysis":"提示：密度↓→离地速度↑→所需距离↑；功率↓→爬升率↓\n解析：在较高的高度，伴随着降低的大气压力空气密度减小，导致飞机的起飞和着陆距离增加，同时爬升率也会减小，因为飞机需要更多的时间来达到相同的爬升高度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0681","type":"single","difficulty":1,"stem":"对流层中的平均气温垂直递减率为（）。","options":[{"key":"A","text":"0.5℃/100 m"},{"key":"B","text":"6.5℃/100 m"},{"key":"C","text":"0.65℃/100 m"}],"answer":"C","analysis":"提示：100米 ↓ 0.65 ℃\n解析：气温随高度升高面降低。根据实际探测，对流层中的平均气温垂直递减率为0.65℃/100m。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0682","type":"single","difficulty":1,"stem":"平均而言，在对流层中每上升100米大气温度的变化是（）。","options":[{"key":"A","text":"下降0.65℃"},{"key":"B","text":"下降1℃"},{"key":"C","text":"下降0.75℃"}],"answer":"A","analysis":"提示：100米↓ 0.65 ℃\n解析：在对流层中，随着高度的增加，大气温度逐渐降低。平均每上升100米，大气温度下降约0.65℃。这是由于对流层大气的主要热源是地面辐射，随着高度增加，地面辐射的影响逐渐减弱。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0683","type":"single","difficulty":1,"stem":"严重危害飞行安全的冰雹通常与下列何种云有联系？","options":[{"key":"A","text":"堡状高积云"},{"key":"B","text":"普通雷暴"},{"key":"C","text":"强烈雷暴云"}],"answer":"C","analysis":"提示：强烈严重危害\n解析：冰雹的形成需要强烈的上升气流，把水滴反复带到高空冻结、增长，所以通常和发展旺盛的积雨云／强雷暴云有关。普通雷暴也可能有小冰雹，但“严重危害飞行安全的冰雹”一般对应的是强烈雷暴云。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0684","type":"single","difficulty":1,"stem":"风向为SE，那么风的来向为（）。","options":[{"key":"A","text":"西北"},{"key":"B","text":"西南"},{"key":"C","text":"东南"}],"answer":"C","analysis":"提示：SE→东南（ESWN东南西北）\n解析：气象上的风向指的风吹来的方向，也即风的来向。风向为 SE，表示风从 SE方向吹来。 S代表南，E代表东，即风的来向为东南。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0685","type":"single","difficulty":1,"stem":"西北风可以表示为（）。","options":[{"key":"A","text":"135°或SE"},{"key":"B","text":"200或NW"},{"key":"C","text":"315°或NW"}],"answer":"C","analysis":"提示：315NW→315喝西北风(ESWN东南西北)\n解析：风向通常用度数来表示，其中西北风对应的度数是315°。在气象学中，风向也可以用缩写来表示，NW即代表西北风。因此西北风可以表示为315°或NW。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0686","type":"single","difficulty":1,"stem":"按航空气象预报内容分类，以下不正确的是（）。","options":[{"key":"A","text":"气象要素预报"},{"key":"B","text":"天气形势预报"},{"key":"C","text":"大风降温预报"}],"answer":"C","analysis":"提示：选错的。大风降温\n解析：从航空气象角度，天气预报常按内容分为：气象要素预报：如风、温度、能见度等;天气形势预报：如高低压、气旋等天气系统演变;重要天气预报：如雷暴、低能见度、积冰、颠簸等。大风降温预报更像普通公众气象服务中的专项或灾害性天气预报，不是航空角度天气预报的标准分类。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0687","type":"single","difficulty":1,"stem":"在标准大气中，海平面上的气温和气压值是（）。","options":[{"key":"A","text":"15℃、1000 hPa"},{"key":"B","text":"0℃、760 mmHg"},{"key":"C","text":"15℃、1013.25 hPa"}],"answer":"C","analysis":"提示：15度1013\n解析：目前，由国际民航组织统一采用的标准海平面大气压力定义为29.92in.Hg(气压1013.25hPa)，海平面温度为59℉(15℃)。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0688","type":"single","difficulty":1,"stem":"使静止空气产生垂直运动的作用力，称为（）。","options":[{"key":"A","text":"热力作用力"},{"key":"B","text":"气动作用力"},{"key":"C","text":"对流冲击力"}],"answer":"C","analysis":"提示：垂直对流\n解析：使原来静止的空气产生垂直运动的作用力称为对流冲击力。这种力是由于地面受热不均或其他原因导致的空气垂直运动。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0689","type":"single","difficulty":1,"stem":"同一架无人机于某日中午和傍晚进行两次GPS高度200米的巡航飞行，地面基准气压相同的前提下，（）。","options":[{"key":"A","text":"中午的气压高度高"},{"key":"B","text":"傍晚的气压高度高"},{"key":"C","text":"中午和傍晚的气压高度一样高"}],"answer":"B","analysis":"提示：傍晚气压全天最低→气压高度表读数偏高 （气压越低的地方，高度越高，比如高原，空气稀薄，气压低，高度高）\n解析：2026年5月22日修改。根据“国家气象科学数据中心”“中国科学院科普云台”相关气压资料：气压是一个动态的物理量，它随时间的变化而不断调整。这种变化既包含周期性的波动，也包含非周期性的变化。周期性变化是指气压按照一定的时间规律进行波动。气压一般随高度升高按指数律递减。气压有日变化和年变化。一年之中，冬季比夏季气压高。在一昼夜之内，气压会呈现出明显的日变化。通常，上午9-10点会出现一天中的最高气压，随后气压逐渐下降，至下午15-16点时降至最低。之后，气压又逐渐回升，至21-22点时达到次高值，至次日凌晨3-4点则再次降至次低值。所以：· 中午，气压较高，同样的高度对应的气压高于“全天平均值”，此时气压高度表表示的高度偏低· 傍晚，气压全天最低，同样的高度对应的气压低于“全天平均值”，此时气压对应的高度读数偏高“气压高度” 指的是气压对应的高度，不是气压值本身。所以傍晚的气压高度计的高度高。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0690","type":"single","difficulty":1,"stem":"根据国际民航组织的规定，云满天时云量为（）。","options":[{"key":"A","text":"8"},{"key":"B","text":"10"},{"key":"C","text":"12"}],"answer":"A","analysis":"提示：满云8\n解析：本题考查国际民航组织(ICAO)的云量观测标准。ICAO 作为全球民航标准化权威机构，对云量观测采用八分量制，云量指云遮蔽天空的比例，分母固定为 8，“满天云” 记为 8/8。国际气象组织的规定，云满天时的云量为10。中国气象局采用12分量制，云满天时的云量为12。。不同的机构对满云的规定是不一样的，看准题干就行。民航运行中，云量是决定航班起降、巡航安全的关键气象要素（如低云量会影响能见度和跑道使用），因此全球民航从业人员必须严格遵循 ICAO 八分量制记录和报告云量，避免因标准混淆导致运行风险。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0691","type":"single","difficulty":1,"stem":"对流层的高度，在地球中纬度地区约为（）。","options":[{"key":"A","text":"16km"},{"key":"B","text":"11km"},{"key":"C","text":"8km"}],"answer":"B","analysis":"提示：中纬度对应中间选项，11\n解析：这是大气科学中的常识，对流层的高度会随着纬度和其他气象因素的变化而有所不同。国际气象组织（WMO）及全球学界共识：对流层高度随纬度变化，中纬度地区（30°-60°）因对流强度适中，平均高度约 10-12 km，11 km 为典型代表值。国内《大气科学名词》及高校气象教材均以此为标准表述，中国气象局业务规范也将 10-12 km 作为中纬度对流层垂直范围基准，故 11 km 是合理答案。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0692","type":"single","difficulty":1,"stem":"关于气流运动正确的说法是（）。","options":[{"key":"A","text":"因为空气总是寻找低压区域，所以气流会从高压区域向低压的区域流动"},{"key":"B","text":"因为空气总是寻找高压区域，所以气流会从低压区域向高压的区域流动"},{"key":"C","text":"是风产生了压力，所以风的尽头压力高"}],"answer":"A","analysis":"提示：空气找低压，高压流向低压\n解析：空气总是从高压区域流向低压区域，这是因为高压区域的空气分子密度大，压力大，会向压力低的区域扩散，形成气流。这是大气物理学的基本原理。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0693","type":"single","difficulty":1,"stem":"雷暴处于发展阶段时（）。","options":[{"key":"A","text":"地面气压持续下降"},{"key":"B","text":"地面气压持续上升"},{"key":"C","text":"地面气压保持不变"}],"answer":"A","analysis":"提示：上升气流→地面降压。雷暴发低气压。\n解析：雷暴处于发展阶段时，由于雷暴内部的上升气流和降水过程，地面气压会持续下降。这是雷暴发展阶段的典型特征，与地面气压持续上升或保持不变的情况不同。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0694","type":"single","difficulty":1,"stem":"平流层范围从对流层顶到大约55km的高度上，空气热量的主要来源是臭氧吸收太阳紫外辐射，因此（）。","options":[{"key":"A","text":"平流层中气温随高度增高而升高"},{"key":"B","text":"平流层中气温不随高度变化而变化"},{"key":"C","text":"平流层中不含有水汽"}],"answer":"A","analysis":"提示：平流层→臭氧吸收紫外线→高度↑温度↑\n解析：平流层范围从对流层顶到大约55km的高度上，其空气热量的主要来源是臭氧吸收太阳紫外辐射。因此，在平流层中，气温随高度增高而升高，这与对流层的气温随高度降低的特点形成鲜明对比。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0695","type":"single","difficulty":1,"stem":"在实际运用中，通常用气温垂直递减率，单位是（）。","options":[{"key":"A","text":"℃/1000m"},{"key":"B","text":"℃/500m"},{"key":"C","text":"℃/100m"}],"answer":"C","analysis":"提示：γ=0.65℃/100m\n解析：气温垂直递减率表示气温随高度升高而降低的快慢。在航空气象实际运用中，常用每升高100m气温降低多少摄氏度表示，单位为℃/100m。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0696","type":"single","difficulty":1,"stem":"气象上的风向是指（）。","options":[{"key":"A","text":"风的来向"},{"key":"B","text":"气压梯度力方向"},{"key":"C","text":"风的去向"}],"answer":"A","analysis":"提示：北风吹雪花飘，北风来自北边，冷，风的来时路\n解析：气象上的风向是指风的来向，即风从哪个方向吹来。这是气象观测和预报中的基本常识，也是飞行安全和气象服务中的重要参数。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0697","type":"single","difficulty":1,"stem":"气温对飞机最大平飞速度的影响为（）。","options":[{"key":"A","text":"气温低时，空气密度大，飞机发动机的推力增大，最大平飞速度增加"},{"key":"B","text":"气温低时，空气密度大，空气的阻力增加，最大平飞速度减小"},{"key":"C","text":"气温高时，空气密度小，空气的阻力减小，最大平飞速度增加"}],"answer":"A","analysis":"提示：气温低，全都大\n解析：气温对飞机最大平飞速度的影响表现为气温低时，空气密度大，飞机发动机的推力增大，因此最大平飞速度增加。相反气温高时，空气密度减小，推力减小，速度降低。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0698","type":"single","difficulty":1,"stem":"当在山谷、山脊或山区作低空飞行时，在什么时候最容易碰到乱流造成危险?","options":[{"key":"A","text":"在山的背风面顺风飞行"},{"key":"B","text":"在山的背风面逆风飞行"},{"key":"C","text":"在山的迎风面逆风飞行"}],"answer":"A","analysis":"提示：背顺\n解析：在山谷、山脊或山区作低空飞行时，最容易在山的背风面顺风飞行时碰到乱流造成危险。这是因为背风面顺风飞行时，飞机可能会进入山谷风或山风形成的乱流区域","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0699","type":"single","difficulty":1,"stem":"飞机在着陆时遇到顺风切变，会出现下述何种现象？","options":[{"key":"A","text":"飞机空速突然减小，升力减小，飞机将掉至正常下滑线以下"},{"key":"B","text":"飞机空速突然增大，升力增加，飞机抬升"},{"key":"C","text":"飞机高度下降，空速增大，超过正常着陆点着陆"}],"answer":"A","analysis":"提示：切变着陆，逆上顺下，\n解析：飞机在起飞或着陆时遇到顺风切变，空速突然减小，升力减小，飞机将掉至预定航线以下","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0700","type":"single","difficulty":1,"stem":"雷暴对飞机产生很大危害，下列危害不确切的是（）。","options":[{"key":"A","text":"数据链中断"},{"key":"B","text":"风切变和湍流"},{"key":"C","text":"雷击和冰雹袭击"}],"answer":"A","analysis":"提示：数据链中断因为设备坏了，跟雷暴无关\n解析：雷暴能产生对飞机危害很大的电闪雷击和冰雹袭击、风切变和湍流，使飞机颜簸、性能降低, 数据链中断属于技术或设备故障，不是雷暴直接导致的危害。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0701","type":"single","difficulty":1,"stem":"气象上把气温垂直递减率等于零（即γ=0）的气层称为（）。","options":[{"key":"A","text":"等温层"},{"key":"B","text":"不稳定气层"},{"key":"C","text":"逆温层"}],"answer":"A","analysis":"提示：γ=0，温度不变，等温\n解析：在气象学中，气温垂直递减率等于零的气层被称为等温层。这意味着在该气层中气温不随高度变化，保持恒定。逆温层是指气温随高度增加而升高的气层，不稳定气层则指气温垂直递减率较大的气层。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0702","type":"single","difficulty":1,"stem":"国际上对以下哪些能见度定义是正确的？","options":[{"key":"A","text":"烟雾的能见度定义为不足1km"},{"key":"B","text":"霾的能见度为3km-5km"},{"key":"C","text":"薄雾的能见度为1km-3km"}],"answer":"A","analysis":"提示：烟雾不足1\n解析：国际上对烟雾的能见度定义为不足1km薄雾的能见度为1-2km,霾的能见 度为2-5km。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0703","type":"single","difficulty":1,"stem":"气象学中，能见度常用气象光学视程表示，气象光学视程是指（）。","options":[{"key":"A","text":"白炽灯发出色温为2700K的平行光束的光通量，在大气中削弱至初始值的5%所通过的路径长度"},{"key":"B","text":"白炽灯发出色温为2500K的平行光束的光通量，在大气中削弱至初始值的5%所通过的路径长度"},{"key":"C","text":"白炽灯发出色温为3000K的平行光束的光通量，在大气中削弱至初始值的10%所通过的路径长度"}],"answer":"A","analysis":"提示：白炽2700\n解析：气象光学视程是能见度的标准化物理定义，用来表示光在大气中因散射和吸收而衰减的距离。按定义，它指色温为2700K的白炽灯发出的平行光束，其光通量在大气中削弱到初始值5%时所通过的路径长度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0704","type":"single","difficulty":1,"stem":"100米等于多少英尺?","options":[{"key":"A","text":"300英尺"},{"key":"B","text":"305英尺"},{"key":"C","text":"328英尺"}],"answer":"C","analysis":"提示：1米=3.28英尺\n解析：100米转换为英尺，根据国际单位换算标准1米等于3.28084英尺，因此100米等于328.084英尺，约等于328英尺。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0705","type":"single","difficulty":1,"stem":"60米大约相当于多少英尺?","options":[{"key":"A","text":"200英尺"},{"key":"B","text":"180英尺"},{"key":"C","text":"220英尺"}],"answer":"A","analysis":"提示：1米=3.28英尺 60*3.28=196.8≈200\n解析：1米 ≈ 3.2808英尺60 x 3.2808 = 196.848英尺题目问“大约”，在三个选项中 200英尺最接近。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0706","type":"single","difficulty":1,"stem":"大气是一种混合物，它由（）组成。","options":[{"key":"A","text":"空气和水汽凝结物"},{"key":"B","text":"空气和固体微粒"},{"key":"C","text":"空气、水汽及液体或固体杂质"}],"answer":"C","analysis":"提示：混合物有杂质\n解析：大气是一种混合物，它由空气、水汽及液体或固体杂质组成。这些成分共同构成了我们所说的大气，并对地球的气候和环境产生重要影响。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0707","type":"single","difficulty":1,"stem":"对流层因为空气有强烈的对流运动而得名，它的底界为地面，上界高度随纬度、季节、天气等因素而变化，同一地区对流层上界高度（）。","options":[{"key":"A","text":"冬季大于夏季"},{"key":"B","text":"夏季大于冬季"},{"key":"C","text":"冬季与夏季相同"}],"answer":"B","analysis":"提示：对流层，夏季>冬季\n解析：对流层上界高度夏季大于冬季。这是因为夏季地表温度高，空气受热上升，对流运动强烈，使得对流层上界升高;而冬季地表温度低，空气下沉，对流运动减弱，对流层上界降低。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0708","type":"single","difficulty":1,"stem":"飞机在雨层云上飞行，飞行员发现在浓密的云层有向上突起的云塔，顶部伸展到9000米以上的高空，被强劲的空中风吹的旬马鬃似地倒向一边，他可以断定，在层状云中一定有（）。","options":[{"key":"A","text":"积雨云"},{"key":"B","text":"高积云"},{"key":"C","text":"伪卷云"}],"answer":"A","analysis":"提示：雨层云，有雨有云\n解析：飞机在雨层云上飞行时，如果发现浓密的云层中有向上突起的云塔，且顶部伸展到9000米以上的高空，被强劲的空中风吹得像马鬃一样倒向一边，那么可以断定在层状云中一定有积雨云。积雨云是强对流天气的标志，常常伴随着强烈的降水、雷电大风等天气现象。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0709","type":"single","difficulty":1,"stem":"关于逆温层，下述何种说法正确?","options":[{"key":"A","text":"逆温层中空气密度小，有利于大型飞机飞行"},{"key":"B","text":"逆温层是稳定气层，其下能见度通常较差"},{"key":"C","text":"逆温层中温度随高度升高而降低"}],"answer":"B","analysis":"提示：逆温，高度升温度升，稳定杂质多，看不清，不利飞行\n解析：逆温层是指气温随高度增加而升高的气层这种结构稳定，不易产生对流，导致污染物不易扩散，因此其下能见度通常较差。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0710","type":"single","difficulty":1,"stem":"与逆温层相联系的大气候特征是（）。","options":[{"key":"A","text":"稳定的空气层"},{"key":"B","text":"不稳定的空气层"},{"key":"C","text":"高度升高温度降低"}],"answer":"A","analysis":"提示：逆温层，稳定\n解析：逆温层是指气温随高度增加而升高的气层，这种气温分布使得空气层变得稳定，抑制了对流运动的发展。因此，与逆温层相连系的大气候特征是稳定的空气层。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0711","type":"single","difficulty":1,"stem":"云外绕飞雷雨时，航空器距离积雨云（浓积云）夜间不得少于（）。","options":[{"key":"A","text":"5公里"},{"key":"B","text":"10公里"},{"key":"C","text":"15公里"}],"answer":"B","analysis":"提示：绕飞：昼5夜10\n解析：昼间不得少于 5 公里，夜间不得少于 10 公里；本题知识点出自《中国民用航空飞行规则》第一百七十九条：绕飞雷雨时，必须考虑到有转弯和退出的余地，并且应当遵守下列规定：（一）只准有雷达的航空器或者根据气象雷达探测的资料能够确切判明雷雨位置，方可在云中绕飞，但距离积雨云（浓积云）不得少于 20 公里；（二）只准机舱有增压或者氧气设备和具有相应升限的航空器，从上面绕飞；（三）只准在安全高度以上，偏离航线不超过导航设施的有效半径范围内绕飞（有惯性导航设备的航空器除外）；云外绕飞时，距离积雨云（浓积云）昼间不得少于 5 公里，夜间不得少于 10 公里；两个云体之间不少于 20 公里时，方可从中间通过；","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0712","type":"single","difficulty":1,"stem":"在对流层内，空气的温度（）。","options":[{"key":"A","text":"随高度增加保持不变"},{"key":"B","text":"随高度增加而升高"},{"key":"C","text":"随高度增加而降低"}],"answer":"C","analysis":"提示：对流层，高度升温度降 平流层，高度升温度升\n解析：在对流层内，空气的温度随高度的增加而降低。这是因为对流层是大气层中最低的一层，其中包含了大量的水汽和尘埃，这些物质在吸收太阳辐射后会释放出热量但随着高度的增加，这些物质的含量减少，导致温度逐渐降低。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0713","type":"single","difficulty":1,"stem":"在大气层内，大气压强（）。","options":[{"key":"A","text":"随高度增加而减小"},{"key":"B","text":"随高度增加而增加"},{"key":"C","text":"在同温层内随高度增加保持不变"}],"answer":"A","analysis":"提示：海拔高，密度低，气压低\n解析：在大气层内，随着高度的增加，大气压逐渐降低，导致大气密度也随之减小。这是因为随着海拔的升高，空气分子间的距离增大，从而使得密度减小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0714","type":"single","difficulty":1,"stem":"在大气层内，大气密度（）。","options":[{"key":"A","text":"随高度增加而减小"},{"key":"B","text":"随高度增加而增加"},{"key":"C","text":"在同温层内随高度增加保持不变"}],"answer":"A","analysis":"提示：海拔高，密度低，要吸氧\n解析：在重力作用下，越靠近地面，上方空气柱的重量越大，空气受到的压缩越强，因此密度较大；高度增加后，大气压力降低，空气密度随之减小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0715","type":"single","difficulty":1,"stem":"气象台观测的风向是180，飞机起飞着陆时的最佳方向是（）。","options":[{"key":"A","text":"由北朝南"},{"key":"B","text":"由南朝北"},{"key":"C","text":"由西向东"}],"answer":"A","analysis":"提示：180度，南风，机场最好是逆风起飞，所以由北朝南\n解析：气象台观测的风向是180度，表示风从正南方吹来(风向以度数表示，0度为北风，180度为南风)。飞机起飞和着陆的最佳方向是逆风，因为逆风能增加机翼升力，缩短滑跑距离并提高操控性。因此，若风向为180度(南风)，飞机应选择由北朝南的方向起飞或着陆，以迎风而行。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0716","type":"single","difficulty":1,"stem":"下列何种性质描述了气团的特征?","options":[{"key":"A","text":"能形成结构不同的云"},{"key":"B","text":"能覆盖大片地区，温度和湿度等特征性相对均匀"},{"key":"C","text":"气团内部各地天气差异很大"}],"answer":"B","analysis":"提示：气团特征：大大小， 气团内部都差不多，相对均匀\n解析：气团是覆盖大片地区，温度和湿度等特征性相对均匀的大块空气。它能形成相对一致的天气，而内部各地的天气差异不大。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0717","type":"single","difficulty":1,"stem":"下列何种情况说明了飞机从一种气团斡旋进入了另一种气团?","options":[{"key":"A","text":"飞过山区时碰上了扰动气流"},{"key":"B","text":"穿过了高空急流"},{"key":"C","text":"在短时间内温度和风向都有明显变化"}],"answer":"C","analysis":"提示：斡旋→时间短\n解析：飞机在短时间内温度和风向都有明显变化，通常说明它从一种气团进入了另一种性质不同的气团。因为气团是水平和垂直方向上温度和湿度等特性相对均匀的大块空气，其特性在短时间内不会有显著变化。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0718","type":"single","difficulty":1,"stem":"在卫星云图上，表现为白色、光滑边缘整齐的云是（）。","options":[{"key":"A","text":"积云群"},{"key":"B","text":"中云"},{"key":"C","text":"积雨云"}],"answer":"C","analysis":"提示：积雨云，边缘光滑\n解析：在卫星云图上，积雨云通常表现为白色、光滑且边缘整齐的云系。这是因为积雨云内部水汽充沛，云顶高度高，且云体密集，因此在卫星云图上呈现出明显的白色和光滑的边缘。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0719","type":"single","difficulty":1,"stem":"下述何种情况说明飞机是在气团内部飞行?","options":[{"key":"A","text":"飞行了很长时间下面仍然是广阔的海洋"},{"key":"B","text":"飞行了很长时间气象条件变化不大"},{"key":"C","text":"飞行中穿过了层状云系"}],"answer":"B","analysis":"提示：气团大大小，稳定不变化\n解析：气团是水平和垂直方向上温度和湿度等特性相对均匀的大块空气。飞机在气团内部飞行时，气象条件变化不大。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0720","type":"single","difficulty":1,"stem":"在北半球，一个飞行员作由西向东的长途飞行，在下面何种情况下，他将有可能碰到因气压系统而形成的顺风?","options":[{"key":"A","text":"在高压系统和低压系统南侧"},{"key":"B","text":"在高压系统南侧和低压系统北侧"},{"key":"C","text":"在高压系统北侧和低压系统南侧"}],"answer":"C","analysis":"提示：东西南北 ¦ 北南西东\n解析：在北半球，高压系统气流呈顺时针旋转南侧为东风;低压系统气流呈逆时针旋转，南侧为西风。因此，飞行员由西向东飞行时，在高压系统北侧和低压系统南侧可能遇到顺风。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0721","type":"single","difficulty":1,"stem":"在北半球，一个飞行员作由东向西的长途飞行，在下面何种情况下，他将有可能碰到因气压系统而形成的顺风?","options":[{"key":"A","text":"在高压系统和低压系统北侧"},{"key":"B","text":"在高压系统北侧和低压系统南侧"},{"key":"C","text":"在高压系统南侧和低压系统北侧"}],"answer":"C","analysis":"提示：东西南北 ¦ 北南西东\n解析：在北半球，高压系统气流呈顺时针旋转，北侧为西风;低压系统气流呈逆时针旋转，北侧为东风。因此，飞行员由东向西飞行时，在高压系统南侧和低压系统北侧可能遇到顺风。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0722","type":"single","difficulty":1,"stem":"在北半球6000米的高度由高压区飞向低压区，航线上应吹成的（）。","options":[{"key":"A","text":"顺风"},{"key":"B","text":"右侧风"},{"key":"C","text":"左侧风"}],"answer":"C","analysis":"提示：北，左高右低\n解析：在北半球，高压区气流呈顺时针旋转，低压区气流呈逆时针旋转。从高压区飞向低压区，航线将穿过逆时针旋转的气流，因此在北半球6000米高度应吹成左侧风。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0723","type":"single","difficulty":1,"stem":"在北半球摩擦层中，低压区的风向为（）。","options":[{"key":"A","text":"逆时针向外旋转"},{"key":"B","text":"逆时针向内旋转"},{"key":"C","text":"顺时针向内旋转"}],"answer":"B","analysis":"提示：北低，逆内\n解析：在北半球的摩擦层中，由于地球自转产生的科里奥利力影响，低压区的风向会呈现逆时针向内旋转的特点。这是因为空气从高压流向低压时，受到地球自转偏向力的影响。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0724","type":"single","difficulty":1,"stem":"在北半球与低压区有关的空气环流是（）。","options":[{"key":"A","text":"向内、向上和沿反时针方向"},{"key":"B","text":"向外、向上和沿顺时针方向"},{"key":"C","text":"向外、向下和沿顺时针方向"}],"answer":"A","analysis":"提示：北半球内向\n解析：在北半球，与低压区有关的空气环流是向内、向上和沿反时针方向。这是因为低压区中心气压低，周围空气向中心流动，并在科里奥利力作用下形成逆时针旋转的气流。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0725","type":"single","difficulty":1,"stem":"在大风中自驾飞行的固定翼民用无人机，航线左转90度，（）。","options":[{"key":"A","text":"顺风左转90度，转出的弯大"},{"key":"B","text":"逆风左转90度，转出的弯大"},{"key":"C","text":"逆风、顺风左转90度，转出的弯一样大"}],"answer":"A","analysis":"提示：顺大逆小\n解析：在大风中，无人机受到风的影响。顺风时，无人机与风的相对速度减小，转弯半径增大;逆风时，相对速度增加，转弯半径减小。因此，顺风左转90度，转出的弯大","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0726","type":"single","difficulty":1,"stem":"以下哪几种仪表可以判断和识别低空风切?","options":[{"key":"A","text":"空速表、油量表、升降速度表、俯仰姿态指示器"},{"key":"B","text":"风速表、高度表、升降速度表、俯仰姿态指示器"},{"key":"C","text":"空速表、高度表、升降速度表、俯仰姿态指示器"}],"answer":"C","analysis":"提示：空腹高升（空俯高升）（无油）\n解析：低空风切变是指低空风的速度和方向发生急剧变化的现象。空速表可以显示飞机相对于空气的速度，高度表显示飞机的高度，升降速度表显示飞机的垂直速度，俯仰姿态指示器显示飞机的俯仰角度，这些仪表共同使用可以帮助识别和判断低空风切变。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0727","type":"single","difficulty":1,"stem":"在锋面两侧，下面何种气象要素的差异最大?","options":[{"key":"A","text":"风速"},{"key":"B","text":"气压"},{"key":"C","text":"气温"}],"answer":"C","analysis":"提示：气温带来气压差，气温是根本\n解析：锋面是冷暖气团之间的过渡带，两侧气温差异最大，气压和风速也会有所不同，但气温的差异最为显著，因为锋面的形成主要就是由于气温的差异导致的。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0728","type":"single","difficulty":1,"stem":"在可见光云图上，下面何种天气系统呈现出螺旋状云系?","options":[{"key":"A","text":"活跃的冷锋"},{"key":"B","text":"成熟的气旋"},{"key":"C","text":"高空槽"}],"answer":"B","analysis":"提示：台风-成熟了\n解析：在可见光云图上，成熟的气旋由于其旋转的气流结构，会呈现出螺旋状的云系。活跃的冷锋通常表现为线状云带，而高空槽则表现为槽线状的云系。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0729","type":"single","difficulty":1,"stem":"在夏季暖气团不稳定时，在冷锋的层状云系中可产生（）。","options":[{"key":"A","text":"层状云"},{"key":"B","text":"锋面雾"},{"key":"C","text":"积雨云"}],"answer":"C","analysis":"提示：气团不稳定，有雨。\n解析：在夏季暖气团不稳定时，冷锋的层状云系中由于上升气流强烈，水汽充沛，容易形成积雨云。积雨云是雷雨云的成熟阶段常伴有强烈的雷电、暴雨和阵风，对飞行安全构成威胁。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0730","type":"single","difficulty":1,"stem":"国际标准大气的定义是什么?","options":[{"key":"A","text":"海平面附近常温常压下空气的密度"},{"key":"B","text":"对流层附近常温常压下空气的密度"},{"key":"C","text":"地表层附近常温常压下空气的密度"}],"answer":"A","analysis":"提示：标准大气→海平面\n解析：国际标准大气的定义是海平面附近常温常压下空气的密度。以海平面的大气状态作为标准参考，便于在不同条件下对飞行器的性能和相关参数进行统一衡量和计算。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0731","type":"single","difficulty":1,"stem":"飞机升力的大小与（）。","options":[{"key":"A","text":"空气密度成正比"},{"key":"B","text":"空气密度无关"},{"key":"C","text":"空气密度成反比"}],"answer":"A","analysis":"提示：密度大，升力大，成正比\n解析：飞机升力的大小与空气密度有着直接的关系。根据伯努利定理和升力产生的原理，飞机升力是由于机翼上下表面的气流速度差异而产生的。而空气密度越大，相同速度下的气流产生的动压也越大，从而导致升力增加。因此，飞机升力的大小与空气密度成正比。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0732","type":"single","difficulty":1,"stem":"假设其他条件不变，空气湿度大（）。","options":[{"key":"A","text":"空气密度大，起飞滑跑距离长"},{"key":"B","text":"空气密度小，起飞滑跑距离长"},{"key":"C","text":"空气密度大，起飞滑跑距离短"}],"answer":"B","analysis":"提示：湿度大，密度小 湿度大，脚滑，起飞距离长\n解析：空气湿度大通常导致空气密度小，飞机获得的升力减小，起飞滑跑距离变长。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0733","type":"single","difficulty":1,"stem":"下列叙述不属于平流层的特点是（）。","options":[{"key":"A","text":"空气中的风向、风速不变"},{"key":"B","text":"温度大体不变，平均在-56.5℃"},{"key":"C","text":"空气上下对流激烈"}],"answer":"C","analysis":"提示：平流→上下不对流\n解析：平流层中空气上下对流很弱，不是激烈平流层的主要特点是气流平稳。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0734","type":"single","difficulty":1,"stem":"下列叙述属于平流层的特点是（）。","options":[{"key":"A","text":"空气中几乎没有水蒸气"},{"key":"B","text":"空气没有上下对流"},{"key":"C","text":"高度升高气温下降"}],"answer":"B","analysis":"提示：平流→上下不对流\n解析：平流层的特点包括空气没有上下对流，气流平稳。平流层中的臭氧层吸收太阳紫外线，使得高度升高气温升高，而不是下降，平流层中并非几乎没有水蒸气，只是含量相对较少。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0735","type":"single","difficulty":1,"stem":"现代民航客机一般巡航的大气层是（）。","options":[{"key":"A","text":"对流层顶层、平流层底层"},{"key":"B","text":"平流层顶层"},{"key":"C","text":"对流层底层"}],"answer":"A","analysis":"提示：民航客机，两个之间 （对流顶 平流底）\n解析：现代民航客机一般巡航在对流层顶层、平流层底层。在这个高度范围，大气条件相对稳定，气流较为平稳，气象条件相对较好，有利于飞行的安全和舒适。同时，这个高度的空气阻力较小，能够提高飞行效率，降低燃油消耗。 平流层顶层的高度过高，不适合民航客机常规巡航。对流层底层气象条件复杂，气流不稳定，不利于民航飞行。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0736","type":"single","difficulty":1,"stem":"在温度不变情况下，空气的密度（）。","options":[{"key":"A","text":"与压力成正比"},{"key":"B","text":"与压力成反比"},{"key":"C","text":"与压力无关"}],"answer":"A","analysis":"提示：空气密度与压力成正比 密度大，压力大\n解析：温度不变时，空气被压缩，压力增大，体积减小，密度增大，与压力成正比。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0737","type":"single","difficulty":1,"stem":"飞机在对流层中匀速爬升时，随着飞行高度的增加，飞机飞行马赫数（）。","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"逐渐增加"},{"key":"C","text":"逐渐减小"}],"answer":"B","analysis":"提示：马赫增加\n解析：马赫数 = 飞行速度 ÷ 当地声速飞行速度：匀速爬升时，飞行速度不变；当地声速：指的是飞机飞行到不用高度是，对应的声速。 （声速靠温度变化：声音靠空气传播，温度越低，空气分子运动越平缓，声音传播越慢，声速越小。）对应本题条件：对流层的特点就是 “高度越高，温度越低”，所以随着飞机爬升，当地声速会逐渐减小，也导致在飞行速度不变的情况下，由于声速越来越小，马赫数逐步增加。马赫数 = 飞行速度 （不变）÷ 当地声速（逐渐减小）导致马赫数逐渐增加","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0738","type":"single","difficulty":1,"stem":"同架同样重量的飞机（）。","options":[{"key":"A","text":"在高原机场降落比在平原机场降落需要的跑道短"},{"key":"B","text":"在高原机场降落比在平原机场降落需要的跑道长"},{"key":"C","text":"在高原机场降落和在平原机场降落需要的跑道一样长"}],"answer":"B","analysis":"提示：高原高，空气密度低，滑行长（湿度高密度低滑行长）\n解析：在高原机场降落相比在平原机场降落，飞机需要的跑道会更长。这是因为高原机场的海拔较高，空气密度较低，导致飞机的升力减小。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0739","type":"single","difficulty":1,"stem":"无人机积水道面上起飞，其起飞距离比正常情况下（）。","options":[{"key":"A","text":"长"},{"key":"B","text":"短"},{"key":"C","text":"相等"}],"answer":"A","analysis":"提示：积水脚滑，距离长\n解析：首先，积水会导致跑道表面湿滑，轮胎与地面的摩擦力减小，导致起飞时需要更长的距离才能达到足够的起飞速度。其次，积水还会产生额外阻力，进一步降低加速性能。因此，相比正常情况下的起飞距离，积水道上的起飞距离会更长。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0740","type":"single","difficulty":1,"stem":"从地球表面到外层空间,大气层依次是（）。","options":[{"key":"A","text":"对流层，平流层、电离层、中间层和散逸层"},{"key":"B","text":"对流层、中间层、平流层、电离层和散落层"},{"key":"C","text":"对流层、平流层、中间层、电离层和散逸层"}],"answer":"C","analysis":"提示：中间层在中间\n解析：从地球表面到外层空间，大气层依次是对流层、平流层、中间层、电离层和散逸层这是大气科学中的基本常识，各层具有不同的特性和功能。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0741","type":"single","difficulty":1,"stem":"对于空气密度如下说法正确的是（）。","options":[{"key":"A","text":"空气密度正比于压力和绝对温度"},{"key":"B","text":"空气密度正比于压力，反比于绝对温度"},{"key":"C","text":"空气密度反比于压力，正比于绝对温度"}],"answer":"B","analysis":"提示：密度正压反温\n解析：空气密度正比于压力，反比于绝对温度。这是理想气体状态方程的基本内容，也是大气科学中的常识。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0742","type":"single","difficulty":1,"stem":"使用多旋翼飞行器在低温及潮湿环境中作业时的注意事项，不包括( )。","options":[{"key":"A","text":"曝光偏差"},{"key":"B","text":"起飞前动力电池的保温"},{"key":"C","text":"飞行器与摄像器材防止冰冻"}],"answer":"A","analysis":"提示：曝光与低温无关\n解析：使用多旋翼飞行器在低温及潮湿环境中作业时，需要注意起飞前动力电池的保温、飞行器与摄像器材防止冰冻等问题，以确保设备正常运作。曝光偏差与这种特定环境无直接关联。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0743","type":"single","difficulty":1,"stem":"飞行场当地气温的变化，主要会影响以下哪种无人机的传感器？","options":[{"key":"A","text":"磁罗盘"},{"key":"B","text":"速率陀螺"},{"key":"C","text":"气压高度计"}],"answer":"C","analysis":"提示：气温影响气压\n解析：飞行场当地气温的变化主要会影响气压高度计的读数。气压高度计通过测量大气压力来推算高度，而气温的变化会影响大气压力，从而影响气压高度计的准确性。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0744","type":"single","difficulty":1,"stem":"同一起飞重量的不同民用无人机系统航线飞行，一般（）的受风的影响小。","options":[{"key":"A","text":"巡航速度适中"},{"key":"B","text":"巡航速度小"},{"key":"C","text":"巡航速度大"}],"answer":"C","analysis":"提示：速度大，风的影响小（飞的越快，推力越大，阻力相对影响越小）\n解析：在相同起飞重量和航线条件下，巡航速度大的无人机受风的影响相对较小。这是因为较快的巡航速度能够更快地穿越风区，减少风对飞行轨迹的影响。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0745","type":"single","difficulty":1,"stem":"无人机飞行员在操纵飞机平飞时，遇到强烈的垂直上升气流时，为了防止过载超规定应（）。","options":[{"key":"A","text":"适当减小飞行速度"},{"key":"B","text":"加大油门迅速脱离"},{"key":"C","text":"以最大上升率增大高度"}],"answer":"A","analysis":"提示：减速保平安（上升气流，减速）\n解析：在遇到强烈的垂直上升气流时，无人机飞行员应适当减小飞行速度，以防止过载超过规定。加大油门迅速脱离可能导致过载，而以最大上升率增大高度也可能增加过载风险。适当减小速度是最安全的应对措施。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0746","type":"single","difficulty":1,"stem":"一定质量的气体具有下列特性（）。","options":[{"key":"A","text":"压力不变时，体积和温度成反比"},{"key":"B","text":"体积不变时，压力和温度成正比"},{"key":"C","text":"温度不变时，压力与体积成正比"}],"answer":"B","analysis":"提示：体积不变，压温正\n解析：PV = nRT，体积不变时，压力和温度成正比压力不变时，体积与温度成正比温度不变时，压力与体积成反比","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0747","type":"single","difficulty":1,"stem":"不属于云对安全飞行产生不利影响的原因是( )。","options":[{"key":"A","text":"影响正常的目测"},{"key":"B","text":"温度低造成机翼表面结冰"},{"key":"C","text":"增加阻力"}],"answer":"C","analysis":"提示：云阻力忽略不计\n解析：云对安全飞行的不利影响主要有：1、影响目测和能见度2、可能造成结冰3、可能伴随颠簸、雷暴等危险天气飞机阻力主要由速度、迎角、外形、空气密度等决定，“增加阻力”不是云对安全飞行产生不利影响的主要原因。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0748","type":"single","difficulty":1,"stem":"如果在机场中只有一条跑道，其跑道使用方向应保证航空器能够（）。","options":[{"key":"A","text":"逆风起降"},{"key":"B","text":"侧风起降"},{"key":"C","text":"顺风起降"}],"answer":"A","analysis":"提示：逆风起降\n解析：起降都应逆风1.逆风可以减小起降滑跑距离，提升操纵安全性。2.按照国家机场选址要求，跑道走向要考虑当地主导风向进行布置，尽量让飞机能够逆风起飞和降落。3.经济考量，逆风起降跑道短，占地少工程量少","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0749","type":"single","difficulty":1,"stem":"哪一类作业的气象无人机在控制成本的情况下，允许单次使用不回收？","options":[{"key":"A","text":"旱涝灾害评估"},{"key":"B","text":"人工催化播撒降雨"},{"key":"C","text":"强对流云直接探测"}],"answer":"C","analysis":"提示：强对流单次\n解析：强对流云探测任务通常需要无人机进入极端天气环境（如雷暴、强对流云团）内部采集数据。无人机可能无法安全返回，因此设计上允许一次性使用、不回收。人工降雨虽然风险较高，但多为可控飞行，回收无人机仍是常规操作。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0750","type":"single","difficulty":1,"stem":"冷锋是指（）。","options":[{"key":"A","text":"冷气团主动向暖气团移动形成的锋称为冷锋"},{"key":"B","text":"一侧气团温度明显低于另一侧气团温度的锋"},{"key":"C","text":"温度较高与温度较低的两个气团交汇时，温度低的一侧"}],"answer":"A","analysis":"提示：冷锋主动\n解析：冷锋的核心定义在于“主动移动”的方向，即冷气团起主导作用，主动推进并挤压暖气团，迫使暖气团抬升。这种主动移动的特征，是区分冷锋与暖锋、准静止锋的关键标志。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0751","type":"single","difficulty":1,"stem":"离开源地移至与源地性质不同的下垫面时，气团的物理属性逐渐发生变化，这个过程称为气团的变性。一般说来（）。","options":[{"key":"A","text":"冷气团移到暖的地区变性快，而暖的气团移到冷的地区变性慢"},{"key":"B","text":"冷气团移到暖的地区变性慢，而暖的气团移到冷的地区变性快"},{"key":"C","text":"暖气团移到暖的地区，冷气团移到冷的地区不变性"}],"answer":"A","analysis":"提示：冷→暖 变性快，暖→冷 变性慢\n解析：当冷气团离开源地后，气团低层要变暖、增温，逐渐趋于不稳定，对流易发展。能很快地把低层的热量和水汽向上输送，所以，气团变性快；相反，当暖气团离开源地后，气团低层不断变冷，逐渐趋于稳定，对流不易发展，所以气团变性较慢。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0752","type":"single","difficulty":1,"stem":"同一架民用无人机于冬季与夏季在同一块飞行场地地面检测，哪一种高度会变化？","options":[{"key":"A","text":"GPS高度"},{"key":"B","text":"本场相对高度"},{"key":"C","text":"气压高度"}],"answer":"C","analysis":"提示：季节变化气压高度\n解析：GPS 高度依卫星测绝对高度，不受环境影响；本场相对高度以起飞地为基准，基准不变则数值不变。气压高度靠气压传感器换算，夏季气温高、气压低，换算值更高；冬季气温低、气压高，换算值更低，故随季节变化。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0753","type":"single","difficulty":1,"stem":"在飞行中遇到飞机积冰时 ，驾驶员应注意（）。","options":[{"key":"A","text":"柔和操纵飞机 ，保持飞行高度和平飞姿态 ，尽快脱离积冰区"},{"key":"B","text":"及时有力地修正飞行姿态的偏差 ，尽快脱离积冰区"},{"key":"C","text":"调整飞机马力 ，严格保持飞行高度和速度 ，尽快脱离积冰区"}],"answer":"A","analysis":"提示：柔和脱离\n解析：积冰会改变飞机关键部位气动外形，冰层附着力也可能不均。柔和操纵能避免动作粗暴导致冰层脱落或破坏气动平衡，减少载荷波动，防止加剧失速风险，确保脱离前飞行状态可控。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0754","type":"single","difficulty":1,"stem":"白天，在太阳辐射作用下，山岩地、沙地、城市地区比水面、草地、林区、农村升温快，其上 空气受热后温度高于周围空气 ，因而体积膨胀、密度减小，使浮力大于重力而产生上升运动。这种现象会引起（）。","options":[{"key":"A","text":"压差作用力"},{"key":"B","text":"温差作用力"},{"key":"C","text":"热力对流冲击力"}],"answer":"C","analysis":"提示：受热不均热对流\n解析：地表受热不均，导致空气冷热差异，进而引发空气垂直上升运动，属于典型的热力对流。受热空气上升、周围冷空气补充，形成的冲击力即为热力对流冲击力，其动力来源是太阳辐射造成的地表与空气间的热量差异。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0755","type":"single","difficulty":1,"stem":"哪种气流对无人机的长航时飞行有利?","options":[{"key":"A","text":"稳定的逆风"},{"key":"B","text":"稳定的上升气流"},{"key":"C","text":"稳定的下降气流"}],"answer":"B","analysis":"提示：稳定上升最省力\n解析：稳定的上升气流能直接为无人机提供向上的升力，抵消部分重力。这使得无人机无需消耗额外电能维持高度，甚至可借助气流爬升，大幅降低动力系统负载，减少电量消耗，从而显著延长续航时间，是长航时无人机（如气象探测型）优先寻找的气流类型。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0756","type":"single","difficulty":1,"stem":"能见度不好的天气，一般风力（）。","options":[{"key":"A","text":"较强"},{"key":"B","text":"较弱"},{"key":"C","text":"混乱"}],"answer":"B","analysis":"提示：风力弱能见度低\n解析：风力较弱时，空气流动慢，水汽、尘埃、污染物等难以扩散，易在近地面积聚，导致能见度下降。像雾的形成通常需要风力小于2级，霾的维持也依赖弱风，强风会快速吹散这些物质，反而改善能见度。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0757","type":"single","difficulty":1,"stem":"地球自转偏向力使得气流向右偏转，因此在北纬30度到赤道之间产生（）方向的信风。","options":[{"key":"A","text":"东南方向"},{"key":"B","text":"东北方向"},{"key":"C","text":"西南方向"}],"answer":"B","analysis":"提示：凉风有信，信风冷风，东北风\n解析：从副热带高气压带吹向赤道低气压带,就是信风,北半球为东北信风；南半球为东南信风。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0758","type":"single","difficulty":1,"stem":"在下述何种情况下容易碰到风切变？","options":[{"key":"A","text":"当风速大于65千米/小时"},{"key":"B","text":"有高气压时"},{"key":"C","text":"逆温层附近或靠近雷暴时"}],"answer":"C","analysis":"提示：靠近雷暴风切变\n解析：逆温层会阻碍空气垂直运动，导致上下层风速、风向差异显著，形成风切变；雷暴系统中存在强烈的上升下沉气流，气流剧烈变化易引发风切变，这两种情况都是风切变的高发场景。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0759","type":"single","difficulty":1,"stem":"在山谷飞行时，应该采取的措施是（）。","options":[{"key":"A","text":"靠近背风坡飞行"},{"key":"B","text":"靠近迎风坡飞行"},{"key":"C","text":"飞出山口马上转弯"}],"answer":"B","analysis":"提示：山谷飞行迎风坡\n解析：因为迎风坡一侧气流通常较稳定，上升气流较强且可预测；而背风坡易出现湍流、下降气流甚至“滚轴云”等危险现象，飞出山口立即转弯则易陷入侧向风切变或涡流。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0760","type":"single","difficulty":1,"stem":"在处于雷暴区边缘的机场起飞或着陆时，要特别注意的危险天气是（）。","options":[{"key":"A","text":"低空风切变"},{"key":"B","text":"冰雹和暴雨"},{"key":"C","text":"积冰和雷击"}],"answer":"A","analysis":"提示：雷暴边缘风切变\n解析：低空风切变是指近地面600米以下高度风向、风速发生突然变化的现象，尤其在雷暴边缘最为常见和危险。它会导致飞机在起飞或着陆阶段出现升力骤变、高度失控、空速突变等情况，飞行员若反应不及，极易引发飞行事故。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0761","type":"single","difficulty":1,"stem":"现有民用无人机多数在大气的哪一层内运行？","options":[{"key":"A","text":"对流层"},{"key":"B","text":"平流层"},{"key":"C","text":"热层"}],"answer":"A","analysis":"提示：无人机飞对流层\n解析：民用无人机的主要用途集中在航拍、测绘、物流、巡检等领域，不需要到达过高的高度。对流层是大气最底层，高度从地面延伸至约8-18 公里，几乎包含了所有的水汽和天气现象，完全能满足民用无人机的作业需求。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0762","type":"single","difficulty":1,"stem":"对飞机飞行安全性影响最大的阵风是（）？","options":[{"key":"A","text":"上下垂直于飞行方向的阵风"},{"key":"B","text":"左右垂直于飞行方向的阵风"},{"key":"C","text":"沿着飞行方向的阵风"}],"answer":"A","analysis":"提示：影响安全上下风\n解析：上下垂直阵风会瞬间改变飞机迎角，导致升力骤变，易引发失速、过载或高度突变，尤其在起降阶段威胁最大，故对飞行安全性影响最显著。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0763","type":"single","difficulty":1,"stem":"锋是三度空间的天气系统。锋的宽度同气团宽度相比显得很狭窄，因而常把锋区看成一个几何面，称为锋面。下面描述错误的是？","options":[{"key":"A","text":"锋面与地面的交线称为锋线"},{"key":"B","text":"锋面和锋线统称为锋"},{"key":"C","text":"凡伸到对流层中上层者，称为层流锋"}],"answer":"C","analysis":"提示：选错的。层流锋×\n解析：凡伸到对流层中上层者，称为对流层锋（对流层+锋），而非 “层流锋”。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0764","type":"single","difficulty":1,"stem":"地面风具有明显日变化的主要原因是什么？","options":[{"key":"A","text":"气压的变化"},{"key":"B","text":"摩擦力的变化"},{"key":"C","text":"乱流强度的变化"}],"answer":"A","analysis":"提示：地面风气压变\n解析：地面风具有明显日变化的主要原因是受太阳辐射的气温变化和气压变化。白天地表受热，空气膨胀上升，近地面减压，形成向陆或向上的气压梯度；夜间冷却，空气下沉增压，梯度反向，从而主导地面风的明显日变化。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0765","type":"single","difficulty":1,"stem":"飞机按气压式高度表指示的一定高度飞行 ，在飞向低压区时 ，飞机的实际高度将（）。","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"逐渐升高"},{"key":"C","text":"逐渐降低"}],"answer":"C","analysis":"提示：飞向低压高度降低\n解析：气压式高度表通过测量外界大气压力来显示高度，其基准是 “气压随高度升高而降低”。飞向低压区时，外界大气压力比高度表预设的基准压力更低，表上显示的高度会 “偏高”，但实际大气压力对应的真实高度其实在下降，导致飞机实际高度逐渐降低。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0766","type":"single","difficulty":1,"stem":"在温暖的天气飞行在较低高度 ，有时会遇上湍流空气 ，以下描述正确的是（）？","options":[{"key":"A","text":"很可能在路面和荒地上空发生上升气流"},{"key":"B","text":"在类似成片树林的广阔植被区域发生上升气流"},{"key":"C","text":"在大片水体区域发生上升气流"}],"answer":"A","analysis":"提示：荒地湍流\n解析：路面、荒地等地表比热容小，温暖天气下吸收太阳辐射后升温快，会加热上方空气。热空气密度变小，会向上运动形成上升气流，这种情况在低高度飞行时易出现，也是该区域产生湍流的原因之一。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0767","type":"single","difficulty":1,"stem":"大气稳定度指整层空气的稳定程度，有时也称大气垂直稳定度。 以下列哪种运动来判定？","options":[{"key":"A","text":"以大气的气温垂直加速度运动来判定"},{"key":"B","text":"以大气的气温垂直速度运动来判定"},{"key":"C","text":"以大气的气压垂直速度运动来判定"}],"answer":"A","analysis":"提示：稳定 加速度\n解析：大气稳定度核心是看空气受扰动后的运动趋势，而非当前速度。空气块因扰动升降时，其与周围空气的温差会产生浮力，若浮力使其加速运动或减速返回原位，这种加速/减速趋势就通过气温垂直加速度体现，以此判定稳定程度","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0768","type":"single","difficulty":1,"stem":"大气对流运动是由于地球表面受热不均引起的。空气受热膨胀上升 ，受冷则下沉 ，进而产生了 强烈而比较有规则的升降运动。温度越高 ，大气对流运动越明显。 因此对流效果最明显的是（）？","options":[{"key":"A","text":"北半球"},{"key":"B","text":"赤道地区"},{"key":"C","text":"南半球"}],"answer":"B","analysis":"提示：赤道最对流\n解析：赤道地区全年正午太阳高度角大，太阳辐射集中且强烈，地表接收热量远多于其他区域，空气受热膨胀上升的动力最足。同时，地表高温使空气强烈上升，近地面形成低压，与周边气压差大，进一步加剧空气升降运动，让对流更剧烈频繁。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0769","type":"single","difficulty":1,"stem":"当气温高于标准大气温度时 ，飞机的载重量要（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"减小"},{"key":"C","text":"保持不变"}],"answer":"B","analysis":"提示：气温高减重\n解析：气温升高会使空气密度降低，而飞机升力依赖空气密度，密度下降会导致相同速度下升力减少。为保证起飞、巡航等阶段有足够升力维持安全飞行，需减小载重量以降低总重力，让升力与重力重新平衡，避免性能受限或安全风险。","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0770","type":"single","difficulty":1,"stem":"民用无人机在条件允许的情况下，一般要（）。","options":[{"key":"A","text":"顺风起飞"},{"key":"B","text":"左侧风起飞"},{"key":"C","text":"逆风起飞"}],"answer":"C","analysis":"提示：逆风起降\n解析：起降都应逆风","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0771","type":"single","difficulty":1,"stem":"在风中全马力飞行的固定翼民用无人机，( )。","options":[{"key":"A","text":"顺风逆风地速相同"},{"key":"B","text":"顺风飞行时地速较大"},{"key":"C","text":"逆风飞行时地速较大"}],"answer":"B","analysis":"提示：全马力，顺风地速大\n解析：飞机全马力飞行，顺/逆风 对 地速影响很大。 地速 = 空速 + 风速 ((●'◡'●)鼠鼠老师的话：我们都有认知 不管是飞机还是骑车 走路，在顺风中都更快 在逆风中慢，这个速度是载具相对与地面的速度，所以对于地速的判断就用我们最质朴的直觉就可以 ，顺风快，逆风慢。)","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0772","type":"single","difficulty":1,"stem":"空气的密度（）。","options":[{"key":"A","text":"与压力无关"},{"key":"B","text":"与压力成正比"},{"key":"C","text":"与压力成反比"}],"answer":"B","analysis":"提示：密度压力正比\n解析：按气体状态方程：ρ=p/RT （ρ 为空气密度，p为气压，T
