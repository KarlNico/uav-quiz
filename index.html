的培训或具备相应的经验，并向局方或局方授权部门"},{"key":"B","text":"持有民用无人机驾驶员合格证并具有相应等级"},{"key":"C","text":"以上都有"}],"answer":"C","analysis":"提示：有以上都有，就选以上都有\n解析：对于无人机植保作业，运营人指定的一个或多个作业负责人应持有民用无人机驾驶员合格证并具有相应等级;接受了相应理论知识及飞行技能的培训或具备相应的经验;向局方或局方授权部门展示了其能力","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0155","type":"single","difficulty":1,"stem":"民用航空适航管理是对哪几种环节进行管理？","options":[{"key":"A","text":"使用和维修"},{"key":"B","text":"设计、制造"},{"key":"C","text":"设计、制造、使用和维修"}],"answer":"C","analysis":"提示：4个都有\n解析：《中国民用航空器适航管理条例》第三条民用航空器的适航管理，是根据国家的有关规定，对民用航空器的设计、生产使用和维修，实施以确保飞行安全为目的的技术鉴定和监督。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0156","type":"single","difficulty":1,"stem":"学员单飞前必须达到的要求是：①通过由授权教员实施的理论考试；②接受并记录了单飞所用航空器的适用动作与程序的飞行训练；③经授权教员在该型号或类似航空器上检查，认为该驾驶员熟练掌握了这些动作与程序","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①③"},{"key":"C","text":"②③"}],"answer":"A","analysis":"提示：①②③全选\n解析：根据2016年《民用航空器驾驶员和地面教员合格审定规则》第 61.105 （2018年进行修订，对本条未作修改）","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0157","type":"single","difficulty":1,"stem":"民用航空器必须具有民航局颁发的（）方可飞行。","options":[{"key":"A","text":"机场使用许可证"},{"key":"B","text":"经营许可证"},{"key":"C","text":"适航证"}],"answer":"C","analysis":"提示：适航证=行驶证\n解析：《中华人民共和国民用航空法》第三十七条:具有中华人民共和国国籍的民用航空器，应当持有国务院民用航空主管部门颁发的适航证书，方可飞行。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0158","type":"single","difficulty":1,"stem":"由授权教员签字批准单飞后的学员，单飞训练时间在其飞行经历记录本上应体现为（）。","options":[{"key":"A","text":"副驾驶时间"},{"key":"B","text":"机长时间"},{"key":"C","text":"单飞时间"}],"answer":"C","analysis":"提示：问题对应答案， 单飞对单飞\n解析：根据2018年《民用无人机驾驶员管理规定》所附的飞行经历记录填写规范，要求把每次飞行填入相应的时间项目，其中将“单飞时间”列为执照或等级申请人作为民用无人机唯一操纵者的飞行时间","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0159","type":"single","difficulty":1,"stem":"由授权教员为学员提供的带飞训练，学员飞行经历记录本上应体现为（）。","options":[{"key":"A","text":"副驾驶时间"},{"key":"B","text":"机长时间"},{"key":"C","text":"带飞时间"}],"answer":"C","analysis":"提示：问题对应答案， 带飞对带飞\n解析：由授权教员为学员提供的带飞训练，学员飞行经历记录本上应体现为带飞时间。带飞时间能够明确反映出学员在授权教员指导下进行飞行训练的时长。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0160","type":"single","difficulty":1,"stem":"对于涉及酒精或药物的违禁行为，按照规定可以给予警告、暂扣执照或合格证（）或吊销执照。","options":[{"key":"A","text":"3到6个月"},{"key":"B","text":"1到6个月"},{"key":"C","text":"1到3个月"}],"answer":"B","analysis":"提示：喝酒1-6个月（伪造1-6，喝酒1-6，未履责1613，喝酒停申1年）\n解析：《中华人民共和国民用航空法》第七十七条:民用航空器机组人员受到酒类饮料、麻醉剂或者其他药物的影响，损及工作能力的，不得执行飞行任务。第二百零八条，民用航空器的机长或者机组其他人员有下列行为之一的，由国务院民用航空主管部门给予警告或者吊扣执照-个月至六个月的处罚;有第(二)项或者第(三)项所列行为的，可以给予吊销执照的处罚:(三)违反本法第七十七条第二款的规定执行飞行任务的。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0161","type":"single","difficulty":1,"stem":"飞行的组织与实施包括（）。","options":[{"key":"A","text":"飞行直接准备、飞行实施和飞行讲评三个阶段"},{"key":"B","text":"飞行预先准备、飞行准备和飞行实施三个阶段"},{"key":"C","text":"飞行预先准备、飞行直接准备、飞行实施和飞行讲评四个阶段"}],"answer":"C","analysis":"提示：四个阶段\n解析：根据《中华人民共和国飞行基本规则》第一章 总则 第七条：组织与实施飞行，应当按照飞行预先准备、飞行直接准备、飞行实施和飞行讲评等阶段进行。飞行阶段的具体内容和要求由各航空管理部门自行规定。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0162","type":"single","difficulty":1,"stem":"无人机云系统（无人机云），是指轻小型民用无人机动态数据库系统，用于：①提供航行服务、气象服务②对民用无人机运行数据进行实时监测③对侵入电子围栏的无人机具有报警功能","options":[{"key":"A","text":"②③"},{"key":"B","text":"①③"},{"key":"C","text":"①②③"}],"answer":"C","analysis":"提示：①②③全选\n解析：无人机系统(无人机云)能够向无人机用户提供航行服务，包括航线规划、导航辅助等，同时还能够提供气象服务;能够实时监测无人机的运行数据，包括其运营信息、位置、高度和速度等;通过设定电子围栏，系统能够实时监测无人机的飞行轨迹，一旦无人机侵入设定的电子围栏区域系统会立即发出报警，提醒用户注意并采取相应的措施。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0163","type":"single","difficulty":1,"stem":"飞行教员等级申请人必须年满（）。","options":[{"key":"A","text":"20周岁"},{"key":"B","text":"21周岁"},{"key":"C","text":"18周岁"}],"answer":"C","analysis":"提示：教员执照18\n解析：依据2018年《民用遥控驾驶航空器系统驾驶员管理暂行规定》第3.1条“教员等级资格要求”，申请人须年满18周岁。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0164","type":"single","difficulty":1,"stem":"无人机视距内/超视距飞行执照/合格证申请人必须年满（）。","options":[{"key":"A","text":"16周岁"},{"key":"B","text":"18周岁"},{"key":"C","text":"20周岁"}],"answer":"A","analysis":"提示：教员18，其他16\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1视距内等级驾驶员执照1.1资格要求：符合下列条件的申请人，局方可以为其颁发视距内等级驾驶员执照：（a）年满 16 周岁；2超视距等级驾驶员执照 2.1 XI（不含）以下分类等级2.1.1 资格要求：符合下列条件的申请人，局方可以为其颁发超视距等级驾驶员执照：（a）年满 16 周岁；","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0165","type":"single","difficulty":1,"stem":"无人机驾驶员在执行飞行任务时，应当随身携带（）。","options":[{"key":"A","text":"驾驶员执照或合格证"},{"key":"B","text":"飞机适航证书"},{"key":"C","text":"飞行记录本"}],"answer":"A","analysis":"提示：驾驶员执照或合格=开车驾照\n解析：执行飞行任务时，驾驶员应随身携带能够证明其操控资格的执照或合格证。驾驶员执照或合格证类似于开车时的驾驶证，驾驶员执行任务时应随身携带。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0166","type":"single","difficulty":1,"stem":"任何单位或者个人未取得（），均不得生产民用航空器。","options":[{"key":"A","text":"适航证"},{"key":"B","text":"型号合格证"},{"key":"C","text":"生产许可证"}],"answer":"C","analysis":"提示：设计要型号，生产要生产\n解析：《中华人民共和国民用航空法》第三十五条:生产、维修民用航空器及其发动机、螺旋桨和民用航空器上设备，应当向国务院民用航空主管部门申请领取生产许可证书、维修许可证书。经审查合格的，发给相应的证书。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0167","type":"single","difficulty":1,"stem":"任何单位或者个人设计民用航空器，应当向民航局申请（）。","options":[{"key":"A","text":"适航证"},{"key":"B","text":"生产许可证"},{"key":"C","text":"型号合格证"}],"answer":"C","analysis":"提示：设计要型号，生产要生产\n解析：根据《中华人民共和国民用航空器适航管理条例》第六条：任何单位或者个人设计民用航空器，应当持航空工业部对该设计项目的审核批准文件，向民航局申请型号合格证。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0168","type":"single","difficulty":1,"stem":"CCAR-61部授权的执照或合格证持有人在理论考试中作弊或发生其他禁止行为，局方(授权方)撤销相应的执照等级，责令当事人立即停止飞行运行并交回其已取得的执照或合格证，( )年内不得申请按照CCAR-61颁发的执照、合格证或等级以及考试。","options":[{"key":"A","text":"一"},{"key":"B","text":"视其违规的情节轻重而定"},{"key":"C","text":"三"}],"answer":"C","analysis":"提示：持有人作弊，3年，选最久（CCAR开头，有3选3，没3选1）\n解析：根据《民用航空器驾驶员和地面教员合格审定规则》(CCAR-61-R4)第61.245条 理论考试中的作弊或其他禁止的行为的处罚:(b)对于违反本规则第61.37条规定的执照或等级持有人，局方对当事人予以警告，同时撤销相应的执照等级，责令当事人立即停止飞行运行并交回其已取得的相应执照。驾驶员执照等级被撤销之日起三年内，当事人不得申请按照本规则颁发的执照或等级以及考试。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0169","type":"single","difficulty":1,"stem":"飞行人员未按《中华人民共和国飞行基本规则》规定履行职责的 ，由有关部门依法给予行政处分或者纪律处分，情节严重的，依法给予吊扣执照或合格证（ ）的处罚 ，或者责令停飞（ ）。","options":[{"key":"A","text":"半年，一至三个月"},{"key":"B","text":"一至三个月，半年"},{"key":"C","text":"一至六个月，一至三个月"}],"answer":"C","analysis":"提示：未履责1613（伪造1-6，喝酒1-6，未履责1613，喝酒停申1年）\n解析：《中华人民共和国飞行基本规则》第一百一十八条:飞行人员未按本规则规定履行职责的，由有关部门依法给予行政处分或者纪律处分;情节严重的，依法给予吊扣执照一个月至六个月的处罚，或者责令停飞一个月至三个月;构成犯罪的，依法追究刑事责任。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0170","type":"single","difficulty":1,"stem":"关于“民用航空器国籍”正确的是（）。","options":[{"key":"A","text":"自外国租赁的民用航空器不能申请我国国籍"},{"key":"B","text":"民用航空器可以不进行国籍登记而投入运行"},{"key":"C","text":"民用航空器只能具有一国国籍"}],"answer":"C","analysis":"提示：只能一国国籍\n解析：《中华人民共和国民用航空法》第九条:民用航空器不得具有双重国籍。未注销外国国籍的民用航空器不得在中华人民共和国申请国籍登记。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0171","type":"single","difficulty":1,"stem":"参加理论考试或实践考试的申请人在参加考试前（）。","options":[{"key":"A","text":"应当具有授权教员签注的已完成有关地面理论或飞行训练的证明"},{"key":"B","text":"以上二者缺一不可"},{"key":"C","text":"应当具有授权教员推荐其参加考试的证明"}],"answer":"B","analysis":"提示：两个都有\n解析：依据旧版《民用航空器驾驶员、飞行教员和地面教员合格审定规则》的修订说明：考前既要有教员签注的已完成相应训练的证明，也要有教员推荐参加考试的证明。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0172","type":"single","difficulty":1,"stem":"飞行教员不需要在飞行教员记录本或单独文件中记录的内容为（）。","options":[{"key":"A","text":"由该教员签字授予单飞权利的每个人的姓名、日期及航空器型号"},{"key":"B","text":"教学的内容、课时、日期和航空器型号"},{"key":"C","text":"由该教员签字推荐参加理论或实践考试的每个人的姓名、考试种类、日期和结果"}],"answer":"B","analysis":"提示：看清楚，是教员记录本不需要，教学内容不需记录\n解析：《民用航空器驾驶员合格审定规则》第61.209条，飞行教员的教学记录(a)飞行教员应当在接受其飞行或地面教学的每个人的飞行经历记录本上签字，并注明提供教学的内容、课时和日期。(b)飞行教员应当在飞行教员记录本或单独文件中记录下列内容:(1)由该教员在飞行经历记录本或者在学生驾驶员执照上签字而被授予单飞权利的每个人的姓名。记录应当包括每次签字的日期以及所涉及的航空器型号;(2)由该教员签字推荐参加理论考试或者实践考试的每个人的姓名，记录还应当包括考试的种类、日期和考试结果。(c)每个飞行教员应当将本条要求的记录保存至少三年。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0173","type":"single","difficulty":1,"stem":"电子围栏功能包括：①阻挡即将侵入该地区的航空器；②阻挡即将离开该地区的航空器；③报警功能","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②"},{"key":"C","text":"①③"}],"answer":"C","analysis":"提示：主要为①③，管进不管出\n解析：根据2015年12月发布的《轻小无人机运行规定（试行）》3.17无人机云系统对侵入电子围栏的无人机具有报警功能。 3.18 电子围栏，是指为阻挡即将侵入特定区域的航空器，在 相应电子地理范围中画出特定区域，并配合飞行控制系统、 保障区域安全的软硬件系统。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0174","type":"single","difficulty":1,"stem":"在遇到特殊情况，民用航空器机长为保证民用航空器及所载人员的安全（）。","options":[{"key":"A","text":"应当及时向管制单位报告，按照相关规定进行正确处置"},{"key":"B","text":"应当及时向签派或上级领导报告，按照相关规定进行正确处置"},{"key":"C","text":"有权对航空器进行处置"}],"answer":"C","analysis":"提示：特殊情况不报告，机长有权先行处置\n解析：根据《中华人民共和国飞行基本规则》第九条：飞行人员在飞行中，必须服从指挥，严格遵守纪律和操作规程，正确处置空中情况。遇到特殊情况，民用航空器的机长，为保证民用航空器及其所载人员的安全，有权对民用航空器作出处置。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0175","type":"single","difficulty":1,"stem":"视距外运行使用自主模式的无人机，出现失控时，机长应执行预案包括：①无人机应急回收程序；②接入无人机云的用户应在系统内上报；③未接入云的用户联系空管部门并上报责任人名单","options":[{"key":"A","text":"②③"},{"key":"B","text":"①③"},{"key":"C","text":"①②③"}],"answer":"C","analysis":"提示：①②③全选\n解析：根据2015年《轻小无人机运行规定》第 12 条 视距外运行（BVLOS） 12.3.1 出现无人机失控的情况，机长应该执行相应的预案，包括：a.无人机应急回收程序；b.对于接入无人机云的用户，应在系统内上报相关情况；c.对于未接入无人机云的用户，联系相关空管服务部门的程序，上报遵照以上程序的相关责任人名单。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0176","type":"single","difficulty":1,"stem":"对于接入无人机云系统的用户，无须：①向相关部门了解限制区域的划设情况，包括机场障碍物控制面、飞行禁区、未经批准的限制区以及危险区等;②机身需有明确的标识，注明该无人机的型号编号、所有者、联系方式等信息，以便出现坠机情况时能迅速查找到无人机所有者或操作者信息;③运行前需要提前向管制部门提出申请，并提供有效监视手段;④运营人按照CCAR-91部的要求，进行合格审定。","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②④"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：（本题要注意理解，因为，”无人机云系统“准入制度比较严格，在申请的时候，就应遵守并提交相关资料，①②③④休要遵守并符合。 能接入就意味着该用户条件满足①②③④。 所以“对于已经接入无人机云系统”的用户来说，就不必（无须）再提交相关资料了。） 根据2015年颁布，目前仍有效的《轻小无人机运行规定》10.2 表述： 对于未接入无人机云系统的用户，应向相关部门了解限制区域的划设情况。不得突破机场障碍物控制面、飞行禁区、未经批准的限制区以及危险区等。13.5 对于未接入无人机云系统的用户，其无人机机身需有明确的标识，注明该无人机的型号、编号、所有者联系方式等信息，以便出现坠机情况时能迅速查找到无人机所有者或操作者信息14.1.3 未接入无人机云的民用无人机。运行前需要提前向管制部门提出申请，并提供有效监视手段。15.2 获得试运行批准的无人机云提供商应定期对云系统进行更新扩容，保证其所接入的民用无人机运营人使用方便、数据可靠、低延迟、飞行区域信息实时有效。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0177","type":"single","difficulty":1,"stem":"依法取得中华人民共和国国籍的民用航空器，应当标明规定的国籍标志和（）。","options":[{"key":"A","text":"机型标志"},{"key":"B","text":"登记标志"},{"key":"C","text":"公司标志"}],"answer":"B","analysis":"提示：国籍+登记标志\n解析：根据《一般运行和飞行规则》第91.11条民用航空器飞行手册、标记和标牌要求(c)在中华人民共和国 国籍登记的民用航空器应当满足CCAR-45部规定的国籍标志、登记标志和标识要求方可运行。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0178","type":"single","difficulty":1,"stem":"训练时间，是指受训人在下列方面从授权教员处接受训练的时间？","options":[{"key":"A","text":"地面上、飞行模拟机或飞行训练器上"},{"key":"B","text":"飞行中"},{"key":"C","text":"飞行中、地面上、飞行模拟机或飞行训练器上"}],"answer":"C","analysis":"提示：训练时间→全选\n解析：根据《民用航空器驾驶员和地面教员合格审定规则》61.7（C）规定： 训练时间，是指受训人在飞行中、地面上、飞行模拟机或飞行训练器上从授权教员处接受训练的时间。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0179","type":"single","difficulty":1,"stem":"对于民用无人机运行的仪表、设备和标识要求中，用于记录、回放和分析飞行过程的飞行数据记录系统，且数据信息至少保存（）。","options":[{"key":"A","text":"半年"},{"key":"B","text":"三个月"},{"key":"C","text":"一个月"}],"answer":"B","analysis":"提示：数据3个月（记录3年，数据3个月）\n解析：《轻小无人机运行规定》13.民用无人机运行的仪表、设备和标识要求:13.1具有有效的空地C2链路;13.2 地面站或操控设备具有显示无人机实时的位置、高度、速度等信息的仪器仪表;13.3 用于记录、回放和分析飞行过程的飞行数据记录系统，且数据信息至少保存三个月(适用于Ⅲ、IV、V和V类)","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0180","type":"single","difficulty":1,"stem":"谁对民用无人机系统运行遵守飞行基本规则负责？","options":[{"key":"A","text":"机长"},{"key":"B","text":"民航局及其地区管理局"},{"key":"C","text":"航空单位负责人"}],"answer":"A","analysis":"提示：机长负责基本规则\n解析：《中华人民共和国飞行基本规则》第五条航空单位的负责人对本单位遵守本规则负责。机长对本空勤组成员遵守本规则负责。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0181","type":"single","difficulty":1,"stem":"谁对机组成员遵守飞行基本规则负责？","options":[{"key":"A","text":"机长"},{"key":"B","text":"民航局及其地区管理局"},{"key":"C","text":"航空单位负责人"}],"answer":"A","analysis":"提示：机长负责基本规则\n解析：根据《中华人民共和国飞行基本规则》第一章总则第五条：航空单位的负责人对本单位遵守本规则负责。机长对本空勤组成员遵守本规则负责。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0182","type":"single","difficulty":1,"stem":"《一般运行和飞行规则》的颁布目的是：①为了维护国家领空主权②为了规范民用航空器的运行③保证飞行的正常与安全","options":[{"key":"A","text":"①②③"},{"key":"B","text":"②③"},{"key":"C","text":"①②"}],"answer":"B","analysis":"提示：①是航空法，只选②③\n解析：《一般运行和飞行规则》第91.1条:目的和依据。为了规范民用航空器的运行，保证飞行的正常与安全。①为了维护国家领空主权是迷惑选项，是《中华人民共和国民用航空法》、《中华人民共和国飞行基本规则》与《中华人民共和国国家安全法》颁布的目的。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0183","type":"single","difficulty":1,"stem":"下列说法中，哪一种对无人机教员等级申请人的要求是必须的？","options":[{"key":"A","text":"在所申请的无人机上担任机长经历时间多于100小时"},{"key":"B","text":"具备无人机应急处理程序方面的技术"},{"key":"C","text":"在所申请的无人机上飞行经历不少于100小时"}],"answer":"A","analysis":"提示：担任机长不少于≥100h\n解析：《民用航空器驾驶员和地面教员合格审定规则》第61.203条，资格要求(i)对于初次申请飞机类别的型别教员等级申请人，担任飞机机长的飞行经历时间至少500小时，其中在所申请型别的飞机上担任机长的飞行经历时间至少100小时;对于申请增加型别教员等级的申请人，在所申请型别的飞机上担任机长的飞行经历时间至少100小时。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0184","type":"single","difficulty":1,"stem":"《中华人民共和国民用航空法》自（）起施行。","options":[{"key":"A","text":"1996年01月01日"},{"key":"B","text":"1996年03月01日"},{"key":"C","text":"1997年01月01日"}],"answer":"B","analysis":"提示：法施行631 法修正429 认证修正516 实名登记516 （认证修正、实名登记同一天）\n解析：《中华人民共和国民用航空法》于1995年10月30日通过，并自1996年3月1日起施行。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0185","type":"single","difficulty":1,"stem":"下列说法正确的是？","options":[{"key":"A","text":"除非具有局方委任的监察员或考试员资格，否则飞 行教员不得为获得CCA-61部要求的执照、合格证、等级、运行许可、实践考试或者理论考试权利而为自己进行任何签字"},{"key":"B","text":"飞行教员不得为获得CCA-61部要求的执照、合格证、等级、运行许可、实践考试或者理论考试权利而为自己进行任何签字"},{"key":"C","text":"当存在特殊的情况或条件限制时，在获得特别授权和批准后，飞行教员可以为获得CCAR-61部要求的执照、合格证、等级、运行许可、实践考试或者理论考试权利而为自己进行签字"}],"answer":"B","analysis":"提示：教员不得为自己签字\n解析：《民用航空器驾驶员和地面教员合格审定规则》第 61.215条 飞行教员的限制，飞行教员不得为获得本规则要求的执照、等级、实践考试或者理论考试权利而为自己进行任何签字。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0186","type":"single","difficulty":1,"stem":"何种无人机须安装使用电子围栏？","options":[{"key":"A","text":"Ⅲ、Ⅳ、Ⅵ、Ⅶ类及重点地区和机场净空区以下运行Ⅱ、Ⅴ类无人机"},{"key":"B","text":"Ⅱ、Ⅲ、Ⅳ、Ⅴ、Ⅵ、Ⅶ类无人机"},{"key":"C","text":"Ⅲ、Ⅳ、Ⅵ、Ⅶ类无人机"}],"answer":"A","analysis":"提示：带重点地区\n解析：《轻小无人机运行规定》14.1.1电子围栏 a.对于Ⅲ、Ⅳ、Ⅵ和Ⅶ类无人机，应安装并使用电子围栏 b.对于在重点地区和机场净空区以下运行Ⅱ类和V类无人机，应安装并使用电子围栏。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0187","type":"single","difficulty":1,"stem":"如观察到其他飞机的灯光是右红左绿时，应将该机判断为（）。","options":[{"key":"A","text":"与自己顺向飞行"},{"key":"B","text":"没有发生相撞的可能"},{"key":"C","text":"与自己相向飞行"}],"answer":"C","analysis":"提示：顺向=不会相撞，选相向\n解析：如观察到其他飞机的灯光是右红左绿时应将该机判断为与自己相向飞行。在航空领域，飞机的航行灯系统包括左翼尖端的红色灯、右翼尖端的绿色灯和尾部尖端的白色灯。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0188","type":"single","difficulty":1,"stem":"民用无人机用于农林喷洒作业时，以下哪些人员要求其持有民用无人机驾驶员合格证并具有相应等级：①作业负责人；②独立喷洒作业人员；③作业高度在15米以上的作业人员","options":[{"key":"A","text":"②③"},{"key":"B","text":"②"},{"key":"C","text":"①②③"}],"answer":"C","analysis":"提示：①②③全选\n解析：三类人员均需持证《轻小无人机运行规定》规定:16.2.1运营人指定的一个或多个作业负责人，该作业负责人应当持有民用无人机驾驶员合格证并具有相应等级，同时接受了知识和技术的培训或者具备相应的经验。16.2.4对于独立喷洒作业人员，或者从事作业高度在15 米以上的作业人员应持有民用无人机驾驶员合格证。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0189","type":"single","difficulty":1,"stem":"监视系统获取民用无人机运行信息的方式包括（）。","options":[{"key":"A","text":"两者都有"},{"key":"B","text":"被动反馈系统（指航空器被雷达、ADS-B系统、北斗等手段从地面进行监视的系统，该反馈信息不经过运营人。）"},{"key":"C","text":"主动反馈系统（指运营人主动将航空器的运行信息发送给监视系统。）"}],"answer":"A","analysis":"提示：两个都有\n解析：监控系统获取民用无人机运行信息的方式主要分为被动反馈系统和主动反馈系统。《轻小无人机运行规定》3.19 主动反馈系统，是指运营人主动将航空器的运行信息发送给监视系统。3.20 被动反馈系统,是指航空器被雷达、ADS-B 系统、北斗等手段从地面进行监视的系统，该反馈信息不经过运营人。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0190","type":"single","difficulty":1,"stem":"机场标高指着陆区（）的标高。","options":[{"key":"A","text":"最低点"},{"key":"B","text":"最高点"},{"key":"C","text":"平均海拔"}],"answer":"B","analysis":"提示：最高点\n解析：机场跑道着陆区内最高点距离平均海平面(Mean sea level)的垂直距离称为机场标高。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0191","type":"single","difficulty":1,"stem":"从事飞行的民用航空器不需要携带的文件是（）。","options":[{"key":"A","text":"飞行人员相应的执照或合格证"},{"key":"B","text":"民用航空器适航证书"},{"key":"C","text":"飞行记录本"}],"answer":"C","analysis":"提示：个人飞行记录本× 不带\n解析：根据旧版《中华人民共和国民用航空法》第九十条，民用航空器适航证书√ 机组人员相应的执√都要携带！“飞行记录本”是飞行人员个人的飞行经历记录本，而不是航空器的“航行记录簿”。所以不用×","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0192","type":"single","difficulty":1,"stem":"实施农林喷洒作业的运营人应当在其主运行基地保存关于下列内容的记录：①服务对象的名称和地址②服务日期③每次作业飞行所喷洒物质的量和名称④作业飞行任务的驾驶员的姓名、地址和执照编号，以及按照管理规定的作业负责人通过知识和技术检查的记录","options":[{"key":"A","text":"②③④"},{"key":"B","text":"①②④"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：四项均需保存《一般运行和飞行规则》第91.1121条，商业非运输运营人的记录保存。实施农林喷洒作业的商业非运输运营人应当在其主运行基地保存关于下列内容的记录:(a)服务对象的名称和地址;(b)服务日期;c)每次作业飞行所喷洒物质的量和名称;(d)每位执行农林喷洒作业飞行任务的驾驶员的姓名、地址和执照编号，及其按本规则要求通过知识和技术检查的日期。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0193","type":"single","difficulty":1,"stem":"个人民用无人机拥有者在“无人机实名登记系统”中登记的信息包括（）。","options":[{"key":"A","text":"驾驶员姓名、有效证件号码、联系方式"},{"key":"B","text":"拥有者姓名、有效证件号码、工作单位、联系方式"},{"key":"C","text":"拥有者姓名、有效证件号码、使用目的"}],"answer":"C","analysis":"提示：使用目的！\n解析：根据《民用无人驾驶航空器实名制登记管理规定》3.2.2 个人民用无人机拥有者登记信息 个人民用无人机拥有者在“无人机实名登记系统”中登记的信息包括:(1)拥有者姓名;(2)有效证件号码(如身份证号、护照号等);(3)移动电话和电子邮箱;(4)产品型号、产品序号;(5)使用目的。（不要驾驶者的姓名，不要工作单位）","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0194","type":"single","difficulty":1,"stem":"在什么条件下飞行教员方可在学生驾驶员飞行经历记录本上签字，批准其单飞？","options":[{"key":"A","text":"亲自或委托具备飞行教员资格和权限的飞行教员对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练，确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制，已经做好准备能够安全实施单飞"},{"key":"B","text":"亲自对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练，确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制，已经做好准备能够安全实施单飞"},{"key":"C","text":"亲自或委托具备飞行教员资格和权限的飞行教员对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练，确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制，已经做好准备能够安全实施单飞同时需得到检查教员的认可和批准"}],"answer":"B","analysis":"提示：必须亲自，不得委托\n解析：根据《民用航空器驾驶员合格审定规则》第61.215条 飞行教员的限制 (d)签字限制:(１)在满足下列条件后,飞行教员方可在学生驾驶员执照或飞行经历记录本上签字,批准其单飞:(i)亲自对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练;(ii)确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制,已经做好准备能够安全实施单飞.","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0195","type":"single","difficulty":1,"stem":"《民用无人驾驶航空器实名制登记管理规定》何时颁布?","options":[{"key":"A","text":"2015年12月29日"},{"key":"B","text":"2017年01月01日"},{"key":"C","text":"2017年05月16日"}],"answer":"C","analysis":"提示：法施行631 法修正429 实名登记516 轻小1229 +建军节 ⭐不管选项是2017年5月6日 还是2017年5月16日都选它\n解析：根据CAAC官网信息，2017年5月16日，民航局航空器适航审定司正式发布《民用无人驾驶航空器实名制登记管理规定》，明确适用于在我国境内最大起飞重量为250克以上(含250克)的民用无人机，要求自2017年6月1日起，购买民用无人机的拥有者必须按照该管理规定的要求进行实名登记;对于在2017年6月1日前购买的民用无人机，其拥有者必须在2017年8月31日前完成实名登记。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0196","type":"single","difficulty":1,"stem":"下列航空法律法规中级别最高的是（）。","options":[{"key":"A","text":"《中华人民共和国民用航空法》"},{"key":"B","text":"《中华人民共和国搜寻援救民用航空器的规定》"},{"key":"C","text":"《中华人民共和国飞行基本规则》"}],"answer":"A","analysis":"提示：法最大 > 规定规则\n解析：航空法律法规中级别最高的是《中华人民共和国民用航空法》《中华人民共和国民用航空法》是由全国人民代表大会常务委员会通过的法律，具有最高的法律效力。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0197","type":"single","difficulty":1,"stem":"伪造、复制或篡改执照或合格证的行为，局方或授权方可视其情节轻重，给予警告、暂扣执照或合格证（）或吊销执照。","options":[{"key":"A","text":"3到6个月"},{"key":"B","text":"1到6个月"},{"key":"C","text":"1到3个月"}],"answer":"B","analysis":"提示：伪造1-6个月（伪造1-6，喝酒1-6，未履责1613，喝酒停申1年）\n解析：伪造、复制或篡改执照或合格证的行为局方或授权方可视其情节轻重，给予警告暂扣执照或合格证1到6个月或吊销执照或合格证的处罚。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0198","type":"single","difficulty":1,"stem":"从事通用航空飞行活动的单位、个人违反本条例规定 ，下列哪些情形下 ，由有关部门按照职责分工责令改正 ，给予警告 ；情节严重的 ，处 2 万元以上10 万元以下罚款 ，并可给予责令停飞 1 个 月至 3 个月、暂扣直至吊销经营许可证、飞行执照的处罚 ；造成重大事故或者严重后果的 ，依照刑法关于重大飞行事故罪或者其他罪的规定 ，依法追究刑事责任 ：①未经批准擅自飞行的 ；②未按批准的飞行计划飞行的 ；③不及时报告或者漏报飞行动态的 ；④未经批准飞入空中限制区、空中危险区的。","options":[{"key":"A","text":"①③④"},{"key":"B","text":"①②④"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：根据《通用航空飞行管制条例》第六章　法律责任 第四十一条：从事通用航空飞行活动的单位、个人违反本条例规定，有下列情形之一的，由有关部门按照职责分工责令改正，给予警告;情节严重的，处2万元以上10万元以下罚款并可给予责令停飞1个月至3个月、暂扣直至吊销经营许可证、飞行执照的处罚:造成重大事故或者严重后果的，依照刑法关于重大飞行事故罪或者其他罪的规定依法追究刑事责任:(一)未经批准擅自飞行的;(二)未按批准的飞行计划飞行的;(三)不及时报告或者漏报飞行动态的;(四)未经批准飞入空中限制区、空中危险区的。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0199","type":"single","difficulty":1,"stem":"我国民航飞行使用的时间为（）。","options":[{"key":"A","text":"当地的地方时"},{"key":"B","text":"世界协调时"},{"key":"C","text":"北京时"}],"answer":"B","analysis":"提示：世界协调时\n解析：民航飞行和空中交通管制使用统一的世界协调时UTC，便于不同地区的飞行计划、通话和时间记录保持一致。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0200","type":"single","difficulty":1,"stem":"民用无人机驾驶员合格证申请人必须具有操纵民用无人机不少于多少小时的飞行训练时间？","options":[{"key":"A","text":"100"},{"key":"B","text":"44"},{"key":"C","text":"56"}],"answer":"B","analysis":"提示：视距内44，超视距56 （训练=飞行时间=飞行经历）\n解析：（题干没表明是视距内还是视距外，一律按视距内处理）视距内等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 44 小时的飞行经历时间。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0201","type":"single","difficulty":1,"stem":"民用无人机驾驶员超视距等级申请人必须必须具有操纵民用无人机不少于（）小时的飞行训练时间。","options":[{"key":"A","text":"56"},{"key":"B","text":"44"},{"key":"C","text":"100"}],"answer":"A","analysis":"提示：视距内44，超视距56 （训练=飞行时间=飞行经历）\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件2.1.4 飞行经历要求:超视距等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 56 小时的飞行经历时间。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0202","type":"single","difficulty":1,"stem":"民用无人机驾驶员视距内等级申请人必须必须具有操纵民用无人机不少于（）小时的飞行训练时间。","options":[{"key":"A","text":"56"},{"key":"B","text":"44"},{"key":"C","text":"100"}],"answer":"B","analysis":"提示：视距内44，超视距56 （训练=飞行时间=飞行经历）\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件1颁发无人机驾驶员执照与等级的条件1.4 飞行经历要求:视距内等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 44 小时的飞行经历时间。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0203","type":"single","difficulty":1,"stem":"民用无人机驾驶员执照申请人飞行时间不少于（）。","options":[{"key":"A","text":"44小时"},{"key":"B","text":"56小时"},{"key":"C","text":"100小时"}],"answer":"A","analysis":"提示：视距内44，超视距56 （训练=飞行时间=飞行经历）\n解析：（题干没表明是视距内还是视距外，一律按视距内处理）根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件1颁发无人机驾驶员执照与等级的条件1.4 飞行经历要求:视距内等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 44 小时的飞行经历时间。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0204","type":"single","difficulty":1,"stem":"民用无人机超视距驾驶员的带飞时间不少于（）小时。","options":[{"key":"A","text":"56"},{"key":"B","text":"15"},{"key":"C","text":"10"}],"answer":"B","analysis":"提示：超视距驾驶员：单飞5带飞15 视距内驾驶员：单飞5带飞10\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件2.1.4 飞行经历要求:超视距等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 56 小时的飞行经历时间，其中包括（a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练，计入驾驶员飞行经历的飞行模拟训练时间不多于 28 小时；","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0205","type":"single","difficulty":1,"stem":"旋翼类无人机单飞时间不少于多少?","options":[{"key":"A","text":"5小时"},{"key":"B","text":"10小时"},{"key":"C","text":"15小时"}],"answer":"A","analysis":"提示：超视距/视觉内：单飞都是5\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0206","type":"single","difficulty":1,"stem":"民用航空器的适航管理由（）负责","options":[{"key":"A","text":"国务院"},{"key":"B","text":"中央军委"},{"key":"C","text":"民航局"}],"answer":"C","analysis":"提示：适航-民航局\n解析：《中国民用航空器适航管理条例》第四条民用航空器的适航管理由中国民用航空局(以下简称民航局)负责。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0207","type":"single","difficulty":1,"stem":"对于涉及酒精或药物的违禁行为处罚的人员，自其违禁行为发生之日起（）内，局方将不接受该人员提出的任何按本规则颁发执照或等级的申请。","options":[{"key":"A","text":"半年"},{"key":"B","text":"一年"},{"key":"C","text":"两年"}],"answer":"B","analysis":"提示：喝酒不接受申请一年（伪造1-6，喝酒1-6，未履责1613，喝酒停申1年）\n解析：根据旧规《民用航空器驾驶员、飞行教员和地面教员合格审定规则》J 章 罚则中，第 61.241 条 涉及酒精或药物的违禁行为的处罚 (b) 对于受到本条(a)处罚的人员，自其违禁行为发生之日起一年内，局方将不接受该人员提出的任何按本规则颁发执照或等级的申请。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0208","type":"single","difficulty":1,"stem":"学生驾驶员在单飞之前必须在其飞行经历记录本上，有授权教员的签字，证明其在单飞日期之前（）天内接受了所飞型号航空器的训练。","options":[{"key":"A","text":"60"},{"key":"B","text":"30"},{"key":"C","text":"90"}],"answer":"C","analysis":"提示：单飞前90天（单飞前多训练更稳妥，时间选最久）\n解析：《民用航空器驾驶员和地面教员合格审定规则》规定，学生驾驶员在操作航空器单飞之前，应当符合下列规定:(1)在学生驾驶员执照上，有授权教员针对其所飞型号航空器的签字批准;(2)在其飞行经历记录本上，有授权教员的签字，证明其在单飞日期之前90天内接受了所飞型号航空器的训练。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0209","type":"single","difficulty":1,"stem":"《中国民用航空法》中“飞行人员”是指（）。","options":[{"key":"A","text":"在飞行中直接操纵航空器和航空器上航行、通信等设备的人员"},{"key":"B","text":"机组"},{"key":"C","text":"机长和副驾驶"}],"answer":"A","analysis":"提示：问题对应答案， 飞行对飞行，人员对人员\n解析：《中华人民共和国民用航空法》中“飞行人员”是指在飞行中直接操纵航空器和航空器上航行、通信等设备的人员。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0210","type":"single","difficulty":1,"stem":"《中国民用航空法》中“航空人员”是指从事民用航空活动的（）。","options":[{"key":"A","text":"空勤人员"},{"key":"B","text":"空勤人员和地面人员"},{"key":"C","text":"飞行人员和地面人员"}],"answer":"B","analysis":"提示：空勤+地面\n解析：《中华人民共和国民用航空法》中“航空人员”是指从事民用航空活动的空勤人员和地面人员，空勤人员主要指在飞行中的航空器上执行任务的人员，如飞行员、乘务员等， 地面人员则包括机场地勤、航空管制员机务维修人员等在地面为航空活动提供支持和服务的人员。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0211","type":"single","difficulty":1,"stem":"颁发国内三个层次航空法规的部门分别是:①全国人大或全国人大常委会;②国务院、中央军委;③民航局;④民航地区管理局。","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②④"},{"key":"C","text":"③④"}],"answer":"A","analysis":"提示：没有④（④只管理不颁发）\n解析：颁发国内三个层次航空法规的部门分别是①全国人大或全国人大常委会;②)国务院、中央军委;③民航局。全国人大或全国人大常委会制定的是法律层面的航空法规。国务院、中央军委制定的是行政法规和规章， 民航局制定的是部门规章和规范性文件等民航地区管理局一般是依据上述部门制定的法规进行具体的管理和执行工作，而不是直接颁发航空法规。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0212","type":"single","difficulty":1,"stem":"当前使用的《中华人民共和国民用航空法》于（）修正?","options":[{"key":"A","text":"2017年11月04日"},{"key":"B","text":"2018年12月29日"},{"key":"C","text":"2016年11月07日"}],"answer":"B","analysis":"提示：⭐航空法修正日期，不管选项如何，选最新的日期！\n解析：⭐航空法修正日期，不管选项如何，选最新的日期！根据2018年12月29日第十三届全国人民代表大会常务委员会第七0次会议 《关于修改 〈中华人民共和国劳动法〉等七部法律的.0决定》第五次修正；根据2021年4月29日第十三届全国人民代表大会常务委员会第二十八次会议 《关于修改 〈中华人民共和国道路交通安全法〉等八部法律的决定》第六次修正。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0213","type":"single","difficulty":1,"stem":"对飞行教员合格证申请人的知识要求为（）。","options":[{"key":"A","text":"教学原理，所申请飞行教员合格证航空器类别的驾驶员、驾驶员机长合格证要求的航空知识，及所申请飞行教员合格证等级要求的航空知识"},{"key":"B","text":"教学原理，所申请飞行教员合格证航空器类别的驾驶员、商用和航线驾驶员执照要求的航空知识，及所申请飞行教员执照航空器类别的仪表等级要求的航空知识"},{"key":"C","text":"教学原理，所申请飞行教员执照航空器类别的私用、商用和航线驾驶员执照要求的航空知识"}],"answer":"A","analysis":"提示：带商用的选项都错\n解析：飞行教员申请人需要掌握以下几个方面的知识:1.教学原理;2.所申请飞行教员合格证航空器类别的驾驶员、驾驶员机长合格证要求的航空知识;3.所申请飞行教员合格证等级要求的航空知识，","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0214","type":"single","difficulty":1,"stem":"对于I、II类无人机系统驾驶员，（）。","options":[{"key":"A","text":"人员资质由行业协会负责管理"},{"key":"B","text":"人员资质由局方负责管理"},{"key":"C","text":"无须证照管理，自行负责"}],"answer":"C","analysis":"提示：I、II无人管\n解析：I类无人机:通常指的是空机重量和起飞全重小于等于1.5千克的无人机。I类无人机:指空机重量大于1.5千克、小于等于4千克，或起飞全重大于1.5千克小于等于7千克的无人机。I、Ⅱ类无人机系统驾驶员，无须证照管理，自行负责。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0215","type":"single","difficulty":1,"stem":"飞行教员应当接受其飞行或地面教学的每个人的飞行经历记录本上签字，并注明（）。","options":[{"key":"A","text":"教学的内容、课时和日期"},{"key":"B","text":"教学的内容、日期和机型"},{"key":"C","text":"教学的内容、课时、日期和机型"}],"answer":"A","analysis":"提示：个人飞行记录本：不看机型\n解析：《民用航空器驾驶员合格审定规则》第61.209条，飞行教员的教学记录(a)飞行教员应当在接受其飞行或地面教学的每个人的飞行经历记录本上签字，并注明提供教学的内容、课时和日期。(b)飞行教员应当在飞行教员记录本或单独文件中记录下列内容:(1)由该教员在飞行经历记录本或者在学生驾驶员执照上签字而被授予单飞权利的每个人的姓名。记录应当包括每次签字的日期以及所涉及的航空器型号;(2)由该教员签字推荐参加理论考试或者实践考试的每个人的姓名，记录还应当包括考试的种类、日期和考试结果。(c)每个飞行教员应当将本条要求的记录保存至少三年。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0216","type":"single","difficulty":1,"stem":"飞行任务书是许可飞行人员进行转场飞行和民用航空飞行的基本文件，由（）签发。","options":[{"key":"A","text":"驻机场航空单位或者航空公司的调度或签派部门"},{"key":"B","text":"驻机场航空单位或者航空公司的负责人"},{"key":"C","text":"驻机场航空单位或者航空公司的运行管理部门"}],"answer":"B","analysis":"提示：由“人”负责签发\n解析：根据2001年颁布，至今仍有效的《中华人民共和国飞行基本规则》第67条明确说明：飞行任务书是许可飞行人员进行转场飞行和民用航空飞行的基本文件。飞行任务书由驻机场航空单位或者航空公司的负责人签发。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0217","type":"single","difficulty":1,"stem":"关于通用航空的说法正确的是:①通用航空企业从事经营性通用航空活动，应当与用户订立书面合同，但是紧急情况下的救灾飞行除外;②组织实施作业飞行时，应当采取有效措施，保证飞行安全;③组织实施作业飞行时，保护环境和生态平衡，防止对环境、居民、作物或者牲畜等造成损害;④从事通用航空活动的，应当投保地面第三人责任险。","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②③④"},{"key":"C","text":"①②④"}],"answer":"B","analysis":"提示：①②③④全选\n解析：《中华人民共和国民用航空法》第一百四十八条:通用航空企业从事经营性通用航空活动，应当与用户订立书面合同，但是紧急情况下的救护或者救灾飞行除外。第一百四十九条:组织实施作业飞行时:应当采取有效措施，保证飞行安全，保护环境和生态平衡，防止对环境、居民、作物或者牲畜等造成损害。第一百五十条:从事通用航空活动的，应当投保地面第三人责任险。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0218","type":"single","difficulty":1,"stem":"接受转场飞行航空器降落的机场，必须在航空器到达机场（）以前，做好保障降落的各项准备工作。","options":[{"key":"A","text":"30分钟"},{"key":"B","text":"45分钟"},{"key":"C","text":"1小时"}],"answer":"A","analysis":"提示：救人、起飞一小时，保障、降落半小时\n解析：《中华人民共和国飞行基本规则》第四十六条:飞行准备以及保障飞行的准备工作必须在飞行开始前完成。在各项准备和天气情况符合飞行要求时，飞行方可开始接受转场飞行航空器降落的机场，必须在航空器到达机场30分钟以前，做好保障降落的各项准备工作。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0219","type":"single","difficulty":1,"stem":"转场航空器超过预定起飞时间（）仍未起飞，又未申请延期的，其原飞行申请失效。","options":[{"key":"A","text":"半小时"},{"key":"B","text":"一小时"},{"key":"C","text":"两小时"}],"answer":"B","analysis":"提示：救人、起飞一小时，保障、降落半小时\n解析：《中华人民共和国飞行基本规则》第三十八条:转场航空器的起飞，机场区域内、外飞行的开始和结束，均应当遵守预定的时间;需要提前或者推迟起飞时间的，应当经上一级飞行管制部门的许可。转场航空器超过预定起飞时间一小时仍未起飞，又未申请延期的，其原飞行申请失效。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0220","type":"single","difficulty":1,"stem":"民用航空飞行器实名认证规定适用于什么飞机?","options":[{"key":"A","text":"最大起飞重量250g(含250g)"},{"key":"B","text":"最大起飞重量250g(不含250g)"},{"key":"C","text":"最大起飞重量200g"}],"answer":"A","analysis":"提示：250以下的不管\n解析：《民用无人驾驶航空器实名制登记管理规定》1.2 适用范围:本管理规定适用于在中华人民共和国境内最大起飞重量为 250克以上(含250克)的民用无人机。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0221","type":"single","difficulty":1,"stem":"民用航空适航管理是对哪几个方面进行管理?","options":[{"key":"A","text":"航空器、发动机、螺旋桨"},{"key":"B","text":"航空器、发动机、螺旋桨、机上设备"},{"key":"C","text":"航空器、发动机"}],"answer":"B","analysis":"提示：航发螺+机上设备\n解析：适航，就是适航性的简称，根据《中华人民共和国民用航空法》适航证件包括型号合格证、生产许可证、出口适航证、维修许可证、国籍登记证五个方面，管理范围均为：航空器、发动机、螺旋桨、机上设备等。也有考题将正确选项写为“航空器、发动机、螺旋桨和航空器上的设备”，也是正确选项。本题要点：第一必须有“航空器、发动机、螺旋桨”，第二必须有“设备”。鼠鼠老师的话：本题依据《中华人民共和国民用航空法》1995年颁布，经历数次修改，不管是1995还是2026版本都在34、35条明确表明，“设计生产维修民用航空器及其发动机、螺旋桨和民用航空器上设备应申请证书。”法的效力大于条例。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0222","type":"single","difficulty":1,"stem":"民用无人驾驶航空器系统驾驶员执照由哪个部门颁发?","options":[{"key":"A","text":"民航局下属司(局)"},{"key":"B","text":"中国航空器拥有者及驾驶员协会(中国AOPA)"},{"key":"C","text":"地区管理局"}],"answer":"A","analysis":"提示：合格证-协会AOPA，执照-民航局\n解析：民用无人机操控员执照(CAAC)是由中国民航局飞行标准司直接颁发和管理的执照，与有人驾驶航空器同属一签发单位，是唯一由民航局直接颁发的无人机执照具有权威的法律效力，是全国通用、驾驶无人机和就业的必要证件(类似于汽车驾照)。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0223","type":"single","difficulty":1,"stem":"《轻小型无人机运行规定(试行)》颁布于（）。","options":[{"key":"A","text":"2013年11月13日"},{"key":"B","text":"2015年12月29日"},{"key":"C","text":"2017年01月01日"}],"answer":"B","analysis":"提示：轻小1229\n解析：《轻小型无人机运行规定(试行)》下发日期为2015年12月29日。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0224","type":"single","difficulty":1,"stem":"无人机系统的超视距驾驶员(机长)是指（）。","options":[{"key":"A","text":"操控无人机的人"},{"key":"B","text":"协助操控无人机的人"},{"key":"C","text":"负责整个无人机系统运行和安全的驾驶员"}],"answer":"C","analysis":"提示：机长负责整个\n解析：无人机系统视距内驾驶员，由运营人指派对无人机的运行负有必不可少职责并在飞行期间适时操纵无人机的人。无人机系统超视距驾驶员(机长)，是指在系统运行时间内负责整个无人机系统运行和安全的驾驶员。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0225","type":"single","difficulty":1,"stem":"在人口稠密区上空进行农林喷酒作业飞行应当符合:①取得作业飞行区域的政府部门的书面批准;②向对作业区域有管辖权的地方飞行标准部门递交完整的作业飞行计划并取得批准;③通过有效的方式向公众发出作业通知。","options":[{"key":"A","text":"①②"},{"key":"B","text":"②③"},{"key":"C","text":"①②③"}],"answer":"C","analysis":"提示：①②③全选\n解析：《一般运行和飞行规则》第91.1117条，在人口稠密区的作业飞行，(b)在人口稠密区上空进行农林喷洒作业飞行应当符合下列要求:(1)应当取得作业飞行区域的政府部门的书面批准;(2)通过有效的方式如报纸、电视或电台等，向公众发出作业飞行通知;(3)应当向对作业区域有管辖权的地方飞行标准部门递交完整的作业飞行计划并获得批准。该计划应当包括障碍物对飞行的影响、航空器紧急降落能力和与空中交通管制的协调等方面内容。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0226","type":"single","difficulty":1,"stem":"最新颁布的《中华人民共和国飞行基本规则》从（）实施。","options":[{"key":"A","text":"2001年8月1日零时起施行"},{"key":"B","text":"2001年6月1日零时起施行"},{"key":"C","text":"2001年10月1日零时起施行"}],"answer":"A","analysis":"提示：建军节\n解析：《中华人民共和国飞行基本规则》第一百二十四条:本规则自2001年8月1日零时起施行。国务院、中央军事委员会1977年4月21日颁发的《中华人民共和国飞行基本规则》同时废止。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0227","type":"single","difficulty":1,"stem":"下列不属于对无人机机长训练要求的是（）。","options":[{"key":"A","text":"在模拟器实施系统检查程序，不少于1小时"},{"key":"B","text":"在实物训练系统实施系统检查程序，不少于3小时"},{"key":"C","text":"取得仪表资格"}],"answer":"C","analysis":"提示：选错的。机长无仪表\n解析：对无人机机长的训练要求包括在模拟器和实物训练系统上实施系统检查程序，以及指挥正常飞行程序。而取得仪表资格并不是对无人机机长的特定训练要求，因此不属于此范畴。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0228","type":"single","difficulty":1,"stem":"下列不属于对无人机机长训练要求的是（）。","options":[{"key":"A","text":"有参与研制飞行模拟器经历"},{"key":"B","text":"在实物训练系统实施正常飞行程序指挥，不少于10小时"},{"key":"C","text":"在模拟器实施正常飞行程序指挥，不少于3小时"}],"answer":"A","analysis":"提示：选错的。机长不研发\n解析：对无人机机长的训练要求包括在实物训练系统和模拟器上实施正常飞行程序指挥，以及进行系统检查程序。而有参与研制飞行模拟器经历并不是对无人机机长的训练要求，因此不属于此范畴。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0229","type":"single","difficulty":1,"stem":"下列不属于对无人机驾驶员训练要求的是（）。","options":[{"key":"A","text":"在模拟器实施飞行前检查，不少于1小时"},{"key":"B","text":"在实物训练系统实施飞行前检查，不少于3小时"},{"key":"C","text":"在实物训练系统实施应急飞行程序指挥，包括规避航空器、发动机故障、链路丢失，应急回收、迫降等，不少于10小时"}],"answer":"C","analysis":"提示：选错的。驾驶员不指挥\n解析：对无人机驾驶员的训练要求包括在模拟器和实物训练系统上实施飞行前检查，但并未特定要求在实物训练系统上实施包括多种应急情况的飞行程序指挥达到10小时。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0230","type":"single","difficulty":1,"stem":"下列不属于对无人机视距内驾驶员训练要求的是（）。","options":[{"key":"A","text":"在模拟器实施正常飞行程序操作，不少于3小时"},{"key":"B","text":"在实物训练系统实施正常飞行程序操作，不少于10小时"},{"key":"C","text":"在模拟器实施应急飞行程序指挥，包括规避航空器、发动机故障、链路丢失、应急回收、迫降等，不少于3小时"}],"answer":"C","analysis":"提示：选错的。驾驶员不指挥\n解析：对无人机视距内驾驶员的训练要求包括在模拟器和实物训练系统上实施正常飞行程序操作，但并未要求实施应急飞行程序指挥。应急飞行程序指挥属于更高级别的训练要求，","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0231","type":"single","difficulty":1,"stem":"下列属于对无人机机长训练要求的是（）。","options":[{"key":"A","text":"在模拟器实施应急飞行程序指挥，包括规避航空器、发动机故障、链路丢失、应急回收、迫降等，不少于3小时"},{"key":"B","text":"在模拟器实施正常飞行程序操作，不少于3小时"},{"key":"C","text":"实物训练系统实施正常飞行程序操作，不少于10小时"}],"answer":"A","analysis":"提示：机长指挥\n解析：对无人机机长的训练要求包括在模拟器上实施应急飞行程序指挥，这涵盖了规避航空器、发动机故障、链路丢失、应急回收、迫降等多种情况，是高级别训练的重要内容。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0232","type":"single","difficulty":1,"stem":"下列属于对无人机驾驶员训练要求的 是（）。","options":[{"key":"A","text":"在模拟器实施应急飞行程序操作，包括发动机故障、链路丢失、应急回收、迫降等，不少于3小时"},{"key":"B","text":"在模拟器实施正常飞行程序指挥，不少于3小时"},{"key":"C","text":"在实物训练系统实施正常飞行程序指挥，不少于10小时"}],"answer":"A","analysis":"提示：选对的。排除驾驶员不指挥\n解析：对无人机驾驶员的训练要求包括在模拟器上实施应急飞行程序操作，这涉及发动机故障、链路丢失、应急回收、迫降等应急情况的处理，是提升驾驶员应对突发状况能力的重要训练。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0233","type":"single","difficulty":1,"stem":"CCAR-61部授权的执照或等级申请人，在理论考试中有作弊或其他禁止的行为，局方拒绝其执照或等级以及考试申请的期限为（）。","options":[{"key":"A","text":"半年"},{"key":"B","text":"视其违规的情节轻重而定"},{"key":"C","text":"一年"}],"answer":"C","analysis":"提示：申请人作弊，1年，选最久（CCAR开头，有3选3，没3选1）\n解析：根据《民用航空器驾驶员和地面教员合格审定规则》(CCAR-61-R4)第61.245条 理论考试中的作弊或其他禁止的行为的处罚:(a) 对于违反本规则第61.37条规定的执照或等级申请人,局方对申请人予以警告，申请人自该行为被发现之日起一年内不得申请按照本规则颁发的执照或等级以及考试。。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0234","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别视距内等级申请人必须具有不少于 ( ) 小时的带飞训练时间。","options":[{"key":"A","text":"44"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"B","analysis":"提示：带飞视距内10，超视距15\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1.1.4 飞行经历要求:视距内等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 44 小时的飞行经历时间，其中包括（a）按照本规定 1.3 条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于 10 小时带飞训练，不少于 5 小时单飞训练，计入驾驶员飞行 经历的飞行模拟训练时间不多于 22 小时；","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0235","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别超视距等级申请人必须具有不少于( )小时的带飞训练时间。","options":[{"key":"A","text":"56"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"C","analysis":"提示：带飞视距内10，超视距15\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0236","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别超视距等级申请人必须具有不少于 ( ) 小时的单飞训练时间。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"A","analysis":"提示：单飞都是5\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0237","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别视距内等级申请人必须具有不少于 ( ) 小时的单飞训练时间。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"A","analysis":"提示：单飞都是5\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0238","type":"single","difficulty":1,"stem":"无人机系统飞行器平台主要使用的是（）空气的动力驱动的航空器。","options":[{"key":"A","text":"轻于"},{"key":"B","text":"重于"},{"key":"C","text":"等于"}],"answer":"B","analysis":"提示：重于空气\n解析：航空器依据获得升力的方式不同分为两大类：一类是轻于空气的航空器,依靠空气的浮力飘浮于空中,如气球、飞艇等;一类是重于空气的航空器,包括非动力驱动和动力驱动两种类型。无人机系统飞行器平台主要使用的是重于空气的动力驱动的航空器。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0239","type":"single","difficulty":1,"stem":"（）传感器是飞行控制系统的基本传感器之一，用以改善系统的阻尼特性。","options":[{"key":"A","text":"空速"},{"key":"B","text":"迎角、侧滑角"},{"key":"C","text":"角速率"}],"answer":"C","analysis":"提示：角速度改变阻尼\n解析：无人机(无人机定位)飞行控制系统中常用的传感器包括角速率传感器、姿态传感器、导航传感器、高速空速传感器、飞机位置传感器、迎角传感器、过载传感器等。角速率传感器是飞行控制系统的基本传感器之一，用于感受无人机绕机体轴的旋提高系统的转角速率，形成角速率反馈，阻尼特性，提高稳定性。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0240","type":"single","difficulty":1,"stem":"（）的功能是向无人机各用电系统或设备提供满足预定设计要求的电能。","options":[{"key":"A","text":"供电系统"},{"key":"B","text":"配电系统"},{"key":"C","text":"电源"}],"answer":"A","analysis":"提示：供电=电源+配电\n解析：在无人机系统中，供电系统的功能是向无人机各用电气系统或设备提供满足预定设计要求的电能。供电系统是无人机电力供应的核心部分，它负责将电源(如电池)的电能有效地分配给无人机的各个用电系统或设备，确保无人机能够正常运行并完成预定任务。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0241","type":"single","difficulty":1,"stem":"（）功能通常包括指挥调度、任务规划、操作控制、显示记录等功能。","options":[{"key":"A","text":"数据链路分系统"},{"key":"B","text":"无人机地面站系统"},{"key":"C","text":"飞控与导航系统"}],"answer":"B","analysis":"提示：地面站:指挥控制+任务规划\n解析：无人机地面站系统的功能通常包括指挥调度、任务规划、操作控制、显示记录等功能。 1.指挥调度功能主要包括上级指令接收、系统之间联络、系统内部调度。 2.任务规划功能主要包括飞行航路规划与重规划、任务载荷工作规划与重规划。 3.操作控制功能主要包括起降操纵、飞行控制操作、任务载荷操作、数据链 控制。 4.显示记录功能主要包括飞行状态参数显示与记录、航迹显示与记录、任务载荷信息显示与记录等。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0242","type":"single","difficulty":1,"stem":"（）两者组合统称为供电系统。","options":[{"key":"A","text":"电源和电缆"},{"key":"B","text":"电缆和配电系统"},{"key":"C","text":"电源和配电系统"}],"answer":"C","analysis":"提示：供电=电源+配电,哪里都没电缆\n解析：供电系统=电源+配电系统（电线+保护装置）在无人机上使用的动力、测控、飞行控制与管理、导航、任务设备等系统都与电气系统有关。无人机电气系统一般包括电源、配电系统、用电设备三个部分。电源和配电系统两者的组合统称为供电系统。供电系统的功能是向无人机各用电系统或设备提供满足预定设计要求的电能。配电系统应将电能可靠面有效地输送到各用电系统和设备。配电系统由传输电线和控制与保护装置组成。（鼠鼠老师的话：电线/电缆 归属配电系统，所以不能单独出现，单独出现带电线/电缆的选项就错啦）","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0243","type":"single","difficulty":1,"stem":"（）频段可用于无人机系统下行链路，该无线电台工作时不得对其他合法无线电业务造成影响，也不能寻求无线电干扰保护。","options":[{"key":"A","text":"840.5-845MHz"},{"key":"B","text":"2408-2440MHz"},{"key":"C","text":"1430-1446MHz"}],"answer":"B","analysis":"提示：飞机用高频，选最大\n解析：《工业和信息化部关于无人驾驶航空器系统频率使用事宜的通知》规定，2408-2440MHz频段可作为无人驾驶航空器系统上行遥控、下行遥测与信息传输链路的备份频段。使用时需遵守微功率设备规范，不提供干扰保护。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0244","type":"single","difficulty":1,"stem":"（）是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统，对无人机实现全权控制与管理，因此该子系统之于无人机相当于驾驶员之于有人机，是无人机执行任务的关键。","options":[{"key":"A","text":"飞控计算机"},{"key":"B","text":"导航子系统"},{"key":"C","text":"飞控子系统"}],"answer":"C","analysis":"提示：飞控子是核心\n解析：飞控子系统是无人机完成起飞、空中飞行执行任务、返场回收等整个飞行过程的核心系统，对无人机实现全权控制与管理。因此，该子系统之于无人机相当于驾驶员之于有人机，是无人机执行任务的关键。飞控子系统通过高效的控制算法内核，能够精准地感应并计算出飞行器的飞行姿态等数据，再通过主控制单元实现精准定位悬停和自主平稳飞行。它是无人机完成各种任务的核心。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0245","type":"single","difficulty":1,"stem":"（）是由控制站上的操纵杆直接控制无人机的舵面，遥控无人机的飞行。","options":[{"key":"A","text":"舵面遥控"},{"key":"B","text":"姿态遥控"},{"key":"C","text":"指令控制"}],"answer":"A","analysis":"提示：问题对答案，舵面对舵面\n解析：舵面遥控又称纯手动模式，飞控不参与工作，直接控制无人机的舵面。舵面遥控是由控制站上的操纵杆直接控制无人机的舵面，遥控无人机的飞行。在一些简单的无人机模型操控中，操纵者通过移动控制站的操纵杆，直接改变无人机的升降舵、方向舵等舵面的角度，从而实现对无人机飞行姿态和方向的精准控制。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0246","type":"single","difficulty":1,"stem":"（）与无人机控制站的功能类似，但只能控制无人机的机载任务设备，不能进行无人机的飞行控制。","options":[{"key":"A","text":"指挥处理中心"},{"key":"B","text":"无人机控制站"},{"key":"C","text":"载荷控制站"}],"answer":"C","analysis":"提示：机载任务选载荷\n解析：载荷控制站专注于无人机机载任务设备的控制。它不能干预无人机的飞行过程，只能对任务载荷进行精细的操作和调整，以确保任务载荷能够按照预定计划高效、准确地执行任务。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0247","type":"single","difficulty":1,"stem":"（）主要是由飞行操纵、任务载荷控制、数据链路控制和通信指挥等组成，可完成对无人机机载任务载荷等的操纵控制。","options":[{"key":"A","text":"指挥处理中心"},{"key":"B","text":"无人机控制站"},{"key":"C","text":"载荷控制站"}],"answer":"B","analysis":"提示：有载荷又有指挥，选控制站\n解析：无人机控制站主要是由飞行操纵、任务载荷控制、数据链路控制和通信指挥等组成，可完成对无人机机载任务载荷等的操纵控制。飞行操纵:负责无人机的飞行控制，包括起飞、降落、飞行姿态调整等。无人机通常搭载各种任务载荷，如相机、传感器、探测器等，用于执行特定的任务。数据链路是无人机与地面控制站之间的通信桥梁。通信指挥系统负责无人机与地面控制站之间的指令传递和信息交流。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0248","type":"single","difficulty":1,"stem":"（）主要是制定无人机飞行任务、完成无人机载荷数据的处理和应用，指挥中心/数据处理中心一般都是通过无人机控制站等间接地实现对无人机的控制和数据接收。","options":[{"key":"A","text":"无人机控制站"},{"key":"B","text":"指挥处理中心"},{"key":"C","text":"载荷控制站"}],"answer":"B","analysis":"提示：答案藏在问题里 指挥中心/数据处理中心=指挥处理中心\n解析：指挥处理中心主要是制定无人机飞行任务、完成无人机载荷数据的处理和应用。指挥处理中心负责规划和制定无人机的飞行任务;可以通过远程控制站等设备，实时干预无人机的飞行，以应对飞行过程中的变化和意外情况。指挥处理中心负责接收处理和分析传感器所采集的数据。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0249","type":"single","difficulty":1,"stem":"不属于抵消旋翼机反转力矩的方法有（）。","options":[{"key":"A","text":"尾桨"},{"key":"B","text":"共轴旋翼"},{"key":"C","text":"增大旋翼半径"}],"answer":"C","analysis":"提示：抵消没有半径\n解析：旋翼机在飞行过程中，旋翼的旋转会产生一个与旋转方向相反的反转力矩，这个力矩会影响无人机的飞行稳定性。为了抵消这个反转力矩，常用的方法包括尾桨和共轴旋翼。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0250","type":"single","difficulty":1,"stem":"不属于无人机的是（）。","options":[{"key":"A","text":"塞斯纳"},{"key":"B","text":"侦察兵"},{"key":"C","text":"捕食者"}],"answer":"A","analysis":"提示：塞斯纳-有人飞机\n解析：“塞斯纳”（Cessna）是美国通用航空飞机品牌，旗下主流机型为轻型教练机型与中小型商务机。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0251","type":"single","difficulty":1,"stem":"不属于无人机系统的是（）。","options":[{"key":"A","text":"飞行器平台"},{"key":"B","text":"飞行员"},{"key":"C","text":"导航飞控系统"}],"answer":"B","analysis":"提示：飞行员是人，不是系统\n解析：无人机系统主要由机体、飞行控制系统、动力系统、导航系统和任务载荷等部分组成，能够实现无人驾驶。飞行员是有人驾驶飞机的操作者，负责驾驶飞机并执行飞行任务，不属于无人机。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0252","type":"single","difficulty":1,"stem":"不属于无人机飞控计算机任务范畴的是（）。","options":[{"key":"A","text":"姿态稳定与控制"},{"key":"B","text":"自主飞行控制"},{"key":"C","text":"数据中继"}],"answer":"C","analysis":"提示：飞控不管中继\n解析：飞控计算机的核心任务是“算”和“控”。而数据中继是通信概念，指接收一端的数据后再转发给另一端，用于扩大通信距离或连接不同网络，通常由通信链路、数传电台或专门的中继设备完成，不属于飞控计算机的直接任务。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0253","type":"single","difficulty":1,"stem":"从应用上说，涡桨发动机适用于（）。","options":[{"key":"A","text":"中高空长航时无人机"},{"key":"B","text":"高空长航时无人机/无人战斗机"},{"key":"C","text":"中低空、低速短距/垂直起降无人机"}],"answer":"A","analysis":"提示：涡桨-中高长\n解析：涡桨发动机推进效率高且耗油率低，适用于中高空长航时无人机，飞机起飞重量可达3000kg。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0254","type":"single","difficulty":1,"stem":"大型无人机计算装载重量和重心的方法主要有：计算法、图表法和（）。","options":[{"key":"A","text":"试凑法"},{"key":"B","text":"查表法"},{"key":"C","text":"约取法"}],"answer":"B","analysis":"提示：试凑约取，太笼统，需准确\n解析：大型无人机计算装载重量和中心(重心)的方法主要有计算法、图表法和查表法。查表法是利用已有的无人机设计数据库或经验数据表，通过查找相似无人机的装载重量和重心数据，来估算当前无人机的相关参数。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0255","type":"single","difficulty":1,"stem":"导航子系统功能是向无人机提供（）信息，引导无人机沿指定航线安全、准时、准确的飞行。","options":[{"key":"A","text":"角速度"},{"key":"B","text":"角加速度"},{"key":"C","text":"高度、位置"}],"answer":"C","analysis":"提示：高位\n解析：导航子系统的功能是向无人机提供相对于所选定的参考坐标系的位置、速度 、飞行姿态,引导无人机沿指定航线安全、准时、准确地飞行。完善的无人机导航子系统具有以下功能: (1)获得必要的导航要素,包括高度、速度、姿态、航向。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0256","type":"single","difficulty":1,"stem":"地面控制站飞行参数综合显示的内容包括（）。","options":[{"key":"A","text":"飞行与导航信息、数据链状态信息、设备状态信息、指令信息"},{"key":"B","text":"导航信息显示、航迹绘制显示以及地理信息的显示"},{"key":"C","text":"告警信息、地图航迹显示信息"}],"answer":"A","analysis":"提示：地面控制站-（四个信息）有指令\n解析：飞行参数综合显示可根据飞行与任务需要,选择需要的系统信息予以显示便于无人机驾驶员判读。主要包括以下四个方面。(1)飞行与导航信息(2)数据链状态信息(3)设备状态信息(4)指令信息","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0257","type":"single","difficulty":1,"stem":"地面站地图航迹显示系统可为无人机驾驶员提供无人机（）等信息。","options":[{"key":"A","text":"位置"},{"key":"B","text":"飞行姿态"},{"key":"C","text":"飞控状态"}],"answer":"A","analysis":"提示：地图提供位置\n解析：地图航迹显示可为无人机驾驶员提供无人机位置等导航信息。它包括飞机的导航信息显示、航违绘制显示以及地理信息的显示。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0258","type":"single","difficulty":1,"stem":"电动动力系统主要由动力电机、动力电源和（）组成。","options":[{"key":"A","text":"调速系统"},{"key":"B","text":"电池"},{"key":"C","text":"无刷电机"}],"answer":"A","analysis":"提示：动力系统=电机+电源+调速系统\n解析：电动动力系统主要由动力电机、动力电源和调速系统(也称为电调)组成。调速系统也就是指电调，其作用为有两点，一是调整供给电机的电流从而控制旋翼转速，二是把电池的直流电转换为交流电供电机使用。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0259","type":"single","difficulty":1,"stem":"对于在大风天伞降回收的民用无人机，以下说法错误的是?","options":[{"key":"A","text":"尽量在高高度开伞"},{"key":"B","text":"尽量在上风区开伞"},{"key":"C","text":"尽量在有技术条件的情况下，接地后切断主伞连接"}],"answer":"A","analysis":"提示：选错的。高开伞×\n解析：大风中开伞越高，伞降时间通常越长，无人机被风吹离预定落点的距离也可能越大。×在上风侧开伞，为下风漂移预留空间 √接地后解除主伞连接，可减少被充气伞拖行的风险√","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0260","type":"single","difficulty":1,"stem":"多旋翼飞行器的飞控指的是（）。","options":[{"key":"A","text":"机载任务系统"},{"key":"B","text":"机载遥控接收机"},{"key":"C","text":"机载导航飞控系统"}],"answer":"C","analysis":"提示：问题对答案，飞控对飞控\n解析：多旋翼飞行器的飞控指的是机载导航飞控系统。飞控，全称飞行控制系统，是无人机等飞行器的重要组成部分，类似于电脑的操作系统。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0261","type":"single","difficulty":1,"stem":"二冲程活塞汽油发动机应使用何种润滑油?","options":[{"key":"A","text":"4T机油"},{"key":"B","text":"2T机油"},{"key":"C","text":"汽车机油"}],"answer":"B","analysis":"提示：二冲对2T\n解析：二冲程活塞汽油发动机应使用2T机油。这种机油专为二冲程发动机设计，能够提供出色的润滑和清洁性能，确保引擎内部部件得到充分保护，并保障顺畅的动力输出。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0262","type":"single","difficulty":1,"stem":"二冲程汽油发动机中，燃料箱加注的是（）。","options":[{"key":"A","text":"润滑油"},{"key":"B","text":"汽油"},{"key":"C","text":"汽油与润滑油的混合物"}],"answer":"C","analysis":"提示：四冲汽油，二冲混合\n解析：传统的二冲程汽油发动机，需要按规定比例将润滑油与汽油混合后加入燃料箱，在燃烧供油过程中同时完成发动机内部润滑。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0263","type":"single","difficulty":1,"stem":"飞控子系统必须具备的功能为（）。","options":[{"key":"A","text":"无人机姿态稳定与控制，无人机飞行管理，应急控制"},{"key":"B","text":"无人机飞行管理，与导航子系统协调完成航迹控制，信息收集与传递"},{"key":"C","text":"无人机起飞与着陆控制，无人机飞行管理，信息收集与传递"}],"answer":"A","analysis":"提示：飞控子必有姿态\n解析：飞控子系统是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统,对无人机实现全权控制与管理,。飞控子系统主要具有如下功能： (1)无人机姿态稳定与控制; (2)与导航子系统协调完成航迹控制; (3)无人机起飞(发射)与着陆(回收)控制: (4)无人机飞行管理; (5)无人机任务设备管理与控制; (6)应急控制; (7)信息收集与传递。以上所列的功能中第1、4和6项是所有无人机飞行控制系统所必须具备的功能面。其他项则不是每一种飞行控制系统都具备的,也不是每一种无人机都需要的,根据具体无人机的种类和型号可进行选择、裁剪和组合。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0264","type":"single","difficulty":1,"stem":"飞控子系统可以不具备如下功能：（）。","options":[{"key":"A","text":"任务分配与航迹规划"},{"key":"B","text":"导航与制导控制"},{"key":"C","text":"姿态稳定与控制"}],"answer":"A","analysis":"提示：选错的。任务分配×\n解析：飞控子系统是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统,对无人机实现全权控制与管理,。飞控子系统主要具有如下功能： (1)无人机姿态稳定与控制; (2)与导航子系统协调完成航迹控制; (3)无人机起飞(发射)与着陆(回收)控制: (4)无人机飞行管理; (5)无人机任务设备管理与控制; (6)应急控制; (7)信息收集与传递。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0265","type":"single","difficulty":1,"stem":"飞行控制是指采用（）对无人机在空中整个飞行过程的控制。","options":[{"key":"A","text":"遥感方式"},{"key":"B","text":"遥测方式"},{"key":"C","text":"遥控方式"}],"answer":"C","analysis":"提示：遥控飞机\n解析：飞行控制是指采用遥控方式对无人机在空中整个飞行过程的控制。无人机的飞行控制系统是其核心所在，主要由传感器、控制器和执行机构组成。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0266","type":"single","difficulty":1,"stem":"活塞式发动机混合气过富油燃烧将引起（）的问题。","options":[{"key":"A","text":"发动机工作平稳，但燃油消耗量变大"},{"key":"B","text":"电嘴积炭"},{"key":"C","text":"发动机过热"}],"answer":"B","analysis":"提示：富油→积炭\n解析：混合气过富油时，燃油相对过多、燃烧不充分，容易使电嘴（火花塞）积炭，进而导致点火不良、发动机工作不平稳。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0267","type":"single","difficulty":1,"stem":"活塞式发动机系统常采用的增压技术主要是用来（）。","options":[{"key":"A","text":"提高功率"},{"key":"B","text":"减少废气量"},{"key":"C","text":"增加转速"}],"answer":"A","analysis":"提示：增压→提高功率\n解析：活塞发动机系统常采用的增压技术主要是用来提高功率。增压技术通过增加发动机进气量和提高气缸内压力，使燃烧更加充分，从而提高燃料的燃烧效率。这种效率的提升直接反映在发动机功率输出的增加上。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0268","type":"single","difficulty":1,"stem":"活塞式发动机中，CDI系统属于（）的一部分。","options":[{"key":"A","text":"进气系统"},{"key":"B","text":"排气系统"},{"key":"C","text":"点火系统"}],"answer":"C","analysis":"提示：CDI点火\n解析：在活塞式发动机中，CDI系统属于点火系统的一部分。CDI系统全称为电容放电式点火系统(CapacitorDischargelgnition)，它是一种电子点火系统，被广泛应用于摩托车、电锯、涡轮动力飞行器以及一些汽车和无人机上。这种系统通过电容器充电储存所需的电量，并在需要的时候一口气放出电流经过点火线圈，使其产生高压电触发火星塞点火。这种方式可以缩短点火线圈的二次电压产生时间，使得点火系统更适合用在高转速的引擎上。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0269","type":"single","difficulty":1,"stem":"民用无人机上的舵机一般输出行程为（）。","options":[{"key":"A","text":"正负120°"},{"key":"B","text":"正负20°"},{"key":"C","text":"正负10°"}],"answer":"B","analysis":"提示：民用舵机，正负20度\n解析：民用无人机上的舵机一般输出行程为正负20度。舵机能够从其中立位置向两个方向名转动20度，总共覆盖40度的范围。这个输出行程对于大多数无人机飞行控制来说是足够的，因为它允许无人机进行必要的方向调整和姿态控制。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0270","type":"single","difficulty":1,"stem":"目前民用无人机上多用的舵机属于哪种伺服执行机构类型?","options":[{"key":"A","text":"电动伺服执行机构"},{"key":"B","text":"电液伺服执行机构"},{"key":"C","text":"气动伺服执行机构"}],"answer":"A","analysis":"提示：民用电动伺服\n解析：民用无人机常用舵机通常由小型电机、减速齿轮和位置反馈电路组成，将电信号转换为舵面或机构的机械运动。电液和气动伺服机构结构复杂、重量较大，较少用于普通民用无人机。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0271","type":"single","difficulty":1,"stem":"目前世界上无人机的频谱使用主要集中在UHF、L和（）波段。","options":[{"key":"A","text":"任意"},{"key":"B","text":"C"},{"key":"C","text":"VHF"}],"answer":"B","analysis":"提示：C波\n解析：无人机通信链路需要使用无线电资源,目前世界上无人机的频谱使用主要集中在UHF、L和C波段,其他频段也有零散分布。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0272","type":"single","difficulty":1,"stem":"目前主流的民用无人机所采用的动力系统通常为活塞式发动机和（）两种。","options":[{"key":"A","text":"涡扇发动机"},{"key":"B","text":"电动机"},{"key":"C","text":"火箭发动机"}],"answer":"B","analysis":"提示：民用活塞和电动\n解析：目前主流的民用无人机所采用的动力系统通常为活塞式发动机和电动机两种。活塞式发动机通过燃料燃烧产生动力，驱动无人机的螺旋桨或旋翼旋转，从而实现飞行。活塞式发动机的优点在于推力大、续航时间长，但相对而言重量和体积也较大，且维护成本较高。电动机具有体积小、重量轻、效率高、噪音低等优点，特别适合于小型和微型无人机。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0273","type":"single","difficulty":1,"stem":"农用无人机按机型结构通常分为（）、单旋翼无人机、多旋翼无人机。","options":[{"key":"A","text":"电动无人机"},{"key":"B","text":"油动无人机"},{"key":"C","text":"固定翼无人机"}],"answer":"C","analysis":"提示：按结构：都有翼\n解析：农用无人机按机型结构通常分为固定翼无人机、单旋翼无人机、多旋翼无人机。固定翼无人机由动力装置(如柴油发动机、电机等)产生推力或拉力，并由机翼产生升力。单旋翼无人机主要通过一个主旋翼产生升力和推力，同时可能配备尾桨以控制飞行方向。多旋翼无人机以三个或偶数个对称非共轴螺旋桨产生推力上升，通过调整各螺旋桨的转速来改变飞行姿态和位查。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0274","type":"single","difficulty":1,"stem":"气垫着陆，（）。","options":[{"key":"A","text":"气垫着陆的最大缺点是，不能在未经平整的地面、泥地、冰雪或水上着陆"},{"key":"B","text":"优点是不受无人机大小，重量限制，且回收效率高"},{"key":"C","text":"空中回收则是1分钟1架次"}],"answer":"B","analysis":"提示：气垫着陆选优点\n解析：气垫着陆的显著优点是不受无人机大小、重量限制，且回收效率高。这一特性使得气垫着陆系统能够广泛应用于各种尺寸的无人机，并在回收过程中提供高效、安全的解决方案。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0275","type":"single","difficulty":1,"stem":"气化器式活塞发动机在何时容易出现气化器回火现象?","options":[{"key":"A","text":"热发动机起动时"},{"key":"B","text":"油门收的过猛"},{"key":"C","text":"寒冷天气第一次起动时"}],"answer":"C","analysis":"提示：冬天，第一次回火\n解析：化器式活塞发动机在寒冷天气第一次起动时容易出现气化器(化油器)回火现象，这主要是由于在寒冷的天气中，由于温度较低，燃油的蒸发速度会变慢，导致混合气中的燃油成分相对较少，混合气变得稀薄，这种稀薄的混合气在点火时可能无法正常燃烧，从而引发回火现象;寒冷天气还可能影响燃油管路的通畅性，导致燃油供应不足，当发动机启动时，如果燃油无法及时且充足地供应到汽化器(化油器)，混合气体的燃烧过程将受到影响，可能引发回火。为了预防这一现象的发生，可以采取使用预热器、提高节气门的开启程度以及检查燃油管路等措施。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0276","type":"single","difficulty":1,"stem":"如果无人机数据链路上行中断，会发生的后果（）。","options":[{"key":"A","text":"无人机退出地面站控制模式"},{"key":"B","text":"不能获取无人机状态信息"},{"key":"C","text":"无法在线重规划航线航点及发送任务指令"}],"answer":"C","analysis":"提示：上行任务，下行状态\n解析：如果无人机数据链路上行中断，会发生无法在线重规划航线航点及发送任务指令的情况。无人机数据链路是无人机与地面控制站之间进行数据传输的通道，包括上行链路和下行链路。上行链路主要用于从地面控制站向无人机发送指令和数据，如下达任务指令、规划航线航点等;下行链路则用于无人机向地面控制站传输状态信息、图像数据等。当数据链路上行中断时，意味着地面控制站无法向无人机发送指令和数据。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0277","type":"single","difficulty":1,"stem":"属于无人机飞控子系统功能的是（）。","options":[{"key":"A","text":"导航控制"},{"key":"B","text":"任务信息收集与传递"},{"key":"C","text":"无人机姿态稳定与控制"}],"answer":"C","analysis":"提示：飞控子必有姿态\n解析：飞控子系统是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统,对无人机实现全权控制与管理,。飞控子系统主要具有如下功能： (1)无人机姿态稳定与控制; (2)与导航子系统协调完成航迹控制; (3)无人机起飞(发射)与着陆(回收)控制: (4)无人机飞行管理; (5)无人机任务设备管理与控制; (6)应急控制; (7)信息收集与传递。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0278","type":"single","difficulty":1,"stem":"不属于无人机飞控子系统所需要信息的是（）。","options":[{"key":"A","text":"空速"},{"key":"B","text":"经/纬度"},{"key":"C","text":"姿态角"}],"answer":"B","analysis":"提示：不属于。经纬度× 飞控不看经纬度\n解析：无人机飞控子系统主要需要姿态角信息来控制无人机的飞行姿态，需要空速信息来调整飞行速度等。而经/纬度信息主要用于导航定位，不属于飞控子系统直接需要的信息。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0279","type":"single","difficulty":1,"stem":"四冲程汽油发动机中，燃料箱加注的是（）。","options":[{"key":"A","text":"汽油"},{"key":"B","text":"汽油与润滑油的混合物"},{"key":"C","text":"润滑油"}],"answer":"A","analysis":"提示：四冲汽油，二冲混合\n解析：四冲程汽油发动机的工作原理基于四个连续的冲程:进气、压缩、燃烧和排气。在这种发动机中，燃料箱是用来存储燃料的，而加注到燃料箱中的就是汽油。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0280","type":"single","difficulty":1,"stem":"位置传感器用于感受无人机的位置，是飞行国际控制的必要前提，（）是典型的位置传感器。","options":[{"key":"A","text":"角速率传感器"},{"key":"B","text":"加速度传感器"},{"key":"C","text":"GPS卫星导航接收机"}],"answer":"C","analysis":"提示：位置→GPS\n解析：位置传感器用于感受无人机的位置，是飞行国际控制的必要前提，GPS卫星导航接收机是典型的位置传感器。GPS卫星导航接收机通过接收来自全球定位系统(GPS)卫星的信号，能够计算出无人机在地球上的精确位置、速度和时间信息。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0281","type":"single","difficulty":1,"stem":"无人机搭载任务设备重量主要受限制于（）。","options":[{"key":"A","text":"最大起飞重量"},{"key":"B","text":"空重"},{"key":"C","text":"载重能力"}],"answer":"C","analysis":"提示：问题对答案， 搭载重量对搭载重量\n解析：无人机的载重能力是指无人机在特定飞行条件下，能够安全携带并运输的最大重量。无人机搭载任务设备重量主要受限制于跻载重能力。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0282","type":"single","difficulty":1,"stem":"无人机地面站系统可以由不同功能的若干控制站模块组成，其不包括（）。","options":[{"key":"A","text":"载荷控制站"},{"key":"B","text":"无人机控制站"},{"key":"C","text":"机载电台"}],"answer":"C","analysis":"提示：机载电台在飞机上 地面站无\n解析：地面站可以包含无人机控制站、载荷控制站等地面控制模块；机载电台安装在无人机上，属于机载通信设备，不是地面控制站模块。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0283","type":"single","difficulty":1,"stem":"无人机地面站显示系统应能显示（）信息。","options":[{"key":"A","text":"飞行器状态及链路、载荷状态"},{"key":"B","text":"飞行空域及气象信息"},{"key":"C","text":"无人机飞行员状态"}],"answer":"A","analysis":"提示：上指令下（地面站）状态\n解析：无人机地面站显示系统主要显示的内容包括以下三个方面：1.飞行参数综合显示（飞行与导航信息、据链状态信息、设备状态信息、指令信息）2..告警3..地图航迹显示","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0284","type":"single","difficulty":1,"stem":"无人机的发动机采用重力供油系统但装有增压泵，主要为了（）。","options":[{"key":"A","text":"保证爬升、下降及其他特殊情况下的正常供油"},{"key":"B","text":"保证大速度巡航的用油"},{"key":"C","text":"减少油箱的剩余燃油"}],"answer":"A","analysis":"提示：问题对答案， 供油对供油\n解析：重力供油在姿态变化、爬升、下降时，由于机身的倾斜，燃油液面和有效压头发生变化 ，供油压力可能不足。 增压泵可提高燃油压力，保证发动机持续、稳定供油。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0285","type":"single","difficulty":1,"stem":"无人机电气系统一般包括3个部分（）。","options":[{"key":"A","text":"电源、电缆、接插件"},{"key":"B","text":"电源、配电系统、用电设备"},{"key":"C","text":"电缆、供电系统、用电设备"}],"answer":"B","analysis":"提示：电源--配电--用电\n解析：无人机电气系统一般包括电源、配电系统、用电设备三个部分。这三个部分相互协作，共同确保无人机的正常运行。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0286","type":"single","difficulty":1,"stem":"无人机驾驶航空器系统必要的组成部分是（）。","options":[{"key":"A","text":"飞行器平台、控制站"},{"key":"B","text":"飞行器平台、控制站、通讯链路"},{"key":"C","text":"飞行器平台、通讯链路"}],"answer":"B","analysis":"提示：机，战，链\n解析：无人机驾驶航空器系统必要的组成部分是飞行器平台、控制站、通讯链路。飞行器平台负责在空中进行飞行任务。控制站是无人机系统的地面控制中心，负责向无人机发送指令和控制信号，同时接收无人机传回的飞行数据和图像信息。通讯链路是无人机与地面控制站之间进行数据传输和通信的桥梁。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0287","type":"single","difficulty":1,"stem":"无人机燃油箱通气目的之一是（）。","options":[{"key":"A","text":"通气增大供油流量"},{"key":"B","text":"保证向发动机正常供油"},{"key":"C","text":"通气减小供油流量"}],"answer":"B","analysis":"提示：通气→正常供油\n解析：燃油箱通气可以平衡油箱内部与外界的大气压力，避免随着燃油减少形成负压，从而保证燃油能够顺利流向发动机。不能直接增大或减小供油流量。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0288","type":"single","difficulty":1,"stem":"无人机数据链路下行中断会（）。","options":[{"key":"A","text":"无人机退出地面站控制模式"},{"key":"B","text":"不能获取无人机状态信息"},{"key":"C","text":"无法在线重规划航线航点及发送任务指令"}],"answer":"B","analysis":"提示：上指令，下状态\n解析：民用无人机系统有三条主要链路。发指令给无人机：上行无人机传图与数据回来：下行飞行数据来回： 上下（鼠鼠老师的话：我们想象一下，我们在地上，用遥控器遥控天上的无人机，发出去的“指令”往上走，所以是“上传”; 无人机将数据与图像传回地面，数据图像往下走，所以是下行。）无人机数据链路下行中断，我们就失去了无人机实时数据，导致→不能获取无人机状态信息。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0289","type":"single","difficulty":1,"stem":"无人机通过（）控制舵面和发动机节风门来实现无人机控制。","options":[{"key":"A","text":"伺服执行机构"},{"key":"B","text":"操纵杆"},{"key":"C","text":"脚蹬"}],"answer":"A","analysis":"提示：伺服\n解析：无人机飞控系统输出控制信号后，由伺服执行机构驱动舵面和发动机节风门，实现姿态与动力控制。操纵杆、脚蹬属于有人机的人工操纵装置。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0290","type":"single","difficulty":1,"stem":"无人机系统通讯链路主要包括:指挥与控制(C&C)、（ ）、感知和规避(S&A)。","options":[{"key":"A","text":"无线电侦察"},{"key":"B","text":"空中交通管制(ATC)"},{"key":"C","text":"电子干扰"}],"answer":"B","analysis":"提示：ATC（括号和字母）\n解析：根据ITU-RM.2171报告给出的定义,无人机系统通信链路是指控制和无载荷链路，主要包括：指挥与控制(C&C)、空中交通管制(ATC)、感知和规避(S&A) 三种链路。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0291","type":"single","difficulty":1,"stem":"无人机相对有人机的优势，以下哪个条件不正确?","options":[{"key":"A","text":"无需生命支持系统"},{"key":"B","text":"训练可多依赖于模拟器"},{"key":"C","text":"可靠性指标高"}],"answer":"C","analysis":"提示：选错的。无人机不可靠\n解析：飞行器的可靠性取决于设计、制造、维护及使用条件，不能仅凭是否载人判断无人机的可靠性指标更高。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0292","type":"single","difficulty":1,"stem":"无人机在增稳飞行控制模式下，飞控子系统（）控制。","options":[{"key":"A","text":"不参与"},{"key":"B","text":"不确定"},{"key":"C","text":"参与"}],"answer":"C","analysis":"提示：子系统，参与，\n解析：无人机在增稳飞行控制模式下，飞控子系统参与控制。增稳飞行控制模式是无人机飞行控制系统中的一种重要模式，它旨在通过飞控子系统的参与，提高无人机在飞行过程中的稳定性和安全性。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0293","type":"single","difficulty":1,"stem":"视距内通信的无人机多数安装（）,而需要进行超视距通信的无人机一般采用自跟踪抛物面卫通天线。","options":[{"key":"A","text":"定向天线"},{"key":"B","text":"蘑菇头天线"},{"key":"C","text":"全向天线"}],"answer":"C","analysis":"提示：视距内全向\n解析：全向天线在水平方向上360°均匀辐射，适合近距离、多方向的视距内通信，常用于消费级无人机或日常航拍任务中，操作简便，无需精确对准方向。 而超视距通信需要更强的方向性和增益，因此通常采用定向或抛物面卫通天线。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0294","type":"single","difficulty":1,"stem":"下列哪项是飞行控制的方式之一?","options":[{"key":"A","text":"指令控制"},{"key":"B","text":"陀螺控制"},{"key":"C","text":"载荷控制"}],"answer":"A","analysis":"提示：飞控：指令、姿态、舵面\n解析：遥控方式是通过数据链路对无人机实施的飞行控制操纵，一般包括舵面遥控、姿态遥控和指令控制三种方式。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0295","type":"single","difficulty":1,"stem":"下述哪类民用无人机动力系统的运转不需要大气中的氧气?","options":[{"key":"A","text":"涡轮喷气发动机"},{"key":"B","text":"外转子无刷电动机"},{"key":"C","text":"二冲程活塞式汽油机"}],"answer":"B","analysis":"提示：外转子→ 电动→ 不要氧气\n解析：外转子无刷电动机的工作原理是通过电流在磁场中受力转动的原理制成的。具体来说，当给无刷电机定子上的线圈通电时，通电的线圈会产生磁场，转子上的磁铁会与线圈产生吸引或排斥，从而使转子转动。这一过程并不涉及燃烧反应，因此不需要大气中的氧气。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0296","type":"single","difficulty":1,"stem":"以下不是导航飞控系统组成部分的是（）。","options":[{"key":"A","text":"电台"},{"key":"B","text":"执行机构"},{"key":"C","text":"传感器"}],"answer":"A","analysis":"提示：不包括电台\n解析：导航飞控系统的三大核心环节是：测量——传感器（陀螺、加速度计、GNSS 接收机等） 决策——飞控计算机（导航/控制算法） 执行——执行机构（舵机、电机、电调等）电台（数据链路终端）只负责“对外通信”，把遥控/遥测数据送出去或接进来，不参与导航解算和飞行控制闭环，因此它不属于导航飞控系统的组成部分。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0297","type":"single","difficulty":1,"stem":"以下不属于航空器的是（）。","options":[{"key":"A","text":"卫星"},{"key":"B","text":"直升机"},{"key":"C","text":"飞艇"}],"answer":"A","analysis":"提示：火箭卫星→航天器，不是航空器\n解析：飞行器(FlightVehicle)是由人类制造、能飞离地面、在大气层内或大气层外空间飞行的机械飞行物。在大气层内飞行的称为航空器 (如飞艇、直升机、无人机)在太空飞行的称为航天器（如卫星）","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0298","type":"single","difficulty":1,"stem":"以下地面链路天线哪一种是定向天线?","options":[{"key":"A","text":"八木天线"},{"key":"B","text":"鞭状天线"},{"key":"C","text":"三叶草天线"}],"answer":"A","analysis":"提示：八木→定向天线\n解析：八木天线是定向天线。这种天线的设计特点使其具有特定的辐射方向性，能够在特定方向上提供较强的信号传输能力，而在其他方向上的信号则相对较弱。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0299","type":"single","difficulty":1,"stem":"在下列参数中，影响涡桨发动机工作寿命的主要是（）。","options":[{"key":"A","text":"发动机的排气温度"},{"key":"B","text":"发动机滑油温度"},{"key":"C","text":"发动机转速"}],"answer":"A","analysis":"提示：排气温度影响发动机寿命\n解析：排气温度是涡桨发动机运行状态的重要指标，它直接反映了发动机内部燃烧过程的效率和稳定性。过高的排气温度可能意味着燃烧室内燃烧不完全，这不仅会增加发动机的磨损，还可能对发动机材料造成热应力损伤，从而缩短发动机的工作寿命。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0300","type":"single","difficulty":1,"stem":"指挥控制与（）是无人机地面站的主要功能。","options":[{"key":"A","text":"任务规划"},{"key":"B","text":"导航"},{"key":"C","text":"飞行视角显示"}],"answer":"A","analysis":"提示：地面站:指挥控制+任务规划\n解析：无人机地面站的主要功能通常概括为任务规划与指挥控制。导航信息和飞行视角显示仅仅是地面站提供或展示的内容，不是主要功能。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0301","type":"single","difficulty":1,"stem":"地面站显示系统告警信息主要包括（）。","options":[{"key":"A","text":"触觉告警和听觉告警"},{"key":"B","text":"视觉告警和听觉告警"},{"key":"C","text":"视觉告警和触觉告警"}],"answer":"B","analysis":"提示：告警视听\n解析：警信息包括视觉告警和听觉告警。视觉告警：主要包括灯光告警、颜色告警 和文字告警等听觉告警：主要包括语音告警和音调告警等。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0302","type":"single","difficulty":1,"stem":"指令信息不包括（）。","options":[{"key":"A","text":"发送代码"},{"key":"B","text":"发送状态"},{"key":"C","text":"接收状态"}],"answer":"A","analysis":"提示：选错的。不包括发送代码\n解析：指令信息通常包括：指令代码→发送状态→接收状态，用于确认指令的传输和执行情况，发送代码属于一个臆造的选项，×，不是指令信息的范畴。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0303","type":"single","difficulty":1,"stem":"活塞式发动机的爆震最易发生在（）。","options":[{"key":"A","text":"发动机处于高功率状态下工作时"},{"key":"B","text":"发动机处于小转速和大进气压力状态工作"},{"key":"C","text":"发动机处于大转速和小进气压力状态工作"}],"answer":"B","analysis":"提示：爆震--小转速大进气\n解析：爆震是指活塞发动机在压缩冲程中，混合气在火花塞点火之前提前燃烧的现象。在发动机转速较低时，虽然活塞的运动速度相对较慢，但如果此时进气压力较大，混合气在气缸内的压缩程度会更高。高压缩比会增加气缸内的温度和压力，为爆震的发生创造了有利条件。进气压力增大意味着有更多的空气被强制进入气缸，与燃料混合后形成更浓的混合气。在压缩冲程中，这种浓混合气更容易在火花塞点火之前达到自燃温度，从而引发爆震。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0304","type":"single","difficulty":1,"stem":"部分活塞式发动机中 ，电子燃油喷射控制系统安装在（）上。","options":[{"key":"A","text":"进气系统"},{"key":"B","text":"点火系统"},{"key":"C","text":"排气系统"}],"answer":"A","analysis":"提示：燃油喷射→进气系统\n解析：根据活塞式发动机原理，电子燃油喷射控制系统（EFI）核心功能是精准混合燃油与空气，需依托进气系统实现。进气系统负责输送空气，EFI的喷油嘴、节气门体、进气压力传感器等关键部件，需安装在进气歧管或节气门体等进气通路中，才能将燃油喷入气流形成可燃混合气，再送入气缸燃烧。而点火系统负责点火、排气系统负责排废气，均无法满足EFI功能需求，故其必装于进气系统。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0305","type":"single","difficulty":1,"stem":"（）是在无人机具有姿态稳定控制机构的基础上，通过操纵杆控制无人机的俯仰角、滚转角和偏航角，从而改变无人机的运动。","options":[{"key":"A","text":"指令控制"},{"key":"B","text":"舵面遥控"},{"key":"C","text":"姿态遥控"}],"answer":"C","analysis":"提示：各种角→姿态控制\n解析：该控制方式的核心是直接操纵无人机的姿态角（俯仰、滚转、偏航），并依赖其自身的姿态稳定机构维持姿态，最终实现运动状态的改变。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0306","type":"single","difficulty":1,"stem":"如果数传链路下行中断，会发生（）的后果。","options":[{"key":"A","text":"无法在线重规划航线航点及发送任务指令"},{"key":"B","text":"地面站不再更新无人机的遥测数据"},{"key":"C","text":"无人机航拍图传图像丢失"}],"answer":"B","analysis":"提示：下行中断不更新\n解析：民用无人机系统有三条主要链路。发指令给无人机：上行无人机传图与数据回来：下行飞行数据来回： 上下（鼠鼠老师的话：我们想象一下，我们在地上，用遥控器遥控天上的无人机，发出去的“指令”往上走，所以是“上传”; 无人机将数据与图像传回地面，数据图像往下走，所以是下行。）无人机数据链路下行中断，我们就失去了无人机实时数据，导致→无人机遥测所得数据无法回传不再更新（C无人机航拍图传图像丢失 × 图像可保存不会丢失，只是地面无法实时更新）","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0307","type":"single","difficulty":1,"stem":"发动机火花塞出现问题，会导致（）。","options":[{"key":"A","text":"无法启动"},{"key":"B","text":"突然熄火"},{"key":"C","text":"以上都有可能"}],"answer":"C","analysis":"提示：火花塞问题都有可能\n解析：火花塞是点火系统核心部件，故障会直接影响点火效果。严重积碳、电极过度磨损等会使其无法产生足够电火花，致发动机无法启动；运行中突然失效，如内部线路断裂，也可能引发突然熄火。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0308","type":"single","difficulty":1,"stem":"不属于无人机起飞方式的是（）。","options":[{"key":"A","text":"弹射"},{"key":"B","text":"滑跑"},{"key":"C","text":"滑翔"}],"answer":"C","analysis":"提示：滑翔是一种飞行状态\n解析：滑翔通常指的是飞行器(如滑翔机、滑翔伞等)利用空气动力在空中无动力飞行的状态，而不是无人机的起飞方式。","tags":[],"chapter":"系统组成","bankId":"uav-theory"},{"id":"thc-0309","type":"single","difficulty":1,"stem":"（）包括携带的传感器类型、摄像机类型和专用任务设备类型等，规划设备工作时间及工作模式，同时需要考虑气象情况对设备的影响程度。","options":[{"key":"A","text":"任务规划"},{"key":"B","text":"载荷规划"},{"key":"C","text":"任务分配"}],"answer":"B","analysis":"提示：携带找载荷\n解析：载荷规划包括携带的传感器类型、摄像机类型和专用任务设备类型等的规划，同时需要考虑设备的工作时间及工作模式，以及气象情况对设备的影响程度。这是确保任务成功执行的重要环节","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0310","type":"single","difficulty":1,"stem":"（）包括在执行任务的过程中，需要根据环境情况的变化制定一些通信任务，调整与任务控制站之间的通信方式等。","options":[{"key":"A","text":"链路规划"},{"key":"B","text":"目标分配"},{"key":"C","text":"通信规划"}],"answer":"C","analysis":"提示：问题对答案，通信找通信\n解析：通信规划包括在执行任务的过程中，根据环境情况的变化制定通信任务，调整与任务控制站之间的通信方式等。这是为了确保任务执行过程中的信息传输顺畅，提高任务的执行效率","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0311","type":"single","difficulty":1,"stem":"（）的内容包括出发地点、途经地点、目的地点的位置信息、飞行高度速度和需要到达的时间段。","options":[{"key":"A","text":"航线规划"},{"key":"B","text":"航迹规划"},{"key":"C","text":"任务规划"}],"answer":"A","analysis":"提示：点+线，航线规划\n解析：航线规划的内容确实包括出发地点、途经地点、目的地点的位置信息，以及飞行的高度、速度和需要到达的时间段。这是制定飞行计划的基础，确保飞行的顺利进行","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0312","type":"single","difficulty":1,"stem":"（）即根据飞行过程中遇到的突发状况，如地形、气象变化、未知限飞禁飞因素等，局部动态的调整飞行路径或改变动作任务。","options":[{"key":"A","text":"在线规划"},{"key":"B","text":"飞行中重规划"},{"key":"C","text":"飞行前预规划"}],"answer":"B","analysis":"提示：遇到突发，重新规划\n解析：飞行中重规划是指在飞行过程中，根据遇到的突发状况(如地形、气象变化等)局部动态地调整飞行路径或改变动作任务。这是为了应对不可预见的因素，确保飞行安全","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0313","type":"single","difficulty":1,"stem":"（）即根据既定任务，结合环境限制与飞行约束条件，从整体上制定最优参考路径。","options":[{"key":"A","text":"在线规划"},{"key":"B","text":"飞行中重规划"},{"key":"C","text":"飞行前预规划"}],"answer":"C","analysis":"提示：事前定好不变的最优路线 = 预规划\n解析：航线规划一般分为两步:首先是飞行前 预规划,即根据既定任务,结合环境限制与飞行约束条件,从整体上制定最优参考路径;其次是飞行过程中的 重规划, 即根据飞行过程中遇到的突发状况,如地形、气象变化、未知限飞禁飞因素等, 局部动态地调整飞行路径或改变动作任务。本题核心判断依据是题干关键词 “既定任务” “整体制定” “最优参考路径”—— 这些都指向飞行执行前的准备工作，是基于已知任务要求和环境约束（如禁飞区、地形）提前规划的固定最优路线，不涉及飞行中的动态调整。记住 “事前定好不变的最优路线 = 预规划”，就能快速锁定答案。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0314","type":"single","difficulty":1,"stem":"（）是完成任务的一项重要的辅助性工作，细致规范的（）将大幅度提高飞行安全性和任务完成质量。","options":[{"key":"A","text":"场地标注、场地标注"},{"key":"B","text":"图元标注、图元标注"},{"key":"C","text":"警示标注、警示标注"}],"answer":"B","analysis":"提示：图元辅助，完成任务\n解析：地面站电子地图显示的信息分为三个方面:一是无人机位置和飞行航迹;二 是无人机航迹规划信息;三是其他辅助信息,如图元标注。其中图元标注是完成任务的一项重要的辅助性工作,细致规范的图元标注将大幅度提高飞行安全性和任务完成质量。（电子地图的图元标注，本质是把地理要素的信息，在电子地图上对应空间位置标注出来。）图元标注主要包括以下三方面信息: (1)场地标注。(2)警示标注。 (3)任务区域标注。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0315","type":"single","difficulty":1,"stem":"（）是在无人机飞行过程中，根据实际的飞行情况和环境的变化制定出一条可分航迹，包括对预先规划的修改，以及选择应急的方案，其特点是约束和飞行环境实时变化，任务规划系统需综合考量威胁、航程、约束等多种条件，采用（）生成飞行器的安全飞行航迹，任务规划系统需具备较强的信息处理能力并具有一定的辅助决策能力。","options":[{"key":"A","text":"预先规划，最优航迹规划算法"},{"key":"B","text":"航迹规划，最短航迹规划算法"},{"key":"C","text":"实时规划，快速航迹规划算法"}],"answer":"C","analysis":"提示：飞行中=实时\n解析：实时规划是在无人机飞行过程中，根据实际的飞行情况和环境的变化制定出一条可行的航迹。这个过程包括对预先规划的修改以及选择应急方案。由于约束和飞行环境实时变化，任务规划系统需要综合考量多种条件，并采用快速航迹规划算法来生成飞行器的安全飞行航迹。这要求任务规划系统具备较强的信息处理能力和一定的辅助决策能力。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0316","type":"single","difficulty":1,"stem":"（）是在无人机执行任务前，由地面控制站制定的，主要是综合任务要求、地理环境和无人机任务载荷等因素进行规划，其特点是约束和飞行环境给定，规划的主要目的是通过选用合适的算法谋求（）飞行航迹。","options":[{"key":"A","text":"实时规划，航程最短"},{"key":"B","text":"预先规划，全局最优"},{"key":"C","text":"航迹规划，航时最短"}],"answer":"B","analysis":"提示：任务前规划，任务时调整\n解析：预先规划是在无人机执行任务前，由地面控制站制定的。它主要是综合任务要求、地理环境和无人机任务载荷等因素进行规划。其特点是约束和飞行环境给定，规划的主要目的是通过选用合适的算法来谋求全局最优的飞行航迹。这意味着在规划过程中，会考虑所有相关因素，以确保无人机能够以最有效的方式完成任务。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0317","type":"single","difficulty":1,"stem":"（）是指从航线上的任意点转入安全返航通道或从安全返航通道转向应急迫降点或机场。","options":[{"key":"A","text":"安全着陆策略"},{"key":"B","text":"航线转移策略"},{"key":"C","text":"安全返航策略"}],"answer":"B","analysis":"提示：转入转向转移\n解析：航线转移策略指的是在飞行过程中，根据需要从航线上的任意点转入安全返航通道或者从安全返航通道转向应急迫降点或机场的策略。这是为了确保飞行的安全性和灵活性，","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0318","type":"single","difficulty":1,"stem":"（）无人机侦察监测区域应预先标注，主要包括任务区域范围、侦察监测对象等。","options":[{"key":"A","text":"场地标注"},{"key":"B","text":"任务区域标注"},{"key":"C","text":"警示标注"}],"answer":"B","analysis":"提示：问题对答案，任务区域对任务区域\n解析：图元标注主要包括以下三方面信息: (1)场地标注。主要包括起飞场地标注、着陆场地标注、应急场地标注,为操作员提供发射与回收以及应急迫降的区域参考。 (2)警示标注。主要用于飞行区城内重点目标的标注,如建筑物、禁飞区、 人口密集区等易影响飞行安全的区域。 (3)任务区域标注。无人机侦察监测区域应预先标注,主要包括任务区城范围、侦察监测对象等。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0319","type":"single","difficulty":1,"stem":"（）应具备的功能包括:标准飞行智轨道生成功能，常规的飞行航线生成、管理功能。","options":[{"key":"A","text":"航线规划"},{"key":"B","text":"航迹规划"},{"key":"C","text":"任务规划"}],"answer":"A","analysis":"提示：航线规划生成航线\n解析：航线规划是指制定和管理无人机的飞行航线，包括生成标准飞行轨道和常规的飞行航线。这是无人机任务规划中的基础功能确保无人机能够按照预定的路线进行飞行。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0320","type":"single","difficulty":1,"stem":"（）在无人机任务规划中的作用是显示无人机的飞行位置、画出飞行航迹、标识规划点以及显示规划航迹等。","options":[{"key":"A","text":"电子地图"},{"key":"B","text":"地理位置"},{"key":"C","text":"飞行航迹"}],"answer":"A","analysis":"提示：电子地图显航迹\n解析：电子地图在无人机任务规划中起着关键作用，它能够显示无人机的飞行位置、画出飞行航迹、标识规划点以及显示规划航迹等，为操作员提供直观的飞行环境和航迹信息。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0321","type":"single","difficulty":1,"stem":"（）主要包括起飞场地标注、着陆场地标注、应急场地标注，为操作员提供发射与回收以及应急迫降区域参考。","options":[{"key":"A","text":"场地标注"},{"key":"B","text":"任务区域标注"},{"key":"C","text":"警示标注"}],"answer":"A","analysis":"提示：问题对答案，场地对场地\n解析：图元标注主要包括以下三方面信息: (1)场地标注。主要包括起飞场地标注、着陆场地标注、应急场地标注,为操作员提供发射与回收以及应急迫降的区域参考。 (2)警示标注。主要用于飞行区城内重点目标的标注,如建筑物、禁飞区、 人口密集区等易影响飞行安全的区域。 (3)任务区域标注。无人机侦察监测区域应预先标注,主要包括任务区城范围、侦察监测对象等。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0322","type":"single","difficulty":1,"stem":"（）主要用于飞行区域内重点目标的标注，如建筑物、禁飞区、人口密集区等易影响飞行安全的区域。","options":[{"key":"A","text":"场地标注"},{"key":"B","text":"任务区域标注"},{"key":"C","text":"警示标注"}],"answer":"C","analysis":"提示：禁飞要警示\n解析：图元标注主要包括以下三方面信息: (1)场地标注。主要包括起飞场地标注、着陆场地标注、应急场地标注,为操作员提供发射与回收以及应急迫降的区域参考。 (2)警示标注。主要用于飞行区城内重点目标的标注,如建筑物、禁飞区、 人口密集区等易影响飞行安全的区域。 (3)任务区域标注。无人机侦察监测区域应预先标注,主要包括任务区城范围、侦察监测对象等。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0323","type":"single","difficulty":1,"stem":"（）主要指执行任务过程中实现动作的时间点、方式和方法，设定机会航点的时间节点、飞行高度、航速、飞行姿态以及配合载荷设备的工作状态与模式，当无人机到达该航点时实施航拍、盘旋等飞行任务。","options":[{"key":"A","text":"任务分配"},{"key":"B","text":"载荷规划"},{"key":"C","text":"目标分配"}],"answer":"C","analysis":"提示：盘旋找目标\n解析：题干中明确提到实现动作的时间点、方式和方法以及各种飞行参数和任务执行情况这些都是对具体目标进行分配时需要考虑的内容，而任务分配主要侧重于整体任务的划分，载荷规划主要针对载荷设备本身，所以该描述符合目标分配的定义。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0324","type":"single","difficulty":1,"stem":"(地面站)电子地图图元标注不包含（）。","options":[{"key":"A","text":"场地标注"},{"key":"B","text":"警示标注"},{"key":"C","text":"地形标注"}],"answer":"C","analysis":"提示：选错的。不包括地形\n解析：图元标注主要包括以下三方面信息: (1)场地标注。主要包括起飞场地标注、着陆场地标注、应急场地标注,为操作员提供发射与回收以及应急迫降的区域参考。 (2)警示标注。主要用于飞行区城内重点目标的标注,如建筑物、禁飞区、 人口密集区等易影响飞行安全的区域。 (3)任务区域标注。无人机侦察监测区域应预先标注,主要包括任务区城范围、侦察监测对象等。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0325","type":"single","difficulty":1,"stem":"从实施时间上划分，任务规划可以分为（）。","options":[{"key":"A","text":"航迹规划和任务分配规划"},{"key":"B","text":"航迹规划和数据链路规划"},{"key":"C","text":"预先规划和实时规划"}],"answer":"C","analysis":"提示：时间：预先&实时\n解析：从实施时间上划分，任务规划可以分为预先规划和实时规划。预先规划在任务前进行，实时规划在任务执行过程中根据实时情况进行调整","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0326","type":"single","difficulty":1,"stem":"大型军用无人机最常用的导航方式是（）。","options":[{"key":"A","text":"卫星导航"},{"key":"B","text":"地形匹配导航"},{"key":"C","text":"组合导航"}],"answer":"C","analysis":"提示：大型军用组合\n解析：大型军用无人机最常用的导航方式是组合导航，它结合了多种导航方式(如卫星导航、地形匹配导航等)的优点，提高了导航的准确性和可靠性，","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0327","type":"single","difficulty":1,"stem":"地面站电子地图显示的信息分为三个方面:一是（），二是（），三是其他辅助信息，如图元标注。","options":[{"key":"A","text":"无人机位置和飞行航迹，无人机航迹规划信息"},{"key":"B","text":"无人机地理坐标信息，无人机飞行姿态信息"},{"key":"C","text":"无人机飞行姿态信息，无人机航迹规划信息"}],"answer":"A","analysis":"提示：无姿态信息\n解析：根据《无人机驾驶员航空知识手册》地面站电子地图显示的信息分为三个方面:一是无人机位置和飞行航迹；二 是无人机航迹规划信息；三是其他辅助信息,如图元标注。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0328","type":"single","difficulty":1,"stem":"地图校准时，在命令下拉菜单中选取（）定位点作为校准点，并在对话框左侧输入这些定位点的实际地理位置信息。","options":[{"key":"A","text":"2个"},{"key":"B","text":"3个"},{"key":"C","text":"4个"}],"answer":"B","analysis":"提示：3点定位\n解析：地图校准的核心是通过 “已知实际地理位置的点”，修正电子地图的偏差，本质是建立电子地图与真实地理坐标的精准对应关系。从几何原理来看，“两点确定一条直线”，仅 2 个点只能校准一条线上的位置，无法覆盖平面地图的二维空间（横向 + 纵向）；而 “三点确定一个平面”，3 个不在同一直线上的定位点，能构建出完整的二维坐标基准，精准修正电子地图在整个平面内的偏移、缩放或旋转误差，确保地图与真实地形匹配。4 个点虽能提升精度，但并非校准的最低必要条件，行业标准和技术逻辑中，3 个点是实现平面校准的最优且必需的数量。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0329","type":"single","difficulty":1,"stem":"动力系统工作恒定的情况下（）限制了航迹在垂直平面内上升和下滑的最大角度。","options":[{"key":"A","text":"最小转弯半径"},{"key":"B","text":"最大俯仰角"},{"key":"C","text":"最大转弯半径"}],"answer":"B","analysis":"提示：问题对答案，角度对角度\n解析：在动力系统工作恒定的情况下，最大俯仰角决定了飞机在垂直平面内上升和下滑的极限角度。当达到最大俯仰角时，飞机的上升或下滑角度达到最大，超过这个角度飞机可能无法保持稳定飞行。最小转弯半径主要限制飞机的水平转弯，与垂直平面鎭籴挟上升和下滑角度无关;最大转弯半径同理。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0330","type":"single","difficulty":1,"stem":"惯导(INS)的优点不包括下列哪一条?","options":[{"key":"A","text":"无漂移"},{"key":"B","text":"不受干扰"},{"key":"C","text":"全天候"}],"answer":"A","analysis":"提示：选错的。漂移\n解析：惯导(INS)存在漂移现象。惯导系统是通过测量飞行器的加速度和角速度来推算位置、速度等信息的，随着时间的积累，测量误差会逐渐增大，导致位置等信息出现漂移。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0331","type":"single","difficulty":1,"stem":"航迹规划需要充分考虑（）的选取、标绘，航线预先规划以及在线调整时机。","options":[{"key":"A","text":"飞行航迹"},{"key":"B","text":"地理位置"},{"key":"C","text":"电子地图"}],"answer":"C","analysis":"提示：电子地图显航迹\n解析：航迹规划需要借助电子地图来进行选取标绘以及进行航线预先规划和确定在线调整时机等操作，地理位置较为宽泛不具有针对性，飞行航迹是规划的结果而非规划时考虑的对象。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0332","type":"single","difficulty":1,"stem":"航迹优化是指航迹规划完成后，系统根据无人机飞行的（）对航迹进行优化处理，制定出适合无人机飞行的航迹。","options":[{"key":"A","text":"最大转弯半径和最小俯仰角"},{"key":"B","text":"最小转弯半径和最大俯仰角"},{"key":"C","text":"最大转弯半径和最大俯仰角"}],"answer":"B","analysis":"提示：航迹规划，小半径，大仰角\n解析：航迹优化要考虑无人机的实际飞行能力最小转弯半径决定了无人机转弯的灵活性，最大俯仰角限制了无人机在垂直方向的运动范围，系统根据这些参数对航迹进行优化以制定适合无人机飞行的航迹。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0333","type":"single","difficulty":1,"stem":"进行无人机飞行任务规划时下列哪一条不在考虑范围内?","options":[{"key":"A","text":"禁飞区"},{"key":"B","text":"险恶地形"},{"key":"C","text":"飞机寿命"}],"answer":"C","analysis":"提示：选错的。飞机寿命\n解析：进行无人机飞行任务规划时，需要考虑禁飞区以确保飞行合法合规，险恶地形可能影响飞行安全也在考虑范围内，而飞机寿命通常不是任务规划直接考虑的因素，任务规划主要关注的是特定任务的执行情况","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0334","type":"single","difficulty":1,"stem":"就任务规划系统具备的功能而言，任务规划可包含航迹规划、任务分配规划、数据链路规划和系统保障与应急预案规划等，其中（）是任务规划的主体和核心。","options":[{"key":"A","text":"航迹规划"},{"key":"B","text":"任务分配规划"},{"key":"C","text":"数据链路规划"}],"answer":"A","analysis":"提示：航迹规划→任务的主体和核心\n解析：航迹规划直接决定了无人机的飞行路径是任务规划中最关键的部分，是任务执行的主体和核心。任务分配规划和数据链路规划都是为航迹规划服务的辅助部分","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0335","type":"single","difficulty":1,"stem":"任务分配提供可用的无人机资源和着陆点的显示，辅助操作人员进行（）。","options":[{"key":"A","text":"载荷规划、通信规划和目标分配"},{"key":"B","text":"链路规划、返航规划和载荷分配"},{"key":"C","text":"任务规划、返航规划和载荷分配"}],"answer":"A","analysis":"提示：任务分配必有目标分配\n解析：任务分配提供资源和着陆点显示，在此基础上辅助操作人员进行载荷规划以确定携带的设备和任务，通信规划确保信息传输目标分配明确任务目标。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0336","type":"single","difficulty":1,"stem":"任务规划的主要目标是依据地形信息和执行任务环境条件信息，综合考虑无人机的性能、到达时间、耗能、威胁以及飞行区域等约束条件，为无人机规划出一条或多条自（）的（），保证无人机高效、圆满地完成飞行任务，并安全返回基地。","options":[{"key":"A","text":"起点到终点，最短路径"},{"key":"B","text":"起飞点到着陆点，最佳路径"},{"key":"C","text":"出发点到目标点，最优或次优航迹"}],"answer":"C","analysis":"提示：两条航线备选\n解析：任务规划是为无人机在特定约束条件下规划出从出发点到目标点的飞行路径，由于实际情况中很难保证绝对的最优，所以通常是规划出最优或次优航迹，以保证无人机高效完成任务并安全返回。“起点到终点最短路径”表述不准确，任务规划不仅仅考虑最短路径;“起飞点到着陆点，最佳路径”没有突出目标点且最佳路径表述较绝对","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0337","type":"single","difficulty":1,"stem":"任务规划时还要考虑（），即应急航线。","options":[{"key":"A","text":"紧急迫降措施"},{"key":"B","text":"安全返航措施"},{"key":"C","text":"异常应急措施"}],"answer":"C","analysis":"提示：问题对答案，应急对应急\n解析：任务规划时需要考虑可能出现的各种异常情况，所以要规划应急航线，也就是准备异常应急措施，以应对突发状况。紧急迫降措施只是异常应急措施的一部分;安全返航措施也较为片面，异常应急措施涵盖的范围更广泛。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0338","type":"single","difficulty":1,"stem":"任务规划由（）等组成。","options":[{"key":"A","text":"任务接收、姿态控制、载荷分配、航迹规划、航迹调整和航迹评价"},{"key":"B","text":"任务理解、环境评估、任务分配、航迹规划、航迹优化和航迹评价"},{"key":"C","text":"任务分配、姿态控制、导航控制、航迹规划、航迹调整和航迹评价"}],"answer":"B","analysis":"提示：任务规划选航迹优化\n解析：任务规划首先要对任务进行理解，明确任务需求;然后进行环境评估，了解执行任务的外部条件;接着进行任务分配，合理安排资源;再进行航迹规划确定飞行路径;之后进行航迹优化以提升航迹质量;最后进行航迹评价，评估规划的效果。任务接收说法不准确且姿态控制、导航控制不属于任务规划的主要组成部分。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0339","type":"single","difficulty":1,"stem":"图元标注主要包括以下三方面信息（）。","options":[{"key":"A","text":"坐标标注、航向标注、载荷任务标注"},{"key":"B","text":"场地标注、警示标注、任务区域标注"},{"key":"C","text":"航程标注、航时标注、任务类型标注"}],"answer":"B","analysis":"提示：图元标注→场警\n解析：图元标注主要包括以下三方面信息: (1)场地标注。主要包括起飞场地标注、着陆场地标注、应急场地标注,为操作员提供发射与回收以及应急迫降的区域参考。 (2)警示标注。主要用于飞行区城内重点目标的标注,如建筑物、禁飞区、 人口密集区等易影响飞行安全的区域。 (3)任务区域标注。无人机侦察监测区域应预先标注,主要包括任务区城范围、侦察监测对象等。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0340","type":"single","difficulty":1,"stem":"无人机（）是指根据无人机需要完成的任务、无人机的数量以及携带任务载荷的类型，对无人机制定飞行路线并进行任务分配。","options":[{"key":"A","text":"航迹规划"},{"key":"B","text":"任务规划"},{"key":"C","text":"飞行规划"}],"answer":"B","analysis":"提示：问题对答案，任务、任务分配对任务\n解析：任务规划是根据无人机要完成的任务、无人机数量以及携带任务载荷类型等，对无人机制定飞行路线并进行任务分配。航迹规划主要侧重于确定无人机的飞行轨迹;飞行规划概念较为宽泛，不如任务规划具体针对任务、数量及载荷进行路线制定和任务分配。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0341","type":"single","difficulty":1,"stem":"无人机飞行操作员在飞行时最应关注的是哪一区域?","options":[{"key":"A","text":"飞行航迹"},{"key":"B","text":"地平仪"},{"key":"C","text":"遥控指令区"}],"answer":"B","analysis":"提示：关注地平仪\n解析：在飞行时，无人机飞行操作员最应关注地平仪。地平仪能够直观地显示无人机的飞行姿态，包括俯仰、滚转等信息，对于保持飞行安全至关重要。飞行航迹可以在确保姿态稳定后适当关注，遥控指令区通常在操作过程中并非持续重点关注区域。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0342","type":"single","difficulty":1,"stem":"无人机航迹规划需要综合应用（），以获得全面详细的无人机飞行现状以及环境信息，结合无人机自身技术指标特点，按照一定的航迹规划方法，制定最优或次优路径。","options":[{"key":"A","text":"导航技术、地理信息技术以及远程感知技术"},{"key":"B","text":"飞控技术、导航技术以及地理信息技术"},{"key":"C","text":"导航技术、航迹优化算法以及地理信息技术"}],"answer":"A","analysis":"提示：远程感知\n解析：根据蓝皮书关于航迹规划的表述：无人机航迹规划是任务规划的核心内容,需要综合应用导航技术、地理信息技术以及远程感知技术,以获得全面详细的无人机飞行现状以及环境信息,结合无人机自身技术指标特点,按照一定的航迹规划方法,制定最优或次优路径。因此,航迹规划需要充分考虑电子地图的选取、标绘,航线预先规划以及在线调整时机。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0343","type":"single","difficulty":1,"stem":"无人机具体执行的飞行任务主要包括到达时间和进入目标方向等，需满足如下要求（）。","options":[{"key":"A","text":"航迹距离约束，固定的目标进入方向"},{"key":"B","text":"执行任务时间，进入目标位置"},{"key":"C","text":"返航时间，接近目标的飞行姿态"}],"answer":"A","analysis":"提示：问题对答案，目标方向对目标方向\n解析：无人机执行的飞行任务需考虑到达时间和进入目标方向，这要求无人机必须满足航迹距离约束，确保飞行路径合理，同时需遵循固定的目标进入方向，以保证任务执行的准确性和效率。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0344","type":"single","difficulty":1,"stem":"无人机任务规划是实现（）的有效途径，它在很大程度上决定了无人机执行任务的效率。","options":[{"key":"A","text":"自主导航与飞行控制"},{"key":"B","text":"飞行任务与载荷匹配"},{"key":"C","text":"航迹规划与自主导航"}],"answer":"A","analysis":"提示：任务规划→自主导航 飞行控制\n解析：由于无人机对任务规划的要求，需要更为详细的飞行航迹信息、作用目标和任务执行信息。无人机任务规划是实现自主导航与飞行控制的有效途径，它在很大程度上决定了无人机执行任务的效率。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0345","type":"single","difficulty":1,"stem":"无人机任务规划需要考虑的因素有（）,（），无人机物理限制，实时性要求。","options":[{"key":"A","text":"飞行环境限制，飞行任务要求"},{"key":"B","text":"飞行任务范围，飞行安全限制"},{"key":"C","text":"飞行安全限制，飞行任务要求"}],"answer":"A","analysis":"提示：环境限制\n解析：无人机任务规划时，需要考虑飞行环境限制，比如地形、气象条件、禁飞区等;同时也要考虑飞行任务要求，包括任务目标到达时间、任务载荷等。飞行任务范围较为宽泛且不准确;飞行安全限制可被飞行环境限制涵盖一部分，不够全面。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0346","type":"single","difficulty":1,"stem":"无人机任务规划需要实现的功能包括（）。","options":[{"key":"A","text":"自主导航功能，应急处理功能，航迹规划功能"},{"key":"B","text":"任务分配功能，航迹规划功能，仿真演示功能"},{"key":"C","text":"自主导航功能，自主起降功能，航迹规划功能"}],"answer":"B","analysis":"提示：仿真演示\n解析：无人机任务规划需要实现任务分配功能，合理分配任务给不同的无人机;航迹规划功能，为无人机规划最优或次优飞行路径;仿真演示功能可以在实际执行任务前进行模拟，以检验规划的合理性和可行性。自主导航功能通常是无人机自身系统具备的，不是任务规划主要实现的功能;自主起降功能也主要由无人机自身控制系统实现，而非任务规划。","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0347","type":"single","difficulty":1,"stem":"无人机物理限制对飞行航迹有以下限制（），最小航迹段长度，最低安全飞行高度。","options":[{"key":"A","text":"最大转弯半径，最小俯仰角"},{"key":"B","text":"最小转弯半径，最小俯仰角"},{"key":"C","text":"最小转弯半径，最大俯仰角"}],"answer":"C","analysis":"提示：小半径，大仰角\n解析：无人机物理限制中，最小转弯半径限制了无人机在水平方向转弯的能力，决定了航迹在转弯处的曲率;最大俯仰角限制了无人机在垂直方向的倾斜角度，对飞行航迹在垂直平面的变化起到限制作用","tags":[],"chapter":"任务规划","bankId":"uav-theory"},{"id":"thc-0348","type":"single","difficulty":1,"ste
