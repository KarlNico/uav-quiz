为绝对温度，R为气体常数）（在温度一定时）空气密度与气压成正比","tags":[],"chapter":"气象","bankId":"uav-theory"},{"id":"thc-0773","type":"single","difficulty":1,"stem":"若航向、空速、风向不变，当风速减小时（）。","options":[{"key":"A","text":"偏流减小，地速在顺侧风时增大"},{"key":"B","text":"偏流减小，地速不变"},{"key":"C","text":"偏流减小，地速在逆侧风时增大"}],"answer":"C","analysis":"提示：减小逆大，增大顺大\n解析：在航向、空速、风向不变的情况下，当风速减小时，偏流会相应减小。同时，在逆侧风条件下，地速会相对增大，因为风速的减小使得飞机相对于地面的速度增加。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0774","type":"single","difficulty":1,"stem":"若航向、空速、风向不变，当风速增大时（）。","options":[{"key":"A","text":"偏流增大，地速在顺侧风时增大"},{"key":"B","text":"偏流增大，地速增大"},{"key":"C","text":"偏流减小，地速减小"}],"answer":"A","analysis":"提示：减小逆大，增大顺大\n解析：在航向、空速、风向不变的情况下，当风速增大时，偏流会相应增大。同时，在顺侧风条件下，地速会相对增大，因为风速的增加使得飞机相对于地面的速度增加。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0775","type":"single","difficulty":1,"stem":"在同一航向、风向风速条件下，真空速增大，则（）。","options":[{"key":"A","text":"地速增大，偏流增大"},{"key":"B","text":"地速增大，偏流减小"},{"key":"C","text":"地速增大，偏流不变"}],"answer":"B","analysis":"提示：真速大，地速大，偏流小\n解析：真空速增大时，地速会增大。同时，风向风速不变，偏流会减小。因为真空速增加，相对风的影响变小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0776","type":"single","difficulty":1,"stem":"无人机配平的主要考虑是（）沿纵轴的前后位置。","options":[{"key":"A","text":"发动机"},{"key":"B","text":"气动焦点"},{"key":"C","text":"重心"}],"answer":"C","analysis":"提示：固定找重心 配平找重心\n解析：无人机的配平主要考虑重心沿纵轴的前后位置。重心不一定是一个固定点, 它的位置取决于重量在无人机上的分布。无人机驾驶员应该认识到,如果无人机的重心沿纵轴太靠前,就会产生头重现象;相反,如果重心沿纵轴太靠后,就会产生后重现象。不适当的重心位置可能会导致无人机出现不稳定状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0777","type":"single","difficulty":1,"stem":"（）下发动机处于小油门状态，或怠速甚至关机。","options":[{"key":"A","text":"俯冲状态"},{"key":"B","text":"爬升状态"},{"key":"C","text":"滑翔状态"}],"answer":"C","analysis":"提示：滑翔等于滑行挂空挡--省油\n解析：滑翔状态下，发动机通常处于小油门、怠速或关机状态，以节省燃料或进行特定飞行动作。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0778","type":"single","difficulty":1,"stem":"保持匀速飞行时，阻力与推力（）。","options":[{"key":"A","text":"相等"},{"key":"B","text":"阻力大于推力"},{"key":"C","text":"阻力小于推力"}],"answer":"A","analysis":"提示：匀速=平稳=相等\n解析：保持匀速飞行时，飞机的阻力和推力必须相等，以保持速度不变，符合牛顿第一定律。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0779","type":"single","difficulty":1,"stem":"不稳定运动状态与稳定运动或者静止状态的情况不同之处就是多了（）。","options":[{"key":"A","text":"速度"},{"key":"B","text":"加速度"},{"key":"C","text":"重力加速度"}],"answer":"B","analysis":"提示：不稳定→加速度\n解析：平衡是事物一种非常普遍的状态。不稳定运动状态与稳定运动或者静止状态的情况的不同之处就是多了加速度。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0780","type":"single","difficulty":1,"stem":"操纵无人机时，若迎角超过临界迎角，升力系数会（）。","options":[{"key":"A","text":"迅速增大"},{"key":"B","text":"迅速减小"},{"key":"C","text":"缓慢增大"}],"answer":"B","analysis":"提示：迎角失速，升力减小\n解析：迎角超过临界迎角后，气流分离加剧，机翼失速，升力系数由最大值开始迅速减小","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0781","type":"single","difficulty":1,"stem":"常规布局的飞机，机翼升力对飞机重心的力矩常为使飞机机头的（）力矩。","options":[{"key":"A","text":"上仰"},{"key":"B","text":"下俯"},{"key":"C","text":"偏转"}],"answer":"B","analysis":"提示：机翼下，平尾上\n解析：常规布局的飞机重心在前，焦点在后，平尾在最后。 我们模拟一个场景：飞机以重心为跷跷板支点，整个飞机是平衡的。 如果 给平尾一个向下的力（平尾负升力），机头上仰； 如果 给机翼一个向上的力（升力向上），机头下俯；","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0782","type":"single","difficulty":1,"stem":"常规布局的飞机，平尾升力对飞机重心的力矩常为使飞机机头的（）力矩。","options":[{"key":"A","text":"上仰"},{"key":"B","text":"下俯"},{"key":"C","text":"偏转"}],"answer":"A","analysis":"提示：机翼下，平尾上\n解析：常规布局的飞机重心在前，焦点在后，平尾在最后。 我们模拟一个场景：飞机以重心为跷跷板支点，整个飞机是平衡的。 如果 给平尾一个向下的力（平尾负升力），机头上仰； 如果 给机翼一个向上的力（升力向上），机头下俯；（鼠鼠老师的话：题干中平尾升力 其实是对力的统称，需要考生自行判断，这个力是负的还是正的）（对于常规布局的飞机来说，除了个别情况，飞机飞行的大部分的时候，平尾相对气流处于负迎角，专门产生可控的向下力。据此考试可以判断，本题题干中的“平尾升力”指的是为负值的时候）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0783","type":"single","difficulty":1,"stem":"常规布局飞机失速时，（）。","options":[{"key":"A","text":"机翼向上的力和尾翼向下的力都降低"},{"key":"B","text":"机翼向上的力和尾翼向下的力都增加"},{"key":"C","text":"机翼向上的力和尾翼向下的力恒都为零"}],"answer":"A","analysis":"提示：失速，都降低\n解析：飞机失速时，气流分离，机翼向上的升力和尾翼向下的力都会降低。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0784","type":"single","difficulty":1,"stem":"从机尾向机头方向看去，顺时针旋转螺旋桨飞机的扭矩使飞机（）。","options":[{"key":"A","text":"向下低头"},{"key":"B","text":"向左滚转"},{"key":"C","text":"向上抬头"}],"answer":"B","analysis":"提示：顺左逆右\n解析：螺旋桨顺时针转 → 机身受到逆时针扭矩；逆时针扭距作用在机身上 → 机身想逆时针转→ 逆时针就是往左。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0785","type":"single","difficulty":1,"stem":"当恒定角速度水平转弯时空速增加，转弯半径（）。","options":[{"key":"A","text":"不变"},{"key":"B","text":"减少"},{"key":"C","text":"增加"}],"answer":"C","analysis":"提示：V=Wr，半径跟速度成正（跟汽车转弯一样，开的快弯转的大）\n解析：当恒定角速度水平转弯时空速增加，转弯半径会增加。就像汽车在弯道上速度越快，转弯所需的半径就越大，飞机也是同样的道理，空速增加会导致转弯半径增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0786","type":"single","difficulty":1,"stem":"当速度增加而诱导阻力减少时（）。","options":[{"key":"A","text":"形阻减少了"},{"key":"B","text":"蒙皮摩阻减少了"},{"key":"C","text":"蒙皮摩阻增加了"}],"answer":"C","analysis":"提示：速度加，蒙皮阻力加\n解析：总阻力=诱导阻力+废阻力（蒙皮摩擦阻力+压差阻力+干扰阻力)思路1：根据阻力公式，速度增加阻力也增加，总阻力增加，但诱导阻力减少，那么其他阻力肯定增加。思路2：不管诱导阻力增加还是减少，只要速度快了，摩擦阻力就会增加。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0787","type":"single","difficulty":1,"stem":"当无人机的迎角为临界迎角时（）。","options":[{"key":"A","text":"飞行速度最大"},{"key":"B","text":"升力系数最大"},{"key":"C","text":"阻力最小"}],"answer":"B","analysis":"提示：临界仰角，升力最大\n解析：因是迎角增大时，机翼升力系数通常会随之增大；当迎角增大到临界迎角时，升力系数达到最大值。再继续增大迎角，就会失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0788","type":"single","difficulty":1,"stem":"对于带襟翼无人机，放下襟翼，飞机的升力将（），阻力将（）。","options":[{"key":"A","text":"增大、减小"},{"key":"B","text":"增大、增大"},{"key":"C","text":"减小、减小"}],"answer":"B","analysis":"提示：放下襟翼，升力↑阻力↑\n解析：放下襟翼增加机翼面积和弯度，升力和阻力都会增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0789","type":"single","difficulty":1,"stem":"对于带襟翼无人机，放下襟翼，飞机的失速速度将（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"B","analysis":"提示：失速就是速度减少\n解析：放下襟翼增加升力系数，使得飞机能在更小的速度下保持飞行，即失速速度减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0790","type":"single","difficulty":1,"stem":"对于下滑中的飞机来说，升力和重力关系是（）。","options":[{"key":"A","text":"L=Wgcosɑ"},{"key":"B","text":"L=Wgsinɑ"},{"key":"C","text":"L=Wg"}],"answer":"A","analysis":"提示：cos\n解析：下滑中的飞机，升力L与重力W的关系是L=Wgcosɑ，其中ɑ是下滑角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0791","type":"single","difficulty":1,"stem":"舵面遥控状态时，平飞中向后稍拉升降舵杆量，飞行器的迎角（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"先增大后减小"}],"answer":"A","analysis":"提示：前小后大，顺左逆右\n解析：在舵面遥控状态时，平飞中向后稍拉升降舵杆量，相当于增加了升降舵的上偏角，导致飞行器抬头，迎角增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0792","type":"single","difficulty":1,"stem":"舵面遥控状态时，平飞中向前稍推升降舵杆量，飞行器的迎角（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"先减小后增大"}],"answer":"B","analysis":"提示：前小后大，顺左逆右\n解析：平飞中向前稍推升降舵杆量，相当于减小了升降舵的上偏角，飞行器低头，迎角减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0793","type":"single","difficulty":1,"stem":"舵面遥控状态时，平飞中向右稍压副翼杆量，无人机（）。","options":[{"key":"A","text":"右翼升力大于左翼升力"},{"key":"B","text":"左翼升力大于右翼升力"},{"key":"C","text":"左翼升力等于右翼升力"}],"answer":"B","analysis":"提示：跷跷板，右压左升\n解析：飞机靠副翼沿着纵轴控制“横滚”动作。“向右稍压副翼杆量”会造成右副翼向上偏，左副翼向下偏。副翼下偏机翼整体弯度增加，升力系数增加，升力变大；反之，副翼上偏升力变小。（鼠鼠老师教大家一个秘诀：副翼压谁谁小，本题压右则左升力大。）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0794","type":"single","difficulty":1,"stem":"放全襟翼下降，无人机能以（）。","options":[{"key":"A","text":"较大的下降角，较小的速度下降"},{"key":"B","text":"较小的下降角，较大的速度下降"},{"key":"C","text":"较大的下降角，较大的速度下降"}],"answer":"A","analysis":"提示：全襟翼下降，大角小速度\n解析：放全襟翼增加了机翼面积和弯度，增大了升力系数，使得无人机能以较大的下降角，但速度较小的方式下降。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0795","type":"single","difficulty":1,"stem":"飞机从已建立的平衡状态发生偏离，若（），则飞机表现出负动安定性。","options":[{"key":"A","text":"飞机振荡的振幅减小使飞机回到原来的平衡状态"},{"key":"B","text":"飞机振荡的振幅持续增大"},{"key":"C","text":"飞机振荡的振幅不增大也不减小"}],"answer":"B","analysis":"提示：负大正恢复\n解析：具有正静安定性→受到扰动导致平衡状态变化后→有回到原平衡状态的趋势（恢复）具有负静安定性→受到扰动导致平衡状态变化后→有偏离原平衡状态的趋势（振幅持续增大）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0796","type":"single","difficulty":1,"stem":"飞机从已建立的平衡状态发生偏离，若（），则飞机表现出正动安定性。","options":[{"key":"A","text":"飞机振荡的振幅减小使飞机回到原来的平衡状态"},{"key":"B","text":"飞机振荡的振幅持续增大"},{"key":"C","text":"飞机振荡的振幅不增大也不减小"}],"answer":"A","analysis":"提示：负大正恢复\n解析：具有正静安定性→受到扰动导致平衡状态变化后→有回到原平衡状态的趋势具有负静安定性→受到扰动导致平衡状态变化后→有偏离原平衡状态的趋势（题干表述有时为 正“动”安定性，有时为 正“精”安定性，不管是正是负，回到原状态就是“正”）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0797","type":"single","difficulty":1,"stem":"飞机的方向安定性过强，而横侧安定性相对过弱，飞机容易出现（）。","options":[{"key":"A","text":"飘摆(荷兰滚)"},{"key":"B","text":"螺旋不稳定"},{"key":"C","text":"转弯困难"}],"answer":"B","analysis":"提示：方强横弱 ，螺不稳\n解析：飞机的方向安定性过强，横侧安定性相对过弱，飞机容易出现螺旋不稳定。这种情况下飞机在飞行中可能会突然进入螺旋状态，难以保持稳定的飞行姿态。而飘摆通常与横侧安定性相关，转弯困难则更多与操纵性有关。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0798","type":"single","difficulty":1,"stem":"飞机的横侧安定性过强，而方向安定性相对过弱，飞机容易出现（）。","options":[{"key":"A","text":"飘摆(荷兰滚)"},{"key":"B","text":"螺旋不稳定现象"},{"key":"C","text":"失去纵向安定性"}],"answer":"A","analysis":"提示：横稳方弱， 横漂摆\n解析：飞机的横侧安定性过强而方向安定性相对过弱时，飞机容易出现飘摆(荷兰滚)因为横侧安定性过强导致飞机对横侧扰动过于敏感。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0799","type":"single","difficulty":1,"stem":"飞机的横侧安定性有助于（）。","options":[{"key":"A","text":"使机翼恢复到水平状态"},{"key":"B","text":"使飞机保持航向"},{"key":"C","text":"使飞机保持迎角"}],"answer":"A","analysis":"提示：横测安定，有助水平\n解析：飞机的横侧安定性有助于使机翼恢复到水平状态，即当飞机受到横侧扰动时，横侧安怫定性会使飞机趋于恢复原来的横侧平衡状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0800","type":"single","difficulty":1,"stem":"飞机的理论升限（）实用升限。","options":[{"key":"A","text":"等于"},{"key":"B","text":"大于"},{"key":"C","text":"小于"}],"answer":"B","analysis":"提示：理论大于实际\n解析：飞机的理论升限是指在标准大气条件下，飞机能维持平飞的最大高度，而实用升限则考虑了实际大气条件、发动机性能等因素，因此理论升限通常大于实用升限。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0801","type":"single","difficulty":1,"stem":"飞机的下滑角是（）。","options":[{"key":"A","text":"升力与阻力的夹角"},{"key":"B","text":"飞行轨迹与水平面的夹角"},{"key":"C","text":"阻力与重力的夹角"}],"answer":"B","analysis":"提示：下滑有轨迹\n解析：下滑角是飞机下滑时，向下倾斜的飞行轨迹与水平面之间的夹角。它描述的是飞机沿什么方向下降，不是两个作用力之间的夹角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0802","type":"single","difficulty":1,"stem":"飞机的压力中心是（）。","options":[{"key":"A","text":"压力最低的点"},{"key":"B","text":"压力最高的点"},{"key":"C","text":"升力的着力点"}],"answer":"C","analysis":"提示：有压力才有升的动力\n解析：飞机的压力中心是升力作用线上的一个点，是升力的着力点，对飞机的稳定性和操纵性有重要影响。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0803","type":"single","difficulty":1,"stem":"飞机的迎角是（）。","options":[{"key":"A","text":"飞机纵轴与水平面的夹角"},{"key":"B","text":"飞机翼弦与水平面的夹角"},{"key":"C","text":"飞机翼弦与相对气流的夹角"}],"answer":"C","analysis":"提示：迎角，旋翼和相对气流之间的夹角\n解析：迎角是飞机翼弦与相对气流方向之间的夹角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0804","type":"single","difficulty":1,"stem":"飞机的纵向安定性有利于（）。","options":[{"key":"A","text":"防止飞机绕立轴偏转过快"},{"key":"B","text":"防止飞机绕纵轴滚转过快"},{"key":"C","text":"防止飞机抬头过高或低头过低"}],"answer":"C","analysis":"提示：纵向找高低\n解析：飞机的纵向安定性是指飞机在受到扰动后，能够自动恢复到原来飞行状态的能力，特别是有利于防止飞机抬头过高或低头过低。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0805","type":"single","difficulty":1,"stem":"飞机发生螺旋后，最有效的制止方法是（）。","options":[{"key":"A","text":"立即推杆到底改出失速"},{"key":"B","text":"立即向螺旋反方向打舵到底制止滚转"},{"key":"C","text":"立即加大油门增速"}],"answer":"B","analysis":"提示：问题对答案，螺旋对螺旋\n解析：飞机发生螺旋后，最有效的制止方法是立即向螺旋反方向打舵到底制止滚转，以恢复飞机的正常飞行状态，","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0806","type":"single","difficulty":1,"stem":"飞机发生螺旋现象的原因是（）。","options":[{"key":"A","text":"飞行员方向舵操纵不当"},{"key":"B","text":"飞行员压杆过多"},{"key":"C","text":"飞机失速后机翼自转"}],"answer":"C","analysis":"提示：失速自转→螺旋\n解析：飞机发生螺旋现象的原因是飞机失速后机翼自转，导致飞机无法维持正常的飞行姿态和航向。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0807","type":"single","difficulty":1,"stem":"飞机平飞遇垂直向上突风作用时（）。","options":[{"key":"A","text":"阻力将增大"},{"key":"B","text":"升力将增大"},{"key":"C","text":"升力将减小"}],"answer":"B","analysis":"提示：向上风→托起→升力\n解析：飞机平飞遇垂直向上突风作用时，由于突风对机翼的垂直作用力，升力将增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0808","type":"single","difficulty":1,"stem":"飞机坡度增大，升力的垂直分量（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"保持不变"}],"answer":"B","analysis":"提示：坡大 垂小 水平大\n解析：飞机坡度增大时，升力的垂直分量会减小，因为升力的一部分会转化为水平分量。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0809","type":"single","difficulty":1,"stem":"飞机坡度增大，升力的水平分量（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"保持不变"}],"answer":"A","analysis":"提示：坡大 垂小 水平大\n解析：飞机坡度增大时，升力的水平分量会增大，这是因为升力的一部分由垂直分量转化为水平分量。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0810","type":"single","difficulty":1,"stem":"飞机上升时，其迎角（）。","options":[{"key":"A","text":"大于零"},{"key":"B","text":"小于零"},{"key":"C","text":"等于零"}],"answer":"A","analysis":"提示：上升下降平飞，都是正迎角\n解析：飞机爬升时机头向上仰，机翼与相对气流形成正夹角，升力垂直分量克服重力，迎角必为正才能产生足够升力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0811","type":"single","difficulty":1,"stem":"飞机失速的原因是（）。","options":[{"key":"A","text":"飞机速度太小"},{"key":"B","text":"飞机速度太大"},{"key":"C","text":"飞机迎角超过临界迎角"}],"answer":"C","analysis":"提示：失速，迎角>临界\n解析：飞机失速的原因是飞机迎角超过临界迎角，导致气流无法顺畅流过机翼，升力急剧下降，飞机无法维持正常飞行。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0812","type":"single","difficulty":1,"stem":"飞机水平转弯，坡度增大，失速速度（）。","options":[{"key":"A","text":"减小"},{"key":"B","text":"保持不变，因为临界迎角不变"},{"key":"C","text":"增大"}],"answer":"C","analysis":"提示：坡度大，失速大\n解析：飞机水平转弯时，坡度增大导致升力水平分量增大，为维持升力平衡，迎角需增大，进而失速速度增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0813","type":"single","difficulty":1,"stem":"飞机下降时，其迎角（）。","options":[{"key":"A","text":"大于零"},{"key":"B","text":"小于零"},{"key":"C","text":"等于零"}],"answer":"A","analysis":"提示：上升下降平飞，都是正迎角\n解析：飞机下降时，机头通常仍略向上仰，机翼与来流之间形成正迎角，以维持升力并控制下降速率。即使整体高度降低，迎角仍为正。只有以下三种情况为负：小速度低头下降（机头俯冲）；特技/训练中的倒飞；某些高速巡航或特殊构型下滑时。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0814","type":"single","difficulty":1,"stem":"飞机以一定地速逆风起飞时（）。","options":[{"key":"A","text":"滑跑距离将减小"},{"key":"B","text":"滑跑距离将增大"},{"key":"C","text":"滑跑距离将不变"}],"answer":"A","analysis":"提示：逆风滑跑距离减小\n解析：飞机逆风起飞时，相对风速增大，升力和阻力均增大，使得飞机更早离地，滑跑距离减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0815","type":"single","difficulty":1,"stem":"飞机迎角减小，压力中心的位置会（）。","options":[{"key":"A","text":"前移"},{"key":"B","text":"后移"},{"key":"C","text":"保持不变"}],"answer":"B","analysis":"提示：迎角减小，压力后移（大前小后）\n解析：飞机迎角是飞机机体与风向的夹角，迎角减小意味着飞机的机体与风向夹角变小，这通常发生在飞机姿态调整时，如俯仰调整。当飞机迎角减小时，压力分布也会相应地发生变化，压力中心会向飞机的尾部移动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0816","type":"single","difficulty":1,"stem":"飞机迎角增大，压力中心的位置会（）。","options":[{"key":"A","text":"前移"},{"key":"B","text":"后移"},{"key":"C","text":"保持不变"}],"answer":"A","analysis":"提示：迎角增大，压力前移（大前小后）\n解析：飞机的迎角是指飞机机身与风向之间的夹角，也称为攻角。随着迎角的增大，飞机的气动中心(压力中心)会前移。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0817","type":"single","difficulty":1,"stem":"飞机在地面效应区时，引起的气动力变化是（）。","options":[{"key":"A","text":"升力增大、阻力减小"},{"key":"B","text":"升力减小、阻力增大"},{"key":"C","text":"升力增大、阻力增大"}],"answer":"A","analysis":"提示：地面效应，升大阻小\n解析：飞机接近地面飞行时，地面会限制机翼下洗气流，削弱翼尖涡，使下洗速度和诱导迎角减小。因此，在迎角等条件相同时：机翼升力增大；诱导阻力减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0818","type":"single","difficulty":1,"stem":"飞机着陆进入地面效应区时，将（）。","options":[{"key":"A","text":"出现短暂的机头上仰变化"},{"key":"B","text":"经历诱导阻力减小的过程，需要减小动力"},{"key":"C","text":"需要增大迎角以保持相同的升力系数"}],"answer":"B","analysis":"提示：地面效应，减小动力\n解析：飞机着陆进入地面效应区时，升力增大，诱导阻力减小，为保持下滑姿态和速度，需减小动力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0819","type":"single","difficulty":1,"stem":"飞机转弯的向心力是（）。","options":[{"key":"A","text":"飞机的拉力"},{"key":"B","text":"方向舵上产生的气动力"},{"key":"C","text":"飞机升力的水平分力"}],"answer":"C","analysis":"提示：飞机转弯，都是升力\n解析：飞机转弯的向心力主要由飞机升力的水平分力提供，它使飞机能够沿着转弯轨迹运动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0820","type":"single","difficulty":1,"stem":"飞机转弯时，坡度有继续增大的倾向，原因是（）。","options":[{"key":"A","text":"转弯外侧阻力比内侧的大"},{"key":"B","text":"转弯外侧升力比内侧的大"},{"key":"C","text":"转弯外侧阻力比内侧的小"}],"answer":"B","analysis":"提示：飞机转弯，大外升\n解析：飞机转弯时，由于外侧机翼的迎角相对增大，导致转弯外侧升力比内侧的大，因此坡度有继续增大的倾向。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0821","type":"single","difficulty":1,"stem":"飞机转弯时，为保持高度需要增大迎角，原因是（）。","options":[{"key":"A","text":"保持升力垂直分量不变"},{"key":"B","text":"用以使机头沿转弯方向转动"},{"key":"C","text":"保持升力水平分量不变"}],"answer":"A","analysis":"提示：高度垂直，方向水平\n解析：飞机转弯时，为保持高度需要增大迎角，以保持升力垂直分量不变，从而抵消重力，维持飞行高度。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0822","type":"single","difficulty":1,"stem":"飞行中发现飞机非指令的时而左滚，时而右滚，同时伴随机头时而左偏，时而右偏的现象，此迹象表明（）。","options":[{"key":"A","text":"飞机进入了飘摆(荷兰滚)"},{"key":"B","text":"飞机进入了失速"},{"key":"C","text":"飞机进入了螺旋"}],"answer":"A","analysis":"提示：四个时而“荷兰滚”\n解析：荷兰滚是飞行器 \"横滚\" 与 \"偏航\" 耦合的周期性振荡，属于飞行动力学中典型的横航向模态。表现为一边左右滚转、一边左右摇头甩尾，像钟摆式 “摇摆 + 蛇行” 的复合运动，也常被称作飘摆。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0823","type":"single","difficulty":1,"stem":"根据机翼的设计特点，其产生的升力来自于（）。","options":[{"key":"A","text":"机翼上下表面的正压强"},{"key":"B","text":"机翼下表面的负压和上表面的正压"},{"key":"C","text":"机翼下表面的正压和上表面的负压"}],"answer":"C","analysis":"提示：下正上负\n解析：机翼的设计特点使其下表面为正压，上表面为负压，这种压力差产生了升力，使飞机能够飞行。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0824","type":"single","difficulty":1,"stem":"公式L=Wg，（）。","options":[{"key":"A","text":"适用于飞行器下滑过程"},{"key":"B","text":"适用于飞行器爬升过程"},{"key":"C","text":"都不适用"}],"answer":"C","analysis":"提示：公示只适用于飞行器处于平衡状态的时候\n解析：公式L=Wg表示升力等于重力，这在实际飞行中并不总是成立，特别是在飞行器下滑或爬升过程中，因此该公式不适用于所有飞行情况。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0825","type":"single","difficulty":1,"stem":"保持匀速上升时，升力与重力（）。","options":[{"key":"A","text":"相等"},{"key":"B","text":"升力大于重力"},{"key":"C","text":"升力小于重力"}],"answer":"A","analysis":"提示：匀速 相等\n解析：匀速上升、匀速下降、悬停，全都升力＝重力，升力与重力不平衡会产生加速度。根据牛顿三大运动定律飞机匀速上升时，其加速度为零，合外力为零。在竖直方向上，飞机受到：重力（向下）升力（向上）这时合外力为零，升力等于重力。（推力和反作用力阻力合力也为零）（鼠鼠老师的话：当悬停变为上升的瞬间，才需要升力＞重力，等达到想要的上升速度后，就维持匀速往上爬，此时升力=重力。）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0826","type":"single","difficulty":1,"stem":"常规无人机飞行辅助操纵面有（）。","options":[{"key":"A","text":"副翼、升降舵、方向舵、调整片"},{"key":"B","text":"缝翼、襟翼、调整片、全动平尾"},{"key":"C","text":"缝翼、襟翼、调整片"}],"answer":"C","analysis":"提示：助操纵--去掉全动平尾，两翼一片\n解析：固定翼常规无人机飞行辅助操纵面主要包括缝翼、襟翼和调整片，用于辅助控制飞机的飞行姿态和性能。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0827","type":"single","difficulty":1,"stem":"常规无人机飞行主操纵面有（）。","options":[{"key":"A","text":"副翼、升降舵、方向舵、调整片"},{"key":"B","text":"副翼、升降舵(或全动平尾)、方向舵"},{"key":"C","text":"副翼"}],"answer":"B","analysis":"提示：主操纵--有（全动平尾）\n解析：固定翼常规无人机飞行主操纵面包括副翼、升降舵(或全动平尾)和方向舵，它们用于主要控制飞机的飞行姿态和航向。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0828","type":"single","difficulty":1,"stem":"关于垂直起飞和着陆回收以下错误的是（）。","options":[{"key":"A","text":"垂直起降是旋翼无人机的主流发射回收方式"},{"key":"B","text":"部分特种固定翼无人机也可采用垂直方式发射和回收"},{"key":"C","text":"垂直起降的固定翼无人机均安装有专用的辅助动力系统"}],"answer":"C","analysis":"提示：并非所有的固定翼都安装专用的辅助动力（均安装，太绝对）\n解析：垂直起降的固定翼无人机不一定都安装有专用的辅助动力系统，部分无人机可能通过其他方式实现垂直起降。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0829","type":"single","difficulty":1,"stem":"关于拦截网或“天钩”回收以下正确的是（）。","options":[{"key":"A","text":"用拦截网系统回收无人机是目前世界中型无人机较普遍采用的回收方式之一"},{"key":"B","text":"拦截网系统通常由拦截网、能量吸收装置组成"},{"key":"C","text":"能量吸收装置与拦截网相连，其作用是吸收无人机撞网的能量，免得无人机触网后在网上弹跳不停，以致损伤"}],"answer":"C","analysis":"提示：拦截网就是为了避免弹跳，避免天钩损伤。\n解析：拦截网或“天钩”回收系统中，能量吸收装置与拦截网相连，主要作用是吸收无人机撞网时的能量，防止无人机在网上弹跳造成损伤，这是拦截网系统的重要组成部分。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0830","type":"single","difficulty":1,"stem":"关于平凸翼型的剖面形状，下面说法正确的是（）。","options":[{"key":"A","text":"上下翼面的弯度相同"},{"key":"B","text":"机翼上表面的弯度小于下表面的弯度"},{"key":"C","text":"机翼上表面的弯度大于下表面的弯度"}],"answer":"C","analysis":"提示：平凸，上大于下\n解析：平凸翼型的剖面形状特点是机翼上表面的弯度大于下表面的弯度，这种设计有助于产生更大的升力，提高飞机的飞行性能。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0831","type":"single","difficulty":1,"stem":"关于伞降回收以下正确的是（）。","options":[{"key":"A","text":"回收伞均由主伞、减速伞和阻力伞三级伞组成"},{"key":"B","text":"当无人机完成任务后，地面站发遥控指令给无人机或由无人机自主执行，使无人机减速，降高及发动机停车"},{"key":"C","text":"无人机悬挂在主伞下慢慢着陆，机下触地开关接通，使主伞收回无人机内，这是对降落伞回收过程最简单的描述"}],"answer":"B","analysis":"提示：伞降→停车\n解析：伞降回收过程中，当无人机完成任务后会接收地面站的遥控指令或由无人机自主执行，进行减速、降高及发动机停车等操作，以确保安全着陆。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0832","type":"single","difficulty":1,"stem":"仅偏转副翼使飞机水平左转弯时，出现（）。","options":[{"key":"A","text":"右侧滑"},{"key":"B","text":"左侧滑"},{"key":"C","text":"无侧滑"}],"answer":"B","analysis":"提示：仅左向左\n解析：仅偏转副翼使飞机水平左转弯时，由于升力向量的倾斜，会产生向左转的力矩，同时伴随着左侧滑的出现，以保持飞机的协调转弯。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0833","type":"single","difficulty":1,"stem":"具有负静安定性的飞机，当受到扰动使平衡状态变化后，有（）。","options":[{"key":"A","text":"回到原平衡状态的趋势"},{"key":"B","text":"继续偏离原平衡状态的趋势"},{"key":"C","text":"保持偏离后的平衡状态的趋势"}],"answer":"B","analysis":"提示：正静回，负静偏\n解析：具有负静安定性的飞机，在受到扰动后，会倾向于继续偏离其原平衡状态，而不是回到原平衡状态或保持偏离后的平衡状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0834","type":"single","difficulty":1,"stem":"具有正静安定性的飞机，当受到扰动使平衡状态变化后，有（）。","options":[{"key":"A","text":"回到原平衡状态的趋势"},{"key":"B","text":"继续偏离离原平衡状态的趋势"},{"key":"C","text":"保持偏离后的平衡状态"}],"answer":"A","analysis":"提示：正静回，负静偏\n解析：具有正静安定性→受到扰动导致平衡状态变化后→有回到原平衡状态的趋势具有负静安定性→受到扰动导致平衡状态变化后→有偏离原平衡状态的趋势","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0835","type":"single","difficulty":1,"stem":"具有纵向安定性的飞机，飞机重心（）。","options":[{"key":"A","text":"位于压力中心前"},{"key":"B","text":"位于压力中心后"},{"key":"C","text":"与压力中心重合"}],"answer":"A","analysis":"提示：纵前，横后\n解析：具有纵向安定性的飞机，其重心位于压力中心前方，这样设计可以使得飞机在受到扰动时具有恢复原来飞行姿态的趋势。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0836","type":"single","difficulty":1,"stem":"空气动力学概念中，空气的物理性质主要包括（）。","options":[{"key":"A","text":"空气的粘性"},{"key":"B","text":"空气的压缩性"},{"key":"C","text":"空气的粘性和压缩性"}],"answer":"C","analysis":"提示：空气有两性，粘性和压缩性\n解析：空气动力学概念中，空气的物理性质主要包括空气的粘性和压缩性，这两个性质对飞机的飞行性能和气动特性有着重要影响。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0837","type":"single","difficulty":1,"stem":"空速适度减小时，为保持高度，应实施的操纵是（）。","options":[{"key":"A","text":"增大迎角，使升力的增加大于阻力的增加"},{"key":"B","text":"增大迎角，以保持升力不变"},{"key":"C","text":"减小迎角，以保持阻力不变"}],"answer":"B","analysis":"提示：空速减小，增大迎角\n解析：当空速减小时，如果迎角增大，可以保持升力不变，从而保持飞机的高度。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0838","type":"single","difficulty":1,"stem":"流体的粘性与温度之间的关系是（）。","options":[{"key":"A","text":"液体的粘性随温度的升高而增大"},{"key":"B","text":"气体的粘性随温度的升高而增大"},{"key":"C","text":"液体的粘性与温度无关"}],"answer":"B","analysis":"提示：气体温度越高粘性越高，液体温度越高粘性越低（温度低凝固）\n解析：流体的粘性与温度之间的关系是，对于气体而言，其粘性随温度的升高而增大。这是因为气体分子的热运动随温度升高而加剧，导致分子间的相互作用增强，从而粘性增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0839","type":"single","difficulty":1,"stem":"偏转副翼使飞机右转弯时，为修正逆偏转的影响，应（）。","options":[{"key":"A","text":"向左偏转方向舵"},{"key":"B","text":"向右偏转方向舵"},{"key":"C","text":"向左压杆"}],"answer":"B","analysis":"提示：左转配左舵，右转配右舵\n解析：使用副翼使飞机向右滚转时，右副翼上偏、左副翼下偏，左机翼升力和阻力增大。阻力差使飞机产生向左的逆偏航，即机头向左、机尾向右。为修正逆偏航，应向右蹬方向舵，使机头向右、机尾向左，抵消阻力差造成的左偏航，实现协调转弯。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0840","type":"single","difficulty":1,"stem":"偏转副翼使飞机转弯时，两翼的阻力是（）。","options":[{"key":"A","text":"内侧机翼阻力大"},{"key":"B","text":"外侧机翼阻力大"},{"key":"C","text":"相等"}],"answer":"B","analysis":"提示：外侧机翼阻力大\n解析：偏转副翼使飞机转弯时，外侧机翼的副翼向下偏，机翼有效弯度、局部迎角增大，升力更大，诱导阻力随之增大，同时阻力也更大；内侧机翼的副翼向上偏，机翼有效弯度、局部迎角减小，升力下降，诱导阻力相应减小，同时阻力也减小。所以，升力和阻力，都是外大内小因此外侧机翼总阻力大于内侧机翼，进而产生逆偏航。（依据：FAA《飞行员航空知识手册》第六章 飞行操纵：由于向下偏转的副翼会产生更多升力，它也会产生更多阻力。）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0841","type":"single","difficulty":1,"stem":"偏转副翼使飞机左转弯时，为修正逆偏转的影响，应（）。","options":[{"key":"A","text":"向左偏转方向舵"},{"key":"B","text":"向右偏转方向舵"},{"key":"C","text":"向右压杆"}],"answer":"A","analysis":"提示：左转配左舵，右转配右舵\n解析：· 使用副翼转弯时（副翼压谁谁小，往哪转哪侧小）： 使用副翼使飞机向左滚转时，左副翼上偏、右副翼下偏，右机翼升力和阻力增大。阻力差使飞机产生向右的逆偏航，即机头向右、机尾向左。为修正逆偏航，应向左蹬方向舵，使机头向左、机尾向右，抵消阻力差造成的右偏航，实现协调转弯。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0842","type":"single","difficulty":1,"stem":"如飞机出现失速，飞行员应（）。","options":[{"key":"A","text":"立即蹬舵"},{"key":"B","text":"立即推杆到底"},{"key":"C","text":"立即拉杆"}],"answer":"B","analysis":"提示：失速推杆到底\n解析：当飞机出现失速时，飞行员应立即推杆到底，减小迎角，恢复飞机的正常飞行状态。拉杆会增加迎角，加剧失速状况。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0843","type":"single","difficulty":1,"stem":"如果对称机翼相对来流仰头旋转了一个迎角，驻点（）。","options":[{"key":"A","text":"稍稍向前缘的上表面移动"},{"key":"B","text":"稍稍向前缘的下表面移动"},{"key":"C","text":"不会移动"}],"answer":"B","analysis":"提示：飞机仰头， 气流从飞机下方比较容易通过\n解析：当对称机翼相对来流仰头旋转了一个迎角时，驻点会稍稍向前缘的下表面移动，这是因为气流在机翼上表面的流速增加，压力降低，导致驻点位置改变。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0844","type":"single","difficulty":1,"stem":"升力系数1.3和升力系数1.0，（）。","options":[{"key":"A","text":"前者产生更大升力"},{"key":"B","text":"后者产生更大升力"},{"key":"C","text":"产生升力相等"}],"answer":"A","analysis":"提示：系数越大，升力越大\n解析：升力系数1.3相较于升力系数1.0，前者能产生更大的升力，因为升力系数直接反映了升力与重力的比值，系数越大，升力越大","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0845","type":"single","difficulty":1,"stem":"失速的直接原因是（）。","options":[{"key":"A","text":"低速飞行"},{"key":"B","text":"高速飞行"},{"key":"C","text":"迎角过大"}],"answer":"C","analysis":"提示：失速迎角过大\n解析：失速的直接原因是迎角过大，当迎角超过临界迎角时，气流无法紧贴机翼上表面流过，导致升力急剧下降，飞机失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0846","type":"single","difficulty":1,"stem":"使飞机获得最大下滑距离的速度是（）。","options":[{"key":"A","text":"最大下滑速度"},{"key":"B","text":"失速速度"},{"key":"C","text":"下滑有利速度"}],"answer":"C","analysis":"提示：下滑有利速度\n解析：使飞机获得最大下滑距离的速度是下滑有利速度，这个速度下，飞机能够以最远的距离下滑着陆，既不过快也不过慢。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0847","type":"single","difficulty":1,"stem":"通过改变迎角，无人机驾驶员可以控制飞机的（）。","options":[{"key":"A","text":"升力、空速、阻力"},{"key":"B","text":"升力、空速、阻力、重量"},{"key":"C","text":"升力、拉力、阻力"}],"answer":"A","analysis":"提示：去掉重量\n解析：首先，根据升力阻力公式，迎角影响升力系数与阻力系数，直接影响升力阻力。其次，在“平飞、重量不变、未失速的前提下”，迎角也直接影响空速。（速度越大，所需迎角越小）飞机重量是飞机自身固有的属性，与迎角没有任何关系。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0848","type":"single","difficulty":1,"stem":"通过一个收缩管道的流体，在管道的收缩区，速度的增加必然造成收缩区压力（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"减少"},{"key":"C","text":"不变"}],"answer":"B","analysis":"提示：窄处高速低压\n解析：本题考的是“连续性定理”+“伯努利定理”的结合。题干问的是收缩区的压力， 默认指静压，是航空题的常规表述。·根据连续性方程：管道收缩→横截面积减小→流速增大 ；·根据伯努利定理：总压恒定→流速增大→动压增大→静压必然减小；推导出：窄处高速低压","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0849","type":"single","difficulty":1,"stem":"固定翼无人机在姿态遥控状态下，如出现动力失效则正确的处理方法是（）。","options":[{"key":"A","text":"保持略大于平飞速度的速度建立下滑航线飞回本场或迫降无人区"},{"key":"B","text":"势能换动能，低头俯冲"},{"key":"C","text":"仅剩的动能转换势能，保持上仰姿态与安全高度"}],"answer":"A","analysis":"提示：动力失效就迫降\n解析：当飞行过程中的固定翼无人机出现动力失效，正确处理方法是保持略大于平飞速度的速度建立下滑航线飞回本场或迫降无人区。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0850","type":"single","difficulty":1,"stem":"无人机飞行员操纵方向舵时，飞行器将绕（）。","options":[{"key":"A","text":"横轴运动"},{"key":"B","text":"纵轴运动"},{"key":"C","text":"立轴运动"}],"answer":"C","analysis":"提示：副纵升横方向立\n解析：操纵方向舵时，飞行器将绕立轴运动，即进行偏航运动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0851","type":"single","difficulty":1,"stem":"无人机飞行员操纵升降舵时，飞行器将绕（）。","options":[{"key":"A","text":"横轴运动"},{"key":"B","text":"纵轴运动"},{"key":"C","text":"立轴运动"}],"answer":"A","analysis":"提示：副纵升横方向立\n解析：操纵升降舵时，飞行器将绕横轴运动，即进行俯仰运动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0852","type":"single","difficulty":1,"stem":"无人机驾驶员操纵副翼时，飞行器将绕（）。","options":[{"key":"A","text":"横轴运动"},{"key":"B","text":"纵轴运动"},{"key":"C","text":"立轴运动"}],"answer":"B","analysis":"提示：副纵升横方向立\n解析：操纵副翼时，飞行器将绕纵轴运动，即进行滚转运动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0853","type":"single","difficulty":1,"stem":"无人机驾驶员舵面遥控操纵飞机时，（）。","options":[{"key":"A","text":"拉杆飞机转入下降"},{"key":"B","text":"推油门飞机转入下降"},{"key":"C","text":"推杆飞机转入下降"}],"answer":"C","analysis":"提示：推杆减小迎角，下降\n解析：无人机驾驶员舵面遥控操纵飞机时，推杆会使飞机转入下降状态，因为推杆会减小飞机的迎角，导致升力减小，飞机下降。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0854","type":"single","difficulty":1,"stem":"下滑有利速度使（）。","options":[{"key":"A","text":"飞机下滑阻力最小"},{"key":"B","text":"飞机下滑角最大"},{"key":"C","text":"飞机下滑升力最大"}],"answer":"A","analysis":"提示：下滑阻力最小\n解析：下滑有利速度是指使飞机下滑阻力最小的速度，这样飞机可以以最远的距离下滑着陆。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0855","type":"single","difficulty":1,"stem":"下列不是影响空气粘性的因素是（）。","options":[{"key":"A","text":"空气的流动位置"},{"key":"B","text":"气流的流速"},{"key":"C","text":"空气的粘性系数"}],"answer":"A","analysis":"提示：粘性与位置无关\n解析：空气的粘性主要受温度和气压的影响，与空气的流动位置无关。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0856","type":"single","difficulty":1,"stem":"下列错误的选项是（）。","options":[{"key":"A","text":"黏性阻力是由于空气和飞行器表面接触产生的"},{"key":"B","text":"形状阻力是由于空气和飞行器表面接触产生的"},{"key":"C","text":"蒙皮摩擦阻力是由于空气和飞行器表面接触产生的"}],"answer":"B","analysis":"提示：三个表面选形状\n解析：形状阻力(也称为压差阻力)主要是由于飞行器的形状导致气流在飞行器表面分离，形成压力差而产生的阻力。这种阻力与飞行器的形状和尺寸有关，而不仅仅是与空气和飞行器表面的接触。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0857","type":"single","difficulty":1,"stem":"下列哪个是正确的?","options":[{"key":"A","text":"牛顿第三运动定律表明，要获得给定加速度所施加的力的大小取决于无人机的质量"},{"key":"B","text":"牛顿第二运动定律表明作用力和反作用力是大小相等方向相反的"},{"key":"C","text":"如果一个物体处于平衡状态，那么它就有保持这种平衡状态的趋势"}],"answer":"C","analysis":"提示：两个牛顿都不对\n解析：牛顿第三运动定律并不直接说明力与加速度和质量的关系，而是说明作用力和反作用力的关系。牛顿第二运动定律才表明力的大小等于质量乘以加速度。如果一个物体处于平衡状态，那么它就有保持这种平衡状态的趋势。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0858","type":"single","difficulty":1,"stem":"下列哪种状态下飞行器会超过临界迎角?","options":[{"key":"A","text":"低速飞行"},{"key":"B","text":"高速飞行"},{"key":"C","text":"都会"}],"answer":"C","analysis":"提示：高低速度都影响迎角\n解析：是否超过临界迎角，取决于迎角本身，不能只凭飞行速度判断。低速飞行时，为维持升力往往需要增大迎角，可能超过临界迎角；高速飞行时，如果突然大幅拉杆，同样可能超过临界迎角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0859","type":"single","difficulty":1,"stem":"下列说法错误的是（）。","options":[{"key":"A","text":"裕度越大，稳定性就越强"},{"key":"B","text":"重心的移动不会改变静稳定裕度"},{"key":"C","text":"配重的任何变化都将需要新的升降舵配平以维持水平飞行"}],"answer":"B","analysis":"提示：重心改变影响静稳定裕度\n解析：静稳定裕度与重心的位置密切相关。直接带来2个知识点：1.重心的移动必然改变静稳定裕度2.任何配重变化都必然影响重心，必然需要新的升降舵配平以维持水平飞行。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0860","type":"single","difficulty":1,"stem":"下列正确的选项是（）。","options":[{"key":"A","text":"了解飞机阻力是如何产生的并如何去减小它是很重要的"},{"key":"B","text":"飞行器飞行时阻力是可以避免的"},{"key":"C","text":"每次翼型或迎角的变化都不会改变飞机的阻力"}],"answer":"A","analysis":"提示：选正确的，BC明显错误\n解析：了解飞机阻力的产生和减小方法对于飞行器的设计和性能优化至关重要。阻力是飞行器飞行时必须克服的力量，减小阻力可以提高飞行效率。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0861","type":"single","difficulty":1,"stem":"下面说法错误的是（）。","options":[{"key":"A","text":"滑翔状态，一个较大的下滑角会导致一个很大的重力分量"},{"key":"B","text":"在俯冲状态中，飞行轨迹可以达到完全垂直向下"},{"key":"C","text":"在爬升状态中，要想爬升得更陡和更快就必须有强大的推力，机翼的作用是主要的"}],"answer":"C","analysis":"提示：选错的，机翼作用不主要，发动机最重要\n解析：在爬升状态中，飞机需要克服重力向上飞行。机翼的主要作用是产生升力，来平衡重力，爬升所需的多余能量几乎全部由发动机提供。其他选项：1.在某些极端情况下，比如飞机进行垂直俯冲表演或者失去控制时，飞行轨迹确实可以达到完全垂直向下。✔2.在滑翔状态中，飞机的重力可以分解为两个分量：一个沿着飞行轨迹方向（提供向前的动力），一个垂直于飞行轨迹方向（与升力平衡）。当下滑角较大时，重力沿飞行轨迹方向的分量会增大。✔","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0862","type":"single","difficulty":1,"stem":"相同迎角，飞行速度增大一倍，阻力增加约为原来的（）。","options":[{"key":"A","text":"一倍"},{"key":"B","text":"二倍"},{"key":"C","text":"四倍"}],"answer":"C","analysis":"提示：相同迎角，速度跟阻力1:4\n解析：根据阻力的计算公式，阻力与速度的平方成正比，因此速度增大一倍时，阻力增加约为原来的四倍。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0863","type":"single","difficulty":1,"stem":"一个平滑流动或流线型流动里面的空气微团，接近一个低压区时（）。","options":[{"key":"A","text":"会加速"},{"key":"B","text":"会减速"},{"key":"C","text":"速度不变"}],"answer":"A","analysis":"提示：高加速流向低\n解析：根据伯努利原理，当空气微团接近低压区时，其速度会增加，因为压力能和动能之和是常数。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0864","type":"single","difficulty":1,"stem":"影响升力的因素，（）。","options":[{"key":"A","text":"飞行器的尺寸或面积、飞行速度、空气密度"},{"key":"B","text":"升力系数"},{"key":"C","text":"都是"}],"answer":"C","analysis":"提示：升力因素都有\n解析：L=1/2ρCSv²，即:升力L=1/2*空气密度*速度的平方*机翼面积*升力系数。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0865","type":"single","difficulty":1,"stem":"用下滑有利速度下滑，飞机的（）。","options":[{"key":"A","text":"升阻比最大"},{"key":"B","text":"升力最大"},{"key":"C","text":"下滑角最大"}],"answer":"A","analysis":"提示：有利速度下滑，升阻比最大\n解析：用下滑有利速度下滑时，飞机的升阻比达到最大，这意味着飞机在下滑过程中能够获得最佳的飞行效率。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0866","type":"single","difficulty":1,"stem":"在定高直线飞行中，下面关于飞机升力的说法，正确的是（）。","options":[{"key":"A","text":"空速小时必须减小迎角，以产生适当的升力来保持高度"},{"key":"B","text":"空速大时必须减小迎角，以产生适当的升力来保持高度"},{"key":"C","text":"空速大时必须增大迎角，以产生适当的升力来保持高度"}],"answer":"B","analysis":"提示：定高，空大，迎小\n解析：定高直线飞行中，为了保持高度，飞机需要产生适当的升力。当空速增大时，为了保持适当的升力，必须减小迎角，以防止升力过大导致飞机爬升。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0867","type":"single","difficulty":1,"stem":"在机翼上，驻点处是（）。","options":[{"key":"A","text":"空气与前缘相遇的地方"},{"key":"B","text":"空气与后缘相遇的地方"},{"key":"C","text":"都不正确"}],"answer":"A","analysis":"提示：驻点在前缘\n解析：驻点是空气流过机翼时，首先与前缘相遇的地方。这是空气动力学中的一个基本概念。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0868","type":"single","difficulty":1,"stem":"在涡阻力等于其他阻力和的地方（）。","options":[{"key":"A","text":"阻力达到最小值"},{"key":"B","text":"阻力达到极小值"},{"key":"C","text":"阻力达到极大值"}],"answer":"A","analysis":"提示：涡阻力最小\n解析：从图上可以看出，当黄线代表的涡阻力（也就是诱导阻力）与绿线代表的废阻力的相等的时候，也就是黄绿色两条线相交，数值一样的时候，相交点向上，对应的总阻力值最低，也就是阻力达到最小值。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0869","type":"single","difficulty":1,"stem":"载荷因子是（）。","options":[{"key":"A","text":"飞机拉力与阻力的比值"},{"key":"B","text":"飞机升力与阻力的比值"},{"key":"C","text":"飞机承受的载荷(除重力外)与重力的比值"}],"answer":"C","analysis":"提示：问题对答案，载荷对载荷\n解析：载荷因子是飞机承受的载荷(除重力外)与重力的比值，它反映了飞机在特定飞行条件下的载荷情况。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0870","type":"single","difficulty":1,"stem":"重心靠后，飞机的纵向安定性（）。","options":[{"key":"A","text":"变强"},{"key":"B","text":"减弱"},{"key":"C","text":"保持不变"}],"answer":"B","analysis":"提示：纵向，重心前强后弱\n解析：飞机的纵向安定性是指飞机在受到扰动后，能否恢复到原来飞行状态的能力。当飞机的重心靠后时，其纵向安定性会减弱，因为重心后移会使得飞机在受到扰动时更容易产生俯仰运动，且恢复稳定的能力降低。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0871","type":"single","difficulty":1,"stem":"重心靠前，飞机的纵向安定性（）。","options":[{"key":"A","text":"变强"},{"key":"B","text":"减弱"},{"key":"C","text":"不受影响"}],"answer":"A","analysis":"提示：纵向，重心前强后弱\n解析：与重心靠后相反，当飞机的重心靠前时，其纵向安定性会增强。这是因为重心前移会使得飞机在受到扰动时更不容易产生俯仰运动，且能更快地恢复到原来的飞行状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0872","type":"single","difficulty":1,"stem":"转弯时，为保持高度和空速，应（）。","options":[{"key":"A","text":"增大迎角和油门"},{"key":"B","text":"增大迎角、减小拉力"},{"key":"C","text":"减小迎角、增大拉力"}],"answer":"A","analysis":"提示：转弯为保持高度与空速，增大迎角和油门\n解析：在转弯时，为了保持高度和空速，飞机需要增大迎角以产生足够的升力来抵消重力的影响，从而保持高度。同时，为了保持空速，飞机需要增大油门以增加推力。因此，正确的操作是增大迎角和油门。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0873","type":"single","difficulty":1,"stem":"“失速”指的是（）。","options":[{"key":"A","text":"飞机失去速度"},{"key":"B","text":"飞机速度太快"},{"key":"C","text":"飞机以大于临界迎角飞行"}],"answer":"C","analysis":"提示：大于迎角就失速\n解析：失速是指飞机在飞行过程中，当迎角超过临界迎角时，飞机的升力会突然下降，导致飞机无法维持正常飞行高度和速度的状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0874","type":"single","difficulty":1,"stem":"“失速迎角”就是“临界迎角”，指的是（）。","options":[{"key":"A","text":"飞机飞的最高时的迎角"},{"key":"B","text":"飞机飞的最快时的迎角"},{"key":"C","text":"飞机升力系数最大时的迎角"}],"answer":"C","analysis":"提示：失速迎角升力最大\n解析：临界迎角是飞机在飞行中能够产生的最大升力系数所对应的迎角。当迎角超过这个值时，飞机的升力会突然下降，导致失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0875","type":"single","difficulty":1,"stem":"表面脏污的机翼与表面光洁的机翼相比（）。","options":[{"key":"A","text":"最大升力系数下降，阻力系数增大"},{"key":"B","text":"相同升力系数时其迎角减小"},{"key":"C","text":"同迎角下升力系数相同，阻力系数加大"}],"answer":"A","analysis":"提示：脏了升力下降，阻力增大\n解析：机翼表面的脏污会影响其空气动力学性能，导致最大升力系数下降，同时脏污的表面也会增加阻力系数。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0876","type":"single","difficulty":1,"stem":"伯努利方程的使用条件是（）。","options":[{"key":"A","text":"只要是理想的不可压缩流体"},{"key":"B","text":"只要是理想的与外界无能量交换的流体"},{"key":"C","text":"必须是理想的、不可压缩、且与外界无能量交换的流体"}],"answer":"C","analysis":"提示：“两者都” C=A+B 伯努利适用条件严格，有5条，选最长的那的。\n解析：严格说来，伯努利定理在下列条件下，才是适用的： 1.气流是连续、稳定的，即流动是定常的； 2.流动的空气与外界没有能量交换，即空气是绝热的； 3.空气没有粘性，即空气为理想流体； 4.空气密度是不变，即空气为不可压流； 5.同一条流线或同一条流管上。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0877","type":"single","difficulty":1,"stem":"伯努利方程适用于（）。","options":[{"key":"A","text":"低速气流"},{"key":"B","text":"高速气流"},{"key":"C","text":"适用于各种速度的气流"}],"answer":"A","analysis":"提示：伯努利，低速\n解析：伯努利方程主要适用于低速气流的情况。在高速气流中，由于流体的压缩性和粘性等因素的影响，伯努利方程可能不再适用。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0878","type":"single","difficulty":1,"stem":"不属于影响飞机机体腐蚀的大气因素是（）。","options":[{"key":"A","text":"空气的相对湿度"},{"key":"B","text":"空气压力"},{"key":"C","text":"空气的温差"}],"answer":"B","analysis":"提示：压力不会腐蚀机身\n解析：影响飞机机体腐蚀的大气因素主要包括空气的相对湿度、温度、以及空气中的腐蚀性物质等。而空气压力本身并不直接导致飞机机体的腐蚀。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0879","type":"single","difficulty":1,"stem":"不属于影响机翼升力系数的因素是（）。","options":[{"key":"A","text":"翼剖面形状"},{"key":"B","text":"迎角"},{"key":"C","text":"空气密度"}],"answer":"C","analysis":"提示：空气密度影响升力，不是升力系数\n解析：机翼升力系数主要受机翼形状和流体流过机翼时的角度影响。翼剖面形状(也称为翼型)直接影响升力的产生，因为它决定了流体流过机翼时的速度和压力分布。迎角是机翼与来流方向的夹角，它也会影响升力系数，因为迎角的变化会改变流体流过机翼的方式，从而影响升力的产生。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0880","type":"single","difficulty":1,"stem":"测量机翼的翼弦是从（）。","options":[{"key":"A","text":"左翼尖到右翼尖"},{"key":"B","text":"机身中心线到翼尖"},{"key":"C","text":"机翼前缘到后缘"}],"answer":"C","analysis":"提示：弦缘 展尖\n解析：指翼型前缘（最前端点）与后缘（最后端点）之间的连线长度，这条连线被称为 “弦线”，弦线的实际长度就是弦长。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0881","type":"single","difficulty":1,"stem":"测量机翼的翼展是从（）。","options":[{"key":"A","text":"左翼尖到右翼尖"},{"key":"B","text":"机身中心线到翼尖"},{"key":"C","text":"机翼前缘到后缘"}],"answer":"A","analysis":"提示：弦缘 展尖\n解析：测量机翼的翼展是从左翼尖到右翼尖。翼展是机翼左右两端的最大直线距离，影响飞机的稳定性和机动性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0882","type":"single","difficulty":1,"stem":"层流翼型的特点是（）。","options":[{"key":"A","text":"前缘半径大，后部尖的水滴形"},{"key":"B","text":"最大厚度靠后"},{"key":"C","text":"前缘尖的菱形"}],"answer":"B","analysis":"提示：层流翼，最大厚度靠后\n解析：层流翼型的特点是最大厚度靠后。这种设计有助于保持翼面大范围层流，减小阻力，是翼型发展的重要里程碑。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0883","type":"single","difficulty":1,"stem":"从原点作极曲线的切线，切点所对应的迎角值是（）。","options":[{"key":"A","text":"最大迎角"},{"key":"B","text":"有利迎角"},{"key":"C","text":"最小迎角"}],"answer":"B","analysis":"提示：极曲线，有利迎角\n解析：从原点作极曲线的切线，切点所对应的迎角值是有利迎角。这是因为极曲线表示升力系数随迎角的变化关系，切点处升力系数增加的速度最快，对应的是有利迎角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0884","type":"single","difficulty":1,"stem":"当飞机减小速度水平飞行时（）。","options":[{"key":"A","text":"增大迎角以提高升力"},{"key":"B","text":"减小迎角以减小阻力"},{"key":"C","text":"保持迎角不变以防止失速"}],"answer":"A","analysis":"提示：小速度，大迎角\n解析：当飞机减小速度水平飞行时，为了保持升力不变，需要增大迎角以提高升力。这是因为升力与速度的平方成正比，速度减小会导致升力减小，增大迎角可以补偿这-减小，保持升力不变。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0885","type":"single","difficulty":1,"stem":"当空气在管道中低速流动时，由伯努利定理可知（）。","options":[{"key":"A","text":"流速大的地方，静压大"},{"key":"B","text":"流速大的地方，静压小"},{"key":"C","text":"流速大的地方，总压大"}],"answer":"B","analysis":"提示：伯努利“流速大静压小”（或者说压强小）\n解析：计算动压的公式为q = 1/2 × ρ × v²根据动压计算公式 q = 1/2 × ρ × v² , 可得出结论：流速大的地方，动压大（v↑ q↑）；根据伯努利定理“动压+静压=总压”，可得出结论：总压不变时，动压大了，静压就小。核心逻辑：低速流动下总压恒定 → 流速↑→动压↑→静压↓核心结论：伯努利“流速大静压小”（或者说压强小）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0886","type":"single","difficulty":1,"stem":"当空气在管道中流动时，由伯努利定理可知（）。","options":[{"key":"A","text":"凡是流速大的地方，压强就大（指静压）"},{"key":"B","text":"凡是流速小的地方，压强就小（指静压）"},{"key":"C","text":"凡是流速大的地方，压强就小（指静压）"}],"answer":"C","analysis":"提示：伯努利“流速大静压小”（或者说压强小）\n解析：计算动压的公式为q = 1/2 × ρ × v²根据动压计算公式 q = 1/2 × ρ × v² , 可得出结论：流速大的地方，动压大（v↑ q↑）；根据伯努利定理“动压+静压=总压”，可得出结论：总压不变时，动压大了，静压就小。核心逻辑：低速流动下总压恒定 → 流速↑→动压↑→静压↓核心结论：伯努利“流速大静压小”（或者说压强小）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0887","type":"single","difficulty":1,"stem":"当迎角达到临界迎角时（）。","options":[{"key":"A","text":"升力突然大大增加，而阻力迅速减小"},{"key":"B","text":"升力突然大大降低，而阻力迅速增加"},{"key":"C","text":"升力和阻力同时大大增加"}],"answer":"B","analysis":"提示：临界迎角，升力减小，阻力增加\n解析：当迎角达到临界迎角时，升力会突然大大降低，而阻力会迅速增加。这是因为临界迎角是飞机升力系数最大的迎角，超过这个迎角，升力系数会迅速下降，同时阻力系数会迅速上升，导致飞机的升力突然降低，阻力迅速增加。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0888","type":"single","difficulty":1,"stem":"对低速气流，由伯努利方程可以得出（）。","options":[{"key":"A","text":"流管内气流速度增加，空气静压也增加"},{"key":"B","text":"流管截面积减小，空气静压增加"},{"key":"C","text":"流管内气流速度增加，空气静压减小"}],"answer":"C","analysis":"提示：伯努利，流速大，压强小\n解析：对低速气流，由伯努利方程可以得出，流管内气流速度增加，空气静压减小。这是因为伯努利方程描述了流体在流动过程中速度、压强和高度之间的关系，对于低速气流，当流速增加时，流体的静压会减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0889","type":"single","difficulty":1,"stem":"对起飞降落安全性造成不利影响的是（）。","options":[{"key":"A","text":"稳定的逆风场"},{"key":"B","text":"跑道上的微冲气流"},{"key":"C","text":"稳定的上升气流"}],"answer":"B","analysis":"提示：起飞降落在跑道，微冲\n解析：在飞机的起飞和降落过程中，跑道上的微冲气流可能对飞行安全造成不利影响。微冲气流是指跑道附近由于地形、建筑物等因素造成的局部气流扰动，这些扰动可能使飞机在接地瞬间发生突然跳跃、颠簸或偏离跑道，从而增加事故风险。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0890","type":"single","difficulty":1,"stem":"对一般翼型来说，下列说法中哪个是正确的?","options":[{"key":"A","text":"当迎角为零时，升力不为零"},{"key":"B","text":"当翼剖面有一个正迎角时，上翼面处的流线比下翼面处的流线疏"},{"key":"C","text":"当翼剖面有一个正迎角时，上翼面处的流速小于下翼面处的流速"}],"answer":"A","analysis":"提示：迎角为 0，升力不为0\n解析：对于一般翼型，即使迎角为零，由于翼型上下表面的弯曲形状不同，仍然会产生一定的升力。 当翼剖面有一个正迎角时，上翼面处的流线比下翼面处的流线密，因为气流在流经上翼面时需要更快地流动以在相同时间内通过更长的路程。同时，上翼面处的流速大于下翼面处的流速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0891","type":"single","difficulty":1,"stem":"对于非对称翼型的零升迎角是（）。","options":[{"key":"A","text":"一个小的正迎角"},{"key":"B","text":"一个小的负迎角"},{"key":"C","text":"失速迎角"}],"answer":"B","analysis":"提示：对称是正，非对称是负\n解析：非对称翼型通常设计为上翼面凸起较大，以便在零迎角或负迎角时产生升力。因此，零升迎角是一个小的负迎角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0892","type":"single","difficulty":1,"stem":"飞机飞行中，机翼升力等于零时的迎角称为（）。","options":[{"key":"A","text":"零升迎角"},{"key":"B","text":"失速迎角"},{"key":"C","text":"零迎角"}],"answer":"A","analysis":"提示：升力为 0，升迎角为 0\n解析：零升迎角是指飞机飞行中，机翼升力等于零时的迎角。失速迎角是指飞机超过此迎角后，机翼上的气流将发生严重分离，导致升力急剧下降，飞机可能失控的迎角。零迎角则是指飞机的迎角为零，即飞机机翼与气流方向平行时的状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0893","type":"single","difficulty":1,"stem":"飞机前缘结冰对飞行的主要影响（）。","options":[{"key":"A","text":"增大了飞机重量，使起飞困难"},{"key":"B","text":"增大了临界攻角，使飞机易失速"},{"key":"C","text":"相同迎角，升力系数下降"}],"answer":"C","analysis":"提示：前缘结冰，升力下降\n解析：飞机前缘结冰会改变机翼的形状，从而影响其气动性能。结冰会导致机翼前缘变得不光滑，增加气流分离的可能性，降低升力系数。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0894","type":"single","difficulty":1,"stem":"飞机上不同部件的连接处装有整流包皮，它的主要作用是（）。","options":[{"key":"A","text":"减小摩擦阻力"},{"key":"B","text":"减小干扰阻力"},{"key":"C","text":"减小诱导阻力"}],"answer":"B","analysis":"提示：整包→减小干扰阻力（包干）\n解析：整流包皮是安装在飞机上不同部件连接处的一种装置，其主要作用是减小由于部件连接处形状不规则而产生的干扰阻力。干扰阻力是由于气流在飞机表面遇到突出物或形状变化时产生的，它会增加飞机的总阻力。整流包皮通过平滑连接处的形状，减少气流分离和涡流的形成，从而降低干扰阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0895","type":"single","difficulty":1,"stem":"飞机上产生的摩擦阻力与大气的哪种物理性质有关?","options":[{"key":"A","text":"可压缩性"},{"key":"B","text":"粘性"},{"key":"C","text":"温度"}],"answer":"B","analysis":"提示：粘性→气流分子间内摩擦力\n解析：摩擦阻力是飞机在飞行过程中与大气之间由于粘性而产生的阻力。大气的粘性是指气流分子之间的内摩擦力，它使得气流在飞机表面产生切向应力，从而形成摩擦阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0896","type":"single","difficulty":1,"stem":"飞机上产生的摩擦阻力与什么因素有关?","options":[{"key":"A","text":"与大气可压缩性有关"},{"key":"B","text":"与大气的粘性、飞机表面状况及周围气流接触的飞机表面面积有关"},{"key":"C","text":"仅与大气的温度有关"}],"answer":"B","analysis":"提示：摩擦阻力→大气粘性+粗糙表面+接触面\n解析：摩擦阻力是飞机在飞行过程中与大气之间由于粘性而产生的阻力。它的大小主要取决于大气的粘性、飞机表面的粗糙度以及飞机与气流接触的表面积。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0897","type":"single","difficulty":1,"stem":"飞机上的总空气动力的作用线与飞机纵轴的交点称为（）。","options":[{"key":"A","text":"全机重心"},{"key":"B","text":"全机的压力中心"},{"key":"C","text":"机体坐标的原点"}],"answer":"B","analysis":"提示：动力找压力\n解析：飞机上的总空气动力的作用线与飞机纵轴的交点称为全机的压力中心，直接关系到飞机的稳定性和操纵性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0898","type":"single","difficulty":1,"stem":"飞机升力的大小与空速的关系是（）。","options":[{"key":"A","text":"与空速成正比"},{"key":"B","text":"与空速无关"},{"key":"C","text":"与空速的平方成正比"}],"answer":"C","analysis":"提示：空速带平方²\n解析：L=1/2ρv²SCL，即:升力L=1/2*空气密度*速度的平方*机翼面积*升力系数。飞机升力的大小与空速的关系是与空速的平方成正比。机翼的升力来自于流过其上下表面气流的速度差，空速决定了这一速度差，从而影响升力的大小。空速越大，升力也随之增大，且增大的比例与空速的平方成正比。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0899","type":"single","difficulty":1,"stem":"飞机升阻比值的大小主要随下列哪项因素变化（）。","options":[{"key":"A","text":"飞行速度"},{"key":"B","text":"飞行迎角"},{"key":"C","text":"机翼面积"}],"answer":"B","analysis":"提示：升阻比→迎角\n解析：定义：升阻比是相同迎角下，升力系数与阻力系数之比。影响因素：影响升力系数主要因素：迎角、翼型等，影响阻力系数主要因素：迎角、外形粗糙度等两者叠加考虑，对升阻比影响最大的因素就是“迎角”","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0900","type":"single","difficulty":1,"stem":"飞机在飞行时，升力方向是（）。","options":[{"key":"A","text":"与相对气流方向垂直"},{"key":"B","text":"与地面垂直"},{"key":"C","text":"与翼弦垂直"}],"answer":"A","analysis":"提示：升力与气流垂直\n解析：因为升力由空气作用产生，不管方向如何，选项只与气流相关，所以直接选与气流相关的选项。另外，根据气动力是合力这个知识点，该合力垂直于相对气流方向的分量就是升力，平行于相对气流的分量是阻力；可总结：升力与气流方向垂直，阻力与气流方向平行","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0901","type":"single","difficulty":1,"stem":"飞机在平飞时载重量越大其失速速度（）。","options":[{"key":"A","text":"越大"},{"key":"B","text":"角愈大"},{"key":"C","text":"与重量无关"}],"answer":"A","analysis":"提示：载重越大，失速越大\n解析：飞机平飞载重量越大，失速速度越大。因为重量增加需更大升力，对应更大速度才不失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0902","type":"single","difficulty":1,"stem":"飞行中操作扰流板伸出（）。","options":[{"key":"A","text":"增加机翼上翼面的面积以提高升力"},{"key":"B","text":"阻挡气流的流动，增大阻力"},{"key":"C","text":"增加飞机抬头力矩，辅助飞机爬升"}],"answer":"B","analysis":"提示：扰流板→扰动的气流 增阻力\n解析：我们从图片中也可以看出，无论是副翼、襟翼还是缝翼，它们展开后，都是顺着气流方向，保持着翼面的流线型。而扰流板，顾名思义，它向上竖起后，会直接破坏机翼的流线型，扰乱上表面的气流，从而快速减小升力、大幅增加阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0903","type":"single","difficulty":1,"stem":"关于动压和静压的方向，以下哪一个是正确的?","options":[{"key":"A","text":"动压和静压的方向都是与运动的方向一致"},{"key":"B","text":"动压和静压都作用在任意方向"},{"key":"C","text":"动压作用在流体的流动方向，静压作用在任意方向"}],"answer":"C","analysis":"提示：动压流体 静压任意\n解析：动压作用在流体流动方向，青静压作用在任意方向。动压与流体流动相关，静压则不受方向限制。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0904","type":"single","difficulty":1,"stem":"关于升阻比下列哪个说法正确?","options":[{"key":"A","text":"在最大升力系数时阻力一定最小"},{"key":"B","text":"最大升阻比时，一定是达到临界攻角"},{"key":"C","text":"升阻比随迎角的改变而改变"}],"answer":"C","analysis":"提示：迎角改变升阻比\n解析：升阻比随迎角改变而改变。不同迎角下升力和阻力变化，从而影响升阻比的大小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0905","type":"single","difficulty":1,"stem":"合理布局飞机结构的位置，是为了减小（）。","options":[{"key":"A","text":"摩擦阻力"},{"key":"B","text":"压差阻力"},{"key":"C","text":"干扰阻力"}],"answer":"C","analysis":"提示：结构合理，抗干扰（散部件整包也为了减少干扰阻力）\n解析：合理布局飞机结构位置主要是为减小干扰阻力。避免部件间气流相互干扰，从而降低阻力，提高飞行效率。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0906","type":"single","difficulty":1,"stem":"机翼1/4弦线与垂直机身中心线的直线之间的夹角称为机翼的（）。","options":[{"key":"A","text":"安装角"},{"key":"B","text":"上反角"},{"key":"C","text":"后掠角"}],"answer":"C","analysis":"提示：1/4后掠角\n解析：一般指飞机机翼1/4弦线与垂直机身中心线的直线（或称为机身纵轴垂线）（或称为横轴）之间的夹角，表征机翼向后倾斜的程度。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0907","type":"single","difficulty":1,"stem":"机翼的安装角是（）。","options":[{"key":"A","text":"翼弦与相对气流方向的夹角"},{"key":"B","text":"翼弦与机身纵轴之间所夹锐角"},{"key":"C","text":"翼弦与水平面之间所夹的锐角"}],"answer":"B","analysis":"提示：安装角安在机身上\n解析：机翼安装角指翼弦与机身纵轴之间所夹锐角。合适的安装角可保证飞机的飞行姿态和性能。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0908","type":"single","difficulty":1,"stem":"机翼的弦线与相对气流方向之间的夹角称为（）。","options":[{"key":"A","text":"机翼的安装角"},{"key":"B","text":"机翼的上反角"},{"key":"C","text":"迎角"}],"answer":"C","analysis":"提示：线与气流对迎角\n解析：迎角（又称攻角，常用符号α表示）是指机翼翼弦线（机翼剖面前缘与后缘的连线）与相对气流方向（空气相对于机翼的流动方向）之间的夹角。通过图片我们可以看出，迎角定义的是“ 机翼与气流之间的关系”不是飞机机身与水平线的夹角，那个是俯仰角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0909","type":"single","difficulty":1,"stem":"机翼的压力中心（）。","options":[{"key":"A","text":"迎角改变时升力增量作用线与翼弦的交点"},{"key":"B","text":"翼弦与机翼空气动力作用线的交点"},{"key":"C","text":"翼弦与最大厚度线的交点"}],"answer":"B","analysis":"提示：翼弦与动力线交点，压力对动力\n解析：机翼的压力中心是翼弦与机翼空气动力作用线的交点。它随迎角等因素变化而改变位置。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0910","type":"single","difficulty":1,"stem":"机翼的展弦比是（）。","options":[{"key":"A","text":"展长与机翼最大厚度之比"},{"key":"B","text":"展长与翼尖弦长之比"},{"key":"C","text":"展长与平均几何弦长之比"}],"answer":"C","analysis":"提示：展旋比，有几何\n解析：展弦比是展长与平均几何弦长之比。它影响机翼的气动特性，展弦比大，诱导阻力小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0911","type":"single","difficulty":1,"stem":"机翼空气动力受力最大的是（）。","options":[{"key":"A","text":"机翼上表面压力"},{"key":"B","text":"机翼下表面压力"},{"key":"C","text":"机翼上表面负压"}],"answer":"C","analysis":"提示：机翼上表面负压（上负）\n解析：机翼上表面负压产生的吸力通常较大，是机翼空气动力受力最大的部分，对产生升力起关键作用。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0912","type":"single","difficulty":1,"stem":"机翼升力系数与哪些因素有关?","options":[{"key":"A","text":"仅与翼剖面形状有关"},{"key":"B","text":"与翼剖面形状和攻角有关"},{"key":"C","text":"仅与攻角有关"}],"answer":"B","analysis":"提示：升力系数，形状和攻角有关 （仅是绝对字，不能选）\n解析：机翼升力系数与翼剖面形状和攻角有关。不同翼型、不同攻角都会导致升力系数变化。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0913","type":"single","difficulty":1,"stem":"计算动压时需要哪些数据?","options":[{"key":"A","text":"大气压力和速度"},{"key":"B","text":"空气密度和阻力"},{"key":"C","text":"空气密度和速度"}],"answer":"C","analysis":"提示：计算动压，要双度\n解析：计算动压需空气密度和速度。P=1/2ρv²，ρ空气密度v速度，用于衡量流体的动能。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0914","type":"single","difficulty":1,"stem":"减少飞机摩擦阻力的措施是（）。","options":[{"key":"A","text":"保持飞机表面光洁度"},{"key":"B","text":"减小迎风面积"},{"key":"C","text":"增大后掠角"}],"answer":"A","analysis":"提示：摩擦阻力→大气粘性+粗糙表面+接触面\n解析：保持飞机表面光洁度能减小空气与表面的摩擦，从而减少摩擦阻力。减小迎风面积主要影响压差阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0915","type":"single","difficulty":1,"stem":"减小飞机外形的迎风面积，目的是为了减小飞机的（）。","options":[{"key":"A","text":"摩擦阻力"},{"key":"B","text":"压差阻力"},{"key":"C","text":"诱导阻力"}],"answer":"B","analysis":"提示：压差阻力→迎风面积 （面积压差，结构整包干扰）\n解析：减小迎风面积主要是为了减小压差阻力。迎风面积小，前后压力差减小，压差阻力随之减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0916","type":"single","difficulty":1,"stem":"减小干扰阻力的主要措施是（）。","options":[{"key":"A","text":"把机翼表面做的很光滑"},{"key":"B","text":"部件连接处采取整流措施"},{"key":"C","text":"把暴露的部件做成流线型"}],"answer":"B","analysis":"提示：面积压差，结构整包干扰（问题对答案，措施对措施）\n解析：部件连接处采取整流措施，能使气流更顺畅通过，减小干扰，从而降低干扰阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0917","type":"single","difficulty":1,"stem":"具有后掠角的飞机有侧滑角时，会产生（）。","options":[{"key":"A","text":"滚转力矩"},{"key":"B","text":"俯仰力矩"},{"key":"C","text":"不产生任何力矩"}],"answer":"A","analysis":"提示：后侧滚，反侧偏\n解析：具有后掠角的机翼发生侧滑时，两侧机翼的相对气流和升力分布不同，会产生左右升力差，从而形成滚转力矩，使飞机出现滚转趋势。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0918","type":"single","difficulty":1,"stem":"具有上反角的飞机有侧滑角时，会产生（）。","options":[{"key":"A","text":"偏航力矩"},{"key":"B","text":"俯仰力矩"},{"key":"C","text":"不产生任何力矩"}],"answer":"A","analysis":"提示：后侧滚，反侧偏\n解析：上反角是指机翼的后缘相对于机身底面向上倾斜的设计。在飞机侧滑角度存在时，上反角会导致飞机产生偏航力矩。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0919","type":"single","difficulty":1,"stem":"利用风可以得到飞机气动参数，其基本依据是（）。","options":[{"key":"A","text":"连续性假设"},{"key":"B","text":"相对性原理"},{"key":"C","text":"牛顿定理"}],"answer":"B","analysis":"提示：风和飞机，相对原理\n解析：相对性原理是利用风获取飞机气动参数的基本依据。它指出在不同的惯性参考系中，物理规律具有相同形式，通过考虑相对运动来分析飞机与风的关系。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0920","type":"single","difficulty":1,"stem":"流管中空气的动压（）。","options":[{"key":"A","text":"仅与空气密度成正比"},{"key":"B","text":"与空气速度和空气密度成正比"},{"key":"C","text":"与空气速度平方和空气密度成正比"}],"answer":"C","analysis":"提示：P=1/2ρv²，带平方\n解析：流管中空气的动压与空气速度的平方和空气密度成正比。速度越大、密度越大，动压越大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0921","type":"single","difficulty":1,"stem":"流体的伯努利定理（）。","options":[{"key":"A","text":"适用于不可压缩的理想流体"},{"key":"B","text":"适用于粘性的理想流体"},{"key":"C","text":"适用于不可压缩的粘性流体"}],"answer":"A","analysis":"提示：伯努利→理想、不可压缩、与外界无能量变换\n解析：体的伯努利定理适用于不可压缩的理想流体。在这种情况下，可以通过压力、速度和高度的关系来分析流体的流动特性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0922","type":"single","difficulty":1,"stem":"流体的连续性方程（）。","options":[{"key":"A","text":"只适用于理想流体"},{"key":"B","text":"适用于可压缩和不可压缩流体的稳定管流"},{"key":"C","text":"只适用于不可压缩流体的稳定管流"}],"answer":"B","analysis":"提示：连续性方程→可压缩+不可压缩\n解析：连续性方程的本质是质量守恒定律在流体流动中的应用。其一般形式既适用于可压缩流体（密度ρ变化），也适用于不可压缩流体（密度ρ为常数）。它不仅适用于稳态流动，也适用于非稳态流动；不仅适用于管流，也适用于任意三维流场。B包含在其中，故B为正确选项。这题关于流体的连续性方程适用于哪种流体，国内教材《工程流体力学》（例如，闻德荪主编，高等教育出版社，普通高等教育 “十一五” 国家级规划教材）为例，书中明确指出：连续性方程是基于质量守恒定律推导的，它适用于任何连续介质流体，无论是理想流体还是实际流体，可压缩流体还是不可压缩流体，只要流动是连续的，连续性方程就成立。对于稳定管流，其表达式可根据流体压缩性进一步简化。国外White、Batchelor 等权威教材均指出，连续性方程是质量守恒对“任何连续介质流体”的普适表述，既不受“不可压缩”限制，也不受“理想（无粘）”限制，只要流动是稳定的管流即可。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0923","type":"single","difficulty":1,"stem":"流体在管道中以稳定低度流动时，如果管道由粗变细，则流体的流速（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"保持不变"}],"answer":"A","analysis":"提示：管道截面积↓，速度↑\n解析：根据连续性方程：A1V1=A2V2稳定低速流动时，可将流体近似视为不可压缩流体。管道由粗变细，横截面积减小，为保持单位时间内流过的流量不变，流速就会增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0924","type":"single","difficulty":1,"stem":"没有保护好飞机表面的光洁度，将增加飞机的哪种阻力?","options":[{"key":"A","text":"压差阻力"},{"key":"B","text":"摩擦阻力"},{"key":"C","text":"干扰阻力"}],"answer":"B","analysis":"提示：摩擦阻力→大气粘性+粗糙表面+接触面\n解析：飞机表面不光洁，例如出现污物、划痕、凸起或粗糙，会增大空气与飞机表面之间的摩擦，从而增加摩擦阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0925","type":"single","difficulty":1,"stem":"气流产生下洗是由于（）。","options":[{"key":"A","text":"分离点后出现旋涡的影响"},{"key":"B","text":"转捩点后紊流的影响"},{"key":"C","text":"机翼上下表面存在压力差的影响"}],"answer":"C","analysis":"提示：下洗→上下表面压力差\n解析：气流产生下洗是由于机翼上下表面存在压力差。上表面压力低，下表面压力高，导致气流从下表面绕过翼尖向上表面流动，形成下洗。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0926","type":"single","difficulty":1,"stem":"气流沿机翼表面附面层类型的变化是（）。","options":[{"key":"A","text":"可由紊流变为层流"},{"key":"B","text":"可由层流变为紊流"},{"key":"C","text":"一般不发生变化"}],"answer":"B","analysis":"提示：层流变紊流\n解析：气流沿机翼表面流动，附面层类型可由层流变为紊流。通常在前端是层流，随着在翼表面流动长度增加，会变为紊流。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0927","type":"single","difficulty":1,"stem":"气流沿机翼表面流动，影响由层流变为紊流的原因不包括（）。","options":[{"key":"A","text":"空气的流速"},{"key":"B","text":"在机翼表面的流动长度"},{"key":"C","text":"空气比重"}],"answer":"C","analysis":"提示：选错的。空气比重×\n解析：·首先，机翼表面的气流流速快的时候，这时气流扰动会更剧烈，导致层流无法再在机翼前段平稳维持，会更早转变为紊流因此，流速对“层流变为紊流”有影响·另外，气流在机翼表面流动距离越长，受到的各种微小扰动持续累计，越易转变为紊流。·空气比重 = 空气密度 × 重力加速度，本题与空气密度相关，与空气比重无关。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0928","type":"single","difficulty":1,"stem":"气体的伯努利定理是哪个定律在空气流动过程中的应用?","options":[{"key":"A","text":"能量守恒定律"},{"key":"B","text":"牛顿第一定律"},{"key":"C","text":"质量守恒定律"}],"answer":"A","analysis":"提示：伯努利→能量守恒 连续性方程→质量守恒 （努力能量，连续质量）\n解析：气体的伯努利定理是能量守恒定律在空气流动过程中的应用，表明在流动中，总能量保持不。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0929","type":"single","difficulty":1,"stem":"气体的连续性定理是哪个定律在空气流动过程中的应用?","options":[{"key":"A","text":"能量守恒定律"},{"key":"B","text":"牛顿第一定律"},{"key":"C","text":"质量守恒定律"}],"answer":"C","analysis":"提示：伯努利→能量守恒 连续性方程→质量守恒 （努力能量，连续质量）\n解析：气体的连续性定理是质量守恒定律在空气流动过程中的应用，确保流体流动时质量不会凭空产生或消失。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0930","type":"single","difficulty":1,"stem":"气体的压力P密度ρ温度T三者之间的变化关系是(R为理想气体常数）（ ）。","options":[{"key":"A","text":"T=PRρ"},{"key":"B","text":"P=Rρ/T"},{"key":"C","text":"P=RρT"}],"answer":"C","analysis":"提示：P=RρT （左边压力，右边三个并列相乘，都与压力成正比）\n解析：根据理想气体状态方程PV=nRT(其中n为物质的量，V为体积)，变形可得P=nRT/V，而密度ρ=n/V，所以P=RρT。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0931","type":"single","difficulty":1,"stem":"随着飞行速度的提高下列关于阻力的哪种说法是正确的?","options":[{"key":"A","text":"诱导阻力增大，废阻力增大"},{"key":"B","text":"诱导阻力减小，废阻力减小"},{"key":"C","text":"诱导阻力减小，废阻力增大"}],"answer":"C","analysis":"提示：快飞，诱小，废大\n解析：总阻力=诱导阻力+废阻力（蒙皮摩擦阻力+压差阻力+干扰阻力)增速的时候，不管是低速加速还是高速加速 诱导阻力下降， 废阻力全涨（诱导阻力下降的原因：飞得越快，需要迎角越小，翼尖涡流越弱，诱导阻力越小。）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0932","type":"single","difficulty":1,"stem":"为了飞行安全，飞机飞行时的升力系数和迎角一般为（）。","options":[{"key":"A","text":"最大升力系数和临界迎角最大"},{"key":"B","text":"最大升力系数和小于临界迎角的迎角限定值"},{"key":"C","text":"小于最大升力系数和临界迎角的两个限定值"}],"answer":"C","analysis":"提示：迎角<小余两个限定值\n解析：为保证飞行安全，飞机飞行时的升力系数和迎角通常小于最大升力系数和临界迎角。超过这两个限定值，飞机可能进入危险状态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0933","type":"single","difficulty":1,"stem":"下列关于动压的哪种说法是正确的?","options":[{"key":"A","text":"总压与静压之和"},{"key":"B","text":"总压与静压之差"},{"key":"C","text":"动压和速度成正比"}],"answer":"B","analysis":"提示：总压=动压 十 静压\n解析：在低速、可近似视为不可压缩的气流中，动压＝总压－静压","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0934","type":"single","difficulty":1,"stem":"下列关于升阻比的哪种说法是不正确的?","options":[{"key":"A","text":"升力系数达到最大时，升阻比也达到最大"},{"key":"B","text":"升力和阻力之比升阻比达到最大之前，随迎角增加"},{"key":"C","text":"升阻比成线性增加"}],"answer":"A","analysis":"提示：选错的。升阻比两个最大×\n解析：升力系数达到最大时，并不意味着升阻比也达到最大。升阻比是升力与阻力的比值它随迎角的增加而增加，但当迎角增加到一定程度后，阻力会迅速增加，导致升阻比下降。因此，升阻比达到最大值时的迎角通常小于升力系数达到最大值时的迎角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0935","type":"single","difficulty":1,"stem":"下列关于压差阻力哪种说法是正确的?","options":[{"key":"A","text":"物体的最大迎风面积越大，压差阻力越小"},{"key":"B","text":"物体形状越接近流线型，压差阻力越大"},{"key":"C","text":"物体的最大迎风面积越大，压差阻力越大"}],"answer":"C","analysis":"提示：压差阻力→迎风面积\n解析：压差阻力主要来自物体前后压力差。物体迎风面积越大，气流分离和尾流区通常越明显，前后压力差造成的阻力也越大。（物体越接近流线型，气流分离越小，压差阻力越小）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0936","type":"single","difficulty":1,"stem":"下列关于诱导阻力的哪种说法是正确的?","options":[{"key":"A","text":"增大机翼的展弦比可以减小诱导阻力"},{"key":"B","text":"把暴露在气流中的所有部件和零件都做成流线型，可以减小诱导阻力"},{"key":"C","text":"在飞机各部件之间加装整流包皮，可以减小诱导阻力"}],"answer":"A","analysis":"提示：诱导阻→增大展弦比，减小诱导阻力\n解析：增大机翼的展弦比可以减小诱导阻力。展弦比增大，机翼端部涡的强度减弱，诱导阻力减小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0937","type":"single","difficulty":1,"stem":"下列关于阻力的哪种说法是正确的?","options":[{"key":"A","text":"干扰阻力是由于气流的下洗而引起的"},{"key":"B","text":"在飞机各部件之间加装整流包皮可以减小诱导阻力"},{"key":"C","text":"干扰阻力是飞机各部件之间由于气流相互干扰而产生的一种额外阻力"}],"answer":"C","analysis":"提示：干扰→互相干扰→额外阻力，结构合理，抗干扰（散部件整包也为了减少干扰阻力）\n解析：干扰阻力是飞机各部件之间由于气流相互干扰而产生的一种额外阻力。而诱导阻力是由于机翼产生升力时伴随的下洗现象引起的;在飞机各部件之间加装整流包皮主要是减小干扰阻力，不是诱导阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0938","type":"single","difficulty":1,"stem":"下列哪项对飞机阻力大小影响不大?","options":[{"key":"A","text":"飞行速度、空气密度、机翼面积"},{"key":"B","text":"飞机的翼型和平面形状"},{"key":"C","text":"飞机的安装角和上反角"}],"answer":"C","analysis":"提示：飞机阻力→角没有面的影响大\n解析：飞机的安装角和上反角对飞机阻力大小影响相对较小。飞行速度、空气密度、机翼面积以及飞机的翼型和平面形状等因素对阻力大小的影响更为显著。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0939","type":"single","difficulty":1,"stem":"下列哪项与飞机诱导阻力大小无关?","options":[{"key":"A","text":"机翼的平面形状"},{"key":"B","text":"机翼的翼型"},{"key":"C","text":"机翼的根尖比"}],"answer":"B","analysis":"提示：诱导阻→增大展弦比，减小诱导阻力，与翼型无关\n解析：机翼的平面形状和根尖比会影响诱导阻力大小，而机翼的翼型对诱导阻力大小影响不大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0940","type":"single","difficulty":1,"stem":"下列叙述与伯努利定理无关的是（）。","options":[{"key":"A","text":"流体流速大的地方压力小，流速小的地方压力大"},{"key":"B","text":"气流沿流管稳定流动过程中，气流的动压和静压之和等于常数"},{"key":"C","text":"气流低速流动时，流速与流管横截面积成正比"}],"answer":"C","analysis":"提示：低速，流速与和横截面积成反比。 选错的。成正比×\n解析：伯努利定理指出，流体流速大的地方压力小，流速小的地方压力大，同时气流沿流管稳定流动过程中，气流的动压和静压之和等于常数。而“气流低速流动时，流速与流管横截面积成正比”这一说法与伯努利定理无关。根据连续性原理，当流体不可压缩时，流速与流管横截面积成反比。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0941","type":"single","difficulty":1,"stem":"下列正确的是（）。","options":[{"key":"A","text":"飞机的升阻比越大，飞机的空气动力特性越差"},{"key":"B","text":"飞机的升阻比越小，飞机的空气动力特性越好"},{"key":"C","text":"飞机的升阻比越大，飞机的空气动力特性越好"}],"answer":"C","analysis":"提示：升阻比大，动力好（其他两个选项一个意思，排除法选这个）\n解析：飞机的升阻比越大，:表示在产生相同升力的情况下，阻力越小，飞机的空气动力特性就越好。升阻比是衡量飞机空气动力性能的一个重要指标。升阻比大的飞机，在飞行中能够更有效地利用空气动力，提高飞行效率，降低燃油消耗等。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0942","type":"single","difficulty":1,"stem":"一定体积的容器中，空气压力（）。","options":[{"key":"A","text":"与空气密度和空气温度乘积成正比"},{"key":"B","text":"与空气密度和空气温度乘积成反比"},{"key":"C","text":"与空气密度和空气绝对温度乘积成正比"}],"answer":"C","analysis":"提示：P=RρT （左边压力，右边三个并列相乘，都与压力成正比） T代表绝对温度\n解析：理想气体状态方程P=RρT。其中，P代表压力，ρ代表密度，R是理想气体常数，T代表绝对温度。因此与空气密度和空气绝对温度乘积成正比。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0943","type":"single","difficulty":1,"stem":"翼型的最大厚度与弦长的比值称为（）。","options":[{"key":"A","text":"相对弯度"},{"key":"B","text":"相对厚度"},{"key":"C","text":"最大弯度"}],"answer":"B","analysis":"提示：问题对答案，最大厚度对相对厚度\n解析：翼型的最大厚度与弦长的比值称为相对厚度。相对厚度较大的翼型在低速时能产生较大升力，但高速时阻力也较大;相对厚度较小的翼型则相反。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0944","type":"single","difficulty":1,"stem":"翼型的最大弯度与弦长的比值称为（）。","options":[{"key":"A","text":"相对弯度"},{"key":"B","text":"相对厚度"},{"key":"C","text":"最大厚度"}],"answer":"A","analysis":"提示：问题对答案，最大弯度对相对弯度\n解析：翼型的最大弯度与弦长的比值称为相对弯度。相对弯度大的翼型升力系数较大，但阻力也可能相应增加;相对弯度小的翼型则升力系数较小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0945","type":"single","difficulty":1,"stem":"影响翼型性能的最主要的参数是（）。","options":[{"key":"A","text":"前缘和后缘"},{"key":"B","text":"翼型的厚度和弯度"},{"key":"C","text":"弯度和前缘"}],"answer":"B","analysis":"提示：翼型→厚度弯度\n解析：影响翼型性能的最主要参数是翼型的厚度和弯度。厚度影响翼型的阻力和强度，弯度则主要影响升力的产生和分布。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0946","type":"single","difficulty":1,"stem":"有些飞机的翼尖部位安装了翼梢小翼，它的功用是（）。","options":[{"key":"A","text":"减小摩擦阻力"},{"key":"B","text":"减小压差阻力"},{"key":"C","text":"减小诱导阻力"}],"answer":"C","analysis":"提示：诱导阻→升力和翼展长度和翼尖 干扰阻→ 部件平整度\n解析：翼尖安装翼梢小翼的功用是减小诱导阻力。它改变了翼尖处的气流流动，减少翼尖涡的强度。翼尖涡导致诱导阻力产生，翼梢小翼通过阻挡上下表面气流的横向流动，降低涡的强度，从而减小诱导阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0947","type":"single","difficulty":1,"stem":"在机翼表面附面层由层流状态转变为紊流状态的转捩点的位置（）。","options":[{"key":"A","text":"将随着飞行速度的提高而后移"},{"key":"B","text":"将随着飞行速度的提高而前移"},{"key":"C","text":"在飞行M数小于一定值时保持不变"}],"answer":"B","analysis":"提示：捩(liè) 点前移\n解析：飞行速度提高，气流受到的扰动增强，转捩点将随着飞行速度的提高而前移。速度提高，气流的剪切力增大，更容易使层流转变为紊流，转换点向前移动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0948","type":"single","difficulty":1,"stem":"在相同飞行速度和迎角情况下，翼面不清洁或前缘结冰的机翼升力（）。","options":[{"key":"A","text":"大于基本翼型升力"},{"key":"B","text":"等于基本翼型升力"},{"key":"C","text":"小于基本翼型升力"}],"answer":"C","analysis":"提示：小于 不清洁，升力小\n解析：翼面不清洁或结冰会破坏气流的平滑流动，升力小于基本翼型升力。不清洁或结冰导致气流分离提前，升力系数减小，升力降低。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0949","type":"single","difficulty":1,"stem":"在翼型后部产生涡流，会造成（）。","options":[{"key":"A","text":"摩擦阻力增加"},{"key":"B","text":"压差阻力增加"},{"key":"C","text":"升力增加"}],"answer":"B","analysis":"提示：涡流压差（涡轮增压 ）\n解析：翼型后部产生涡流会导致气流分离，使前后压力差增大，从而造成压差阻力增加。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0950","type":"single","difficulty":1,"stem":"增大飞机机翼的展弦比，目的是减小飞机的（）。","options":[{"key":"A","text":"摩擦阻力"},{"key":"B","text":"压差阻力"},{"key":"C","text":"诱导阻力"}],"answer":"C","analysis":"提示：诱导阻→增大展弦比，减小诱导阻力\n解析：展弦比增大，翼尖涡强度减弱，诱导阻力减小。增大机翼展弦比可减小诱导阻力提高飞机的飞行效率。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0951","type":"single","difficulty":1,"stem":"增大翼型最大升力系数的两个因素是（）。","options":[{"key":"A","text":"厚度和机翼面积"},{"key":"B","text":"弯度和翼展"},{"key":"C","text":"厚度和弯度"}],"answer":"C","analysis":"提示：翼型→厚度弯度\n解析：增大翼型的厚度和弯度能增加翼型的最大升力系数。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0952","type":"single","difficulty":1,"stem":"常规布局飞机的主要舵面指的是（）。","options":[{"key":"A","text":"升降舵、方向舵、襟翼"},{"key":"B","text":"方向舵、襟翼、缝翼"},{"key":"C","text":"升降舵、方向舵、副翼"}],"answer":"C","analysis":"提示：升方副\n解析：常规布局飞机的主要舵面是升降舵、方向舵、副翼，用于控制飞机的姿态和飞行方向。升降舵控制飞机的俯仰，方向舵控制偏航，副翼控制滚转。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0953","type":"single","difficulty":1,"stem":"超音速气流经过收缩管道后（）。","options":[{"key":"A","text":"速度增加，压强增大"},{"key":"B","text":"速度增加，压强下降"},{"key":"C","text":"速度降低，压强增大"}],"answer":"C","analysis":"提示：亚音速（伯努利√） →速度大压强小（窄处高速低压） 超音速（与伯努利相反） →速度低压强大（窄处低速高压）\n解析：超音速气流经过收缩管道后，其速度会降低，压强则增大。这是由于在超音速流动中，气体的可压缩性成为主导因素。当高速气流进入收缩截面时，流管面积减小，气体分子被剧烈压缩，密度显著增加。这一过程消耗了气流的动能，使其速度下降，同时将动能转化为压力能，导致压强升高。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0954","type":"single","difficulty":1,"stem":"打开后缘襟翼既能增大机翼切面的弯曲度，又能增加机翼的面积，继而提高飞机的升力系数，这种襟翼被叫做（）。","options":[{"key":"A","text":"分裂式襟翼"},{"key":"B","text":"简单式襟翼"},{"key":"C","text":"后退式襟翼"}],"answer":"C","analysis":"提示：后退\n解析：后退式襟翼放下时会向后移动，既增大机翼弯度，也增大有效翼面积，从而提高升力系数。简单式襟翼和分裂式襟翼放下时主要改变翼型弯度，不能像后退式襟翼那样明显增加翼面积。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0955","type":"single","difficulty":1,"stem":"当后缘襟翼放下时，下述哪项说法正确?","options":[{"key":"A","text":"只增大升力"},{"key":"B","text":"只增大阻力"},{"key":"C","text":"既增大升力又增大阻力"}],"answer":"C","analysis":"提示：既又\n解析：首先，后缘襟翼放下后，机翼弯度增大，通常使升力系数增大；其次，后缘襟翼放下后，改变了机翼外形，使气流偏转、压差阻力增大； 襟翼偏角较大时，气流分离还会进一步增加阻力。因此，襟翼放下通常既增大升力，也增大阻力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0956","type":"single","difficulty":1,"stem":"对飞机方向稳定性影响最大的是（）。","options":[{"key":"A","text":"飞机的最大迎风面积"},{"key":"B","text":"水平尾翼"},{"key":"C","text":"垂直尾翼"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：垂直尾翼对飞机方向稳定性影响最大，能有效抵抗侧风等干扰保持方向稳定。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0957","type":"single","difficulty":1,"stem":"对于进行定常飞行的飞机来说（）。","options":[{"key":"A","text":"升力一定等于重力"},{"key":"B","text":"作用在飞机上的外载荷必定是平衡力系"},{"key":"C","text":"发动机推力一定等于阻力"}],"answer":"B","analysis":"提示：定常要平衡 （另两个答案也对，但是不全面，只有B全面）\n解析：在我国高校教材里，定常飞行为“匀速直线运动”。 匀速直线“全面平衡”，虽然AC也对，但不够全面。 B则完全表明了定常飞行的核心：“平衡力系”=力的平衡 + 力矩的平衡","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0958","type":"single","difficulty":1,"stem":"对于具有静稳定性的飞机，向左侧滑时其机头会（）。","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"向左转"},{"key":"C","text":"向右转"}],"answer":"B","analysis":"提示：稳定想修正，同向修正，逆向反转\n解析：侧滑角是指相对气流的方向和飞行器对称面之间的夹角，用 β 表示。风从左侧来，叫“左侧滑”。我们从图中可以看出，“左侧滑”时机头偏右，这时候静稳定性想让飞机机头正回来，就向左转。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0959","type":"single","difficulty":1,"stem":"对于正常布局的飞机，下列叙述正确的是（）。","options":[{"key":"A","text":"飞机全机的焦点在机翼焦点的前面"},{"key":"B","text":"飞机全机的焦点在机翼焦点的后面"},{"key":"C","text":"飞机全机的焦点和机翼焦点始终重合"}],"answer":"B","analysis":"提示：重心→机翼焦点→飞机焦点（重前焦后）\n解析：正常布局的飞机，全机焦点通常在机翼焦点的后面。飞机重心在焦点之前，这样的布局能保证飞机具有静稳定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0960","type":"single","difficulty":1,"stem":"飞机的方向阻尼力矩主要由（）。","options":[{"key":"A","text":"水平尾翼产生"},{"key":"B","text":"垂直尾翼产生"},{"key":"C","text":"机翼产生"}],"answer":"B","analysis":"提示：横机，纵水，方垂直\n解析：飞机的航向阻尼力矩是指绕立轴偏航阻尼。当飞机偏航摆动时，机头左右偏转。机头向左/右偏，垂尾向左/右运动，形成侧向气动力差。垂尾侧向力差形成反向力矩，阻碍偏航摆动运动，就是航向（方向）阻尼力矩，主要由垂直尾翼提供。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0961","type":"single","difficulty":1,"stem":"飞机的航向稳定性是指飞机绕下列哪个轴线的稳定性?","options":[{"key":"A","text":"横轴"},{"key":"B","text":"立轴"},{"key":"C","text":"纵轴"}],"answer":"B","analysis":"提示：航向立，纵向横，横向纵\n解析：航向稳定性定义：飞机受到扰动以致方向平衡状态遭到破坏,而在扰动消失后,飞机如能趋向于恢复原来的平衡状态,就具有航向稳定性。简易理解：飞机绕立轴的稳定性 =（方向平衡） 航向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0962","type":"single","difficulty":1,"stem":"飞机的横向和航向稳定性之间（）。","options":[{"key":"A","text":"互相独立"},{"key":"B","text":"必须匹配适当"},{"key":"C","text":"横向稳定性好，航向稳定性就差"}],"answer":"B","analysis":"提示：横航匹配，纵航无关。\n解析：飞机的横向和航向稳定性之间必须匹配适当。如果两者匹配不当，会影响飞机的飞行品质和操纵性能。横向稳定性过强而航向稳定性不足，可能导致飞机难以转弯；反之，若航向稳定性过强而横向稳定性不足，飞机可能在转弯时出现不稳定的情况。只有两者匹配适当，飞机才能在飞行中保持良好的稳定性和操纵性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0963","type":"single","difficulty":1,"stem":"飞机的横向稳定性是指飞机绕下列哪个轴线的稳定性?","options":[{"key":"A","text":"横轴"},{"key":"B","text":"纵轴"},{"key":"C","text":"偏航轴"}],"answer":"B","analysis":"提示：航向立，纵向横，横向纵\n解析：横向稳定性定义：飞机受扰动以致横侧向平衡状态遭到破坏,而在扰动消失后,如飞机自身产生一个恢复力矩,使飞机趋向于恢复原来的平衡状态,就具有横侧向稳定性;反之,就没有横侧向稳定性。简易理解：飞机绕纵轴的稳定性 = 横向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0964","type":"single","difficulty":1,"stem":"飞机的横向阻尼力矩主要由（）。","options":[{"key":"A","text":"水平尾翼产生"},{"key":"B","text":"垂直尾翼产生"},{"key":"C","text":"机翼产生"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：飞机的横向阻尼力矩是指绕纵轴滚转阻尼。 当飞机滚转时，机翼一侧高一侧低。 下沉机翼相对来流速度增大、有效迎角↑升力↑；上扬机翼迎角↓、升力↓。 左右升力差形成反向力矩，阻碍滚转运动，就是横向阻尼力矩，主要由机翼提供。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0965","type":"single","difficulty":1,"stem":"飞机的爬升角是指（）。","options":[{"key":"A","text":"飞机上升轨迹与水平线之间的夹角"},{"key":"B","text":"飞机立轴与水平线之间的夹角"},{"key":"C","text":"飞机横轴与水平线之间的夹角"}],"answer":"A","analysis":"提示：问题对答案，爬升找上升\n解析：飞机的爬升角是指飞机上升轨迹与水平线之间的夹角。爬升角反映了飞机在爬升过程中上升轨迹的陡峭程度。爬升角越大，表明飞机的爬升越陡峭，上升速度在垂直方向上的分量越大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0966","type":"single","difficulty":1,"stem":"飞机的重心位置对飞机的（）。","options":[{"key":"A","text":"纵向稳定性产生影响"},{"key":"B","text":"方向稳定性产生影响"},{"key":"C","text":"横向稳定性产生影响"}],"answer":"A","analysis":"提示：重心纵航，横轴俯仰\n解析：飞机的重心位置对飞机的纵向稳定性产生重要影响。重心位置的前后移动会改变飞机的俯仰力矩，从而影响飞机的纵向稳定性。如果重心过于靠前，飞机容易出现低头现象；如果重心过于靠后，飞机容易出现抬头现象。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0967","type":"single","difficulty":1,"stem":"飞机的重心位置影响飞机的（）。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"方向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"A","analysis":"提示：重心纵（谐音 重心重）\n解析：重心前后位置会改变重心与升力作用点之间的关系，从而影响飞机的俯仰平衡和纵向静稳定性。(方向稳定性主要与垂直尾翼有关)(横向稳定性主要与上反角、后掠角等有关)","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0968","type":"single","difficulty":1,"stem":"飞机的纵向和航向稳定性之间（）。","options":[{"key":"A","text":"互相独立"},{"key":"B","text":"必须匹配适当"},{"key":"C","text":"纵向稳定性好，航向稳定性就差"}],"answer":"A","analysis":"提示：横航匹配，纵航无关。\n解析：飞机的纵向稳定性和航向稳定性是两个相对独立的概念。纵向稳定性主要关注飞机在俯仰方向上的稳定性，而航向稳定性则关注飞机在偏航方向上的稳定性。它们之间的相互影响相对较小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0969","type":"single","difficulty":1,"stem":"飞机的纵向稳定性是指飞机绕下列哪个轴线的稳定性?","options":[{"key":"A","text":"横轴"},{"key":"B","text":"立轴"},{"key":"C","text":"纵轴"}],"answer":"A","analysis":"提示：航向立，纵向横，横向纵\n解析：纵向稳定性定义：当飞机受微小扰动后，偏离原来纵向平衡状态(俯仰方向),并在扰动消失以后,飞机能自动恢复到原来纵向平衡状态的特性,叫作飞机的纵向稳定性。简易理解：飞机绕横轴的稳定性 = 纵向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0970","type":"single","difficulty":1,"stem":"飞机飞行的俯仰角为（）。","options":[{"key":"A","text":"飞机纵轴与飞行速度向量的夹角"},{"key":"B","text":"飞机纵轴与水平面的夹角"},{"key":"C","text":"飞行速度与水平面的夹角"}],"answer":"B","analysis":"提示：俯仰角和速度无关\n解析：俯仰角描述的是机头相对水平面的抬起或低下程度，即飞机纵轴（沿着机身头尾的轴）与水平面的夹角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0971","type":"single","difficulty":1,"stem":"飞机飞行中，空气表现出来的可压缩程度（）","options":[{"key":"A","text":"只取决于飞机的飞行速度(空速)"},{"key":"B","text":"只取决于飞机飞行当地的音速"},{"key":"C","text":"和飞机飞行的速度(空速)以及当地的音速有关"}],"answer":"C","analysis":"提示：可压缩→空+音 （绝对词错误，两个只×）\n解析：飞行中空气的可压缩性影响通常用马赫数来判断：M=飞机的空速 / 当地音速因此，既不能只看飞机飞得多快，也不能只看当地音速；与两者都有关系，要看两者的比值。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0972","type":"single","difficulty":1,"stem":"飞机航向稳定性是指飞机受到扰动后（）。","options":[{"key":"A","text":"产生绕立轴转动，扰动消失后转角自动回到零"},{"key":"B","text":"产生绕立轴转动，扰动消失后自动恢复原飞行姿态"},{"key":"C","text":"产生绕横轴转动，扰动消失后转角自动回到零"}],"answer":"B","analysis":"提示：稳定性→“恢复原飞行姿态” 航向立，纵向横，横向纵\n解析：飞机的稳定性就是指飞机受到小扰动后，偏离原平衡状态，并在扰动消失后，自动恢复到原平衡状态的特性。 不管题目问的是横向、纵向还是航向，只要选项里出现 “自动恢复原飞行姿态”，就是正确答案。 同时根据口诀“航向立，纵向横，横向纵”找到轴与对应的稳定性 本题航向立","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0973","type":"single","difficulty":1,"stem":"飞机横向平衡中的滚转力矩主要包括（）。","options":[{"key":"A","text":"机翼阻力力矩"},{"key":"B","text":"机翼升力力矩"},{"key":"C","text":"水平尾翼力矩"}],"answer":"B","analysis":"提示：横升\n解析：飞机横向平衡中的滚转力矩主要由机翼升力力矩构成。机翼在飞行时产生的升力不仅支撑飞机重量，还产生使飞机保持横向平衡力矩。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0974","type":"single","difficulty":1,"stem":"飞机横向稳定性是指飞机受到扰动后（）。","options":[{"key":"A","text":"产生绕纵轴转动，扰动消失后转角自动回到零"},{"key":"B","text":"产生绕纵轴转动，扰动消失后自动恢复原飞行姿态"},{"key":"C","text":"产生绕横轴转动，扰动消失后转角自动回到零"}],"answer":"B","analysis":"提示：稳定性→“恢复原飞行姿态” 航向立，纵向横，横向纵\n解析：飞机的稳定性就是指飞机受到小扰动后，偏离原平衡状态，并在扰动消失后，自动恢复到原平衡状态的特性。 不管题目问的是横向、纵向还是航向，只要选项里出现 “自动恢复原飞行姿态”，就是正确答案。 同时根据口诀“航向立，纵向横，横向纵”找到轴与对应的稳定性 本题横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0975","type":"single","difficulty":1,"stem":"飞机机翼的焦点指的是（）。","options":[{"key":"A","text":"升力的着力点"},{"key":"B","text":"附加升力的着力点"},{"key":"C","text":"重力的着力点"}],"answer":"B","analysis":"提示：机翼焦点→附加升力着力点\n解析：飞机机翼的焦点是指附加升力的着力点。 它影响飞机的稳定性和操纵性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0976","type":"single","difficulty":1,"stem":"飞机焦点的位置（）。","options":[{"key":"A","text":"随仰角变化而改变"},{"key":"B","text":"不随仰角变化而改变"},{"key":"C","text":"随滚转角变化而改变"}],"answer":"B","analysis":"提示：焦点和重心都不改\n解析：飞机焦点的位置不随仰角变化而改变。焦点位置是固定的，它决定了飞机在受到外力作用时的旋转中心。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0977","type":"single","difficulty":1,"stem":"飞机进行的匀速俯冲拉起飞行，则（）。","options":[{"key":"A","text":"速度不发生变化"},{"key":"B","text":"是在平衡外载荷作用下进行的飞行"},{"key":"C","text":"飞行速度方向的变化是由于存在着向心力"}],"answer":"C","analysis":"提示：存在向心力\n解析：飞机匀速俯冲拉起时，速度大小保持不变，但方向不断变化。速度方向的改变需要向心加速度，因此必须存在指向曲线航迹内侧的向心力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0978","type":"single","difficulty":1,"stem":"飞机离地速度越小，则（）。","options":[{"key":"A","text":"滑跑距离越短，飞机的起飞性能越好"},{"key":"B","text":"滑跑距离越短，飞机的起飞性能越差"},{"key":"C","text":"滑跑距离越长，飞机的起飞性能越好"}],"answer":"A","analysis":"提示：起飞越省劲，起飞性能越好 （起飞需要速度小，滑跑距离短）\n解析：起飞性能好 = 短距就能离地+加速快+爬升强+安全裕度高+在高温高原 / 重载下也轻松起飞对应到本题提到的两个条件：离地速度与滑跑距离可以总结一句话为：起飞越轻松越省劲，起飞性能越好（例如：战斗机可能不到 200 米就离地；大型运输机可能要 2000 米以上）起飞性能的实际意义：1.滑跑距离短，有效避免跑道冲出 飞机所需滑跑距离短，剩余跑道余量充足，突发意外要中断起飞时，能轻松在跑道内停稳，大幅降低冲出跑道风险。2.离地速度低，低空操控更稳 低速即可升空，离地瞬间姿态易把控，减少抬机头过猛、姿态失控、低空飘摆等险情。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0979","type":"single","difficulty":1,"stem":"飞机爬升角的大小取决于（）。","options":[{"key":"A","text":"剩余推力"},{"key":"B","text":"飞机重量"},{"key":"C","text":"剩余推力和飞机重量"}],"answer":"C","analysis":"提示：两个都相关，推力+重量\n解析：爬升角由飞机的剩余推力与飞机重量共同决定。剩余推力大且飞机重量轻时，爬升角较大。两者共同影响着飞机的爬升性能和轨迹。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0980","type":"single","difficulty":1,"stem":"飞机平飞航程的长短（）。","options":[{"key":"A","text":"决定于平飞可用燃油量多少"},{"key":"B","text":"决定于平飞的高度"},{"key":"C","text":"决定于发动机小时耗油量的大小"}],"answer":"A","analysis":"提示：航程长短看“燃油量”\n解析：根据蓝皮书：供平飞阶段使用的燃油量,叫作平飞可用燃油量。若其他条件不变,平飞可用燃油量愈多,平飞续航时间和平飞航程就愈长。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0981","type":"single","difficulty":1,"stem":"飞机平飞时保持等速飞行的平衡条件是（）。","options":[{"key":"A","text":"升力等于重力，推力等于重力"},{"key":"B","text":"升力等于重力，推力等于阻力"},{"key":"C","text":"升力等于阻力，推力等于重力"}],"answer":"B","analysis":"提示：平衡→升=重，推=阻 （升重推阻）\n解析：等速飞行时，升力需等于重力以保持高度不变，推力需等于阻力以维持速度不变。这是飞机平飞时保持等速飞行的基本平衡条件。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0982","type":"single","difficulty":1,"stem":"飞机平飞要有足够的升力来平衡飞机的重力，产生该升力所需的速度叫做（）。","options":[{"key":"A","text":"飞机平飞所需速度"},{"key":"B","text":"飞机平飞有利速度"},{"key":"C","text":"飞机平飞最大速度"}],"answer":"A","analysis":"提示：问题对答案，所需找所需\n解析：飞机平飞时，需产生足够的升力来平衡重力。产生这一升力所需的最小速度即为飞机平飞所需速度，它确保了飞机能在水平飞行中保持稳定的升力和重力平衡","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0983","type":"single","difficulty":1,"stem":"飞机起飞时后缘襟翼放下的角度小于着陆时放下的角度是因为（）。","options":[{"key":"A","text":"后缘襟翼放下角度比较小时，机翼的升力系数增加，阻力系数不增加"},{"key":"B","text":"后缘襟翼放下角度比较大时，机翼的阻力系数增加，升力系数不增加"},{"key":"C","text":"后缘襟翼放下角度比较小时，机翼的升力系数增加的效果大于阻力系数增加的效果"}],"answer":"C","analysis":"提示：效果\n解析：起飞时，较小的襟翼角度可增加升力系数，同时阻力系数增加相对较少，有利于飞机加速起飞。着陆时，需要更大的襟翼角度以增加阻力，帮助飞机减速着陆。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0984","type":"single","difficulty":1,"stem":"飞机绕横轴的稳定性称为（）。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"航向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"A","analysis":"提示：航向立，纵向横，横向纵\n解析：纵向稳定性定义：当飞机受微小扰动后，偏离原来纵向平衡状态(俯仰方向),并在扰动消失以后,飞机能自动恢复到原来纵向平衡状态的特性,叫作飞机的纵向稳定性。简易理解：飞机绕横轴的稳定性 = 纵向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0985","type":"single","difficulty":1,"stem":"飞机绕立轴的稳定性称为（）。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"航向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"B","analysis":"提示：航向立，纵向横，横向纵\n解析：航向稳定性定义：飞机受到扰动以致方向平衡状态遭到破坏,而在扰动消失后,飞机如能趋向于恢复原来的平衡状态,就具有航向稳定性。简易理解：飞机绕立轴的稳定性 =（方向平衡） 航向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0986","type":"single","difficulty":1,"stem":"飞机绕纵轴的稳定性称为（）。","options":[{"key":"A","text":"纵向稳定性"},{"key":"B","text":"航向稳定性"},{"key":"C","text":"横向稳定性"}],"answer":"C","analysis":"提示：航向立，纵向横，横向纵\n解析：横向稳定性定义：飞机受扰动以致横侧向平衡状态遭到破坏,而在扰动消失后,如飞机自身产生一个恢复力矩,使飞机趋向于恢复原来的平衡状态,就具有横侧向稳定性;反之,就没有横侧向稳定性。简易理解：飞机绕纵轴的稳定性 = 横向稳定性记忆口诀：航向立，纵向横，横向纵","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0987","type":"single","difficulty":1,"stem":"飞机下滑距离（）。","options":[{"key":"A","text":"与下滑高度有关"},{"key":"B","text":"与下滑角无关"},{"key":"C","text":"与下滑高度无关"}],"answer":"A","analysis":"提示：有关\n解析：飞机下滑距离主要由下滑高度和下滑角共同决定。 下滑距离既与下滑高度有关，也与下滑角有关","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0988","type":"single","difficulty":1,"stem":"飞机在y方向上的“过载”是指（）。","options":[{"key":"A","text":"飞机升力与飞机重力的比值"},{"key":"B","text":"飞机升力与飞机阻力的比值"},{"key":"C","text":"飞机推力与飞机阻力的比值"}],"answer":"A","analysis":"提示：x，横轴，推/阻；y，竖轴，升/重\n解析：（这里的过载不是我们生活中的说的“超过载荷”，它在题目中是飞机工程领域专有名词，是个比值）“过载”就是飞机结构或飞行员感受到的“载荷倍数”，用 G表示： 过载 ＝ 飞机当前所受总升力（或总法向力）/ 飞机重量1G ＝ 升力正好等于重量，平飞状态；0 G ＝ 失重，自由落体；负G ＝ 升力方向倒过来，人会被“扣”在座椅上。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0989","type":"single","difficulty":1,"stem":"飞机在飞行中出现的失速现象的原因是（）。","options":[{"key":"A","text":"翼梢出现较强的旋涡，产生很大的诱导阻力"},{"key":"B","text":"由于迎角达到临界迎角，造成机翼上表面附面层大部分分离"},{"key":"C","text":"由于机翼表面粗糙，使附面层由层流变为紊流"}],"answer":"B","analysis":"提示：失速迎角过大达到临界（失速找迎角，）\n解析：迎角达临界迎角会使机翼上表面附面层大部分分离，导致升力急剧下降，产生失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0990","type":"single","difficulty":1,"stem":"飞机在空中飞行时，如果飞机处于平衡状态，那么（）。","options":[{"key":"A","text":"作用在飞机上的所有外力平衡，所有外力矩也平衡"},{"key":"B","text":"作用在飞机上的所有外力不平衡，所有外力矩平衡"},{"key":"C","text":"作用在飞机上的所有外力平衡，所有外力矩不平衡"}],"answer":"A","analysis":"提示：全部平衡。\n解析：平衡状态意味着所有外力平衡，外力矩也平衡，否则飞机姿态会改变。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0991","type":"single","difficulty":1,"stem":"飞机着陆的过程是（）。","options":[{"key":"A","text":"减速下滑、拉平接地和减速滑跑三个阶段"},{"key":"B","text":"下滑、拉平、平飘、接地和着陆滑跑五个阶段"},{"key":"C","text":"下滑、拉平、接地、着陆滑跑和刹车五个阶段"}],"answer":"B","analysis":"提示：5阶段，带平飘\n解析：飞机着陆包括下滑、拉平、平飘、接地和着陆滑跑五个阶段，每个阶段都有特定动作和要求。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0992","type":"single","difficulty":1,"stem":"飞机着陆时使用后缘襟翼的作用是（）。","options":[{"key":"A","text":"提高飞机的操纵灵敏性"},{"key":"B","text":"增加飞机的稳定性"},{"key":"C","text":"增加飞机的升力"}],"answer":"C","analysis":"提示：后缘襟翼→升力\n解析：着陆时速度降低，使用后缘襟翼可增大机翼弯度和面积，从而增加飞机升力，有助于平稳着陆。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0993","type":"single","difficulty":1,"stem":"飞机重心位置的表示方法是（）。","options":[{"key":"A","text":"用重心到平均气动力弦前缘的距离和平均气动力弦长之比的百分数来表示"},{"key":"B","text":"用重心到平均几何弦后缘的距离和平均几何弦长之比的百分数来表示"},{"key":"C","text":"用重心到机体基准面的距离和平均气动力弦长之比的百分数来表示"}],"answer":"A","analysis":"提示：前缘\n解析：重心位置用重心到平均气动力弦前缘的距离和平均气动力弦长之比的百分数来表示，这是常用且准确的方法，","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0994","type":"single","difficulty":1,"stem":"飞机纵向阻尼力矩的主要由（）。","options":[{"key":"A","text":"后掠机翼产生"},{"key":"B","text":"垂直尾翼产生"},{"key":"C","text":"水平尾翼产生"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：飞机的纵向阻尼力矩是指绕横轴俯仰阻尼。当飞机俯仰摆动时，机头一上一下。机头下俯，平尾向上运动，相对气流有效迎角↑、平尾升力↑；机头上仰，平尾向下运动，有效迎角↓、平尾升力↓。平尾升力变化形成反向力矩，阻碍俯仰摆动运动，就是纵向阻尼力矩，主要由水平尾翼提供。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0995","type":"single","difficulty":1,"stem":"飞机做等速直线水平飞行时，作用在飞机上的外载荷应满足（）。","options":[{"key":"A","text":"升力等于重力，推力等于阻力"},{"key":"B","text":"升力等于重力，抬头力矩等于低头力矩"},{"key":"C","text":"升力等于重力，推力等于阻力，抬头力矩等于低头力矩"}],"answer":"C","analysis":"提示：3平衡\n解析：等速直线水平飞行需各方面平衡，升力重力平衡保证高度不变，推力阻力平衡保证速度不变，抬头低头力矩平衡保证姿态稳定。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0996","type":"single","difficulty":1,"stem":"飞行侧滑角为（）。","options":[{"key":"A","text":"飞机纵轴与水平面的夹角"},{"key":"B","text":"飞行速度与水平面的夹角"},{"key":"C","text":"空速向量与飞机对称面的夹角"}],"answer":"C","analysis":"提示：侧滑找对称面\n解析：飞机产生侧滑时，空气从飞机侧方吹来，这时，相对气流方向和飞机对称面之间就有一个侧滑角β。相对气流从左前方吹来叫左侧滑,相对气流从右前方吹来叫右侧滑。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0997","type":"single","difficulty":1,"stem":"根据机翼升力和阻力计算公式可以得出，通过增大机翼面积来增大升力的同时（）。","options":[{"key":"A","text":"阻力不变"},{"key":"B","text":"阻力减小"},{"key":"C","text":"阻力也随着增大"}],"answer":"C","analysis":"提示：升力↑阻力↑\n解析：增大机翼面积会增大空气阻力作用面积从而使阻力也随之增大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0998","type":"single","difficulty":1,"stem":"关于飞机失速下列说法哪些是正确的？","options":[{"key":"A","text":"飞机失速是通过加大发动机动力就可以克服的飞行障碍"},{"key":"B","text":"亚音速飞行只会出现大迎角失速"},{"key":"C","text":"在大迎角或高速飞行状态下都可能出现飞机失速现象"}],"answer":"C","analysis":"提示：都可能\n解析：飞机失速是一种复杂的飞行状态，不是仅靠加大发动机动力就能克服;亚音速飞行也会有多种失速情况;大迎角或高速飞行都可能出现失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-0999","type":"single","difficulty":1,"stem":"焦点在重心之后，焦点位置向后移（）。","options":[{"key":"A","text":"增加纵向稳定性"},{"key":"B","text":"提高纵向操纵性"},{"key":"C","text":"减小纵向稳定性"}],"answer":"A","analysis":"提示：焦后，纵向稳\n解析：焦点在重心之后，焦点后移会增加飞机恢复原有姿态
