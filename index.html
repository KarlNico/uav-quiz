.2V"},{"key":"B","text":"3.7V"},{"key":"C","text":"3.3V"}],"answer":"A","analysis":"提示：充满4.2\n解析：单节电池电压一般为 3.7V,充满约 4.2V","tags":[],"bankId":"uav-selected"},{"id":"sel-0486","type":"single","difficulty":1,"stem":"以下种类的电池，具有记忆效应的是（）。","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"铅酸电池"}],"answer":"B","analysis":"提示：记忆效应镍镉\n解析：记忆效应会导致电池容量下降，即若未完全放电就充电，电池会 “记住” 未放电部分，后续仅能在该范围内充放电。聚合物锂电池和铅酸电池基本无记忆效应，使用时无需刻意完全放电，可随用随充，而镍镉电池需定期完全充放电以缓解记忆效应。","tags":[],"bankId":"uav-selected"},{"id":"sel-0487","type":"single","difficulty":1,"stem":"一块聚合物锂电池上标有25C字样，C代表( )。","options":[{"key":"A","text":"充电倍率"},{"key":"B","text":"容量倍率"},{"key":"C","text":"放电倍率"}],"answer":"C","analysis":"提示：大数放电倍率\n解析：在电池领域，C 值（C-rate）是衡量电池充放电电流大小的单位，是按照电池的标称容量最大可达到多大的放电电流。1C表示电池在1小时内完全放电的电流值。","tags":[],"bankId":"uav-selected"},{"id":"sel-0488","type":"single","difficulty":1,"stem":"多旋翼飞行器通过改变（）控制飞行轨迹。","options":[{"key":"A","text":"总距杆"},{"key":"B","text":"转速"},{"key":"C","text":"尾桨"}],"answer":"B","analysis":"提示：转速控制飞行轨迹\n解析：多旋翼飞行器的飞行控制核心逻辑是通过调整不同电机的转速，改变各旋翼的升力，进而控制飞行轨迹，这与固定翼或单旋翼直升机的控制方式有本质区别。","tags":[],"bankId":"uav-selected"},{"id":"sel-0489","type":"single","difficulty":1,"stem":"当多旋翼飞行器地面站出现飞行器电压过低报警时，第一时刻采取的措施是()？","options":[{"key":"A","text":"一键返航"},{"key":"B","text":"控制姿态，逐渐减低高度，迫降至地面"},{"key":"C","text":"结合飞行器位置判断是否满足安全返航条件"}],"answer":"C","analysis":"提示：先判断再操作\n解析：电压过低意味着飞行器电量已接近临界值，继续飞行可能导致动力丧失，直接坠落。一键返航虽然方便，但如果电量不足，飞行器可能在返航途中坠毁或失联。直接迫降虽然能避免坠落，但如果当前位置不安全，可能造成更大损失。因此，第一时间判断当前位置是否安全、是否具备返航条件是最合理的操作，之后再决定是返航还是迫降。","tags":[],"bankId":"uav-selected"},{"id":"sel-0490","type":"single","difficulty":1,"stem":"多旋翼飞行器悬停时的平衡不包括（）。","options":[{"key":"A","text":"诱导阻力平衡"},{"key":"B","text":"俯仰平衡"},{"key":"C","text":"升力平衡"}],"answer":"A","analysis":"提示：选错的。诱导阻力×\n解析：多旋翼悬停状态：升力平衡、俯仰平衡、横滚平衡、方向平衡俯仰平衡：前后机头上下的平衡，悬停必须保持，包含在内。升力平衡：悬停升力 = 重力，必须平衡。诱导阻力平衡：诱导阻力是旋翼向前、向后、侧向机动飞行时才明显存在的附加阻力；悬停静止无诱导阻力，不需要平衡。","tags":[],"bankId":"uav-selected"},{"id":"sel-0491","type":"single","difficulty":1,"stem":"飞行中的多旋翼飞行器所承受的力和力矩不包括（）。","options":[{"key":"A","text":"旋翼诱导阻力"},{"key":"B","text":"旋翼桨叶的摆振力矩"},{"key":"C","text":"旋翼的反扭矩和桨毂力矩"}],"answer":"B","analysis":"提示：选错的。摆振力矩×\n解析：常规多旋翼桨叶通常没有传统直升机旋翼的摆振铰链，因此不涉及摆振铰链处的力矩。","tags":[],"bankId":"uav-selected"},{"id":"sel-0492","type":"single","difficulty":1,"stem":"关于旋翼的反扭矩说法正确的是( )。","options":[{"key":"A","text":"旋翼的反扭矩会迫使直升机向旋翼旋转的反方向偏转"},{"key":"B","text":"旋翼反扭矩的大小取决于发动机最大功率的大小"},{"key":"C","text":"发动机带动旋翼旋转时，旋翼诱导阻力力矩为发动机传递给旋翼轴的扭矩所平衡"}],"answer":"A","analysis":"提示：反扭矩反方向偏转（反反）\n解析：根据牛顿第三定律，发动机驱动旋翼旋转时，旋翼会产生反向的反扭矩。该反扭矩作用于机身，会迫使直升机向旋翼旋转的反方向偏转，这也是直升机需设计尾桨（或共轴反桨）来抵消反扭矩的核心原因。","tags":[],"bankId":"uav-selected"},{"id":"sel-0493","type":"single","difficulty":1,"stem":"螺旋桨叶本身是扭转的，因此桨叶角从毂轴到叶尖是变化的。最大安装角或者最大桨距在（）。","options":[{"key":"A","text":"毂轴处"},{"key":"B","text":"叶尖处"},{"key":"C","text":"桨叶中部"}],"answer":"A","analysis":"提示：最大桨距毂轴处\n解析：螺旋桨设计为扭转形态，核心是平衡不同位置升力。其安装角（桨距）分布与线速度相反：毂轴（桨根）半径最小，旋转线速度最低，需最大安装角来增大迎角，弥补线速度不足以产生足够升力；叶尖半径最大、线速度最高，安装角需最小，避免气流分离；中部安装角介于两者间。因此最大安装角在毂轴处。","tags":[],"bankId":"uav-selected"},{"id":"sel-0494","type":"single","difficulty":1,"stem":"哪一类作业的气象无人机在控制成本的情况下，允许单次使用不回收？","options":[{"key":"A","text":"旱涝灾害评估"},{"key":"B","text":"人工催化播撒降雨"},{"key":"C","text":"强对流云直接探测"}],"answer":"C","analysis":"提示：强对流单次\n解析：强对流云探测任务通常需要无人机进入极端天气环境（如雷暴、强对流云团）内部采集数据。无人机可能无法安全返回，因此设计上允许一次性使用、不回收。人工降雨虽然风险较高，但多为可控飞行，回收无人机仍是常规操作。","tags":[],"bankId":"uav-selected"},{"id":"sel-0495","type":"single","difficulty":1,"stem":"如果民用固定翼无人机在机翼上有一层霜，那么它的失速速度（）。","options":[{"key":"A","text":"增加或减小不确定"},{"key":"B","text":"会增加"},{"key":"C","text":"会减小"}],"answer":"B","analysis":"提示：增加一层霜\n解析：霜会破坏机翼表面的平滑度，增大空气摩擦阻力，同时降低机翼对气流的引导能力，导致机翼产生升力的效率下降。为维持足够升力以避免失速，需要更高的飞行速度，因此失速速度会比机翼干净时更高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0496","type":"single","difficulty":1,"stem":"冷锋是指（）。","options":[{"key":"A","text":"冷气团主动向暖气团移动形成的锋称为冷锋"},{"key":"B","text":"一侧气团温度明显低于另一侧气团温度的锋"},{"key":"C","text":"温度较高与温度较低的两个气团交汇时，温度低的一侧"}],"answer":"A","analysis":"提示：冷锋主动\n解析：冷锋的核心定义在于“主动移动”的方向，即冷气团起主导作用，主动推进并挤压暖气团，迫使暖气团抬升。这种主动移动的特征，是区分冷锋与暖锋、准静止锋的关键标志。","tags":[],"bankId":"uav-selected"},{"id":"sel-0497","type":"single","difficulty":1,"stem":"离开源地移至与源地性质不同的下垫面时，气团的物理属性逐渐发生变化，这个过程称为气团的变性。一般说来（）。","options":[{"key":"A","text":"冷气团移到暖的地区变性快，而暖的气团移到冷的地区变性慢"},{"key":"B","text":"冷气团移到暖的地区变性慢，而暖的气团移到冷的地区变性快"},{"key":"C","text":"暖气团移到暖的地区，冷气团移到冷的地区不变性"}],"answer":"A","analysis":"提示：冷→暖 变性快，暖→冷 变性慢\n解析：当冷气团离开源地后，气团低层要变暖、增温，逐渐趋于不稳定，对流易发展。能很快地把低层的热量和水汽向上输送，所以，气团变性快；相反，当暖气团离开源地后，气团低层不断变冷，逐渐趋于稳定，对流不易发展，所以气团变性较慢。","tags":[],"bankId":"uav-selected"},{"id":"sel-0498","type":"single","difficulty":1,"stem":"同一架民用无人机于冬季与夏季在同一块飞行场地地面检测，哪一种高度会变化？","options":[{"key":"A","text":"GPS高度"},{"key":"B","text":"本场相对高度"},{"key":"C","text":"气压高度"}],"answer":"C","analysis":"提示：季节变化气压高度\n解析：GPS 高度依卫星测绝对高度，不受环境影响；本场相对高度以起飞地为基准，基准不变则数值不变。气压高度靠气压传感器换算，夏季气温高、气压低，换算值更高；冬季气温低、气压高，换算值更低，故随季节变化。","tags":[],"bankId":"uav-selected"},{"id":"sel-0499","type":"single","difficulty":1,"stem":"在飞行中遇到飞机积冰时 ，驾驶员应注意（）。","options":[{"key":"A","text":"柔和操纵飞机 ，保持飞行高度和平飞姿态 ，尽快脱离积冰区"},{"key":"B","text":"及时有力地修正飞行姿态的偏差 ，尽快脱离积冰区"},{"key":"C","text":"调整飞机马力 ，严格保持飞行高度和速度 ，尽快脱离积冰区"}],"answer":"A","analysis":"提示：柔和脱离\n解析：积冰会改变飞机关键部位气动外形，冰层附着力也可能不均。柔和操纵能避免动作粗暴导致冰层脱落或破坏气动平衡，减少载荷波动，防止加剧失速风险，确保脱离前飞行状态可控。","tags":[],"bankId":"uav-selected"},{"id":"sel-0500","type":"single","difficulty":1,"stem":"白天，在太阳辐射作用下，山岩地、沙地、城市地区比水面、草地、林区、农村升温快，其上 空气受热后温度高于周围空气 ，因而体积膨胀、密度减小，使浮力大于重力而产生上升运动。这种现象会引起（）。","options":[{"key":"A","text":"压差作用力"},{"key":"B","text":"温差作用力"},{"key":"C","text":"热力对流冲击力"}],"answer":"C","analysis":"提示：受热不均热对流\n解析：地表受热不均，导致空气冷热差异，进而引发空气垂直上升运动，属于典型的热力对流。受热空气上升、周围冷空气补充，形成的冲击力即为热力对流冲击力，其动力来源是太阳辐射造成的地表与空气间的热量差异。","tags":[],"bankId":"uav-selected"},{"id":"sel-0501","type":"single","difficulty":1,"stem":"哪种气流对无人机的长航时飞行有利?","options":[{"key":"A","text":"稳定的逆风"},{"key":"B","text":"稳定的上升气流"},{"key":"C","text":"稳定的下降气流"}],"answer":"B","analysis":"提示：稳定上升最省力\n解析：稳定的上升气流能直接为无人机提供向上的升力，抵消部分重力。这使得无人机无需消耗额外电能维持高度，甚至可借助气流爬升，大幅降低动力系统负载，减少电量消耗，从而显著延长续航时间，是长航时无人机（如气象探测型）优先寻找的气流类型。","tags":[],"bankId":"uav-selected"},{"id":"sel-0502","type":"single","difficulty":1,"stem":"能见度不好的天气，一般风力（）。","options":[{"key":"A","text":"较强"},{"key":"B","text":"较弱"},{"key":"C","text":"混乱"}],"answer":"B","analysis":"提示：风力弱能见度低\n解析：风力较弱时，空气流动慢，水汽、尘埃、污染物等难以扩散，易在近地面积聚，导致能见度下降。像雾的形成通常需要风力小于2级，霾的维持也依赖弱风，强风会快速吹散这些物质，反而改善能见度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0503","type":"single","difficulty":1,"stem":"地球自转偏向力使得气流向右偏转，因此在北纬30度到赤道之间产生（）方向的信风。","options":[{"key":"A","text":"东南方向"},{"key":"B","text":"东北方向"},{"key":"C","text":"西南方向"}],"answer":"B","analysis":"提示：凉风有信，信风冷风，东北风\n解析：从副热带高气压带吹向赤道低气压带,就是信风,北半球为东北信风；南半球为东南信风。","tags":[],"bankId":"uav-selected"},{"id":"sel-0504","type":"single","difficulty":1,"stem":"在下述何种情况下容易碰到风切变？","options":[{"key":"A","text":"当风速大于65千米/小时"},{"key":"B","text":"有高气压时"},{"key":"C","text":"逆温层附近或靠近雷暴时"}],"answer":"C","analysis":"提示：靠近雷暴风切变\n解析：逆温层会阻碍空气垂直运动，导致上下层风速、风向差异显著，形成风切变；雷暴系统中存在强烈的上升下沉气流，气流剧烈变化易引发风切变，这两种情况都是风切变的高发场景。","tags":[],"bankId":"uav-selected"},{"id":"sel-0505","type":"single","difficulty":1,"stem":"在山谷飞行时，应该采取的措施是（）。","options":[{"key":"A","text":"靠近背风坡飞行"},{"key":"B","text":"靠近迎风坡飞行"},{"key":"C","text":"飞出山口马上转弯"}],"answer":"B","analysis":"提示：山谷飞行迎风坡\n解析：因为迎风坡一侧气流通常较稳定，上升气流较强且可预测；而背风坡易出现湍流、下降气流甚至“滚轴云”等危险现象，飞出山口立即转弯则易陷入侧向风切变或涡流。","tags":[],"bankId":"uav-selected"},{"id":"sel-0506","type":"single","difficulty":1,"stem":"在处于雷暴区边缘的机场起飞或着陆时，要特别注意的危险天气是（）。","options":[{"key":"A","text":"低空风切变"},{"key":"B","text":"冰雹和暴雨"},{"key":"C","text":"积冰和雷击"}],"answer":"A","analysis":"提示：雷暴边缘风切变\n解析：低空风切变是指近地面600米以下高度风向、风速发生突然变化的现象，尤其在雷暴边缘最为常见和危险。它会导致飞机在起飞或着陆阶段出现升力骤变、高度失控、空速突变等情况，飞行员若反应不及，极易引发飞行事故。","tags":[],"bankId":"uav-selected"},{"id":"sel-0507","type":"single","difficulty":1,"stem":"现有民用无人机多数在大气的哪一层内运行？","options":[{"key":"A","text":"对流层"},{"key":"B","text":"平流层"},{"key":"C","text":"热层"}],"answer":"A","analysis":"提示：无人机飞对流层\n解析：民用无人机的主要用途集中在航拍、测绘、物流、巡检等领域，不需要到达过高的高度。对流层是大气最底层，高度从地面延伸至约8-18 公里，几乎包含了所有的水汽和天气现象，完全能满足民用无人机的作业需求。","tags":[],"bankId":"uav-selected"},{"id":"sel-0508","type":"single","difficulty":1,"stem":"对飞机飞行安全性影响最大的阵风是（）？","options":[{"key":"A","text":"上下垂直于飞行方向的阵风"},{"key":"B","text":"左右垂直于飞行方向的阵风"},{"key":"C","text":"沿着飞行方向的阵风"}],"answer":"A","analysis":"提示：影响安全上下风\n解析：上下垂直阵风会瞬间改变飞机迎角，导致升力骤变，易引发失速、过载或高度突变，尤其在起降阶段威胁最大，故对飞行安全性影响最显著。","tags":[],"bankId":"uav-selected"},{"id":"sel-0509","type":"single","difficulty":1,"stem":"锋是三度空间的天气系统。锋的宽度同气团宽度相比显得很狭窄，因而常把锋区看成一个几何面，称为锋面。下面描述错误的是？","options":[{"key":"A","text":"锋面与地面的交线称为锋线"},{"key":"B","text":"锋面和锋线统称为锋"},{"key":"C","text":"凡伸到对流层中上层者，称为层流锋"}],"answer":"C","analysis":"提示：选错的。层流锋×\n解析：凡伸到对流层中上层者，称为对流层锋（对流层+锋），而非 “层流锋”。","tags":[],"bankId":"uav-selected"},{"id":"sel-0510","type":"single","difficulty":1,"stem":"地面风具有明显日变化的主要原因是什么？","options":[{"key":"A","text":"气压的变化"},{"key":"B","text":"摩擦力的变化"},{"key":"C","text":"乱流强度的变化"}],"answer":"A","analysis":"提示：地面风气压变\n解析：地面风具有明显日变化的主要原因是受太阳辐射的气温变化和气压变化。白天地表受热，空气膨胀上升，近地面减压，形成向陆或向上的气压梯度；夜间冷却，空气下沉增压，梯度反向，从而主导地面风的明显日变化。","tags":[],"bankId":"uav-selected"},{"id":"sel-0511","type":"single","difficulty":1,"stem":"飞机按气压式高度表指示的一定高度飞行 ，在飞向低压区时 ，飞机的实际高度将（）。","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"逐渐升高"},{"key":"C","text":"逐渐降低"}],"answer":"C","analysis":"提示：飞向低压高度降低\n解析：气压式高度表通过测量外界大气压力来显示高度，其基准是 “气压随高度升高而降低”。飞向低压区时，外界大气压力比高度表预设的基准压力更低，表上显示的高度会 “偏高”，但实际大气压力对应的真实高度其实在下降，导致飞机实际高度逐渐降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0512","type":"single","difficulty":1,"stem":"在温暖的天气飞行在较低高度 ，有时会遇上湍流空气 ，以下描述正确的是（）？","options":[{"key":"A","text":"很可能在路面和荒地上空发生上升气流"},{"key":"B","text":"在类似成片树林的广阔植被区域发生上升气流"},{"key":"C","text":"在大片水体区域发生上升气流"}],"answer":"A","analysis":"提示：荒地湍流\n解析：路面、荒地等地表比热容小，温暖天气下吸收太阳辐射后升温快，会加热上方空气。热空气密度变小，会向上运动形成上升气流，这种情况在低高度飞行时易出现，也是该区域产生湍流的原因之一。","tags":[],"bankId":"uav-selected"},{"id":"sel-0513","type":"single","difficulty":1,"stem":"当飞机进入下击暴流区域时，（）。","options":[{"key":"A","text":"先遇强逆风，后遇猛烈的下沉气流，随后又是强顺风"},{"key":"B","text":"先遇强顺风，后遇猛烈的上升气流，随后又是强逆风"},{"key":"C","text":"先遇强逆风，后遇猛烈的上升气流，随后又是强顺风"}],"answer":"A","analysis":"提示：下击暴流→强逆↓强顺\n解析：进入区域初期，先遇强逆风，可能让飞机实际高度高于预期；深入后会遭遇雷暴云底部的猛烈下沉气流，快速压低飞机高度；飞出下沉气流区后，会遇到强顺风，导致相对气流速度骤减、升力下降，加剧高度掉速风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0514","type":"single","difficulty":1,"stem":"大气稳定度指整层空气的稳定程度，有时也称大气垂直稳定度。 以下列哪种运动来判定？","options":[{"key":"A","text":"以大气的气温垂直加速度运动来判定"},{"key":"B","text":"以大气的气温垂直速度运动来判定"},{"key":"C","text":"以大气的气压垂直速度运动来判定"}],"answer":"A","analysis":"提示：稳定 加速度\n解析：大气稳定度核心是看空气受扰动后的运动趋势，而非当前速度。空气块因扰动升降时，其与周围空气的温差会产生浮力，若浮力使其加速运动或减速返回原位，这种加速/减速趋势就通过气温垂直加速度体现，以此判定稳定程度","tags":[],"bankId":"uav-selected"},{"id":"sel-0515","type":"single","difficulty":1,"stem":"大气对流运动是由于地球表面受热不均引起的。空气受热膨胀上升 ，受冷则下沉 ，进而产生了 强烈而比较有规则的升降运动。温度越高 ，大气对流运动越明显。 因此对流效果最明显的是（）？","options":[{"key":"A","text":"北半球"},{"key":"B","text":"赤道地区"},{"key":"C","text":"南半球"}],"answer":"B","analysis":"提示：赤道最对流\n解析：赤道地区全年正午太阳高度角大，太阳辐射集中且强烈，地表接收热量远多于其他区域，空气受热膨胀上升的动力最足。同时，地表高温使空气强烈上升，近地面形成低压，与周边气压差大，进一步加剧空气升降运动，让对流更剧烈频繁。","tags":[],"bankId":"uav-selected"},{"id":"sel-0516","type":"single","difficulty":1,"stem":"当气温高于标准大气温度时 ，飞机的载重量要（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"减小"},{"key":"C","text":"保持不变"}],"answer":"B","analysis":"提示：气温高减重\n解析：气温升高会使空气密度降低，而飞机升力依赖空气密度，密度下降会导致相同速度下升力减少。为保证起飞、巡航等阶段有足够升力维持安全飞行，需减小载重量以降低总重力，让升力与重力重新平衡，避免性能受限或安全风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0517","type":"single","difficulty":1,"stem":"飞机上升时，其迎角（）。","options":[{"key":"A","text":"大于零"},{"key":"B","text":"小于零"},{"key":"C","text":"等于零"}],"answer":"A","analysis":"提示：上升下降平飞，都是正迎角, “正”迎角大于零\n解析：飞机爬升时机头向上仰，机翼与相对气流形成正夹角，升力垂直分量克服重力，迎角必为正才能产生足够升力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0518","type":"single","difficulty":1,"stem":"气流沿机翼表面流动，影响由层流变为紊流的原因不包括（）。","options":[{"key":"A","text":"空气的流速"},{"key":"B","text":"在机翼表面的流动长度"},{"key":"C","text":"空气比重"}],"answer":"C","analysis":"提示：选错的。空气比重×\n解析：·首先，机翼表面的气流流速快的时候，这时气流扰动会更剧烈，导致层流无法再在机翼前段平稳维持，会更早转变为紊流因此，流速对“层流变为紊流”有影响·另外，气流在机翼表面流动距离越长，受到的各种微小扰动持续累计，越易转变为紊流。·空气比重 = 空气密度 × 重力加速度，本题与空气密度相关，与空气比重无关。","tags":[],"bankId":"uav-selected"},{"id":"sel-0519","type":"single","difficulty":1,"stem":"从机尾向机头方向看去，顺时针旋转螺旋桨飞机的扭矩使飞机（）。","options":[{"key":"A","text":"向下低头"},{"key":"B","text":"向左滚转"},{"key":"C","text":"向上抬头"}],"answer":"B","analysis":"提示：顺左逆右\n解析：螺旋桨顺时针转 → 机身受到逆时针扭矩；逆时针扭距作用在机身上 → 机身想逆时针转→ 逆时针就是往左。","tags":[],"bankId":"uav-selected"},{"id":"sel-0520","type":"single","difficulty":1,"stem":"飞机过载和载荷因子是同一概念吗?","options":[{"key":"A","text":"是"},{"key":"B","text":"不是"},{"key":"C","text":"不确定"}],"answer":"A","analysis":"提示：是，过载=载荷因子，都是比值\n解析：1.“过载”就是飞机结构或飞行员感受到的“载荷倍数”，用 G表示： 过载 ＝ 飞机当前所受总升力（或总法向力）/飞机重量1G ＝ 升力正好等于重量，平飞状态；0 G ＝ 失重，自由落体；负G ＝ 升力方向倒过来，人向上飘、屁股离开座椅。2.“载荷因子”（load factor）是个无量纲倍数，表示飞机结构当前要承受的“载荷倍数”，符号常写成 n： n = 总升力 / 飞机重量3.工程上叫“载荷因子”，飞行员口语里就叫“过载”“G 值”，是同一概念。（这里的过载不是我们生活中的说的“超过载荷”，它在题目中是飞机工程领域专有名词，是个比值）","tags":[],"bankId":"uav-selected"},{"id":"sel-0521","type":"single","difficulty":1,"stem":"飞机平飞航程的长短（）。","options":[{"key":"A","text":"决定于平飞可用燃油量多少"},{"key":"B","text":"决定于平飞的高度"},{"key":"C","text":"决定于发动机小时耗油量的大小"}],"answer":"A","analysis":"提示：航程长短看“燃油量”\n解析：根据蓝皮书：供平飞阶段使用的燃油量,叫作平飞可用燃油量。若其他条件不变,平飞可用燃油量愈多,平飞续航时间和平飞航程就愈长。","tags":[],"bankId":"uav-selected"},{"id":"sel-0522","type":"single","difficulty":1,"stem":"偏转副翼使飞机左转弯时，为修正逆偏转的影响，应（）。","options":[{"key":"A","text":"向左偏转方向舵"},{"key":"B","text":"向右偏转方向舵"},{"key":"C","text":"向右压杆"}],"answer":"A","analysis":"提示：左转配左舵，右转配右舵\n解析：· 使用副翼转弯时（副翼压谁谁小，往哪转哪侧小）： 使用副翼使飞机向左滚转时，左副翼上偏、右副翼下偏，右机翼升力和阻力增大。阻力差使飞机产生向右的逆偏航，即机头向右、机尾向左。为修正逆偏航，应向左蹬方向舵，使机头向左、机尾向右，抵消阻力差造成的右偏航，实现协调转弯。","tags":[],"bankId":"uav-selected"},{"id":"sel-0523","type":"single","difficulty":1,"stem":"CCAR-61部授权的执照或等级申请人，在理论考试中有作弊或其他禁止的行为，局方拒绝其执照或等级以及考试申请的期限为（）。","options":[{"key":"A","text":"半年"},{"key":"B","text":"视其违规的情节轻重而定"},{"key":"C","text":"一年"}],"answer":"C","analysis":"提示：申请人作弊，1年，选最久（CCAR开头，有3选3，没3选1）\n解析：根据《民用航空器驾驶员和地面教员合格审定规则》(CCAR-61-R4)第61.245条 理论考试中的作弊或其他禁止的行为的处罚:(a) 对于违反本规则第61.37条规定的执照或等级申请人,局方对申请人予以警告，申请人自该行为被发现之日起一年内不得申请按照本规则颁发的执照或等级以及考试。。","tags":[],"bankId":"uav-selected"},{"id":"sel-0524","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别视距内等级申请人必须具有不少于 ( ) 小时的带飞训练时间。","options":[{"key":"A","text":"44"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"B","analysis":"提示：带飞视距内10，超视距15\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件1.1.4 飞行经历要求:视距内等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 44 小时的飞行经历时间，其中包括（a）按照本规定 1.3 条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于 10 小时带飞训练，不少于 5 小时单飞训练，计入驾驶员飞行 经历的飞行模拟训练时间不多于 22 小时；","tags":[],"bankId":"uav-selected"},{"id":"sel-0525","type":"single","difficulty":1,"stem":"多旋翼无人机机体一般不使用（）的材料。","options":[{"key":"A","text":"玻璃纤维材料"},{"key":"B","text":"碳纤维材料"},{"key":"C","text":"高强度工程塑料"}],"answer":"A","analysis":"提示：选错的。不用玻璃纤维\n解析：根据蓝皮书表述：轻型、微型无人机一般使用2叶桨,少数使用3叶桨或4叶桨等。桨径20in以下的螺旋桨有木材、工程塑料或碳纤维等材质,需要根据实际需要选用。 实际应用中，玻璃纤维密度比碳纤维大、重量更高，脆性更强、抗振动疲劳差，仅极少数廉价玩具机少量使用，多旋翼无人机一般不采用作为主体结构材料。简单总结：碳纤、工程塑料（高强度塑料）是行业常规用材，玻璃纤维因偏重、韧性差，极少用于正规多旋翼无人机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0526","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别超视距等级申请人必须具有不少于 ( ) 小时的带飞训练时间。","options":[{"key":"A","text":"56"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"C","analysis":"提示：带飞视距内10，超视距15\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件 1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。 2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"bankId":"uav-selected"},{"id":"sel-0527","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别超视距等级申请人必须具有不少于 ( ) 小时的单飞训练时间。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"A","analysis":"提示：单飞都是5\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件 1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。 2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"bankId":"uav-selected"},{"id":"sel-0528","type":"single","difficulty":1,"stem":"民用无人机驾驶员多旋翼类别视距内等级申请人必须具有不少于 ( ) 小时的单飞训练时间。","options":[{"key":"A","text":"5"},{"key":"B","text":"10"},{"key":"C","text":"15"}],"answer":"A","analysis":"提示：单飞都是5\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件 1.4（a）按照本规定1.3条的飞行技能要求，对于多旋翼类别视距内等级驾驶员执照申请人，由授权教员提供不少于10 小时带飞训练，不少于 5 小时单飞训练。 2.1.4 （a）按照本规定 2.1.3 条的飞行技能要求，对于多旋翼类别超视距等级驾驶员执照申请人，由授权教员提供不少于 15 小时带飞训练，不少于 5 小时单飞训练。","tags":[],"bankId":"uav-selected"},{"id":"sel-0529","type":"single","difficulty":1,"stem":"根据无人机行业习惯，通常定义右旋前进的螺旋桨为（）。","options":[{"key":"A","text":"拉桨"},{"key":"B","text":"正桨"},{"key":"C","text":"反桨"}],"answer":"B","analysis":"提示：右旋前进→正桨\n解析：根据孙毅 主编的《无人机驾驶员航空知识手册》2.1.2.5螺旋桨1.定距螺旋桨：根据无人机行业习惯,通常定义右旋前进的螺旋桨为正桨,左旋前进的螺旋桨为反桨。","tags":[],"bankId":"uav-selected"},{"id":"sel-0530","type":"single","difficulty":1,"stem":"高海拔地区，以下哪个尺寸的螺旋桨更适用?","options":[{"key":"A","text":"1835"},{"key":"B","text":"1855"},{"key":"C","text":"1035"}],"answer":"A","analysis":"提示：高海拔1835\n解析：在高海拔下，选择高KV、大直径小螺距的螺旋桨及电机配置可以有效地提高飞行器的航时和载重能力，使其能够在恶劣的环境条件下稳定运行。根据前桨径后螺距的原则，后边先选一个小螺距35，同样的螺距，选大直径18，最后确定1835","tags":[],"bankId":"uav-selected"},{"id":"sel-0531","type":"single","difficulty":1,"stem":"外转子电机规格2208、9T、KV1000分别代表什么含义?","options":[{"key":"A","text":"定子线圈直径22英寸，定子线圈高度8英寸，每分钟转速为1000转"},{"key":"B","text":"定子线圈直径22英寸，定子线圈高度8英寸，每伏特电压能达到的每分钟转速为1000转"},{"key":"C","text":"定子线圈直径22毫米，定子线圈高度8毫米，每伏特电压能达到的每分钟转速为1000转"}],"answer":"C","analysis":"提示：电机毫米，螺旋桨英寸\n解析：2208通常表示电机定子直径为22毫米、定子高度为8毫米；9T表示电机绕组为9匝；KV1000表示电机在空载状态下，每伏电压对应的理论转速约为1000转/分钟。","tags":[],"bankId":"uav-selected"},{"id":"sel-0532","type":"single","difficulty":1,"stem":"常规布局固定翼无人机要实现向左滚转和上仰姿态，舵面的偏转方向应该（）。","options":[{"key":"A","text":"副翼左上右下，升降舵向上偏"},{"key":"B","text":"副翼左上右下，升降舵向下偏"},{"key":"C","text":"副翼左下右上，升降舵向上偏"}],"answer":"A","analysis":"提示：左上右下+向上偏\n解析：舵面操作与结果： 副翼→操作：压左→左副翼偏上；右副翼偏下→左升力↓右升力↑→实现“左滚转” 升降舵→操作：上拉→升降舵上偏→迎角增加升力↑→实现“上仰” 鼠鼠老师小课堂： 1.飞机靠副翼沿着纵轴控制“横滚”动作。 想实现“左滚转”需要“左升力小右升力大” 舵面操作动作为“向左稍压副翼杆量” 会造左副翼向上偏，副翼向下偏，也就是“左上右下” （鼠鼠老师教大家一个秘诀：副翼压谁谁小（升力），压谁谁上（副翼上偏）。 2.拉杆→升降舵上偏→飞机上仰、抬头 推杆→升降舵下偏→飞机低头、俯冲蓝皮书描述：当升降舵推杆,飞机头向下倾斜时,迎角降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0533","type":"single","difficulty":1,"stem":"民用无人机在条件允许的情况下，一般要（）。","options":[{"key":"A","text":"顺风起飞"},{"key":"B","text":"左侧风起飞"},{"key":"C","text":"逆风起飞"}],"answer":"C","analysis":"提示：逆风起降\n解析：起降都应逆风","tags":[],"bankId":"uav-selected"},{"id":"sel-0534","type":"single","difficulty":1,"stem":"在自主飞行过程中，遥控器油门的位置应处于（ ）。","options":[{"key":"A","text":"油门处与中间略上"},{"key":"B","text":"油门处于最下方"},{"key":"C","text":"油门处于最上方"}],"answer":"A","analysis":"提示：油门中间略上\n解析：在自主飞行过程中，遥控器油门的位置应处于油门处与中间略上，这样可以在需要时随时接管控制并进行调整，同时也避免意外触碰导致的错误操作。","tags":[],"bankId":"uav-selected"},{"id":"sel-0535","type":"single","difficulty":1,"stem":"对于直升机、多旋翼无人机的旋翼或固定翼无人机的螺旋桨，保持角速度一定，更换直径较小的旋翼或螺旋桨，会导致（）。","options":[{"key":"A","text":"桨尖速度变大"},{"key":"B","text":"桨尖速度不变"},{"key":"C","text":"桨尖速度减小"}],"answer":"C","analysis":"提示：角速度一定，直径↓桨尖速度↓\n解析：什么是角速度？ 单位时间内转过的角除以时间 就是角速度 直白的说：每秒 / 每分钟转了多大角度，就是角速度。 什么是桨尖速度？ 单位时间内，螺旋桨桨尖运动划过的路程 通俗的记：桨叶最外端转圈跑的快慢 角速度一定→螺旋桨转的快慢一定， 此时螺旋桨尺寸变小了→桨叶最外端单位时间内划过的路程就变小了。 （就比有两个自行车，一个大轮子，一个小轮子，两人同时转一圈，角速度都相同，但是大轮子转一圈走的路程长，也就是桨尖速度更大；小轮子转一圈走的路程短，也就是桨尖速度更小）","tags":[],"bankId":"uav-selected"},{"id":"sel-0536","type":"single","difficulty":1,"stem":"关于失速，下面说法不正确的是（）。","options":[{"key":"A","text":"失速会导致升力系数急剧减小，阻力系数缓慢减小"},{"key":"B","text":"机翼迎角超过临界迎角，导致升力急剧降低的飞行状态称为失速"},{"key":"C","text":"旋翼类无人机前飞速度过快，可能导致后行旋翼出现失速"}],"answer":"A","analysis":"提示：选错的。缓慢×（快不会导致失速，过快会）\n解析：失速与临界迎角密切相关。飞机失速的核心原因就是迎角超过临界迎角。 升力阻力：升力急剧降低、阻力急剧增大。 升力系数阻力系数：升力系数急剧降低、阻力系数急剧增大。 后行桨叶与失速：前飞过快→后行桨叶气流变慢→被迫加大迎角→超临界迎角就失速。 旋翼无人机（直升机）高速前飞时，桨叶分前行、后行两种状态： 前行桨叶顺着飞行方向，相对气流速度变大，升力偏大；后行桨叶迎着飞行反方向，气流速度变小，升力偏小。为了平衡两边升力，飞行器会自动减小前行桨叶迎角、增大后行桨叶迎角。一旦前飞速度过快，后行桨叶迎角会突破临界迎角，气流和桨叶表面分离，直接引发后行旋翼失速，造成升力暴跌、飞机操控和稳定性变差。","tags":[],"bankId":"uav-selected"},{"id":"sel-0537","type":"single","difficulty":1,"stem":"下列说法错误的是？（没有提到的条件则视为相同）","options":[{"key":"A","text":"旋翼直径越大则拉力越大"},{"key":"B","text":"旋翼直径越大则悬停诱导速度越大"},{"key":"C","text":"旋翼直径越大则桨盘载荷越小"}],"answer":"B","analysis":"提示：直径大诱导小\n解析：在悬停拉力相同、空气密度相同的条件下：旋翼直径增大 → 桨盘面积增大 → 诱导速度减小。因此B错了，诱导速度是减小而不是增大","tags":[],"bankId":"uav-selected"},{"id":"sel-0538","type":"single","difficulty":1,"stem":"空气的组成是由（）。","options":[{"key":"A","text":"78%的氮气，21%的氧气以及1%的其它气体组成"},{"key":"B","text":"75%的氮气，24%的氧气以及1%的其它气体组成"},{"key":"C","text":"78%的氮气，20%的氧气以及2%的其它气体组成"}],"answer":"A","analysis":"提示：21%氧气\n解析：大气主要由78%的氮气，21%的氧气以及1%的其它气体组成。这是大气化学中的基本常识，也是地球大气层的主要成分比例","tags":[],"bankId":"uav-selected"},{"id":"sel-0539","type":"single","difficulty":1,"stem":"32华氏度是0摄氏度，那么59华氏度是多少摄氏度？","options":[{"key":"A","text":"0摄氏度"},{"key":"B","text":"27摄氏度"},{"key":"C","text":"15摄氏度"}],"answer":"C","analysis":"提示：（59-32）*0.55=14.85 ，差不多对半\n解析：华氏度与摄氏度之间的转换公式为C=(F-32)*5/9。将59华氏度代入公式，得到C=(59-32)*5/9=15摄氏度。因此，59华氏度等于15摄氏度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0540","type":"single","difficulty":1,"stem":"机场上常用风向袋来估计风速，当风向袋吹平时，风速已达（）。","options":[{"key":"A","text":"6-10米/秒"},{"key":"B","text":"3-4米/秒"},{"key":"C","text":"20-26米/秒"}],"answer":"A","analysis":"提示：跟风速有关都选4级：4级风的风速范围为5.5-7.9米/秒\n解析：根据2015年中国民用航空局机场司发布的《风向标技术要求》4.7风向袋的展开：风向袋从进风口到尾端的锥形设计在风速为7.8m/s时应当能完全打开。","tags":[],"bankId":"uav-selected"},{"id":"sel-0541","type":"single","difficulty":1,"stem":"在风中全马力飞行的固定翼民用无人机，( )。","options":[{"key":"A","text":"顺风逆风地速相同"},{"key":"B","text":"顺风飞行时地速较大"},{"key":"C","text":"逆风飞行时地速较大"}],"answer":"B","analysis":"提示：全马力，顺风地速大\n解析：飞机全马力飞行，顺/逆风 对 地速影响很大。 地速 = 空速 + 风速 ((●'◡'●)鼠鼠老师的话：我们都有认知 不管是飞机还是骑车 走路，在顺风中都更快 在逆风中慢，这个速度是载具相对与地面的速度，所以对于地速的判断就用我们最质朴的直觉就可以 ，顺风快，逆风慢。)","tags":[],"bankId":"uav-selected"},{"id":"sel-0542","type":"single","difficulty":1,"stem":"以下哪个是小型电动无人机常用的动力电池类型？","options":[{"key":"A","text":"Li-Po"},{"key":"B","text":"Ni-MH"},{"key":"C","text":"Ni-Cd"}],"answer":"A","analysis":"提示：锂电池最常用\n解析：小型电动无人机对电池的重量和输出功率要求较高。Li-Po 电池具有质量轻、能量密度高、放电倍率大、单体电压高等特点，能够为电机提供较大的瞬时电流。Ni-MH 和 Ni-Cd 同容量下通常更重、能量密度较低，其中 Ni-Cd 还有明显的记忆效应和镉污染问题。 因此，小型电动无人机通常使用 Li-Po 电池。","tags":[],"bankId":"uav-selected"},{"id":"sel-0543","type":"single","difficulty":1,"stem":"某多旋翼电机标有500KV字样，意义是指（）。","options":[{"key":"A","text":"对应每V电压，电机提供每小时500KV即50万转的转速"},{"key":"B","text":"电机最大耐压500KV"},{"key":"C","text":"对应每V电压，电机提供每分钟500转转速"}],"answer":"C","analysis":"提示：每伏电压 500转\n解析：一个电机的KV值为500，那么当外加电压为1V时，该电机在空载状态下的转速将增加500转/分钟(rpm)。","tags":[],"bankId":"uav-selected"},{"id":"sel-0544","type":"single","difficulty":1,"stem":"监视系统获取民用无人机运行信息的方式包括（）。","options":[{"key":"A","text":"两者都有"},{"key":"B","text":"被动反馈系统（指航空器被雷达、ADS-B系统、北斗等手段从地面进行监视的系统，该反馈信息不经过运营人。）"},{"key":"C","text":"主动反馈系统（指运营人主动将航空器的运行信息发送给监视系统。）"}],"answer":"A","analysis":"提示：两个都有\n解析：监控系统获取民用无人机运行信息的方式主要分为被动反馈系统和主动反馈系统。《轻小无人机运行规定》3.19 主动反馈系统，是指运营人主动将航空器的运行信息发送给监视系统。3.20 被动反馈系统,是指航空器被雷达、ADS-B 系统、北斗等手段从地面进行监视的系统，该反馈信息不经过运营人。","tags":[],"bankId":"uav-selected"},{"id":"sel-0545","type":"single","difficulty":1,"stem":"下列情况下，哪类无人机系统驾驶员不实施管理？","options":[{"key":"A","text":"视距内运行的Ⅱ类无人机"},{"key":"B","text":"超视距运行的Ⅰ类无人机"},{"key":"C","text":"在融合空域运行的Ⅳ级别无人机"}],"answer":"A","analysis":"提示：Ⅰ、Ⅱ类视距内\n解析：Ⅱ类无人机重量较小，整体运行风险较低；“视距内运行”时，驾驶员能够直接观察无人机并及时避障；旧版《民用无人机驾驶员管理规定》明确规定：Ⅰ、Ⅱ类无人机由驾驶员自行负责，无须驾驶员执照管理。","tags":[],"bankId":"uav-selected"},{"id":"sel-0546","type":"single","difficulty":1,"stem":"为保障飞行安全，建议无论是在白天还是夜间，当发动机在运转时就打开（）。","options":[{"key":"A","text":"防撞灯"},{"key":"B","text":"着陆灯"},{"key":"C","text":"航行灯"}],"answer":"A","analysis":"提示：全天开防撞灯\n解析：防撞灯的主要作用是防止航空器在空中或地面相撞。无论是在自天还是夜间，只要发动机在运转，就建议打开防撞灯，以提高航空器的可见性，保障飞行安全。","tags":[],"bankId":"uav-selected"},{"id":"sel-0547","type":"single","difficulty":1,"stem":"对于接入无人机云系统的用户，无须：①向相关部门了解限制区域的划设情况，包括机场障碍物控制面、飞行禁区、未经批准的限制区以及危险区等;②机身需有明确的标识，注明该无人机的型号编号、所有者、联系方式等信息，以便出现坠机情况时能迅速查找到无人机所有者或操作者信息;③运行前需要提前向管制部门提出申请，并提供有效监视手段;④运营人按照CCAR-91部的要求，进行合格审定。","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①②④"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：（本题要注意理解，因为，”无人机云系统“准入制度比较严格，在申请的时候，就应遵守并提交相关资料，①②③④休要遵守并符合。 能接入就意味着该用户条件满足①②③④。 所以“对于已经接入无人机云系统”的用户来说，就不必（无须）再提交相关资料了。） 根据2015年颁布，目前仍有效的《轻小无人机运行规定》10.2 表述： 对于未接入无人机云系统的用户，应向相关部门了解限制区域的划设情况。不得突破机场障碍物控制面、飞行禁区、未经批准的限制区以及危险区等。13.5 对于未接入无人机云系统的用户，其无人机机身需有明确的标识，注明该无人机的型号、编号、所有者联系方式等信息，以便出现坠机情况时能迅速查找到无人机所有者或操作者信息14.1.3 未接入无人机云的民用无人机。运行前需要提前向管制部门提出申请，并提供有效监视手段。15.2 获得试运行批准的无人机云提供商应定期对云系统进行更新扩容，保证其所接入的民用无人机运营人使用方便、数据可靠、低延迟、飞行区域信息实时有效。","tags":[],"bankId":"uav-selected"},{"id":"sel-0548","type":"single","difficulty":1,"stem":"关于“民用航空器国籍”正确的是（）。","options":[{"key":"A","text":"自外国租赁的民用航空器不能申请我国国籍"},{"key":"B","text":"民用航空器可以不进行国籍登记而投入运行"},{"key":"C","text":"民用航空器只能具有一国国籍"}],"answer":"C","analysis":"提示：只能一国国籍\n解析：《中华人民共和国民用航空法》第九条:民用航空器不得具有双重国籍。未注销外国国籍的民用航空器不得在中华人民共和国申请国籍登记。","tags":[],"bankId":"uav-selected"},{"id":"sel-0549","type":"single","difficulty":1,"stem":"从应用上说，涡桨发动机适用于（）。","options":[{"key":"A","text":"中高空长航时无人机"},{"key":"B","text":"高空长航时无人机/无人战斗机"},{"key":"C","text":"中低空、低速短距/垂直起降无人机"}],"answer":"A","analysis":"提示：涡桨-中高长\n解析：涡桨发动机推进效率高且耗油率低，适用于中高空长航时无人机，飞机起飞重量可达3000kg。","tags":[],"bankId":"uav-selected"},{"id":"sel-0550","type":"single","difficulty":1,"stem":"民用无人机上的舵机一般输出行程为（）。","options":[{"key":"A","text":"正负120°"},{"key":"B","text":"正负20°"},{"key":"C","text":"正负10°"}],"answer":"B","analysis":"提示：民用舵机，正负20度\n解析：民用无人机上的舵机一般输出行程为正负20度。舵机能够从其中立位置向两个方向名转动20度，总共覆盖40度的范围。这个输出行程对于大多数无人机飞行控制来说是足够的，因为它允许无人机进行必要的方向调整和姿态控制。","tags":[],"bankId":"uav-selected"},{"id":"sel-0551","type":"single","difficulty":1,"stem":"飞机纵向稳定性是指飞机受到扰动后（）。","options":[{"key":"A","text":"产生绕立轴转动，扰动消失后转角自动回到零"},{"key":"B","text":"产生绕横轴转动，扰动消失后自动回复原飞行姿态"},{"key":"C","text":"产生绕立轴转动，扰动消失后自动回复原飞行姿态"}],"answer":"B","analysis":"提示：稳定性→“恢复原飞行姿态” 航向立，纵向横，横向纵\n解析：飞机的稳定性就是指飞机受到小扰动后，偏离原平衡状态，并在扰动消失后，自动恢复到原平衡状态的特性。 不管题目问的是横向、纵向还是航向，只要选项里出现 “自动恢复原飞行姿态”，就是正确答案。 同时根据口诀“航向立，纵向横，横向纵”找到轴与对应的稳定性 本题纵向横","tags":[],"bankId":"uav-selected"},{"id":"sel-0552","type":"single","difficulty":1,"stem":"超低空无人机任务高度一般在（）之间。","options":[{"key":"A","text":"0-100m"},{"key":"B","text":"100-1000m"},{"key":"C","text":"0-50m"}],"answer":"A","analysis":"提示：100 1k 7k 1.8w\n解析：根据孙毅主编的《无人机驾驶员航空知识手册》1.2无人机的分类:按任务高度分类。 无人机可以分为超低空无人机、低空无人机、中空无人机、高空无人机和超高空无人机。 超低空无人机任务高度一般在0-100m之间, 低空无人机任务高度一般在100-1000m之间, 中空无人机任务高度一般在1000-7000m之间, 高空无人机任务高度一般在7000-18000m之间, 超高空无人机任务高度一般大于18000m。","tags":[],"bankId":"uav-selected"},{"id":"sel-0553","type":"single","difficulty":1,"stem":"Ⅱ类无人机是指（）。","options":[{"key":"A","text":"1kg＜空机质量≤4kg，2kg＜起飞全重≤7kg"},{"key":"B","text":"1.5kg＜空机质量≤7kg，1.5kg＜起飞全重≤15kg"},{"key":"C","text":"1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg"}],"answer":"C","analysis":"提示：空机：Ⅰ0; Ⅱ1.5; Ⅲ 4; Ⅳ15; Ⅺ 116; Ⅻ5700 空机关键数：0kg-1.5kg-4kg-15kg-116kg-5700\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类： I类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"bankId":"uav-selected"},{"id":"sel-0554","type":"single","difficulty":1,"stem":"Ⅱ类无人机是指（）。","options":[{"key":"A","text":"1.5公斤<空机质量≤7kg，1.5公斤<起飞全重≤15kg"},{"key":"B","text":"1.5公斤<空机质量≤4kg，1.5公斤<起飞全重≤7kg，超视距运行的"},{"key":"C","text":"1.5公斤<空机质量≤4kg，1.5公斤<起飞全重≤7kg，视距内运行的"}],"answer":"C","analysis":"提示：视距内\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类： I类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"bankId":"uav-selected"},{"id":"sel-0555","type":"single","difficulty":1,"stem":"近程无人机活动半径在（）。","options":[{"key":"A","text":"15km"},{"key":"B","text":"50-200km"},{"key":"C","text":"15-50km"}],"answer":"C","analysis":"提示：超近 近 短 中 远 15 50 200 800 ＞800\n解析：根据孙毅 主编的《无人机驾驶员航空知识手册》1.2无人机的分类:按活动半径分类,无人机可分为超近程无人机、近程无人机、短程无人机中程无人机和远程无人机。 超近程无人机活动半径在15km以内,近程无人机活动半径在15-50km之间,短程无人机活动半径在50~200km之间,中程无人机活动半径在200~800km之间,远程无人机活动半径大于800km。","tags":[],"bankId":"uav-selected"},{"id":"sel-0556","type":"single","difficulty":1,"stem":"飞行器是否轴数越多载重能力越大？","options":[{"key":"A","text":"是"},{"key":"B","text":"不是"},{"key":"C","text":"不一定"}],"answer":"C","analysis":"提示：不一定\n解析：多轴飞行器的载重能力不仅仅取决于轴的数量，还与电机功率、桨叶尺寸和质量、飞行器的整体结构设计等多种因素有关。","tags":[],"bankId":"uav-selected"},{"id":"sel-0557","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行时，使用哪种模式驾驶员的压力最大?","options":[{"key":"A","text":"GPS模式"},{"key":"B","text":"增稳模式"},{"key":"C","text":"纯手动模式"}],"answer":"C","analysis":"提示：纯手动无额外辅助 手忙脚乱压力大\n解析：多旋翼飞行器飞行时，纯手动模式驾驶员的压力最大。在纯手动模式下，飞行器的所有控制都完全依赖驾驶员的操作，没有自动辅助功能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0558","type":"single","difficulty":1,"stem":"八轴飞行器某个电机发生故障时，对应做出类似停止工作的电机应是（）电机。","options":[{"key":"A","text":"对角"},{"key":"B","text":"俯视顺时针方向下一个"},{"key":"C","text":"俯视逆时针方向下一个"}],"answer":"A","analysis":"提示：对角停\n解析：一个电机故障会造成升力分布不对称并产生倾覆力矩。停止其对角电机，可使升力损失关于飞行器重心对称，减小横滚和俯仰失衡；再由其余正常电机增速补偿总升力，以维持飞行并实施紧急降落。","tags":[],"bankId":"uav-selected"},{"id":"sel-0559","type":"single","difficulty":1,"stem":"4轴飞行器有“X”模式和“+”模式两大类，其中（）。","options":[{"key":"A","text":"“+”模式操纵性好"},{"key":"B","text":"“X”模式操纵性好"},{"key":"C","text":"两种模式操纵性没有区别"}],"answer":"B","analysis":"提示：X操纵好\n解析：“+”模式中，机头正对一根机臂。进行俯仰或横滚时，主要由对应方向上的两个电机增减转速产生控制力矩。“X”模式中，机头位于两根机臂之间。无论俯仰还是横滚，四个电机都具有相应力臂，飞控可以让四个电机共同增减转速。因此，“X”模式的控制力矩分配更均匀，单个电机不容易先达到输出极限，横滚和俯仰控制余量通常更大、响应更灵活。X”模式操纵更好。","tags":[],"bankId":"uav-selected"},{"id":"sel-0560","type":"single","difficulty":1,"stem":"关于拦截网或“天钩”回收以下正确的是（）。","options":[{"key":"A","text":"用拦截网系统回收无人机是目前世界中型无人机较普遍采用的回收方式之一"},{"key":"B","text":"拦截网系统通常由拦截网、能量吸收装置组成"},{"key":"C","text":"能量吸收装置与拦截网相连，其作用是吸收无人机撞网的能量，免得无人机触网后在网上弹跳不停，以致损伤"}],"answer":"C","analysis":"提示：拦截网就是为了避免弹跳，避免天钩损伤。\n解析：拦截网或“天钩”回收系统中，能量吸收装置与拦截网相连，主要作用是吸收无人机撞网时的能量，防止无人机在网上弹跳造成损伤，这是拦截网系统的重要组成部分。","tags":[],"bankId":"uav-selected"},{"id":"sel-0561","type":"single","difficulty":1,"stem":"无人机系统飞行器平台主要使用的是（）空气的动力驱动的航空器。","options":[{"key":"A","text":"轻于"},{"key":"B","text":"重于"},{"key":"C","text":"等于"}],"answer":"B","analysis":"提示：重于空气\n解析：航空器依据获得升力的方式不同分为两大类： 一类是轻于空气的航空器,依靠空气的浮力飘浮于空中,如气球、飞艇等; 一类是重于空气的航空器,包括非动力驱动和动力驱动两种类型。 无人机系统飞行器平台主要使用的是重于空气的动力驱动的航空器。","tags":[],"bankId":"uav-selected"},{"id":"sel-0562","type":"single","difficulty":1,"stem":"属于无人机飞控子系统功能的是（）？","options":[{"key":"A","text":"导航控制"},{"key":"B","text":"任务信息收集与传递"},{"key":"C","text":"无人机姿态稳定与控制"}],"answer":"C","analysis":"提示：飞控子必有姿态\n解析：飞控子系统是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统,对无人机实现全权控制与管理,。飞控子系统主要具有如下功能： (1)无人机姿态稳定与控制; (2)与导航子系统协调完成航迹控制; (3)无人机起飞(发射)与着陆(回收)控制: (4)无人机飞行管理; (5)无人机任务设备管理与控制; (6)应急控制; (7)信息收集与传递。","tags":[],"bankId":"uav-selected"},{"id":"sel-0563","type":"single","difficulty":1,"stem":"以下不是导航飞控系统组成部分的是（）。","options":[{"key":"A","text":"电台"},{"key":"B","text":"执行机构"},{"key":"C","text":"传感器"}],"answer":"A","analysis":"提示：不包括电台\n解析：导航飞控系统的三大核心环节是： 测量——传感器（陀螺、加速度计、GNSS 接收机等） 决策——飞控计算机（导航/控制算法） 执行——执行机构（舵机、电机、电调等） 电台（数据链路终端）只负责“对外通信”，把遥控/遥测数据送出去或接进来，不参与导航解算和飞行控制闭环，因此它不属于导航飞控系统的组成部分。","tags":[],"bankId":"uav-selected"},{"id":"sel-0564","type":"single","difficulty":1,"stem":"不属于无人机飞控计算机任务范畴的是（）。","options":[{"key":"A","text":"姿态稳定与控制"},{"key":"B","text":"自主飞行控制"},{"key":"C","text":"数据中继"}],"answer":"C","analysis":"提示：飞控不管中继\n解析：飞控计算机的核心任务是“算”和“控”。而数据中继是通信概念，指接收一端的数据后再转发给另一端，用于扩大通信距离或连接不同网络，通常由通信链路、数传电台或专门的中继设备完成，不属于飞控计算机的直接任务。","tags":[],"bankId":"uav-selected"},{"id":"sel-0565","type":"single","difficulty":1,"stem":"（）功能通常包括指挥调度、任务规划、操作控制、显示记录等功能。","options":[{"key":"A","text":"数据链路分系统"},{"key":"B","text":"无人机地面站系统"},{"key":"C","text":"飞控与导航系统"}],"answer":"B","analysis":"提示：地面站:指挥控制+任务规划\n解析：无人机地面站系统的功能通常包括指挥调度、任务规划、操作控制、显示记录等功能。 1.指挥调度功能主要包括上级指令接收、系统之间联络、系统内部调度。 2.任务规划功能主要包括飞行航路规划与重规划、任务载荷工作规划与重规划。 3.操作控制功能主要包括起降操纵、飞行控制操作、任务载荷操作、数据链 控制。 4.显示记录功能主要包括飞行状态参数显示与记录、航迹显示与记录、任务载荷信息显示与记录等。","tags":[],"bankId":"uav-selected"},{"id":"sel-0566","type":"single","difficulty":1,"stem":"大气系统热量的主要来源是吸收太阳辐射，下列说法哪个正确？","options":[{"key":"A","text":"当太阳辐射通过大气层时，有24%被大气直接吸收"},{"key":"B","text":"当太阳辐射通过大气层时，有34%被大气直接吸收"},{"key":"C","text":"当太阳辐射通过大气层时，有44%被大气直接吸收"}],"answer":"A","analysis":"提示：24%被吸收\n解析：大气系统热量的主要来源是吸收太阳辐射(短波)。当太阳辐射通过大气层时,有24%被大气直接吸收,31%被大气反射和散射到宇宙空间,余下的45%到达地表。地面吸收其大部分后,又以反射和辐射(长波)的形式回到大气中,大部分被大气吸收。","tags":[],"bankId":"uav-selected"},{"id":"sel-0567","type":"single","difficulty":1,"stem":"接近地面的对流气流会影响驾驶员操控的能力，下列说法哪种正确？","options":[{"key":"A","text":"在一大片水体或者稠密植被的区域之上进近会趋于会产生漂浮效应，导致飞过预期的着陆点"},{"key":"B","text":"在一大片水体或者稠密植被的区域之上进近会趋于产生一个下沉效应，导致着陆在不到预期的着陆点"},{"key":"C","text":"在最后进近时，来自全无植被的地形的下降气流有时会产生下沉效应，导致飞过预期的着陆点"}],"answer":"B","analysis":"提示：一大片水体，不到预期着陆点\n解析：接近地面的对流气流会影响驾驶员操控的能力。在一大片水体或者稠密植被的区域之上进近时，地面的冷却效应，会产生下沉气流，导致飞机下沉，导致不警惕的飞行员着陆在不到预期的着陆点。","tags":[],"bankId":"uav-selected"},{"id":"sel-0568","type":"single","difficulty":1,"stem":"国际标准大气的物理参数的相互关系是（）。","options":[{"key":"A","text":"压力不变时，体积和温度成反比"},{"key":"B","text":"温度不变时，压力与体积成正比"},{"key":"C","text":"体积不变时，压力和温度成正比"}],"answer":"C","analysis":"提示：体积不变，压温正\n解析：PV = nRT，体积不变时，压力和温度成正比压力不变时，体积与温度成正比温度不变时，压力与体积成反比","tags":[],"bankId":"uav-selected"},{"id":"sel-0569","type":"single","difficulty":1,"stem":"按航空气象预报内容分类，以下不正确的是（）。","options":[{"key":"A","text":"气象要素预报"},{"key":"B","text":"天气形势预报"},{"key":"C","text":"大风降温预报"}],"answer":"C","analysis":"提示：选错的。大风降温\n解析：从航空气象角度，天气预报常按内容分为：气象要素预报：如风、温度、能见度等;天气形势预报：如高低压、气旋等天气系统演变;重要天气预报：如雷暴、低能见度、积冰、颠簸等。大风降温预报更像普通公众气象服务中的专项或灾害性天气预报，不是航空角度天气预报的标准分类。","tags":[],"bankId":"uav-selected"},{"id":"sel-0570","type":"single","difficulty":1,"stem":"18000英尺高度的大气重量仅仅是海平面时的（）。","options":[{"key":"A","text":"三分之一"},{"key":"B","text":"一半"},{"key":"C","text":"四分之一"}],"answer":"B","analysis":"提示：一半\n解析：这里的“大气重量”实际指单位面积上方空气柱的重量，也就是大气压力，不是空气密度。根据标准大气压公式计算可得，18000英尺处，上方空气柱的重量约为海平面的 50%。","tags":[],"bankId":"uav-selected"},{"id":"sel-0571","type":"single","difficulty":1,"stem":"根据地面天气图上分析的等压线，我们能观察出（）。","options":[{"key":"A","text":"槽线位置"},{"key":"B","text":"气压梯度"},{"key":"C","text":"降水区域"}],"answer":"B","analysis":"提示：问题对答案，等压对气压\n解析：等压线是连接气压相等各点的曲线。天气图中相邻等压线的气压差通常相等，因此可以根据等压线的疏密程度判断气压梯度的大小：等压线越密，气压梯度越大；等压线越疏，气压梯度越小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0572","type":"single","difficulty":1,"stem":"在大气层内，大气密度（）。","options":[{"key":"A","text":"随高度增加而减小"},{"key":"B","text":"随高度增加而增加"},{"key":"C","text":"在同温层内随高度增加保持不变"}],"answer":"A","analysis":"提示：海拔高，密度低，要吸氧\n解析：在重力作用下，越靠近地面，上方空气柱的重量越大，空气受到的压缩越强，因此密度较大；高度增加后，大气压力降低，空气密度随之减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0573","type":"single","difficulty":1,"stem":"对流层（）的空气运动受地形扰动和地表摩擦作用最大，气流混乱。","options":[{"key":"A","text":"下层"},{"key":"B","text":"中层"},{"key":"C","text":"上层"}],"answer":"A","analysis":"提示：下层与地表接触，有摩擦\n解析：对流层的下层越靠近地面，越容易受到地形起伏、建筑物、地表粗糙度和摩擦作用影响，因此空气运动最不规则，湍流和乱流也更明显。","tags":[],"bankId":"uav-selected"},{"id":"sel-0574","type":"single","difficulty":1,"stem":"严重危害飞行安全的冰雹通常与下列何种云有联系？","options":[{"key":"A","text":"堡状高积云"},{"key":"B","text":"普通雷暴"},{"key":"C","text":"强烈雷暴云"}],"answer":"C","analysis":"提示：强烈严重危害\n解析：冰雹的形成需要强烈的上升气流，把水滴反复带到高空冻结、增长，所以通常和发展旺盛的积雨云／强雷暴云有关。普通雷暴也可能有小冰雹，但“严重危害飞行安全的冰雹”一般对应的是强烈雷暴云。","tags":[],"bankId":"uav-selected"},{"id":"sel-0575","type":"single","difficulty":1,"stem":"当来自北方的冷气团和来自南方的暖气团，两者势均力敌、强度相当时，它们的交锋区很少移动，这种锋面称为（）。","options":[{"key":"A","text":"融合锋"},{"key":"B","text":"静止锋"},{"key":"C","text":"交错锋"}],"answer":"B","analysis":"提示：很少移动，就是静止\n解析：当来自北方的冷气团和来自南方的暖气团两者势均力敌、强度相当时。它们的交锋区很少移动。这种锋面称为静止锋。春季、初夏(梅雨)和秋季的连阴雨天气和梅雨天气就是受静止锋影响而造成的。","tags":[],"bankId":"uav-selected"},{"id":"sel-0576","type":"single","difficulty":1,"stem":"雷暴到达成熟阶段以后，随着积雨云中迅速下沉的冷空气到达地面后，风向突转，风力迅速增大，阵风风速常在（）。","options":[{"key":"A","text":"30m/s"},{"key":"B","text":"10m/s"},{"key":"C","text":"20m/s"}],"answer":"C","analysis":"提示：雷暴20\n解析：雷暴处于发展阶段时,地面风很小;雷暴到达成熟阶段以后,随着积雨云中迅速下沉的冷空气到达地面后,风向突转,风力迅速增大,阵风风速常在20m/s,有时强烈的可以达到25m/s或以上,这种现象常常是雷雨即将来临的先兆;随着雷暴的远离,当地风力迅速减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0577","type":"single","difficulty":1,"stem":"雷暴对飞机产生很大危害，下列危害不确切的是（）。","options":[{"key":"A","text":"数据链中断"},{"key":"B","text":"风切变和湍流"},{"key":"C","text":"雷击和冰雹袭击"}],"answer":"A","analysis":"提示：数据链中断因为设备坏了，跟雷暴无关\n解析：雷暴能产生对飞机危害很大的电闪雷击和冰雹袭击、风切变和湍流，使飞机颜簸、性能降低, 数据链中断属于技术或设备故障，不是雷暴直接导致的危害。","tags":[],"bankId":"uav-selected"},{"id":"sel-0578","type":"single","difficulty":1,"stem":"（干洁）空气的主要组成是（）。","options":[{"key":"A","text":"78%的氮气，21%的氧气以及1%的其他气体"},{"key":"B","text":"75%的氮气，24%的氧气以及1%的其他气体"},{"key":"C","text":"78%的氮气，20%的氧气以及2%的其他气体"}],"answer":"A","analysis":"提示：21%氧气\n解析：干洁空气主要由氮气、氧气和少量其他气体组成。其中氮气约占78%，氧气约占21%，氩气、二氧化碳等其他气体约占1%。水汽含量变化较大，通常不计入干洁空气组成。","tags":[],"bankId":"uav-selected"},{"id":"sel-0579","type":"single","difficulty":1,"stem":"机场上空高度较低的云会直接影响飞机的起降。其中，危害最大的云是（）。","options":[{"key":"A","text":"卷状云"},{"key":"B","text":"层状云"},{"key":"C","text":"对流云"}],"answer":"C","analysis":"提示：对流云危害最大\n解析：机场上空高度较低的云会使飞行员看不清跑道,直接影响飞机的起降。 其中,危害最大的云是对流云。 飞机一旦进入，易遭到电击，使仪表失灵，油箱爆炸，或者造成强烈颠簸、结冰，使操纵失灵,发生飞行事故。","tags":[],"bankId":"uav-selected"},{"id":"sel-0580","type":"single","difficulty":1,"stem":"目视判断风切变的参照物，以下不正确的是（）。","options":[{"key":"A","text":"雷暴云体下垂的雨幡"},{"key":"B","text":"雷暴冷性外流气流的尘卷风（云）"},{"key":"C","text":"卷积云带来的降雨"}],"answer":"C","analysis":"提示：选错的。最短的，卷积云不具有代表性\n解析：飞行员判断和识别低空风切变，如采用目测法，有三个主要参照物：1、雷暴冷性外流气流的尘卷风(云)2、滚轴状云3、雷暴云体下垂的雨幡卷积云属于高云，通常不产生降雨，也不是判断低空风切变的典型参照物。","tags":[],"bankId":"uav-selected"},{"id":"sel-0581","type":"single","difficulty":1,"stem":"风向为SE，那么风的来向为（）。","options":[{"key":"A","text":"西北"},{"key":"B","text":"西南"},{"key":"C","text":"东南"}],"answer":"C","analysis":"提示：SE→东南（ESWN东南西北）\n解析：气象上的风向指的风吹来的方向，也即风的来向。风向为 SE，表示风从 SE方向吹来。 S代表南，E代表东，即风的来向为东南。","tags":[],"bankId":"uav-selected"},{"id":"sel-0582","type":"single","difficulty":1,"stem":"某个风力标志箭头长的像“F”，并且两个横杠一样长，代表（）。","options":[{"key":"A","text":"2级风"},{"key":"B","text":"3级风"},{"key":"C","text":"4级风"}],"answer":"C","analysis":"提示：F4\n解析：在气象上，一条长风尾代表4m/s的风，一条短风尾代表2m/s的风。两根长风羽代表8m/s的风。根据风力等级表，四级风的风速范围为5.5-7.9m/s，严格来讲，8m/s的风速属于五级风。不过在实际应用方面，尤其是在公共服务、科普宣传方面，0.1m/s的风速差异微乎其微，甚至难以精确测量，8m/s的符号与7.9m/s的四级风上限接近。","tags":[],"bankId":"uav-selected"},{"id":"sel-0583","type":"single","difficulty":1,"stem":"一般我们说的4级风，风速为（）。","options":[{"key":"A","text":"8.0-10.7m/s"},{"key":"B","text":"10.8-13.8m/s"},{"key":"C","text":"5.5-7.9m/s"}],"answer":"C","analysis":"提示：每级风2m/s\n解析：按照气象、航海、航空等领域通用的风级评定标准 ，4级风为和风，风速范围通常是：5.5～7.9 m/s","tags":[],"bankId":"uav-selected"},{"id":"sel-0584","type":"single","difficulty":1,"stem":"气象学中，能见度常用气象光学视程表示，气象光学视程是指（）。","options":[{"key":"A","text":"白炽灯发出色温为2700K的平行光束的光通量，在大气中削弱至初始值的5%所通过的路径长度"},{"key":"B","text":"白炽灯发出色温为2500K的平行光束的光通量，在大气中削弱至初始值的5%所通过的路径长度"},{"key":"C","text":"白炽灯发出色温为3000K的平行光束的光通量，在大气中削弱至初始值的10%所通过的路径长度"}],"answer":"A","analysis":"提示：白炽2700\n解析：气象光学视程是能见度的标准化物理定义，用来表示光在大气中因散射和吸收而衰减的距离。按定义，它指色温为2700K的白炽灯发出的平行光束，其光通量在大气中削弱到初始值5%时所通过的路径长度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0585","type":"single","difficulty":1,"stem":"能见度，是反映大气透明度的一个指标，测量大气能见度的错误方法（）。","options":[{"key":"A","text":"使用大气透射仪"},{"key":"B","text":"使用激光能见度自动测量仪"},{"key":"C","text":"用望远镜目测"}],"answer":"C","analysis":"提示：选错的。目测直接看，不用望远镜\n解析：测量大气能见度的科学方法通常使用专业仪器，如大气透射仪或激光能见度自动测量仪。用望远镜目测是一种非标准、不准确的方法，因此是错误的。能见度，是反映大气透明度的一个指标。航空界定义为具有正常视力的人在当时的天气条件下能够看清楚日标轮廓的最大距离。测量大气能见度一般可用目测的方法，也可以使用大气透射仪、激光能见度自动测量仪等测量仪器测试。 （可直接目测，但人工目测一般是用肉眼识别已知距离的目标物，不是用望远镜。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0586","type":"single","difficulty":1,"stem":"国际上对以下哪些能见度定义是正确的？","options":[{"key":"A","text":"烟雾的能见度定义为不足1km"},{"key":"B","text":"霾的能见度为3-5km"},{"key":"C","text":"薄雾的能见度为1-3km"}],"answer":"A","analysis":"提示：烟雾不足1\n解析：国际上对烟雾的能见度定义为不足1km薄雾的能见度为1-2km,霾的能见 度为2-5km。","tags":[],"bankId":"uav-selected"},{"id":"sel-0587","type":"single","difficulty":1,"stem":"在重要天气预告图上用黑色的断线围起来的区域，表示有（）。","options":[{"key":"A","text":"晴天积云"},{"key":"B","text":"西风急流"},{"key":"C","text":"晴空颠簸"}],"answer":"C","analysis":"提示：黑色颠簸\n解析：晴空颠簸(Clear Air Turbulence)在重要天气预告图（WAS）图上用黑色断线(虚线)围成区域表示。 这是国际通用的航空气象符号，用于提醒飞行员该区域可能存在无云情况下的气流颠簸。","tags":[],"bankId":"uav-selected"},{"id":"sel-0588","type":"single","difficulty":1,"stem":"绝对温度的零度是（）。","options":[{"key":"A","text":"-273℃"},{"key":"B","text":"-273K"},{"key":"C","text":"-273℉"}],"answer":"A","analysis":"提示：温度找摄氏度，摄氏度℃。\n解析：在理想情况下，温度降低到这个点时，分子热运动达到最低极限，不能再继续降低。 所以开尔文温标把这个最低点规定为 0 K。 开尔文温标和摄氏温标的零点不同 ， 经过换算，0 K ≈ -273℃","tags":[],"bankId":"uav-selected"},{"id":"sel-0589","type":"single","difficulty":1,"stem":"对流层中的平均气温垂直递减率为（）。","options":[{"key":"A","text":"0.5℃/100 m"},{"key":"B","text":"6.5℃/100 m"},{"key":"C","text":"0.65℃/100 m"}],"answer":"C","analysis":"提示：100米 ↓ 0.65 ℃\n解析：气温随高度升高面降低。根据实际探测，对流层中的平均气温垂直递减率为0.65℃/100m。","tags":[],"bankId":"uav-selected"},{"id":"sel-0590","type":"single","difficulty":1,"stem":"在实际运用中，通常用气温垂直递减率，单位是（）。","options":[{"key":"A","text":"℃/1000m"},{"key":"B","text":"℃/500m"},{"key":"C","text":"℃/100m"}],"answer":"C","analysis":"提示：γ=0.65℃/100m\n解析：气温垂直递减率表示气温随高度升高而降低的快慢。在航空气象实际运用中，常用每升高100m气温降低多少摄氏度表示，单位为℃/100m。","tags":[],"bankId":"uav-selected"},{"id":"sel-0591","type":"single","difficulty":1,"stem":"在标准大气中，海平面上的气温和气压值是（）。","options":[{"key":"A","text":"15℃、1000 hPa"},{"key":"B","text":"0℃、760 mmHg"},{"key":"C","text":"15℃、1013.25 hPa"}],"answer":"C","analysis":"提示：15度1013\n解析：目前，由国际民航组织统一采用的标准海平面大气压力定义为29.92in.Hg(气压1013.25hPa)，海平面温度为59℉(15℃)。","tags":[],"bankId":"uav-selected"},{"id":"sel-0592","type":"single","difficulty":1,"stem":"雾通常发生在接近地面的空气温度冷却到空气的露点时，是从地表开始（）。","options":[{"key":"A","text":"50英尺内的云"},{"key":"B","text":"80英尺内的云"},{"key":"C","text":"100英尺内的云"}],"answer":"A","analysis":"提示：雾-50英尺的云\n解析：雾是从地表开始50ft（英尺）内的云。它通常发生在接近地面的空气温度冷却到空气的露点时。这时，空气中的水蒸气凝结，变成雾这种可见的形式。","tags":[],"bankId":"uav-selected"},{"id":"sel-0593","type":"single","difficulty":1,"stem":"不属于云对安全飞行产生不利影响的原因是( )。","options":[{"key":"A","text":"影响正常的目测"},{"key":"B","text":"温度低造成机翼表面结冰"},{"key":"C","text":"增加阻力"}],"answer":"C","analysis":"提示：云阻力忽略不计\n解析：云对安全飞行的不利影响主要有：1、影响目测和能见度2、可能造成结冰3、可能伴随颠簸、雷暴等危险天气飞机阻力主要由速度、迎角、外形、空气密度等决定，“增加阻力”不是云对安全飞行产生不利影响的主要原因。","tags":[],"bankId":"uav-selected"},{"id":"sel-0594","type":"single","difficulty":1,"stem":"空气的密度（）。","options":[{"key":"A","text":"与压力无关"},{"key":"B","text":"与压力成正比"},{"key":"C","text":"与压力成反比"}],"answer":"B","analysis":"提示：密度压力正比\n解析：按气体状态方程：ρ=p/RT （ρ 为空气密度，p为气压，T为绝对温度，R为气体常数）（在温度一定时）空气密度与气压成正比","tags":[],"bankId":"uav-selected"},{"id":"sel-0595","type":"single","difficulty":1,"stem":"当速度增加而诱导阻力减少时（）。","options":[{"key":"A","text":"形阻减少了"},{"key":"B","text":"蒙皮摩阻减少了"},{"key":"C","text":"蒙皮摩阻增加了"}],"answer":"C","analysis":"提示：速度加，蒙皮阻力加\n解析：总阻力=诱导阻力+废阻力（蒙皮摩擦阻力+压差阻力+干扰阻力) 思路1：根据阻力公式，速度增加阻力也增加，总阻力增加，但诱导阻力减少，那么其他阻力肯定增加。 思路2：不管诱导阻力增加还是减少，只要速度快了，摩擦阻力就会增加。","tags":[],"bankId":"uav-selected"},{"id":"sel-0596","type":"single","difficulty":1,"stem":"飞机下滑距离（）。","options":[{"key":"A","text":"与下滑高度有关"},{"key":"B","text":"与下滑角无关"},{"key":"C","text":"与下滑高度无关"}],"answer":"A","analysis":"提示：有关\n解析：飞机下滑距离主要由下滑高度和下滑角共同决定。 下滑距离既与下滑高度有关，也与下滑角有关","tags":[],"bankId":"uav-selected"},{"id":"sel-0597","type":"single","difficulty":1,"stem":"下列关于压差阻力哪种说法是正确的?","options":[{"key":"A","text":"物体的最大迎风面积越大，压差阻力越小"},{"key":"B","text":"物体形状越接近流线型，压差阻力越大"},{"key":"C","text":"物体的最大迎风面积越大，压差阻力越大"}],"answer":"C","analysis":"提示：压差阻力→迎风面积\n解析：压差阻力主要来自物体前后压力差。物体迎风面积越大，气流分离和尾流区通常越明显，前后压力差造成的阻力也越大。（物体越接近流线型，气流分离越小，压差阻力越小）","tags":[],"bankId":"uav-selected"},{"id":"sel-0598","type":"single","difficulty":1,"stem":"当无人机的迎角为临界迎角时（）。","options":[{"key":"A","text":"飞行速度最大"},{"key":"B","text":"升力系数最大"},{"key":"C","text":"阻力最小"}],"answer":"B","analysis":"提示：临界仰角，升力最大\n解析：因是迎角增大时，机翼升力系数通常会随之增大；当迎角增大到临界迎角时，升力系数达到最大值。再继续增大迎角，就会失速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0599","type":"single","difficulty":1,"stem":"以下关于翼型相对厚度和相对弯度正确的是?","options":[{"key":"A","text":"翼型相对厚度越大，相对弯度就越大，能产生的升力就越大"},{"key":"B","text":"翼型中弧线的最高点距弦线的最大距离与翼弦长的比值称为相对弯度"},{"key":"C","text":"翼型上下表面垂直于翼弦的距离最长的距离值称为相对厚度"}],"answer":"B","analysis":"提示：相对都是比值\n解析：相对厚度：又称厚弦比，是翼型最大厚度与翼弦长度的比值。相对弯度：是翼型中弧线距翼弦线的最大距离与翼弦长度的比值。","tags":[],"bankId":"uav-selected"},{"id":"sel-0600","type":"single","difficulty":1,"stem":"没有保护好飞机表面的光洁度，将增加飞机的哪种阻力?","options":[{"key":"A","text":"压差阻力"},{"key":"B","text":"摩擦阻力"},{"key":"C","text":"干扰阻力"}],"answer":"B","analysis":"提示：摩擦阻力→大气粘性+粗糙表面+接触面\n解析：飞机表面不光洁，例如出现污物、划痕、凸起或粗糙，会增大空气与飞机表面之间的摩擦，从而增加摩擦阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0601","type":"single","difficulty":1,"stem":"不稳定运动状态与稳定运动或者静止状态的情况不同之处就是多了（）。","options":[{"key":"A","text":"速度"},{"key":"B","text":"加速度"},{"key":"C","text":"重力加速度"}],"answer":"B","analysis":"提示：不稳定→加速度\n解析：平衡是事物一种非常普遍的状态。不稳定运动状态与稳定运动或者静止状态的情况的不同之处就是多了加速度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0602","type":"single","difficulty":1,"stem":"飞机的迎角是（）。","options":[{"key":"A","text":"飞机纵轴与水平面的夹角"},{"key":"B","text":"飞机翼弦与水平面的夹角"},{"key":"C","text":"飞机翼弦与相对气流的夹角"}],"answer":"C","analysis":"提示：迎角，旋翼和相对气流之间的夹角\n解析：迎角是飞机翼弦与相对气流方向之间的夹角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0603","type":"single","difficulty":1,"stem":"飞行侧滑角为（）。","options":[{"key":"A","text":"飞机纵轴与水平面的夹角"},{"key":"B","text":"飞行速度与水平面的夹角"},{"key":"C","text":"空速向量与飞机对称面的夹角"}],"answer":"C","analysis":"提示：侧滑找对称面\n解析：飞机产生侧滑时，空气从飞机侧方吹来，这时，相对气流方向和飞机对称面之间就有一个侧滑角β。相对气流从左前方吹来叫左侧滑,相对气流从右前方吹来叫右侧滑。","tags":[],"bankId":"uav-selected"},{"id":"sel-0604","type":"single","difficulty":1,"stem":"飞机进行的匀速俯冲拉起飞行，则（）。","options":[{"key":"A","text":"速度不发生变化"},{"key":"B","text":"是在平衡外载荷作用下进行的飞行"},{"key":"C","text":"飞行速度方向的变化是由于存在着向心力"}],"answer":"C","analysis":"提示：存在向心力\n解析：飞机匀速俯冲拉起时，速度大小保持不变，但方向不断变化。速度方向的改变需要向心加速度，因此必须存在指向曲线航迹内侧的向心力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0605","type":"single","difficulty":1,"stem":"飞机在地面效应区时，引起的气动力变化是（）。","options":[{"key":"A","text":"升力增大、阻力减小"},{"key":"B","text":"升力减小、阻力增大"},{"key":"C","text":"升力增大、阻力增大"}],"answer":"A","analysis":"提示：地面效应，升大阻小\n解析：飞机接近地面飞行时，地面会限制机翼下洗气流，削弱翼尖涡，使下洗速度和诱导迎角减小。因此，在迎角等条件相同时：机翼升力增大；诱导阻力减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0606","type":"single","difficulty":1,"stem":"下列叙述与飞机的正常盘旋飞行无关的是（）。","options":[{"key":"A","text":"保持飞行高度不变"},{"key":"B","text":"保持飞机作圆周飞行"},{"key":"C","text":"保持飞机等速直线飞行"}],"answer":"C","analysis":"提示：选错的。盘旋弧线飞，不是直线\n解析：正常盘旋是飞机保持高度，沿圆周或近似圆周航迹进行的曲线飞行，不属于等速直线×飞行","tags":[],"bankId":"uav-selected"},{"id":"sel-0607","type":"single","difficulty":1,"stem":"具有正静安定性的飞机，当受到扰动使平衡状态变化后，有（）。","options":[{"key":"A","text":"回到原平衡状态的趋势"},{"key":"B","text":"继续偏离离原平衡状态的趋势"},{"key":"C","text":"保持偏离后的平衡状态"}],"answer":"A","analysis":"提示：正静回，负静偏\n解析：具有正静安定性→受到扰动导致平衡状态变化后→有回到原平衡状态的趋势具有负静安定性→受到扰动导致平衡状态变化后→有偏离原平衡状态的趋势","tags":[],"bankId":"uav-selected"},{"id":"sel-0608","type":"single","difficulty":1,"stem":"飞机从已建立的平衡状态发生偏离，若（），则飞机表现出正动安定性。","options":[{"key":"A","text":"飞机振荡的振幅减小使飞机回到原来的平衡状态"},{"key":"B","text":"飞机振荡的振幅持续增大"},{"key":"C","text":"飞机振荡的振幅不增大也不减小"}],"answer":"A","analysis":"提示：负大正恢复\n解析：具有正静安定性→受到扰动导致平衡状态变化后→有回到原平衡状态的趋势具有负静安定性→受到扰动导致平衡状态变化后→有偏离原平衡状态的趋势（题干表述有时为 正“动”安定性，有时为 正“精”安定性，不管是正是负，回到原状态就是“正”）","tags":[],"bankId":"uav-selected"},{"id":"sel-0609","type":"single","difficulty":1,"stem":"起飞时，可操纵变距螺旋桨的桨叶角到什么状态?","options":[{"key":"A","text":"小桨叶角及低转速"},{"key":"B","text":"大桨叶角及高转速"},{"key":"C","text":"小桨叶角及高转速"}],"answer":"C","analysis":"提示：起飞，小角高速（小高）\n解析：起飞时需要发动机和螺旋桨提供较大功率与拉力，因此可操纵变距螺旋桨通常调整为：小桨叶角：减小桨叶旋转阻力，使发动机容易提高转速；高转速：有利于发挥起飞功率并产生较大的起飞拉力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0610","type":"single","difficulty":1,"stem":"电调是多旋翼无人机最重要的部件之一，不属于飞行器电调功能的是（）。","options":[{"key":"A","text":"变压供电"},{"key":"B","text":"调节电机转速"},{"key":"C","text":"实现电机反转"}],"answer":"C","analysis":"提示：选错的。反转不是功能\n解析：电调的四个主要功能为：直流变交流、给电机变压供电、调节电机转速与扭矩、接收和反馈控制信号。 以上都是电调的主动功能。 虽然调换电调连接电机3跟线中的两个能实现电机反转，但这是被动的连接效果，并不是电调有主动的 “反转控制” 功能，电调本身没有专门的控制模块或者信号来主动让电机反转，所以不属于电调的功能。本题记忆关键字：反转不是功能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0611","type":"single","difficulty":1,"stem":"某多旋翼电调上有BEC 5V字样，意思是指（）。","options":[{"key":"A","text":"电调需要从较粗的红线与黑线输入5V的电压"},{"key":"B","text":"电调能从较粗的红线与黑线向外输出5V的电压"},{"key":"C","text":"电调能从较细的红线与黑线向外输出5V的电压"}],"answer":"C","analysis":"提示：细线红黑\n解析：动力电机的调速系统称为电调,全称为电子调速器。 电调一般有电源输出功能(BEC),即在信号线的正负极之间有5V左右的电压输出,通过信号线为接收机及舵机供电。 电调向外输出 5V 供电时，电流偏小、负载轻，直接使用红黑细导线接线即可，无需粗线。","tags":[],"bankId":"uav-selected"},{"id":"sel-0612","type":"single","difficulty":1,"stem":"经测试，某多旋翼飞行器稳定飞行时，动力电池的持续输出电流为10安培，该多旋翼可以选用（）。","options":[{"key":"A","text":"50A的电调"},{"key":"B","text":"15A的电调"},{"key":"C","text":"10A的电调"}],"answer":"A","analysis":"提示：电池电调（5选30）（10选50）\n解析：核心逻辑： 电源能给的> 控制器能扛的 > 负载峰值要的 ≥ 负载平时用的 电源最大放电电流>电调＞3-5倍稳定电流≥动力电池持续输出电流 知识点1：电调额定电流的安全冗余设计 电调的额定持续电流，必须大于飞行器的最大可能工作电流（含稳定飞行 + 突发工况的峰值），且必须预留充足安全冗余。 因为实际飞行中，飞行器会遇到机动飞行、大风、负载变化等情况，电流会瞬间大幅超过悬停 / 稳定飞行的电流（通常可达悬停电流的 2~4 倍甚至更高）。 因此，如电机持续输出电流为5A/10A ，选用的电调要比电机高3-5倍的裕度，也就是5A选15-25 10A选30-50A。 -------------------------------------------- 本题与另一提知识点容易混淆，做个区分 -------------------------------------------- 知识点2：电池放电能力需大于电调额定电流 电池的最大放电能力，必须大于电调的额定电流，否则会出现 “电池拖不动电调” 的情况。 电调的额定电流，是它能从电池中 “抽取” 的最大持续电流；而电池的最大持续放电电流，必须大于电调的额定电流，才能保证有这么多的稳定电流可被抽取，否则会出现两个严重问题： ①电池无法提供足够电流，导致动力不足、电压骤降，飞行器失控。 ②电池长期超负荷放电，会过热、鼓包甚至起火，存在严重安全隐患。 因此，如电调标有60A，必须选用大于60A（最大放电能力）的电池，才能带来持续稳定的与电调电机相匹配的电流。","tags":[],"bankId":"uav-selected"},{"id":"sel-0613","type":"single","difficulty":1,"stem":"某多旋翼飞行器动力电池标有22.2V，是（）。","options":[{"key":"A","text":"6S锂电池"},{"key":"B","text":"22.2S锂电池"},{"key":"C","text":"3S锂电池"}],"answer":"A","analysis":"提示：22.2/3.7=6\n解析：单节锂聚合物电池的标称电压通常为3.7V22.2/3.7=6串联电流不变，电压叠加因此，22.2V表示由6节电芯串联组成，即6S锂电池。","tags":[],"bankId":"uav-selected"},{"id":"sel-0614","type":"single","difficulty":1,"stem":"以下哪个是小型电动无人机常用的动力电池类型？","options":[{"key":"A","text":"银锌电池"},{"key":"B","text":"锂电池"},{"key":"C","text":"铅酸电池"}],"answer":"B","analysis":"提示：锂电池最常用\n解析：小型电动无人机对电池的重量和输出功率要求较高。锂电池具有质量轻、能量密度高、放电倍率大、单体电压高等特点，能够为电机提供较大的瞬时电流。银锌电池成本较高，铅酸电池重量较大，通常不适合作为小型无人机的动力电池。 因此，小型电动无人机通常使用锂电池。","tags":[],"bankId":"uav-selected"},{"id":"sel-0615","type":"single","difficulty":1,"stem":"以下电池类型中，记忆效应最强的是（）。","options":[{"key":"A","text":"锂电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"镍氢电池"}],"answer":"B","analysis":"提示：记忆效应镍镉\n解析：镍镉电池具有较明显的记忆效应。如果经常在电量未完全释放时充电，可能出现可用容量降低的现象。 锂电池没有记忆效应。镍氢电池也可能出现较轻微的类似现象，但远弱于镍镉电池。","tags":[],"bankId":"uav-selected"},{"id":"sel-0616","type":"single","difficulty":1,"stem":"以下哪种动力电池放电电流最大?","options":[{"key":"A","text":"30000mAh，5C"},{"key":"B","text":"2Ah，30C"},{"key":"C","text":"20000mAh，5C"}],"answer":"A","analysis":"提示：mAh换算Ah，乘以C （2*30；30*5；20*5）\n解析：根据最大放电电流计算公式：Imax=容量（Ah） x 放电倍率（C）将选项数值毫安时mah，换算成安时Ah，乘以放电倍率，对比结果，谁的数值大，谁的放电电流就大30000mAh = 30Ah→30 x 5= 150A √最大2x30=60A20000mAh = 20Ah →20 x 5 = 100A","tags":[],"bankId":"uav-selected"},{"id":"sel-0617","type":"single","difficulty":1,"stem":"某多旋翼动力电池容量为10Ah，表示（）。","options":[{"key":"A","text":"理论上，以10mA电流放电，可放电1小时"},{"key":"B","text":"理论上，以10000mA电流放电，可放电1小时"},{"key":"C","text":"理论上，以10A电流放电，可放电10小时"}],"answer":"B","analysis":"提示：1Ah=1000mAh\n解析：理论放电时间可按下式计算：t=电池容量（Ah）/ 放电电流（A）以题干中 10A=10000mA 放电：t=电池容量（Ah）/ 放电电流（A）= 10Ah / 10A=1h","tags":[],"bankId":"uav-selected"},{"id":"sel-0618","type":"single","difficulty":1,"stem":"某多旋翼动力电池容量为8000mAh(8Ah)，表示()。","options":[{"key":"A","text":"理论上，以8A电流放电，可放电1小时"},{"key":"B","text":"理论上，以80A电流放电，可放电1小时"},{"key":"C","text":"理论上，以8000A电流放电，可放电1小时"}],"answer":"A","analysis":"提示：1A=1000mA\n解析：1Ah=1000mAh，8000mAh的电池容量等于8Ah，以8A电流放电，可放电1小时。理论放电时间可按下式计算：t=电池容量（Ah）/ 放电电流（A）以题干中电池容量 8000mAh=8Ah 放电：t=电池容量（Ah）/ 放电电流（A）= 8Ah / 8A=1h","tags":[],"bankId":"uav-selected"},{"id":"sel-0619","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行中，图像叠加OSD信息显示的电压一般为电池的（）。","options":[{"key":"A","text":"空载电压"},{"key":"B","text":"负载电压"},{"key":"C","text":"已使用电压"}],"answer":"B","analysis":"提示：飞行中负载中\n解析：多旋翼在飞行过程中，动力电池正在为电机、飞控等设备供电，OSD显示的是电池在带负载工作状态下的实时端电压，因此属于负载电压。","tags":[],"bankId":"uav-selected"},{"id":"sel-0620","type":"single","difficulty":1,"stem":"相对于传统直升机，多旋翼最大的优势是（）。","options":[{"key":"A","text":"气动效率高"},{"key":"B","text":"结构与控制简单"},{"key":"C","text":"载重能力强"}],"answer":"B","analysis":"提示：优势→简单\n解析：相对于传统直升机，多旋翼通常不需要复杂的旋翼变距机构和尾桨机构，主要通过调节各电机转速来控制姿态，因此机械结构和操纵方式相对简单。但这不等于飞控算法简单。","tags":[],"bankId":"uav-selected"},{"id":"sel-0621","type":"single","difficulty":1,"stem":"打开后缘襟翼既能增大机翼切面的弯曲度，又能增加机翼的面积，继而提高飞机的升力系数，这种襟翼被叫做（）。","options":[{"key":"A","text":"分裂式襟翼"},{"key":"B","text":"简单式襟翼"},{"key":"C","text":"后退式襟翼"}],"answer":"C","analysis":"提示：后退\n解析：后退式襟翼放下时会向后移动，既增大机翼弯度，也增大有效翼面积，从而提高升力系数。简单式襟翼和分裂式襟翼放下时主要改变翼型弯度，不能像后退式襟翼那样明显增加翼面积。","tags":[],"bankId":"uav-selected"},{"id":"sel-0622","type":"single","difficulty":1,"stem":"在飞机进行俯冲拉起过程中，飞机的升力（）。","options":[{"key":"A","text":"为飞机的曲线运动提供向心力"},{"key":"B","text":"等于飞机的重量"},{"key":"C","text":"大于飞机的重量并一直保持不变"}],"answer":"A","analysis":"提示：问题对答案，升力找向心力\n解析：俯冲拉起时，飞机的速度方向不断改变，需要指向弯曲航迹内侧的合力。升力是产生这个向心合力的主要作用力。(在拉起航迹的最低点，升力大于飞机重量；拉起过程中，升力会随速度、飞行轨迹等条件变化)","tags":[],"bankId":"uav-selected"},{"id":"sel-0623","type":"single","difficulty":1,"stem":"相同迎角，飞行速度增大一倍，阻力增加约为原来的（）。","options":[{"key":"A","text":"一倍"},{"key":"B","text":"二倍"},{"key":"C","text":"四倍"}],"answer":"C","analysis":"提示：相同迎角，速度跟阻力1:4\n解析：根据阻力的计算公式， （在空气密度和迎角不变、阻力系数近似不变时）阻力与飞行速度的平方成正比。速度增大到原来的2倍，阻力约为原来的4倍。","tags":[],"bankId":"uav-selected"},{"id":"sel-0624","type":"single","difficulty":1,"stem":"飞机的下滑角是（）。","options":[{"key":"A","text":"升力与阻力的夹角"},{"key":"B","text":"飞行轨迹与水平面的夹角"},{"key":"C","text":"阻力与重力的夹角"}],"answer":"B","analysis":"提示：下滑有轨迹\n解析：下滑角是飞机下滑时，向下倾斜的飞行轨迹与水平面之间的夹角。它描述的是飞机沿什么方向下降，不是两个作用力之间的夹角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0625","type":"single","difficulty":1,"stem":"操纵无人机时，若迎角超过临界迎角，升力系数会（）。","options":[{"key":"A","text":"迅速增大"},{"key":"B","text":"迅速减小"},{"key":"C","text":"缓慢增大"}],"answer":"B","analysis":"提示：迎角失速，升力减小\n解析：迎角超过临界迎角后，气流分离加剧，机翼失速，升力系数由最大值开始迅速减小","tags":[],"bankId":"uav-selected"},{"id":"sel-0626","type":"single","difficulty":1,"stem":"可压缩程度","options":[{"key":"A","text":"只取决于飞机的飞行速度(空速)"},{"key":"B","text":"只取决于飞机飞行当地的音速"},{"key":"C","text":"和飞机飞行的速度(空速)以及当地的音速有关"}],"answer":"C","analysis":"提示：可压缩→空+音 （绝对词错误，两个只×）\n解析：飞行中空气的可压缩性影响通常用马赫数来判断：M=飞机的空速 / 当地音速因此，既不能只看飞机飞得多快，也不能只看当地音速；与两者都有关系，要看两者的比值。","tags":[],"bankId":"uav-selected"},{"id":"sel-0627","type":"single","difficulty":1,"stem":"下列哪项不是飞机飞行时所受的外载荷?","options":[{"key":"A","text":"重力"},{"key":"B","text":"气动力"},{"key":"C","text":"惯性力"}],"answer":"C","analysis":"提示：惯性不是外载荷，自身产生\n解析：重力和气动力属于飞机受到的外载荷；惯性力是为了分析加速运动而引入的，不是实际作用于飞机的外载荷。","tags":[],"bankId":"uav-selected"},{"id":"sel-0628","type":"single","difficulty":1,"stem":"对于进行定常飞行的飞机来说（）。","options":[{"key":"A","text":"升力一定等于重力"},{"key":"B","text":"作用在飞机上的外载荷必定是平衡力系"},{"key":"C","text":"发动机推力一定等于阻力"}],"answer":"B","analysis":"提示：定常要平衡 （另两个答案也对，但是不全面，只有B全面）\n解析：在我国高校教材里，定常飞行为“匀速直线运动”。 匀速直线“全面平衡”，虽然AC也对，但不够全面。 B则完全表明了定常飞行的核心：“平衡力系”=力的平衡 + 力矩的平衡","tags":[],"bankId":"uav-selected"},{"id":"sel-0629","type":"single","difficulty":1,"stem":"飞机飞行的俯仰角为（）。","options":[{"key":"A","text":"飞机纵轴与飞行速度向量的夹角"},{"key":"B","text":"飞机纵轴与水平面的夹角"},{"key":"C","text":"飞行速度与水平面的夹角"}],"answer":"B","analysis":"提示：俯仰角和速度无关\n解析：俯仰角描述的是机头相对水平面的抬起或低下程度，即飞机纵轴（沿着机身头尾的轴）与水平面的夹角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0630","type":"single","difficulty":1,"stem":"下列哪种状态下飞行器会超过临界迎角?","options":[{"key":"A","text":"低速飞行"},{"key":"B","text":"高速飞行"},{"key":"C","text":"都会"}],"answer":"C","analysis":"提示：高低速度都影响迎角\n解析：是否超过临界迎角，取决于迎角本身，不能只凭飞行速度判断。低速飞行时，为维持升力往往需要增大迎角，可能超过临界迎角；高速飞行时，如果突然大幅拉杆，同样可能超过临界迎角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0631","type":"single","difficulty":1,"stem":"活塞式发动机混合气过富油燃烧将引起（）的问题。","options":[{"key":"A","text":"发动机工作平稳，但燃油消耗量变大"},{"key":"B","text":"电嘴积炭"},{"key":"C","text":"发动机过热"}],"answer":"B","analysis":"提示：富油→积炭\n解析：混合气过富油时，燃油相对过多、燃烧不充分，容易使电嘴（火花塞）积炭，进而导致点火不良、发动机工作不平稳。","tags":[],"bankId":"uav-selected"},{"id":"sel-0632","type":"single","difficulty":1,"stem":"当后缘襟翼放下时，下述哪项说法正确?","options":[{"key":"A","text":"只增大升力"},{"key":"B","text":"只增大阻力"},{"key":"C","text":"既增大升力又增大阻力"}],"answer":"C","analysis":"提示：既又\n解析：首先，后缘襟翼放下后，机翼弯度增大，通常使升力系数增大；其次，后缘襟翼放下后，改变了机翼外形，使气流偏转、压差阻力增大； 襟翼偏角较大时，气流分离还会进一步增加阻力。因此，襟翼放下通常既增大升力，也增大阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0633","type":"single","difficulty":1,"stem":"飞机下降时，其迎角（）。","options":[{"key":"A","text":"大于零"},{"key":"B","text":"小于零"},{"key":"C","text":"等于零"}],"answer":"A","analysis":"提示：上升下降平飞，都是正迎角\n解析：飞机下降时，机头通常仍略向上仰，机翼与来流之间形成正迎角，以维持升力并控制下降速率。即使整体高度降低，迎角仍为正。 只有以下三种情况为负： 小速度低头下降（机头俯冲）；特技/训练中的倒飞；某些高速巡航或特殊构型下滑时。","tags":[],"bankId":"uav-selected"},{"id":"sel-0634","type":"single","difficulty":1,"stem":"关于多旋翼使用的无刷电机与有刷电机，说法正确的","options":[{"key":"A","text":"有刷电调驱动交流电机"},{"key":"B","text":"无刷电调驱动交流电机"},{"key":"C","text":"无刷电调驱动直流电机"}],"answer":"B","analysis":"提示：有刷直流 无刷交流\n解析：有刷电机通过电刷和换向器切换绕组电流；无刷电机没有电刷，由无刷电调根据转子位置依次给各相绕组供电，使电机持续旋转。无刷电调以电池直流电为输入，输出交变的多相电流，驱动三相无刷电机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0635","type":"single","difficulty":1,"stem":"多旋翼飞行器在前飞中必然会产生（）变化。","options":[{"key":"A","text":"偏航角"},{"key":"B","text":"横滚角"},{"key":"C","text":"俯仰角"}],"answer":"C","analysis":"提示：飞行必然俯仰角\n解析：常规多旋翼主动前飞时，会向前倾斜，使总拉力产生向前的分量，因此俯仰角会发生变化； (偏航角决定机头朝向。机头保持朝前不转向，也可以一直前飞，所以偏航角不必改变。)(横滚角决定机身向左或向右倾斜。沿机头正前方直飞时，不需要左右倾斜，所以横滚角也不必改变)","tags":[],"bankId":"uav-selected"},{"id":"sel-0636","type":"single","difficulty":1,"stem":"绕多旋翼飞行器立轴的是什么运动?","options":[{"key":"A","text":"滚转运动"},{"key":"B","text":"俯仰运动"},{"key":"C","text":"偏航运动"}],"answer":"C","analysis":"提示：横俯仰，立偏航\n解析：飞机在空中飞行,可以产生俯仰运动、偏航运动和滚转运动,绕横轴oz的运动为俯仰运动,绕立轴oy的运动为偏航运动,绕纵轴ox的运动为滚转运动,","tags":[],"bankId":"uav-selected"},{"id":"sel-0637","type":"single","difficulty":1,"stem":"多旋翼飞行器常用螺旋桨的剖面形状是（）。","options":[{"key":"A","text":"对称型"},{"key":"B","text":"凹凸型"},{"key":"C","text":"S型"}],"answer":"B","analysis":"提示：凹凸\n解析：多旋翼常用螺旋桨的桨叶通常采用具有一定弯度的凹凸型剖面，并非上下对称。桨叶旋转时，这种凹凸型剖面有利于使气流偏转，并形成产生拉力所需的压力分布，","tags":[],"bankId":"uav-selected"},{"id":"sel-0638","type":"single","difficulty":1,"stem":"部分多旋翼飞行器螺旋桨根部标有CCW字样，其意义为（）？","options":[{"key":"A","text":"此螺旋桨由CCW公司生产"},{"key":"B","text":"此螺旋桨为顶视顺时针旋转"},{"key":"C","text":"此螺旋桨为顶视逆时针旋转"}],"answer":"C","analysis":"提示：CW顺 CCW逆\n解析：CCW = Counter Clockwise 中文翻译：反着顺时针 = 逆时针","tags":[],"bankId":"uav-selected"},{"id":"sel-0639","type":"single","difficulty":1,"stem":"某多旋翼飞行器螺旋桨标有“CW”字样表明该螺旋桨（）。","options":[{"key":"A","text":"俯视多轴飞行器顺时针旋翼"},{"key":"B","text":"俯视多轴飞行器逆时针旋翼"},{"key":"C","text":"该螺旋桨为“CW”牌"}],"answer":"A","analysis":"提示：CW顺 CCW逆\n解析：CW = Clockwise 中文翻译：顺时针","tags":[],"bankId":"uav-selected"},{"id":"sel-0640","type":"single","difficulty":1,"stem":"在升高与下降过程中，无人直升机与多旋翼飞行器表述正确的是（）。","options":[{"key":"A","text":"无人直升机主要改变旋翼总距，多轴飞行器主要改变旋翼转速"},{"key":"B","text":"无人直升机主要改变旋翼转速，多轴飞行器主要改变旋翼总距"},{"key":"C","text":"无人直升机主要改变旋翼转速，多轴飞行器同样改变旋翼转速"}],"answer":"A","analysis":"提示：多轴改转速，直升改总距\n解析：常规无人直升机升降时，主要通过改变旋翼的总距来调节升力；常规多旋翼使用定距螺旋桨，主要通过改变各旋翼的转速来调节总拉力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0641","type":"single","difficulty":1,"stem":"以下说法错误的是（）？","options":[{"key":"A","text":"一般来讲，常规直升机尺度较大，多轴飞行器尺度较小"},{"key":"B","text":"一般来讲，常规直升机以油动为主，多轴飞行器基本都是电动力"},{"key":"C","text":"一般来讲，常规直升机飞行中主要改变转速，多轴飞行器飞行中主要改变桨距"}],"answer":"C","analysis":"提示：选错的。多轴改转速，直升改桨距\n解析：常规直升机主要通过改变旋翼桨距控制飞行；常规多旋翼主要通过改变各旋翼转速控制飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0642","type":"single","difficulty":1,"stem":"多旋翼飞行器的操纵不包括（）。","options":[{"key":"A","text":"俯仰操纵"},{"key":"B","text":"航向操纵"},{"key":"C","text":"周期变距"}],"answer":"C","analysis":"提示：选错的。周期变距\n解析：常规多旋翼有俯仰操纵和航向操纵，主要通过改变各旋翼转速来实现；周期变距是传统直升机通过周期性改变旋翼桨叶桨距来控制姿态的方式，不属于常规多旋翼的操纵方式。","tags":[],"bankId":"uav-selected"},{"id":"sel-0643","type":"single","difficulty":1,"stem":"飞行中的多旋翼飞行器所承受的力和力矩不包括（）。","options":[{"key":"A","text":"自身重力"},{"key":"B","text":"旋翼桨叶的铰链力矩"},{"key":"C","text":"旋翼的反扭矩和桨毂力矩"}],"answer":"B","analysis":"提示：选错的。不包括铰链\n解析：常规多旋翼桨叶通常没有传统直升机那种供桨叶挥舞的铰链，因此不存在相应的桨叶铰链力矩。","tags":[],"bankId":"uav-selected"},{"id":"sel-0644","type":"single","difficulty":1,"stem":"下面关于多旋翼的说法错误的是（）。","options":[{"key":"A","text":"本质上讲旋翼是一个能量转换部件，它把电动机传来的旋转动能转换成旋翼拉力"},{"key":"B","text":"旋翼的基本功能是产生旋翼拉力"},{"key":"C","text":"旋翼的基本功能是产生前进推力"}],"answer":"C","analysis":"提示：选错的。前进不全面\n解析：多旋翼旋翼的基本功能是产生拉力 √ 旋翼拉力也随之倾斜，其向前的分力推动飞行器前飞。因此，“产生前进推力”不是旋翼的基本功能，","tags":[],"bankId":"uav-selected"},{"id":"sel-0645","type":"single","difficulty":1,"stem":"关于多旋翼飞行器的优势描述不正确的是（）。","options":[{"key":"A","text":"成本低廉"},{"key":"B","text":"气动效率高"},{"key":"C","text":"结构简单便携"}],"answer":"B","analysis":"提示：选错的。气动效率高×\n解析：多旋翼的典型优势是结构相对简单、便于携带 √常见小型机的制造和维护成本也相对较低 √但在巡航时，其气动效率通常低于固定翼飞机；与传统直升机相比，其效率通常也不占优势。因此，“气动效率高”不是多旋翼的典型优势，","tags":[],"bankId":"uav-selected"},{"id":"sel-0646","type":"single","difficulty":1,"stem":"下列属于现今多旋翼飞行器典型应用的是（）。","options":[{"key":"A","text":"高空长航时侦查"},{"key":"B","text":"航拍、电影取景"},{"key":"C","text":"侦打一体化"}],"answer":"B","analysis":"提示：选非军事→电影\n解析：高空长航时侦查强调长续航，并非常规多旋翼的优势；侦打一体化属于军事任务，不是典型民用应用；多旋翼能悬停、低速飞行，便于灵活调整机位，因此航拍、电影取景是其典型民用应用 √","tags":[],"bankId":"uav-selected"},{"id":"sel-0647","type":"single","difficulty":1,"stem":"农业作业飞行的最低天气标准，平原地区是（）。","options":[{"key":"A","text":"云高不低于200米，能见度不小于5公里"},{"key":"B","text":"云高不低于150米，能见度不小于5公里"},{"key":"C","text":"云高不低于100米，能见度不小于3公里"}],"answer":"B","analysis":"提示：平原150 渔200 山300\n解析：根据旧规《中国民用航空飞行规则》第１２７条 作业飞行的最低天气标准：（一）平原地区： 云高不低于１５０米，能见度不小于５公里，直升机不小于３公里；","tags":[],"bankId":"uav-selected"},{"id":"sel-0648","type":"single","difficulty":1,"stem":"在广阔水域上空进行各种渔业飞行的最低天气标准（）。","options":[{"key":"A","text":"云高不得低于200米，水平能见度不得小于3公里"},{"key":"B","text":"云高不得低于150米，水平能见度不得小于3公里"},{"key":"C","text":"云高不得低于100米，水平能见度不得小于2公里"}],"answer":"A","analysis":"提示：平原150 渔200 山300\n解析：根据旧规《中国民用航空飞行规则》第１4 0 条 在广阔水域上空进行各种渔业飞行的最低天气标准：云高不得低于２００米，水平能见度不得小于５公里（直升机不得小于２公里）。（考题给出的200米 3公里选项虽然与旧规200米5公里不符， 综合考虑选200米得分）","tags":[],"bankId":"uav-selected"},{"id":"sel-0649","type":"single","difficulty":1,"stem":"目前世界上无人机的频谱使用主要集中在UHF、L和（）波段。","options":[{"key":"A","text":"任意"},{"key":"B","text":"C"},{"key":"C","text":"VHF"}],"answer":"B","analysis":"提示：C波\n解析：无人机通信链路需要使用无线电资源,目前世界上无人机的频谱使用主要集中在UHF、L和C波段,其他频段也有零散分布。","tags":[],"bankId":"uav-selected"},{"id":"sel-0650","type":"single","difficulty":1,"stem":"对于民用无人机试验飞行，以下正确的是（）？","options":[{"key":"A","text":"试验飞行可经批准于人口稠密区、集镇或居住区的上空或者任何露天公众集会上空进行"},{"key":"B","text":"禁止无人机在未获得特殊批准下试验飞行"},{"key":"C","text":"应在空中交通不繁忙的开阔水面或人口稀少区域上空实施"}],"answer":"C","analysis":"提示：开阔水面人口稀少\n解析：根据旧版《一般运行和飞行规则》第91.203条飞行试验区域：航空器试验飞行应当在空中交通不繁忙的开阔水面或人口稀少区域上空实施。","tags":[],"bankId":"uav-selected"},{"id":"sel-0651","type":"single","difficulty":1,"stem":"我国民航飞行使用的时间为（）。","options":[{"key":"A","text":"当地的地方时"},{"key":"B","text":"世界协调时"},{"key":"C","text":"北京时"}],"answer":"B","analysis":"提示：世界协调时\n解析：民航飞行和空中交通管制使用统一的世界协调时UTC，便于不同地区的飞行计划、通话和时间记录保持一致。","tags":[],"bankId":"uav-selected"},{"id":"sel-0652","type":"single","difficulty":1,"stem":"空域通常划分为: ①机场飞行空域 ②航路航线 ③空中禁区,空中限制区和空中危险区","options":[{"key":"A","text":"①③"},{"key":"B","text":"①②③"},{"key":"C","text":"①②"}],"answer":"B","analysis":"提示：①②③全选\n解析：根据2007年修改的《中华人民共和国飞行基本规则》第二章 空域管理 第十二条:空域通常划分为机场飞行空域、航路、航线、空中禁区、空中限制区和空中危险区等。空域管理和飞行任务需要的，可以划设空中走廊、空中放油区和临时飞行空域。","tags":[],"bankId":"uav-selected"},{"id":"sel-0653","type":"single","difficulty":1,"stem":"多旋翼飞行器动力电池充电尽量选用（）。","options":[{"key":"A","text":"便携充电器"},{"key":"B","text":"快速充电器"},{"key":"C","text":"平衡充电器"}],"answer":"C","analysis":"提示：平衡充电器\n解析：多旋翼动力电池通常由多节电芯串联组成。平衡充电器能监测并调整各节电芯的电压，避免某一节先充满后继续过充，有利于电池安全和寿命。","tags":[],"bankId":"uav-selected"},{"id":"sel-0654","type":"single","difficulty":1,"stem":"一般来讲，多旋翼飞行器在地面风速大于（）时作业，会对飞行器安全和拍摄稳定有影响。","options":[{"key":"A","text":"2级"},{"key":"B","text":"4级"},{"key":"C","text":"6级"}],"answer":"B","analysis":"提示：4级风\n解析：地面风速大于4级时，风对多旋翼的姿态保持和画面稳定可能产生明显影响。","tags":[],"bankId":"uav-selected"},{"id":"sel-0655","type":"single","difficulty":1,"stem":"对于在大风天伞降回收的民用无人机，以下说法错误的是?","options":[{"key":"A","text":"尽量在高高度开伞"},{"key":"B","text":"尽量在上风区开伞"},{"key":"C","text":"尽量在有技术条件的情况下，接地后切断主伞连接"}],"answer":"A","analysis":"提示：选错的。高开伞×\n解析：大风中开伞越高，伞降时间通常越长，无人机被风吹离预定落点的距离也可能越大。× 在上风侧开伞，为下风漂移预留空间 √接地后解除主伞连接，可减少被充气伞拖行的风险√","tags":[],"bankId":"uav-selected"},{"id":"sel-0656","type":"single","difficulty":1,"stem":"手抛电动固定翼民用无人机，一般在几级风以上就难以自驾飞行（）。","options":[{"key":"A","text":"2级"},{"key":"B","text":"6级"},{"key":"C","text":"4级"}],"answer":"C","analysis":"提示：2飞4难6别想\n解析：对常见手抛电动固定翼无人机，风速超过4级时，手抛起飞和保持预定航迹的难度通常增加。","tags":[],"bankId":"uav-selected"},{"id":"sel-0657","type":"single","difficulty":1,"stem":"以下不属于航空器的是（）。","options":[{"key":"A","text":"卫星"},{"key":"B","text":"直升机"},{"key":"C","text":"飞艇"}],"answer":"A","analysis":"提示：火箭卫星→航天器，不是航空器\n解析：飞行器(FlightVehicle)是由人类制造、能飞离地面、在大气层内或大气层外空间飞行的机械飞行物。 在大气层内飞行的称为航空器 (如飞艇、直升机、无人机) 在太空飞行的称为航天器（如卫星）","tags":[],"bankId":"uav-selected"},{"id":"sel-0658","type":"single","difficulty":1,"stem":"无人机相对有人机的优势，以下哪个条件不正确?","options":[{"key":"A","text":"无需生命支持系统"},{"key":"B","text":"训练可多依赖于模拟器"},{"key":"C","text":"可靠性指标高"}],"answer":"C","analysis":"提示：选错的。无人机不可靠\n解析：飞行器的可靠性取决于设计、制造、维护及使用条件，不能仅凭是否载人判断无人机的可靠性指标更高","tags":[],"bankId":"uav-selected"},{"id":"sel-0659","type":"single","difficulty":1,"stem":"经验表明无人机每飞行（）小时或者更少就需要某种类型的预防性维护，至少每（）小时进行较小的维护。","options":[{"key":"A","text":"20、50"},{"key":"B","text":"25、40"},{"key":"C","text":"30、60"}],"answer":"A","analysis":"提示：20，50\n解析：维护被定义为无人机的保管、检查、大修和维修,包括部件的替换。 不同类型的无人机维护要求不同,经验表明,无人机每飞行20小时或者更少就需要某种类型的预防性维护,至少每50小时进行较小的维护。","tags":[],"bankId":"uav-selected"},{"id":"sel-0660","type":"single","difficulty":1,"stem":"多旋翼飞行器都有哪些用途: ①应急救灾; ②军用侦察; ③警用监视; ④娱乐; ⑤广电行业","options":[{"key":"A","text":"①④⑤"},{"key":"B","text":"②③④"},{"key":"C","text":"①②③④⑤"}],"answer":"C","analysis":"提示：全选\n解析：多旋翼能够悬停、低速飞行并搭载相机等设备，因此可用于应急救灾、军用侦察、警用监视、娱乐，以及广电航拍等领域。","tags":[],"bankId":"uav-selected"},{"id":"sel-0661","type":"single","difficulty":1,"stem":"从事通用航空飞行活动的单位、个人违反本条例规定,下列哪些情形下,由有关部门按照职责分工责令改正,给予警告; 情节严重的,处2万元以上10万元以下罚款,并可给予责令停飞1个月至3个月、暂扣直至吊销经营许可证、飞行执照的处罚 ,造成重大事故或者严重后果的,依照刑法关于重大飞行事故罪或者其他罪的规定,依法追究刑事责任: ①未经批准擅自飞行的; ②未按批准的飞行计划飞行的; ③不及时报告或者漏报飞行动态的; ④未经批准飞入空中限制区、空中危险区的。","options":[{"key":"A","text":"①③④"},{"key":"B","text":"①②④"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：根据《通用航空飞行管制条例》第六章　法律责任 第四十一条：从事通用航空飞行活动的单位、个人违反本条例规定，有下列情形之一的，由有关部门按照职责分工责令改正，给予警告;情节严重的，处2万元以上10万元以下罚款并可给予责令停飞1个月至3个月、暂扣直至吊销经营许可证、飞行执照的处罚:造成重大事故或者严重后果的，依照刑法关于重大飞行事故罪或者其他罪的规定依法追究刑事责任:(一)未经批准擅自飞行的;(二)未按批准的飞行计划飞行的;(三)不及时报告或者漏报飞行动态的;(四)未经批准飞入空中限制区、空中危险区的。","tags":[],"bankId":"uav-selected"},{"id":"sel-0662","type":"single","difficulty":1,"stem":"视距外运行使用自主模式的无人机，出现失控时，机长应执行预案包括：①无人机应急回收程序；②接入无人机云的用户应在系统内上报；③未接入云的用户联系空管部门并上报责任人名单","options":[{"key":"A","text":"②③"},{"key":"B","text":"①③"},{"key":"C","text":"①②③"}],"answer":"C","analysis":"提示：①②③全选\n解析：根据2015年《轻小无人机运行规定》第 12 条 视距外运行（BVLOS） 12.3.1 出现无人机失控的情况，机长应该执行相应的预案，包括：a.无人机应急回收程序；b.对于接入无人机云的用户，应在系统内上报相关情况；c.对于未接入无人机云的用户，联系相关空管服务部门的程序，上报遵照以上程序的相关责任人名单。","tags":[],"bankId":"uav-selected"},{"id":"sel-0663","type":"single","difficulty":1,"stem":"《中国民用航空法》的颁布目的: ①为了维护国家的领空主权和民用航空权利; ②保障民用航空活动安全和有秩序地进行; ③保护民用航空活动当事人各方的合法权益 ④促进民用航空事业的发展","options":[{"key":"A","text":"③④"},{"key":"B","text":"①②"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：根据旧版《民用航空法》第一条 :为了维护国家的领空主权和民用航空权利，保障民用航空活动安全和有秩序地进行，保护民用航空活动当事人各方的合法权益，促进民用航空事业的发展，制定本法。","tags":[],"bankId":"uav-selected"},{"id":"sel-0664","type":"single","difficulty":1,"stem":"学员单飞前必须达到的要求是：①通过由授权教员实施的理论考试；②接受并记录了单飞所用航空器的适用动作与程序的飞行训练；③经授权教员在该型号或类似航空器上检查，认为该驾驶员熟练掌握了这些动作与程序","options":[{"key":"A","text":"①②③"},{"key":"B","text":"①③"},{"key":"C","text":"②③"}],"answer":"A","analysis":"提示：①②③全选\n解析：根据2016年《民用航空器驾驶员和地面教员合格审定规则》第 61.105 （2018年进行修订，对本条未作修改）","tags":[],"bankId":"uav-selected"},{"id":"sel-0665","type":"single","difficulty":1,"stem":"在什么条件下飞行教员方可在学生驾驶员飞行经历记录本上签字，批准其单飞？","options":[{"key":"A","text":"亲自或委托具备飞行教员资格和权限的飞行教员对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练，确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制，已经做好准备能够安全实施单飞"},{"key":"B","text":"亲自对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练，确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制，已经做好准备能够安全实施单飞"},{"key":"C","text":"亲自或委托具备飞行教员资格和权限的飞行教员对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练，确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制，已经做好准备能够安全实施单飞同时需得到检查教员的认可和批准"}],"answer":"B","analysis":"提示：必须亲自，不得委托\n解析：根据《民用航空器驾驶员合格审定规则》第61.215条 飞行教员的限制 (d)签字限制:(１)在满足下列条件后,飞行教员方可在学生驾驶员执照或飞行经历记录本上签字,批准其单飞:(i)亲自对该学生驾驶员提供了本规则授予单飞权利所要求的飞行训练;(ii)确认该学生驾驶员能够遵守飞行教员出于安全考虑而在飞行经历记录本上作出的任何限制,已经做好准备能够安全实施单飞.","tags":[],"bankId":"uav-selected"},{"id":"sel-0666","type":"single","difficulty":1,"stem":"训练时间，是指受训人在下列方面从授权教员处接受训练的时间？","options":[{"key":"A","text":"地面上、飞行模拟机或飞行训练器上"},{"key":"B","text":"飞行中"},{"key":"C","text":"飞行中、地面上、飞行模拟机或飞行训练器上"}],"answer":"C","analysis":"提示：训练时间→全选\n解析：根据《民用航空器驾驶员和地面教员合格审定规则》61.7（C）规定： 训练时间，是指受训人在飞行中、地面上、飞行模拟机或飞行训练器上从授权教员处接受训练的时间。","tags":[],"bankId":"uav-selected"},{"id":"sel-0667","type":"single","difficulty":1,"stem":"参加理论考试或实践考试的申请人在参加考试前（）。","options":[{"key":"A","text":"应当具有授权教员签注的已完成有关地面理论或飞行训练的证明"},{"key":"B","text":"以上二者缺一不可"},{"key":"C","text":"应当具有授权教员推荐其参加考试的证明"}],"answer":"B","analysis":"提示：两个都有\n解析：依据旧版《民用航空器驾驶员、飞行教员和地面教员合格审定规则》的修订说明：考前既要有教员签注的已完成相应训练的证明，也要有教员推荐参加考试的证明。","tags":[],"bankId":"uav-selected"},{"id":"sel-0668","type":"single","difficulty":1,"stem":"在遇到特殊情况，民用航空器机长为保证民用航空器及所载人员的安全（）。","options":[{"key":"A","text":"应当及时向管制单位报告，按照相关规定进行正确处置"},{"key":"B","text":"应当及时向签派或上级领导报告，按照相关规定进行正确处置"},{"key":"C","text":"有权对航空器进行处置"}],"answer":"C","analysis":"提示：特殊情况不报告，机长有权先行处置\n解析：根据《中华人民共和国飞行基本规则》第九条：飞行人员在飞行中，必须服从指挥，严格遵守纪律和操作规程，正确处置空中情况。遇到特殊情况，民用航空器的机长，为保证民用航空器及其所载人员的安全，有权对民用航空器作出处置。","tags":[],"bankId":"uav-selected"},{"id":"sel-0669","type":"single","difficulty":1,"stem":"依法取得中华人民共和国国籍的民用航空器，应当标明规定的国籍标志和（）。","options":[{"key":"A","text":"机型标志"},{"key":"B","text":"登记标志"},{"key":"C","text":"公司标志"}],"answer":"B","analysis":"提示：国籍+登记标志\n解析：根据《一般运行和飞行规则》第91.11条 民用航空器飞行手册、标记和标牌要求：(c)在中华人民共和国国籍登记的民用航空器应当满足CCAR-45部规定的国籍标志、登记标志和标识要求方可运行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0670","type":"single","difficulty":1,"stem":"无人机系统无线电资源的使用（）局方无线电管理部门的许可证。","options":[{"key":"A","text":"需要"},{"key":"B","text":"不需要"},{"key":"C","text":"一般情况下不需要"}],"answer":"A","analysis":"提示：要许可证得有管理部门\n解析：无人机系统使用无线电频率和设备，应遵守国家无线电管理规定；依法取得无线电频率使用许可或无线电台执照。","tags":[],"bankId":"uav-selected"},{"id":"sel-0671","type":"single","difficulty":1,"stem":"谁对民用无人驾驶航空器系统的维护负责?","options":[{"key":"A","text":"签派"},{"key":"B","text":"机长"},{"key":"C","text":"运行人"}],"answer":"C","analysis":"提示：运维-运行维护-运行人\n解析：根据《民用无人驾驶航空器运行安全管理规则》F章 运行管理 相关条例总结： 运行人是承担系统维护工作的法定责任人，需确保系统处于适航状态。 名词解释： 运行人：是指实际控制使用民用航空器实施飞行活动的单位或者个人。一般为航空器的所有权人，但当航空器所有 权人将使用控制权委托给代管人时，该航空器的运行人为航空器代管人。 机长：是指由运行人指定，在飞行时间内对航空器的运行和安全拥有最终权利和负有最终责任的驾驶员。","tags":[],"bankId":"uav-selected"},{"id":"sel-0672","type":"single","difficulty":1,"stem":"飞行教员等级申请人必须年满（）。","options":[{"key":"A","text":"20周岁"},{"key":"B","text":"21周岁"},{"key":"C","text":"18周岁"}],"answer":"C","analysis":"提示：教员执照18\n解析：依据2018年《民用遥控驾驶航空器系统驾驶员管理暂行规定》第3.1条“教员等级资格要求”，申请人须年满18周岁。","tags":[],"bankId":"uav-selected"},{"id":"sel-0673","type":"single","difficulty":1,"stem":"任何单位或者个人设计民用航空器，应当向民航局申请（）。","options":[{"key":"A","text":"适航证"},{"key":"B","text":"生产许可证"},{"key":"C","text":"型号合格证"}],"answer":"C","analysis":"提示：设计要型号，生产要生产\n解析：根据《中华人民共和国民用航空器适航管理条例》第六条：任何单位或者个人设计民用航空器，应当持航空工业部对该设计项目的审核批准文件，向民航局申请型号合格证。","tags":[],"bankId":"uav-selected"},{"id":"sel-0674","type":"single","difficulty":1,"stem":"无人机适航证书可（）。","options":[{"key":"A","text":"随飞机一起转让"},{"key":"B","text":"存放备查"},{"key":"C","text":"随无人机系统携带"}],"answer":"A","analysis":"提示：适航证可转让\n解析：根据《民用无人驾驶航空器运行安全管理规则》第92.465条：民用无人驾驶航空器系统适航证的转让性民用无人驾驶航空器系统适航证可以随航空器一起转让。","tags":[],"bankId":"uav-selected"},{"id":"sel-0675","type":"single","difficulty":1,"stem":"无人机适航证书不可（）。","options":[{"key":"A","text":"随飞机一起转让"},{"key":"B","text":"存放备查"},{"key":"C","text":"随无人机系统携带"}],"answer":"B","analysis":"提示：存放×\n解析：根据《民用无人驾驶航空器运行安全管理规则》第92.465条：民用无人驾驶航空器系统适航证的转让性民用无人驾驶航空器系统适航证可以随航空器一起转让。√ 根据《无人驾驶航空器飞行管理暂行条例》第三十二条：操控无人驾驶航空器实施飞行活动，应当遵守下列行为规范：（一）依法取得有关许可证书、证件，并在实施飞行活动时随身携带备查。√","tags":[],"bankId":"uav-selected"},{"id":"sel-0676","type":"single","difficulty":1,"stem":"无人机地面站系统可以由不同功能的若干控制站模块组成，其不包括（）。","options":[{"key":"A","text":"载荷控制站"},{"key":"B","text":"无人机控制站"},{"key":"C","text":"机载电台"}],"answer":"C","analysis":"提示：机载电台在飞机上 地面站无\n解析：地面站可以包含无人机控制站、载荷控制站等地面控制模块；机载电台安装在无人机上，属于机载通信设备，不是地面控制站模块。","tags":[],"bankId":"uav-selected"},{"id":"sel-0677","type":"single","difficulty":1,"stem":"指挥控制与（）是无人机地面站的主要功能。","options":[{"key":"A","text":"任务规划"},{"key":"B","text":"导航"},{"key":"C","text":"飞行视角显示"}],"answer":"A","analysis":"提示：地面站:指挥控制+任务规划\n解析：无人机地面站的主要功能通常概括为任务规划与指挥控制。导航信息和飞行视角显示仅仅是地面站提供或展示的内容，不是主要功能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0678","type":"single","difficulty":1,"stem":"地面控制站飞行参数综合显示的内容包括（）。","options":[{"key":"A","text":"飞行与导航信息、数据链状态信息、设备状态信息、指令信息"},{"key":"B","text":"导航信息显示、航迹绘制显示以及地理信息的显示"},{"key":"C","text":"告警信息、地图航迹显示信息"}],"answer":"A","analysis":"提示：地面控制站-（四个信息）有指令\n解析：飞行参数综合显示可根据飞行与任务需要,选择需要的系统信息予以显示便于无人机驾驶员判读。主要包括以下四个方面。(1)飞行与导航信息(2)数据链状态信息 (3)设备状态信息 (4)指令信息","tags":[],"bankId":"uav-selected"},{"id":"sel-0679","type":"single","difficulty":1,"stem":"无人机系统通讯链路主要包括:指挥与控制(C&C)、（ ）、感知和规避(S&A)。","options":[{"key":"A","text":"无线电侦察"},{"key":"B","text":"空中交通管制(ATC)"},{"key":"C","text":"电子干扰"}],"answer":"B","analysis":"提示：ATC（括号和字母）\n解析：根据ITU-RM.2171报告给出的定义,无人机系统通信链路是指控制和无载荷链路，主要包括：指挥与控制(C&C)、空中交通管制(ATC)、感知和规避(S&A) 三种链路。","tags":[],"bankId":"uav-selected"},{"id":"sel-0680","type":"single","difficulty":1,"stem":"地面站地图航迹显示系统可为无人机驾驶员提供无人机（）等信息。","options":[{"key":"A","text":"位置"},{"key":"B","text":"飞行姿态"},{"key":"C","text":"飞控状态"}],"answer":"A","analysis":"提示：地图提供位置\n解析：地图航迹显示可为无人机驾驶员提供无人机位置等导航信息。 它包括飞机的导航信息显示、航违绘制显示以及地理信息的显示。","tags":[],"bankId":"uav-selected"},{"id":"sel-0681","type":"single","difficulty":1,"stem":"部分商用多旋翼飞行器有收放脚架功能或机架整体变形功能，其主要目的是（）。","options":[{"key":"A","text":"改善机载任务设备视野"},{"key":"B","text":"调整重心增加飞行器稳定性"},{"key":"C","text":"减小前飞废阻力"}],"answer":"A","analysis":"提示：减少遮挡改善视野\n解析：商用多旋翼常配备收放脚架或可变形机架，主要是为了在航拍、测绘等任务中：避免起落架或机臂遮挡摄像机、云台视野；提高云台转动范围；减少拍摄盲区。此三项均为改善视野服务。","tags":[],"bankId":"uav-selected"},{"id":"sel-0682","type":"single","difficulty":1,"stem":"无人机地面站显示系统应能显示（）信息。","options":[{"key":"A","text":"飞行器状态及链路、载荷状态"},{"key":"B","text":"飞行空域及气象信息"},{"key":"C","text":"无人机飞行员状态"}],"answer":"A","analysis":"提示：上指令下（地面站）状态\n解析：无人机地面站显示系统主要显示的内容包括以下三个方面：1.飞行参数综合显示（飞行与导航信息、据链状态信息、设备状态信息、指令信息）2..告警3..地图航迹显示","tags":[],"bankId":"uav-selected"},{"id":"sel-0683","type":"single","difficulty":1,"stem":"多旋翼飞行器起降时接触地面的是（）。","options":[{"key":"A","text":"机架"},{"key":"B","text":"云台架"},{"key":"C","text":"脚架"}],"answer":"C","analysis":"提示：最下脚架\n解析：多旋翼飞行器正常起飞、降落时，主要由脚架与地面接触，承担支撑和缓冲作用。机架是飞行器的主要承力结构，云台架用于安装和保护云台设备，二者都不是正常起降时的主要接地部件。","tags":[],"bankId":"uav-selected"},{"id":"sel-0684","type":"single","difficulty":1,"stem":"多旋翼飞行器控制电机转速的直接设备为（）。","options":[{"key":"A","text":"电源"},{"key":"B","text":"电调"},{"key":"C","text":"飞控"}],"answer":"B","analysis":"提示：飞控控电调，电调控电机\n解析：电调（ESC）是控制电机转速的直接设备。其基本关系是：飞控发出转速控制信号 → 电调调节输出电流或驱动频率 → 电机改变转速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0685","type":"single","difficulty":1,"stem":"视距内通信的无人机多数安装（）,而需要进行超视距通信的无人机一般采用自跟踪抛物面卫通天线。","options":[{"key":"A","text":"定向天线"},{"key":"B","text":"蘑菇头天线"},{"key":"C","text":"全向天线"}],"answer":"C","analysis":"提示：视距内全向\n解析：全向天线在水平方向上360°均匀辐射，适合近距离、多方向的视距内通信，常用于消费级无人机或日常航拍任务中，操作简便，无需精确对准方向。 而超视距通信需要更强的方向性和增益，因此通常采用定向或抛物面卫通天线。","tags":[],"bankId":"uav-selected"},{"id":"sel-0686","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的电调一般为（）。","options":[{"key":"A","text":"双向电调"},{"key":"B","text":"有刷电调"},{"key":"C","text":"无刷电调"}],"answer":"C","analysis":"提示：外转无刷\n解析：多旋翼通常使用无刷电机，配套使用无刷电调。无刷电调把电池提供的直流电转换为按顺序变化的多相电流，驱动无刷电机并调节其转速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0687","type":"single","difficulty":1,"stem":"用遥控器设置电调，需要（）。","options":[{"key":"A","text":"断开电机"},{"key":"B","text":"接上电机"},{"key":"C","text":"断开动力电源"}],"answer":"B","analysis":"提示：设置电调要接电机\n解析：电调本身没有独立的状态显示装置，所以完全依靠电机的鸣音来传递调试的状态信息，遥控器设置常包含油门行程校准、启动模式匹配等关键步骤，需电机参与才能让电调准确识别并记录控制信号范围，确保后续调速精准。 可以简单理解为 “电调调试依赖电机鸣音反馈”，所以必须接上电机，才能完成整个调试流程。","tags":[],"bankId":"uav-selected"},{"id":"sel-0688","type":"single","difficulty":1,"stem":"多旋翼飞行器，电调和电机一般通过3根单色线连接，如任意调换其中2根与电机的连接顺序，会出现（）。","options":[{"key":"A","text":"该电机停转"},{"key":"B","text":"该电机出现过热并烧毁"},{"key":"C","text":"该电机反向运转"}],"answer":"C","analysis":"提示：32反转\n解析：无刷电机的三根动力线对应三相绕组。任意调换其中两根线，会改变电机的换相顺序和旋转方向，因此电机通常会反向运转。调换三根线中的任意两根，方向都会反转；若要恢复原方向，再交换任意两根即可。","tags":[],"bankId":"uav-selected"},{"id":"sel-0689","type":"single","difficulty":1,"stem":"无人机注册证书颁发给飞机所有者作为注册证明（）。","options":[{"key":"A","text":"随时随机携带"},{"key":"B","text":"存放备查"},{"key":"C","text":"作为售出证明"}],"answer":"A","analysis":"提示：注册携带\n解析：注册证书跟随无人机一起随时都要携带","tags":[],"bankId":"uav-selected"},{"id":"sel-0690","type":"single","difficulty":1,"stem":"无人机的注册所有者或运营人应将永久邮寄地址的变更、无人机的销售和（）等事项通知局方注册处。","options":[{"key":"A","text":"试验试飞"},{"key":"B","text":"无人机注册证书丢失"},{"key":"C","text":"无人机维修"}],"answer":"B","analysis":"提示：有注册选注册\n解析：邮寄地址变更、无人机销售和注册证书丢失，都涉及注册信息或证书状态，需要通知注册管理部门。所有者或运营人应确保航空器具有有效的适航证书和注册证书。","tags":[],"bankId":"uav-selected"},{"id":"sel-0691","type":"single","difficulty":1,"stem":"无人机的注册所有者或运营人应对保持无人机有最新的适航证书和（）负责。","options":[{"key":"A","text":"无人机安全飞行"},{"key":"B","text":"无人机注册证书"},{"key":"C","text":"无人机维修"}],"answer":"B","analysis":"提示：适航证书+注册证书，两个证书\n解析：适航证书证明航空器符合适航要求，注册证书证明其登记状态；所有者或运营人应确保航空器具有有效的适航证书和注册证书。","tags":[],"bankId":"uav-selected"},{"id":"sel-0692","type":"single","difficulty":1,"stem":"无人机特殊飞行许可颁发前，由局方检察官或局方认证人员或（）进行检查以确定位于预期的飞行是安全的。","options":[{"key":"A","text":"适当认证修理站"},{"key":"B","text":"经验丰富的无人机飞行员"},{"key":"C","text":"经验丰富的有人机飞行员"}],"answer":"A","analysis":"提示：认证的人或修理站，得有“认证”\n解析：许可颁发前，可由局方检查员亲自检查，或要求认证的维修人员、认证的修理站检查航空器，以确定其能够安全完成预期飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0693","type":"single","difficulty":1,"stem":"多旋翼无人机，电调上较细的白红黑3色排线，也叫杜邦线，用来连接（）。","options":[{"key":"A","text":"电机"},{"key":"B","text":"机载遥控接收机"},{"key":"C","text":"飞控"}],"answer":"C","analysis":"提示：粗电池，中电机，细电调，杜邦飞控\n解析：在无人机中，电调上的白、红、黑细线通常用杜邦类插针连接器接到飞控，用于传输控制信号和提供低压电源。它与美国杜邦公司开发的插接端子体系有关，所以得名“杜邦线”。","tags":[],"bankId":"uav-selected"},{"id":"sel-0694","type":"single","difficulty":1,"stem":"哪种对地拍摄或成像的无人机任务设备基本不会受到云层与雾霾的影响?","options":[{"key":"A","text":"合成孔径雷达"},{"key":"B","text":"可见光CCD"},{"key":"C","text":"红外摄像机"}],"answer":"A","analysis":"提示：雷达√\n解析：合成孔径雷达使用微波进行主动探测，具有较强的穿云、穿雾和抗雾霾能力，基本不受云层和雾霾影响。√ 可见光 CCD 容易被云雾和霾遮挡；×红外摄像机虽然受光照影响较小，但仍会受到云层、雾霾和水汽衰减的影响。×","tags":[],"bankId":"uav-selected"},{"id":"sel-0695","type":"single","difficulty":1,"stem":"无人机通过（）控制舵面和发动机节风门来实现无人机控制。","options":[{"key":"A","text":"伺服执行机构"},{"key":"B","text":"操纵杆"},{"key":"C","text":"脚蹬"}],"answer":"A","analysis":"提示：伺服\n解析：无人机飞控系统输出控制信号后，由伺服执行机构驱动舵面和发动机节风门，实现姿态与动力控制。操纵杆、脚蹬属于有人机的人工操纵装置。","tags":[],"bankId":"uav-selected"},{"id":"sel-0696","type":"single","difficulty":1,"stem":"目前民用无人机上多用的舵机属于哪种伺服执行机构类型?","options":[{"key":"A","text":"电动伺服执行机构"},{"key":"B","text":"电液伺服执行机构"},{"key":"C","text":"气动伺服执行机构"}],"answer":"A","analysis":"提示：民用电动伺服\n解析：民用无人机常用舵机通常由小型电机、减速齿轮和位置反馈电路组成，将电信号转换为舵面或机构的机械运动。电液和气动伺服机构结构复杂、重量较大，较少用于普通民用无人机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0697","type":"single","difficulty":1,"stem":"活塞式发动机在慢车状态下工作时间过长，易带来的主要危害是（）。","options":[{"key":"A","text":"电嘴挂油积炭"},{"key":"B","text":"滑油消耗量过大"},{"key":"C","text":"气缸头温度过高"}],"answer":"A","analysis":"提示：慢车→积炭 (富油也积炭)\n解析：活塞式发动机长时间慢车时，转速和气缸温度较低，燃油燃烧不充分，容易造成火花塞（电嘴）挂油、积炭，点火性能下降。","tags":[],"bankId":"uav-selected"},{"id":"sel-0698","type":"single","difficulty":1,"stem":"无人机的发动机采用重力供油系统但装有增压泵，主要为了（）。","options":[{"key":"A","text":"保证爬升、下降及其他特殊情况下的正常供油"},{"key":"B","text":"保证大速度巡航的用油"},{"key":"C","text":"减少油箱的剩余燃油"}],"answer":"A","analysis":"提示：问题对答案， 供油对供油\n解析：重力供油在姿态变化、爬升、下降时，由于机身的倾斜，燃油液面和有效压头发生变化 ，供油压力可能不足。 增压泵可提高燃油压力，保证发动机持续、稳定供油。","tags":[],"bankId":"uav-selected"},{"id":"sel-0699","type":"single","difficulty":1,"stem":"无人机燃油箱通气目的之一是（）。","options":[{"key":"A","text":"通气增大供油流量"},{"key":"B","text":"保证向发动机正常供油"},{"key":"C","text":"通气减小供油流量"}],"answer":"B","analysis":"提示：通气→正常供油\n解析：燃油箱通气可以平衡油箱内部与外界的大气压力，避免随着燃油减少形成负压，从而保证燃油能够顺利流向发动机。不能直接增大或减小供油流量。","tags":[],"bankId":"uav-selected"},{"id":"sel-0700","type":"single","difficulty":1,"stem":"二冲程汽油发动机中，燃料箱加注的是（）。","options":[{"key":"A","text":"润滑油"},{"key":"B","text":"汽油"},{"key":"C","text":"汽油与润滑油的混合物"}],"answer":"C","analysis":"提示：四冲汽油，二冲混合\n解析：传统的二冲程汽油发动机，需要按规定比例将润滑油与汽油混合后加入燃料箱，在燃烧供油过程中同时完成发动机内部润滑。","tags":[],"bankId":"uav-selected"},{"id":"sel-0701","type":"single","difficulty":1,"stem":"民用航空器必须具有民航局颁发的（）方可飞行。","options":[{"key":"A","text":"机场使用许可证"},{"key":"B","text":"经营许可证"},{"key":"C","text":"适航证"}],"answer":"C","analysis":"提示：适航证=行驶证\n解析：根据旧
