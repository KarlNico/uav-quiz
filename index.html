的趋势，从而增加纵向稳定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1000","type":"single","difficulty":1,"stem":"焦点在重心之后，向后移焦点，飞机的（）。","options":[{"key":"A","text":"操纵性与此无关"},{"key":"B","text":"操纵性增强"},{"key":"C","text":"操纵性减弱"}],"answer":"C","analysis":"提示：焦后，操纵弱\n解析：焦点后移会使飞机操纵性减弱，因为飞机恢复原有姿态的趋势增强，操纵难度加大。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1001","type":"single","difficulty":1,"stem":"利用增大机翼弯度来提高机翼的升力系数，会导致（）。","options":[{"key":"A","text":"机翼上表面最低压力点前移，减小临界迎角"},{"key":"B","text":"机翼上表面最低压力点后移，减小临界迎角"},{"key":"C","text":"机翼上表面最低压力点前移，加大临界迎角"}],"answer":"A","analysis":"提示：弯度→点前移，减小迎角（弯要减前）\n解析：增大机翼弯度，机翼上表面最低压力点前移，使得气流更容易分离，从而减小临界迎角。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1002","type":"single","difficulty":1,"stem":"描述飞机在空间姿态的姿态角有（）。","options":[{"key":"A","text":"迎角，偏航角，滚转角"},{"key":"B","text":"滚转角，偏航角，俯仰角"},{"key":"C","text":"俯仰角，侧滑角，滚转角"}],"answer":"B","analysis":"提示：滚偏俯（无迎侧）\n解析：滚转角、偏航角、俯仰角:这三个角分别描述了飞机绕其纵轴、立轴和横轴的旋转，是全面描述飞机在空间姿态的三个基本角度。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1003","type":"single","difficulty":1,"stem":"前缘缝翼的功用有（）。","options":[{"key":"A","text":"增大机翼的安装角"},{"key":"B","text":"增加飞机的稳定性"},{"key":"C","text":"增大最大升力系数"}],"answer":"C","analysis":"提示：前缘，增大升力系数\n解析：前缘缝翼的主要作用是在低速时增加机翼的升力系数，特别是在起飞和着陆时。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1004","type":"single","difficulty":1,"stem":"前缘缝翼的主要作用是（）。","options":[{"key":"A","text":"放出前缘缝翼，可增大飞机的临界迎角"},{"key":"B","text":"增大机翼升力"},{"key":"C","text":"减小阻力"}],"answer":"A","analysis":"提示：前缘，增大升力系数，增大临界迎角\n解析：放出前缘缝翼，能增大飞机的临界迎角提高飞机的升力性能。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1005","type":"single","difficulty":1,"stem":"使飞机绕横轴转动的力矩称为（）。","options":[{"key":"A","text":"倾斜力矩"},{"key":"B","text":"俯仰力矩"},{"key":"C","text":"滚转力矩"}],"answer":"B","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：绕横轴转动的力矩称为俯仰力矩，控制飞机的俯仰姿态。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1006","type":"single","difficulty":1,"stem":"使飞机绕立轴作旋转运动的力矩称为（）。","options":[{"key":"A","text":"俯仰力矩"},{"key":"B","text":"纵向力矩"},{"key":"C","text":"偏航力矩"}],"answer":"C","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：绕立轴旋转的力矩称为偏航力矩，影响飞机偏航运动。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1007","type":"single","difficulty":1,"stem":"使飞机绕纵轴产生侧倾的力矩称为（）。","options":[{"key":"A","text":"俯仰力矩"},{"key":"B","text":"偏航力矩"},{"key":"C","text":"滚转力矩"}],"answer":"C","analysis":"提示：横俯仰，立偏航，纵滚转\n解析：绕纵轴的力矩称为滚转力矩，决定飞机的侧倾僖动作。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1008","type":"single","difficulty":1,"stem":"使用机翼后缘襟翼提高升力系数的同时临界迎角减小的主要原因是（）。","options":[{"key":"A","text":"放下后缘襟翼时，增大了机翼的弯度"},{"key":"B","text":"放下后缘襟翼时，增大了机翼的面积"},{"key":"C","text":"放下后缘襟翼时，在上下翼面之间形成了缝隙"}],"answer":"A","analysis":"提示：迎角，弯度\n解析：放下后缘襟翼时，增大了机翼的弯度，这增加了机翼的有效迎角，从而提高了升力系数。然而，由于弯度的增加，机翼上表面的气流更容易分离，导致临界迎角减小。因此，虽然升力系数提高了，但飞机在更高的迎角下更容易失速，","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1009","type":"single","difficulty":1,"stem":"使用扰流板操纵飞机向左盘旋时，下述哪项说法正确?","options":[{"key":"A","text":"左机翼飞行扰流板向上打开，右机翼飞行扰流板向上打开"},{"key":"B","text":"左机翼飞行扰流板向上打开，右机翼飞行扰流板不动"},{"key":"C","text":"左机翼飞行扰流板不动，右机翼飞行扰流板向上打开"}],"answer":"B","analysis":"提示：左动右不动（哪边转哪边开）\n解析：扰流板通常用于增加阻力，帮助飞机在着陆或低速飞行时减速。当需要使飞机向左盘旋时，可以打开左机翼的扰流板，增加左机翼的阻力，从而使飞机向左倾斜并盘旋。右机翼的扰流板则保持关闭，以保持右侧的升力和阻力平衡。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1010","type":"single","difficulty":1,"stem":"属于减升装置的辅助操纵面是（）。","options":[{"key":"A","text":"扰流板"},{"key":"B","text":"副翼"},{"key":"C","text":"前缘缝翼"}],"answer":"A","analysis":"提示：扰流板减升\n解析：扰流板是一种减升装置，它通过增加阻力来减小飞机的升力，通常用于着陆或低速飞行时的减速和姿态控制。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1011","type":"single","difficulty":1,"stem":"属于增升装置的辅助操纵面是（）。","options":[{"key":"A","text":"扰流板"},{"key":"B","text":"副翼"},{"key":"C","text":"前缘襟翼"}],"answer":"C","analysis":"提示：前缘襟翼增升\n解析：前缘襟翼是一种增升装置，它通过改变机翼前缘的形状来增加升力系数，特别是在起飞和着陆时。这允许飞机在更低的速度和更高的迎角下飞行而不失速。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1012","type":"single","difficulty":1,"stem":"无人机能获得平飞航程最长的速度是（）。","options":[{"key":"A","text":"飞机平飞有利速度"},{"key":"B","text":"飞机平飞最大速度"},{"key":"C","text":"飞机平飞远航速度"}],"answer":"C","analysis":"提示：航程是远航，航时是有利\n解析：能获得平飞航程最长的速度称远航速度。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1013","type":"single","difficulty":1,"stem":"无人机能获得平飞航时最长的速度是（）。","options":[{"key":"A","text":"飞机平飞所需速度"},{"key":"B","text":"飞机平飞有利速度"},{"key":"C","text":"飞机平飞最大速度"}],"answer":"B","analysis":"提示：航程是远航，航时是有利\n解析：有利速度，就是平飞所需拉力最小、升阻比最大，同时也是平飞需用功率与速度比值最小的速度。飞行器以有利速度平飞，能够达到最佳飞行效率，以最小的阻力产生足够的升力来维持平飞。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1014","type":"single","difficulty":1,"stem":"下列关于扰流板的叙述哪项说法错误?","options":[{"key":"A","text":"扰流板可作为减速板缩短飞机滑跑距离"},{"key":"B","text":"可辅助副翼实现飞机横向操纵"},{"key":"C","text":"可代替副翼实现飞机横向操纵"}],"answer":"C","analysis":"提示：选错的，不可替代\n解析：扰流板可作为减速板缩短飞机滑跑距离，这是正确的。同时，扰流板也可以辅助副翼实现飞机横向操纵，通过增加一侧机翼的阻力来帮助飞机进行横向移动。然而，扰流板并不能代替副翼实现飞机横向操纵。副翼是飞机主要的横向操纵面，通过改变其角度来控制飞机的横向移动。扰流板只是辅助装置，不能替代副翼的功能。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1015","type":"single","difficulty":1,"stem":"下列哪项不是飞机飞行时所受的外载荷?","options":[{"key":"A","text":"重力"},{"key":"B","text":"气动力"},{"key":"C","text":"惯性力"}],"answer":"C","analysis":"提示：惯性不是外载荷，自身产生\n解析：重力和气动力属于飞机受到的外载荷；惯性力是为了分析加速运动而引入的，不是实际作用于飞机的外载荷。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1016","type":"single","difficulty":1,"stem":"下列哪种变化情况肯定会增加飞机方向静稳定性?","options":[{"key":"A","text":"增加机翼面积"},{"key":"B","text":"增加垂直尾翼面积"},{"key":"C","text":"增加水平尾翼面积"}],"answer":"B","analysis":"提示：横机，纵水，方垂直\n解析：飞机的方向静稳定性是指飞机在受到方向扰动后，能否自动恢复到原来飞行方向的能力。增加垂直尾翼面积可以增大飞机在偏航时产生的偏航力矩，从而增强飞机的方向静稳定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1017","type":"single","difficulty":1,"stem":"下列哪种变化情况肯定会增加飞机纵向静稳定性?","options":[{"key":"A","text":"增加机翼面积"},{"key":"B","text":"增加垂直尾翼面积"},{"key":"C","text":"增加水平尾翼面积"}],"answer":"C","analysis":"提示：横机，纵水，方垂直\n解析：飞机的纵向静稳定性是指飞机在受到纵向扰动后，能否自动恢复到原来飞行姿态的能力。增加水平尾翼面积可以增大飞机在俯仰时产生的俯仰力矩，从而增强飞机的纵向静稳定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1018","type":"single","difficulty":1,"stem":"下列叙述错误的是（）。","options":[{"key":"A","text":"飞机焦点位于飞机重心之后有利于飞机的纵向安定性"},{"key":"B","text":"飞机焦点位于飞机重心之前有利于飞机的纵向安定性"},{"key":"C","text":"飞机的重心位置与飞机的装载情况有关，与飞机的飞行状态无关"}],"answer":"B","analysis":"提示：选错的。焦后纵向稳，不是前\n解析：飞机的焦点位置与飞机的安定性有关。当飞机焦点位于飞机重心之后时，飞机具有纵向安定性，即飞机在受到纵向扰动后能够自动恢复到原来的飞行姿态。而当飞机焦点位于飞机重心之前时，飞机则不具有纵向安定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1019","type":"single","difficulty":1,"stem":"下列叙述与飞机的正常盘旋飞行无关的是（）。","options":[{"key":"A","text":"保持飞行高度不变"},{"key":"B","text":"保持飞机作圆周飞行"},{"key":"C","text":"保持飞机等速直线飞行"}],"answer":"C","analysis":"提示：选错的。盘旋弧线飞，不是直线\n解析：正常盘旋是飞机保持高度，沿圆周或近似圆周航迹进行的曲线飞行，不属于等速直线×飞行","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1020","type":"single","difficulty":1,"stem":"亚音速气流流过收缩管道，气流参数变化为（ ）。","options":[{"key":"A","text":"流速增加，压强增大"},{"key":"B","text":"速度降低，压强下降"},{"key":"C","text":"流速增加，气压下降"}],"answer":"C","analysis":"提示：亚音速（伯努利√） →速度大压强小（窄处高速低压） 超音速（与伯努利相反） →速度低压强大（窄处低速高压）\n解析：低速亚音速气流近似不可压缩，满足流体连续性方程：收缩管道→截面积减小→流速必然增加；同一流管内的低速定常流动，满足经典伯努利定理：总压守恒→流速增加→静压（压强）必然下降；本题答案为：流速增加、压强下降","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1021","type":"single","difficulty":1,"stem":"研究飞机运动时选用的机体坐标，其（）。","options":[{"key":"A","text":"以飞机重心为原点，纵轴和横轴确定的平面为对称面"},{"key":"B","text":"以全机焦点为原点，纵轴和立轴确定的平面为对称面"},{"key":"C","text":"以飞机重心为原点，纵轴和立轴确定的平面为对称面"}],"answer":"C","analysis":"提示：重心为原点，纵立对称\n解析：由图可见：机体坐标以飞机重心为原点，飞机左右对称，涉及立轴与纵轴，与横轴无关。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1022","type":"single","difficulty":1,"stem":"影响飞机方向稳定力矩的因素主要是（）。","options":[{"key":"A","text":"飞机重心位置和飞行M数"},{"key":"B","text":"飞机焦点位置和飞行高度"},{"key":"C","text":"飞机迎角、机身和垂尾面积"}],"answer":"C","analysis":"提示：垂尾面积\n解析：飞机方向稳定力矩主要由飞机的气动布局决定，特别是与飞机的迎角、机身和垂直尾翼的面积有关。当飞机受到侧风或进行偏航机动时，机身和垂直尾翼会产生恢复力矩，使飞机趋于恢复原来的飞行方向。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1023","type":"single","difficulty":1,"stem":"影响飞机俯仰平衡的力矩主要是（）。","options":[{"key":"A","text":"机身力矩和机翼力矩"},{"key":"B","text":"机翼力矩和垂尾力矩"},{"key":"C","text":"机翼力矩和水平尾翼力矩"}],"answer":"C","analysis":"提示：横俯仰→水平\n解析：飞机的俯仰平衡主要由机翼和水平尾翼产生的力矩决定。机翼产生的俯仰力矩与飞机的迎角和飞行速度有关，而水平尾翼则通过调整其迎角来产生俯仰力矩，以平衡机翼力矩并保持飞机的俯仰平衡。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1024","type":"single","difficulty":1,"stem":"在飞机进行俯冲拉起过程中，飞机的升力（）。","options":[{"key":"A","text":"为飞机的曲线运动提供向心力"},{"key":"B","text":"等于飞机的重量"},{"key":"C","text":"大于飞机的重量并一直保持不变"}],"answer":"A","analysis":"提示：问题对答案，升力找向心力\n解析：俯冲拉起时，飞机的速度方向不断改变，需要指向弯曲航迹内侧的合力。升力是产生这个向心合力的主要作用力。(在拉起航迹的最低点，升力大于飞机重量；拉起过程中，升力会随速度、飞行轨迹等条件变化)","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1025","type":"single","difficulty":1,"stem":"在平衡外载荷的作用下，飞机飞行的轨迹（）。","options":[{"key":"A","text":"一定是直线的"},{"key":"B","text":"一定是水平直线的"},{"key":"C","text":"是直线的或是水平曲线的"}],"answer":"A","analysis":"提示：外载荷平衡→直线\n解析：在平衡外载荷的作用下，飞机将保持稳定的飞行状态。这意味着飞机的飞行轨迹将是直线的，因为所有外载荷都被平衡，没有导致飞机偏离直线轨迹的力或力矩。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1026","type":"single","difficulty":1,"stem":"增大机翼弯度可以增大机翼升力的原理是（）。","options":[{"key":"A","text":"使附面层保持层流状态"},{"key":"B","text":"加快机翼前缘上表面气流的流速"},{"key":"C","text":"加快机翼后缘气流的流速"}],"answer":"B","analysis":"提示：机翼弯度→表面气流\n解析：增大机翼弯度可以改变机翼的气动特性，特别是影响机翼上表面的气流路径。当机翼弯度增大时，机翼上表面的气流路径变长，导致气流速度加快，根据伯努利原理，气流速度加快会导致气压降低，从而产生更大的升力。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1027","type":"single","difficulty":1,"stem":"增加垂直安定面面积产生的影响将（）。","options":[{"key":"A","text":"增加升力"},{"key":"B","text":"增加横向稳定性"},{"key":"C","text":"增加纵向静稳定性"}],"answer":"B","analysis":"提示：垂直安定面→横向稳定性\n解析：垂直安定面=垂直尾翼，直接影响方向稳定性。但是选项中没有“方向稳定性”。分析选项：垂直安定面不产生升力，排除A； 纵向稳定性靠水平尾翼，排除C。根据CAAC2023运输航线机长考试知识点“垂尾及上单翼设计可产生横侧稳定力矩。”确定垂尾也可影响横向稳定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1028","type":"single","difficulty":1,"stem":"侧风中着陆，为了修正偏流，可以采用既修正了偏流，又使飞机的升阻比不减小的（）。","options":[{"key":"A","text":"改变航向法"},{"key":"B","text":"改变航向法和侧滑法相结合"},{"key":"C","text":"侧滑法"}],"answer":"A","analysis":"提示：修正偏流改航向（侧风+侧滑会滑倒）\n解析：改变航向法是通过调整飞机的航向，使飞机的机头指向与跑道方向形成一定夹角，从而使飞机在接地瞬间能够对准跑道中心线。这种方法在修正偏流的同时，飞机的机身仍然与气流方向平行，不会改变飞机的升力和阻力特性，升阻比不会减小，能够更好地保持飞机的飞行性能和着陆稳定性。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1029","type":"single","difficulty":1,"stem":"影响空气粘性力的主要因素是（）。","options":[{"key":"A","text":"空气温度"},{"key":"B","text":"空气清洁度"},{"key":"C","text":"相对湿度"}],"answer":"A","analysis":"提示：温度影响粘性\n解析：空气的温度是影响其粘性的主要因素。随着温度的升高，空气分子的运动加快，导致粘性力增加。清洁度和相对湿度对空气粘性的影响较小。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1030","type":"single","difficulty":1,"stem":"伯努利定理，指的是（）。","options":[{"key":"A","text":"低速气流"},{"key":"B","text":"高速气流"},{"key":"C","text":"适用于各种速度的气流"}],"answer":"A","analysis":"提示：伯努利，低速\n解析：伯努利方程主要适用于低速气流的情况。在高速气流中，由于流体的压缩性和粘性等因素的影响，伯努利方程可能不再适用。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1031","type":"single","difficulty":1,"stem":"为了解决大速度下空气压缩性的影响和噪音问题，可以对桨叶进行何种处理（）？","options":[{"key":"A","text":"采用矩形桨叶"},{"key":"B","text":"把桨叶尖部做成后掠形"},{"key":"C","text":"采用尖削桨叶"}],"answer":"B","analysis":"提示：后掠减噪音\n解析：大速度飞行时，桨叶尖部容易先达到音速，引发空气压缩性效应和强烈噪音。后掠形设计能有效延迟尖部气流达到音速的时间，可有效减少涡流和噪音。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1032","type":"single","difficulty":1,"stem":"如果民用固定翼无人机在机翼上有一层霜，那么它的失速速度（）。","options":[{"key":"A","text":"增加或减小不确定"},{"key":"B","text":"会增加"},{"key":"C","text":"会减小"}],"answer":"B","analysis":"提示：增加一层霜\n解析：霜会破坏机翼表面的平滑度，增大空气摩擦阻力，同时降低机翼对气流的引导能力，导致机翼产生升力的效率下降。为维持足够升力以避免失速，需要更高的飞行速度，因此失速速度会比机翼干净时更高。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1033","type":"single","difficulty":1,"stem":"飞机迎角减小，飞机重心位置会（）。","options":[{"key":"A","text":"前移"},{"key":"B","text":"后移"},{"key":"C","text":"保持不变"}],"answer":"C","analysis":"提示：重心不变\n解析：迎角变化不会改变飞机质量分布，故重心位置保持不变。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1034","type":"single","difficulty":1,"stem":"外侧滑转弯是由于离心力比升力的水平分量还大，把飞机向转弯的外侧拉。下列说法错误的是（）。","options":[{"key":"A","text":"外侧的转弯可以通过增加倾斜角修正"},{"key":"B","text":"为维持一个给定的角速度，倾斜角必须随离心力变化"},{"key":"C","text":"在高速飞机上对侧滑进行修正非常重要的"}],"answer":"B","analysis":"提示：选错的。随离心力变化×\n解析：根据蓝皮书3.3.1转弯受力：外侧滑转弯的纠正引起角速度的降低,倾斜角增加,或者二者的结合。为维持一个给定的角速度,倾斜角必须随空速变化。在高速飞机上,这变得特别重要。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1035","type":"single","difficulty":1,"stem":"常规布局固定翼无人机要实现向左滚转和上仰姿态，舵面的偏转方向应该（）。","options":[{"key":"A","text":"副翼左上右下，升降舵向上偏"},{"key":"B","text":"副翼左上右下，升降舵向下偏"},{"key":"C","text":"副翼左下右上，升降舵向上偏"}],"answer":"A","analysis":"提示：左上右下+向上偏\n解析：舵面操作与结果： 副翼→操作：压左→左副翼偏上；右副翼偏下→左升力↓右升力↑→实现“左滚转” 升降舵→操作：上拉→升降舵上偏→迎角增加升力↑→实现“上仰” 鼠鼠老师小课堂： 1.飞机靠副翼沿着纵轴控制“横滚”动作。 想实现“左滚转”需要“左升力小右升力大” 舵面操作动作为“向左稍压副翼杆量” 会造左副翼向上偏，副翼向下偏，也就是“左上右下” （鼠鼠老师教大家一个秘诀：副翼压谁谁小（升力），压谁谁上（副翼上偏）。 2.拉杆→升降舵上偏→飞机上仰、抬头 推杆→升降舵下偏→飞机低头、俯冲蓝皮书描述：当升降舵推杆,飞机头向下倾斜时,迎角降低。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1036","type":"single","difficulty":1,"stem":"对于直升机、多旋翼无人机的旋翼或固定翼无人机的螺旋桨，保持角速度一定，更换直径较小的旋翼或螺旋桨，会导致（）。","options":[{"key":"A","text":"桨尖速度变大"},{"key":"B","text":"桨尖速度不变"},{"key":"C","text":"桨尖速度减小"}],"answer":"C","analysis":"提示：角速度一定，直径↓桨尖速度↓\n解析：什么是角速度？ 单位时间内转过的角除以时间 就是角速度 直白的说：每秒 / 每分钟转了多大角度，就是角速度。 什么是桨尖速度？ 单位时间内，螺旋桨桨尖运动划过的路程 通俗的记：桨叶最外端转圈跑的快慢 角速度一定→螺旋桨转的快慢一定， 此时螺旋桨尺寸变小了→桨叶最外端单位时间内划过的路程就变小了。 （就比有两个自行车，一个大轮子，一个小轮子，两人同时转一圈，角速度都相同，但是大轮子转一圈走的路程长，也就是桨尖速度更大；小轮子转一圈走的路程短，也就是桨尖速度更小）","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1037","type":"single","difficulty":1,"stem":"关于失速，下面说法不正确的是（）。","options":[{"key":"A","text":"失速会导致升力系数急剧减小，阻力系数缓慢减小"},{"key":"B","text":"机翼迎角超过临界迎角，导致升力急剧降低的飞行状态称为失速"},{"key":"C","text":"旋翼类无人机前飞速度过快，可能导致后行旋翼出现失速"}],"answer":"A","analysis":"提示：选错的。缓慢×（快不会导致失速，过快会）\n解析：失速与临界迎角密切相关。飞机失速的核心原因就是迎角超过临界迎角。 升力阻力：升力急剧降低、阻力急剧增大。 升力系数阻力系数：升力系数急剧降低、阻力系数急剧增大。 后行桨叶与失速：前飞过快→后行桨叶气流变慢→被迫加大迎角→超临界迎角就失速。 旋翼无人机（直升机）高速前飞时，桨叶分前行、后行两种状态： 前行桨叶顺着飞行方向，相对气流速度变大，升力偏大；后行桨叶迎着飞行反方向，气流速度变小，升力偏小。为了平衡两边升力，飞行器会自动减小前行桨叶迎角、增大后行桨叶迎角。一旦前飞速度过快，后行桨叶迎角会突破临界迎角，气流和桨叶表面分离，直接引发后行旋翼失速，造成升力暴跌、飞机操控和稳定性变差。","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1038","type":"single","difficulty":1,"stem":"下列说法错误的是？（没有提到的条件则视为相同）","options":[{"key":"A","text":"旋翼直径越大则拉力越大"},{"key":"B","text":"旋翼直径越大则悬停诱导速度越大"},{"key":"C","text":"旋翼直径越大则桨盘载荷越小"}],"answer":"B","analysis":"提示：直径大诱导小\n解析：在悬停拉力相同、空气密度相同的条件下：旋翼直径增大 → 桨盘面积增大 → 诱导速度减小。因此B错了，诱导速度是减小而不是增大","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1039","type":"single","difficulty":1,"stem":"飞机纵向稳定性是指飞机受到扰动后（）。","options":[{"key":"A","text":"产生绕立轴转动，扰动消失后转角自动回到零"},{"key":"B","text":"产生绕横轴转动，扰动消失后自动回复原飞行姿态"},{"key":"C","text":"产生绕立轴转动，扰动消失后自动回复原飞行姿态"}],"answer":"B","analysis":"提示：稳定性→“恢复原飞行姿态” 航向立，纵向横，横向纵\n解析：飞机的稳定性就是指飞机受到小扰动后，偏离原平衡状态，并在扰动消失后，自动恢复到原平衡状态的特性。 不管题目问的是横向、纵向还是航向，只要选项里出现 “自动恢复原飞行姿态”，就是正确答案。 同时根据口诀“航向立，纵向横，横向纵”找到轴与对应的稳定性 本题纵向横","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1040","type":"single","difficulty":1,"stem":"国际标准大气的物理参数的相互关系是（）。","options":[{"key":"A","text":"压力不变时，体积和温度成反比"},{"key":"B","text":"温度不变时，压力与体积成正比"},{"key":"C","text":"体积不变时，压力和温度成正比"}],"answer":"C","analysis":"提示：体积不变，压温正\n解析：PV = nRT，体积不变时，压力和温度成正比压力不变时，体积与温度成正比温度不变时，压力与体积成反比","tags":[],"chapter":"飞行原理","bankId":"uav-theory"},{"id":"thc-1041","type":"single","difficulty":1,"stem":"当前国内民用无人机的主要控制方式不包括（）。","options":[{"key":"A","text":"自主控制"},{"key":"B","text":"人工遥控"},{"key":"C","text":"人工智能"}],"answer":"C","analysis":"提示：选错的。未来可能，不是现在\n解析：当前国内民用无人机的主要控制方式主要包括自主控制和人工遥控。自主控制是无人机通过预设程序自主飞行，而人工遥控则是由飞行员实时操控。人工智能虽然发展迅速，但还未成为民用无人机的主要控制方式。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1042","type":"single","difficulty":1,"stem":"对于无人机关键性能，无人机驾驶员（）。","options":[{"key":"A","text":"不必了解"},{"key":"B","text":"视情况了解"},{"key":"C","text":"必须了解"}],"answer":"C","analysis":"提示：送分题，必须了解\n解析：对于无人机关键性能，无人机驾驶员必须全面了解。这是因为无人机的关键性能直接关系到飞行的安全性和稳定性，只有充分了解和掌握，才能确保在复杂多变的飞行环境中做出正确的判断和操作。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1043","type":"single","difficulty":1,"stem":"据统计，无人机系统事故60%以上发生在（）。","options":[{"key":"A","text":"起降阶段"},{"key":"B","text":"巡航阶段"},{"key":"C","text":"滑跑阶段"}],"answer":"A","analysis":"提示：开头结尾，比较困难\n解析：据统计，无人机系统事故60%以上发生在起降阶段。这是因为起降阶段是无人机飞行中最复杂的阶段之一，涉及到起飞、爬升、下降和着陆等多个环节，操作难度大，风险也相对较高。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1044","type":"single","difficulty":1,"stem":"起落航线(五边航线)组成内容不包 括（）。","options":[{"key":"A","text":"起飞、建立航线"},{"key":"B","text":"着陆目测、着陆"},{"key":"C","text":"任务飞行"}],"answer":"C","analysis":"提示：五边不要任务\n解析：起落航线(五边航线)是无人机起飞、着陆的基本飞行路线，主要包括起飞、建立航线、着陆目测和着陆等阶段。而任务飞行并不属于起落航线的组成内容，它是在起落航线完成后，根据具体任务需求进行的飞行阶段。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1045","type":"single","difficulty":1,"stem":"起落航线的重要组成部分应急航线相关内容不包括（）。","options":[{"key":"A","text":"检查飞行平台、发动机、机上设备的故障状态、油量、电量"},{"key":"B","text":"决定着陆场或迫降场"},{"key":"C","text":"任务执行情况"}],"answer":"C","analysis":"提示：应急不要任务\n解析：起落航线的重要组成部分应急航线，主要关注飞行中可能遇到的紧急情况，包括检查飞行平台、发动机、机上设备的故障状态、油量、电量以及决定着陆场或迫降场等，以确保飞行安全。而任务执行情况并不属于应急航线的直接关注内容","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1046","type":"single","difficulty":1,"stem":"无人机定高平飞时，驾驶员面对地面站界面（）。","options":[{"key":"A","text":"切至自主控制模式，尽可放松休息"},{"key":"B","text":"短暂休息，偶尔关注一下飞机状态"},{"key":"C","text":"密切判断飞机的俯仰状态和有无坡度"}],"answer":"C","analysis":"提示：不能休息，密切判断\n解析：无人机定高平飞时，驾驶员需密切关注飞机状态，特别是俯仰和坡度，以确保飞行稳定。切至自主控制模式或放松休息都可能导攴对突发状况的应对不及时。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1047","type":"single","difficulty":1,"stem":"无人机定高平飞时，驾驶员面对地面站界面（）。","options":[{"key":"A","text":"切至自主控制模式，尽可放松休息"},{"key":"B","text":"短暂休息，偶尔关注一下飞机状态"},{"key":"C","text":"根据目标点方向，密切判断飞行方向"}],"answer":"C","analysis":"提示：不能休息，密切判断\n解析：在无人机定高平飞时，驾驶员应根据目标点方向，密切判断飞行方向，以确保无人机按预定路线飞行。放松休息或偶尔关注飞机状态可能导致方向偏离。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1048","type":"single","difficulty":1,"stem":"无人机定高平飞时，驾驶员面对地面站界面（）。","options":[{"key":"A","text":"切至自主控制模式，尽可放松休息"},{"key":"B","text":"短暂休息，偶尔关注一下飞机状态"},{"key":"C","text":"不断检查空速、高度和航向指示"}],"answer":"C","analysis":"提示：不能休息，不断检查\n解析：无人机定高平飞时，驾驶员需不断检查空速、高度和航向指示，以确保飞行参数符合预期，保障飞行安全。放松休息或偶尔关注可能忽视重要参数变化，","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1049","type":"single","difficulty":1,"stem":"无人机定高平飞时，驾驶员面对地面站界面（）。","options":[{"key":"A","text":"切至自主控制模式，尽可放松休息"},{"key":"B","text":"短暂休息，偶尔关注一下飞机状态"},{"key":"C","text":"不断观察发动机指示，了解发动机工作情况"}],"answer":"C","analysis":"提示：不能休息，不断观察\n解析：无人机定高平飞时，发动机的工作状态至关重要。驾驶员需不断观察发动机指示，了解其工作情况，以便及时发现并处理可能的问题。放松休息可能导致忽视发动机异常。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1050","type":"single","difficulty":1,"stem":"无人机定速遥控飞行时放下襟翼，驾驶员需（）。","options":[{"key":"A","text":"增加油门以保持空速"},{"key":"B","text":"减小油门以保持空速"},{"key":"C","text":"针对此情况，无需做相关动作"}],"answer":"A","analysis":"提示：放下襟翼，阻力↑，加油维持\n解析：无人机定速遥控飞行时放下襟翼，会增加飞机的阻力，导致空速下降。为了保持空速，驾驶员需要增加油门，以提供足够的推力来克服增加的阻力，","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1051","type":"single","difficulty":1,"stem":"无人机定速遥控飞行时放下起落架，驾驶员需（）。","options":[{"key":"A","text":"增加油门以保持空速"},{"key":"B","text":"减小油门以保持空速"},{"key":"C","text":"针对此情况，无需做相关动作"}],"answer":"A","analysis":"提示：放下起落架，阻力↑，加油维持\n解析：无人机定速遥控飞行时放下起落架，同样会增加飞机的阻力，导致空速下降。为了保持空速稳定，驾驶员需要增加油门，以提供额外的推力来抵消阻力的增加。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1052","type":"single","difficulty":1,"stem":"无人机定速遥控飞行时收起襟翼，驾驶员需（）。","options":[{"key":"A","text":"增加油门以保持空速"},{"key":"B","text":"减小油门以保持空速"},{"key":"C","text":"针对此情况，无需做相关动作"}],"answer":"B","analysis":"提示：收起襟翼，阻力↓，减小油门\n解析：无人机定速遥控飞行时收起襟翼，会减少飞机的阻力，导致空速增加。为了保持空速不变，驾驶员需要减小油门，以减少推力，使空速保持在设定的速度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1053","type":"single","difficulty":1,"stem":"无人机定速遥控飞行时收起起落架，驾驶员需（）。","options":[{"key":"A","text":"增加油门以保持空速"},{"key":"B","text":"减小油门以保持空速"},{"key":"C","text":"针对此情况，无需做相关动作"}],"answer":"B","analysis":"提示：收起起落架，阻力↓，减小油门\n解析：无人机定速遥控飞行时收起起落架，会减少飞机的阻力，使空速有增加的趋势。为了保持空速稳定，驾驶员需要减小油门，以调整推力，确保空速维持在设定值。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1054","type":"single","difficulty":1,"stem":"无人机飞行时放下襟翼，会使飞机（）。","options":[{"key":"A","text":"飞行速度减小"},{"key":"B","text":"飞行速度增大"},{"key":"C","text":"飞行速度无明显变化"}],"answer":"A","analysis":"提示：放下襟翼，阻力↑，速度下降\n解析：无人机飞行时放下襟翼，会增加机翼面积，从而增大空气阻力，导致飞行速度减小。襟翼的主要作用是在低速时增加升力，但同时也会增加阻力。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1055","type":"single","difficulty":1,"stem":"无人机飞行时放下起落架，会使飞机（）。","options":[{"key":"A","text":"全机阻力减小"},{"key":"B","text":"全机阻力增大"},{"key":"C","text":"全机阻力无明显变化"}],"answer":"B","analysis":"提示：放下起落架，阻力↑\n解析：无人机飞行时放下起落架，会增加飞机的迎风面积，从而增大全机阻力。起落架在飞行中不是用于产生升力的，因此其展开会增加飞行时的阻力。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1056","type":"single","difficulty":1,"stem":"无人机飞行时收起襟翼，会使飞机（）。","options":[{"key":"A","text":"飞行速度减小"},{"key":"B","text":"飞行速度增大"},{"key":"C","text":"飞行速度无明显变化"}],"answer":"B","analysis":"提示：收起襟翼，阻力↓，速度增加\n解析：无人机飞行时收起襟翼，会减小机翼面积，从而降低空气阻力，使得飞行速度增大。襟翼在高速飞行时通常会被收起，以减少阻力并提高飞行速度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1057","type":"single","difficulty":1,"stem":"无人机飞行时收起起落架，会使飞机（）。","options":[{"key":"A","text":"全机阻力减小"},{"key":"B","text":"全机阻力增大"},{"key":"C","text":"全机阻力无明显变化"}],"answer":"A","analysis":"提示：收起起落架，阻力↓\n解析：无人机飞行时收起起落架，会减少飞机的迎风面积，从而减小全机阻力。起落架在飞行中不产生升力，收起后可以减少飞行时的阻力，有助于提高飞行效率。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1058","type":"single","difficulty":1,"stem":"无人机飞行摇杆常规操作方式是（）。","options":[{"key":"A","text":"姿态遥控和舵面遥控"},{"key":"B","text":"自主控制"},{"key":"C","text":"人工修正"}],"answer":"A","analysis":"提示：姿态+舵面\n解析：无人机飞行摇杆的常规操作方式主要包括姿态遥控和舵面遥控。姿态遥控通过控制无人机的姿态来改变其飞行方向和高度，而舵面遥控则通过调整舵面角度来实现飞行姿态的调整。这两种方式是无人机飞行中最为常用的操作方式。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1059","type":"single","difficulty":1,"stem":"无人机驾驶员进行起飞前动力装置检查内容不必包括（）。","options":[{"key":"A","text":"发动机油量检查"},{"key":"B","text":"发动机启动后怠速转速、震动、稳定性检查"},{"key":"C","text":"发动机生产厂家检查"}],"answer":"C","analysis":"提示：选错的。不包括发动机生产厂家\n解析：无人机驾驶员进行起飞前动力装置检查时，主要关注发动机的实际工作状态和性能，包括油量、启动后的总速转速、震动以及稳定性等。而发动机的生产厂家并不是起飞前需要检查的内容，它更多关联于无人机的维护和保养记录。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1060","type":"single","difficulty":1,"stem":"无人机驾驶员进行起飞前飞行器检查内容不必包括（）。","options":[{"key":"A","text":"舵面结构及连接检查"},{"key":"B","text":"起飞(发射)、降落(回收)装置检杳"},{"key":"C","text":"飞行器涂装"}],"answer":"C","analysis":"提示：选错的。涂装属于美观，不属性能检查范畴\n解析：无人机驾驶员在起飞前对飞行器进行检查时，主要关注飞行器的机械结构和关键部件的状态，包括舵面的结构和连接情况起飞和降落装置的完好性等。而飞行器的涂装并不属于起飞前的检查内容，它更多关联于飞行器的外观和美观度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1061","type":"single","difficulty":1,"stem":"无人机驾驶员进行起飞前控制站检查内容不必包括（）。","options":[{"key":"A","text":"控制站软件检查"},{"key":"B","text":"控制站操作系统检查"},{"key":"C","text":"预规划航线及航点检查"}],"answer":"B","analysis":"提示：选错的。操作系统→日常维护，不属起飞前检查\n解析：无人机驾驶员进行起飞前控制站检查时，主要关注控制站软件的状态和功能，以及预规划航线及航点的设置。而控制站的操作系统并非起飞前需要检查的内容，它更多关联于控制站的日常维护和配置。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1062","type":"single","difficulty":1,"stem":"无人机驾驶员进行起飞前通讯链路检查内容不必包括（）。","options":[{"key":"A","text":"链路设备型号"},{"key":"B","text":"飞行摇杆舵面及节风门反馈检查"},{"key":"C","text":"外部控制盒舵面及节风门反馈检查"}],"answer":"A","analysis":"提示：选错的。设备型号×\n解析：无人机驾驶员进行起飞前通讯链路检查时，主要关注链路设备的连接状态、信号质量，以及飞行摇杆、外部控制盒的舵面和节风门反馈情况。而链路设备的型号并非起飞前需要检查的内容，它更多关联于设备的选型和配置。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1063","type":"single","difficulty":1,"stem":"无人机爬升时，油门较大，螺旋桨左偏力矩较大，需适当操纵方向舵（）。","options":[{"key":"A","text":"左偏"},{"key":"B","text":"右偏"},{"key":"C","text":"不必干涉"}],"answer":"B","analysis":"提示：偏力矩反打\n解析：无人机爬升时，由于油门较大，螺旋桨产生的左偏力矩也较大，此时需适当操纵方向舵右偏，以抵消左偏力矩，保持无人机的稳定飞行。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1064","type":"single","difficulty":1,"stem":"无人机系统中，起降驾驶员一般不参与哪个阶段控制?","options":[{"key":"A","text":"起飞阶段"},{"key":"B","text":"降落阶段"},{"key":"C","text":"巡航阶段"}],"answer":"C","analysis":"提示：送分题，起降无巡航\n解析：在无人机系统中，起降驾驶员主要负责起飞和降落阶段的控制，而在巡航阶段，无人机通常会自动按照预规划的航线飞行，无需起降驾驶员的实时操控。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1065","type":"single","difficulty":1,"stem":"无人机在遥控下降时，驾驶员应注意（）。","options":[{"key":"A","text":"飞机下降时，油门收小，螺旋桨扭转气流减弱，飞机有右偏趋势，须抵住左舵"},{"key":"B","text":"飞机下降时，油门收小，螺旋桨扭转气流减弱，飞机有左偏趋势，须抵住右舵"},{"key":"C","text":"飞机状态不会发生变化，不需做任何准备"}],"answer":"A","analysis":"提示：右偏趋势抵左舵\n解析：本题为蓝皮书原文截取考点。当无人机下降收小油门时，螺旋桨/旋翼转速降低。对于逆时针旋转的螺旋桨，根据牛顿第三定律，其产生的反扭矩方向为顺时针，这会导致机身产生一个向右偏转的趋势（机头右偏）。为了抵消这个右偏趋势，保持飞行方向稳定，驾驶员必须向相反方向，即抵住左舵。总结一下：前提： 无人机主旋翼/螺旋桨为逆时针旋转。原理： 油门减小，反扭矩减弱，但其方向（导致机头右偏）不变。操作： 为抵消右偏，需抵住左舵。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1066","type":"single","difficulty":1,"stem":"无人机在遥控下降中，速度过大时，驾驶员应（）。","options":[{"key":"A","text":"适当减小带杆量，增大下滑角"},{"key":"B","text":"适当增加带杆量，减小下滑角"},{"key":"C","text":"顺其自然，让其自动恢复状态"}],"answer":"B","analysis":"提示：增加带杆量→下滑角↓→速度↓\n解析：无人机在遥控下降中，若速度过大，驾驶员应适当增加带杆量以减小下滑角，从而增加阻力，降低速度，确保安全着陆。减小带杆量会增大下滑角，增加速度，不利于着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1067","type":"single","difficulty":1,"stem":"无人机着陆目测须重点决断着陆方向和（）。","options":[{"key":"A","text":"一转弯位置"},{"key":"B","text":"二转弯位置"},{"key":"C","text":"三四转弯位置"}],"answer":"C","analysis":"提示：目测三四\n解析：无人机着陆目测时，除了决断着陆方向外，还需重点观察三四转弯位置，这是确定着陆路径和着陆点的重要参考，确保无人机能够准确、安全地着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1068","type":"single","difficulty":1,"stem":"无人机着陆目测与有人机相比不同之处为（）。","options":[{"key":"A","text":"有人机是从飞机观察着陆场，无人机是从着陆场观察飞机"},{"key":"B","text":"有人机为第三视角，无人机为第一视角"},{"key":"C","text":"有人机驾驶员通过地面人员通告仪表参考值，无人机起降驾驶员可自行观察仪表参考值"}],"answer":"A","analysis":"提示：有人，从飞机看场地 无人，从场地看飞机\n解析：无人机着陆目测与有人机相比，主要不同之处在于观察视角。有人机驾驶员从飞机观察着陆场，而无人机驾驶员则是从着陆场观察飞机，这要求无人机驾驶员具备不同的空间感知和判断能力。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1069","type":"single","difficulty":1,"stem":"遥控无人机复飞后，襟翼收起时描述正确的操纵动作是（）。","options":[{"key":"A","text":"升力系数下降，飞机要下沉，应适当的拉杆"},{"key":"B","text":"升力系数增大，飞机要上升，应适当的推杆"},{"key":"C","text":"对飞机几乎没有影响"}],"answer":"A","analysis":"提示：复飞：下-下-拉\n解析：遥控无人机复飞后，襟翼收起时，升力系数会下降，导致飞机有下沉趋势。此时，驾驶员应适当地拉杆以增加迎角，产生更多升力，保持飞行高度，确保飞行安全。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1070","type":"single","difficulty":1,"stem":"遥控无人机复飞时，正确的操纵方式是（）。","options":[{"key":"A","text":"迅速推满油门，同时快速拉杆转入爬升"},{"key":"B","text":"保持油门，快速拉杆转入爬升"},{"key":"C","text":"柔和地加满油门，保持好方向，同时柔和拉杆使飞机逐渐转入爬升，保持好爬升状态"}],"answer":"C","analysis":"提示：复飞温柔\n解析：遥控无人机复飞时，应柔和地加满油门以保持动力，同时保持好方向，柔和拉杆使飞机逐渐转入爬升状态，这样可以确保飞机平稳、安全地进入爬升阶段，","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1071","type":"single","difficulty":1,"stem":"遥控无人机进入四转弯时（）。","options":[{"key":"A","text":"如飞机接近跑道延长线较快，而转弯剩余角减小较慢时，表明进入早，应立即协调地减小坡度和转弯角速度"},{"key":"B","text":"如飞机接近跑道延长线较快，而转弯剩余角减小较慢时，表明进入晚，应立即协调地增大坡度和转弯角速度"},{"key":"C","text":"如飞机接近跑道延长线较快，而转弯剩余角减小较慢时，表明进入晚，应立即协调地减小坡度和转弯角速度"}],"answer":"B","analysis":"提示：四：快慢晚增大\n解析：当遥控无人机进入四转弯时，如果飞机接近跑道延长线较快而转弯剩余角减小较慢，表明进入晚。此时应立即协调地增大坡度和转弯角速度，以调整飞行路径，确保准确着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1072","type":"single","difficulty":1,"stem":"遥控无人机进入下滑后（）。","options":[{"key":"A","text":"当下滑线正常时，如速度大，表明目测高，应适当收小油门"},{"key":"B","text":"当下滑线正常时，如速度大，表明目测低，应适当增加油门"},{"key":"C","text":"当下滑线正常时，如速度小，表明目测高，应适当收小油门"}],"answer":"A","analysis":"提示：速度大高收油门\n解析：遥控无人机进入下滑阶段后，如果下滑线正常但速度大，表明目测高度偏高。此时应适当收小油门以降低速度，确保飞机能够按照预定的下滑路径和速度着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1073","type":"single","difficulty":1,"stem":"遥控无人机平飞爬升和下降转换时产生偏差的主要原因不包括（）。","options":[{"key":"A","text":"动作粗，操纵量大，造成飞行状态不稳定"},{"key":"B","text":"平飞、爬升、下降三种飞行状态变换时，推杆、拉杆方向不正，干扰其他通道"},{"key":"C","text":"天气状况不佳"}],"answer":"C","analysis":"提示：选错的。偏差不包括天气\n解析：遥控无人机在平飞、爬升和下降转换时产升偏差的主要原因不包括天气状况不佳，偏差主要由操纵动作粗细、操纵量大小以及推杆、拉杆方向是否正确等因素决定与天气状况无直接关联，","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1074","type":"single","difficulty":1,"stem":"遥控无人机平飞转弯后段（）。","options":[{"key":"A","text":"当飞机轨迹方向离目标方向10度-15度时，注视地平仪，根据接近目标方向的快慢，逐渐回杆"},{"key":"B","text":"当飞机轨迹方向到达目标方向时，注视地平仪，逐渐回杆"},{"key":"C","text":"当飞机轨迹方向超过目标方向10度-15度时，注视地平仪，逐渐回杆"}],"answer":"A","analysis":"提示：还未到，离目标10-15\n解析：遥控无人机平飞转弯后段，当飞机轨迹方向离目标方向10度至15度时，驾驶员应注视地平仪，并根据接近目标方向的快慢逐渐回杆，以调整无人机的飞行姿态，确保准确转弯并进入下一阶段。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1075","type":"single","difficulty":1,"stem":"遥控无人机平飞转弯前（）。","options":[{"key":"A","text":"根据转弯坡度大小，减油门5%-10%，保持好平飞状态"},{"key":"B","text":"根据转弯坡度大小，加油门5%-10%，保持好平飞状态"},{"key":"C","text":"保持当前平飞状态"}],"answer":"B","analysis":"提示：为保持速度，转弯加油门\n解析：遥控无人机在平飞转弯前，为了保持转弯过程中的速度和稳定性，应根据转弯坡度大小，适当加油门5%-10%，以确保无人机有足够的动力进行平稳的转弯。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1076","type":"single","difficulty":1,"stem":"遥控无人机四转弯后（）。","options":[{"key":"A","text":"目测过高时，应在加大油门的同时适当增加带杆量，减小下滑角，必要时可平飞一段"},{"key":"B","text":"目测过低时，应在加大油门的同时适当增加带杆量，减小下滑角，必要时可平飞一段"},{"key":"C","text":"等飞机降到较低高度时再做偏差调整"}],"answer":"B","analysis":"提示：逆风目低加油，顺风目高减油\n解析：遥控无人机在完成四转弯后，如果目测高度过低，为了安全着陆，应在加大油门的同时适当增加带杆量，减小下滑角，必要时可平飞一段以调整高度和姿态，确保安全着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1077","type":"single","difficulty":1,"stem":"遥控无人机下滑中，估计到第四转弯时的高度将高于预定的高度（）。","options":[{"key":"A","text":"应及时地收小油门，必要时可收至20%，增大下滑角"},{"key":"B","text":"应适当地加大油门，减小下滑角"},{"key":"C","text":"转为平飞进行修正"}],"answer":"A","analysis":"提示：四高：20%\n解析：遥控无人机下滑中，若估计到第四转弯时的高度将高于预定高度，应及时收小油门，必要时可收至20%，以增大下滑角，降低高度，确保无人机能够按照预定路径着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1078","type":"single","difficulty":1,"stem":"遥控无人机由爬升转为平飞时（）。","options":[{"key":"A","text":"到达预定高度时，开始改平飞"},{"key":"B","text":"超过预定高度10-20米时，开始改平飞"},{"key":"C","text":"上升至预定高度前10-20米时，开始改平飞"}],"answer":"C","analysis":"提示：上升下降有惯性,都要提前改平飞\n解析：遥控无人机由爬升转为平飞时，应在上升至预定高度前10-20米时开始改平飞，这样可以确保无人机在到达预定高度时能够平稳地进入平飞状态。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1079","type":"single","difficulty":1,"stem":"遥控无人机由下降转为平飞时（）。","options":[{"key":"A","text":"到达预定高度时，开始改平飞"},{"key":"B","text":"超过预定高度20-30米时，开始改平飞"},{"key":"C","text":"下降至预定高度前20-30米时，开始改平飞"}],"answer":"C","analysis":"提示：上升下降有惯性,都要提前改平飞\n解析：遥控无人机由下降转为平飞时，应在下降至预定高度前20-30米时开始改平飞，这样可以确保无人机在到达预定高度时能够平稳地由下降转为平飞。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1080","type":"single","difficulty":1,"stem":"遥控无人机在预定高度由平飞转爬升时（）。","options":[{"key":"A","text":"注视地平仪，柔和地加油门至100%:同时稍拉杆转为爬升"},{"key":"B","text":"注视地平仪，快速加油门至100%，同时快速拉杆转为爬升"},{"key":"C","text":"注视地平仪，快速加油门至100%，同时快速顶杆"}],"answer":"A","analysis":"提示：柔和加油\n解析：遥控无人机在预定高度由平飞转爬升时应注视地平仪，柔和地加油门至100%，同时稍拉杆转为爬升，这样可以确保无人机平稳、安全地进入爬升状态。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1081","type":"single","difficulty":1,"stem":"遥控无人机在预定高度由平飞转为下降时（）。","options":[{"key":"A","text":"注视地平仪，稍顶杆，收油门"},{"key":"B","text":"注视地平仪，稍拉杆，收油门"},{"key":"C","text":"注视地平仪，稍拉杆，推油门"}],"answer":"A","analysis":"提示：顶杆下，拉杆上\n解析：遥控无人机在预定高度由平飞转为下降时，应注视地平仪，稍顶杆以减小迎角，同时收油门以降低动力，使无人机平稳地由平飞转为下降。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1082","type":"single","difficulty":1,"stem":"遥控无人机在预定高度由下降转平飞时（）。","options":[{"key":"A","text":"注视地平仪，柔和地加油门，同时拉杆"},{"key":"B","text":"注视地平仪，快速加油门，同时拉杆"},{"key":"C","text":"注视地平仪，柔和地加油门，同时顶杆"}],"answer":"A","analysis":"提示：柔和加油+顶杆下，拉杆上\n解析：遥控无人机在预定高度由下降转平飞时，应注视地平仪，柔和地加油门以增加动力，同时拉杆以增大迎角，使无人机平稳地由下降转为平飞。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1083","type":"single","difficulty":1,"stem":"遥控无人机着陆到平飘阶段（）。","options":[{"key":"A","text":"平飘前段，速度较大，下沉较慢，拉杆量应小一些"},{"key":"B","text":"平飘前段，速度较大，下沉较慢，拉杆量应大一些"},{"key":"C","text":"平飘后段，速度较小，下沉较快，拉杆量应适当减小"}],"answer":"A","analysis":"提示：着陆后飘行，前段快，拉杆小\n解析：平飘前段由于速度较大，下沉较慢，拉杆量应小一些，以保持适当的飞行姿态和下沉速度，确保平稳着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1084","type":"single","difficulty":1,"stem":"遥控无人机着陆的过程不包括（）。","options":[{"key":"A","text":"下滑和拉平"},{"key":"B","text":"平飘接地和着陆滑跑"},{"key":"C","text":"下降和定高"}],"answer":"C","analysis":"提示：选错的。不包括定高\n解析：遥控无人机着陆的过程包括下滑和拉平、飘接地和着陆滑跑等阶段，而不包括下降和定高，因为这两个阶段不是着陆的典型过程。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1085","type":"single","difficulty":1,"stem":"遥控无人机着陆拉平时，对拉平操作描述不恰当的是（）。","options":[{"key":"A","text":"正确的拉平动作，必须按照实际情况"},{"key":"B","text":"主动地、有预见地、机动灵活地去操纵飞机"},{"key":"C","text":"严格按高度值执行动作"}],"answer":"C","analysis":"提示：选错的。应该随机应变\n解析：为什么“严格按高度值执行动作”是错的？因为规定高度只能作为拉平时机的参考，不能作为唯一判断依据。实际拉平时机和操纵量还会受到飞机速度、下降率、下滑角、风速、风向及飞机姿态等因素影响。驾驶员应根据飞机当时的运动状态和外界环境（也就是实际情况），有预见性地进行操纵，并及时、灵活地修正，才能保证飞机平稳着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1086","type":"single","difficulty":1,"stem":"遥控无人机着陆拉平时，拉杆的快慢和下降速度的关系是（）。","options":[{"key":"A","text":"下降快，拉杆应慢一些"},{"key":"B","text":"下降快，拉杆应快一些"},{"key":"C","text":"还按正常时机拉杆"}],"answer":"B","analysis":"提示：下降快，拉杆快(下降快，拉杆快;下降慢，拉杆慢)\n解析：拉平过程中,拉杆的快慢和分量,必须与当时的离地高度、下降快慢和飞行状态相适应。下降快，拉杆亦应快一些; 反之,则慢一些。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1087","type":"single","difficulty":1,"stem":"遥控无人机着陆时（）。","options":[{"key":"A","text":"逆风较大时，目测容易高(即推迟接地)"},{"key":"B","text":"逆风较大时，目测容易低(即提前接地)"},{"key":"C","text":"逆风对着陆没有影响"}],"answer":"B","analysis":"提示：逆风目低加油，顺风目高减油\n解析：遥控无人机着陆时，逆风较大时，由于风阻力的影响，飞机会受到向后的力，导致目测容易低，即提前接地，因此驾驶员需要调整着陆点以适应风的影响。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1088","type":"single","difficulty":1,"stem":"遥控无人机着陆时（）。","options":[{"key":"A","text":"机场气温较高时，跑道上升气流明显，会导致下滑距离增长"},{"key":"B","text":"机场气温较高时，跑道下降气流明显，会导致下滑距离增长"},{"key":"C","text":"机场气温较高时，跑道下降气流明显，会导致下滑距离减小"}],"answer":"A","analysis":"提示：机场温度高，地面热气腾腾，上升气流，滑行增长\n解析：遥控无人机着陆时，机场气温较高时，跑道上升气流明显，这会导致下滑距离增长，因为热空气上升会产生额外的升力，使飞机下滑速度减慢，下滑距离增加。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1089","type":"single","difficulty":1,"stem":"遥控无人机着陆时，产生着陆偏差的主要原因不包括（）。","options":[{"key":"A","text":"精神过分紧张，对着陆存有顾虑，因而注意力分配不当，操纵动作犹豫不适量"},{"key":"B","text":"着陆条件不好"},{"key":"C","text":"飞机型号不同"}],"answer":"C","analysis":"提示：不包括。型号×\n解析：遥控无人机着陆时，产生着陆偏差的主要原因通常包括飞行员的精神状态、着陆条件等，而飞机型号不同不是导致着陆偏差的主要原因，因为飞行员会针对不同机型进行适应和调整。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1090","type":"single","difficulty":1,"stem":"遥控无人机着陆时，风速大或气温低时，（）。","options":[{"key":"A","text":"如目测低，加油门量相应小些"},{"key":"B","text":"如目测高，加油门量相应大些"},{"key":"C","text":"如目测低，加油门量相应大些"}],"answer":"C","analysis":"提示：（风大或气温低容易偏差大） 如目测低，多加油门\n解析：本题考的是对修正“量”的把握→“油门的加与收，是大还是小”本题根据蓝皮书知识点“修正目测的方法”的描述： 修正目测加、收油门的量,主要根据偏差的大小和当时的气象条件。偏差大, 加、收油门量相应大一些;反之,则小一些。风速较大或气温低时,如目测低, 加油门量相应大些;如目测高,收油门量则不应多。风速小或气温高时则相反。 （鼠鼠老师的叮嘱：风大、气温低，飞机更容易掉高度、下沉快 → 所以目测低时，必须更大油门才能拉回来！","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1091","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于收油门描述正确的是（）。","options":[{"key":"A","text":"收油门时机不要早，晚一些比较主动，可以快速收"},{"key":"B","text":"收油门时机不要早，收早了势必造成动作粗，影响着陆动作"},{"key":"C","text":"收油门时机不要晚，早一些比较主动，可以慢慢收，也可停一停再收"}],"answer":"C","analysis":"提示：慢慢收，停一停\n解析：遥控无人机着陆时，收油门时机不宜过晚，因为过晚收油门可能会太过着急，导致动作粗糙，影响着陆动作的平稳性。适当的时机和柔和的动作是确保平稳着陆的关键。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1092","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于收油门描述正确的是（）。","options":[{"key":"A","text":"收油门的过程要拉长一些，拉长了可以柔和，使速度减小均匀，有利于做好着陆"},{"key":"B","text":"收油门的过程要尽量短，短了可以柔和，使速度减小均匀，有利于做好着陆"},{"key":"C","text":"收油门的过程可以随意些，跟着感觉就好"}],"answer":"A","analysis":"提示：拉长柔和慢收\n解析：遥控无人机着陆时，收油门的过程应拉长一些，这样可以更柔和地减小速度，使速度减小更加均匀，有利于做好着陆动作确保着陆的稳定性和安全性","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1093","type":"single","difficulty":1,"stem":"遥控无人机着陆时，接地后跳跃的修正方法是（）。","options":[{"key":"A","text":"飞机跳离地面时，应迅速推杆，压住飞机状态"},{"key":"B","text":"飞机跳离地面时，应迅速拉杆，避免再次坠落弹起"},{"key":"C","text":"飞机跳离地面时，应稳住杆，迅速判明离地的高度和飞机状态"}],"answer":"C","analysis":"提示：稳住，先判断\n解析：遥控无人机着陆时，如果接地后出现跳跃，飞行员应稳住操纵杆，迅速判明离地的高度和飞机状态，以便采取适当的修正措施，确保飞机能够平稳着陆，避免再次跳跃或坠落。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1094","type":"single","difficulty":1,"stem":"遥控无人机着陆时，拉飘的修正方法是（）。","options":[{"key":"A","text":"发现拉飘时，应立即继续拉杆"},{"key":"B","text":"发现拉飘时，应立即柔和推杆制止飞 机继续上飘"},{"key":"C","text":"发现拉飘时，稳住并保持杆量"}],"answer":"B","analysis":"提示：柔和\n解析：遥控无人机着陆时，发现拉飘应立即柔和推杆，制止飞机继续上飘，以确保飞机能够平稳着陆，避免过高的飘浮导致着陆不稳定或偏离预定着陆点。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1095","type":"single","difficulty":1,"stem":"遥控无人机着陆时，拉平低的修正方法是（）。","options":[{"key":"A","text":"发现有拉低的趋势，应适当地增大拉杆量"},{"key":"B","text":"发现有拉低的趋势，应停止拉杆或减小拉杆量"},{"key":"C","text":"发现有拉低的趋势，应推杆"}],"answer":"A","analysis":"提示：顶杆下，拉杆上\n解析：遥控无人机着陆时，发现有拉低的趋势应适当地增大拉杆量，以增加升力，避免飞机过早接地或着陆速度过大，确保着陆的安全性和稳定性。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1096","type":"single","difficulty":1,"stem":"遥控无人机着陆时，拉平高的修正方法是（）。","options":[{"key":"A","text":"发现有拉高的趋势，应停止拉杆或减小拉杆量，让飞机下沉"},{"key":"B","text":"发现有拉高的趋势，应停止拉杆或增加拉杆量，让飞机上升"},{"key":"C","text":"发现有拉高的趋势，应停止继续拉杆"}],"answer":"A","analysis":"提示：顶杆下，拉杆上 停止or减少\n解析：遥控无人机着陆时，发现有拉高的趋势应停止拉杆或减小拉杆量，让飞机下沉以调整着陆姿态和高度，确保飞机能够平稳接地，避免过高的着陆姿态导致着陆偏差。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1097","type":"single","difficulty":1,"stem":"遥控无人机着陆时，面对拉平低正确的操作方式是（）。","options":[{"key":"A","text":"如结束拉平过低且速度较大时，应适当地多拉一点杆，避免三点接地"},{"key":"B","text":"如结束拉平过低且速度较大时，应适当地少拉一点杆，避免三点接地"},{"key":"C","text":"如结束拉平过低且速度较大时，应停止继续拉杆"}],"answer":"A","analysis":"提示：顶杆下，拉杆上 低了就多拉点\n解析：遥控无人机着陆时，如结束拉平过低且速度较大，应适当地多拉一点杆，以增加升力，避免三点接地(即飞机重着陆)，确保着陆的平稳性和安全性。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1098","type":"single","difficulty":1,"stem":"遥控无人机着陆时，面对拉平高正确的操作方式是（）。","options":[{"key":"A","text":"拉平高时，如果飞机随即下沉，应稳住杆，待飞机下沉到一定高度时，再柔和拉杆"},{"key":"B","text":"拉平高时，如果飞机不下沉，应稍拉杆，使飞机下沉到预定高度"},{"key":"C","text":"发现有拉高的趋势，应推杆"}],"answer":"A","analysis":"提示：柔和\n解析：遥控无人机着陆时，面对拉平高的情况，如果飞机随即下沉，应稳住杆，待飞机下沉到一定高度时，再柔和拉杆，以调整着陆姿态和高度，确保平稳着陆，","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1099","type":"single","difficulty":1,"stem":"遥控无人机着陆时，如果飞机处于逆侧风时（）。","options":[{"key":"A","text":"地速增大，收油门下滑和四转弯时机均应适当提前"},{"key":"B","text":"地速减小，收油门下滑和四转弯时机均应适当延后"},{"key":"C","text":"地速增大，收油门下滑和四转弯时机均应适当延后"}],"answer":"B","analysis":"提示：逆风小延\n解析：遥控无人机着陆时，如果飞机处于逆侧风，地速会减小，因此收油门下滑和四转弯时机均应适当延后，以确保飞机有足够的距离和时间调整姿态，平稳着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1100","type":"single","difficulty":1,"stem":"遥控无人机着陆时，如果飞机处于顺侧风时（）。","options":[{"key":"A","text":"地速增大，收油门下滑和四转弯时机均应适当提前"},{"key":"B","text":"地速减小，收油门下滑和四转弯时机均应适当延后"},{"key":"C","text":"地速增大，收油门下滑和四转弯时机均应适当延后"}],"answer":"A","analysis":"提示：顺风大前\n解析：遥控无人机着陆时，如果飞机处于顺侧风地速会增大，因此收油门下滑和四转弯时机均应适当提前，以避免飞机过早到达着陆点，确保着陆的安全性和准确性。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1101","type":"single","difficulty":1,"stem":"遥控无人机着陆时，如果拉平前飞机的俯角较大下降快，应（）。","options":[{"key":"A","text":"拉杆稍早些"},{"key":"B","text":"拉杆稍晚些"},{"key":"C","text":"还按正常时机拉杆"}],"answer":"A","analysis":"提示：下降快，拉杆快，拉杆早\n解析：遥控无人机着陆时，如果拉平前飞机的俯角较大下降快，应拉杆稍早些，以增加升力，减缓下降速度，确保飞机能够平稳拉平，避免拉平低或着陆速度过大。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1102","type":"single","difficulty":1,"stem":"遥控无人机着陆时，收油门的基本要领是（）。","options":[{"key":"A","text":"适时、柔和"},{"key":"B","text":"适时、快速"},{"key":"C","text":"跟着感觉操作"}],"answer":"A","analysis":"提示：柔和\n解析：遥控无人机着陆时，收油门的基本要领是适时、柔和，以确保飞机能够平稳减速，调整着陆姿态和高度，避免收油门过早或过晚导致着陆偏差或不稳定。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1103","type":"single","difficulty":1,"stem":"遥控无人机着陆时，收油门过晚过细，速度减小慢，使拉平时的速度大，飞机下沉慢，（）。","options":[{"key":"A","text":"容易拉平高或者进入平飘时仰角较小"},{"key":"B","text":"容易拉平低或者进入平飘时仰角较大"},{"key":"C","text":"对飞机无影响"}],"answer":"A","analysis":"提示：飞机下沉慢，拉大容易拉高（粗大细小）\n解析：遥控无人机着陆时，收油门过晚过细会导致速度减小慢，拉平时的速度大，飞机下沉慢，容易拉平高或者进入平飘时仰角较小，影响着陆的稳定性和安全性。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1104","type":"single","difficulty":1,"stem":"遥控无人机着陆时，收油门过早过粗，速度减小快，使拉平时的速度小，飞机下沉快，（）。","options":[{"key":"A","text":"容易拉平高或者进入平飘时仰角较小"},{"key":"B","text":"容易拉平低或者进入平飘时仰角较大"},{"key":"C","text":"对飞机无影响"}],"answer":"B","analysis":"提示：飞机下沉快，拉小容易拉低（粗大细小）\n解析：遥控无人机着陆时，收油门过早过粗会导致速度减小快，拉平时的速度小，飞机下沉快，容易拉平低或者进入平飘时仰角较大，增加着陆的难度和风险。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1105","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当提前，收油门的动作适当加快?","options":[{"key":"A","text":"实际下滑点在预定下滑点前面"},{"key":"B","text":"实际下滑点在预定下滑点后面"},{"key":"C","text":"实际下滑点与预定下滑点吻合"}],"answer":"A","analysis":"提示：前面提前，后面延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 提早收油门则是在下滑阶段早收油门，为了减小飞机的动力与升力，让飞机尽量降低速度/高度，尽早着陆。四种情况提前收：1.实际下滑点在预定下滑点前面;（下滑角小 ，按照预定轨迹下滑容易飞的远，冲出跑道）2.当时的高度高于预定高度;（高度高，容易飞远了，冲出跑道着陆）3.速度大、下沉慢;（飞机容易飞得远，冲出跑道着陆）4.顺风较大。（顺风，飞机速度大，飞机容易冲出跑道）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1106","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当提前，收油门的动作适当加快?","options":[{"key":"A","text":"当时的高度低于预定高度"},{"key":"B","text":"当时的高度高于预定高度"},{"key":"C","text":"当时的高度与预定高度吻合"}],"answer":"B","analysis":"提示：高于提前，低于延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 提早收油门则是在下滑阶段早收油门，为了减小飞机的动力与升力，让飞机尽量降低速度/高度，尽早着陆。四种情况提前收：1.实际下滑点在预定下滑点前面;（下滑角小 ，按照预定轨迹下滑容易飞的远，冲出跑道）2.当时的高度高于预定高度;（高度高，容易飞远了，冲出跑道着陆）3.速度大、下沉慢;（飞机容易飞得远，冲出跑道着陆）4.顺风较大。（顺风，飞机速度大，飞机容易冲出跑道）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1107","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当提前，收油门的动作适当加快?","options":[{"key":"A","text":"速度小、下沉快"},{"key":"B","text":"速度大、下沉慢"},{"key":"C","text":"下沉速度与预定速度符合"}],"answer":"B","analysis":"提示：速度大提前，速度小延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 提早收油门则是在下滑阶段早收油门，为了减小飞机的动力与升力，让飞机尽量降低速度/高度，尽早着陆。四种情况提前收：1.实际下滑点在预定下滑点前面;（下滑角小 ，按照预定轨迹下滑容易飞的远，冲出跑道）2.当时的高度高于预定高度;（高度高，容易飞远了，冲出跑道着陆）3.速度大、下沉慢;（飞机容易飞得远，冲出跑道着陆）4.顺风较大。（顺风，飞机速度大，飞机容易冲出跑道）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1108","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当提前，收油门的动作适当加快?","options":[{"key":"A","text":"顺风较大"},{"key":"B","text":"逆风较大"},{"key":"C","text":"无风情况"}],"answer":"A","analysis":"提示：顺风提前到提前收\n解析：收油门通常在通常在转入平飘时,将油门收完。 提早收油门则是在下滑阶段早收油门，为了减小飞机的动力与升力，让飞机尽量降低速度/高度，尽早着陆。四种情况提前收：1.实际下滑点在预定下滑点前面;（下滑角小 ，按照预定轨迹下滑容易飞的远，冲出跑道）2.当时的高度高于预定高度;（高度高，容易飞远了，冲出跑道着陆）3.速度大、下沉慢;（飞机容易飞得远，冲出跑道着陆）4.顺风较大。（顺风，飞机速度大，飞机容易冲出跑道）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1109","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当延迟，收油门的动作适当减慢?","options":[{"key":"A","text":"实际下滑点在预定下滑点前面"},{"key":"B","text":"实际下滑点在预定下滑点后面"},{"key":"C","text":"实际下滑点与预定下滑点吻合"}],"answer":"B","analysis":"提示：前面提前，后面延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 延迟收油门则是平飘时还有油门，主轮接地前收完。为的是让平飘阶段仍有足够的动力和升力。让飞机再往前飞一段。四种情况延迟收：1.实际下滑点在预定下滑点后面;（下滑角大 ，飞机下滑姿态陡，升力减小过快，导致提前着陆）2.当时的高度低于预定高度;（高度低，导致提前着陆）3.速度小、下沉快;（导致提前着陆）4.逆风较大。（顶风，飞机速度下降快，导致提前着陆）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1110","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当延迟，收油门的动作适当减慢?","options":[{"key":"A","text":"当时的高度低于预定高度"},{"key":"B","text":"当时的高度高于预定高度"},{"key":"C","text":"当时的高度与预定高度吻合"}],"answer":"A","analysis":"提示：高于提前，低于延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 延迟收油门则是平飘时还有油门，主轮接地前收完。为的是让平飘阶段仍有足够的动力和升力。让飞机再往前飞一段。四种情况延迟收：1.实际下滑点在预定下滑点后面;（下滑角大 ，飞机下滑姿态陡，升力减小过快，导致提前着陆）2.当时的高度低于预定高度;（高度低，导致提前着陆）3.速度小、下沉快;（导致提前着陆）4.逆风较大。（顶风，飞机速度下降快，导致提前着陆）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1111","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当延迟，收油门的动作适当减慢?","options":[{"key":"A","text":"速度小、下沉快"},{"key":"B","text":"速度大、下沉慢"},{"key":"C","text":"下沉速度与预定速度符合"}],"answer":"A","analysis":"提示：速度大提前，速度小延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 延迟收油门则是平飘时还有油门，主轮接地前收完。为的是让平飘阶段仍有足够的动力和升力。让飞机再往前飞一段。四种情况延迟收：1.实际下滑点在预定下滑点后面;（下滑角大 ，飞机下滑姿态陡，升力减小过快，导致提前着陆）2.当时的高度低于预定高度;（高度低，导致提前着陆）3.速度小、下沉快;（导致提前着陆）4.逆风较大。（顶风，飞机速度下降快，导致提前着陆）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1112","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况，收油门的时机应适当延迟，收油门的动作适当减慢?","options":[{"key":"A","text":"顺风较大"},{"key":"B","text":"逆风较大"},{"key":"C","text":"无风情况"}],"answer":"B","analysis":"提示：顺风提前到提前收；逆风延后\n解析：收油门通常在通常在转入平飘时,将油门收完。 延迟收油门则是平飘时还有油门，主轮接地前收完。为的是让平飘阶段仍有足够的动力和升力。让飞机再往前飞一段。四种情况延迟收：1.实际下滑点在预定下滑点后面;（下滑角大 ，飞机下滑姿态陡，升力减小过快，导致提前着陆）2.当时的高度低于预定高度;（高度低，导致提前着陆）3.速度小、下沉快;（导致提前着陆）4.逆风较大。（顶风，飞机速度下降快，导致提前着陆）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1113","type":"single","difficulty":1,"stem":"遥控无人机着陆时，下列哪种情况需要复飞?","options":[{"key":"A","text":"飞机稍稍偏离期望下滑线"},{"key":"B","text":"飞机油料不足"},{"key":"C","text":"跑道上有飞机或其它障碍物影响着陆安全时"}],"answer":"C","analysis":"提示：障碍触发复飞规避\n解析：当跑道上有飞机或其它障碍物影响着陆安全时，必须采取复飞措施，以确保着陆的安全性。飞机稍稍偏离期望下滑线或油料不足，通常不会构成需要复飞的紧急情况。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1114","type":"single","difficulty":1,"stem":"遥控无人机着陆时，修正目测偏差，（）。","options":[{"key":"A","text":"偏差大，加、收油门量相应大一些"},{"key":"B","text":"偏差大，加、收油门量相应小一些"},{"key":"C","text":"不必调整"}],"answer":"A","analysis":"提示：偏差大， 收油门大\n解析：遥控无人机着陆时，如果目测存在偏差且偏差较大，为了迅速调整飞机姿态和位置，需要加、收油门量相应大一些，以增加或减小升力，使飞机能够快速回到预定着陆轨迹。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1115","type":"single","difficulty":1,"stem":"遥控无人机转弯时产生偏差的主要原因不包括（）。","options":[{"key":"A","text":"进入和退出转弯时，动作不协调，产生侧滑"},{"key":"B","text":"转弯中，未保持好机头与天地线的关系位置，以致速度增大或减小"},{"key":"C","text":"天气状况不佳"}],"answer":"C","analysis":"提示：选错的。偏差不包括天气\n解析：遥控无人机转弯时产生偏差的主要原因通常包括飞行员的操作技巧、飞机状态以及环境因素等。天气状况不佳虽然可能影响飞行，但不是转弯产生偏差的主要原因。转弯中的偏差更多与飞行员的操作和飞机状态有关。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1116","type":"single","difficulty":1,"stem":"着陆目测是操作手根据飞机飞行高度和降落点距离进行目视判断，对于目测质量的评判为（）。","options":[{"key":"A","text":"飞机没有达到目测接地范围就接地的，叫目测低"},{"key":"B","text":"飞机没有达到目测接地范围就接地的，叫目测高"},{"key":"C","text":"飞机超过目测接地范围才接地的，叫目测低"}],"answer":"A","analysis":"提示：没到就接地，目测低 超过才接地，目测高\n解析：关于目测准确的目测是使飞机在预定着陆点前后一定范围内接地。没有达到这一范围内就接地的,叫目测低;（判断有误，预测的高度低于实际高度）超过这一范围才接地的,叫目测高。（判断有误：预测的高度高于实际高度）","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1117","type":"single","difficulty":1,"stem":"操纵无人机，起飞前需要了解的无人机基本性能不包括（）。","options":[{"key":"A","text":"无人机着陆性能"},{"key":"B","text":"无人机速度范围"},{"key":"C","text":"无人机升限"}],"answer":"C","analysis":"提示：选错的。不需了解升限\n解析：操纵无人机起飞前，需要了解的无人机基本性能包括着陆性能、速度范围等，以确保飞行安全。而无人机的升限虽然是一个重要参数，但在起飞前的准备工作中不是必须了解的内容，它更多关联到飞行任务的规划和执行。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1118","type":"single","difficulty":1,"stem":"操纵无人机起飞前，动力装置不需要检查的是（）。","options":[{"key":"A","text":"发动机稳定性检查"},{"key":"B","text":"发动机生产日期"},{"key":"C","text":"发动机油路检查"}],"answer":"B","analysis":"提示：选错的。不需检查生产日期\n解析：操纵无人机起飞前，动力装置的检查至关重要。发动机稳定性检查和油路检查都是必要的，以确保发动机在飞行中能够正常工作。而发动机的生产日期与起飞前的检查工作无直接关联，因此不需要检查。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1119","type":"single","difficulty":1,"stem":"操纵无人机长时间爬升，发动机温度容易高，下列正确的操纵是（）。","options":[{"key":"A","text":"适时定高飞行，待各指标正常后再继续爬升"},{"key":"B","text":"发现发动机各参数不正常时迅速转下降"},{"key":"C","text":"不必操纵，信任发动机自身性能"}],"answer":"A","analysis":"提示：歇歇再飞\n解析：操纵无人机长时间爬升时，发动机温度容易升高。为了避免过热，正确的操纵方法是适时定高飞行，让发动机有时间冷却，待各指标正常后再继续爬升。迅速转下降可能会导致飞行不稳定，而信任发动机自身性能则可能忽视过热的风险。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1120","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机定高平飞时，下列正确的操纵是（）。","options":[{"key":"A","text":"不断检查空速、高度和航向指示"},{"key":"B","text":"定高平飞结束前可以休息"},{"key":"C","text":"偶尔关注一下空速、高度和航向指示"}],"answer":"A","analysis":"提示：不能休息，不断检查\n解析：飞行驾驶员操纵无人机定高平飞时，需要不断检查空速、高度和航向指示，以确保飞行状态的稳定和安全。定高平飞结束前休息或偶尔关注飞行参数都是不负责任的行为，可能导致飞行偏离预定轨迹或发生危险。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1121","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机坡度转弯时，同时操纵方向舵作用是（）。","options":[{"key":"A","text":"进行协调转弯，可有效减小转弯半径并减少侧滑"},{"key":"B","text":"进行协调转弯，可有效增大转弯半径并减少侧滑"},{"key":"C","text":"进行协调转弯，可有效减小转弯半径并增大侧滑"}],"answer":"A","analysis":"提示：坡度转弯→双减\n解析：飞行驾驶员在操纵无人机进行坡度转弯时,同时操纵方向舵可以进行协调转弯。这种操纵方式可以有效减小转弯半径，因为坡度转弯利用了升力向量的分量来产生向心力，同时减少侧滑，提高转弯效率。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1122","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机无坡度转弯,正确的操纵方式是（）。","options":[{"key":"A","text":"向转弯方向压方向舵，副翼同方向打以保证坡度水平"},{"key":"B","text":"向转弯方向压方向舵，副翼反打以保证坡度水平"},{"key":"C","text":"向转弯方向压方向舵，副翼同方向打以形成坡度"}],"answer":"B","analysis":"提示：无坡度转弯→反打\n解析：无人机进行无坡度转弯时，正确的操纵方式是向转弯方向压方向舵，同时副翼反打以保证坡度水平。这样可以确保飞机在转弯过程中保持水平姿态，避免不必要的坡度变化，从而实现平稳的转弯。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1123","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机转弯时，可能出现情况是（）。","options":[{"key":"A","text":"在一定条件下的转弯中，坡度增大，机头会下俯，速度随即增大"},{"key":"B","text":"在一定条件下的转弯中，坡度增大，机头会上仰，速度随即减小"},{"key":"C","text":"在一定条件下的转弯中，坡度增大，机头会上仰，速度随即增大"}],"answer":"A","analysis":"提示：转弯：大下大\n解析：在一定条件下的转弯中，当坡度增大时，机头会下俯，这是因为升力向量的分量更多地用于产生向心力，导致升力在垂直方向上的分量减小，飞机为了保持高度会自然下俯。同时，下俯会增加空速，因此速度会随即增大。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1124","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机转弯时，下列错误的过程描述是（）。","options":[{"key":"A","text":"坡度形成，飞机即进入转弯"},{"key":"B","text":"改平坡度，飞机转弯即停止"},{"key":"C","text":"可以在只操纵方向舵不形成坡度的情况下实现快速高效转弯"}],"answer":"C","analysis":"提示：选错的。不形成坡度×\n解析：描述中“可以在只操纵方向舵不形成坡度的情况下实现快速高效转弯”是错误的。只操纵方向舵而不形成坡度会导致侧滑，增加阻力，降低转弯效率。快速高效的转弯需要坡度和方向舵的协调操纵，以充分利用升力向量的分量来产生向心力。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1125","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机转弯时，下列描述正确的操纵方式是（）。","options":[{"key":"A","text":"机头过高时，应向转弯一侧的斜后方适当推杆并稍扭舵"},{"key":"B","text":"机头过高时，应向转弯一侧的斜前方适当推杆并稍扭舵"},{"key":"C","text":"机头过高时，应向转弯一侧的斜前方适当拉杆并稍扭舵"}],"answer":"B","analysis":"提示：转弯：过高斜前推杆，过低斜后拉杆 （顶杆下，拉杆上）\n解析：机头过高时，为了调整姿态，应向转弯一侧的斜前方适当推杆并稍扭舵。这样可以减小坡度，使机头下俯，同时利用方向航修正航向，保持转弯的协调性和效率。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1126","type":"single","difficulty":1,"stem":"飞行驾驶员操纵无人机转弯时，下列描述正确的操纵方式是（）。","options":[{"key":"A","text":"机头过低时，应向转弯一侧的斜后方适当拉杆并稍回舵"},{"key":"B","text":"机头过低时，应向转弯一侧的斜前方适当推杆并稍扭舵"},{"key":"C","text":"机头过低时，应向转弯一侧的斜前方适当拉杆并稍扭舵"}],"answer":"A","analysis":"提示：转弯：过高斜前推杆，过低斜后拉杆 （顶杆下，拉杆上）\n解析：当机头过低时，应向转弯一侧的斜后方适当拉杆并稍回舵。这样可以抬高机头高度同时实现转弯。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1127","type":"single","difficulty":1,"stem":"飞行驾驶员姿态遥控模式下操纵无人机，下降中，速度过大时，下列正确的操纵是（）。","options":[{"key":"A","text":"适当减小带杆量，增大下滑角"},{"key":"B","text":"适当减小带杆量，减小下滑角"},{"key":"C","text":"适当增加带杆量，减小下滑角"}],"answer":"C","analysis":"提示：姿态下降：增加减小\n解析：下滑角越大，下降越陡，下降速度就越大。因此下降速度过快时，需要减小下滑角。 操纵动作：带杆（向后拉杆），使机头上扬，以此减小下滑角，进而减慢下滑速度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1128","type":"single","difficulty":1,"stem":"飞行驾驶员姿态遥控模式下操纵无人机下降时，下列正确的操纵是（）。","options":[{"key":"A","text":"如俯角过小，应柔和地向前顶杆"},{"key":"B","text":"如俯角过小，应柔和地向后带杆"},{"key":"C","text":"如俯角过小，应柔和地向左压杆"}],"answer":"A","analysis":"提示：姿态下降：向前顶杆\n解析：在姿态模式下，操纵杆的动作直接对应无人机的姿态变化。其中，前后杆控制无人机的俯仰角，即机头的上下倾斜程度；左右杆控制横滚角，与俯角调整无关。当俯角过小时，意味着机头向上倾斜角度不足（或接近水平），无人机下降速度慢。此时需要增大俯角，让机头更向下倾斜，以加快下降。向前顶杆：会使机头向下倾斜，直接增大俯角，符合 “俯角过小需增大” 的需求。向后带杆：会使机头向上倾斜，进一步减小俯角，与需求相反。向左压杆：仅控制横滚（无人机左右倾斜），与俯角无关，无法调整下降状态。因此选向前顶杆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1129","type":"single","difficulty":1,"stem":"通过地面站界面控制台上的鼠标按键飞行摇杆操纵无人机的驾驶员称为（）。","options":[{"key":"A","text":"飞行员"},{"key":"B","text":"起降驾驶员"},{"key":"C","text":"飞行驾驶员"}],"answer":"C","analysis":"提示：盒子是起降，鼠标是飞驾\n解析：通过地面站界面控制台上的鼠标按键飞行摇杆操纵无人机的驾驶员，其职责更侧重于飞行的整体操控，包括起飞、航行、着陆等，因此称为飞行驾驶员。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1130","type":"single","difficulty":1,"stem":"通过专用的遥控器外部控制盒操纵无人机的驾驶员称为（）。","options":[{"key":"A","text":"飞行员"},{"key":"B","text":"起降驾驶员"},{"key":"C","text":"飞行驾驶员"}],"answer":"B","analysis":"提示：盒子是起降，鼠标是飞驾\n解析：起降驾驶员是指通过专用的遥控器外部控制盒来操纵无人机的驾驶员，主要负责无人机的起飞和着陆过程，确保这些关键阶段的安全执行。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1131","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机地面滑行时，下列描述正确的是（）。","options":[{"key":"A","text":"主要通过控制方向舵杆量操纵"},{"key":"B","text":"主要通过控制副翼杆量操纵"},{"key":"C","text":"主要通过控制升降舵杆量操纵"}],"answer":"A","analysis":"提示：滑行是方向控制\n解析：无人机地面滑行时，主要通过控制方向舵杆量来操纵航向，因为方向舵负责改变飞机的航向，而副翼和升降舵则分别负责控制飞机的横滚和俯仰。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1132","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机定高平飞航迹偏离时，下列描述正确的是（）。","options":[{"key":"A","text":"如果轨迹方向偏离目标5°以内，应柔和地向偏转的反方向适当扭舵杆"},{"key":"B","text":"如果轨迹方向偏离目标5°以内，应柔和地向偏转的方向适当扭舵杆"},{"key":"C","text":"如果轨迹方向偏离目标5°以内，应快速大幅度地向偏转的反方向适当扭舵杆"}],"answer":"A","analysis":"提示：5°内，柔和反\n解析：当无人机定高平飞航迹偏离目标5°以内时，应柔和地向偏转的反方向适当扭舵杆以微调航向，使无人机逐渐回到预定的飞行轨迹上。快速大幅度的操作可能导致飞行不稳定。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1133","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机定高平飞时，下列操纵正确的是（）。","options":[{"key":"A","text":"如航迹方向偏离目标超过5°，应缓慢地向偏转的反方向适当扭舵杆"},{"key":"B","text":"如航迹方向偏离目标超过5°，应协调地压杆扭舵，使飞机对正目标，然后改平坡度"},{"key":"C","text":"如航迹方向偏离目标超过5°应柔和地向偏转的方向适当扭舵杆"}],"answer":"B","analysis":"提示：5°外，协调压\n解析：当无人机定高平飞时，如航迹方向偏离目标超过5°，应协调地压杆扭舵，使飞机对正目标，然后改平坡度。这样可以有效调整飞行方向，确保无人机按照预定航线飞行。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1134","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机复飞时，油门状态描述正确的是（）。","options":[{"key":"A","text":"逐渐推至大车状态"},{"key":"B","text":"保持小油门"},{"key":"C","text":"逐渐收至小车状态"}],"answer":"A","analysis":"提示：复飞大车\n解析：无人机复飞时，为了迅速获得足够的升力和推力，油门应逐渐推至大车状态。这样可以确保无人机有足够的动力进行爬升，避免复飞过程中失速或坠落。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1135","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机拉平时，下列描述正确的操纵是（）。","options":[{"key":"A","text":"小偏差时不必修正，待形成一定偏差 时修正即可"},{"key":"B","text":"快速根据飞机偏差大力度修正"},{"key":"C","text":"正确的拉平动作，必须按照实际情况，主动地、有预见性地、机动灵活地去操纵飞机"}],"answer":"C","analysis":"提示：问题对答案，拉平对拉平\n解析：无人机拉平时，正确的操纵是主动地、有预见地、机动灵活地去操纵飞机。这样可以确保拉平过程的平稳和安全，避免由于偏差过大或修正不及时导致的飞行事故。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1136","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机平飞转爬升时，下列操纵易产生偏差的是（）。","options":[{"key":"A","text":"及时检查地平仪位置关系，及时修正偏差"},{"key":"B","text":"平飞、爬升飞行状态变换时，推杆拉杆方向不正，干扰其他通道"},{"key":"C","text":"动作柔和，且有提前量"}],"answer":"B","analysis":"提示：这次不选柔和。偏差有干扰\n解析：无人机平飞转爬升时，易产生偏差的操纵是平飞、爬升飞行状态变换时，推杆、拉杆方向不正，干扰其他通道。这可能导致飞行姿态的不稳定，甚至偏离预定航线。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1137","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机刹车时机描述正确的是（）。","options":[{"key":"A","text":"飞机接地后，马上刹车"},{"key":"B","text":"飞机接地后，待速度降到安全范围内刹车"},{"key":"C","text":"飞机接地后，待飞机滑停后再刹车"}],"answer":"B","analysis":"提示：安全再刹车\n解析：无人机接地后，应待速度降到安全范围内再进行刹车，以避免因刹车过早导致飞机打滑或失控，确保着陆过程的安全和稳定。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1138","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机下降到10米以下时，应重点关注的信息是（）。","options":[{"key":"A","text":"飞机下降速度、姿态和空速"},{"key":"B","text":"飞机剩余油量"},{"key":"C","text":"飞机航行灯开闭状态"}],"answer":"A","analysis":"提示：10米以下速度姿态\n解析：无人机下降到10米以下时，应重点关注的信息是飞机下降速度、姿态和空速。这些信息对于确保无人机安全着陆至关重要，任何偏差都可能导致着陆失败或事故。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1139","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机下降时，油门状态描述正确的是（）。","options":[{"key":"A","text":"大油门保证飞机速度"},{"key":"B","text":"小油门便于飞机下降"},{"key":"C","text":"油门置于中间状态留足操纵空间"}],"answer":"B","analysis":"提示：小油门便于下降\n解析：无人机下降时，小油门可以减小发动机推力，便于飞机下降，同时也有助于控制下降速度，确保安全着陆。大油门会增加下降速度，不利于精确操控。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1140","type":"single","difficulty":1,"stem":"无人机驾驶员操纵无人机着陆滑跑时，油门状态描述正确的是（）。","options":[{"key":"A","text":"飞机接地后，为保证安全一般将油门收为零"},{"key":"B","text":"飞机接地后，将油门保持大车状态，准备随时复飞"},{"key":"C","text":"飞机接地后，着陆滑跑一段距离再收油门"}],"answer":"A","analysis":"提示：滑跑油门收零\n解析：无人机着陆滑跑时，飞机接地后为保证安全，一般将油门收为零，以减少发动机推力，避免飞机在地面加速或失控，保持大车状态或延迟收油门都可能增加风险。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1141","type":"single","difficulty":1,"stem":"无人机驾驶员遥控无人机起飞滑跑描述正确的是（）。","options":[{"key":"A","text":"迅速将油门推至大车并快速拉杆起飞"},{"key":"B","text":"逐渐将油门推至大车并在速度达到起飞速度时柔和拉杆起飞"},{"key":"C","text":"将油门迅速推至大车，等飞机速度积累到足够使其自动起飞"}],"answer":"B","analysis":"提示：柔和\n解析：无人机起飞滑跑时，应逐渐将油门推至大车，并在速度达到起飞速度时柔和拉杆起飞。这样可以确保飞机在起飞过程中获得足够的升力，同时保持稳定的飞行姿态。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1142","type":"single","difficulty":1,"stem":"无人机前轮偏转的目的，（）。","options":[{"key":"A","text":"主要是为了地面拖飞机"},{"key":"B","text":"保证飞机滑行转弯和修正滑跑方向"},{"key":"C","text":"前轮摆振时减小受力"}],"answer":"B","analysis":"提示：偏转目的：修正\n解析：无人机前轮偏转的主要目的是为了保证飞机在地面滑行时能够转弯和修正滑跑方向。前轮偏转可以提供必要的侧向力，使飞机能够按照预定的路线进行滑行和转弯。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1143","type":"single","difficulty":1,"stem":"无人机左侧风中起飞，侧风有使飞机机头向（）偏转的趋势。","options":[{"key":"A","text":"左"},{"key":"B","text":"右"},{"key":"C","text":"视风速的大小不同可能向左也可能向右"}],"answer":"A","analysis":"提示：左侧风使飞机左偏转\n解析：在左侧风中起飞时，侧风有使飞机机头向左偏转的趋势。这是因为侧风对飞机右侧产生的压力大于左侧，导致飞机有向左偏转的趋势。飞行员需要相应调整操纵以保持飞机稳定。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1144","type":"single","difficulty":1,"stem":"下列不属于转弯时易产生的偏差描述和原因的是（）。","options":[{"key":"A","text":"进入和退出转弯时，动作不协调，产生侧滑"},{"key":"B","text":"转弯中，未保持好机头与天地线的关系位置，以致速度增大或减小"},{"key":"C","text":"发动机推力不足，导致形成高度偏差"}],"answer":"C","analysis":"提示：选错的。发动机×\n解析：转弯时易产生的偏差主要包括动作不协调导致的侧滑和未保持好机头与天地线关系导致的速度变化。而发动机推力不足导致的高度偏差与转弯动作的执行不直接相关。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1145","type":"single","difficulty":1,"stem":"遥控无人机着陆时，对用侧滑的方法修正侧风影响的正确描述是（）。","options":[{"key":"A","text":"判明偏流的方向及影响大小，适量向侧风方向压杆形成坡度，并反扭舵抵制飞机转弯"},{"key":"B","text":"判明偏流的方向及影响大小，适量向侧风反方向压杆形成坡度，并反扭舵抵制飞机转弯"},{"key":"C","text":"判明偏流的方向及影响大小，适量向侧风方向压杆形成坡度，并同向扭舵抵制飞机转弯"}],"answer":"A","analysis":"提示：侧风方向反扭舵\n解析：在遥控无人机着陆时，若受到侧风影响，应判明偏流的方向及影响大小，适量向侧风方向压杆形成坡度，并反扭舵抵制飞机转弯，以保持飞机在跑道中心线上着陆.","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1146","type":"single","difficulty":1,"stem":"遥控无人机着陆时，对用侧滑的方法修正侧风影响描述正确的是（）。","options":[{"key":"A","text":"下降率增大，目测容易低，应适当加油门修正"},{"key":"B","text":"下降率增大，目测容易高，应适当减油门修正"},{"key":"C","text":"下降率减小，目测容易低，应适当加油门修正"}],"answer":"A","analysis":"提示：侧风目测低加油\n解析：遥控无人机着陆时，若下降率增大，目测容易偏低，此时应适当加油门以减小下降率，确保飞机能够平稳着陆在预定位置，避免过早接地。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1147","type":"single","difficulty":1,"stem":"遥控无人机着陆时，对用侧滑与改变航向相结合的方法修正侧风影响描述正确的是（）。","options":[{"key":"A","text":"退出第四转弯的时机应根据风向适当提前或延迟"},{"key":"B","text":"退出第四转弯的时机一律适当提前"},{"key":"C","text":"退出第四转弯的时机一律适当延迟"}],"answer":"A","analysis":"提示：侧风提前或延迟（都选）\n解析：在遥控无人机着陆时，若采用侧滑与改变航向相结合的方法修正侧风影响，退出第四转弯的时机应根据风向适当提前或延迟,以确保飞机能够准确对准跑道中心线。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1148","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"第三转弯时机应适当延后，以便第四转弯点距降落点比正常略近一些"},{"key":"B","text":"第三转弯时机应适当提前，以便第四转弯点距降落点比正常略近一些"},{"key":"C","text":"第三转弯时机应适当提前，以便第四转弯点距降落点比正常略远一些"}],"answer":"B","analysis":"提示：逆3前4近\n解析：大逆风着陆时，第三转弯时机应适当提前，以便第四转弯点距降落点比正常略近一些，这样可以更好地调整飞机姿态和速度，为着陆做准备。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1149","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"第三转弯后，适当提前下滑时机，进入第四转弯的高度应比正常风速时略低"},{"key":"B","text":"第三转弯后，适当延迟下滑时机，进入第四转弯的高度应比正常风速时略高"},{"key":"C","text":"第三转弯后，适当提前下滑时机，进入第四转弯的高度应比正常风速时略高"}],"answer":"B","analysis":"提示：逆3晚4高\n解析：大逆风着陆时，第三转弯后应适当延迟下滑时机，进入第四转弯的高度应比正常风速时略高，以抵消逆风对下滑轨迹的影响。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1150","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"四转弯后，地速减小，下滑角增大，下滑点应适当前移，并及时减小油门保持相应的速度下滑"},{"key":"B","text":"四转弯后，地速增加，下滑角减小，下滑点应适当后移，并及时减小油门保持相应的速度下滑"},{"key":"C","text":"四转弯后，地速减小，下滑角增大，下滑点应适当前移，并及时加大油门保持相应的速度下滑"}],"answer":"C","analysis":"提示：逆4小前移大\n解析：四转弯后，地速减小，下滑角增大，下滑点应适当前移，并及时加大油门保持相应的速度下滑，以确保飞机能够稳定着陆。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1151","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"下滑空速度较大，舵面效用较强，开始拉平的时机应比正常稍晚"},{"key":"B","text":"下滑空速度较大，舵面效用较强，开始拉平的时机应比正常稍早"},{"key":"C","text":"下滑空速度较小，舵面效用较弱，开始拉平的时机应比正常稍早"}],"answer":"A","analysis":"提示：逆大强晚\n解析：大逆风着陆时，下滑空速度较大，舵面效用较强，开始拉平的时机应比正常稍晚，以以便更好地调整飞机姿态和速度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1152","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"拉平后，速度减小加快，平飘距离缩短"},{"key":"B","text":"拉平后，速度减小加快，平飘距离增长"},{"key":"C","text":"拉平后，速度增大加快，平飘距离缩短"}],"answer":"A","analysis":"提示：逆拉平小快短\n解析：拉平后，速度减小加快，平飘距离缩短，这是大逆风着陆时的特点，需要及时调整飞机姿态和速度以适应这一变化。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1153","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"平飘前段，速度较大，飞机下沉较慢，拉杆的动作应快速，防止拉飘"},{"key":"B","text":"平飘前段，速度较大，飞机下沉较慢，拉杆的动作应柔和，防止拉飘"},{"key":"C","text":"平飘前段，速度较小，飞机下沉较快，拉杆的动作应快速，防止下沉过快"}],"answer":"B","analysis":"提示：逆飘大慢柔和\n解析：根据蓝皮书“大逆风着陆”知识点：平飘前段,速度较大,飞机下沉较慢,拉杆的动作应柔和,防止拉飘。速度减小到一定程度时,飞机下沉较快,应根据飞机接近地面的快慢及时适量地 。拉杆。本题记忆三点：1.“平飘前段,速度较大”：这个“速度大”是相对于“平飘后段”来比较的，整个着陆阶段，速度是“从快到慢”递减的，2.这时，飞机下沉是“慢”的：平飘初始阶段空速高，虽然不加油了，但是机翼还是因为惯性的高速度，产生了升力，有效的抵消机身重力，所以下沉平缓。随着速度不断降低，升力逐步衰减，重力作用凸显，下沉就会明显变快。 3.三个选项只有一个带“柔和”，大概率选“柔和”","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1154","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于大逆风着陆描述正确的是（）。","options":[{"key":"A","text":"着陆后，立即刹车"},{"key":"B","text":"着陆后，地速减小快，刹车不要太早"},{"key":"C","text":"着陆后，地速减小慢，刹车不要太晚"}],"answer":"B","analysis":"提示：逆风地速减小快\n解析：着陆后，地速减小快，刹车不要太早，以免飞机过早停下或偏离跑道。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1155","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于顺风着陆描述正确的是（）。","options":[{"key":"A","text":"进入三转弯的时机应适当延迟，转弯的角度应适当减小，使第四转弯点距着陆点的距离适当远一些"},{"key":"B","text":"进入三转弯的时机应适当提前，转弯的角度应适当增大，使第四转弯点距着陆点的距离适当近一些"},{"key":"C","text":"正常时机三转弯即可，四转弯点距着陆点距离远近不影响安全着陆"}],"answer":"A","analysis":"提示：逆3前4近 顺3迟4远\n解析：顺风着陆时，进入三转弯的时机应适当延迟，转弯的角度应适当减小，使第四转弯点距着陆点的距离适当远一些，以抵消顺风对下滑轨迹的影响。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1156","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于顺风着陆描述正确的是（）。","options":[{"key":"A","text":"进入四转弯的高度应比正常稍低，收油门下滑和进入时机应适当提前"},{"key":"B","text":"进入四转弯的高度应比正常稍高，收油门下滑和进入时机应适当延后"},{"key":"C","text":"进入四转弯的高度应比正常稍低，收油门下滑和进入时机应适当延后"}],"answer":"A","analysis":"提示：顺4低提前\n解析：顺风着陆时，进入四转弯的高度应比正常稍低，收油门下滑和进入时机应适当提前，以便更好地调整飞机姿态和速度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1157","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于顺风着陆描述正确的是（）。","options":[{"key":"A","text":"四转弯后，地速减小，下滑角增大，下滑点应适当前移，下滑速度比正常大一些"},{"key":"B","text":"四转弯后，地速增大，下滑角减小，下滑点应适当后移，下滑速度比正常小一些"},{"key":"C","text":"四转弯后，地速增大，下滑角减小，下滑点应适当前移，下滑速度比正常大一些"}],"answer":"B","analysis":"提示：顺4大小小\n解析：四转弯后，地速增大，下滑角减小，下滑点应适当后移，下滑速度比正常小一些，这是顺风着陆时的特点。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1158","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于顺风着陆描述正确的是（）。","options":[{"key":"A","text":"下滑空速度较大，舵面效用较强，在拉平过程中，拉杆动作应及时、适量，防止拉平高"},{"key":"B","text":"下滑空速度较小，舵面效用较弱，在拉平过程中，拉杆动作应及时、适量，防止拉平低"},{"key":"C","text":"跟无风情况下一样，不需特别操作"}],"answer":"B","analysis":"提示：顺小弱早（及时）\n解析：顺风着陆时，下滑空速度较小，舵面效用较弱，在拉平过程中，拉杆动作应及时、适量，防止拉平低。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1159","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于顺风着陆描述正确的是（）。","options":[{"key":"A","text":"地速较大，平飘距离较长"},{"key":"B","text":"地速较小，平飘距离较短"},{"key":"C","text":"地速正常，平飘距离正常"}],"answer":"A","analysis":"提示：顺地速大，飘距长\n解析：顺风着陆时，地速较大，平飘距离较长，需要及时调整飞机姿态和速度以适应这一变化。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1160","type":"single","difficulty":1,"stem":"遥控无人机着陆时，关于顺风着陆描述正确的是（）。","options":[{"key":"A","text":"着陆滑跑中，应及时刹车，以免滑跑距离过长"},{"key":"B","text":"着陆滑跑中，应延后刹车，以免滑跑距离过短"},{"key":"C","text":"着陆滑跑中，按正常时机刹车即可"}],"answer":"A","analysis":"提示：顺滑及时\n解析：顺风着陆滑跑中，应及时刹车，以免滑跑距离过长，确保飞机能够安全停在跑道上。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1161","type":"single","difficulty":1,"stem":"以下哪一种情景容易引起飞行员产生飞机比实际位置偏高的错觉?","options":[{"key":"A","text":"常规跑道"},{"key":"B","text":"向上带斜坡的地形"},{"key":"C","text":"向下带斜坡的地形"}],"answer":"B","analysis":"提示：错觉：上坡偏高，下坡偏低\n解析：向上带斜坡的地形容易使飞行员产生飞机比实际位置偏高的错觉，因为飞行员会参照斜坡的倾斜角度来判断飞机的位置，导致误判。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1162","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，飞机带右坡度时，下列正确的操纵是（）。","options":[{"key":"A","text":"应柔和地向前顶杆"},{"key":"B","text":"应柔和地回杆或向左压杆"},{"key":"C","text":"应柔和地向右压杆"}],"answer":"B","analysis":"提示：姿态爬升：右坡左/左坡右\n解析：飞机带右坡度时，为了保持爬升并纠正坡度，应柔和地回杆或向左压杆，以产生向左的力，使飞机回到水平姿态。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1163","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，飞机带左坡度时，下列正确的操纵是（）。","options":[{"key":"A","text":"应柔和地向前顶杆"},{"key":"B","text":"应柔和地向左压杆"},{"key":"C","text":"应柔和地回杆或向右压杆"}],"answer":"C","analysis":"提示：姿态爬升：右坡左/左坡右\n解析：飞机带左坡度时，为了保持爬升并纠正坡度，应柔和地向右压杆或回杆，以产生向右的力，使飞机回到水平姿态。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1164","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，飞机航向向右偏离时，下列正确的操纵是（）。","options":[{"key":"A","text":"应柔和地向前顶杆"},{"key":"B","text":"应柔和地向左扭舵"},{"key":"C","text":"应柔和地向右扭舵"}],"answer":"B","analysis":"提示：姿态爬升：右坡左/左坡右\n解析：飞机航向向右偏离时，为了纠正航向并保持爬升，应柔和地向左扭舵，使飞机航向回到预定方向。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1165","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，飞机航向向左偏离时，下列正确的操纵是（）。","options":[{"key":"A","text":"应柔和地向前顶杆"},{"key":"B","text":"应柔和地向左扭舵"},{"key":"C","text":"应柔和地向右扭舵"}],"answer":"C","analysis":"提示：姿态爬升：右坡左/左坡右\n解析：飞机航向向左偏离时，为了纠正航向并保持爬升，应柔和地向右扭舵，使飞机航向回到预定方向。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1166","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，飞机爬升率过小时，下列正确的操纵是（）。","options":[{"key":"A","text":"柔和减小俯仰角"},{"key":"B","text":"柔和增大俯仰角"},{"key":"C","text":"迅速停止爬升"}],"answer":"B","analysis":"提示：姿态爬升：升率不够，增大俯仰角\n解析：在姿态遥控模式下操纵无人机爬升时，如果爬升率过小，说明飞机的上升角度不够，此时应柔和增大俯仰角，以增加爬升率。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1167","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，飞机速度减小太多时，下列正确的操纵是（）。","options":[{"key":"A","text":"迅速减小俯仰角"},{"key":"B","text":"柔和增大俯仰角"},{"key":"C","text":"迅速关闭发动机"}],"answer":"A","analysis":"提示：姿态爬升：速度不够，减小俯仰角\n解析：飞机速度减小太多时，说明飞机可能处于失速状态或动力不足，此时应迅速减小俯仰角，降低爬升率，以恢复速度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1168","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，俯仰角偏低时，下列正确的操纵是（）。","options":[{"key":"A","text":"应柔和地向前顶杆"},{"key":"B","text":"应柔和地向后带杆"},{"key":"C","text":"应柔和地向右扭舵"}],"answer":"B","analysis":"提示：姿态爬升：偏低就向后拉杆（顶杆下，拉杆上）\n解析：俯仰角偏低时，飞机爬升角度不足，为了增加爬升角度，应柔和地向后带杆，使飞机抬头。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1169","type":"single","difficulty":1,"stem":"姿态遥控模式下操纵无人机爬升，俯仰角偏高时，下列正确的操纵是（）。","options":[{"key":"A","text":"应柔和地向前顶杆"},{"key":"B","text":"应柔和地向后带杆"},{"key":"C","text":"应柔和地向右扭舵"}],"answer":"A","analysis":"提示：姿态爬升：偏高就向前顶杆（顶杆下，拉杆上）\n解析：俯仰角偏高时，飞机爬升角度过大，可能导致速度减小甚至失速，此时应柔和地向前顶杆，使飞机低头，减小爬升角度。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1170","type":"single","difficulty":1,"stem":"在自主飞行过程中，遥控器油门的位置应处于（ ）。","options":[{"key":"A","text":"油门处与中间略上"},{"key":"B","text":"油门处于最下方"},{"key":"C","text":"油门处于最上方"}],"answer":"A","analysis":"提示：油门中间略上\n解析：在自主飞行过程中，遥控器油门的位置应处于油门处与中间略上，这样可以在需要时随时接管控制并进行调整，同时也避免意外触碰导致的错误操作。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1171","type":"single","difficulty":1,"stem":"遥控无人机平飞转弯过程中（）。","options":[{"key":"A","text":"注视地平仪，协调地向转弯方向压杆扭舵，形成一定坡度后，稳杆保持"},{"key":"B","text":"注视地平仪，协调地向转弯反方向压杆扭舵，形成一定坡度后，稳杆保持"},{"key":"C","text":"注视地平仪，向转弯方向压杆，同时反方向扭舵"}],"answer":"A","analysis":"提示：协调+向转弯方向\n解析：遥控无人机平飞转弯时，驾驶员应注视地平仪，协调地向转弯方向压杆扭舵，形成一定坡度后稳杆保持。这样可以确保无人机按照预定的转弯路径和坡度进行转弯。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"thc-1172","type":"single","difficulty":1,"stem":"遥控无人机平飞转弯过程中（）。","options":[{"key":"A","text":"转弯中，如果坡度过大，应协调地适当增加压杆扭舵量"},{"key":"B","text":"转弯中，如果坡度过大，应协调地适当回杆回舵"},{"key":"C","text":"转弯中，如果坡度过小，应协调地适当回杆回舵"}],"answer":"B","analysis":"提示：平飞坡大回舵\n解析：遥控无人机在平飞转弯过程中，如果坡度过大，驾驶员应协调地适当回杆回舵，以减小坡度，避免无人机转弯过急或偏离预定路径，确保转弯过程的平稳和安全。","tags":[],"chapter":"起降操控","bankId":"uav-theory"},{"id":"sel-0001","type":"single","difficulty":1,"stem":"多旋翼飞行器上的电信号传播顺序一般为( )。","options":[{"key":"A","text":"飞控-机载遥控接收机-电机-电调"},{"key":"B","text":"机载遥控接收机-飞控-电调-电机"},{"key":"C","text":"飞控-电调-机载遥控接收机-电机"}],"answer":"B","analysis":"提示：机飞电电\n解析：信号接收机（机载接收机）接入飞控输入端口 → 飞控运算后输出信号至 ESC 电调 → 电调驱动无刷电机","tags":[],"bankId":"uav-selected"},{"id":"sel-0002","type":"single","difficulty":1,"stem":"无人机电气系统一般包括3个部分（）。","options":[{"key":"A","text":"电源、电缆、接插件"},{"key":"B","text":"电源、配电系统、用电设备"},{"key":"C","text":"电缆、供电系统、用电设备"}],"answer":"B","analysis":"提示：电配电（电源-配电-用电）\n解析：无人机电气系统一般包括电源、配电系统、用电设备三个部分。这三个部分相互协作，共同确保无人机的正常运行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0003","type":"single","difficulty":1,"stem":"导航子系统功能是向无人机提供（）信息，引导无人机沿指定航线安全、准时、准确的飞行。","options":[{"key":"A","text":"角速度"},{"key":"B","text":"角加速度"},{"key":"C","text":"高度、位置"}],"answer":"C","analysis":"提示：高位\n解析：导航子系统的功能是向无人机提供相对于所选定的参考坐标系的位置、速度 、飞行姿态,引导无人机沿指定航线安全、准时、准确地飞行。完善的无人机导航子系统具有以下功能: (1)获得必要的导航要素,包括高度、速度、姿态、航向。","tags":[],"bankId":"uav-selected"},{"id":"sel-0004","type":"single","difficulty":1,"stem":"无人机驾驶航空器系统必要的组成部分是()。","options":[{"key":"A","text":"飞行器平台、控制站"},{"key":"B","text":"飞行器平台、控制站、通讯链路"},{"key":"C","text":"飞行器平台、通讯链路"}],"answer":"B","analysis":"提示：机，战，链\n解析：无人机驾驶航空器系统必要的组成部分是飞行器平台、控制站、通讯链路。飞行器平台负责在空中进行飞行任务。控制站是无人机系统的地面控制中心，负责向无人机发送指令和控制信号，同时接收无人机传回的飞行数据和图像信息。通讯链路是无人机与地面控制站之间进行数据传输和通信的桥梁。","tags":[],"bankId":"uav-selected"},{"id":"sel-0005","type":"single","difficulty":1,"stem":"常规无人机飞行主操纵面有（）。","options":[{"key":"A","text":"副翼、升降舵、方向舵、调整片"},{"key":"B","text":"副翼、升降舵(或全动平尾)、方向舵"},{"key":"C","text":"副翼"}],"answer":"B","analysis":"提示：主操纵，有全动平尾）\n解析：固定翼常规无人机飞行主操纵面包括副翼、升降舵(或全动平尾)和方向舵，它们用于主要控制飞机的飞行姿态和航向。","tags":[],"bankId":"uav-selected"},{"id":"sel-0006","type":"single","difficulty":1,"stem":"描述飞机在空间姿态的姿态角有()。","options":[{"key":"A","text":"迎角，偏航角，滚转角"},{"key":"B","text":"滚转角，偏航角，俯仰角"},{"key":"C","text":"俯仰角，侧滑角，滚转角"}],"answer":"B","analysis":"提示：滚偏俯（无迎侧）\n解析：滚转角、偏航角、俯仰角:这三个角分别描述了飞机绕其纵轴、立轴和横轴的旋转，是全面描述飞机在空间姿态的三个基本角度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0007","type":"single","difficulty":1,"stem":"常规布局飞机的主要舵面指的是()。","options":[{"key":"A","text":"升降舵、方向舵、襟翼"},{"key":"B","text":"方向舵、襟翼、缝翼"},{"key":"C","text":"升降舵、方向舵、副翼"}],"answer":"C","analysis":"提示：升方副\n解析：常规布局飞机的主要舵面是升降舵、方向舵、副翼，用于控制飞机的姿态和飞行方向。升降舵控制飞机的俯仰，方向舵控制偏航，副翼控制滚转。","tags":[],"bankId":"uav-selected"},{"id":"sel-0008","type":"single","difficulty":1,"stem":"多旋翼飞行器每个“轴”上，一般连接()。","options":[{"key":"A","text":"1个电调，1个电机"},{"key":"B","text":"2个电调，1个电机"},{"key":"C","text":"1个电调，2个电机"}],"answer":"A","analysis":"提示：1轴1机1电调\n解析：多旋翼的每个 “轴” 是一个独立的动力输出单元，电调是单独控制电机的设备，一个电调只能对应控制一个电机，所以每个轴上会搭配 1 个电调 + 1 个电机，以此保证每个轴的动力都可以被独立、精准的控制，进而实现无人机的姿态调整。","tags":[],"bankId":"uav-selected"},{"id":"sel-0009","type":"single","difficulty":1,"stem":"相对湿度，是指（）。","options":[{"key":"A","text":"空气中水汽压与饱和水汽压的百分比"},{"key":"B","text":"空气中水分占空气总量的百分比"},{"key":"C","text":"空气中水汽含量与饱和水汽含量的百分比"}],"answer":"A","analysis":"提示：双压/两压一比\n解析：相对湿度是指空气中实际水汽压与同温度下饱和水汽压之比，用百分比表示。它反映了空气接近饱和的程度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0010","type":"single","difficulty":1,"stem":"下列错误的选项是()。","options":[{"key":"A","text":"黏性阻力是由于空气和飞行器表面接触产生的"},{"key":"B","text":"形状阻力是由于空气和飞行器表面接触产生的"},{"key":"C","text":"蒙皮摩擦阻力是由于空气和飞行器表面接触产生的"}],"answer":"B","analysis":"提示：三个表面选形状\n解析：形状阻力(也称为压差阻力)主要是由于飞行器的形状导致气流在飞行器表面分离，形成压力差而产生的阻力。这种阻力与飞行器的形状和尺寸有关，而不仅仅是与空气和飞行器表面的接触。","tags":[],"bankId":"uav-selected"},{"id":"sel-0011","type":"single","difficulty":1,"stem":"飞机在空中飞行时，如果飞机处于平衡状态，那么()。","options":[{"key":"A","text":"作用在飞机上的所有外力平衡，所有外力矩也平衡"},{"key":"B","text":"作用在飞机上的所有外力不平衡，所有外力矩平衡"},{"key":"C","text":"作用在飞机上的所有外力平衡，所有外力矩不平衡"}],"answer":"A","analysis":"提示：全部平衡\n解析：平衡状态意味着所有外力平衡，外力矩也平衡，否则飞机姿态会改变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0012","type":"single","difficulty":1,"stem":"飞机做等速直线水平飞行时，作用在飞机上的外载荷应满足()。","options":[{"key":"A","text":"升力等于重力，推力等于阻力"},{"key":"B","text":"升力等于重力，抬头力矩等于低头力矩"},{"key":"C","text":"升力等于重力，推力等于阻力，抬头力矩等于低头力矩"}],"answer":"C","analysis":"提示：3平衡\n解析：等速直线水平飞行需各方面平衡，升力重力平衡保证高度不变，推力阻力平衡保证速度不变，抬头低头力矩平衡保证姿态稳定。","tags":[],"bankId":"uav-selected"},{"id":"sel-0013","type":"single","difficulty":1,"stem":"三大气象要素为（）。","options":[{"key":"A","text":"气温、风和云"},{"key":"B","text":"风、云和降水"},{"key":"C","text":"气温、气压和空气湿度"}],"answer":"C","analysis":"提示：三气\n解析：三大气象要素是指气温、气压和空气湿度，它们是气象观测和预报中的基础参数。","tags":[],"bankId":"uav-selected"},{"id":"sel-0014","type":"single","difficulty":1,"stem":"飞行的组织与实施包括（）。","options":[{"key":"A","text":"飞行直接准备、飞行实施和飞行讲评三个阶段"},{"key":"B","text":"飞行预先准备、飞行准备和飞行实施三个阶段"},{"key":"C","text":"飞行预先准备、飞行直接准备、飞行实施和飞行讲评四个阶段"}],"answer":"C","analysis":"提示：四个阶段\n解析：根据《中华人民共和国飞行基本规则》第一章 总则 第七条：组织与实施飞行，应当按照飞行预先准备、飞行直接准备、飞行实施和飞行讲评等阶段进行。飞行阶段的具体内容和要求，由各航空管理部门自行规定。","tags":[],"bankId":"uav-selected"},{"id":"sel-0015","type":"single","difficulty":1,"stem":"民用航空适航管理是对哪几种环节进行管理","options":[{"key":"A","text":"使用和维修"},{"key":"B","text":"设计、制造"},{"key":"C","text":"设计、制造、使用和维修"}],"answer":"C","analysis":"提示：4个都有\n解析：《中国民用航空器适航管理条例》第三条民用航空器的适航管理，是根据国家的有关规定，对民用航空器的设计、生产使用和维修，实施以确保飞行安全为目的的技术鉴定和监督。","tags":[],"bankId":"uav-selected"},{"id":"sel-0016","type":"single","difficulty":1,"stem":"飞控子系统必须具备的功能为（）。","options":[{"key":"A","text":"无人机姿态稳定与控制，无人机飞行管理，应急控制"},{"key":"B","text":"无人机飞行管理，与导航子系统协调完成航迹控制，信息收集与传递"},{"key":"C","text":"无人机起飞与着陆控制，无人机飞行管理，信息收集与传递"}],"answer":"A","analysis":"提示：飞控子必有姿态\n解析：飞控子系统是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统,对无人机实现全权控制与管理,。飞控子系统主要具有如下功能： (1)无人机姿态稳定与控制; (2)与导航子系统协调完成航迹控制; (3)无人机起飞(发射)与着陆(回收)控制: (4)无人机飞行管理; (5)无人机任务设备管理与控制; (6)应急控制; (7)信息收集与传递。以上所列的功能中第1、4和6项是所有无人机飞行控制系统所必须具备的功能面。其他项则不是每一种飞行控制系统都具备的,也不是每一种无人机都需要的,根据具体无人机的种类和型号可进行选择、裁剪和组合。","tags":[],"bankId":"uav-selected"},{"id":"sel-0017","type":"single","difficulty":1,"stem":"空域是航空器运行的环境，也是宝贵的国家资源。国务院、中央军委十分重视我国民用航空交通管制的建设工作，目前正在推进空域管理改革，预计划分三类空域，为______","options":[{"key":"A","text":"管制空域、监视空域和报告空域"},{"key":"B","text":"管制空域、非管制空域和特殊空域"},{"key":"C","text":"管制空域、非管制空域和报告空域"}],"answer":"A","analysis":"提示：监视\n解析：空域划分为三类，分别为管制空域、监视空域和报告空域。","tags":[],"bankId":"uav-selected"},{"id":"sel-0018","type":"single","difficulty":1,"stem":"机场标高指着陆区（）的标高。","options":[{"key":"A","text":"最低点"},{"key":"B","text":"最高点"},{"key":"C","text":"平均海拔"}],"answer":"B","analysis":"提示：最高点\n解析：机场跑道着陆区内最高点距离平均海平面(Mean sea level)的垂直距离称为机场标高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0019","type":"single","difficulty":1,"stem":"个人民用无人机拥有者在“无人机实名登记系统”中登记的信息包括","options":[{"key":"A","text":"驾驶员姓名、有效证件号码、联系方式"},{"key":"B","text":"拥有者姓名、有效证件号码、工作单位、联系方式"},{"key":"C","text":"拥有者姓名、有效证件号码、使用目的"}],"answer":"C","analysis":"提示：使用目的！\n解析：根据《民用无人驾驶航空器实名制登记管理规定》3.2.2 个人民用无人机拥有者登记信息 个人民用无人机拥有者在“无人机实名登记系统”中登记的信息包括:(1)拥有者姓名;(2)有效证件号码(如身份证号、护照号等);(3)移动电话和电子邮箱;(4)产品型号、产品序号;(5)使用目的。（不要驾驶者的姓名，不要工作单位）","tags":[],"bankId":"uav-selected"},{"id":"sel-0020","type":"single","difficulty":1,"stem":"大气是一种混合物，它由( )组成。","options":[{"key":"A","text":"空气和水汽凝结物"},{"key":"B","text":"空气和固体微粒"},{"key":"C","text":"空气、水汽及液体或固体杂质"}],"answer":"C","analysis":"提示：混合物有杂质\n解析：大气是一种混合物，它由空气、水汽及液体或固体杂质组成。这些成分共同构成了我们所说的大气，并对地球的气候和环境产生重要影响。","tags":[],"bankId":"uav-selected"},{"id":"sel-0021","type":"single","difficulty":1,"stem":"从地球表面到外层空间,大气层依次是（）。","options":[{"key":"A","text":"对流层，平流层、电离层、中间层和散逸层"},{"key":"B","text":"对流层、中间层、平流层、电离层和散落层"},{"key":"C","text":"对流层、平流层、中间层、电离层和散逸层"}],"answer":"C","analysis":"提示：中间层在中间\n解析：从地球表面到外层空间，大气层依次是对流层、平流层、中间层、电离层和散逸层这是大气科学中的基本常识，各层具有不同的特性和功能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0022","type":"single","difficulty":1,"stem":"通过改变迎角，无人机驾驶员可以控制飞机的()。","options":[{"key":"A","text":"升力、空速、阻力"},{"key":"B","text":"升力、空速、阻力、重量"},{"key":"C","text":"升力、拉力、阻力"}],"answer":"A","analysis":"提示：去掉重量\n解析：首先，根据升力阻力公式，迎角影响升力系数与阻力系数，直接影响升力阻力。其次，在“平飞、重量不变、未失速的前提下”，迎角也直接影响空速。（速度越大，所需迎角越小）飞机重量是飞机自身固有的属性，与迎角没有任何关系。","tags":[],"bankId":"uav-selected"},{"id":"sel-0023","type":"single","difficulty":1,"stem":"关于多旋翼飞行器定义描述正确的是( )。","options":[{"key":"A","text":"具有两个及以上旋翼轴的旋翼航空器"},{"key":"B","text":"具有不少于四个旋翼轴的无人旋翼航空器"},{"key":"C","text":"具有三个及以上旋翼轴的旋翼航空器"}],"answer":"C","analysis":"提示：多轴，≥3\n解析：三个旋翼轴及以上就可以称为多旋翼飞行器。","tags":[],"bankId":"uav-selected"},{"id":"sel-0024","type":"single","difficulty":1,"stem":"多旋翼飞行器的遥控器一般有()。","options":[{"key":"A","text":"2个通道"},{"key":"B","text":"3个通道"},{"key":"C","text":"4个及以上通道"}],"answer":"C","analysis":"提示：4以上通道\n解析：多旋翼飞行器的遥控器一般有 4个及以上通道。通常包括油门、横滚、俯仰、偏航等控制通道。","tags":[],"bankId":"uav-selected"},{"id":"sel-0025","type":"single","difficulty":1,"stem":"一般锂聚合物电池上都有2组线。1组是输出线(粗，红黑各1根);1组是单节锂电引出线(细，与s数有关)，用以监视平衡充电时的单体电压。下面说法正确的是()。","options":[{"key":"A","text":"6S电池有5根红色引出线，1根黑色引出线"},{"key":"B","text":"6S电池有7根引出线"},{"key":"C","text":"6S电池有6根引出线"}],"answer":"B","analysis":"提示：6s7根\n解析：在平衡充电时，每一节单体锂电池都需要一根单独的引出线来监测电压，所以6S电池就需要6 根细线来分别监测每一节电池的电压，再加上一根较粗的黑色的共用负极线，总共7 根引出线。","tags":[],"bankId":"uav-selected"},{"id":"sel-0026","type":"single","difficulty":1,"stem":"根据国际民航组织的规定，云满天时云量为（）。","options":[{"key":"A","text":"8"},{"key":"B","text":"10"},{"key":"C","text":"12"}],"answer":"A","analysis":"提示：满云8\n解析：本题考查国际民航组织(ICAO)的云量观测标准。 ICAO 作为全球民航标准化权威机构，对云量观测采用八分量制，云量指云遮蔽天空的比例，分母固定为 8，“满天云” 记为 8/8。 民航运行中，云量是决定航班起降、巡航安全的关键气象要素（如低云量会影响能见度和跑道使用），因此全球民航从业人员必须严格遵循 ICAO 八分量制记录和报告云量，避免因标准混淆导致运行风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0027","type":"single","difficulty":1,"stem":"航路天气预报通常在起飞前几小时，由飞航站气象台向机组提供？","options":[{"key":"A","text":"2小时"},{"key":"B","text":"3小时"},{"key":"C","text":"1小时"}],"answer":"C","analysis":"提示：1小时（越新鲜越好，久了不具参考性，选最短）\n解析：航路天气预报通常在起飞前1小时由飞航站气象台向机组提供，以确保机组有足够的时间了解飞行路线上的天气状况，做出必要的飞行准备。","tags":[],"bankId":"uav-selected"},{"id":"sel-0028","type":"single","difficulty":1,"stem":"起落航线飞行开始一转弯和结束四转弯的高度一般不得低于( )。","options":[{"key":"A","text":"50米"},{"key":"B","text":"100米"},{"key":"C","text":"150米"}],"answer":"B","analysis":"提示：14转不低于100米\n解析：根据《中国民用航空飞行规则》的规定，起落航线飞行的高度以及开始一转弯和结束四转弯的高度都有明确要求。一般来说，起飞后开始第一转弯和结束四转弯的高度不得低于100米，这是为了确保飞行安全避免在低空发生碰撞或其他意外情况。","tags":[],"bankId":"uav-selected"},{"id":"sel-0029","type":"single","difficulty":1,"stem":"高空空域是指标准海平面气压多少米（不含）以上的空域？","options":[{"key":"A","text":"7000米"},{"key":"B","text":"8000米"},{"key":"C","text":"6000米"}],"answer":"C","analysis":"提示：6000米（这题与飞行高度不同，考察的是空域问题。高空飞行≠高空空域）\n解析：根据最新发布的《国家空域基础分类方法》以及《一般运行和飞行规则》等权威文件，高空空域是指标准海平面气压6000米（不含）以上的空域。","tags":[],"bankId":"uav-selected"},{"id":"sel-0030","type":"single","difficulty":1,"stem":"对流层的高度在地球中纬度地区约为()。","options":[{"key":"A","text":"8公里"},{"key":"B","text":"16公里"},{"key":"C","text":"11公里"}],"answer":"C","analysis":"提示：对流中纬11\n解析：对流层是大气层的最底层，其高度随纬度和季节的变化而变化。在低纬度地区，对流层的平均高度约为17-18公里；在中纬度地区，对流层的平均高度约为10-12公里；在极地地区，对流层的平均高度则较低，约为8-9公里。并且，对流层的高度在夏季通常高于冬季。因此，对于地球中纬度地区，对流层的高度约为11公里是一个合理的估计。","tags":[],"bankId":"uav-selected"},{"id":"sel-0031","type":"single","difficulty":1,"stem":"学生驾驶员在单飞之前必须在其飞行经历记录本上，有授权教员的签字，证明其在单飞日期之前（）天内接受了所飞型号航空器的训练","options":[{"key":"A","text":"60"},{"key":"B","text":"30"},{"key":"C","text":"90"}],"answer":"C","analysis":"提示：单飞前90天（单飞前多训练更稳妥，时间选最久）\n解析：《民用航空器驾驶员和地面教员合格审定规则》规定，学生驾驶员在操作航空器单飞之前，应当符合下列规定:(1)在学生驾驶员执照上，有授权教员针对其所飞型号航空器的签字批准;(2)在其飞行经历记录本上，有授权教员的签字，证明其在单飞日期之前90天内接受了所飞型号航空器的训练。","tags":[],"bankId":"uav-selected"},{"id":"sel-0032","type":"single","difficulty":1,"stem":"下列说法中，哪一种对无人机教员等级申请人的要求是必须的？","options":[{"key":"A","text":"在所申请的无人机上担任机长经历时间多于100小时"},{"key":"B","text":"具备无人机应急处理程序方面的技术"},{"key":"C","text":"在所申请的无人机上飞行经历不少于100小时"}],"answer":"A","analysis":"提示：担任机长不少于≥100h\n解析：《民用航空器驾驶员和地面教员合格审定规则》第61.203条，资格要求(i)对于初次申请飞机类别的型别教员等级申请人，担任飞机机长的飞行经历时间至少500小时，其中在所申请型别的飞机上担任机长的飞行经历时间至少100小时;对于申请增加型别教员等级的申请人，在所申请型别的飞机上担任机长的飞行经历时间至少100小时。","tags":[],"bankId":"uav-selected"},{"id":"sel-0033","type":"single","difficulty":1,"stem":"《轻小型无人机运行规定(试行)》颁布于（）。","options":[{"key":"A","text":"2013年11月13日"},{"key":"B","text":"2015年12月29日"},{"key":"C","text":"2017年01月01日"}],"answer":"B","analysis":"提示：轻小1229\n解析：《轻小型无人机运行规定(试行)》下发日期为2015年12月29日。","tags":[],"bankId":"uav-selected"},{"id":"sel-0034","type":"single","difficulty":1,"stem":"每个飞行教员必须将CCAR-61部要求的记录保存（）。","options":[{"key":"A","text":"一年"},{"key":"B","text":"五年"},{"key":"C","text":"三年"}],"answer":"C","analysis":"提示：记录3年（记录3年，数据3个月）\n解析：《民用航空器驾驶员合格审定规则》第61.209条，飞行教员的教学记录(a)飞行教员应当在接受其飞行或地面教学的每个人的飞行经历记录本上签字，并注明提供教学的内容、课时和日期。(b)飞行教员应当在飞行教员记录本或单独文件中记录下列内容(1)由该教员在飞行经历记录本或者在学生驾驶员执照上签字而被授予单飞权利的每个人的姓名。记录应当包括每次签字的日期以及所涉及的航空器型号;(2)由该教员签字推荐参加理论考试或者实践考试的每个人的姓名，记录还应当包括考试的种类、日期和考试结果。(c)每个飞行教员应当将本条要求的记录保存至少三年。","tags":[],"bankId":"uav-selected"},{"id":"sel-0035","type":"single","difficulty":1,"stem":"对于民用无人机运行的仪表、设备和标识要求中，用于记录、回放和分析飞行过程的飞行数据记录系统，且数据信息至少保存","options":[{"key":"A","text":"半年"},{"key":"B","text":"三个月"},{"key":"C","text":"一个月"}],"answer":"B","analysis":"提示：数据3个月（记录3年，数据3个月）\n解析：《轻小无人机运行规定》13.民用无人机运行的仪表、设备和标识要求:13.1具有有效的空地C2链路;13.2 地面站或操控设备具有显示无人机实时的位置、高度、速度等信息的仪器仪表;13.3 用于记录、回放和分析飞行过程的飞行数据记录系统，且数据信息至少保存三个月(适用于川、IV、V和V类)","tags":[],"bankId":"uav-selected"},{"id":"sel-0036","type":"single","difficulty":1,"stem":"下列航空法律法规中级别最高的是","options":[{"key":"A","text":"《中华人民共和国民用航空法》"},{"key":"B","text":"《中华人民共和国搜寻援救民用航空器的规定》"},{"key":"C","text":"《中华人民共和国飞行基本规则》"}],"answer":"A","analysis":"提示：法最大（法的效力>规定规则）\n解析：航空法律法规中级别最高的是《中华人民共和国民用航空法》《中华人民共和国民用航空法》是由全国人民代表大会常务委员会通过的法律，具有最高的法律效力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0037","type":"single","difficulty":1,"stem":"多旋翼飞行器动力装置多为电动系统的最主要原因是()。","options":[{"key":"A","text":"电动系统尺寸较小且较为廉价"},{"key":"B","text":"电动系统形式简单且电机速度响应快"},{"key":"C","text":"电动系统干净且不依赖传统生物燃"}],"answer":"B","analysis":"提示：电动响应快\n解析：多旋翼飞行器动力装置多为电动系统的最主要原因是电动系统形式简单且电机速度响应快。电动系统的组成相对简单，主要包括电池、电机和控制器等组件。电动系统中的电机，特别是无刷直流电机，具有极高的
