件，故排除。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0215","type":"single","difficulty":1,"stem":"舵面遥控(纯手动)是指？","options":[{"key":"A","text":"飞控参与姿态控制，不参与位置控制"},{"key":"B","text":"飞控参与姿态控制和位置控制"},{"key":"C","text":"飞控姿态控制和位置控制都不参与"}],"answer":"C","analysis":"提示：舵面：飞控都不\n解析：舵面遥控（纯手动）是最基础的操控模式，飞控完全不介入任何控制。无人机的姿态（如倾斜、俯仰）和位置（如移动、高度），均需操作手通过遥控器直接控制各舵面或电机，完全依赖操作手的操控技巧应对气流等干扰。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0216","type":"single","difficulty":1,"stem":"姿态遥控是指？","options":[{"key":"A","text":"飞控参与姿态控制，不参与位置控制"},{"key":"B","text":"飞控参与姿态控制和位置控制"},{"key":"C","text":"飞控姿态控制和位置控制都不参与"}],"answer":"A","analysis":"提示：姿态：飞控仅姿态\n解析：姿态遥控模式下，飞控会通过传感器（如陀螺仪、加速度计）稳定无人机姿态（如保持水平、修正倾斜），减轻操作手控姿压力；但飞控不介入位置控制，无人机的位置（如前后左右移动、高度变化）需完全由操作手通过遥控器杆量操控，位置会受气流等外界因素影响。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0217","type":"single","difficulty":1,"stem":"人工修正(GPS模式)是指？","options":[{"key":"A","text":"飞控参与姿态控制，不参与位置控制"},{"key":"B","text":"飞控参与姿态控制和位置控制"},{"key":"C","text":"飞控姿态控制和位置控制都不参与"}],"answer":"B","analysis":"提示：人工修正：飞控都，人工修正位置\n解析：根据无人机飞控系统的相关知识，在 GPS 模式下，飞控不仅会通过内回路稳定飞行器的姿态，还会利用 GPS 数据通过外回路稳定飞行器的位置。此时，航向和位置的改变由操作手来完成，但飞控会根据操作手的指令以及传感器数据进行相应的计算和控制，以实现准确的姿态和位置调整，因此飞控是参与姿态控制和位置控制的。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0218","type":"single","difficulty":1,"stem":"电动动力系统由哪几部分组成？","options":[{"key":"A","text":"动力电池、电子调速器、螺旋桨"},{"key":"B","text":"动力电池、动力电机、螺旋桨"},{"key":"C","text":"动力电池、电子调速器、动力电机、螺旋桨"}],"answer":"C","analysis":"提示：系统选总和\n解析：电动动力系统需完整实现 “能量供给 - 调控 - 动力转换 - 产生推力” 的流程：动力电池提供电能；电子调速器接收信号、调节电流，控制电机运转；动力电机将电能转化为机械能；螺旋桨通过旋转将机械能转化为推力，四者缺一不可，共同构成完整系统。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0219","type":"single","difficulty":1,"stem":"螺旋桨的主要技术参数有哪些？","options":[{"key":"A","text":"直径、桨叶数量、桨型、翼型等"},{"key":"B","text":"螺距、桨叶数量、桨型、翼型等"},{"key":"C","text":"直径、螺距、桨叶数量、桨型、翼型等"}],"answer":"C","analysis":"提示：参数选总和\n解析：螺旋桨的核心参数均影响其拉力与效率：直径决定扫风面积，直接关联拉力大小；螺距是桨叶旋转一周前进的理论距离，影响飞行速度；桨叶数量、桨型、翼型则分别影响动力响应、适配场景与气动效率，这些均是关键技术参数，缺一不可。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0220","type":"single","difficulty":1,"stem":"动力电机的主要技术参数有哪些？","options":[{"key":"A","text":"规格尺寸、重量、最大功率、工作转速范围"},{"key":"B","text":"空载KV值、最大工作电压、力效"},{"key":"C","text":"以上都是"}],"answer":"C","analysis":"提示：参数选总和\n解析：动力电机参数需覆盖多维度适配需求：规格尺寸、重量关乎安装与设备负载；最大功率、工作转速范围、最大工作电压决定动力输出能力；空载 KV 值、力效影响运行性能，这些均是核心参数，故 “以上都是” 正确。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0221","type":"single","difficulty":1,"stem":"电子调速器的主要技术参数有哪些？","options":[{"key":"A","text":"最大电流、输入电压范围"},{"key":"B","text":"输入电压范围、对外供电能力"},{"key":"C","text":"最大电流、输入电压范围、对外供电能力等"}],"answer":"C","analysis":"提示：参数选总和\n解析：电子调速器的核心参数需匹配动力系统需求：最大电流决定其能否承受电机工作电流，避免过载损坏；输入电压范围需适配动力电池电压；对外供电能力（如 BEC 功能）关乎飞控等设备供电，三者均是关键技术参数，共同保障电调正常工作。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0222","type":"single","difficulty":1,"stem":"动力电池的主要技术参数有哪些？","options":[{"key":"A","text":"总电压、最大放电倍率、充放循环次数、重量等"},{"key":"B","text":"总电压、总容量、充放循环次数、重量等"},{"key":"C","text":"总电压、总容量、最大放电倍率、充放循环次数、重量等"}],"answer":"C","analysis":"提示：参数选总和\n解析：动力电池需满足动力系统多维度需求，总电压决定适配设备的电压要求，总容量关联续航时长，最大放电倍率影响瞬时动力输出能力，充放循环次数决定使用寿命，重量则关系设备负载与续航，这些均是核心技术参数，缺一不可。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0223","type":"single","difficulty":1,"stem":"聚合物锂电池单片电压为多少？","options":[{"key":"A","text":"标称电压3.7V，满电电压4.2V，保护电压3.6V，保存电压3.8V"},{"key":"B","text":"标称电压3.6V，满电电压4.2V，保护电压3.7V，保存电压3.8V"},{"key":"C","text":"标称电压3.7V，满电电压4.2V，保护电压3.8V，保存电压3.6V"}],"answer":"A","analysis":"提示：保护3.6，保存3.8\n解析：聚合物锂电池单片标准参数为：标称 3.7V（正常工作平均电压）、满电 4.2V（充电最高安全电压）、保护 3.6V（放电最低安全电压，触发断电）、保存 3.8V（长期存放最佳电压，减少损耗）。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0224","type":"single","difficulty":1,"stem":"3S2P锂聚合物电池的含义是？","options":[{"key":"A","text":"2个单体电池串联，再将3组这样的电池并联"},{"key":"B","text":"3个单体电池串联，再将2组这样的电池并联"},{"key":"C","text":"以上都是"}],"answer":"B","analysis":"提示：3S2P：3串2并\n解析：“S” 代表串联（Series），“P” 代表并联（Parallel），需遵循 “先串后并” 逻辑：3 个单体电池串联，再将 2 组这样的电池并联。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0225","type":"single","difficulty":1,"stem":"3S2P锂聚合物电池的最大电压是多少？","options":[{"key":"A","text":"12.6V"},{"key":"B","text":"21V"},{"key":"C","text":"25.2V"}],"answer":"A","analysis":"提示：3S2P：12.6V\n解析：串联3：4.2V×3 = 12.6V","tags":[],"bankId":"uav-qa"},{"id":"cmp-0226","type":"single","difficulty":1,"stem":"关于四冲程和二冲程汽油发动机，描述正确的是?","options":[{"key":"A","text":"四冲程效率高，润滑油多单注"},{"key":"B","text":"二冲程效率高，汽油和润滑油以1:25-1:40比例混合使用"},{"key":"C","text":"四冲程效率高，汽油和润滑油以1:25-1:40比例混合使用"}],"answer":"A","analysis":"提示：四效高，润油多\n解析：四冲程发动机通过进气、压缩、做功、排气四个冲程完成循环，燃油燃烧更充分，能量转化效率更高，且其润滑系统独立，润滑油多单独注入（如曲轴箱注油）；二冲程发动机无独立润滑系统，需将汽油与润滑油按 1:25-1:40 比例混合使用，但因燃烧不充分，效率低于四冲程。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0227","type":"single","difficulty":1,"stem":"可以大电流放电的电池有哪些?","options":[{"key":"A","text":"锂聚合物电池、铅酸蓄电池、镍镉电池"},{"key":"B","text":"锂聚合物电池、镍氢电池、干电池"},{"key":"C","text":"锂聚合物电池、镍镉电池、镍氢电池"}],"answer":"C","analysis":"提示：大放电：锂+2镍\n解析：本题问题与答案都不严谨，但是考虑到我们参加的是无人机考试，将问题理解为“适合无人机的动力场景”的问题，也就是可以保持大电流持续放电的电池有哪些？铅酸蓄电池：可以提供很大的瞬时电流，但是持续放电倍率极低（仅 0.5-1C），无法满足无人机电机长时间高功率输出的需求。；干电池：内阻较高，大电流放电时电压下降严重，不适合大电流应用；锂聚合物（动力型）：放电倍率20-100C镍镉（动力型）：放电倍率5-20C镍氢（动力型）：放电倍率3-15C","tags":[],"bankId":"uav-qa"},{"id":"cmp-0228","type":"single","difficulty":1,"stem":"关于电池的记忆效应，描述正确的是?","options":[{"key":"A","text":"铅酸蓄电池无记忆效应，锂聚合物电池基本无记忆效应，镍氢电池小记忆效应"},{"key":"B","text":"镍镉电池强记忆效应，铅酸蓄电池小记忆效应，干电池不可充电"},{"key":"C","text":"锂聚合物电池强记忆效应，镍氢电池小记忆效应，铅酸蓄电池无记忆效应"}],"answer":"A","analysis":"提示：铅酸无、锂无、镍氢小\n解析：记忆效应是电池长期未完全放电就充电，容量出现虚假衰减的现象。铅酸蓄电池无此特性；锂聚合物电池技术成熟，基本无记忆效应；镍氢电池虽有记忆效应，但程度远低于镍镉电池，属于小记忆效应，符合实际电池特性。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0229","type":"single","difficulty":1,"stem":"关于电池的电压，描述正确的是?","options":[{"key":"A","text":"锂聚合物电池3.7V，铅酸蓄电池6V、12V，镍氢电池和镍镉电池1.2V，干电池1.5V"},{"key":"B","text":"锂聚合物电池3.7V，铅酸蓄电池1.2V，镍氢电池和镍镉电池6V、12V，干电池1.5V"},{"key":"C","text":"锂聚合物电池3.7V，铅酸蓄电池6V，镍氢电池和镍镉电池1.2V、12V，干电池1.5V"}],"answer":"A","analysis":"提示：铅酸6/12\n解析：锂聚合物电池单体电压为 3.7V；铅酸蓄电池常见规格为 6V、12V；镍氢与镍镉电池单体电压均为 1.2V；干电池（如 AA/AAA 型）标准电压为 1.5V。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0230","type":"single","difficulty":1,"stem":"有BEC功能的无刷电调有几根线？","options":[{"key":"A","text":"6根"},{"key":"B","text":"7根"},{"key":"C","text":"8根"}],"answer":"C","analysis":"提示：有BE，C8根\n解析：有BEC功能的无刷电调，线组包含 3 根接电机的动力线、3 根接飞控的信号线，以及 2 根接电源的正负极线（BEC 功能需通过这两根线取电并稳压供设备），总计 8 根线。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0231","type":"single","difficulty":1,"stem":"关于螺旋桨描述正确的是？","options":[{"key":"A","text":"CCW为正桨，逆时针旋转；CW为反桨，顺时针旋转"},{"key":"B","text":"CCW为反桨，逆时针旋转；CW为正桨，顺时针旋转"},{"key":"C","text":"CCW为正桨，顺时针旋转；CW为反桨，逆时针旋转"}],"answer":"A","analysis":"提示：CCW正桨逆时针\n解析：螺旋桨标注的 CCW（Counter Clockwise）即逆时针，对应正桨，其旋转方向为逆时针；CW（Clockwise）即顺时针，对应反桨，旋转方向为顺时针，此标注与旋转方向的对应关系是行业通用规范。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0232","type":"single","difficulty":1,"stem":"关于无人机用活塞发动机点火方式，描述正确的是","options":[{"key":"A","text":"磁电机是霍尔感知位置放电；CDI是逆变高压电、电磁感应放电"},{"key":"B","text":"磁电机是电磁感应放电；CDI是逆变高压电、霍尔感知位置放电"},{"key":"C","text":"磁电机是逆变高压电、霍尔感知位置放电；CDI是电磁感应放电"}],"answer":"B","analysis":"提示：磁电电磁；CDI逆变\n解析：磁电机通过内部转子旋转切割磁感线，利用电磁感应产生高压电点火；CDI（电容放电点火）需先通过霍尔元件感知曲轴位置，再将低压电逆变为高压电，储存后放电点火，二者点火原理与部件功能对应此描述。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0233","type":"single","difficulty":1,"stem":"汽油机随着高度的增加，功率会（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"B","analysis":"提示：汽油飞高功小\n解析：高度增加时，空气逐渐稀薄，汽油机进气量减少。而汽油机燃烧需空气与燃油按比例混合，进气不足会导致混合气燃烧不充分，发动机输出功率随之减小，因此功率随高度增加而减小。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0234","type":"single","difficulty":1,"stem":"关于动力电池的功率密度，描述正确的是？","options":[{"key":"A","text":"越大越好，相同重量的电池可以飞更长时间"},{"key":"B","text":"越大越好，相同重量的电池可以产生更大的功率"},{"key":"C","text":"以上都是"}],"answer":"B","analysis":"提示：功率密度更大功\n解析：能量密度和功率密度都是衡量电池性能的重要指标（鼠鼠老师小课堂：简单来说，比能量高的动力电池就像龟兔赛跑中的乌龟，它耐力出众，能够长时间工作，从而确保无人机的续航里程。而功率高的动力电池则更像兔子，速度快，能够提供高瞬间的电流，进而保证无人机的加速性能。）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0235","type":"single","difficulty":1,"stem":"关于动力电池的能量密度，描述正确的是？","options":[{"key":"A","text":"越大越好，相同重量的电池可以飞更长时间"},{"key":"B","text":"越大越好，相同重量的电池可以产生更大的功率"},{"key":"C","text":"以上都是"}],"answer":"A","analysis":"提示：能量密度飞更久\n解析：能量密度和功率密度都是衡量电池性能的重要指标（鼠鼠老师小课堂：简单来说，比能量高的动力电池就像龟兔赛跑中的乌龟，它耐力出众，能够长时间工作，从而确保无人机的续航里程。而功率高的动力电池则更像兔子，速度快，能够提供高瞬间的电流，进而保证无人机的加速性能。）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0236","type":"single","difficulty":1,"stem":"多旋翼动力系统的总效率包含哪些?","options":[{"key":"A","text":"电池的效率、电调的效率、电机的效率"},{"key":"B","text":"电池的效率、电机的效率、螺旋桨的效率"},{"key":"C","text":"电池的效率、电调的效率、电机的效率、螺旋桨的效率"}],"answer":"C","analysis":"提示：总效率选总和\n解析：多旋翼动力系统能量传递需经完整链路 —— 电池将化学能转为电能（电池效率），电调调节电流电压（电调效率），电机将电能转为机械能（电机效率），螺旋桨再将机械能转为拉力（螺旋桨效率），四者共同构成总效率。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0237","type":"single","difficulty":1,"stem":"选择螺旋桨考虑的因素包括哪些?","options":[{"key":"A","text":"动力匹配、螺距、叶数、材质、动静平衡等"},{"key":"B","text":"直径、螺距、叶数、材质、动静平衡等"},{"key":"C","text":"动力匹配、直径、螺距、叶数、材质、动静平衡等"}],"answer":"C","analysis":"提示：螺旋桨选总和\n解析：选择螺旋桨需综合多方面。动力匹配确保与电机 / 发动机适配；直径和螺距直接影响拉力与效率；叶数关联动力特性；材质决定强度与重量；动静平衡影响运行稳定性，这些都是关键考虑因素。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0238","type":"single","difficulty":1,"stem":"关于化油器发动机大小油针的调整，正确的是哪个？","options":[{"key":"A","text":"小油针对应发动机的怠速，调整到发动机能够持续运转的最低转速;大油针对应发动机的大车状态，调整到发动机能够稳定输出最大功率状态"},{"key":"B","text":"小油针对应发动机的大车状态，调整到发动机能够持续运转的最低转速;大油针对应发动机的怠速，调整到发动机能够稳定输出最大功率状态"},{"key":"C","text":"小油针对应发动机的大车状态，调整到发动机能够稳定输出最大功率状态;大油针对应发动机的怠速，调整到发动机能够持续运转的最低转速"}],"answer":"A","analysis":"提示：小油怠速，大车最大\n解析：化油器小油针控制怠速时的燃油供给，需调至发动机能平稳怠速的最低转速，避免油耗过高或熄火；大油针控制高负荷（大车）时的燃油供给，需调至混合气比例合适，让发动机稳定输出最大功率，保障高负载工况性能。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0239","type":"single","difficulty":1,"stem":"高原应用时，关于活塞发动机的使用，描述正确的是哪个？","options":[{"key":"A","text":"降低起飞重量，增加起飞滑跑距离和起飞速度;适当采用大直径小螺距的螺旋桨"},{"key":"B","text":"降低起飞重量，减小起飞滑跑距离和起飞速度;适当采用小直径小螺距的螺旋桨"},{"key":"C","text":"保持起飞重量不变，减小起飞滑跑距离和起飞速度;适当采用大直径大螺距的螺旋桨"}],"answer":"A","analysis":"提示：降低增加\n解析：高原空气稀薄，活塞发动机进气量减少，功率下降。降低起飞重量可减轻发动机负载；功率不足使飞机加速慢，需更长滑跑距离和更高速度才能离地；大直径螺旋桨能更高效切割稀薄空气，小螺距则利于提升转速、弥补功率损失，保障动力输出。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0240","type":"single","difficulty":1,"stem":"发动机富油会出现什么现象？","options":[{"key":"A","text":"转速不稳，排浓烟"},{"key":"B","text":"产生震动，容易积碳"},{"key":"C","text":"以上都对"}],"answer":"C","analysis":"提示：富油都对\n解析：发动机富油时，燃油未充分燃烧。过量燃油导致混合气燃烧不稳定，引发转速波动；未燃燃油随废气排出形成浓烟；同时，未充分燃烧的燃油易在燃烧室、火花塞等部位沉积形成积碳，且燃烧不均衡会产生异常震动。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0241","type":"single","difficulty":1,"stem":"关于多旋翼电调与电机的匹配，描述正确的是哪个？","options":[{"key":"A","text":"电机巡航电流应大于电调的极限电流，并留有足够的裕度(3-5倍)"},{"key":"B","text":"电调的极限电流应大于电机巡航电流并留有足够的裕度(3-5倍)"},{"key":"C","text":"电调的极限电流应与电机巡航电流大致相等"}],"answer":"B","analysis":"提示：电调大3-5\n解析：电调需为电机提供稳定电流并承受其工作电流。若电调极限电流小于电机巡航电流，会因过载烧毁；与电机巡航电流相等则无冗余，突发高负载时易故障。留 3-5 倍裕度，能应对电机瞬时高电流，保障系统安全稳定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0242","type":"single","difficulty":1,"stem":"关于内、外转子无刷电机，正确的是哪个？","options":[{"key":"A","text":"外转子扭矩大、效率高"},{"key":"B","text":"内转子转速快、效率高"},{"key":"C","text":"外转子转速快、效率高"}],"answer":"A","analysis":"提示：外转子扭矩大、效率高\n解析：外转子无刷电机转子包裹定子，转动惯量大，输出扭矩更强，且结构设计更贴合多旋翼无人机等设备的动力需求，能量转化效率高；内转子电机转子在定子内部，转速相对更高但扭矩较弱","tags":[],"bankId":"uav-qa"},{"id":"cmp-0243","type":"single","difficulty":1,"stem":"常用电动动力系统，电机、电调、电池各有几根线？","options":[{"key":"A","text":"无刷电机3根，电调8根，电池S+1根"},{"key":"B","text":"无刷电机3根，电调8根，电池S+2根"},{"key":"C","text":"无刷电机3根，电调8根，电池S+3根"}],"answer":"C","analysis":"提示：S+3\n解析：根据下图可以看出：从电机出来：3根电调：左2接电池，右3接电机，左3下接飞控，一共8根电池线：强调“平衡头”的是S+1，光说“电线”是S+3","tags":[],"bankId":"uav-qa"},{"id":"cmp-0244","type":"single","difficulty":1,"stem":"多旋翼无人机的配电、用电系统连线正确的是哪个","options":[{"key":"A","text":"动力电源-分电设备(并联)-ESC-电机"},{"key":"B","text":"动力电源-分电设备(串联)-ESC-电机"},{"key":"C","text":"以上都是"}],"answer":"A","analysis":"提示：配电并联\n解析：多旋翼无人机需为各电机供相同电压以保证正常工作。动力电源先连分电设备，分电设备通过并联方式，将相同电压分配给各 ESC，ESC 再接收飞控指令控制电机，此连接能确保各电机供电稳定，满足飞行需求。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0245","type":"single","difficulty":1,"stem":"多旋翼飞行器飞行平台由哪些设备组成，描述出其连接方式。","options":[{"key":"A","text":"遥控接收机-飞控-电调-电机;摄像头-图传-图传电源"},{"key":"B","text":"动力电池-电调-电机;数传电源-数传模块-飞控"},{"key":"C","text":"以上都是"}],"answer":"C","analysis":"提示：数传以上都是\n解析：多轴飞行平台核心连接包含动力与控制链路：其一，遥控接收机接收指令传飞控，飞控输信号给电调，电调驱动电机，同时摄像头经图传传画面，图传需独立电源；其二，动力电池供电给电调，数传模块由数传电源供电并与飞控通信。两表述均符合实际连接逻辑，故 “以上都是” 正确。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0246","type":"single","difficulty":1,"stem":"固定翼无人机重心配平位置一般在哪里？","options":[{"key":"A","text":"当量机翼15%弦线处"},{"key":"B","text":"当量机翼25%弦线处"},{"key":"C","text":"当量机翼35%弦线处"}],"answer":"B","analysis":"提示：0.25\n解析：固定翼无人机重心需与升力中心匹配以保稳定性，当量机翼 25% 弦线处是常见配平位置，能平衡俯仰力矩，避免过度低头或抬头，保障飞行姿态稳定，符合常规设计标准。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0247","type":"single","difficulty":1,"stem":"多旋翼飞行器上各种天线设备布置要求是？","options":[{"key":"A","text":"GPS接收天线尽量中心高处无遮挡;遥控接收机天线、数传天线、图传天线尽量互相靠近都布置于机身下方无遮挡;所有全向天线尽量垂直布置"},{"key":"B","text":"GPS接收天线尽量中心高处无遮挡;遥控接收机天线、数传天线、图传天线尽量互相远离都布置于机身下方无遮挡;所有全向天线尽量垂直布置"},{"key":"C","text":"GPS接收天线尽量中心高处无遮挡;遥控接收机天线、数传天线、图传天线尽量互相远离都布置于机身下方无遮挡;所有全向天线尽量水平布置"}],"answer":"B","analysis":"提示：互相远离+垂直布置\n解析：GPS 需高处无遮挡以收卫星信号；多类通信天线远离可防信号干扰，机身下无遮挡保传输；全向天线垂直布置能最大化信号覆盖范围，符合设备工作需求。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0248","type":"single","difficulty":1,"stem":"若舵机摇臂、连杆安装间隙过大，会造成（）。","options":[{"key":"A","text":"操纵时有空程，严重可能导致自动驾驶控制发散或舵面遥控人机振荡"},{"key":"B","text":"操纵时无空程，严重可能导致自动驾驶控制发散或舵面遥控人机振荡"},{"key":"C","text":"操纵时有空程，严重可能导致自动驾驶控制收敛或舵面遥控人机振荡"}],"answer":"A","analysis":"提示：有空程+发散振荡\n解析：间隙过大使操纵指令传递出现空行程，产生延迟。这会破坏控制精度：自动驾驶易因偏差放大而控制发散，人工遥控易引发人机振荡，符合间隙过大的实际影响。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0249","type":"single","difficulty":1,"stem":"固定翼无人机降落时放下襟翼，是为了？","options":[{"key":"A","text":"增加升力减小阻力"},{"key":"B","text":"提高着陆速度"},{"key":"C","text":"降低着陆速度"}],"answer":"C","analysis":"提示：放下襟翼降低速度\n解析：固定翼无人机的襟翼属于增升装置，放下襟翼时，机翼面积增大且弯度增加，能在相同空速下产生更大升力。这一特性允许无人机在更低的速度下仍保持足够升力支撑机身，从而降低着陆时的接地速度，减少着陆滑跑距离，提升降落安全性。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0250","type":"single","difficulty":1,"stem":"关于V型尾翼布局，描述正确的是？","options":[{"key":"A","text":"成90度角布置最好"},{"key":"B","text":"尾翼的大小与角度应考虑纵向稳定性"},{"key":"C","text":"尾翼的大小与角度应综合考虑俯仰和偏航稳定性"}],"answer":"C","analysis":"提示：综合考虑\n解析：V 型尾翼通过两个倾斜尾翼同时承担升降舵（控制俯仰）和方向舵（控制偏航）的功能，其核心设计需平衡两种姿态控制需求。尾翼大小影响控制力强弱，角度决定俯仰与偏航控制的耦合效率，需综合考量二者稳定性，而非仅关注纵向（俯仰）或固定 90 度角，符合 V 型尾翼的功能逻辑。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0251","type":"single","difficulty":1,"stem":"关于机载视距链路天线的布置，描述正确的是哪个？","options":[{"key":"A","text":"放在机腹比放在机背好"},{"key":"B","text":"放在机背比放在机腹好"},{"key":"C","text":"要综合考虑无人机作业的高度与距离机体外形、起落架位置、电磁兼容等"}],"answer":"C","analysis":"提示：综合考虑\n解析：机载视距链路天线布置无绝对 “机背更好” 或 “机腹更好” 的定论。需结合作业场景（如高度、距离）避免遮挡，适配机体外形防气流干扰，避开起落架防物理损坏，同时规避电磁兼容问题，综合考量才能保障链路稳定。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0252","type":"single","difficulty":1,"stem":"固定翼无人机遥控时打左副翼，描述正确的是？","options":[{"key":"A","text":"左机翼升力增加，右机翼升力减小"},{"key":"B","text":"左机翼升力减小，右机翼升力增加"},{"key":"C","text":"左右机翼升力都增加"}],"answer":"B","analysis":"提示：左升-右升+\n解析：副翼操控通过改变机翼升力实现滚转。打左副翼时，左副翼向上偏转，减小左机翼迎角，升力随之减小；右副翼向下偏转，增大右机翼迎角，升力随之增加，左右机翼升力差推动机身向左滚转。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0253","type":"single","difficulty":1,"stem":"固定翼无人机遥控时单纯打左副翼 ()；单纯打右副翼，()。","options":[{"key":"A","text":"产生左侧滑和左滚转;产生右侧滑和右滚转"},{"key":"B","text":"产生左侧滑和左偏航;产生右侧滑和右偏航"},{"key":"C","text":"产生左偏航无侧滑;产生右偏航无侧滑"}],"answer":"A","analysis":"提示：单纯副翼：左左右右滚转\n解析：单纯打左副翼，左机翼升力减小、右机翼升力增大，机身向左滚转；因方向舵未动，滚转时机身与气流方向存在夹角，产生左侧滑。同理，单纯打右副翼会产生右侧滑和右滚转，符合副翼单独操控的运动特征。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0254","type":"single","difficulty":1,"stem":"固定翼无人机遥控时单纯打左方向，()；单纯打右方向，()。","options":[{"key":"A","text":"产生左侧滑和左偏航;产生右侧滑和右偏航"},{"key":"B","text":"产生左侧滑和左滚转;产生右侧滑和右滚转"},{"key":"C","text":"产生左滚转无侧滑;产生右滚转无侧滑"}],"answer":"A","analysis":"提示：单纯左方向：左左右右偏航\n解析：单纯打左方向即左方向舵偏转，会使机尾右偏、机头左偏（左偏航），但副翼未动，左右机翼升力均衡无滚转，机身会因气流作用产生左侧滑；同理，单纯打右方向会产生右侧滑和右偏航，符合方向舵单独操控的特性。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0255","type":"single","difficulty":1,"stem":"固定翼无人机遥控时打左副翼左方向，()；打右副翼和右方向，()。","options":[{"key":"A","text":"产生左偏航左滚转左侧滑;产生右偏航右滚转右侧滑"},{"key":"B","text":"产生左偏航右滚转左侧滑;产生右偏航左滚转右侧滑"},{"key":"C","text":"产生左偏航左滚转无侧滑;产生右偏航右滚转无侧滑"}],"answer":"C","analysis":"提示：左左无右右无\n解析：固定翼打左副翼会使左机翼升力减小、右机翼升力增大，产生左滚转；同步打左方向（方向舵左偏），可抵消滚转带来的侧滑，仅形成左偏航与左滚转。同理，打右副翼和右方向，会产生右偏航右滚转且无侧滑，符合协调转弯的操控逻辑。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0256","type":"single","difficulty":1,"stem":"关于多旋翼的有头模式和无头模式，描述正确的是哪个？","options":[{"key":"A","text":"有头模式参照飞机自身坐标系，无头模式参照地理坐标系"},{"key":"B","text":"有头模式参照地理坐标系，无头模式参照飞机自身坐标系"},{"key":"C","text":"有头模式和无头模式都参照地理坐标系"}],"answer":"A","analysis":"提示：有头飞机，无头地理\n解析：有头模式下，无人机运动方向以自身头部朝向为基准（如 “向前” 即朝机头方向），遵循自身坐标系；无头模式则以起飞时的地理方向（如操作者前方）为基准，不受机头朝向影响，符合地理坐标系参照逻辑。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0257","type":"single","difficulty":1,"stem":"集成了外置磁传感器的多旋翼GPS天线安装时，（）。","options":[{"key":"A","text":"必须高出机体，并远离金属，避免磁场干扰"},{"key":"B","text":"尽量紧贴机体，并靠近金属，增强接收能力"},{"key":"C","text":"尽量紧贴机体，并远离金属，避免磁场干扰"}],"answer":"A","analysis":"提示：高出+远离\n解析：外置磁传感器易受金属物体磁场干扰，GPS 天线需良好接收卫星信号。高出机体可减少机体遮挡，远离金属能规避磁场干扰，确保磁传感器和 GPS 天线正常工作，符合安装规范。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0258","type":"single","difficulty":1,"stem":"关于活塞发动机后推式固定翼和前拉式固定翼，描述正确的是（）。","options":[{"key":"A","text":"前拉装反桨，后推装正桨"},{"key":"B","text":"前拉装正桨，后推装反桨"},{"key":"C","text":"前拉后推都是装正桨"}],"answer":"B","analysis":"提示：前拉正，后推反\n解析：正桨旋转时产生向前拉力，适配前拉式固定翼（发动机前置，需拉动机身前进）；反桨旋转方向与正桨相反，产生向后推力，适配后推式固定翼（发动机后置，需推动机身前进），符合两种布局的动力需求。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0259","type":"single","difficulty":1,"stem":"固定翼无人机降落后发动机无法停车应如何处理？","options":[{"key":"A","text":"切断火花塞供电，切断供油"},{"key":"B","text":"封闭进气口，封闭排气口"},{"key":"C","text":"以上都对"}],"answer":"C","analysis":"提示：无法停车以上都对\n解析：固定翼发动机无法停车时，切断火花塞供电可停止点火，切断供油能终止燃油供应，二者均能中断燃烧；封闭进气口会阻断空气进入，封闭排气口会憋压阻止排气，同样可使发动机熄火，两种方法均为有效处置方式。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0260","type":"single","difficulty":1,"stem":"关于直升机如何实现俯仰和滚转，以下正确的是？","options":[{"key":"A","text":"自动倾斜器运动，通过周期变距实现主旋翼在旋转面不同位置阻力不同，实现俯仰与滚转"},{"key":"B","text":"自动倾斜器运动，通过周期变距实现主旋翼在桨盘前后左右桨距的不同，进而形成一个圆面上前后左右升力的不同，实现俯仰与滚转操纵"},{"key":"C","text":"自动倾斜器运动，通过周期变距实现主旋翼在旋转面不同位置拉力不同，实现俯仰与滚转"}],"answer":"B","analysis":"提示：进而形成一个圆\n解析：直升机俯仰和滚转的核心是周期变距。自动倾斜器带动桨叶，使桨盘不同方位桨距变化，进而改变对应位置升力，形成升力差产生力矩，最终实现姿态调整，该表述精准匹配其操控原理。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0261","type":"single","difficulty":1,"stem":"无人直升机在姿态遥控状态下，如出现动力失效则正确的处理方法是？","options":[{"key":"A","text":"主旋翼总距先降到最低，接地前提高到最大"},{"key":"B","text":"保持主旋翼总距不变"},{"key":"C","text":"主旋翼总距先提到最大，接地前总距降低到最低"}],"answer":"A","analysis":"提示：总距 先最小再最大\n解析：本题与另一题“直升机动力失效”答案一致“总距 先最小再最大”直升机发动机失效后通过旋翼自转实现可控垂直下降的应急飞行状态，称为“自转下滑/自传下降”。发动机没了动力 → 打负总距，减小桨叶迎角、让旋翼靠下降气流自己转起来、转得很快（储存动能） → 离地数米时，猛地提总距，把旋翼的转动能量一下子挤成向上的升力，像垫了一个气垫，直升机就能轻缓落地。(直升机失去动力而下降、旋翼转速逐渐降低，这时要先“收总距”，旋翼阻力减小使得转速不会快速下降至危险的低转速。随着直升机下降速度的增加，风车效应使旋翼逐渐加速至期望的稳定转速状态。)（依据：中国航空协会发布的《直升机典型关键技术“自转着陆”解密》）","tags":[],"bankId":"uav-qa"},{"id":"cmp-0262","type":"single","difficulty":1,"stem":"常规布局固定翼无人机要实现向左滚转和上仰姿态，舵面的偏转方向应该（）。","options":[{"key":"A","text":"副翼左上右下，升降舵向上偏"},{"key":"B","text":"副翼左上右下，升降舵向下偏"},{"key":"C","text":"副翼左下右上，升降舵向上偏"}],"answer":"A","analysis":"提示：左上右下+向上偏\n解析：舵面操作与结果：副翼→操作：压左→左副翼偏上；右副翼偏下→左升力↓右升力↑→实现“左滚转”升降舵→操作：上拉→升降舵上偏→迎角增加升力↑→实现“上仰”鼠鼠老师小课堂：1.飞机靠副翼沿着纵轴控制“横滚”动作。想实现“左滚转”需要“左升力小右升力大”舵面操作动作为“向左稍压副翼杆量”会造左副翼向上偏，副翼向下偏，也就是“左上右下”（鼠鼠老师教大家一个秘诀：副翼压谁谁小（升力），压谁谁上（副翼上偏）。2.拉杆→升降舵上偏→飞机上仰、抬头 推杆→升降舵下偏→飞机低头、俯冲蓝皮书描述：当升降舵推杆,飞机头向下倾斜时,迎角降低。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0263","type":"single","difficulty":1,"stem":"多轴单个桨叶旋转锥面是()。","options":[{"key":"A","text":"正锥面"},{"key":"B","text":"倒锥面"},{"key":"C","text":"平面"}],"answer":"B","analysis":"提示：倒锥\n解析：多轴桨叶旋转时，受空气阻力和升力分布影响，桨叶会向上倾斜，形成尖端高于桨根的锥形面。该锥形面开口朝下，符合 “倒锥面” 的形态特征，而非开口朝上的正锥面或无倾斜的平面。","tags":[],"bankId":"uav-qa"},{"id":"cmp-0264","type":"single","difficulty":1,"stem":"用于起降的遥控器中在THR、ELE通道分别控制多旋翼无人机的（）。","options":[{"key":"A","text":"THR(上升、下降)ELE(前后、俯仰)"},{"key":"B","text":"THR(前后、俯仰)ELE(上升、下降)"},{"key":"C","text":"THR(上升、前后)ELE(下降、俯仰)"}],"answer":"A","analysis":"提示：THR-油门-上下；ELE-升降舵-前后俯仰\n解析：THR 是 Throttle（油门）的缩写，核心功能是通过调节动力输出控制多旋翼上升或下降；ELE 是 Elevator（升降舵）的缩写，对应多旋翼的前后飞行与俯仰姿态调整，符合遥控器通道的标准控制逻辑。","tags":[],"bankId":"uav-qa"}];

/* ================= 状态 ================= */

/* ================= 授权激活 ================= */
const AUTH_SECRET = 'UAV-QUIZ-AUTH-2024-v1';
const AUTH_STORAGE_KEY = 'uav_auth';

/** 获取设备指纹：优先用原生 Android ID，否则用本地持久化 UUID */
function getDeviceId() {
  try {
    if (window.__NativeBridge && typeof window.__NativeBridge.getDeviceId === 'function') {
      const id = window.__NativeBridge.getDeviceId();
      if (id) return id;
    }
  } catch (e) {}
  // 浏览器/PWA 兜底：用 localStorage 存一个 UUID，清除即需重新激活
  let fid = localStorage.getItem('uav_device_id');
  if (!fid) {
    fid = 'web-' + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('uav_device_id', fid);
  }
  return fid;
}

/** 哈希函数（FNV-1a 变体，纯 JS 实现，Python 端用相同算法生成激活码） */
function authHash(str) {
  let h1 = 0x811c9dc5;
  let h2 = 0x01000193;
  for (let i = 0; i < str.length; i++) {
    const c = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 0x01000193) >>> 0;
    h2 = Math.imul(h2 + c, 0x811c9dc5) >>> 0;
  }
  // 再做一轮交叉混合，增强混淆
  h1 = Math.imul(h1 ^ (h2 >>> 13), 0x01000193) >>> 0;
  h2 = Math.imul(h2 ^ (h1 >>> 16), 0x811c9dc5) >>> 0;
  return h1.toString(16).padStart(8, '0') + h2.toString(16).padStart(8, '0');
}

/** 根据设备 ID 生成激活码（管理员用） */
function generateCode(deviceId) {
  const hex = authHash(AUTH_SECRET + ':' + deviceId);
  const code = hex.slice(0, 16).toUpperCase();
  return code.match(/.{1,4}/g).join('-');
}

/** 校验激活码 */
async function verifyCode(deviceId, code) {
  const expected = await generateCode(deviceId);
  return code.trim().toUpperCase().replace(/[^A-Z0-9]/g, '') === expected.replace(/-/g, '');
}

/** 读取已保存的授权信息 */
function loadAuth() {
  try {
    return JSON.parse(localStorage.getItem(AUTH_STORAGE_KEY) || 'null');
  } catch (e) { return null; }
}

/** 检查当前是否已授权（设备 ID 必须匹配） */
async function checkAuth() {
  const saved = loadAuth();
  const deviceId = getDeviceId();
  if (!saved || saved.deviceId !== deviceId) return false;
  return await verifyCode(deviceId, saved.code);
}

/** 保存授权 */
function saveAuth(deviceId, code) {
  localStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify({
    deviceId: deviceId,
    code: code,
    activatedAt: Date.now()
  }));
}

/* ================= 工具 ================= */
function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* 按给定排列重建选项（记录 _order 便于保存进度后原样还原） */
function applyOptionOrder(q, order) {
  const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const src = q.options.slice();
  const options = order.map(function (oldIdx, newIdx) {
    return { key: LETTERS.charAt(newIdx), text: src[oldIdx].text };
  });
  const map = {};
  order.forEach(function (oldIdx, newIdx) {
    map[src[oldIdx].key] = LETTERS.charAt(newIdx);
  });
  let answer = q.answer;
  if (Array.isArray(answer)) {
    answer = answer
      .map(function (k) { return map[k] !== undefined ? map[k] : k; })
      .sort();
  } else if (typeof answer === 'string') {
    answer = map[answer] !== undefined ? map[answer] : answer;
  }
  return Object.assign({}, q, { options: options, answer: answer, _order: order });
}

/* 测试模式专用：打乱选项顺序并重排选项字母，正确答案同步映射（逐题模式保持原顺序） */
function shuffleOptions(q) {
  if (!q.options || q.options.length < 2) return q;
  const order = shuffle(q.options.map(function (_, i) { return i; }));
  // 若碰巧和原顺序完全一致，整体左移一位，保证测试模式与逐题模式有可见差异
  if (order.every(function (v, i) { return v === i; })) order.push(order.shift());
  return applyOptionOrder(q, order);
}

function judge(q, ua) {
  if (Array.isArray(q.answer)) {
    if (!Array.isArray(ua)) return false;
    return ua.slice().sort().join('') === q.answer.slice().sort().join('');
  }
  return ua === q.answer;
}

function correctText(q) {
  const a = q.answer;
  if (Array.isArray(a)) return a.join('、');
  if (typeof a === 'boolean') return a ? '正确' : '错误';
  return String(a);
}

function formatDate(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* ================= 进度保存（退出后可继续上次） ================= */
const SESSION_STORAGE_KEY = 'uav_sessions_v1';
const SESSION_MAX = 8;

/** 一次练习的唯一标识：题库 + 章节 + 是否随机 + 模式 */
function sessionKeyOf(bankId, chapter, random, mode) {
  return [bankId || '', chapter || '', random ? 'r' : 'n', mode].join('|');
}

/** 读取全部已保存的进度（按 key 分槽，互不覆盖） */
function readAllSessions() {
  try {
    const raw = localStorage.getItem(SESSION_STORAGE_KEY);
    if (!raw) return {};
    const d = JSON.parse(raw);
    if (!d || typeof d !== 'object' || d.qs) return {};
    return d;
  } catch (e) {
    return {};
  }
}

function writeAllSessions(map) {
  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(map));
  } catch (e) {}
}

/** 删除指定 key 的进度；不传则删除全部 */
function clearSession(key) {
  try {
    const map = readAllSessions();
    if (!key) {
      localStorage.removeItem(SESSION_STORAGE_KEY);
      return;
    }
    if (map[key]) {
      delete map[key];
      writeAllSessions(map);
    }
  } catch (e) {}
}

/** 把当前会话快照写入本地，退出/杀进程后仍可继续 */
function saveSession() {
  if (!S || !S.active || !S.key || S.submitted) return;
  // 一道未答且仍在第 1 题，视为无有效进度，不写入（避免下次误弹「继续上次」）
  if (S.index === 0 && Object.keys(S.answers || {}).length === 0) return;
  try {
    const map = readAllSessions();
    map[S.key] = {
      key: S.key,
      mode: S.mode,
      bankId: S.bankId,
      chapter: S.chapter,
      random: !!S.random,
      index: S.index,
      answers: S.answers,
      recorded: S.recorded,
      qs: S.questions.map(function (q) { return { id: q.id, o: q._order || null }; }),
      at: Date.now()
    };
    // 只保留最近若干条，避免长期占用空间
    const keys = Object.keys(map);
    if (keys.length > SESSION_MAX) {
      keys.sort(function (a, b) { return (map[b].at || 0) - (map[a].at || 0); })
        .slice(SESSION_MAX)
        .forEach(function (k) { delete map[k]; });
    }
    writeAllSessions(map);
  } catch (e) {}
}

/** 由快照还原会话对象（题目顺序与选项排列原样恢复） */
function rebuildSession(d) {
  const questions = [];
  (d.qs || []).forEach(function (item) {
    const q = QMAP[item.id];
    if (!q) return;
    questions.push(item.o ? applyOptionOrder(q, item.o) : q);
  });
  if (!questions.length) return null;
  return {
    active: true,
    key: d.key,
    mode: d.mode,
    bankId: d.bankId,
    chapter: d.chapter,
    random: !!d.random,
    questions: questions,
    answers: d.answers || {},
    recorded: d.recorded || {},
    index: Math.min(d.index || 0, questions.length - 1),
    submitted: false,
    correctCount: 0,
    savedAt: d.at || 0
  };
}

/** 查找与本次范围匹配的未完成会话，没有则返回 null */
function findSavedFor(scope, mode) {
  const key = sessionKeyOf(scope.bankId, scope.chapter, !!scope.random, mode);
  const d = readAllSessions()[key];
  if (!d) return null;
  const st = rebuildSession(d);
  if (!st) {
    clearSession(key);
    return null;
  }
  return st;
}

function record(q, ok) {
  DB.answered += 1;
  if (!DB.banks[q.bankId]) DB.banks[q.bankId] = { answered: 0, correct: 0 };
  DB.banks[q.bankId].answered += 1;
  if (ok) {
    DB.correct += 1;
    DB.banks[q.bankId].correct += 1;
    delete DB.wrong[q.id];
  } else {
    const w = DB.wrong[q.id] || { count: 0, lastAt: 0 };
    w.count += 1;
    w.lastAt = Date.now();
    DB.wrong[q.id] = w;
  }
  saveDB();
}

  const input = document.getElementById('authCodeInput');

/** 某次练习范围的题目池 */
function scopePool(scope) {
  let pool = (QUESTIONS_BY_BANK[scope.bankId] || []).slice();
  if (scope.chapter) {
    pool = pool.filter(function (q) { return q.chapter === scope.chapter; });
  }
  if (scope.random) {
    pool = shuffle(pool).slice(0, scope.size || PRACTICE_SIZE);
  }
  return pool;
}

function scopeCount(scope) {
  if (scope.random) {
    const total = scopePool(Object.assign({}, scope, { random: false })).length;
    return Math.min(scope.size || PRACTICE_SIZE, total);
  }
  return scopePool(scope).length;
}

/* ================= 答题 ================= */
function startSession(list, mode, bankId, chapter, meta) {
  const info = meta || {};
  // 两种模式题目顺序都随机打乱一次（区别于原始数据顺序）
  // 测试模式额外打乱每题选项顺序；逐题模式选项保持原顺序
  let questions = shuffle(list);
  if (mode === 'test') {
    questions = questions.map(shuffleOptions);
  }
  const bid = bankId || (list[0] && list[0].bankId) || null;
  S = {
    active: true,
    mode: mode,
    bankId: bid,
    chapter: chapter || null,
    random: !!info.random,
    // save === false 的临时练习（如错题复习）不保存进度
    key: info.save === false ? null : sessionKeyOf(bid, chapter, !!info.random, mode),
    questions: questions,
    answers: {},
    recorded: {},
    index: 0,
    submitted: false,
    correctCount: 0
  };
  SHEET = null;
  saveSession();
  render();
  window.scrollTo(0, 0);
}

function chooseMode(mode) {
  const scope = (SHEET && SHEET.scope) || {};
  const saved = findSavedFor(scope, mode);
  if (saved) {
    SHEET = { kind: 'resume', scope: scope, mode: mode, state: saved };
    render();
    return;
  }
  const pool = scopePool(scope);
  SHEET = null;
  if (pool.length === 0) {
    toast('该范围暂无题目');
    return;
  }
  startSession(pool, mode, scope.bankId, scope.chapter, { random: !!scope.random });
}

        '<div class="mode-arrow"></div>' +
      '</div>' +
      '<div class="sheet-cancel" onclick="closeSheet()">取消</div>' +
    '</div>' +
  '</div>';
}

function resumeSession() {
  const st = SHEET && SHEET.state;
  SHEET = null;
  if (!st) { render(); return; }
  S = st;
  saveSession();
  render();
  window.scrollTo(0, 0);
}

function restartFromSheet() {
  const scope = (SHEET && SHEET.scope) || {};
  const mode = SHEET && SHEET.mode;
  const pool = scopePool(scope);
  clearSession(sessionKeyOf(scope.bankId, scope.chapter, !!scope.random, mode));
  SHEET = null;
  if (pool.length === 0) {
    toast('该范围暂无题目');
    render();
    return;
  }
  startSession(pool, mode, scope.bankId, scope.chapter, { random: !!scope.random });
}

/** 统一渲染底部弹层 */
function renderSheet() {
  if (!SHEET) return '';
  if (SHEET.kind === 'banks') return renderBankPicker();
  if (SHEET.kind === 'resume') return renderResumeSheet();
  return renderModeSheet();
}

function switchTab(tab) {
  TAB = tab;
  render();
  window.scrollTo(0, 0);
}

function quizTitle() {
  const bankName = BANKMAP[S.bankId] ? BANKMAP[S.bankId].name : '答题';
  return S.chapter ? bankName + ' · ' + S.chapter : bankName;
}

function renderQuiz() {
  const q = S.questions[S.index];
  const ua = S.answers[q.id];
  const revealed = S.submitted || (S.mode === 'practice' && ua !== undefined);
  const isLast = S.index === S.questions.length - 1;
  const answeredCount = Object.keys(S.answers).length;

  let optionsHtml = '';
  (q.options || []).forEach(function (opt) {
    let cls = 'option';
    if (revealed) {
      cls += ' locked';
      if (opt.key === q.answer) cls += ' correct';
      else if (ua === opt.key) cls += ' wrong';
    } else if (ua === opt.key) {
      cls += ' selected';
    }
    let flag = '';
    if (revealed) {
      if (opt.key === q.answer) flag = '<div class="opt-flag correct">✓</div>';
      else if (ua === opt.key) flag = '<div class="opt-flag wrong">×</div>';
    }
    optionsHtml += '<div class="' + cls + '" onclick="pick(\'' + esc(opt.key) + '\')">' +
      '<div class="opt-key">' + esc(opt.key) + '</div>' +
      '<div class="opt-text">' + esc(opt.text) + '</div>' +
      flag +
    '</div>';
  });

  let analysisHtml = '';
  if (revealed) {
    const tone = ua === undefined ? 'neutral' : (judge(q, ua) ? 'ok' : 'bad');
    const label = ua === undefined ? '未作答' : (judge(q, ua) ? '回答正确' : '回答错误');
    analysisHtml = '<div class="analysis ' + tone + '">' +
      '<div class="analysis-head"><span class="analysis-title">答案解析</span><span class="analysis-result">' + label + '</span></div>' +
      '<div class="analysis-answer"><span>正确答案</span><b>' + esc(correctText(q)) + '</b></div>' +
      '<div class="analysis-text ' + (q.analysis ? '' : 'empty') + '">' + esc(q.analysis || '本题暂无详细解析') + '</div>' +
    '</div>';
  }

  let sheetHtml = '';
  if (S.submitted || S.mode === 'test') {
    sheetHtml = '<div class="sheet-card">' +
      '<div class="sheet-head"><b>答题卡</b>' +
        (S.mode === 'test' && !S.submitted ? '<span>已答 ' + answeredCount + ' / ' + S.questions.length + ' 题</span>' : '') +
      '</div>' +
      '<div class="legend">' +
        (!S.submitted ? '<div class="legend-item"><div class="legend-dot dot-done"></div>已答</div>' : '') +
        (S.submitted ? '<div class="legend-item"><div class="legend-dot dot-correct"></div>答对</div>' : '') +
        (S.submitted ? '<div class="legend-item"><div class="legend-dot dot-wrong"></div>答错</div>' : '') +
        '<div class="legend-item"><div class="legend-dot dot-empty"></div>未答</div>' +
      '</div>' +
      '<div class="sheet-grid">' +
        S.questions.map(function (item, idx) {
          return '<div class="sheet-cell ' + cellClass(item) + '" onclick="jumpTo(' + idx + ')">' + (idx + 1) + '</div>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  let bar = '';
  const answered = ua !== undefined;
  if (S.index > 0) bar += '<div class="btn ghost" onclick="prevQ()">上一题</div>';
  // 逐题模式已作答后，主按钮承担「下一题」，不再重复出现次要按钮
  if (!isLast && !(S.mode === 'practice' && !S.submitted && answered)) {
    bar += '<div class="btn ghost" onclick="nextQ()">下一题</div>';
  }
  if (!S.submitted && S.mode === 'practice') {
    const label = isLast ? '交卷' : (answered ? '下一题' : '提交本题');
    bar += '<div class="btn primary" onclick="practiceSubmit()">' + label + '</div>';
  }
  if (!S.submitted && S.mode === 'test') {
    bar += '<div class="btn primary" onclick="askSubmit()">交卷</div>';
  }
  if (S.submitted) {
    bar += '<div class="btn primary" onclick="finishQuiz()">完成</div>';
  }

  return '<div class="quiz-page">' +
    '<div class="quiz-top">' +
      '<button class="icon-btn" onclick="exitQuiz()" aria-label="返回">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>' +
      '</button>' +
      '<div class="quiz-top-title">' + esc(quizTitle()) + '</div>' +
      '<div style="width:36px"></div>' +
    '</div>' +
    '<div class="progress-wrap">' +
      '<div class="progress-top">' +
        '<div class="mode-pill ' + (S.mode === 'test' ? 'test' : 'practice') + '"><i></i>' + (S.mode === 'test' ? '测试模式' : '逐题模式') + '</div>' +
        '<div class="progress-count"><b>' + (S.index + 1) + '</b><span>&nbsp;/ ' + S.questions.length + '</span></div>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill ' + (S.mode === 'test' ? 'test' : '') + '" style="width:' + ((S.index + 1) / S.questions.length * 100) + '%"></div></div>' +
      '<div class="progress-meta">' +
        '<span class="meta-hint">' + (S.mode === 'test' ? '交卷后统一批改，过程中不显示对错' : '作答后立即显示对错与解析') + '</span>' +
        (S.submitted ? '<span class="meta-score">得分 ' + S.correctCount + ' / ' + S.questions.length + '</span>' : '') +
      '</div>' +
    '</div>' +

    '<div class="question-card">' +
      '<div class="q-tags">' +
        '<span class="q-tag type">' + (TYPE_TEXT[q.type] || '题目') + '</span>' +
        '<span class="q-tag d' + (q.difficulty || 1) + '">' + (DIFF_TEXT[q.difficulty] || '简单') + '</span>' +
        '<span class="q-tag chapter">' + esc(q.chapter || '') + '</span>' +
      '</div>' +
      '<div class="q-stem">' + esc(q.stem) + '</div>' +
      optionsHtml +
      analysisHtml +
    '</div>' +

    sheetHtml +
    '<div class="bottom-bar">' + bar + '</div>' +
  '</div>';
}

function cellClass(q) {
  const ua = S.answers[q.id];
  if (ua === undefined) return '';
  if (!S.submitted) return 'done';
  return judge(q, ua) ? 'correct' : 'wrong';
}

function pick(key) {
  const q = S.questions[S.index];
  if (S.submitted) return;
  if (S.mode === 'test') {
    S.answers[q.id] = key;
    saveSession();
    render();
    return;
  }
  if (S.answers[q.id] !== undefined) return;
  S.answers[q.id] = key;
  const ok = judge(q, key);
  S.recorded[q.id] = true;
  record(q, ok);
  saveSession();
  render();
}

function nextQ() {
  if (S.index < S.questions.length - 1) {
    S.index += 1;
    saveSession();
    render();
    window.scrollTo(0, 0);
  }
}

function prevQ() {
  if (S.index > 0) {
    S.index -= 1;
    saveSession();
    render();
    window.scrollTo(0, 0);
  }
}

function jumpTo(idx) {
  if (idx < 0 || idx >= S.questions.length) return;
  S.index = idx;
  saveSession();
  render();
  window.scrollTo(0, 0);
}

function practiceSubmit() {
  const q = S.questions[S.index];
  if (S.answers[q.id] === undefined) {
    toast('请先作答');
    return;
  }
  if (S.index === S.questions.length - 1) askSubmit();
  else nextQ();
}

function askSubmit() {
  const unanswered = S.questions.length - Object.keys(S.answers).length;
  openDialog({
    title: '确认交卷',
    text: unanswered > 0
      ? '共 ' + S.questions.length + ' 题，还有 ' + unanswered + ' 题未作答。交卷后未作答题目按错误计。'
      : '共 ' + S.questions.length + ' 题，已全部作答，确定交卷吗？',
    confirmText: '确定交卷',
    cancelText: '再检查一下',
    onConfirm: doSubmit
  });
}

function doSubmit() {
  let correct = 0;
  S.questions.forEach(function (q) {
    const ua = S.answers[q.id];
    if (ua === undefined) return;
    const ok = judge(q, ua);
    if (ok) correct += 1;
    if (!S.recorded[q.id]) record(q, ok);
  });
  S.correctCount = correct;
  S.submitted = true;
  if (S.key) clearSession(S.key);
  render();
  window.scrollTo(0, 0);
}

function finishQuiz() {
  if (S.key) clearSession(S.key);
  S = { active: false };
  TAB = 'home';
  render();
  window.scrollTo(0, 0);
}

function exitQuiz() {
  const answered = Object.keys(S.answers).length;
  if (!S.submitted && answered > 0) {
    openDialog({
      title: '退出练习',
      text: '进度已自动保存，下次进入时可选择从第 ' + (S.index + 1) + ' 题继续。',
      confirmText: '退出',
      cancelText: '继续答题',
      onConfirm: function () {
        saveSession();
        S = { active: false };
        render();
        window.scrollTo(0, 0);
      }
    });
  } else {
    saveSession();
    S = { active: false };
    render();
    window.scrollTo(0, 0);
  }
}

function reviewOne(id) {

function reviewAll() {

}

function askClearWrong() {

function openDialog(opts) {

function renderDialog() {

        (d.cancelText ? '<div class="dialog-btn cancel" onclick="dismissDialog()">' + esc(d.cancelText) + '</div>' : '') +
        '<div class="dialog-btn confirm" onclick="confirmDialog()">' + esc(d.confirmText || '确定') + '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function dismissDialog() {
  DIALOG = null;
  render();
}

function confirmDialog() {
  const action = DIALOG ? DIALOG.onConfirm : null;
  DIALOG = null;
  if (action) action();
  else render();
}

/* ================= 答题页左右滑动切题 ================= */
(function () {
  var startX = 0, startY = 0, startT = 0, tracking = false;

  document.addEventListener('pointerdown', function (e) {
    if (!S.active || DIALOG || SHEET) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    tracking = true;
    startX = e.clientX;
    startY = e.clientY;
    startT = Date.now();
  }, { passive: true });

  document.addEventListener('pointerup', function (e) {
    if (!tracking) return;
    tracking = false;
    if (!S.active || DIALOG || SHEET) return;
    if (Date.now() - startT > 1000) return;
    var dx = e.clientX - startX;
    var dy = e.clientY - startY;
    // 横向位移足够大且明显大于纵向，避免影响上下滚动
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if (dx < 0) nextQ();
    else prevQ();
  }, { passive: true });

  // 滚动或手势被系统接管时取消本次滑动，避免误切题
  document.addEventListener('pointercancel', function () { tracking = false; }, { passive: true });
})();
