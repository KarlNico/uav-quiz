<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="无人机理论题库">
<title>无人机理论题库</title>
<style>
  :root {
    --primary: #4F46E5;
    --primary-light: #EEF2FF;
    --primary-soft: #F5F3FF;
    --success: #10B981;
    --success-soft: #ECFDF5;
    --warning: #F59E0B;
    --warning-soft: #FFFBEB;
    --danger: #EF4444;
    --danger-soft: #FEF2F2;
    --text: #111827;
    --text-2: #4B5563;
    --muted: #6B7280;
    --light: #9CA3AF;
    --border: #E5E7EB;
    --border-light: #F1F2F6;
    --bg: #F5F6FA;
    --white: #FFFFFF;
    --gradient: linear-gradient(135deg, #4F46E5 0%, #7C3AED 100%);
    --gradient-hero: linear-gradient(135deg, #4338CA 0%, #6D28D9 55%, #7C3AED 100%);
    --shadow-card: 0 4px 14px rgba(17, 24, 39, 0.06);
    --shadow-float: 0 8px 20px rgba(17, 24, 39, 0.12);
    --shadow-primary: 0 6px 14px rgba(79, 70, 229, 0.28);
    --nav-h: 56px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }

  body {
    background: #E9EAF0;
  }

  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--bg);
  }

  /* 顶部留白：Android 壳层把状态栏高度（已换算成 CSS px）传给 --android-statusbar-top，
     这里再补 12px 呼吸空间；浏览器环境该变量为 0，由 env(safe-area-inset-top) 兜底 */
  :root { --android-statusbar-top: 0px; }
  .page {
    padding: calc(12px + var(--android-statusbar-top) + env(safe-area-inset-top)) 12px 24px;
    background: var(--bg);
    min-height: 100vh;
  }

  .page.tabbed {
    min-height: 100vh;
    padding-bottom: calc(var(--nav-h) + 90px + env(safe-area-inset-bottom));
  }

  button { font-family: inherit; }

  /* ---------- 首页 hero ---------- */
  .hero {
    position: relative;
    overflow: hidden;
    background: var(--gradient-hero);
    border-radius: 18px;
    padding: 18px 16px 12px;
    box-shadow: var(--shadow-primary);
    animation: fadeUp .35s ease both;
  }

  .glow {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.12);
  }
  .glow.a { width: 160px; height: 160px; top: -70px; right: -45px; }
  .glow.b { width: 100px; height: 100px; bottom: -60px; left: -20px; background: rgba(255,255,255,.08); }

  .hero-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; }
  .hero-text { flex: 1; min-width: 0; }
  .kicker {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(255,255,255,.65);
    margin-bottom: 5px;
  }
  .hero-title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .5px;
    line-height: 1.3;
  }
  .hero-sub { font-size: 12px; color: rgba(255,255,255,.78); margin-top: 4px; }

  .emblem {
    width: 52px; height: 52px;
    border-radius: 14px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #fff;
    flex-shrink: 0; margin-left: 10px;
  }

  .hero-stats {
    position: relative;
    display: flex; align-items: center;
    margin-top: 16px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 10px;
    padding: 10px 4px;
  }
  .hs { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .hs b { font-size: 19px; font-weight: 700; color: #fff; line-height: 1.2; }
  .hs b small { font-size: 11px; font-weight: 600; }
  .hs span { font-size: 10.5px; color: rgba(255,255,255,.72); margin-top: 3px; }
  .hs-div { width: 1px; height: 22px; background: rgba(255,255,255,.18); }

  /* ---------- 区块标题 ---------- */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 18px 2px 10px;
  }
  .section-title { font-size: 16px; font-weight: 700; }
  .section-hint { font-size: 11px; color: var(--light); }

  /* ---------- 题库卡片 ---------- */
  .bank-card {
    display: flex; align-items: center;
    background: var(--white);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: transform .15s;
    animation: fadeUp .35s .05s ease both;
  }
  .bank-card:active { transform: scale(.985); }

  .bank-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--gradient);
    box-shadow: 0 4px 10px rgba(79,70,229,.24);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: #fff;
    margin-right: 12px; flex-shrink: 0;
  }
  .bank-info { flex: 1; min-width: 0; }
  .bank-name { font-size: 16px; font-weight: 700; }
  .bank-desc {
    font-size: 11.5px; color: var(--muted); margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bank-chips { display: flex; gap: 6px; margin-top: 6px; }
  .chip {
    font-size: 10.5px; color: var(--primary);
    background: var(--primary-light);
    padding: 1px 8px; border-radius: 999px;
  }
  .chip.soft { color: var(--muted); background: #F3F4F6; }
  .arrow {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--primary-soft);
    display: flex; align-items: center; justify-content: center;
    margin-left: 8px; flex-shrink: 0;
  }
  .arrow::after {
    content: '';
    width: 6px; height: 6px;
    border-top: 1.5px solid var(--primary);
    border-right: 1.5px solid var(--primary);
    transform: rotate(45deg);
    margin-left: -2px;
  }

  /* ---------- 快捷入口 ---------- */
  .quick { display: flex; gap: 10px; margin-top: 10px; }
  .quick-card {
    flex: 1; display: flex; align-items: center;
    background: var(--white);
    border-radius: 14px;
    padding: 12px 10px;
    box-shadow: var(--shadow-card);
    cursor: pointer;
    transition: transform .15s;
    animation: fadeUp .35s .1s ease both;
  }
  .quick-card:active { transform: scale(.97); }
  .qicon {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 700;
    margin-right: 9px; flex-shrink: 0;
  }
  .qicon.danger { color: var(--danger); background: var(--danger-soft); }
  .qicon.primary { color: var(--primary); background: var(--primary-light); }
  .quick-text { font-size: 13.5px; font-weight: 600; }
  .quick-desc { font-size: 10.5px; color: var(--muted); margin-top: 2px; }

  /* ---------- 安装提示（仅 PWA 版显示） ---------- */
  .install-card {
    display: flex; align-items: center;
    margin-top: 10px;
    background: var(--white);
    border: 1px dashed rgba(79,70,229,.35);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    animation: fadeUp .3s ease both;
  }
  .install-icon {
    width: 38px; height: 38px; border-radius: 11px;
    background: var(--gradient);
    color: #fff; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    margin-right: 9px; flex-shrink: 0;
  }
  .install-info { flex: 1; min-width: 0; }
  .install-title { font-size: 13.5px; font-weight: 600; }
  .install-desc { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .install-action {
    flex-shrink: 0;
    padding: 7px 16px;
    background: var(--gradient);
    color: #fff;
    border-radius: 999px;
    font-size: 12.5px; font-weight: 600;
    box-shadow: 0 4px 10px rgba(79,70,229,.24);
    margin-left: 8px;
  }

  /* ---------- 底部导航 ---------- */
  .tabbar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
    width: 100%;
    max-width: 480px;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--white);
    border-top: 1px solid var(--border-light);
    display: flex;
    z-index: 50;
  }
  .tab-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--light);
    font-size: 10.5px;
    cursor: pointer;
    gap: 3px;
  }
  .tab-item svg { width: 22px; height: 22px; }
  .tab-item.active { color: var(--primary); }

  /* ---------- 底部弹层 ---------- */
  .sheet-mask {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background: rgba(17, 24, 39, .45);
    z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    animation: maskIn .2s ease both;
  }
  .sheet {
    width: 100%; max-width: 480px;
    background: var(--white);
    border-radius: 18px 18px 0 0;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    box-shadow: var(--shadow-float);
    animation: sheetUp .28s cubic-bezier(.22,.8,.3,1) both;
  }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: #E5E7EB; margin: 0 auto 14px; }
  .sheet-title { font-size: 17px; font-weight: 700; }
  .sheet-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; margin-bottom: 14px; }

  .mode-item {
    display: flex; align-items: center;
    padding: 12px;
    border: 1px solid var(--border-light);
    border-radius: 10px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all .15s;
  }
  .mode-item:active { border-color: var(--primary); background: var(--primary-soft); }
  .mode-icon {
    width: 44px; height: 44px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    margin-right: 11px; flex-shrink: 0;
  }
  .mode-icon.practice { color: var(--primary); background: var(--primary-light); }
  .mode-icon.test { color: var(--warning); background: var(--warning-soft); }
  .mode-name { font-size: 15px; font-weight: 600; }
  .mode-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .mode-arrow {
    width: 8px; height: 8px;
    border-top: 1.5px solid var(--light);
    border-right: 1.5px solid var(--light);
    transform: rotate(45deg);
    margin-left: auto; flex-shrink: 0;
  }
  .sheet-cancel {
    margin-top: 4px;
    padding: 11px 0;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
    background: #F3F4F6;
    border-radius: 10px;
    cursor: pointer;
  }
  .sheet-cancel:active { background: #E5E7EB; }

  /* ---------- 答题页 ---------- */
  .quiz-top {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between;
    height: 44px; padding: 0 8px;
    background: var(--white);
    border-bottom: 1px solid var(--border-light);
  }
  .icon-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; color: var(--text-2);
    cursor: pointer;
  }
  .icon-btn svg { width: 22px; height: 22px; }
  .quiz-top-title { font-size: 15px; font-weight: 600; }

  /* ---------- 二级页面顶栏（章节列表） ---------- */
  .page-top {
    display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 8px; margin-bottom: 4px;
  }
  .page-top-title {
    font-size: 16px; font-weight: 600;
    max-width: 65%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .chapter-summary {
    font-size: 12.5px; color: var(--text-3);
    padding: 0 4px 10px;
  }
  .chapter-card {
    display: flex; align-items: center; gap: 12px;
    background: var(--white);
    border-radius: 16px;
    padding: 14px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .chapter-no {
    width: 34px; height: 34px; flex-shrink: 0;
    border-radius: 11px;
    background: #EEF2FF; color: #4F46E5;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .chapter-info { flex: 1; min-width: 0; }
  .chapter-name { font-size: 14.5px; font-weight: 600; color: var(--text-1); }
  .chapter-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }

  .progress-wrap { padding: 12px 16px 10px; background: var(--white); }
  .progress-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .mode-pill {
    display: inline-flex; align-items: center;
    padding: 3px 9px; border-radius: 999px;
    font-size: 10.5px; font-weight: 600;
  }
  .mode-pill i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin-right: 5px; }
  .mode-pill.practice { color: var(--primary); background: var(--primary-light); }
  .mode-pill.test { color: var(--warning); background: var(--warning-soft); }
  .progress-count { display: flex; align-items: baseline; }
  .progress-count b { font-size: 17px; font-weight: 700; }
  .progress-count span { font-size: 12px; color: var(--light); }
  .progress-track { height: 5px; background: #EEF0F4; border-radius: 999px; overflow: hidden; }
  .progress-fill {
    height: 100%; min-width: 9px; border-radius: 999px;
    background: var(--gradient);
    transition: width .3s ease;
  }
  .progress-fill.test { background: linear-gradient(90deg, #F59E0B 0%, #F97316 100%); }
  .progress-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .meta-hint { font-size: 10.5px; color: var(--light); }
  .meta-score { font-size: 11.5px; font-weight: 700; color: var(--primary); }

  .question-card {
    margin: 12px;
    background: var(--white);
    border-radius: 14px;
    padding: 16px 14px;
    box-shadow: var(--shadow-card);
  }
  .q-tags { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
  .q-tag {
    font-size: 10.5px; padding: 2px 8px; border-radius: 999px;
  }
  .q-tag.type { color: var(--primary); background: var(--primary-light); }
  .q-tag.d1 { color: var(--success); background: var(--success-soft); }
  .q-tag.d2 { color: var(--warning); background: var(--warning-soft); }
  .q-tag.d3 { color: var(--danger); background: var(--danger-soft); }
  .q-tag.chapter { color: var(--light); margin-left: auto; }
  .q-stem { font-size: 17px; line-height: 1.7; font-weight: 500; margin-bottom: 16px; }

  .option {
    display: flex; align-items: flex-start;
    padding: 12px;
    background: #FAFAFC;
    border: 1px solid transparent;
    border-radius: 10px;
    margin-bottom: 9px;
    cursor: pointer;
    transition: all .18s;
  }
  .option.selected {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: 0 2px 7px rgba(79,70,229,.12);
  }
  .option.correct { border-color: rgba(16,185,129,.5); background: var(--success-soft); }
  .option.wrong { border-color: rgba(239,68,68,.45); background: var(--danger-soft); }
  .option.locked { cursor: default; }
  .opt-key {
    width: 26px; height: 26px; line-height: 26px; text-align: center;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 50%;
    margin-right: 9px; flex-shrink: 0;
    font-size: 13px; font-weight: 600; color: var(--text-2);
    transition: all .18s;
  }
  .option.selected .opt-key { background: var(--primary); border-color: var(--primary); color: #fff; }
  .option.correct .opt-key { background: var(--success); border-color: var(--success); color: #fff; }
  .option.wrong .opt-key { background: var(--danger); border-color: var(--danger); color: #fff; }
  .opt-text { flex: 1; font-size: 14px; line-height: 26px; }
  .opt-flag {
    width: 20px; height: 20px; line-height: 20px; text-align: center;
    border-radius: 50%;
    font-size: 12px; font-weight: 700; color: #fff;
    margin-left: 6px; margin-top: 3px; flex-shrink: 0;
  }
  .opt-flag.correct { background: var(--success); }
  .opt-flag.wrong { background: var(--danger); }

  .analysis {
    margin-top: 16px;
    padding: 12px;
    border-radius: 10px;
    border-left: 3px solid transparent;
    animation: fadeUp .25s ease both;
  }
  .analysis.ok { background: var(--success-soft); border-left-color: var(--success); }
  .analysis.bad { background: var(--danger-soft); border-left-color: var(--danger); }
  .analysis.neutral { background: #F5F6FA; border-left-color: var(--light); }
  .analysis-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .analysis-title { font-size: 13.5px; font-weight: 700; }
  .analysis-result { font-size: 12px; font-weight: 600; }
  .analysis.ok .analysis-result { color: var(--success); }
  .analysis.bad .analysis-result { color: var(--danger); }
  .analysis.neutral .analysis-result { color: var(--muted); }
  .analysis-answer { display: flex; align-items: center; margin-bottom: 6px; }
  .analysis-answer span { font-size: 11.5px; color: var(--muted); margin-right: 7px; }
  .analysis-answer b { font-size: 13px; color: var(--primary); }
  .analysis-text { font-size: 12.5px; line-height: 1.7; color: var(--text-2); white-space: pre-wrap; }
  .analysis-text.empty { color: var(--light); }

  /* ---------- 答题卡 ---------- */
  .sheet-card {
    margin: 0 12px 12px;
    background: var(--white);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow-card);
  }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .sheet-head b { font-size: 14px; }
  .sheet-head span { font-size: 10.5px; color: var(--light); }
  .legend { display: flex; align-items: center; gap: 14px; margin-bottom: 11px; }
  .legend-item { display: flex; align-items: center; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .dot-done { background: var(--primary); }
  .dot-correct { background: var(--success-soft); border: 1px solid rgba(16,185,129,.5); }
  .dot-wrong { background: var(--danger-soft); border: 1px solid rgba(239,68,68,.5); }
  .dot-empty { background: #EEF0F4; }

  .sheet-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .sheet-cell {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
    font-size: 11px; font-weight: 500;
    background: #F3F4F6; color: var(--muted);
    cursor: pointer;
  }
  .sheet-cell.done { background: var(--primary); color: #fff; font-weight: 700; box-shadow: 0 2px 6px rgba(79,70,229,.35); }
  .sheet-cell.correct { background: var(--success-soft); color: var(--success); font-weight: 600; }
  .sheet-cell.wrong { background: var(--danger-soft); color: var(--danger); font-weight: 600; }

  /* ---------- 底部操作栏 ---------- */
  .bottom-bar {
    position: fixed;
    left: 50%; transform: translateX(-50%);
    bottom: 0;
    width: 100%; max-width: 480px;
    display: flex; gap: 8px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
    background: var(--white);
    border-top: 1px solid var(--border-light);
    box-shadow: 0 -3px 10px rgba(17,24,39,.04);
    z-index: 40;
  }
  .tab-actions { bottom: calc(var(--nav-h) + env(safe-area-inset-bottom)); z-index: 45; }
  .btn {
    flex: 1;
    height: 44px; line-height: 44px;
    text-align: center;
    border-radius: 10px;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    transition: all .15s;
  }
  .btn.ghost { background: #F5F6FA; color: var(--text-2); }
  .btn.ghost:active { background: #EBEDF2; }
  .btn.primary {
    flex: 2;
    background: var(--gradient);
    color: #fff; font-size: 15px; font-weight: 600;
    box-shadow: var(--shadow-primary);
  }
  .btn.primary:active { opacity: .9; transform: scale(.99); }

  .quiz-page {
    padding-top: calc(12px + var(--android-statusbar-top) + env(safe-area-inset-top));
    padding-bottom: calc(76px + env(safe-area-inset-bottom));
    min-height: 100vh;
    background: var(--bg);
    touch-action: pan-y;
  }
  /* 吸顶栏滚动时也停留在状态栏下方 */
  .quiz-top {
    top: calc(var(--android-statusbar-top) + env(safe-area-inset-top));
  }

  /* ---------- 弹窗 ---------- */
  .dialog-mask {

。","options":[{"key":"A","text":"空机重量＞250g"},{"key":"B","text":"最大起飞重量≤7kg的视距内运行"},{"key":"C","text":"最大起飞重量≥250g"}],"answer":"C","analysis":"提示：所有≥250\n解析：《民用无人驾驶航空器实名制登记管理规定》适用于在中华人民共和国境内最大起飞重量为250克以上(含250克)的民用无人机。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0010","type":"single","difficulty":1,"stem":"轻型无人机是指（）。","options":[{"key":"A","text":"质量≥7kg且＜116kg"},{"key":"B","text":"质量＞7kg且≤116kg"},{"key":"C","text":"空机质量＞7kg且≤116kg"}],"answer":"C","analysis":"提示：空机质量 微型 轻型 小型 大型 7 116 5700 5700\n解析：根据孙毅主编的《无人机驾驶员航空知识手册》2014版1.2无人机的分类:按尺度分类(民航法规),无人机可分为微型无人机、轻型无人机、小型无人机以及大型无人机。微型无人机,是指空机质量小于等于7kg的无人机。轻型无人机,是指空机质量大于7kg,但小于等于116kg的无人机,且全马力平飞中,校正空速小于100km/h(55nmile/h),升限小3000m。小型无人机,是指空机质量小于等于5700kg的无人机,微型和轻型无人机除外。大型无人机,是指空机质量大于5700kg的无人机。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0011","type":"single","difficulty":1,"stem":"轻型无人机是指（）。","options":[{"key":"A","text":"质量≥7kg，但＜116kg的无人机，且全马力平飞中，校正空速＜100km/h(55nmi/h)，升限＜3000m"},{"key":"B","text":"质量＞7kg，但≤116kg的无人机，且全马力平飞中，校正空速＞100km/h(55nmi/h)，升限＞3000m"},{"key":"C","text":"空机质量＞7kg，但≤116kg的无人机，且全马力平飞中，校正空速＜100km/h(55nmi/h)，升限＜3000m"}],"answer":"C","analysis":"提示：空机质量 微型 轻型 小型 大型 7 116 5700 5700\n解析：根据孙毅主编的《无人机驾驶员航空知识手册》2014版1.2无人机的分类:按尺度分类(民航法规),无人机可分为微型无人机、轻型无人机、小型无人机以及大型无人机。微型无人机,是指空机质量小于等于7kg的无人机。轻型无人机,是指空机质量大于7kg,但小于等于116kg的无人机,且全马力平飞中,校正空速小于100km/h(55nmile/h),升限小3000m。小型无人机,是指空机质量小于等于5700kg的无人机,微型和轻型无人机除外。大型无人机,是指空机质量大于5700kg的无人机。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0012","type":"single","difficulty":1,"stem":"Ⅳ类无人机是指（）。","options":[{"key":"A","text":"0＜空机重量≤1.5kg，7kg＜起飞全重≤25kg"},{"key":"B","text":"15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg"},{"key":"C","text":"1.5kg＜空机重量≤4kg，25kg＜起飞全重≤150kg"}],"answer":"B","analysis":"提示：空机：Ⅰ0; Ⅱ1.5; Ⅲ 4; Ⅳ15; Ⅺ 116; Ⅻ5700 空机关键数：0kg-1.5kg-4kg-15kg-116kg-5700\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类：I类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0013","type":"single","difficulty":1,"stem":"Ⅱ类无人机是指（）。","options":[{"key":"A","text":"1kg＜空机质量≤4kg，2kg＜起飞全重≤7kg"},{"key":"B","text":"1.5kg＜空机质量≤7kg，1.5kg＜起飞全重≤15kg"},{"key":"C","text":"1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg"}],"answer":"C","analysis":"提示：空机：Ⅰ0; Ⅱ1.5; Ⅲ 4; Ⅳ15; Ⅺ 116; Ⅻ5700 空机关键数：0kg-1.5kg-4kg-15kg-116kg-5700\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类：Ⅰ类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0014","type":"single","difficulty":1,"stem":"Ⅻ类无人机是指（）。","options":[{"key":"A","text":"W＞5700KG"},{"key":"B","text":"W≥5700KG"},{"key":"C","text":"W＜5700KG"}],"answer":"A","analysis":"提示：Ⅻ类无人机W＞5700KG\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类：Ⅰ类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0015","type":"single","difficulty":1,"stem":"Ⅺ类无人机是指（）。","options":[{"key":"A","text":"W＞5700KG"},{"key":"B","text":"15KG＜W≤116KG"},{"key":"C","text":"116KG＜W≤5700KG"}],"answer":"C","analysis":"提示：空机：Ⅰ0; Ⅱ1.5; Ⅲ 4; Ⅳ15; Ⅺ 116; Ⅻ5700 空机关键数：0kg-1.5kg-4kg-15kg-116kg-5700\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类：Ⅰ类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0016","type":"single","difficulty":1,"stem":"多旋翼上有几片桨叶（）。","options":[{"key":"A","text":"2"},{"key":"B","text":"3"},{"key":"C","text":"桨叶数目不固定"}],"answer":"C","analysis":"解析：多旋翼上桨叶数量不固定，取决于飞行器的具体设计和配置。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0017","type":"single","difficulty":1,"stem":"民用无人机的空机重量（）。","options":[{"key":"A","text":"不包含载荷的无人机重量"},{"key":"B","text":"不包含载荷、电池和燃料的无人机重量"},{"key":"C","text":"不包含载荷、燃料的无人机重量"}],"answer":"C","analysis":"提示：不包含载荷、燃料\n解析：根据2015年颁布至今仍有效的《轻小无人机运行规定（试行）》3.16：空机重量，是指不包含载荷和燃料的无人机重量，该重量包含燃料容器和电池等固体装置。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0018","type":"single","difficulty":1,"stem":"无人飞艇属于（）无人机。","options":[{"key":"A","text":"Ⅻ类"},{"key":"B","text":"Ⅺ类"},{"key":"C","text":"VI类"}],"answer":"C","analysis":"提示：植保5飞艇6 植保Ⅴ飞艇Ⅵ\n解析：无人飞艇属于VI类无人机。无人机按照不同的分类标准有多种分类方式，其中按飞行平台构型分类时，无人机可分为固定翼无人机、旋翼无人机、无人飞艇、伞翼无人机、扑翼无人机等。无人飞艇作为一种特殊的无人机类型，因其独特的飞行原理和应用场景，被单独划分为一类，即VI类无人机。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0019","type":"single","difficulty":1,"stem":"无人机英文缩写（）。","options":[{"key":"A","text":"UVS"},{"key":"B","text":"UAS"},{"key":"C","text":"UAV/UA"}],"answer":"C","analysis":"提示：无人机UAV/UA 无人机系统UAS\n解析：· 小蓝书里，对无人机的表述为： 无人驾驶航空器(UA一Unmanned Aircraft)， 是一架由遥控站管理(包括远程操纵或自主飞行)的航空器，· CAAC民航局系统，对无人机的术语和定义为： 无人驾驶航空器 unmanned aerial vehicle （UAV） 由控制站管理（包括远程操纵或自主飞行）的航空器。 注：也称为远程驾驶航空器或无人机。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0020","type":"single","difficulty":1,"stem":"无人机系统的英文缩写是（）。","options":[{"key":"A","text":"UVS"},{"key":"B","text":"UAS"},{"key":"C","text":"UAV"}],"answer":"B","analysis":"提示：无人机UAV/UA 无人机系统UAS\n解析：无人机系统的英文缩写是UAS，全称为Unmanned Aircraft System，也称无人驾驶航空器系统。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0021","type":"single","difficulty":1,"stem":"植保机属于（）无人机。","options":[{"key":"A","text":"Ⅲ类"},{"key":"B","text":"Ⅴ类"},{"key":"C","text":"Ⅻ类"}],"answer":"B","analysis":"提示：植保5飞艇6 植保Ⅴ飞艇Ⅵ\n解析：根据CAAC官网2018年颁布至今仍有效的《民用无人机驾驶员管理规定》5.1.A.C）：Ⅴ 植保类无人机","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0022","type":"single","difficulty":1,"stem":"（）航空器平台结构通常包括机翼、机身、尾翼和起落架等。","options":[{"key":"A","text":"单旋翼"},{"key":"B","text":"多旋翼"},{"key":"C","text":"固定翼"}],"answer":"C","analysis":"提示：固定翼有尾翼\n解析：固定翼航空器平台结构通常包括机翼、机身和起落架等。机翼是固定翼航空器产生升力的主要部件。机身是固定翼航空器的主要承载结构，负责装载人员、货物、设备、燃料和武器等。尾翼包括水平尾翼(稳定面)和垂直尾翼(方向舵)。水平尾翼通过产生向下的升力来平衡机翼产生的升力，保持航空器的俯仰稳定;垂直尾翼则通过产生侧向力来控制航空器的航向。起落架是固定翼航空器用于地面滑行、起飞、降落及停放的装置。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0023","type":"single","difficulty":1,"stem":"Ⅱ类无人机是指（）。","options":[{"key":"A","text":"1.5公斤<空机质量≤7kg，1.5公斤<起飞全重≤15kg"},{"key":"B","text":"1.5公斤<空机质量≤4kg，1.5公斤<起飞全重≤7kg，超视距运行的"},{"key":"C","text":"1.5公斤<空机质量≤4kg，1.5公斤<起飞全重≤7kg，视距内运行的"}],"answer":"C","analysis":"提示：视距内\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类： I类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0024","type":"single","difficulty":1,"stem":"微型无人机是指（）。","options":[{"key":"A","text":"空机质量小于等于7千克的无人机"},{"key":"B","text":"质量小于7千克的无人机"},{"key":"C","text":"质量小于等于7千克的无人机"}],"answer":"A","analysis":"提示：空机质量 微型 轻型 小型 大型 7（≤） 116 5700 5700\n解析：根据孙毅主编的《无人机驾驶员航空知识手册》2014版1.2无人机的分类:按尺度分类(民航法规),无人机可分为微型无人机、轻型无人机、小型无人机以及大型无人机。 微型无人机,是指空机质量小于等于7kg的无人机。轻型无人机,是指空机质量大于7kg,但小于等于116kg的无人机,且全马力平飞中,校正 空速小于100km/h(55nmile/h),升限小3000m。小型无人机,是指空机质量小于等于5700kg的无人机,微型和轻型无人机除外。大型无人机,是指空机质量大于5700kg的无人机。","tags":[],"chapter":"概况","bankId":"uav-theory"},{"id":"thc-0025","type":"single","difficulty":1,"stem":"下列情况下，无人机系统驾驶员由局方实施管理？","options":[{"key":"A","text":"在融合空域运行的Ⅲ无人机"},{"key":"B","text":"在融合空域运行的Ⅺ型无人机"},{"key":"C","text":"在隔离空域内超视距运行的无人机"}],"answer":"B","analysis":"提示：协会：隔离超视距 局方：融合X以上\n解析：根据《民用无人机驾驶员管理规定》规定，下列情况下，无人机驾驶员由行业协会实施管理，局方飞行标准部门可以实施监督:A.在隔离空域内运行的除Ⅰ、Ⅱ类以外的无人机;B.在融合空域内运行的Ⅲ、IV、V、VI类无人机。(3)在融合空域运行的Ⅺ、 Ⅻ类无人机，其驾驶员由局方实施管理。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0026","type":"single","difficulty":1,"stem":"在融合空域3000米以下运行的Ⅺ级别无人机驾驶员，应至少持有飞机或直升机等级的（）。","options":[{"key":"A","text":"商照"},{"key":"B","text":"航线运输执照"},{"key":"C","text":"运动或私用驾驶员执照"}],"answer":"C","analysis":"提示：问题对应答案，驾驶员对驾驶员 私照3000以下\n解析：根据《民用无人机驾驶员管理规定》2016版，7 局方对无人机系统驾驶员的管理（1）执照要求：A．在融合空域3,000米以下运行的Ⅺ类无人机驾驶员，应至少持有运动或私用驾驶员执照，并带有相似的类别等级（如适用）；B．在融合空域3,000 米以上运行的Ⅺ类无人机驾驶员，应至少持有带有飞机或直升机等级的商用驾驶员执照；C．在融合空域运行的Ⅻ类无人机驾驶员，应至少持有带有飞机或直升机等级的商用驾驶员执照和仪表等级；D．在融合空域运行的Ⅻ类无人机机长，应至少持有航、线运输驾驶员执照。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0027","type":"single","difficulty":1,"stem":"在融合空域3000米以上运行的Ⅺ级别无人机驾驶员，应至少持有飞机或直升机等级的（）。","options":[{"key":"A","text":"航线运输执照"},{"key":"B","text":"商照"},{"key":"C","text":"私照"}],"answer":"B","analysis":"提示：商照3000以上\n解析：根据《民用无人机驾驶员管理规定》2016版，7 局方对无人机系统驾驶员的管理（1）执照要求：A．在融合空域3,000米以下运行的Ⅺ类无人机驾驶员，应至少持有运动或私用驾驶员执照，并带有相似的类别等级（如适用）；B．在融合空域3,000 米以上运行的Ⅺ类无人机驾驶员，应至少持有带有飞机或直升机等级的商用驾驶员执照；C．在融合空域运行的Ⅻ类无人机驾驶员，应至少持有带有飞机或直升机等级的商用驾驶员执照和仪表等级；D．在融合空域运行的Ⅻ类无人机机长，应至少持有航、线运输驾驶员执照。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0028","type":"single","difficulty":1,"stem":"农业作业飞行的最低天气标准，平原地区是（）。","options":[{"key":"A","text":"云高不低于200米，能见度不小于5公里"},{"key":"B","text":"云高不低于150米，能见度不小于5公里"},{"key":"C","text":"云高不低于100米，能见度不小于3公里"}],"answer":"B","analysis":"提示：平原150 渔200 山300\n解析：根据旧规《中国民用航空飞行规则》第１２７条 作业飞行的最低天气标准：（一）平原地区： 云高不低于１５０米，能见度不小于５公里，直升机不小于３公里；","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0029","type":"single","difficulty":1,"stem":"对于民用无人机试验飞行，以下正确的是（）。","options":[{"key":"A","text":"试验飞行可经批准于人口稠密区、集镇或居住区的上空或者任何露天公众集会上空进行"},{"key":"B","text":"禁止无人机在未获得特殊批准下试验飞行"},{"key":"C","text":"应在空中交通不繁忙的开阔水面或人口稀少区域上空实施"}],"answer":"C","analysis":"提示：开阔水面人口稀少\n解析：根据旧版《一般运行和飞行规则》第91.203条飞行试验区域：航空器试验飞行应当在空中交通不繁忙的开阔水面或人口稀少区域上空实施。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0030","type":"single","difficulty":1,"stem":"在广阔水域上空进行各种渔业飞行的最低天气标准（）。","options":[{"key":"A","text":"云高不得低于200米，水平能见度不得小于3公里"},{"key":"B","text":"云高不得低于150米，水平能见度不得小于3公里"},{"key":"C","text":"云高不得低于100米，水平能见度不得小于2公里"}],"answer":"A","analysis":"提示：平原150 渔200 山300\n解析：根据旧规《中国民用航空飞行规则》第１4 0 条 在广阔水域上空进行各种渔业飞行的最低天气标准：云高不得低于２００米，水平能见度不得小于５公里（直升机不得小于２公里）。（考题给出的200米 3公里选项虽然与旧规200米5公里不符， 综合考虑选200米得分）","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0031","type":"single","difficulty":1,"stem":"在下列哪种情况下民用航空器可以飞越城市上空？","options":[{"key":"A","text":"能见地标的目视飞行时"},{"key":"B","text":"指定的航路必需飞越城市上空时"},{"key":"C","text":"夜间飞行时"}],"answer":"B","analysis":"提示：1指定才能 2问题对答案，上空对上空\n解析：根据《中华人民共和国民用航空法》第七章 空中航行 第二节 飞行管理 第七十九条： 民用航空器不得飞越城市上空；但是，有下列情形之一的除外：（一）起飞、降落或者指定的航路所必需的；（二）飞行高度足以使该航空器在发生紧急情况时离开城市上空，而不致危及地面上的人员、财产安全的；（三）按照国家规定的程序获得批准的。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0032","type":"single","difficulty":1,"stem":"为了安全，飞机飞行时常开什么灯？","options":[{"key":"A","text":"航行灯"},{"key":"B","text":"防撞灯"},{"key":"C","text":"着陆灯"}],"answer":"A","analysis":"提示：这题与防撞灯容易混淆。常开 是航行灯，强调不分白天晚上一定要开的是防撞灯。\n解析：航行灯是飞机在夜间或能见度不良的条件下飞行时，为了标明其位置和飞行方向而开启的灯光。根据国际民航组织的规定飞机在飞行时必须开启航行灯，以确保其他飞行器或地面观察人员能够清晰地看到飞机的位置和动态。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0033","type":"single","difficulty":1,"stem":"飞行的安全高度是避免航空器与地面障碍物相撞的（）。","options":[{"key":"A","text":"最低飞行高度"},{"key":"B","text":"最低飞行安全高度"},{"key":"C","text":"航图网格最低飞行高度"}],"answer":"A","analysis":"提示：安全高度即最低飞行高度\n解析：依据《中华人民共和国飞行基本规则》第八十二条： 飞行的安全高度是避免航空器与地面障碍物相撞的最低飞行高度。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0034","type":"single","difficulty":1,"stem":"空域是航空器运行的环境，也是宝贵的国家资源。国务院、中央军委十分重视我国民用航空交通管制的建设工作，目前正在推进空域管理改革，预计划分三类空域，为（）。","options":[{"key":"A","text":"管制空域、监视空域和报告空域"},{"key":"B","text":"管制空域、非管制空域和特殊空域"},{"key":"C","text":"管制空域、非管制空域和报告空域"}],"answer":"A","analysis":"提示：管制、监视、报告\n解析：空域划分为三类，分别为管制空域、监视空域和报告空域。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0035","type":"single","difficulty":1,"stem":"空中交通管制单位为飞行中的民用航空器提供的空中交通服务中含有（）。","options":[{"key":"A","text":"飞行情报服务"},{"key":"B","text":"机场保障服务"},{"key":"C","text":"导航服务"}],"answer":"A","analysis":"提示：提供情报服务\n解析：《民用航空空中交通管理规则》第五条:空中交通服务包括空中交通管制服务、飞行情报服务和告警服务（管制、情报、告警）。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0036","type":"single","difficulty":1,"stem":"高空空域是指标准海平面气压多少米（不含）以上的空域？","options":[{"key":"A","text":"7000米"},{"key":"B","text":"8000米"},{"key":"C","text":"6000米"}],"answer":"C","analysis":"提示：6000米（这题与飞行高度不同，考察的是空域问题。高空飞行≠高空空域）\n解析：根据最新发布的《国家空域基础分类方法》以及《一般运行和飞行规则》等权威文件，高空空域是指标准海平面气压6000米（不含）以上的空域。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0037","type":"single","difficulty":1,"stem":"下面哪个单位领导全国的飞行管制工作（）。","options":[{"key":"A","text":"民航局"},{"key":"B","text":"国务院"},{"key":"C","text":"国务院、中央军委空中交通管制委员会"}],"answer":"C","analysis":"提示：全国=国+央（除了进出国家领空归空军管，其他有国务院+中央军委，就选国+央）\n解析：《中华人民共和国飞行基本规则》第四条国务院、中央军事委员会空中交通管制委员会领导全国的飞行管制工作。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0038","type":"single","difficulty":1,"stem":"关于“飞行管理”不正确的是（）。","options":[{"key":"A","text":"在一个划定的管制空域内，可由两个空中交通管制单位负责空中交通管制"},{"key":"B","text":"民用航空器未经批准不得飞出中华人民共和国领空"},{"key":"C","text":"通常情况下，民用航空器不得飞入禁区和限制区"}],"answer":"A","analysis":"提示：一空一负责\n解析：通常情况下，一个划定的管制空域内应由一个空中交通管制单位负责空中交通管制以确保管制的一致性和有效性。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0039","type":"single","difficulty":1,"stem":"在管制机场附近的所有航空器，以及在地面的航空器都服从（）的指令。","options":[{"key":"A","text":"机长"},{"key":"B","text":"机务人员"},{"key":"C","text":"管制员"}],"answer":"C","analysis":"提示：问题对答案，管制对管制员。问题对答案，管制对管制员。题目有前置条件-在管制机场附近，注意“都”字，各自航空器听各自机长的，所有机长都得听管制员的。\n解析：《民用航空空中交通管理规则》第九条航空器在管制区域内的空中交通活动应当接受空中交通管制单位提供的空中交通管制服务，并遵守空中交通管制员(以下简称管制员)的指令和许可。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0040","type":"single","difficulty":1,"stem":"民用无人机视距内运行是指航空器处于驾驶员或观测员目视视距内半径（）米，人机相对高度低于（）米的区域内。","options":[{"key":"A","text":"100、50"},{"key":"B","text":"120、500"},{"key":"C","text":"500、120"}],"answer":"C","analysis":"提示：半径500m，高度120m\n解析：《民用无人机驾驶员管理规定》规定，视距内(VLOS:Visual Line of Sight)运行，无人机在驾驶员或观测员与无人机保持直接目视视觉接触的范围内运行，且该范围为目视视距内半径不大于500米，人机相对高度不大于120米。在本规定中作为驾驶员等级中的一种。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0041","type":"single","difficulty":1,"stem":"民用航空器因故确需偏离指定的航路或者改变飞行高度飞行时，应当首先（）。","options":[{"key":"A","text":"取得机组的一致同意"},{"key":"B","text":"取得空中交通管制单位的许可"},{"key":"C","text":"得到机长的允许"}],"answer":"B","analysis":"提示：单位（民用航空器不能随便改变航路。想改变必须得到相关单位认可）\n解析：《中华人民共和国民用航空法》第七十五条:民用航空器应当按照空中交通管制单位指定的航路和飞行高度飞行;因故确需偏离指定的航路或者改变飞行高度飞行的应当取得空中交通管制单位的许可。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0042","type":"single","difficulty":1,"stem":"航空器与ATC进行第一次无线电联络时,应当首先呼叫（）。","options":[{"key":"A","text":"航空器的注册号"},{"key":"B","text":"航空器的机型"},{"key":"C","text":"所需联系的ATC的名称"}],"answer":"C","analysis":"提示：问题对应答案， ATC对应ATC\n解析：航空器与ATC(空中交通管制)进行第一次无线电联络时，应首先呼叫所需联系的ATC的名称，以建立通信联系并确保后续通信的准确性和有效性。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0043","type":"single","difficulty":1,"stem":"空域管理的具体办法由（）制定。","options":[{"key":"A","text":"民用航空局"},{"key":"B","text":"中央军事委员会"},{"key":"C","text":"国务院和中央军事委员会"}],"answer":"C","analysis":"提示：具体--国+央（除了进出国家领空归空军管，其他有国务院+中央军委，就选国+央）\n解析：《中华人民共和国民用航空法》第七十二条:空域管理的具体办法，由国务院、中央军事委员会制定。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0044","type":"single","difficulty":1,"stem":"在一个划定的管制空域内，由（）负责该空域内的航空器的空中交通管制。","options":[{"key":"A","text":"军航或民航的一个空中交通管制单位"},{"key":"B","text":"军航和民航的各一个空中交通管制单位"},{"key":"C","text":"军航的一个空中交通管制单位"}],"answer":"A","analysis":"提示：或，谁都行就一个\n解析：本题关注的是管制空域内的空中交通管制责任。在一个划定的管制空域内，为了保障飞行安全和秩序，需要有一个统一的空中交通管制单位来负责。这个单位可以是军航或民航的一个空中交通管制单位。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0045","type":"single","difficulty":1,"stem":"《中国民用航空法》的颁布目的: ①为了维护国家的领空主权和民用航空权利; ②保障民用航空活动安全和有秩序地进行; ③保护民用航空活动当事人各方的合法权益 ④促进民用航空事业的发展","options":[{"key":"A","text":"③④"},{"key":"B","text":"①②"},{"key":"C","text":"①②③④"}],"answer":"C","analysis":"提示：①②③④全选\n解析：四项均为立法目的","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0046","type":"single","difficulty":1,"stem":"空域通常划分为①机场飞行空域②航路航线③空中禁区，空中限制区和空中危险区","options":[{"key":"A","text":"①③"},{"key":"B","text":"①②③"},{"key":"C","text":"①②"}],"answer":"B","analysis":"提示：①②③全选\n解析：根据2007年修改的《中华人民共和国飞行基本规则》第二章 空域管理 第十二条:空域通常划分为机场飞行空域、航路、航线、空中禁区、空中限制区和空中危险区等。空域管理和飞行任务需要的，可以划设空中走廊、空中放油区和临时飞行空域。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0047","type":"single","difficulty":1,"stem":"在丘陵、山区、高原进行农业作业飞行的最低天气标准是（）。","options":[{"key":"A","text":"云高距作业区最高点不低于200米，能见度不小于5公里"},{"key":"B","text":"云高距作业区最高点不低于300米，能见度不小于5公里"},{"key":"C","text":"云高距作业区最高点不低于150米，能见度不小于3公里"}],"answer":"B","analysis":"提示：平原150 渔200 山300\n解析：根据旧规《中国民用航空飞行规则》第１２７条 作业飞行的最低天气标准：（一）平原地区： 云高不低于１５０米，能见度不小于５公里，直升机不小于３公里；（二）丘陵、山区（高原）： 云高距作业区的最高点不低于３００米，能见度不小于５公里，无连续性颠簸、下降气流；","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0048","type":"single","difficulty":1,"stem":"无识别标志的航空器因特殊情况需要飞行的（）。","options":[{"key":"A","text":"必须经中国人民解放军空军批准"},{"key":"B","text":"必须经相关管制单位批准"},{"key":"C","text":"必须经中国民用航空总局空中交通管理局批准"}],"answer":"A","analysis":"提示：无识别标志，需空军批准\n解析：《中华人民共和国飞行基本规则》第四十一条:在中华人民共和国领空飞行的航空器，必须标明明显的识别标志，禁止无识别标志的航空器飞行。无识别标志的航空器因特殊情况需要飞行的，必须经中国人民解放军空军批准。航空器的识别标志必须按照国家有关规定获得批准。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0049","type":"single","difficulty":1,"stem":"在融合空域运行的Ⅻ级别无人机驾驶员，应至少持有带有飞机或直升机等级的（）。","options":[{"key":"A","text":"商照"},{"key":"B","text":"私照"},{"key":"C","text":"商照和仪表等级"}],"answer":"C","analysis":"提示：12级驾驶员：商+仪\n解析：根据《民用无人机驾驶员管理规定》2016版，7 局方对无人机系统驾驶员的管理（1）执照要求：A．在融合空域3,000米以下运行的Ⅺ类无人机驾驶员，应至少持有运动或私用驾驶员执照，并带有相似的类别等级（如适用）；B．在融合空域3,000 米以上运行的Ⅺ类无人机驾驶员，应至少持有带有飞机或直升机等级的商用驾驶员执照；C．在融合空域运行的Ⅻ类无人机驾驶员，应至少持有带有飞机或直升机等级的商用驾驶员执照和仪表等级；D．在融合空域运行的Ⅻ类无人机机长，应至少持有航、线运输驾驶员执照。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0050","type":"single","difficulty":1,"stem":"除等待空域外，一个飞行空域，在同一个时间内，只允许安排（）航空器飞行。各批航空器飞行活动的高度范围之间，通常应当保持（）以上的高度差。","options":[{"key":"A","text":"一至三批，2000米"},{"key":"B","text":"一至两批，2000米"},{"key":"C","text":"一至两批，1000米"}],"answer":"A","analysis":"提示：1-3，2000\n解析：飞行空域的管理和使用规定通常要求，在同一个时间内，一个飞行空域内只允许安排有限数量的航空器飞行，以确保飞行安全和空域的有效利用。一至三批的航空器数量是一个常见的限制，同时为了保持飞行安全，各批航空器之间需要保持一定的高度差，通常是2000米以上。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0051","type":"single","difficulty":1,"stem":"穿越航路和航线的飞行，应当明确（）穿越时还应当保证与航路和航线飞行的航空器有规定的飞行间隔。","options":[{"key":"A","text":"穿越的地段、高度和时间"},{"key":"B","text":"穿越的地段、方法、高度和时间"},{"key":"C","text":"穿越的地段、进出点、高度和时间"}],"answer":"A","analysis":"提示：地时高（地势高）\n解析：《中华人民共和国飞行基本规则》第六十六条:穿越航路和航线的飞行，应当明确穿越的地段、高度和时间，穿越时还应当保证与航路和航线飞行的航空器有规定的飞行间隔。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0052","type":"single","difficulty":1,"stem":"等待空域的最低高度层，距地面最高障碍物的真实高度不得小于（）。","options":[{"key":"A","text":"300米"},{"key":"B","text":"600米"},{"key":"C","text":"平原地区不小于300米，丘陵山区不小于600米"}],"answer":"B","analysis":"提示：等待600米\n解析：等待空域是为了让航空器在等待进近或进行其他飞行活动时暂时停留的空域。根据规定，等待空域的最低高度层距离地面障碍物的真实高度不得小于600米。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0053","type":"single","difficulty":1,"stem":"对于备降的航空器，空中交通管制员，飞行指挥员或者航空公司签派员及其代理人，应当立即通知备降机场准备接受航空器降落，同时指示航空器（）。","options":[{"key":"A","text":"飞往备降机场的航向和通知备降机场的天气情况"},{"key":"B","text":"飞往备降机场的航向，飞行高度和通知备降机场的天气情况"},{"key":"C","text":"飞行备降机场的航向，飞行高度，油量和通知备降机场的天气情况"}],"answer":"B","analysis":"提示：航向高度天气（航高天无油）\n解析：备降时，需全面指示航空器，包括航向、飞行高度，并通知备降机场的天气情况，以确保安全降落。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0054","type":"single","difficulty":1,"stem":"对于空中走廊的宽度，下列说法正确的是?( )","options":[{"key":"A","text":"通常为8公里，受条件限制时宽度不小于5公里"},{"key":"B","text":"通常为10公里，受条件限制时宽度不小于8公里"},{"key":"C","text":"通常为15公里，受条件限制时宽度不小于10公里"}],"answer":"B","analysis":"提示：航路 20 走廊 10 最低8 边界10\n解析：空中走廊宽度通常为10公里，确保飞行安全;受条件限制时，宽度不小于8公里，以维持必要的飞行间隔。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0055","type":"single","difficulty":1,"stem":"飞行高度层应当根据（）计算。","options":[{"key":"A","text":"标准大气压条件下平均平面"},{"key":"B","text":"标准大气压条件下假定海平面"},{"key":"C","text":"实际大气压条件下假定海平面"}],"answer":"B","analysis":"提示：标假\n解析：根据2022年1月4日交通运输部令2022年第3号公布的《一般运行和飞行规则》第 91.367 条 按仪表飞行规则运行的最低高度(3)：飞行高度层根据标准大气压条件下假定海平面计算。真航线角从航线起点和转弯点量取。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0056","type":"single","difficulty":1,"stem":"飞行高度层应当根据（）配备。","options":[{"key":"A","text":"航线或航路走向、航空器性能、飞行区域以及航线的地形、天气和飞行情 况等"},{"key":"B","text":"飞行任务的性质、航空器等级、飞行区域以及航线的地形、天气和飞行情 况等"},{"key":"C","text":"飞行任务的性质、航空器性能、飞行区域以及航线的地形、天气和飞行情 况等"}],"answer":"C","analysis":"提示：性质性能\n解析：飞行高度层的配备需综合考虑飞行任务的性质、航空器性能、飞行区域以及航线的地形、天气和飞行情况等因素，以确保飞行的安全和效率。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0057","type":"single","difficulty":1,"stem":"飞行人员（），必须同空中交通管制员或者飞行指挥员保持无线电通信联络，并且严格遵守通信纪律。","options":[{"key":"A","text":"在整个起飞阶段"},{"key":"B","text":"自起飞开车起到着陆后关车止"},{"key":"C","text":"进入驾驶舱后到飞行结束离开驾驶舱"}],"answer":"B","analysis":"提示：开车关车\n解析：飞行人员在整个飞行过程中，从起飞开车起到着陆后关车止，都必须与空中交通管制员或飞行指挥员保持无线电通信联络，以确保飞行安全，并严格遵守通信纪律。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0058","type":"single","difficulty":1,"stem":"飞行申请的内容包括（）。","options":[{"key":"A","text":"任务性质、航空器型别、装载情况飞行范围、起止时间、飞行高度和飞行条件"},{"key":"B","text":"任务性质、航空器型别、飞行范围起止时间、飞行高度和飞行条件"},{"key":"C","text":"任务性质、航空器型别、装载情况、起止时间、飞行高度和飞行条件"}],"answer":"B","analysis":"提示：三飞，不装载\n解析：装载情况一般不是飞行申请中的必要内容主要是因为装载情况通常在任务性质和航空器型别等方面有所体现，并且对于飞行安全和空中交通管制的直接影响相对较小。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0059","type":"single","difficulty":1,"stem":"关于民用航空器使用禁区的规定是（）。","options":[{"key":"A","text":"绝对不得飞入"},{"key":"B","text":"符合目视气象条件方可飞入"},{"key":"C","text":"按照国家规定经批准后方可飞入"}],"answer":"C","analysis":"提示：1 有绝对就错了 2 禁区批准飞，危险区找时间段\n解析：关于民用航空器使用禁区的规定，按照国家规定经批准后方可飞入。这意味着在符合特定条件和获得相应批准的情况下，民用航空器是可以飞入禁区的。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0060","type":"single","difficulty":1,"stem":"航空器飞离机场加入航路、航线和脱离航路、航线飞向机场，应当（）规定的航线和高度上升或者下降。","options":[{"key":"A","text":"按照该机场使用细则"},{"key":"B","text":"公布的进离场程序"},{"key":"C","text":"按照该机场使用细则或者进离场程序"}],"answer":"C","analysis":"提示：细则+程序，两个综合就是正确答案。\n解析：航空器飞离机场加入航路、航线和脱离航路、航线飞向机场时，应当按照该机场使用细则或者进离场程序规定的航线和高度上升或者下降。这确保了航空器在进出机场时的安全和有序。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0061","type":"single","difficulty":1,"stem":"航空器进行空域飞行时，应当按照规定的（）进入空域或者脱离空域，并且保持在规定的空域和高度范围内飞行。","options":[{"key":"A","text":"航线(航向)、高度、次序和进出点"},{"key":"B","text":"航线(航向)、高度、次序"},{"key":"C","text":"航线(航向)、高度"}],"answer":"B","analysis":"提示：只要次序\n解析：航空器进行空域飞行时，需要按照规定的航线(航向)、高度、次序进入空域或者脱离空域，并且保持在规定的空域和高度范围内飞行。这确保了空域使用的有序性和安全性。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0062","type":"single","difficulty":1,"stem":"航空器可否飞入空中危险区或临时空中危险区?","options":[{"key":"A","text":"不行"},{"key":"B","text":"可以，但必须得到相关部门的批准"},{"key":"C","text":"可以，但必须在规定时限以外"}],"answer":"C","analysis":"提示：禁区批准后可飞，危险区找时间段\n解析：《中华人民共和国飞行基本规则》第十九条:位于机场、航路、航线附近的对空射击场或者发射场等，根据其射向、射高、范围，可以在上空划设空中危险区或者临时空中危险区。在规定时限内，禁止无关航空器飞入空中危险区或者临时空中危险区。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0063","type":"single","difficulty":1,"stem":"航空器使用航路和航线，应当经（）同意。","options":[{"key":"A","text":"负责该航路和航线的飞行管制部门"},{"key":"B","text":"空中交通管理局下属的区域管制部门"},{"key":"C","text":"中国人民解放军空军"}],"answer":"A","analysis":"提示：问题对应答案， 问航路航线，回答航路航线\n解析：航空器使用航路和航线时，必须经过负责该航路和航线的飞行管制部门的同意。这是为了确保航路和航线的有序使用，以及飞行活动的安全和高效进行。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0064","type":"single","difficulty":1,"stem":"航路，航线地带和民用机场区域设置（）。","options":[{"key":"A","text":"高空管制区，中低空管制区，机场塔台管制区"},{"key":"B","text":"航路管制区，终端(进近)管制区，机场塔台管制区"},{"key":"C","text":"高空管制区，中低空管制区，终端(进近)管制区，机场塔台管制区"}],"answer":"C","analysis":"提示：4区1端\n解析：根据2004年颁布至今仍有效的《民用航空使用空域办法》第九条： 航路、航线地带和民用机场区域设置高空管制区、中低空管制区、终端（进近）管制区和机场塔台管制区。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0065","type":"single","difficulty":1,"stem":"航路的宽度为（）。","options":[{"key":"A","text":"10公里"},{"key":"B","text":"20公里"},{"key":"C","text":"25公里"}],"answer":"B","analysis":"提示：航路 20 走廊 10 最低8 边界10\n解析：《民用航空空中交通管理规则》第九十七条:空中交通管制航路的宽度为20公里其中心线两侧各10公里;航路的某一段受到条件限制的，可以减少宽度，但不得小于8公里;在航路方向改变时，航路宽度则包括航路段边界线延长至相交点所包围的空域。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0066","type":"single","difficulty":1,"stem":"航路的某一段受到条件限制时，可以减小宽度，但不得小于（）。","options":[{"key":"A","text":"8公里"},{"key":"B","text":"10公里"},{"key":"C","text":"15公里"}],"answer":"A","analysis":"提示：航路 20 走廊 10 最低8 边界10\n解析：根据2017年颁布，目前仍然处于有效期的《民用航空空中交通管理规则》第五次修订版本第九十七条:空中交通管制航路的宽度为20公里其中心线两侧各10公里;航路的某一段受到条件限制的，可以减少宽度，但不得小于8公里。 8 公里是这种受限情况下的最小安全宽度。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0067","type":"single","difficulty":1,"stem":"获准飞出或者飞入中华人民共和国领空的航空器，实施飞出或者飞入中华人民共和国领空的飞行和各飞行管制区间的飞行（）。","options":[{"key":"A","text":"必须经相关管制单位批准"},{"key":"B","text":"必须经中国人民解放军空军批准"},{"key":"C","text":"必须经由国务院、中央军委空中交通管制委员会批准"}],"answer":"B","analysis":"提示：境内飞行管制，选空军 飞进飞出国家领空，选空军\n解析：《中华人民共和国飞行基本规则》第三十五条:所有飞行必须预先提出申请，经批准后方可实施。获准飞出或者飞入中华人民共和国领空的航空器，实施飞出或者飞入中华人民共和国领空的飞行和各飞行管制区间的飞行，必须经中国人民解放军空军批准;飞行管制区内飞行管制分区间的飞行，经负责该管制区飞行管制的部门批准;飞行管制分区内的飞行，经负责该分区飞行管制的部门批准。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0068","type":"single","difficulty":1,"stem":"民用航空器在管制空域内飞行,（）。","options":[{"key":"A","text":"可以自由飞行"},{"key":"B","text":"可以按VF自由飞行"},{"key":"C","text":"必须取得空中交通管制单位的许可"}],"answer":"C","analysis":"提示：管制空域-单位，无自由\n解析：《中华人民共和国民用航空法》第七十四条:民用航空器在管制空域内进行飞行活动，应当取得空中交通管制单位的许可。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0069","type":"single","difficulty":1,"stem":"机场区域的界线通常与（）的界线相同。","options":[{"key":"A","text":"区域低空管制区"},{"key":"B","text":"机场进近管制区"},{"key":"C","text":"机场飞行(塔台)管制区"}],"answer":"C","analysis":"提示：机场区域-塔台\n解析：《中华人民共和国飞行基本规则》第四十三条:机场区域的界线通常与机场飞行(塔台)管制区的界线相同","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0070","type":"single","difficulty":1,"stem":"空中交通管制员或者飞行指挥员允许航空器飞入机场区域时，应当及时向飞行员通报（）。","options":[{"key":"A","text":"机场区域内有关的飞行情况、气象条件"},{"key":"B","text":"进入的飞行高度、机场区域内有关的飞行情况、气象条件"},{"key":"C","text":"进入的飞行高度、气象条件"}],"answer":"B","analysis":"提示：高度、飞行情况、气象条件都有（其余两个加起来就是正确答案）\n解析：《中华人民共和国飞行基本规则》第五十八条，复杂气象条件下进入机场区域的飞行，必须经空中交通管制员或者飞行指挥员许可。空中交通管制员或者飞行指挥员允许航空器飞入机场区域时，应当及时向飞行员通报下列情况:(一)进入的飞行高度: (二)机场区域内有关的飞行情况; (三)水平能见度或者跑道视程、天气现象和机场上空的云底高度，地面和穿云高度上的风向、风速，场面气压或者修正海平面气压，或者零点高度，以及地面大气温度; (四)仪表进场或者穿云方法和着陆航向。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0071","type":"single","difficulty":1,"stem":"申请飞行计划通常应当于飞行前一日什么时间向空中交通管制部门提出申请，并通知有关单位?","options":[{"key":"A","text":"15时前"},{"key":"B","text":"16时前"},{"key":"C","text":"17时前"}],"answer":"A","analysis":"提示：15申请，21回复\n解析：《通用航空飞行管制条例》第十六条:飞行计划申请应当在拟飞行前1天15时前提出;飞行管制部门应当在拟飞行前1天21时前作出批准或者不予批准的决定，并通知申请人。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0072","type":"single","difficulty":1,"stem":"我国管制空域包括A\\B\\C\\D四类空中交通服务空域。每一个空域都是一个划定范围的三维空间，其中（）空域是中、低空管制空域，为6000m(含)以下至最低高度层以上空间。","options":[{"key":"A","text":"A类"},{"key":"B","text":"B类"},{"key":"C","text":"C类"}],"answer":"B","analysis":"提示：A高B中低，C近D塔台\n解析：B类空域为中低空管制空域。在中国境内6000米(不含)以下最低高度层以上的空间划分为若干个中低空管制空域。B类空域接受IFR飞行(仪表飞行)和VFR飞行(目视飞行)，并对此在其中飞行的航空器提供空中交通管制。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0073","type":"single","difficulty":1,"stem":"相邻机场距离过近的（）。","options":[{"key":"A","text":"可以合划一个机场区域"},{"key":"B","text":"不能合划一个区域"},{"key":"C","text":"不能在其他空划定机场区域"}],"answer":"A","analysis":"提示：距离过近就合一\n解析：《中华人民共和国飞行基本规则》第四十三条:机场区域是指机场和为该机场划定的一定范围的设置各种飞行空域的空间。机场区域应当根据机场周围的地形，使用该机场的航空器的型别和任务性质，邻近机场的位置和跑道方向，机场附近的国(边)境、空中禁区、对空射击场或者发射场、航路和空中走廊的位置，以及公众利益和安全保障等因素划定。相邻机场距离过近的，可以合划一个机场区域。 机场区域的界线通常与机场飞行(塔台)管制区的界线相同。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0074","type":"single","difficulty":1,"stem":"沿（）应当设有备降机场。","options":[{"key":"A","text":"国际，国内干线航路和固定航线"},{"key":"B","text":"国际航路和固定航线"},{"key":"C","text":"航路和固定航线"}],"answer":"C","analysis":"提示：航路固定航线\n解析：根据2007年10月18日《国务院、中央军委关于修改〈中华人民共和国飞行基本规则〉的决定》第二次修订）的版本，第六十五条:航路和固定航线地带应当设置必要的监视和导航设备。沿航路和固定航线应当有备降机场。备降机场应当有必备的设备和良好的通信、导航、气象保障。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0075","type":"single","difficulty":1,"stem":"仪表(云中)飞行空域的边界距离航路，空中走廊以及其他空域的边界，不得小于（）。","options":[{"key":"A","text":"5公里"},{"key":"B","text":"10公里"},{"key":"C","text":"15公里"}],"answer":"B","analysis":"提示：航路 20 走廊 10 最低8 边界10\n解析：《中华人民共和国飞行基本规则》第十四条:机场飞行空域应当划设在航路和空中走廊以外。仪表(云中)飞行空域的边界距离航路、空中走廊以及其他空域的边界均不得小于10公里。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0076","type":"single","difficulty":1,"stem":"在中华人民共和国境内，按照飞行管制责任划分为（）。","options":[{"key":"A","text":"飞行管制区、飞行管制分区、机场飞行管制区"},{"key":"B","text":"飞行管制区、飞行情报区、机场飞行管制区"},{"key":"C","text":"航路飞行管制区、空域飞行管制区、机场飞行管制区"}],"answer":"A","analysis":"提示：3个管制+分区\n解析：《中华人民共和国飞行基本规则》第三十条 在中华人民共和国境内，按照飞行管制责任划分为:飞行管制区、飞行管制分区机场飞行管制区。航路、航线地带和民用机场区域设置高空管制区、中低空管制区、终端(进近)管制区、机场塔台管制区。在中华人民共和国境内、毗连区、专属经济区及其毗连的公海的上空划分若干飞行情报区。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0077","type":"single","difficulty":1,"stem":"在中华人民共和国境内飞行的航空器必须遵守统一的飞行规则，该飞行规则应当由（）制定。","options":[{"key":"A","text":"民用航空局和中央军委"},{"key":"B","text":"中央军委"},{"key":"C","text":"国务院和中央军委"}],"answer":"C","analysis":"提示：有国+央，就选国央（除了进出国家领空归空军管，其他有国务院+中央军委，就选国+央）\n解析：《中华人民共和国飞行基本规则》第四条国务院、中央军事委员会空中交通管制委员会领导全国的飞行管制工作。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0078","type":"single","difficulty":1,"stem":"执行紧急救护、抢险救灾或者其它紧急任务，飞行计划申请最迟应在飞行前（）提出。","options":[{"key":"A","text":"30分钟"},{"key":"B","text":"1小时"},{"key":"C","text":"2小时"}],"answer":"B","analysis":"提示：救护、起飞一小时，保障、降落半小时\n解析：《通用航空飞行管制条例》第十六条:飞行计划申请应当在拟飞行前1天15 时前提出;飞行管制部门应当在拟飞行前1天21 时前作出批准或者不予批准的决定，并通知申请人。执行紧急救护、抢险救灾，人工影响天气或者其他紧急任务的，可以提出临时飞行计划申请。临时飞行计划申请最迟应当在拟飞行1小时前提出;飞行管制部门应当在拟起飞时刻 15 分钟前作出批准或者不予批准的决定，并通知申请人。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0079","type":"single","difficulty":1,"stem":"执行昼间专业任务的航空器，在平原、丘陵地区进行作业飞行时，起飞时间最早不得早于日出前（）。","options":[{"key":"A","text":"15分钟"},{"key":"B","text":"20分钟"},{"key":"C","text":"30分钟"}],"answer":"C","analysis":"提示：山区 早20晚15 ，平原30\n解析：根据航空作业规定，执行昼间专业任务的航空器，在平原、丘陵地区进行作业飞行时，为了确保飞行安全，起飞时间最早不得早于日出前30分钟。这是因为在这段时间内，光照条件逐渐改善，有利于飞行员观察地形和障碍物，减少飞行风险。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0080","type":"single","difficulty":1,"stem":"执行昼间专业任务的航空器，在山区进行作业飞行时，起飞时间最早不得早于日出前（）。","options":[{"key":"A","text":"10分钟"},{"key":"B","text":"15分钟"},{"key":"C","text":"20分钟"}],"answer":"C","analysis":"提示：山区 早20晚15\n解析：执行昼间专业任务的航空器在山区作业飞行时，为确保安全，起飞时间不得早于日出前20分钟，以确保光线充足;着陆时间不得晚于日落前15分钟。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0081","type":"single","difficulty":1,"stem":"执行昼间专业任务的航空器，在山区进行作业飞行时，着陆时间最晚不得晚于日落前（）。","options":[{"key":"A","text":"10分钟"},{"key":"B","text":"15分钟"},{"key":"C","text":"20分钟"}],"answer":"B","analysis":"提示：山区 早20晚15\n解析：执行昼间专业任务的航空器在山区作业飞行时，为确保安全，起飞时间不得早于日出前20分钟，以确保光线充足;着陆时间不得晚于日落前15分钟。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0082","type":"single","difficulty":1,"stem":"中华人民共和国境内的飞行管制，（）。","options":[{"key":"A","text":"由中国人民解放军空军统一组织实施，各有关飞行管制部门按照各自的职责分工提供空中交通管制服务"},{"key":"B","text":"由国务院、中央军委空中交通管制委员会统一组织实施，各有关飞行管制部门按照各自的职责分工提供空中交通管制服务"},{"key":"C","text":"由中国民用航空总局空中交通管理局统一组织实施，各有关飞行管制部门按照各自的职责分工提供空中交通管制服务"}],"answer":"A","analysis":"提示：境内飞行管制，选空军 飞进飞出国家领空，选空军\n解析：《中华人民共和国飞行基本规则》第二十八条:中华人民共和国境内的飞行管制，由中国人民解放军空军统一组织实施，各有关飞行管制部门按照各自的职责分工提供空中交通管制服务。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0083","type":"single","difficulty":1,"stem":"下列情况下，哪类无人机系统驾驶员不实施管理？","options":[{"key":"A","text":"视距内运行的Ⅱ类无人机"},{"key":"B","text":"超视距运行的Ⅰ类无人机"},{"key":"C","text":"在融合空域运行的Ⅳ级别无人机"}],"answer":"A","analysis":"提示：Ⅰ、Ⅱ类视距内\n解析：Ⅱ类无人机重量较小，整体运行风险较低；“视距内运行”时，驾驶员能够直接观察无人机并及时避障；旧版《民用无人机驾驶员管理规定》明确规定：Ⅰ、Ⅱ类无人机由驾驶员自行负责，无须驾驶员执照管理。","tags":[],"chapter":"空域","bankId":"uav-theory"},{"id":"thc-0084","type":"single","difficulty":1,"stem":"1:50万航图，图上1厘米相当于地面长（）。","options":[{"key":"A","text":"0.5公里"},{"key":"B","text":"5公里"},{"key":"C","text":"50公里"}],"answer":"B","analysis":"提示：一厘米等于5公里\n解析：1:50万的比例尺意味着地图上1单位长度对应着实际地面上的50万单位长度。1公里=100000厘米，50万厘米可以换算成5公里。即图上1厘米相当于地面长5公里","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0085","type":"single","difficulty":1,"stem":"1海里相当于多少公里?","options":[{"key":"A","text":"1.85公里"},{"key":"B","text":"1.15公里"},{"key":"C","text":"1.61公里"}],"answer":"A","analysis":"提示：1海里=1.85公里\n解析：在国际单位制中，1海里(nautical mile)等于1.852公里(kilometer)","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0086","type":"single","difficulty":1,"stem":"当给大型无人机加油时，为预防静电带来的危害应注意（）。","options":[{"key":"A","text":"检查电瓶和点火电门是否关断"},{"key":"B","text":"油车是否接地"},{"key":"C","text":"将飞机、加油车和加油枪用连线接地"}],"answer":"C","analysis":"提示：三线接地防静电\n解析：当给大型无人机加油时，为预防静电带来的危害，应将飞机、加油车和加油枪用连线接地。如果没有进行接地连接，静电可能会在加油过程中积聚并产生火花，从而引发火灾或爆炸等危险情况。将三者接地形成等电位，可以及时导走静电，保障加油安全。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0087","type":"single","difficulty":1,"stem":"地球表面两点之间大圆航线的特点是（）。","options":[{"key":"A","text":"各点航线角相等"},{"key":"B","text":"航线距离最短"},{"key":"C","text":"航线距离最长"}],"answer":"B","analysis":"提示：两点之间大圆最短\n解析：大圆航线是地球表面上两点之间的最短路径，其特点就是航线距离最短。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0088","type":"single","difficulty":1,"stem":"地球上两点之间的航线建立最短的是指（）。","options":[{"key":"A","text":"两点之间的直线长度"},{"key":"B","text":"两点之间的等角线长度"},{"key":"C","text":"两点之间大圆的弧长"}],"answer":"C","analysis":"提示：两点之间大圆最短\n解析：两点之间大圆的弧长是地球上两点之间的最短航线。在航海和航空领域，为了实现高效的运输，都会尽量遵循大圆航线。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0089","type":"single","difficulty":1,"stem":"地图三要素指的是（）。","options":[{"key":"A","text":"地图比例尺、地图符号、地图投影"},{"key":"B","text":"地图比例尺、地图符号、图例"},{"key":"C","text":"地图符号、图例、地图投影"}],"answer":"B","analysis":"提示：无投影\n解析：地图三要素是地图比例尺、地图符号和图例。地图比例尺决定了地图内容的详细程度和精度;地图符号用于表示各种地理要帮助读素;图例则对地图符号进行说明，者正确理解地图。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0090","type":"single","difficulty":1,"stem":"对装备定距螺旋桨的活塞式发动机，通常用来反映功率的仪表是（）。","options":[{"key":"A","text":"进气压力表"},{"key":"B","text":"转速表"},{"key":"C","text":"燃油流量表"}],"answer":"B","analysis":"提示：转速反应功率\n解析：转速表通常用来反映装备定距螺旋桨的活塞发动机的功率。发动机转速的变化可以以间接反映出功率的输出情况。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0091","type":"single","difficulty":1,"stem":"飞机过载和载荷因子是同一概念吗?","options":[{"key":"A","text":"是"},{"key":"B","text":"不是"},{"key":"C","text":"不确定"}],"answer":"A","analysis":"提示：是，过载=载荷因子，都是比值\n解析：1.“过载”就是飞机结构或飞行员感受到的“载荷倍数”，用 G表示： 过载 ＝ 飞机当前所受总升力（或总法向力）/飞机重量1G ＝ 升力正好等于重量，平飞状态；0 G ＝ 失重，自由落体；负G ＝ 升力方向倒过来，人向上飘、屁股离开座椅。2.“载荷因子”（load factor）是个无量纲倍数，表示飞机结构当前要承受的“载荷倍数”，符号常写成 n： n = 总升力 / 飞机重量3.工程上叫“载荷因子”，飞行员口语里就叫“过载”“G 值”，是同一概念。（这里的过载不是我们生活中的说的“超过载荷”，它在题目中是飞机工程领域专有名词，是个比值）","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0092","type":"single","difficulty":1,"stem":"飞行高度层的基准面是（）。","options":[{"key":"A","text":"机场平面"},{"key":"B","text":"平均海平面"},{"key":"C","text":"1013HPA气压平面"}],"answer":"C","analysis":"提示：基准面1013\n解析：飞行高度层的基准面是1013HPA气压平面。飞机的飞行高度就是基于这个基准面来确定和报告的。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0093","type":"single","difficulty":1,"stem":"飞行高度是指（）。","options":[{"key":"A","text":"飞机飞行的高度"},{"key":"B","text":"飞机到某一基准面的垂直距离"},{"key":"C","text":"飞机到机场平面的垂直距离"}],"answer":"B","analysis":"提示：基准面垂直距离\n解析：飞行高度是指飞机到某一基准面的垂直距离。常用的基准面有平均海平面等，通过测量飞机与基准面的垂直距离来确定飞行高度。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0094","type":"single","difficulty":1,"stem":"飞行手册中规定着陆不能刹车状态接地，主要是因为（）。","options":[{"key":"A","text":"可能使刹车装置失效"},{"key":"B","text":"可能导致滑跑时拖胎"},{"key":"C","text":"使机轮起转力矩增大而损坏"}],"answer":"C","analysis":"提示：刹车着陆损坏力矩\n解析：飞行手册中规定着陆不能刹车状态接地主要是因为使机轮起转力矩增大而损坏。在接地瞬间刹车会导致机轮受到过大的冲击和力矩，增加损坏的风险。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0095","type":"single","difficulty":1,"stem":"关于粗猛着陆描述正确的是（）。","options":[{"key":"A","text":"粗猛着陆就是使飞机接地的动作太快"},{"key":"B","text":"不按规定的着陆高度、速度及接地角，导致受地面撞击力超过规定"},{"key":"C","text":"粗猛着陆时前轮先接地"}],"answer":"B","analysis":"提示：粗猛=不按规定\n解析：粗猛着陆是指不按规定的着陆高度、速度及接地角，导致受地面撞击力超过规定。如果飞机接地时速度过大、高度过高或接地角不正确，就可能造成粗猛着陆，对飞机结构和乘客安全带来威胁。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0096","type":"single","difficulty":1,"stem":"滑行速度应当按照相应航空器的飞行手册或者飞行员驾驶守则执行，在障碍物附近滑行，速度不得超过（）。","options":[{"key":"A","text":"每小时15公里"},{"key":"B","text":"每小时20公里"},{"key":"C","text":"每小时50公里"}],"answer":"A","analysis":"提示：每小时15公里（尽量慢，选最小）\n解析：为了确保飞行安全，在障碍物附近滑行时，航空器需要降低速度，以避免碰撞风险。根据规定，此速度上限设定为每小时15公里。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0097","type":"single","difficulty":1,"stem":"活塞式发动机过热易出现在下列哪种过程中?","options":[{"key":"A","text":"长时间爬升"},{"key":"B","text":"巡航"},{"key":"C","text":"下降"}],"answer":"A","analysis":"提示：做功才会发热，爬坡最累最热\n解析：长时间爬升过程中，发动机需要持续输出大功率以克服重力和空气阻力，这会导致发动机温度升高，若散热不及时则易发生过热现象。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0098","type":"single","difficulty":1,"stem":"活塞式发动机在慢车状态下工作时间过长，易带来的主要危害是（）。","options":[{"key":"A","text":"电嘴挂油积炭"},{"key":"B","text":"滑油消耗量过大"},{"key":"C","text":"气缸头温度过高"}],"answer":"A","analysis":"提示：慢车→积炭 (富油也积炭)\n解析：活塞式发动机长时间慢车时，转速和气缸温度较低，燃油燃烧不充分，容易造成火花塞（电嘴）挂油、积炭，点火性能下降。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0099","type":"single","difficulty":1,"stem":"计算无人机装载重量和重心的方法不包括（）。","options":[{"key":"A","text":"计算法"},{"key":"B","text":"坐标法"},{"key":"C","text":"查表法"}],"answer":"B","analysis":"提示：包括查表法，不包括坐标法\n解析：无人机装载重量和重心的计算方法多种多样，但通常不包括坐标法。常用的方法包括计算法、查表法和图表法等。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0100","type":"single","difficulty":1,"stem":"降落时间的含义是指（）。","options":[{"key":"A","text":"航空器接地的瞬间"},{"key":"B","text":"航空器着陆后前轮接地的瞬间"},{"key":"C","text":"航空器着陆滑跑终止的瞬间"}],"answer":"C","analysis":"提示：滑跑终止为降落\n解析：降落时间是指从航空器接触跑道开始滑跑到完全停止的整个过程所需的时间。这个瞬间标志着航空器成功着陆并处于静止状态。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0101","type":"single","difficulty":1,"stem":"经验表明无人机每飞行（）小时或者更少就需要某种类型的预防性维护，至少每（）小时进行较小的维护。","options":[{"key":"A","text":"20、50"},{"key":"B","text":"25、40"},{"key":"C","text":"30、60"}],"answer":"A","analysis":"提示：20，50\n解析：维护被定义为无人机的保管、检查、大修和维修,包括部件的替换。 不同类型的无人机维护要求不同,经验表明,无人机每飞行20小时或者更少就需要某种类型的预防性维护,至少每50小时进行较小的维护。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0102","type":"single","difficulty":1,"stem":"距机场（）应当打开全部障碍物标志灯。","options":[{"key":"A","text":"1.5公里"},{"key":"B","text":"2公里"},{"key":"C","text":"3公里"}],"answer":"B","analysis":"提示：1公里跑道灯 ，2公里障碍灯\n解析：距机场2公里应当打开全部障碍物标志灯在昼间飞行中，当水平能见度降低到一定程度时，为了保障飞行安全，需要打开机场的全部障碍物标志灯。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0103","type":"single","difficulty":1,"stem":"可能需要处置的紧急情况不包括（）。","options":[{"key":"A","text":"飞控系统故障"},{"key":"B","text":"上行通讯链路故障"},{"key":"C","text":"控制站显示系统故障"}],"answer":"A","analysis":"提示：飞控故障是危险!，不是紧急\n解析：飞控系统故障通常被视为一种危急情况:而非紧急情况，它对飞行安全构成直接且重大的威胁，导致无人机失去控制，甚至坠毁。而上行通讯链路故障和控制站显示系统故障会影响操作，它们都属于“可能需要处置的紧急情况”。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0104","type":"single","difficulty":1,"stem":"可能需要处置的危急情况不包括（）。","options":[{"key":"A","text":"动力装置故障"},{"key":"B","text":"任务设备故障"},{"key":"C","text":"舵面故障"}],"answer":"B","analysis":"提示：任务设备顶多就是做不了任务，不影响飞行，不危险\n解析：无人机飞行中需紧急处置的危急情况，多直接威胁飞行安全，如动力装置故障会导致失速、坠机；舵面故障会使姿态失控，均需立即处理。而 任务设备故障（如相机、传感器故障）仅影响作业任务，不危及飞行安全，通常无需紧急处置。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0105","type":"single","difficulty":1,"stem":"可能需要执行的应急程序不包括（）。","options":[{"key":"A","text":"动力装置重启操作"},{"key":"B","text":"备份系统切换操作"},{"key":"C","text":"导航系统重启操作"}],"answer":"C","analysis":"提示：不包括，导航重启不应急\n解析：在无人机应急程序中，动力装置重启操作和备份系统切换操作都是常见的应对措施，用于在出现故障时恢复系统正常运行。而导航系统重启操作通常不是应急程序的一部分，因为导航系统的故障往往涉及更复杂的问题，需要更专业的维修或更换硬件来解决。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0106","type":"single","difficulty":1,"stem":"没有角度失真的航图叫做（）。","options":[{"key":"A","text":"等距投影图"},{"key":"B","text":"等角投影图"},{"key":"C","text":"等积投影图"}],"answer":"B","analysis":"提示：问题对答案，角度对等角\n解析：等角投影图能够保持地图上的角度不变从而避免角度失真。这种投影图在航空航海等领域有广泛应用，因为它能够准确地表示方向关系。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0107","type":"single","difficulty":1,"stem":"民用无人机系统要求至少（）检查一次。","options":[{"key":"A","text":"半年"},{"key":"B","text":"一年"},{"key":"C","text":"两年"}],"answer":"B","analysis":"提示：年检1年1检\n解析：根据民用无人机系统的维护要求，为了确保无人机的安全性能和稳定运行，通常要求至少每年进行一次全面检查。这项检查由认证的专业人员或制造商执行，以评估无人机的整体状况并发现潜在问题。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0108","type":"single","difficulty":1,"stem":"某跑道长度2公里，画到1:10万地图上的长度是（）","options":[{"key":"A","text":"2厘米"},{"key":"B","text":"4厘米"},{"key":"C","text":"6厘米"}],"answer":"A","analysis":"提示：2公里2厘米 （1:10万，第一位只能是2）\n解析：根据比例尺的计算方法(实际距离/比例尺=图上距离)，当跑道长度为2公里(即2000米)且地图比例尺为1:10万时，跑道在地图上的长度应为2000米/100000=0.02米，即2厘米。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0109","type":"single","difficulty":1,"stem":"起飞时，可操纵变距螺旋桨的桨叶角到什么状态?","options":[{"key":"A","text":"小桨叶角及低转速"},{"key":"B","text":"大桨叶角及高转速"},{"key":"C","text":"小桨叶角及高转速"}],"answer":"C","analysis":"提示：起飞，小角高速（小高）\n解析：起飞时需要发动机和螺旋桨提供较大功率与拉力，因此可操纵变距螺旋桨通常调整为：小桨叶角：减小桨叶旋转阻力，使发动机容易提高转速；高转速：有利于发挥起飞功率并产生较大的起飞拉力。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0110","type":"single","difficulty":1,"stem":"起飞时间(陆上)的含义是指（）。","options":[{"key":"A","text":"航空器开始起飞滑跑轮子转动的瞬间"},{"key":"B","text":"航空器起飞滑跑抬前轮的瞬间"},{"key":"C","text":"航空器进入跑道对正起飞方向的瞬间"}],"answer":"A","analysis":"提示：起飞轮转，降落终止（只跟轮子转不转相关）\n解析：起飞时间(陆上)通常指的是航空器在跑道上开始滑跑，轮子开始转动的那一瞬间。这是飞机起飞过程的一个重要标志，标志着飞机从静止状态进入动态滑行阶段并准备加速起飞。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0111","type":"single","difficulty":1,"stem":"起落航线飞行开始一转弯和结束四转弯的高度一般不得低于（）。","options":[{"key":"A","text":"50米"},{"key":"B","text":"100米"},{"key":"C","text":"150米"}],"answer":"B","analysis":"提示：14转不低于100米\n解析：根据《中国民用航空飞行规则》的规定，起落航线飞行的高度以及开始一转弯和结束四转弯的高度都有明确要求。一般来说，起飞后开始第一转弯和结束四转弯的高度不得低于100米，这是为了确保飞行安全避免在低空发生碰撞或其他意外情况。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0112","type":"single","difficulty":1,"stem":"气压高度表通过测量大气的什么参数来反映飞行高度?","options":[{"key":"A","text":"大气密度"},{"key":"B","text":"大气压力"},{"key":"C","text":"大气温度"}],"answer":"B","analysis":"提示：问题对答案，气压对气压\n解析：气压高度表是一种通过测量大气压力来反映飞行高度的仪表。随着飞行高度的增加，大气压力逐渐降低，气压高度表通过感知这种压力变化并转换为高度信息，从而向飞行员提供当前飞行高度数据。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0113","type":"single","difficulty":1,"stem":"气压式高度表的拨正QNH，高度表指示（）。","options":[{"key":"A","text":"海面气压"},{"key":"B","text":"修正海平面气压高度"},{"key":"C","text":"场压高度"}],"answer":"B","analysis":"提示：QNH→修正海平面气压H(高度)\n解析：QNH(海平面气压)是气压式高度表拨正时常用的一个参数。当气压式高度表拨正QNH后，它所指示的高度即为修正海平面气压高度。这个高度考虑了当前海平面气压与标准大气压之间的差异，并进行了相应的修正，从而更准确地反映了飞机相对于海平面的垂直距离。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0114","type":"single","difficulty":1,"stem":"全球划分为多少个时区，每个时区经纬度为多少度?","options":[{"key":"A","text":"12个，30°"},{"key":"B","text":"24个，15°"},{"key":"C","text":"18个，20°"}],"answer":"B","analysis":"提示：一天24小时，地球转一圈过一天\n解析：全球被划分为24个时区，这是以地球经线为标准进行划分的。每个时区跨越经度15以确保世界各地时间的统一和协调","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0115","type":"single","difficulty":1,"stem":"如果无人机制造商使用编写的细节更加详细的《无人机驾驶员操作手册》作为主要参考（）《无人机飞行手册》。","options":[{"key":"A","text":"由局方批准后可以替代"},{"key":"B","text":"不可替代"},{"key":"C","text":"一般情况下可以替代"}],"answer":"A","analysis":"提示：局方批准后可\n解析：（《操作手册》被局方批准后可替代《飞行手册》）本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。无人机制造商也可编写操作细节更加详细的《无人机驾驶员操作手册》(POH),其中应包含局方批准的《无人机飞行手册》信息,并提交局方备案。如果以《无人机驾驶员操作手册》作为主要参考,那么相关段落要声明由局方批准可代替《无人机飞行手册》。《无人机所有者/信息手册》也是由无人机制造商编写的文档,包含关于无人机制造和型号方面的一般信息。《无人机所有者/信息手册》不经过局方批准,也不特定于具体注册号的飞机。这个手册提供飞机运行有关的一般信息,不保持内容最新,所以不能代替《无人机飞行手册》或者《无人机驾驶员操作手册》。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0116","type":"single","difficulty":1,"stem":"如果一本《无人机飞行手册》没有注明具体的无人机序号和注册信息，则（）。","options":[{"key":"A","text":"手册可以作为该机飞行的参考指导"},{"key":"B","text":"手册只能用于一般学习用途"},{"key":"C","text":"手册可以部分作为该机飞行参考指导"}],"answer":"B","analysis":"提示：没有注明型号，只能一般学习\n解析：本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。如果《无人机飞行手册》没有注明具体的无人机序号和注册信息，就只能作为一般的学习参考资料，不能为特定无人机的飞行提供针对性的指导。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0117","type":"single","difficulty":1,"stem":"谁对民用无人驾驶航空器系统的维护负责?","options":[{"key":"A","text":"签派"},{"key":"B","text":"机长"},{"key":"C","text":"运行人"}],"answer":"C","analysis":"提示：运维-运行维护-运行人\n解析：根据《民用无人驾驶航空器运行安全管理规则》F章 运行管理 相关条例总结： 运行人是承担系统维护工作的法定责任人，需确保系统处于适航状态。 名词解释： 运行人：是指实际控制使用民用航空器实施飞行活动的单位或者个人。一般为航空器的所有权人，但当航空器所有 权人将使用控制权委托给代管人时，该航空器的运行人为航空器代管人。 机长：是指由运行人指定，在飞行时间内对航空器的运行和安全拥有最终权利和负有最终责任的驾驶员。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0118","type":"single","difficulty":1,"stem":"世界时(UTC)是指（）。","options":[{"key":"A","text":"英国伦敦的地方时"},{"key":"B","text":"零时区的区时"},{"key":"C","text":"12时区的区时"}],"answer":"B","analysis":"提示：UTC零时区（零食）\n解析：世界时(UTC)是指零时区的区时，也称为协调世界时。它是全球通用的时间标准，用于统一世界各地的时间。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0119","type":"single","difficulty":1,"stem":"水平能见度小于（）公里的，起飞时还应当打开跑道灯，着陆时还应当打开航空器着陆方向(着陆的反航向)上保障飞行的全部灯光。","options":[{"key":"A","text":"3"},{"key":"B","text":"2"},{"key":"C","text":"1"}],"answer":"C","analysis":"提示：1公里跑道灯 ，2公里障碍灯\n解析：根据飞行规则，当水平能见度小于1公里时，为了保障飞行安全，起飞时需要打开跑道灯，着陆时则需要打开航空器着陆方向上的全部保障飞行灯光。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0120","type":"single","difficulty":1,"stem":"为保障飞行安全，建议无论是在白天还是夜间，当发动机在运转时就打开（）。","options":[{"key":"A","text":"防撞灯"},{"key":"B","text":"着陆灯"},{"key":"C","text":"航行灯"}],"answer":"A","analysis":"提示：全天开防撞灯\n解析：防撞灯的主要作用是防止航空器在空中或地面相撞。无论是在自天还是夜间，只要发动机在运转，就建议打开防撞灯，以提高航空器的可见性，保障飞行安全。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0121","type":"single","difficulty":1,"stem":"为了使在航线上飞行的飞机都有相同的零点高度，应该按（）来调整高度表。","options":[{"key":"A","text":"本站气压"},{"key":"B","text":"标准海平面气压"},{"key":"C","text":"修正海平面气压"}],"answer":"B","analysis":"提示：1013是基准气压高 零点是标准海平面高度\n解析：标准海平面气压是一个统一的气压值，用于调整高度表，以确保在航线上飞行的飞机都有相同的零点高度。这有助于保证飞行的准确性和安全性。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0122","type":"single","difficulty":1,"stem":"无人机弹射发射方式主要用于（）。","options":[{"key":"A","text":"Ⅲ、Ⅳ、Ⅺ级别固定翼无人机"},{"key":"B","text":"Ⅺ、Ⅻ级别固定翼无人机"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅶ级别固定翼无人机"}],"answer":"C","analysis":"提示：发射五种 伞降五种\n解析：无人机弹射发射方式是一种特殊的发射方式，主要用于Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅶ级别的固定翼无人机。这种发射方式可以使无人机在短时间内迅速获得起飞速度，从而顺利升空。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0123","type":"single","difficulty":1,"stem":"无人机的检查应当遵循（）。","options":[{"key":"A","text":"制造商的最新维护手册"},{"key":"B","text":"随机附带维护手册"},{"key":"C","text":"无人机飞行员经验"}],"answer":"A","analysis":"提示：最新手册\n解析：无人机的检查是保障其适航性和安全性的重要环节。为了确保检查的全面性和准确性，应当遵循制造商提供的最新维护手册进行检查。这样可以确保无人机的各项性能指标符合规定要求。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0124","type":"single","difficulty":1,"stem":"无人机的注册所有者或运营人应对保持无人机有最新的适航证书和（）负责。","options":[{"key":"A","text":"无人机安全飞行"},{"key":"B","text":"无人机注册证书"},{"key":"C","text":"无人机维修"}],"answer":"B","analysis":"提示：适航证书+注册证书，两个证书\n解析：适航证书证明航空器符合适航要求，注册证书证明其登记状态；所有者或运营人应确保航空器具有有效的适航证书和注册证书。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0125","type":"single","difficulty":1,"stem":"无人机的注册所有者或运营人应将永久邮寄地址的变更、无人机的销售和（）等事项通知局方注册处。","options":[{"key":"A","text":"试验试飞"},{"key":"B","text":"无人机注册证书丢失"},{"key":"C","text":"无人机维修"}],"answer":"B","analysis":"提示：有注册选注册\n解析：邮寄地址变更、无人机销售和注册证书丢失，都涉及注册信息或证书状态，需要通知注册管理部门。所有者或运营人应确保航空器具有有效的适航证书和注册证书。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0126","type":"single","difficulty":1,"stem":"无人机飞行前，无人机飞行员（）。","options":[{"key":"A","text":"按照随机《无人机飞行手册》指导飞行"},{"key":"B","text":"按照积累的经验指导飞行"},{"key":"C","text":"重点参考《无人机所有者/信息手册》"}],"answer":"A","analysis":"提示：（随机：随着无人机） 飞行员看“飞行手册”\n解析：本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。（鼠鼠老师提示：谁负责飞行谁看“飞行手册”；谁拥有无人机谁看“所有者手册”）","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0127","type":"single","difficulty":1,"stem":"无人机飞行手册中规定的过载表明（）。","options":[{"key":"A","text":"飞行中允许的最大过载"},{"key":"B","text":"起飞时允许的最大过载"},{"key":"C","text":"着陆时允许的最大过载"}],"answer":"A","analysis":"提示：飞行中\n解析：无人机飞行手册中规定的过载是指无人机在飞行过程中所能承受的最大过载，这是确保无人机结构安全和飞行稳定的重要指标。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0128","type":"single","difficulty":1,"stem":"无人机年度检查，要求（）。","options":[{"key":"A","text":"至少一年一次"},{"key":"B","text":"两年一次"},{"key":"C","text":"视无人机状态确定"}],"answer":"A","analysis":"提示：年检1年1检\n解析：无人机年度检查是确保无人机持续适航和安全运行的重要环节，按照要求应至少每年进行一次。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0129","type":"single","difficulty":1,"stem":"无人机年度检查不可由（）进行。","options":[{"key":"A","text":"飞机制造商"},{"key":"B","text":"认证的检查授权人员"},{"key":"C","text":"无人机飞行员"}],"answer":"C","analysis":"提示：飞行员不能自己年检无人机，驾驶员不能自己年检车辆\n解析：无人机年度检查需要由专业的检查人员进行，以确保检查的准确性和有效性。无人机飞行员虽然了解飞行操作，但可能缺乏专业的检查技能和知识，因此不能由他们进行年度检查。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0130","type":"single","difficulty":1,"stem":"无人机伞降回收方式一般的应用范围为（）。","options":[{"key":"A","text":"Ⅲ、Ⅳ、Ⅺ 级别无人机"},{"key":"B","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅶ级别无人机"},{"key":"C","text":"Ⅰ、Ⅱ、Ⅲ、Ⅳ、Ⅴ、Ⅵ、Ⅶ级别无人机"}],"answer":"B","analysis":"提示：弹射五种 伞降五种\n解析：根据蓝皮书对伞降回收的解释：伞降回收,利用机载降落伞回收无人机,一般用于小、轻、微型无人机。再根据蓝皮书对小、轻、微无人机重量的概括：空机质量≤7kg-5700kg的无人机对照2015年《轻小无人机运行规定》按重量可覆盖Ⅰ-Ⅶ。其中Ⅵ无人飞艇：回收靠自身排出氦气 / 热气,缓缓下降。（不适用伞降）Ⅴ植保无人机：植保作业高度通常2–10 m，太低，伞来不及完全打开。（不适用伞降）","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0131","type":"single","difficulty":1,"stem":"无人机适航证书可（）。","options":[{"key":"A","text":"随飞机一起转让"},{"key":"B","text":"存放备查"},{"key":"C","text":"随无人机系统携带"}],"answer":"A","analysis":"提示：适航证可转让\n解析：根据《民用无人驾驶航空器运行安全管理规则》第92.465条：民用无人驾驶航空器系统适航证的转让性民用无人驾驶航空器系统适航证可以随航空器一起转让。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0132","type":"single","difficulty":1,"stem":"无人机特殊飞行许可颁发前，由局方检察官或局方认证人员或（）进行检查以确定位于预期的飞行是安全的。","options":[{"key":"A","text":"适当认证修理站"},{"key":"B","text":"经验丰富的无人机飞行员"},{"key":"C","text":"经验丰富的有人机飞行员"}],"answer":"A","analysis":"提示：认证的人或修理站，得有“认证”\n解析：许可颁发前，可由局方检查员亲自检查，或要求认证的维修人员、认证的修理站检查航空器，以确定其能够安全完成预期飞行。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0133","type":"single","difficulty":1,"stem":"无人机系统无线电资源的使用（）局方无线电管理部门的许可证。","options":[{"key":"A","text":"需要"},{"key":"B","text":"不需要"},{"key":"C","text":"一般情况下不需要"}],"answer":"A","analysis":"提示：要许可证得有管理部门\n解析：无人机系统使用无线电频率和设备，应遵守国家无线电管理规定；依法取得无线电频率使用许可或无线电台执照。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0134","type":"single","difficulty":1,"stem":"无人机制造商编写的文档《无人机所有者/信息手册》（）。","options":[{"key":"A","text":"需经局方批准"},{"key":"B","text":"不需局方批准"},{"key":"C","text":"特殊飞行器需局方批准"}],"answer":"B","analysis":"提示：（所者/信息），不批准不替代\n解析：（此题不要与《无人机飞行手册》混淆，飞行手册很重要，需要按照要求编写，并需要局方审批）本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。无人机制造商也可编写操作细节更加详细的《无人机驾驶员操作手册》(POH),其中应包含局方批准的《无人机飞行手册》信息,并提交局方备案。如果以《无人机驾驶员操作手册》作为主要参考,那么相关段落要声明由局方批准可代替《无人机飞行手册》。《无人机所有者/信息手册》也是由无人机制造商编写的文档,包含关于无人机制造和型号方面的一般信息。《无人机所有者/信息手册》不经过局方批准,也不特定于具体注册号的飞机。这个手册提供飞机运行有关的一般信息,不保持内容最新,所以不能代替《无人机飞行手册》或者《无人机驾驶员操作手册》。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0135","type":"single","difficulty":1,"stem":"无人机制造商编写的文档《无人机所有者/信息手册》（）。","options":[{"key":"A","text":"可以替代《无人机飞行手册》"},{"key":"B","text":"一般情况下可以替代《无人机飞行手册》"},{"key":"C","text":"不能替代《无人机飞行手册》"}],"answer":"C","analysis":"提示：（所有者/信息），不批准不替代\n解析：（此题不要与《无人机飞行手册》混淆，飞行手册很重要，需要按照要求编写，并需要局方审批）本题依据蓝皮书《无人机驾驶员航空知识手册》表述：《无人机飞行手册》(AFM)是无人机制造商编写而由局方批准的文档。它特定于无人机的型号和注册序号,包含操作程序和限制。无人机驾驶员在作业中必须遵守相应的《无人机飞行手册》,标记、标牌中指定的操作限制。《无人机飞行手册》按照局方授权的行业协会所制定的《无人机飞行手册编写规范》标准格式编写(参见附录)。无人机制造商也可编写操作细节更加详细的《无人机驾驶员操作手册》(POH),其中应包含局方批准的《无人机飞行手册》信息,并提交局方备案。如果以《无人机驾驶员操作手册》作为主要参考,那么相关段落要声明由局方批准可代替《无人机飞行手册》。《无人机所有者/信息手册》也是由无人机制造商编写的文档,包含关于无人机制造和型号方面的一般信息。《无人机所有者/信息手册》不经过局方批准,也不特定于具体注册号的飞机。这个手册提供飞机运行有关的一般信息,不保持内容最新,所以不能代替《无人机飞行手册》或者《无人机驾驶员操作手册》。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0136","type":"single","difficulty":1,"stem":"无人机注册证书颁发给飞机所有者作为注册证明（）。","options":[{"key":"A","text":"随时随机携带"},{"key":"B","text":"存放备查"},{"key":"C","text":"作为售出证明"}],"answer":"A","analysis":"提示：注册携带\n解析：注册证书跟随无人机一起随时都要携带","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0137","type":"single","difficulty":1,"stem":"旋翼机飞行时间的含义是指（）。","options":[{"key":"A","text":"自旋翼机起飞离地到着陆接地的瞬间"},{"key":"B","text":"自旋翼机起飞滑跑至着陆滑跑终止的瞬间"},{"key":"C","text":"自旋翼机旋翼开始转动至旋翼停止转动的瞬间"}],"answer":"C","analysis":"提示：旋翼机旋翼--转动至停止\n解析：旋翼机飞行时间指旋翼开始转动至停止的全程时间，涵盖起飞至着陆，体现旋翼工作状态。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0138","type":"single","difficulty":1,"stem":"旋翼机在停机坪上起飞和着陆时，距离其他航空器或者障碍物的水平距离不少于（）。","options":[{"key":"A","text":"10米"},{"key":"B","text":"20米"},{"key":"C","text":"25米"}],"answer":"A","analysis":"提示：10米安全距离\n解析：旋翼机在停机坪上起飞和着陆时，为确保安全，需与其他航空器或障碍物保持至少10米的水平距离。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0139","type":"single","difficulty":1,"stem":"在装载时，由于飞机重心偏右，可导致在巡航飞行时，飞机的阻力（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"不变"}],"answer":"A","analysis":"提示：重心偏右，阻力大\n解析：飞机重心偏右导致巡航时两侧升力不平衡，需增加阻力以修正，因此飞机阻力增大。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0140","type":"single","difficulty":1,"stem":"直升机可以用（）的飞行代替滑行。","options":[{"key":"A","text":"1米至5米高度"},{"key":"B","text":"1米至10米高度"},{"key":"C","text":"1米至15米高度"}],"answer":"B","analysis":"提示：直升机滑行110\n解析：依据2007年10月18日第二次修订的《中华人民共和国飞行基本规则》第四章机场区域内飞行，第四十九条（六）直升机可以用1米至10米高度的飞行代替滑行。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0141","type":"single","difficulty":1,"stem":"飞行时间的含义是指（）。","options":[{"key":"A","text":"自航空器开始起飞滑跑至着陆滑跑终止的时间"},{"key":"B","text":"从航空器起飞进入跑道至着陆脱离跑道的时间"},{"key":"C","text":"从航空器自装载地点开始滑行直到飞行结束到达卸载地点停止运动时为止的时间"}],"answer":"C","analysis":"提示：飞行时间→装载 卸载 相关\n解析：本题为待升级知识点，经本机构考场简单得出得分选项为“从航空器自装载地点开始滑行直到飞行结束到达卸载地点停止运动时为止的时间”，选项以考试得分为准。（其他相关补充：根据中国民用航空局飞行标准司2023年发布的《航线运输驾驶员执照理论考试大纲(飞机)知识点》，1.4.1.1.与飞行人员有关的各种时间的定义，知识点二：飞行时间，是指航空器为准备起飞而借助自身动力开始移动时起，到飞行结束停止移动时止的总时间。）","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0142","type":"single","difficulty":1,"stem":"不属于无人机回收方式的是（）。","options":[{"key":"A","text":"撞网回收"},{"key":"B","text":"横滚回收"},{"key":"C","text":"滑跑降落"}],"answer":"B","analysis":"提示：横滚是一种飞行姿态\n解析：根据蓝皮书，无人机主要回收为伞降、撞网、气囊、滑跑降落四种。没有横滚，横滚飞行姿态。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0143","type":"single","difficulty":1,"stem":"不属于无人机回收方式的是（）。","options":[{"key":"A","text":"伞降回收"},{"key":"B","text":"飘落回收"},{"key":"C","text":"气囊回收"}],"answer":"B","analysis":"提示：无人机直掉，不飘落\n解析：根据蓝皮书，无人机主要回收为伞降、撞网、气囊、滑跑降落四种。没有飘落。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0144","type":"single","difficulty":1,"stem":"飞行任务完成后不需要做的工作是（）。","options":[{"key":"A","text":"检讨飞行执行过程"},{"key":"B","text":"填写飞行日志或记录本"},{"key":"C","text":"评价并记录机组人员表现"}],"answer":"C","analysis":"提示：只检讨自己，不评价别人\n解析：飞行任务完成后，需要进行的工作包括检讨飞行执行过程、填写飞行日志或记录本等，以总结经验、记录数据并改进飞行技能。而评价并记录机组人员表现不是每次飞行后必须做的工作，通常是在特定情况下进行。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0145","type":"single","difficulty":1,"stem":"无人机驾驶员关于无人机发动机不需要了解的是（）。","options":[{"key":"A","text":"大车状态的连续工作时间"},{"key":"B","text":"稳定怠速"},{"key":"C","text":"发动机生产日期"}],"answer":"C","analysis":"提示：选错的。不需了解生产日期\n解析：无人机驾驶员关于无人机发动机需要了解的是其性能参数，如大车状态的连续工作时间和稳定怠速，以便合理操控。而发动机生产日期与飞行操控无直接关联，不需特别关注。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0146","type":"single","difficulty":1,"stem":"无人机驾驶员关于无人机飞行速度范围不需要了解的是（）。","options":[{"key":"A","text":"海平面不同重量下的速度范围"},{"key":"B","text":"极限高度内的速度范围"},{"key":"C","text":"极限高度外的速度范围"}],"answer":"C","analysis":"提示：选错的。不需了解极高外\n解析：无人机驾驶员需要了解无人机在不同条件下的飞行速度范围，包括海平面不同重量下的速度范围和极限高度内的速度范围。而极限高度外的速度范围超出正常飞行条件，不需特别关注。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0147","type":"single","difficulty":1,"stem":"无人机驾驶员关于无人机飞行速度限制不需要了解的是（）。","options":[{"key":"A","text":"俯冲最大速度"},{"key":"B","text":"不同高度、重量下的失速速度"},{"key":"C","text":"静止时飞机零漂速度"}],"answer":"C","analysis":"提示：选错的。不需了解零速度\n解析：无人机驾驶员需要了解无人机的飞行速度限制，包括俯冲最大速度和不同高度、重量下的失速速度，以确保飞行安全。而静止时飞机零漂速度与飞行操控无直接关联,不需特别关注。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0148","type":"single","difficulty":1,"stem":"下列不属于飞行后进行的内容是（）。","options":[{"key":"A","text":"检讨飞行执行过程"},{"key":"B","text":"填写飞行日志或记录本"},{"key":"C","text":"规划飞行航线"}],"answer":"C","analysis":"提示：选错的。飞前规划飞后不规划。\n解析：飞行后进行的内容通常包括检讨飞行执行过程和填写飞行日志或记录本，以便总结经验并改进飞行技能。而规划飞行航线是在飞行前进行的工作，不属于飞行后的内容。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0149","type":"single","difficulty":1,"stem":"着陆后检查内容不包括（）。","options":[{"key":"A","text":"飞行器外观检查"},{"key":"B","text":"燃油动力飞行器需要称重检查"},{"key":"C","text":"气象检查"}],"answer":"C","analysis":"提示：选错的。不包括天气\n解析：着陆后检查内容通常包括飞行器外观检查和燃油动力飞行器的称重检查，以确保飞行器的安全和性能。气象检查不属于着陆后的常规检查内容。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0150","type":"single","difficulty":1,"stem":"无人机的回收方式可归纳为伞降回收空中回收起落架轮式着陆拦阻网回收气垫着陆和垂直着陆等类型。下列说法错误的是（）。","options":[{"key":"A","text":"空中回收，在大飞机上必须有空中回收系统，在无人机上除了有阻力伞和主伞之外，还需有钩挂伞、吊索和可旋转的脱落结构"},{"key":"B","text":"起落架轮式着陆，有些无人机的起落架局部被设计成较坚固"},{"key":"C","text":"用拦截网系统回收无人机是目前世界小型无人机较普遍采用的回收方式之一"}],"answer":"B","analysis":"提示：起落架较坚固×\n解析：B选项写反了，起落架轮式着陆，有些无人机的起落架局部被设计成“较脆弱的结构”,允许着陆时撞地损坏,吸收能量。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0151","type":"single","difficulty":1,"stem":"无人机的发射方式可归纳为手抛发射、零长发射、弹射发射、起落架滑跑起飞、母机空中发射、容器式发射装置发射和垂直起飞等类型。下列说法正确的是（ ）。","options":[{"key":"A","text":"在地面发射时，无人机使用较为广泛的发射方式是母机空中发射与零长发射"},{"key":"B","text":"无人机安装在轨道式发射装置上，在压缩空气、橡筋或液压等弹射装置作用下起飞，无人机飞离发射装置后，在辅助发动机作用下完成飞行任务"},{"key":"C","text":"容器式发射装置是一种封闭式发射装置，兼备发射与贮存无人机功能。它有单室式和多室式两种类型"}],"answer":"C","analysis":"提示：容器式发射装置√\n解析：在地面发射时,无人机使用较为广泛的发射方式是零长发射与弹射发射方式。无人机安装在轨道式发射装置上,在压缩空气、橡皮筋或液压等弹射装置作用下起飞,无人机飞离发射装置后,在主发动机作用下完成飞行任务。","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0152","type":"single","difficulty":1,"stem":"无人机适航证书不可（）。","options":[{"key":"A","text":"随飞机一起转让"},{"key":"B","text":"存放备查"},{"key":"C","text":"随无人机系统携带"}],"answer":"B","analysis":"提示：存放×\n解析：根据《民用无人驾驶航空器运行安全管理规则》第92.465条：民用无人驾驶航空器系统适航证的转让性民用无人驾驶航空器系统适航证可以随航空器一起转让。√ 根据《无人驾驶航空器飞行管理暂行条例》第三十二条：操控无人驾驶航空器实施飞行活动，应当遵守下列行为规范：（一）依法取得有关许可证书、证件，并在实施飞行活动时随身携带备查。√","tags":[],"chapter":"飞行手册","bankId":"uav-theory"},{"id":"thc-0153","type":"single","difficulty":1,"stem":"每个飞行教员必须将CCAR-61部要求的记录保存（）。","options":[{"key":"A","text":"一年"},{"key":"B","text":"五年"},{"key":"C","text":"三年"}],"answer":"C","analysis":"提示：记录3年（记录3年，数据3个月）\n解析：《民用航空器驾驶员合格审定规则》第61.209条，飞行教员的教学记录(a)飞行教员应当在接受其飞行或地面教学的每个人的飞行经历记录本上签字，并注明提供教学的内容、课时和日期。(b)飞行教员应当在飞行教员记录本或单独文件中记录下列内容(1)由该教员在飞行经历记录本或者在学生驾驶员执照上签字而被授予单飞权利的每个人的姓名。记录应当包括每次签字的日期以及所涉及的航空器型号;(2)由该教员签字推荐参加理论考试或者实践考试的每个人的姓名，记录还应当包括考试的种类、日期和考试结果。(c)每个飞行教员应当将本条要求的记录保存至少三年。","tags":[],"chapter":"法律法规","bankId":"uav-theory"},{"id":"thc-0154","type":"single","difficulty":1,"stem":"对于无人机植保作业，运营人指定的一个或多个作业负责人有何要求？","options":[{"key":"A","text":"接受了相应理论知识及飞行技能
