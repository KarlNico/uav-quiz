速度响应能力。电动系统通常具有较高的能量转换效率，能够将电池中的电能更高效地转化为机械能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0038","type":"single","difficulty":1,"stem":"多旋翼飞行器正常作业受自然环境影响的主要因素是()。","options":[{"key":"A","text":"地表是否凹凸平坦"},{"key":"B","text":"风向"},{"key":"C","text":"温度、风力"}],"answer":"C","analysis":"提示：影响主因→风力温度\n解析：多旋翼飞行器正常作业受自然环境影响的主要因素是温度、风力。 温度会影响多旋翼飞行器的电池性能、电子设备的工作稳定性等。在高温环境下，电池性能可能下降，续航时间缩短，同时电子设备也可能因过热出现故障;在低温环境下，电池的放电能力会降低，也会影响飞行器的性能。 风力对多旋翼飞行器的影响较大。强风可能使飞行器难以稳定飞行，增加操控难度，甚至可能将飞行器吹离预定航线或导致失 控。","tags":[],"bankId":"uav-selected"},{"id":"sel-0039","type":"single","difficulty":1,"stem":"下述何种天气现象是稳定大气的特征？","options":[{"key":"A","text":"能见度极好"},{"key":"B","text":"能见度较差"},{"key":"C","text":"有阵性降水"}],"answer":"A","analysis":"提示：天好万里无云，能见度好（本题与平流层对流层无关）\n解析：稳定大气条件下，大气层结稳定，不易发生对流和降水，因此能见度往往极好。","tags":[],"bankId":"uav-selected"},{"id":"sel-0040","type":"single","difficulty":1,"stem":"气象上的风向是指（）。","options":[{"key":"A","text":"风的来向"},{"key":"B","text":"气压梯度力方向"},{"key":"C","text":"风的去向"}],"answer":"A","analysis":"提示：北风吹雪花飘，北风来自北边，冷，风的来时路\n解析：气象上的风向是指风的来向，即风从哪个方向吹来。这是气象观测和预报中的基本常识，也是飞行安全和气象服务中的重要参数。","tags":[],"bankId":"uav-selected"},{"id":"sel-0041","type":"single","difficulty":1,"stem":"同一起飞重量的不同民用无人机系统航线飞行，一般（）的受风的影响小。","options":[{"key":"A","text":"巡航速度适中"},{"key":"B","text":"巡航速度小"},{"key":"C","text":"巡航速度大"}],"answer":"C","analysis":"提示：速度大，风的影响小（飞的越快，推力越大，阻力相对影响越小）\n解析：在相同起飞重量和航线条件下，巡航速度大的无人机受风的影响相对较小。这是因为较快的巡航速度能够更快地穿越风区，减少风对飞行轨迹的影响。","tags":[],"bankId":"uav-selected"},{"id":"sel-0042","type":"single","difficulty":1,"stem":"下面关于雾说法不正确的是（）。","options":[{"key":"A","text":"大雾会影响无人机的起降手动操作"},{"key":"B","text":"大雾会影响无人机航拍任务设备效果"},{"key":"C","text":"大雾会影响无人机的航线自主飞行"}],"answer":"C","analysis":"提示：航线自主飞行依靠GPS,大雾不影响\n解析：大雾对无人机的影响主要表现在视觉和传感器方面。大雾会影响无人机的起降手动操作，因为飞行员可能无法清晰地看到跑道或周围环境。同时，大雾也会影响无人机航拍任务设备的效果，因为雾会降低图像的清晰度和色彩饱和度。然而，无人机的航向自主飞行主要依赖GPS等导航系统，大雾对其影响较小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0043","type":"single","difficulty":1,"stem":"下述哪类民用无人机动力系统的运转不需要大气中的氧气?","options":[{"key":"A","text":"涡轮喷气发动机"},{"key":"B","text":"外转子无刷电动机"},{"key":"C","text":"二冲程活塞式汽油机"}],"answer":"B","analysis":"提示：外转子→ 电动→ 不要氧气\n解析：外转子无刷电动机的工作原理是通过电流在磁场中受力转动的原理制成的。具体来说，当给无刷电机定子上的线圈通电时，通电的线圈会产生磁场，转子上的磁铁会与线圈产生吸引或排斥，从而使转子转动。这一过程并不涉及燃烧反应，因此不需要大气中的氧气。","tags":[],"bankId":"uav-selected"},{"id":"sel-0044","type":"single","difficulty":1,"stem":"起飞场地从北京移至拉萨，对哪类无人机的高度性能影响最严重？","options":[{"key":"A","text":"电动固定翼"},{"key":"B","text":"电动多轴"},{"key":"C","text":"油动固定翼"}],"answer":"C","analysis":"提示：油动需要进气，电动不用进气\n解析：海拔升高（从北京约50米到拉萨约3650米）导致空气密度显著下降（约30%），这直接影响所有无人机的升力和推力产生。油动固定翼无人机依赖内燃机燃烧效率，而燃烧需要充足氧气。高原空气稀薄会导致：1)发动机功率下降 2)螺旋桨效率降低。这两个因素共同严重影响其高度性能。而电动多轴虽续航缩短，但通常能通过转速调整维持基本飞行；电动固定翼虽气动受限，但无发动机功率问题。所以选油动固定翼。","tags":[],"bankId":"uav-selected"},{"id":"sel-0045","type":"single","difficulty":1,"stem":"活塞式发动机过热易出现在下列哪种过程中?","options":[{"key":"A","text":"长时间爬升"},{"key":"B","text":"巡航"},{"key":"C","text":"下降"}],"answer":"A","analysis":"提示：做功才会发热，爬坡最累最热\n解析：长时间爬升过程中，发动机需要持续输出大功率以克服重力和空气阻力，这会导致发动机温度升高，若散热不及时则易发生过热现象。","tags":[],"bankId":"uav-selected"},{"id":"sel-0046","type":"single","difficulty":1,"stem":"下列正确的选项是()。","options":[{"key":"A","text":"了解飞机阻力是如何产生的并如何去减小它是很重要的"},{"key":"B","text":"飞行器飞行时阻力是可以避免的"},{"key":"C","text":"每次翼型或迎角的变化都不会改变飞机的阻力"}],"answer":"A","analysis":"提示：选正确的，BC明显错误\n解析：了解飞机阻力的产生和减小方法对于飞行器的设计和性能优化至关重要。阻力是飞行器飞行时必须克服的力量，减小阻力可以提高飞行效率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0047","type":"single","difficulty":1,"stem":"飞机平飞遇垂直向上突风作用时（）。","options":[{"key":"A","text":"阻力将增大"},{"key":"B","text":"升力将增大"},{"key":"C","text":"升力将减小"}],"answer":"B","analysis":"提示：向上风→托起→升力\n解析：飞机平飞遇垂直向上突风作用时，由于突风对机翼的垂直作用力，升力将增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0048","type":"single","difficulty":1,"stem":"无人机飞行员在操纵飞机平飞时，遇到强烈的垂直上升气流时，为了防止过载超规定应（）。","options":[{"key":"A","text":"适当减小飞行速度"},{"key":"B","text":"加大油门迅速脱离"},{"key":"C","text":"以最大上升率增大高度"}],"answer":"A","analysis":"提示：减速保平安（上升气流，减速）\n解析：在遇到强烈的垂直上升气流时，无人机飞行员应适当减小飞行速度，以防止过载超过规定。加大油门迅速脱离可能导致过载，而以最大上升率增大高度也可能增加过载风险。适当减小速度是最安全的应对措施。","tags":[],"bankId":"uav-selected"},{"id":"sel-0049","type":"single","difficulty":1,"stem":"部分多旋翼飞行器螺旋桨加有外框，其主要作用是()。","options":[{"key":"A","text":"提高螺旋桨效率"},{"key":"B","text":"增加外形的美观"},{"key":"C","text":"防止磕碰提高安全性"}],"answer":"C","analysis":"提示：安全\n解析：部分多旋翼飞行器螺旋桨加有外框，其主要作用是防止磕碰提高安全性。加外框可以避免螺旋桨在高速旋转时与人或物体发生碰撞，减少意外伤害的风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0050","type":"single","difficulty":1,"stem":"不属于影响飞机机体腐蚀的大气因素是()。","options":[{"key":"A","text":"空气的相对湿度"},{"key":"B","text":"空气压力"},{"key":"C","text":"空气的温差"}],"answer":"B","analysis":"提示：压力不会腐蚀机身\n解析：影响飞机机体腐蚀的大气因素主要包括空气的相对湿度、温度、以及空气中的腐蚀性物质等。而空气压力本身并不直接导致飞机机体的腐蚀。","tags":[],"bankId":"uav-selected"},{"id":"sel-0051","type":"single","difficulty":1,"stem":"保持匀速上升时，升力与重力（）。","options":[{"key":"A","text":"相等"},{"key":"B","text":"升力大于重力"},{"key":"C","text":"升力小于重力"}],"answer":"A","analysis":"提示：匀速 相等\n解析：匀速上升、匀速下降、悬停，全都升力＝重力，升力与重力不平衡会产生加速度。根据牛顿三大运动定律飞机匀速上升时，其加速度为零，合外力为零。在竖直方向上，飞机受到：重力（向下）升力（向上）这时合外力为零，升力等于重力。（推力和反作用力阻力合力也为零）（鼠鼠老师的话：当悬停变为上升的瞬间，才需要升力＞重力，等达到想要的上升速度后，就维持匀速往上爬，此时升力=重力。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0052","type":"single","difficulty":1,"stem":"保持匀速飞行时，阻力与推力（）。","options":[{"key":"A","text":"相等"},{"key":"B","text":"阻力大于推力"},{"key":"C","text":"阻力小于推力"}],"answer":"A","analysis":"提示：匀速=平稳=相等\n解析：保持匀速飞行时，飞机的阻力和推力必须相等，以保持速度不变，符合牛顿第一定律。","tags":[],"bankId":"uav-selected"},{"id":"sel-0053","type":"single","difficulty":1,"stem":"飞机离地速度越小，则()。","options":[{"key":"A","text":"滑跑距离越短，飞机的起飞性能越好"},{"key":"B","text":"滑跑距离越短，飞机的起飞性能越差"},{"key":"C","text":"滑跑距离越长，飞机的起飞性能越好"}],"answer":"A","analysis":"提示：起飞越省劲，起飞性能越好 （起飞需要速度小，滑跑距离短）\n解析：起飞性能好 = 短距就能离地+加速快+爬升强+安全裕度高+在高温高原 / 重载下也轻松起飞对应到本题提到的两个条件：离地速度与滑跑距离可以总结一句话为：起飞越轻松越省劲，起飞性能越好（例如：战斗机可能不到 200 米就离地；大型运输机可能要 2000 米以上）起飞性能的实际意义：1.滑跑距离短，有效避免跑道冲出 飞机所需滑跑距离短，剩余跑道余量充足，突发意外要中断起飞时，能轻松在跑道内停稳，大幅降低冲出跑道风险。2.离地速度低，低空操控更稳 低速即可升空，离地瞬间姿态易把控，减少抬机头过猛、姿态失控、低空飘摆等险情。","tags":[],"bankId":"uav-selected"},{"id":"sel-0054","type":"single","difficulty":1,"stem":"（）是由控制站上的操纵杆直接控制无人机的舵面，遥控无人机的飞行。","options":[{"key":"A","text":"舵面遥控"},{"key":"B","text":"姿态遥控"},{"key":"C","text":"指令控制"}],"answer":"A","analysis":"提示：问题对答案，舵面对舵面\n解析：舵面遥控又称纯手动模式，飞控不参与工作，直接控制无人机的舵面。舵面遥控是由控制站上的操纵杆直接控制无人机的舵面，遥控无人机的飞行。在一些简单的无人机模型操控中，操纵者通过移动控制站的操纵杆，直接改变无人机的升降舵、方向舵等舵面的角度，从而实现对无人机飞行姿态和方向的精准控制。","tags":[],"bankId":"uav-selected"},{"id":"sel-0055","type":"single","difficulty":1,"stem":"（）主要是制定无人机飞行任务、完成无人机载荷数据的处理和应用，指挥中心/数据处理中心一般都是通过无人机控制站等间接地实现对无人机的控制和数据接收。","options":[{"key":"A","text":"无人机控制站"},{"key":"B","text":"指挥处理中心"},{"key":"C","text":"载荷控制站"}],"answer":"B","analysis":"提示：答案藏在问题里 指挥中心/数据处理中心=指挥处理中心\n解析：指挥处理中心主要是制定无人机飞行任务、完成无人机载荷数据的处理和应用。指挥处理中心负责规划和制定无人机的飞行任务;可以通过远程控制站等设备，实时干预无人机的飞行，以应对飞行过程中的变化和意外情况。指挥处理中心负责接收处理和分析传感器所采集的数据。","tags":[],"bankId":"uav-selected"},{"id":"sel-0056","type":"single","difficulty":1,"stem":"电动动力系统主要由动力电机、动力电源和（）组成。","options":[{"key":"A","text":"调速系统"},{"key":"B","text":"电池"},{"key":"C","text":"无刷电机"}],"answer":"A","analysis":"提示：动力系统=电机+电源+调速系统\n解析：电动动力系统主要由动力电机、动力电源和调速系统(也称为电调)组成。调速系统也就是指电调，其作用为有两点，一是调整供给电机的电流从而控制旋翼转速，二是把电池的直流电转换为交流电供电机使用。","tags":[],"bankId":"uav-selected"},{"id":"sel-0057","type":"single","difficulty":1,"stem":"多旋翼飞行器的飞控指的是（）。","options":[{"key":"A","text":"机载导航飞控系统"},{"key":"B","text":"机载遥控接收机"},{"key":"C","text":"机载任务系统"}],"answer":"A","analysis":"提示：问题对答案，飞控对飞控系统\n解析：多旋翼飞行器的飞控指的是机载导航飞控系统。飞控系统负责控制飞行器的姿态、位置、速度等，保障飞行的稳定和安全。","tags":[],"bankId":"uav-selected"},{"id":"sel-0058","type":"single","difficulty":1,"stem":"飞机的爬升角是指（）。","options":[{"key":"A","text":"飞机上升轨迹与水平线之间的夹角"},{"key":"B","text":"飞机立轴与水平线之间的夹角"},{"key":"C","text":"飞机横轴与水平线之间的夹角"}],"answer":"A","analysis":"提示：问题对答案，爬升找上升\n解析：飞机的爬升角是指飞机上升轨迹与水平线之间的夹角。爬升角反映了飞机在爬升过程中上升轨迹的陡峭程度。爬升角越大，表明飞机的爬升越陡峭，上升速度在垂直方向上的分量越大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0059","type":"single","difficulty":1,"stem":"飞机平飞要有足够的升力来平衡飞机的重力，产生该升力所需的速度叫做（）。","options":[{"key":"A","text":"飞机平飞所需速度"},{"key":"B","text":"飞机平飞有利速度"},{"key":"C","text":"飞机平飞最大速度"}],"answer":"A","analysis":"提示：问题对答案，所需对所需\n解析：飞机保持平飞需要有足够的升力以平衡飞机的重力，为产生这个升力所需要的速度，叫平飞所需速度。本题可记忆关键字：平飞“所需对所需”","tags":[],"bankId":"uav-selected"},{"id":"sel-0060","type":"single","difficulty":1,"stem":"关于垂直起飞和着陆回收以下错误的是（）。","options":[{"key":"A","text":"垂直起降是旋翼无人机的主流发射回收方式"},{"key":"B","text":"部分特种固定翼无人机也可采用垂直方式发射和回收"},{"key":"C","text":"垂直起降的固定翼无人机均安装有专用的辅助动力系统"}],"answer":"C","analysis":"提示：并非所有的固定翼都安装专用的辅助动力（均安装，太绝对）\n解析：垂直起降的固定翼无人机不一定都安装有专用的辅助动力系统，部分无人机可能通过其他方式实现垂直起降。","tags":[],"bankId":"uav-selected"},{"id":"sel-0061","type":"single","difficulty":1,"stem":"多旋翼飞行器螺旋桨从结构上说，更接近于( )。","options":[{"key":"A","text":"风力发电机叶片"},{"key":"B","text":"直升机旋翼"},{"key":"C","text":"固定翼飞机螺旋桨"}],"answer":"C","analysis":"提示：问题对答案，螺旋桨对螺旋桨\n解析：多旋翼螺旋桨结构： 桨叶+桨毂 √风力发电机叶片结构： 叶片 + 轮毂法兰刚性连接直升机旋翼结构：桨叶+桨毂+水平铰、垂直铰、轴向铰等固定翼飞机螺旋桨结构： 桨叶+桨毂 √","tags":[],"bankId":"uav-selected"},{"id":"sel-0062","type":"single","difficulty":1,"stem":"在多旋翼飞行任务中，触发失控返时，应如何打断飞控当前任务，取回手动控制权?","options":[{"key":"A","text":"GPS手动模式切换"},{"key":"B","text":"云台状态切换"},{"key":"C","text":"航向锁定切换"}],"answer":"A","analysis":"提示：问题对答案，手动对GPS手动\n解析：主流飞控执行失控返航、定点悬停、航线等任务时，唯一合法打断方式就是：遥控切手动模式，立刻终止自动任务，回归人工操控。","tags":[],"bankId":"uav-selected"},{"id":"sel-0063","type":"single","difficulty":1,"stem":"空中交通管制单位为飞行中的民用航空器提供的空中交通服务中含有（）。","options":[{"key":"A","text":"飞行情报服务"},{"key":"B","text":"机场保障服务"},{"key":"C","text":"导航服务"}],"answer":"A","analysis":"提示：提供情报服务\n解析：《民用航空空中交通管理规则》第五条:空中交通服务包括空中交通管制服务、飞行情报服务和告警服务（管制、情报、告警）。","tags":[],"bankId":"uav-selected"},{"id":"sel-0064","type":"single","difficulty":1,"stem":"从什么资料上可以预先了解到航线高度的风、云、气温及颠簸、积冰等情况？","options":[{"key":"A","text":"航路天气预告图"},{"key":"B","text":"等压面预告图"},{"key":"C","text":"重要天气预告图"}],"answer":"A","analysis":"提示：问题对答案，航线对航路\n解析：航路天气预告图上可以预先了解到航线高度的风、云、气温及颠簸、积冰等情况。这是飞行员和航空气象学家常用的工具用于预测航线上的天气状况。","tags":[],"bankId":"uav-selected"},{"id":"sel-0065","type":"single","difficulty":1,"stem":"低空风切变主要的形成原因是什么？","options":[{"key":"A","text":"雷暴、低空急流和锋面活动"},{"key":"B","text":"气流经过特定环境时产生"},{"key":"C","text":"具体原因还不是特别明了"}],"answer":"A","analysis":"提示：问题对答案，低空对低空\n解析：低空风切变主要的形成原因是雷暴、低空急流和锋面活动。这些气象条件变化剧烈常导致风向和风速的突然改变，对飞行安全构成严重威胁。","tags":[],"bankId":"uav-selected"},{"id":"sel-0066","type":"single","difficulty":1,"stem":"最小能见度是指（）。","options":[{"key":"A","text":"能见度因方向而异时，垂直和水平能见度最小的距离"},{"key":"B","text":"能见度因方向而异时，其中最小的能见距离"},{"key":"C","text":"能看到最近的物体距离"}],"answer":"B","analysis":"提示：问题对答案。最小能见度对最小的能见距离\n解析：最小能见度是指在能见度因方向而异时其中最小的能见距离。这是因为能见度可能因天气、光照等条件在不同方向上有所不同，所以取最小值作为参考标准。","tags":[],"bankId":"uav-selected"},{"id":"sel-0067","type":"single","difficulty":1,"stem":"飞机发生螺旋后，最有效的制止方法是（）。","options":[{"key":"A","text":"立即推杆到底改出失速"},{"key":"B","text":"立即向螺旋反方向打舵到底制止滚转"},{"key":"C","text":"立即加大油门增速"}],"answer":"B","analysis":"提示：问题对答案，螺旋对螺旋\n解析：飞机发生螺旋后，最有效的制止方法是立即向螺旋反方向打舵到底制止滚转，以恢复飞机的正常飞行状态，","tags":[],"bankId":"uav-selected"},{"id":"sel-0068","type":"single","difficulty":1,"stem":"载荷因子是（）。","options":[{"key":"A","text":"飞机拉力与阻力的比值"},{"key":"B","text":"飞机升力与阻力的比值"},{"key":"C","text":"飞机承受的载荷(除重力外)与重力的比值"}],"answer":"C","analysis":"提示：问题对答案，载荷对载荷\n解析：载荷因子是飞机承受的载荷(除重力外)与重力的比值，它反映了飞机在特定飞行条件下的载荷情况。","tags":[],"bankId":"uav-selected"},{"id":"sel-0069","type":"single","difficulty":1,"stem":"减小干扰阻力的主要措施是（）。","options":[{"key":"A","text":"把机翼表面做的很光滑"},{"key":"B","text":"部件连接处采取整流措施"},{"key":"C","text":"把暴露的部件做成流线型"}],"answer":"B","analysis":"提示：面积压差，结构整包干扰（问题对答案，措施对措施）\n解析：部件连接处采取整流措施，能使气流更顺畅通过，减小干扰，从而降低干扰阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0070","type":"single","difficulty":1,"stem":"多旋翼飞行器属于以下哪个概念范畴？","options":[{"key":"A","text":"轻于空气的航空器"},{"key":"B","text":"直升机"},{"key":"C","text":"旋翼机"}],"answer":"C","analysis":"提示：问题对答案，旋翼对旋翼\n解析：经本机构真实考场检验，选“旋翼机”得分。多旋翼飞行器属于旋翼机范畴。旋翼机是指依靠一个或多个旋翼产生升力的航空器，多旋翼飞行器通过多个旋翼的协调控制实现飞行，因此归类为旋翼机。（CAAC将多旋翼无人机与无人直升机两项考试并列，可见其并无从属关系。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0071","type":"single","difficulty":1,"stem":"在丘陵、山区、高原进行农业作业飞行的最低天气标准是","options":[{"key":"A","text":"云高距作业区最高点不低于200米，能见度不小于5公里"},{"key":"B","text":"云高距作业区最高点不低于300米，能见度不小于5公里"},{"key":"C","text":"云高距作业区最高点不低于150米，能见度不小于3公里"}],"answer":"B","analysis":"提示：平原150 渔200 山300\n解析：根据旧规《中国民用航空飞行规则》第１２７条 作业飞行的最低天气标准：（一）平原地区： 云高不低于１５０米，能见度不小于５公里，直升机不小于３公里；（二）丘陵、山区（高原）： 云高距作业区的最高点不低于３００米，能见度不小于５公里，无连续性颠簸、下降气流；","tags":[],"bankId":"uav-selected"},{"id":"sel-0072","type":"single","difficulty":1,"stem":"执行昼间专业任务的航空器，在山区进行作业飞行时，着陆时间最晚不得晚于日落前（）。","options":[{"key":"A","text":"15分钟"},{"key":"B","text":"20分钟"},{"key":"C","text":"30分钟"}],"answer":"A","analysis":"提示：山区 晚15早20\n解析：根据航空作业规定，执行昼间专业任务的航空器，在平原、丘陵地区进行作业飞行时，为了确保飞行安全，起飞时间最早不得早于日出前30分钟。这是因为在这段时间内，光照条件逐渐改善，有利于飞行员观察地形和障碍物，减少飞行风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0073","type":"single","difficulty":1,"stem":"执行昼间专业任务的航空器，在山区进行作业飞行时，起飞时间最早不得早于日出前（）。","options":[{"key":"A","text":"10分钟"},{"key":"B","text":"15分钟"},{"key":"C","text":"20分钟"}],"answer":"C","analysis":"提示：山区 晚15早20\n解析：执行昼间专业任务的航空器在山区作业飞行时，为确保安全，起飞时间不得早于日出前20分钟，以确保光线充足;着陆时间不得晚于日落前15分钟。","tags":[],"bankId":"uav-selected"},{"id":"sel-0074","type":"single","difficulty":1,"stem":"民用无人机驾驶员视距内等级申请人必须必须具有操纵民用无人机不少于（）小时的飞行训练时间。","options":[{"key":"A","text":"100"},{"key":"B","text":"44"},{"key":"C","text":"56"}],"answer":"B","analysis":"提示：视距内44，超视距56 （训练=飞行时间=飞行经历）\n解析：视距内等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 44 小时的飞行经历时间。","tags":[],"bankId":"uav-selected"},{"id":"sel-0075","type":"single","difficulty":1,"stem":"民用无人机驾驶员超视距等级申请人必须必须具有操纵民用无人机不少于（）小时的飞行训练时间。","options":[{"key":"A","text":"56"},{"key":"B","text":"44"},{"key":"C","text":"100"}],"answer":"A","analysis":"提示：视距内44，超视距56 （训练=飞行时间=飞行经历）\n解析：根据CAAC于2018年发布的《民用无人机驾驶员管理规定》附件 1：颁发无人机驾驶员执照与等级的条件2.1.4 飞行经历要求:超视距等级驾驶员执照的申请人应当具有操纵有动力的无人机至少 56 小时的飞行经历时间。","tags":[],"bankId":"uav-selected"},{"id":"sel-0076","type":"single","difficulty":1,"stem":"由授权教员签字批准单飞后的学员，单飞训练时间在其飞行经历记录本上应体现为（）。","options":[{"key":"A","text":"副驾驶时间"},{"key":"B","text":"机长时间"},{"key":"C","text":"单飞时间"}],"answer":"C","analysis":"提示：问题对答案，单飞对单飞\n解析：根据2018年《民用无人机驾驶员管理规定》所附的飞行经历记录填写规范，要求把每次飞行填入相应的时间项目，其中将“单飞时间”列为执照或等级申请人作为民用无人机唯一操纵者的飞行时间","tags":[],"bankId":"uav-selected"},{"id":"sel-0077","type":"single","difficulty":1,"stem":"由授权教员为学员提供的带飞训练，学员飞行经历记录本上应体现为（）。","options":[{"key":"A","text":"副驾驶时间"},{"key":"B","text":"机长时间"},{"key":"C","text":"带飞时间"}],"answer":"C","analysis":"提示：问题对答案，带飞对带飞\n解析：由授权教员为学员提供的带飞训练，学员飞行经历记录本上应体现为带飞时间。带飞时间能够明确反映出学员在授权教员指导下进行飞行训练的时长。","tags":[],"bankId":"uav-selected"},{"id":"sel-0078","type":"single","difficulty":1,"stem":"当前使用的《中华人民共和国民用航空法》于（）修正?","options":[{"key":"A","text":"2017年11月04日"},{"key":"B","text":"2018年12月29日"},{"key":"C","text":"2016年11月07日"}],"answer":"B","analysis":"提示：⭐航空法修正日期，不管选项如何，选最新的日期！\n解析：⭐航空法修正日期，不管选项如何，选最新的日期！根据2018年12月29日第十三届全国人民代表大会常务委员会第七0次会议 《关于修改 〈中华人民共和国劳动法〉等七部法律的.0决定》第五次修正；根据2021年4月29日第十三届全国人民代表大会常务委员会第二十八次会议 《关于修改 〈中华人民共和国道路交通安全法〉等八部法律的决定》第六次修正。","tags":[],"bankId":"uav-selected"},{"id":"sel-0079","type":"single","difficulty":1,"stem":"《民用无人驾驶航空器实名制登记管理规定》颁布时间为?","options":[{"key":"A","text":"2015年12月29日"},{"key":"B","text":"2017年01月01日"},{"key":"C","text":"2017年05月16日"}],"answer":"C","analysis":"提示：实名登记516 ⭐不管选项是2017年5月6日 还是2017年5月16日都选它\n解析：根据CAAC官网信息，2017年5月16日，民航局航空器适航审定司正式发布《民用无人驾驶航空器实名制登记管理规定》，明确适用于在我国境内最大起飞重量为250克以上(含250克)的民用无人机，要求自2017年6月1日起，购买民用无人机的拥有者必须按照该管理规定的要求进行实名登记;对于在2017年6月1日前购买的民用无人机，其拥有者必须在2017年8月31日前完成实名登记。","tags":[],"bankId":"uav-selected"},{"id":"sel-0080","type":"single","difficulty":1,"stem":"CCAR-61部授权的执照或合格证持有人在理论考试中作弊或发生其他禁止行为，局方(授权方)撤销相应的执照等级，责令当事人立即停止飞行运行并交回其已取得的执照或合格证，( )年内不得申请按照CCAR-61颁发的执照、合格证或等级以及考试。","options":[{"key":"A","text":"一"},{"key":"B","text":"视其违规的情节轻重而定"},{"key":"C","text":"三"}],"answer":"C","analysis":"提示：持有人作弊，3年，选最久（CCAR开头，有3选3，没3选1）\n解析：根据《民用航空器驾驶员和地面教员合格审定规则》(CCAR-61-R4)第61.245条 理论考试中的作弊或其他禁止的行为的处罚:(b)对于违反本规则第61.37条规定的执照或等级持有人，局方对当事人予以警告，同时撤销相应的执照等级，责令当事人立即停止飞行运行并交回其已取得的相应执照。驾驶员执照等级被撤销之日起三年内，当事人不得申请按照本规则颁发的执照或等级以及考试。","tags":[],"bankId":"uav-selected"},{"id":"sel-0081","type":"single","difficulty":1,"stem":"飞行人员未按《中华人民共和国飞行基本规则》规定履行职责的 ，由有关部门依法给予行政处分或者纪律处分，情节严重的，依法给予吊扣执照或合格证（ ）的处罚 ，或者责令停飞（ ）。","options":[{"key":"A","text":"半年，一至三个月"},{"key":"B","text":"一至三个月，半年"},{"key":"C","text":"一至六个月，一至三个月"}],"answer":"C","analysis":"提示：未履责1613（伪造1-6，喝酒1-6，未履责1613，喝酒停申1年）\n解析：《中华人民共和国飞行基本规则》第一百一十八条:飞行人员未按本规则规定履行职责的，由有关部门依法给予行政处分或者纪律处分;情节严重的，依法给予吊扣执照一个月至六个月的处罚，或者责令停飞一个月至三个月;构成犯罪的，依法追究刑事责任。","tags":[],"bankId":"uav-selected"},{"id":"sel-0082","type":"single","difficulty":1,"stem":"具有负静安定性的飞机，当受到扰动使平衡状态变化后，有()。","options":[{"key":"A","text":"回到原平衡状态的趋势"},{"key":"B","text":"继续偏离原平衡状态的趋势"},{"key":"C","text":"保持偏离后的平衡状态的趋势"}],"answer":"B","analysis":"提示：正静回，负静偏\n解析：具有负静安定性的飞机，在受到扰动后，会倾向于继续偏离其原平衡状态，而不是回到原平衡状态或保持偏离后的平衡状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0083","type":"single","difficulty":1,"stem":"飞机从已建立的平衡状态发生偏离，若（），则飞机表现出负动安定性。","options":[{"key":"A","text":"飞机振荡的振幅减小使飞机回到原来的平衡状态"},{"key":"B","text":"飞机振荡的振幅持续增大"},{"key":"C","text":"飞机振荡的振幅不增大也不减小"}],"answer":"B","analysis":"提示：负大正恢复\n解析：具有正静安定性→受到扰动导致平衡状态变化后→有回到原平衡状态的趋势（恢复）具有负静安定性→受到扰动导致平衡状态变化后→有偏离原平衡状态的趋势（振幅持续增大）","tags":[],"bankId":"uav-selected"},{"id":"sel-0084","type":"single","difficulty":1,"stem":"任何单位或者个人未取得（），均不得生产民用航空器","options":[{"key":"A","text":"适航证"},{"key":"B","text":"型号合格证"},{"key":"C","text":"生产许可证"}],"answer":"C","analysis":"提示：设计要型号，生产要生产\n解析：《中华人民共和国民用航空法》第三十五条:生产、维修民用航空器及其发动机、螺旋桨和民用航空器上设备，应当向国务院民用航空主管部门申请领取生产许可证书、维修许可证书。经审查合格的，发给相应的证书。","tags":[],"bankId":"uav-selected"},{"id":"sel-0085","type":"single","difficulty":1,"stem":"民用无人机的空机重量（）。","options":[{"key":"A","text":"不包含载荷的无人机重量"},{"key":"B","text":"不包含载荷、电池和燃料的无人机重量"},{"key":"C","text":"不包含载荷、燃料的无人机重量"}],"answer":"C","analysis":"提示：不包含载荷、燃料\n解析：根据2015年颁布至今仍有效的《轻小无人机运行规定（试行）》3.16：空机重量，是指不包含载荷和燃料的无人机重量，该重量包含燃料容器和电池等固体装置。","tags":[],"bankId":"uav-selected"},{"id":"sel-0086","type":"single","difficulty":1,"stem":"《民用无人驾驶航空器实名制登记管理规定》适用于（）的无人机。","options":[{"key":"A","text":"空机重量＞250 g"},{"key":"B","text":"最大起飞重量≤7 kg 的视距内运行"},{"key":"C","text":"最大起飞重量≥250 g"}],"answer":"C","analysis":"提示：所有≥250\n解析：《民用无人驾驶航空器实名制登记管理规定》适用于在中华人民共和国境内最大起飞重量为250克以上(含250克)的民用无人机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0087","type":"single","difficulty":1,"stem":"Ⅲ级别无人机指（）。","options":[{"key":"A","text":"4 kg＜空机质量≤10 kg，10 kg＜起飞全重≤20 kg"},{"key":"B","text":"5 kg＜空机质量≤10 kg，15 kg＜起飞全重≤25 kg"},{"key":"C","text":"4 kg＜空机质量≤15 kg，7 kg＜起飞全重≤25 kg"}],"answer":"C","analysis":"提示：空机：Ⅰ0; Ⅱ1.5; Ⅲ 4; Ⅳ15; Ⅺ 116; Ⅻ5700 空机关键数：0kg-1.5kg-4kg-15kg-116kg-5700\n解析：《民用无人机驾驶员管理规定》中对无人机分为以下几类：I类无人机空机质量＞0kg，起飞全重≤1.5kg;Ⅱ类无人机1.5kg＜空机质量≤4kg，1.5kg＜起飞全重≤7kg；Ⅲ类无人机4kg＜空机质量≤15kg，7kg＜起飞全重≤25kg;IV类无人机15kg＜空机重量≤116kg，25kg＜起飞全重≤150kg;Ⅺ类无人机116KG＜W≤5700KG;Ⅻ类无人机W＞5700KG","tags":[],"bankId":"uav-selected"},{"id":"sel-0088","type":"single","difficulty":1,"stem":"超近程无人机活动半径在（）以内。","options":[{"key":"A","text":"15 km"},{"key":"B","text":"15-50 km"},{"key":"C","text":"50-200 km"}],"answer":"A","analysis":"提示：超近 近 短 中 远 15 50 200 800 ＞800\n解析：根据孙毅主编的《无人机驾驶员航空知识手册》1.2无人机的分类:按活动半径分类,无人机可分为超近程无人机、近程无人机、短程无人机中程无人机和远程无人机。超近程无人机活动半径在15km以内,近程无人机活动半径在15-50km之间,短程无人机活动半径在50~200km之间,中程无人机活动半径在200~800km之间,远程无人机活动半径大于800km。","tags":[],"bankId":"uav-selected"},{"id":"sel-0089","type":"single","difficulty":1,"stem":"中程无人机活动半径为（）。","options":[{"key":"A","text":"50-200 km"},{"key":"B","text":"＞800 km"},{"key":"C","text":"200-800 km"}],"answer":"C","analysis":"提示：超近 近 短 中 远 15 50 200 800 ＞800\n解析：根据孙毅主编的《无人机驾驶员航空知识手册》1.2无人机的分类:按活动半径分类,无人机可分为超近程无人机、近程无人机、短程无人机中程无人机和远程无人机。超近程无人机活动半径在15km以内,近程无人机活动半径在15-50km之间,短程无人机活动半径在50~200km之间,中程无人机活动半径在200~800km之间,远程无人机活动半径大于800km。","tags":[],"bankId":"uav-selected"},{"id":"sel-0090","type":"single","difficulty":1,"stem":"某多旋翼动力电池标有6S2P字样，代表（）。","options":[{"key":"A","text":"电池由6S2P公司生产"},{"key":"B","text":"电池组先由2个单体串联，再将串联后的6组并联"},{"key":"C","text":"电池组先由6个单体串联，再将串联后的2组并联"}],"answer":"C","analysis":"提示：s串联 p并联\n解析：“S”代表串联(Series)。“P”代表并联(“6S2P”即表示电池组先由6个Parallel)单体串联，再将这样的串联组并联2组。","tags":[],"bankId":"uav-selected"},{"id":"sel-0091","type":"single","difficulty":1,"stem":"以下哪种动力电池放电电流最大?","options":[{"key":"A","text":"20000mAh，5C"},{"key":"B","text":"2000mAh，30C"},{"key":"C","text":"8000mAh，20C"}],"answer":"C","analysis":"提示：mAh换算Ah，乘以C （2*30；20*5；8*20）\n解析：根据最大放电电流计算公式：Imax=容量（Ah） x 放电倍率（C）将选项数值毫安时mah，换算成安时Ah，乘以放电倍率，对比结果，谁的数值大，谁的放电电流就大20000mAh = 20Ah→2 x 5= 100A2000mAh = 2Ah→2 x 30= 60A 8000mAh = 8Ah→8 x 20 = 160A √最大","tags":[],"bankId":"uav-selected"},{"id":"sel-0092","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的锂聚合物动力电池，其单体标称电压为()。","options":[{"key":"A","text":"4.2V"},{"key":"B","text":"11.1V"},{"key":"C","text":"3.7V"}],"answer":"C","analysis":"提示：3.7-4.2，3.7标，4.2满\n解析：锂聚合物电池单体标称电压是 3.7V。1.2V一般是镍氢电池等的标称电压，11.1V 通常是由 3个 3.7V 的锂聚合物电池串联后的电压。","tags":[],"bankId":"uav-selected"},{"id":"sel-0093","type":"single","difficulty":1,"stem":"对于多旋翼飞行器动力电源充电，以下哪种充电方法是错误的?","options":[{"key":"A","text":"聚合物锂电池单体充至4.6V满电"},{"key":"B","text":"聚合物锂电池单体充至4.2V满电"},{"key":"C","text":"磷酸铁锂电池单体充至3.6V满电"}],"answer":"A","analysis":"提示：选错的。4.6V错\n解析：聚合物锂电池的标称电压通常为3.7V，在充电过程中，其电压会逐渐上升，但一般充电至4.2V左右即达到满电状态。如果继续充电至4.6V，可能会超出电池的安全充电电压范围，导致电池内部压力过大，从而引发电池鼓胀、漏液甚至爆炸等安全问题。","tags":[],"bankId":"uav-selected"},{"id":"sel-0094","type":"single","difficulty":1,"stem":"某多旋翼电调上标有“15A”字样，意思是指（）。","options":[{"key":"A","text":"电调所能承受的稳定工作电流是15安培"},{"key":"B","text":"电调所能承受的最大瞬间电流是15安培"},{"key":"C","text":"电调所能承受的最小工作电流是15安培"}],"answer":"B","analysis":"提示：考试选瞬时电流给分\n解析：虽然常规应该是持续最大电流，但是根据2个考场反馈，综合10题出现这题，考试选瞬时电流给分无人机电调（ESC）上最明显标注的电流通常是持续电流（持续安培数），通常以字母“A”表示，例如30A、40A等。此外，部分电调还会标注瞬时电流（峰值电流），通常以“X”或“XX”开头，例如X30A表示瞬时电流可达30A。","tags":[],"bankId":"uav-selected"},{"id":"sel-0095","type":"single","difficulty":1,"stem":"经测试，某多旋翼飞行器稳定飞行时，动力电池的持续输出电流为5安培，该多旋翼可以选用（）。","options":[{"key":"A","text":"5A的电调"},{"key":"B","text":"10A的电调"},{"key":"C","text":"30A的电调"}],"answer":"C","analysis":"提示：电池电调（5选30）（10选50）\n解析：核心逻辑：电源能给的> 控制器能扛的 > 负载峰值要的 ≥ 负载平时用的 电源最大放电电流>电调＞3-5倍稳定电流≥动力电池持续输出电流知识点1：电调额定电流的安全冗余设计电调的额定持续电流，必须大于飞行器的最大可能工作电流（含稳定飞行 + 突发工况的峰值），且必须预留充足安全冗余。因为实际飞行中，飞行器会遇到机动飞行、大风、负载变化等情况，电流会瞬间大幅超过悬停 / 稳定飞行的电流（通常可达悬停电流的 2~4 倍甚至更高）。因此，如电机持续输出电流为5A/10A ，选用的电调要比电机高3-5倍的裕度，也就是15-25/30-50A。--------------------------------------------本题与另一提知识点容易混淆，做个区分--------------------------------------------知识点2：电池放电能力需大于电调额定电流电池的最大放电能力，必须大于电调的额定电流，否则会出现 “电池拖不动电调” 的情况。电调的额定电流，是它能从电池中 “抽取” 的最大持续电流；而电池的最大持续放电电流，必须大于电调的额定电流，才能保证有这么多的稳定电流可被抽取，否则会出现两个严重问题：①电池无法提供足够电流，导致动力不足、电压骤降，飞行器失控。②电池长期超负荷放电，会过热、鼓包甚至起火，存在严重安全隐患。因此，如电调标有60A，必须选用大于60A（最大放电能力）的电池，才能带来持续稳定的与电调电机相匹配的电流。","tags":[],"bankId":"uav-selected"},{"id":"sel-0096","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的动力电池一般为()。","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"铅酸电池"},{"key":"C","text":"银锌电池"}],"answer":"A","analysis":"提示：锂电池\n解析：多旋翼飞行器使用的动力电池一般为锂聚合物电池(Li-po)。锂聚合物电池作为锂离子电池的一种变种，具有更高的能量密度和更轻的重量，非常适合用于多旋翼飞行器等需要高性能电池的应用场景。","tags":[],"bankId":"uav-selected"},{"id":"sel-0097","type":"single","difficulty":1,"stem":"同样容量不同类型的电池，最轻的是()。","options":[{"key":"A","text":"铅酸蓄电池"},{"key":"B","text":"碱性电池"},{"key":"C","text":"Li-po(锂聚合物电池)"}],"answer":"C","analysis":"提示：锂电最轻，容量能量大\n解析：同样容量不同类型的电池中，最轻的是Li-po(锂聚合物电池)。这种电池不仅重量轻，而且比能量大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0098","type":"single","difficulty":1,"stem":"同质量电池，单位价格最便宜的是?","options":[{"key":"A","text":"锂聚合物电池"},{"key":"B","text":"镍镉电池"},{"key":"C","text":"镍氢电池"}],"answer":"B","analysis":"提示：镍镉最便宜\n解析：在同质量电池的比较中，单位价格最便宜的电池是镍镉电池。","tags":[],"bankId":"uav-selected"},{"id":"sel-0099","type":"single","difficulty":1,"stem":"以下电池记忆效应最强的是（）。","options":[{"key":"A","text":"Li-Po"},{"key":"B","text":"Ni-Cd"},{"key":"C","text":"Ni-MH"}],"answer":"B","analysis":"提示：记忆Ni-Cd(镍镉 niè gé 电池）\n解析：电池记忆效应最高的是 Ni-Cd(镍镉电池）镍镉电池如果在不完全放电的状态下充电，容易使电池极板产生结晶，导致电池容量降低，这就是所谓的记忆效应。相比之下，Li-PO(锂聚合物电池)基本没有记忆效应，Ni-MH(镍氢电池)的记忆效应也较小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0100","type":"single","difficulty":1,"stem":"以下哪种动力电池在没有充分放电的前提下，不能够以大电流充电?","options":[{"key":"A","text":"LAB(铅酸蓄电池)"},{"key":"B","text":"Ni-Cd(镍镉电池)"},{"key":"C","text":"Li-po(锂聚合物电池)"}],"answer":"B","analysis":"提示：Ni-Cd有记忆，未放不能大\n解析：Ni-Cd(镍镉电池)在没有充分放电的前提下，不能够以大电流充电。镍镉电池具有较强的记忆效应，如果在没有充分放电的情况下进行充电，容易导致电池容量下降和性能受损.铅酸蓄电池相对来说记忆效应较弱，在一些情况下可以在未充分放电时进行充电。锂聚合物电池基本没有记忆效应，可以在未充分放电时进行充电。","tags":[],"bankId":"uav-selected"},{"id":"sel-0101","type":"single","difficulty":1,"stem":"位置传感器用于感受无人机的位置，是飞行国际控制的必要前提，()是典型的位置传感器。","options":[{"key":"A","text":"角速率传感器"},{"key":"B","text":"加速度传感器"},{"key":"C","text":"GPS卫星导航接收机"}],"answer":"C","analysis":"提示：位置→ GPS\n解析：位置传感器用于感受无人机的位置，是飞行国际控制的必要前提，GPS卫星导航接收机是典型的位置传感器。GPS卫星导航接收机通过接收来自全球定位系统(GPS)卫星的信号，能够计算出无人机在地球上的精确位置、速度和时间信息。","tags":[],"bankId":"uav-selected"},{"id":"sel-0102","type":"single","difficulty":1,"stem":"大多数多旋翼飞行器自主飞行过程利用( )实现位置感知。","options":[{"key":"A","text":"平台惯导"},{"key":"B","text":"捷联惯导"},{"key":"C","text":"GPS"}],"answer":"C","analysis":"提示：位置，必然GPS\n解析：大多数多旋翼飞行器自主飞行过程利用GPS实现位置感知。GPS能够提供较为精确的地理位置信息包括经纬度和高度。 平台惯导和捷联惯导虽然也能提供位置信息，但在多旋翼飞行器的自主飞行中，GPS是更常用和主要的位置感知手段。","tags":[],"bankId":"uav-selected"},{"id":"sel-0103","type":"single","difficulty":1,"stem":"大多数多旋翼飞行器自主飞行过程利用( )实现高度感知。","options":[{"key":"A","text":"气压高度计"},{"key":"B","text":"GPS"},{"key":"C","text":"超声波高度计"}],"answer":"B","analysis":"提示：GPS-位置高度速度\n解析：根据100分考生反馈 本题选GPS","tags":[],"bankId":"uav-selected"},{"id":"sel-0104","type":"single","difficulty":1,"stem":"多旋翼飞行器中的GPS天线应尽量安装在（）。","options":[{"key":"A","text":"飞行器顶部"},{"key":"B","text":"飞行器中心"},{"key":"C","text":"飞行器尾部"}],"answer":"A","analysis":"提示：GPS装顶部 （电池在上面，飞控在中间）\n解析：多旋翼飞行器中的GPS天线应尽量安装在飞行器顶部，以便获得更开阔的视野，减少信号遮挡，从而提高GPS信号的接收质量和稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0105","type":"single","difficulty":1,"stem":"多旋翼飞行器的飞控硬件尽量安装在()。","options":[{"key":"A","text":"飞行器前部"},{"key":"B","text":"飞行器底部"},{"key":"C","text":"飞行器中心"}],"answer":"C","analysis":"提示：电池在上，飞控中间\n解析：将飞控硬件安装在飞行器中心有助于保持飞行器的稳定性。当飞控硬件安装在飞行器中心，即质心处时，线加速度计测量的准确锃最高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0106","type":"single","difficulty":1,"stem":"多旋翼飞行器上的链路天线应尽量()飞控和GPS天线安装。","options":[{"key":"A","text":"贴合"},{"key":"B","text":"靠近"},{"key":"C","text":"远离"}],"answer":"C","analysis":"提示：远离，因为互干扰\n解析：多旋翼飞行器上的链路天线应尽量远离飞控和GPS天线安装。因为链路天线与其他天线的电磁干扰可能会影响信号质量，从而影响飞行器的稳定性和通信效果。","tags":[],"bankId":"uav-selected"},{"id":"sel-0107","type":"single","difficulty":1,"stem":"多旋翼飞行器GPS定位中，最少达到几颗星，才能够在飞行中保证基本的安全?","options":[{"key":"A","text":"2-3颗"},{"key":"B","text":"4-5颗"},{"key":"C","text":"6-7颗"}],"answer":"B","analysis":"提示：基本4-5星\n解析：GPS 定位的底层逻辑是 “三角测距定位法”，4 颗卫星是实现三维定位（经纬度 + 海拔高度）的最低门槛。其中3 颗卫星用来确定平面位置，第 4 颗卫星用来校准时间误差并计算高度，满足无人机基本的定位和悬停需求。所以至少4颗，选4-5颗。","tags":[],"bankId":"uav-selected"},{"id":"sel-0108","type":"single","difficulty":1,"stem":"大多数多旋翼飞行器自主飞行过程利用( )实现速度感知。","options":[{"key":"A","text":"惯导"},{"key":"B","text":"空速管"},{"key":"C","text":"GPS"}],"answer":"C","analysis":"提示：速度感知→GPS（感知，螺旋仪）\n解析：大多数多旋翼飞行器自主飞行过程利用GPS实现速度感知。GPS可以通过测量飞行器在不同时刻的位置变化，计算出其速度。惯导主要用于测量飞行器的姿态和加速度等信息，对于速度的测量精度相对较低。空速管在多旋翼飞行器上应用较少。","tags":[],"bankId":"uav-selected"},{"id":"sel-0109","type":"single","difficulty":1,"stem":"无人机飞行控制系统速率陀螺是感知飞行器平台（）的传感器。","options":[{"key":"A","text":"姿态角"},{"key":"B","text":"角速度"},{"key":"C","text":"航向角"}],"answer":"B","analysis":"提示：陀螺仪→角速度\n解析：无人机飞行控制系统速率陀螺是感知飞行器平台角速度的传感器，速率陀螺能够测量飞行器平台在各个方向上的角速度变化，从而为飞行控制系统提供重要的数据以实现稳定的飞行控制。当飞行器进行姿态调整或受到外界干扰时，速率陀螺能迅速感知角速度的变化，并将信息反馈给飞行控制系统进行相应的调整和补偿。","tags":[],"bankId":"uav-selected"},{"id":"sel-0110","type":"single","difficulty":1,"stem":"（）传感器是飞行控制系统的基本传感器之一，用以改善系统的阻尼特性。","options":[{"key":"A","text":"空速"},{"key":"B","text":"迎角、侧滑角"},{"key":"C","text":"角速率"}],"answer":"C","analysis":"提示：角速度改变阻尼\n解析：无人机(无人机定位)飞行控制系统中常用的传感器包括角速率传感器、姿态传感器、导航传感器、高速空速传感器、飞机位置传感器、迎角传感器、过载传感器等。角速率传感器是飞行控制系统的基本传感器之一，用于感受无人机绕机体轴的旋提高系统的转角速率，形成角速率反馈，阻尼特性，提高稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0111","type":"single","difficulty":1,"stem":"轻型微型无人机常用定距螺旋桨，尺寸通常用X*Y来表示，其中Y代表（）。","options":[{"key":"A","text":"螺距"},{"key":"B","text":"叶片数量"},{"key":"C","text":"桨径（螺旋桨直径）"}],"answer":"A","analysis":"提示：X桨径 Y螺距\n解析：轻型、微型无人机常用定距螺旋桨,尺寸通常用X×Y来表示,其中X代表螺旋桨直径,单位为英寸(in), Y代表螺距,即螺旋桨在空气中旋转一圈桨平面经过的距离,单位为英寸(in)。例如,22×10的螺旋桨尺寸为: 桨径22in,约为 55.88cm, 螺距10in,约为25.4cm。","tags":[],"bankId":"uav-selected"},{"id":"sel-0112","type":"single","difficulty":1,"stem":"关于多旋翼飞行器使用的动力电机KV值描述正确的是()。","options":[{"key":"A","text":"外加1V电压对应的每分钟负载转速"},{"key":"B","text":"外加1V电压对应的每分钟空转转速"},{"key":"C","text":"额定电压值时电机每分钟空转转速"}],"answer":"B","analysis":"提示：外加 1v空转转速\n解析：KV值是电机的一个重要参数，它代表了电机在空载状态下，每增加1V电压时转速增加的值。","tags":[],"bankId":"uav-selected"},{"id":"sel-0113","type":"single","difficulty":1,"stem":"KV1000的无刷电机搭配11.1V电池，空载转速是()。","options":[{"key":"A","text":"1110转/分"},{"key":"B","text":"1110转/秒"},{"key":"C","text":"11100转/分"}],"answer":"C","analysis":"提示：1000 x11.1\n解析：空载转速 =KV值 x电池电压=1000 x11.1=11100转/分。","tags":[],"bankId":"uav-selected"},{"id":"sel-0114","type":"single","difficulty":1,"stem":"线圈匝数越高，其KV值()。","options":[{"key":"A","text":"越高"},{"key":"B","text":"越低"},{"key":"C","text":"无关"}],"answer":"B","analysis":"提示：圈数多 KV小\n解析：线圈匝数越高，其 KV 值越低。KV 值是指电机在空载情况下每增加 1V 电压，电机转速的增加量。线圈匝数增加，会使电机的电感增大，电阻也会相应增大。在相同的电压下，电感增大使得电流变化率减小，从而导致电机的转速降低，即KV 值降低。","tags":[],"bankId":"uav-selected"},{"id":"sel-0115","type":"single","difficulty":1,"stem":"某多旋翼电机标有3810字样，意思是指()。","options":[{"key":"A","text":"该电机最大承受38V电压，最小承受10V电压"},{"key":"B","text":"该电机定子直径为38毫米"},{"key":"C","text":"该电机定子高度为38毫米"}],"answer":"B","analysis":"提示：前两位直径，后两位高度\n解析：无人机电机型号中，常见的 “XXYY” 格式，XX代表直径，YY代表高度，单位均为毫米。如 3810，前两位数字XX代表直径，后两位YY代表高度，因此 3810 表示转子直径 38 毫米，高度 10 毫米。（选题中有时候将定子与转子混在一起，不管是定子还是转子，看选项表述，XX代表直径，YY代表高度即为正确选项）","tags":[],"bankId":"uav-selected"},{"id":"sel-0116","type":"single","difficulty":1,"stem":"有2个输出功率相同的电机，前者型号3508，后者型号2820，以下表述错误的是()。","options":[{"key":"A","text":"3508适合带动更大的螺旋桨"},{"key":"B","text":"2820适用于更高的转速"},{"key":"C","text":"尺寸上，2820粗一些，3508高一些"}],"answer":"C","analysis":"提示：选错的。3508直径粗，2820高度高\n解析：电机前两位数字表示电机转子的直径，后两位数字表示电机转子的高度。3508电机 转子直径35mm，转子高度是8mm；更粗2820电机 转子直径28mm，转子高度是20mm。更高因此，3508电机直径更粗，2820电机高度更高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0117","type":"single","difficulty":1,"stem":"关于多旋翼飞行器机桨与电机匹配描述正确的是()。","options":[{"key":"A","text":"大螺旋桨要用低KV电机"},{"key":"B","text":"大螺旋桨要用高KV电机"},{"key":"C","text":"小螺旋桨要用低KV电机"}],"answer":"A","analysis":"提示：大螺旋桨低 KV\n解析：大螺旋桨由于其较大的面积和重量，需要更大的扭力来驱动。因此，选择低KV值的电机更为合适，因为低KV值电机在相同电压下转速较低，但扭力较大，能够更好地匹配大螺旋桨的需求。KV值是每V电压下电机空载下可以达到的转速，单位是rpmV。在相同的电机结构和尺寸下，不同的KV值表示电机绕组的匝数不同。绕线匝数多的电机，KV值低，但扭力大;绕线匝数少的电机，KV值高，但扭力小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0118","type":"single","difficulty":1,"stem":"在高海拔、寒冷、空气稀薄地区，飞行负载不变，飞行状态会()。","options":[{"key":"A","text":"功率损耗增大，飞行时间减少"},{"key":"B","text":"最大起飞重量增加"},{"key":"C","text":"飞行时间变长"}],"answer":"A","analysis":"提示：密度小，升力小，功率损耗多，飞行时间减少 （高原飞行，除了损耗增大，其他都减少）\n解析：在高海拔空气密度低，无人机升力减小。如果飞机负载不变，只能通过飞控或电调，让电机增加转速，提升旋翼的升力，这个过程可以想象成“加油门”，电池的电量消耗的更快，飞行时间就减少了。高转速下的电机发热、空气阻力都是消耗，所以功率损耗也增大。所以本题可以记忆：高原飞行，除了损耗增大，其他都减少","tags":[],"bankId":"uav-selected"},{"id":"sel-0119","type":"single","difficulty":1,"stem":"在高海拔地区，多旋翼飞行器出现较难离地时，最有效的应对措施是()。","options":[{"key":"A","text":"减重"},{"key":"B","text":"更换大桨"},{"key":"C","text":"更换大容量电池"}],"answer":"A","analysis":"提示：减重起飞\n解析：在高海拔地区，多旋翼飞行器出现较难离地时，最有效的应对措施是减重。在高海拔地区，由于空气稀薄，飞行器的升力会受到一定影响，导致起飞难度增加。通过减重，可以减少飞行器在起飞时所需克服的重力，从而降低起飞难度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0120","type":"single","difficulty":1,"stem":"下列哪个是正确的?","options":[{"key":"A","text":"牛顿第三运动定律表明，要获得给定加速度所施加的力的大小取决于无人机的质量"},{"key":"B","text":"牛顿第二运动定律表明作用力和反作用力是大小相等方向相反的"},{"key":"C","text":"如果一个物体处于平衡状态，那么它就有保持这种平衡状态的趋势"}],"answer":"C","analysis":"提示：两个牛顿都不对\n解析：牛顿第三运动定律并不直接说明力与加速度和质量的关系，而是说明作用力和反作用力的关系。牛顿第二运动定律才表明力的大小等于质量乘以加速度。如果一个物体处于平衡状态，那么它就有保持这种平衡状态的趋势。","tags":[],"bankId":"uav-selected"},{"id":"sel-0121","type":"single","difficulty":1,"stem":"机翼1/4弦线与垂直机身中心线的直线之间的夹角称为机翼的()。","options":[{"key":"A","text":"安装角"},{"key":"B","text":"上反角"},{"key":"C","text":"后掠角"}],"answer":"C","analysis":"提示：1/4后掠角\n解析：一般指飞机机翼1/4弦线与垂直机身中心线的直线（或称为机身纵轴垂线）（或称为横轴）之间的夹角，表征机翼向后倾斜的程度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0122","type":"single","difficulty":1,"stem":"在机翼表面附面层由层流状态转变为紊流状态的转捩点的位置()。","options":[{"key":"A","text":"将随着飞行速度的提高而后移"},{"key":"B","text":"将随着飞行速度的提高而前移"},{"key":"C","text":"在飞行M数小于一定值时保持不变"}],"answer":"B","analysis":"提示：捩(liè) 点前移\n解析：飞行速度提高，气流受到的扰动增强，转捩点将随着飞行速度的提高而前移。速度提高，气流的剪切力增大，更容易使层流转变为紊流，转换点向前移动。","tags":[],"bankId":"uav-selected"},{"id":"sel-0123","type":"single","difficulty":1,"stem":"在翼型后部产生涡流，会造成()。","options":[{"key":"A","text":"摩擦阻力增加"},{"key":"B","text":"压差阻力增加"},{"key":"C","text":"升力增加"}],"answer":"B","analysis":"提示：涡流压差（涡轮增压 ）\n解析：翼型后部产生涡流会导致气流分离，使前后压力差增大，从而造成压差阻力增加。","tags":[],"bankId":"uav-selected"},{"id":"sel-0124","type":"single","difficulty":1,"stem":"目前主流的民用无人机所采用的动力系统通常为活塞式发动机和()两种。","options":[{"key":"A","text":"涡扇发动机"},{"key":"B","text":"电动机"},{"key":"C","text":"火箭发动机"}],"answer":"B","analysis":"提示：民用活塞和电动\n解析：目前主流的民用无人机所采用的动力系统通常为活塞式发动机和电动机两种。活塞式发动机通过燃料燃烧产生动力，驱动无人机的螺旋桨或旋翼旋转，从而实现飞行。活塞式发动机的优点在于推力大、续航时间长，但相对而言重量和体积也较大，且维护成本较高。电动机具有体积小、重量轻、效率高、噪音低等优点，特别适合于小型和微型无人机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0125","type":"single","difficulty":1,"stem":"（）是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统，对无人机实现全权控制与管理，因此该子系统之于无人机相当于驾驶员之于有人机，是无人机执行任务的关键。","options":[{"key":"A","text":"飞控计算机"},{"key":"B","text":"导航子系统"},{"key":"C","text":"飞控子系统"}],"answer":"C","analysis":"提示：飞控子是核心是关键\n解析：飞控子系统是无人机完成起飞、空中飞行执行任务、返场回收等整个飞行过程的核心系统，对无人机实现全权控制与管理。因此，该子系统之于无人机相当于驾驶员之于有人机，是无人机执行任务的关键。飞控子系统通过高效的控制算法内核，能够精准地感应并计算出飞行器的飞行姿态等数据，再通过主控制单元实现精准定位悬停和自主平稳飞行。它是无人机完成各种任务的核心。","tags":[],"bankId":"uav-selected"},{"id":"sel-0126","type":"single","difficulty":1,"stem":"无人机在增稳飞行控制模式下，飞控子系统( )控制。","options":[{"key":"A","text":"不参与"},{"key":"B","text":"不确定"},{"key":"C","text":"参与"}],"answer":"C","analysis":"提示：子系统要参与\n解析：无人机在增稳飞行控制模式下，飞控子系统参与控制。增稳飞行控制模式是无人机飞行控制系统中的一种重要模式，它旨在通过飞控子系统的参与，提高无人机在飞行过程中的稳定性和安全性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0127","type":"single","difficulty":1,"stem":"飞控子系统可以不具备如下功能：（）。","options":[{"key":"A","text":"任务分配与航迹规划"},{"key":"B","text":"导航与制导控制"},{"key":"C","text":"姿态稳定与控制"}],"answer":"A","analysis":"提示：选错的。任务分配×\n解析：飞控子系统是无人机完成起飞、空中飞行、执行任务、返场回收等整个飞行过程的核心系统,对无人机实现全权控制与管理,。飞控子系统主要具有如下功能： (1)无人机姿态稳定与控制; (2)与导航子系统协调完成航迹控制; (3)无人机起飞(发射)与着陆(回收)控制: (4)无人机飞行管理; (5)无人机任务设备管理与控制; (6)应急控制; (7)信息收集与传递。","tags":[],"bankId":"uav-selected"},{"id":"sel-0128","type":"single","difficulty":1,"stem":"空气动力学概念中，空气的物理性质主要包括()。","options":[{"key":"A","text":"空气的粘性"},{"key":"B","text":"空气的压缩性"},{"key":"C","text":"空气的粘性和压缩性"}],"answer":"C","analysis":"提示：空气有两性，粘性和压缩性\n解析：空气动力学概念中，空气的物理性质主要包括空气的粘性和压缩性，这两个性质对飞机的飞行性能和气动特性有着重要影响。","tags":[],"bankId":"uav-selected"},{"id":"sel-0129","type":"single","difficulty":1,"stem":"活塞式发动机的爆震最易发生在（）。","options":[{"key":"A","text":"发动机处于高功率状态下工作时"},{"key":"B","text":"发动机处于小转速和大进气压力状态工作"},{"key":"C","text":"发动机处于大转速和小进气压力状态工作"}],"answer":"B","analysis":"提示：爆震--小转速大进气\n解析：爆震是指活塞发动机在压缩冲程中，混合气在火花塞点火之前提前燃烧的现象。在发动机转速较低时，虽然活塞的运动速度相对较慢，但如果此时进气压力较大，混合气在气缸内的压缩程度会更高。高压缩比会增加气缸内的温度和压力，为爆震的发生创造了有利条件。进气压力增大意味着有更多的空气被强制进入气缸，与燃料混合后形成更浓的混合气。在压缩冲程中，这种浓混合气更容易在火花塞点火之前达到自燃温度，从而引发爆震。","tags":[],"bankId":"uav-selected"},{"id":"sel-0130","type":"single","difficulty":1,"stem":"飞机起飞时后缘襟翼放下的角度小于着陆时放下的角度是因为()。","options":[{"key":"A","text":"后缘襟翼放下角度比较小时，机翼的升力系数增加，阻力系数不增加"},{"key":"B","text":"后缘襟翼放下角度比较大时，机翼的阻力系数增加，升力系数不增加"},{"key":"C","text":"后缘襟翼放下角度比较小时，机翼的升力系数增加的效果大于阻力系数增加的效果"}],"answer":"C","analysis":"提示：放下角度看效果\n解析：起飞时，较小的襟翼角度可增加升力系数，同时阻力系数增加相对较少，有利于飞机加速起飞。着陆时，需要更大的襟翼角度以增加阻力，帮助飞机减速着陆。","tags":[],"bankId":"uav-selected"},{"id":"sel-0131","type":"single","difficulty":1,"stem":"地面站显示系统告警信息主要包括（）。","options":[{"key":"A","text":"触觉告警和听觉告警"},{"key":"B","text":"视觉告警和听觉告警"},{"key":"C","text":"视觉告警和触觉告警"}],"answer":"B","analysis":"提示：告警视听\n解析：警信息包括视觉告警和听觉告警。视觉告警：主要包括灯光告警、颜色告警 和文字告警等听觉告警：主要包括语音告警和音调告警等。","tags":[],"bankId":"uav-selected"},{"id":"sel-0132","type":"single","difficulty":1,"stem":"不属于无人机飞控子系统所需要信息的是( )。","options":[{"key":"A","text":"空速"},{"key":"B","text":"经/纬度"},{"key":"C","text":"姿态角"}],"answer":"B","analysis":"提示：不属于。经纬度× 飞控不看经纬度\n解析：无人机飞控子系统主要需要姿态角信息来控制无人机的飞行姿态，需要空速信息来调整飞行速度等。而经/纬度信息主要用于导航定位，不属于飞控子系统直接需要的信息。","tags":[],"bankId":"uav-selected"},{"id":"sel-0133","type":"single","difficulty":1,"stem":"多旋翼飞行器在运输过程中的注意事项是()。","options":[{"key":"A","text":"做好减震措施，固定云台并安装云台固定支架，装箱运输"},{"key":"B","text":"装箱运输，也可行李箱运输"},{"key":"C","text":"可随意拆装运输"}],"answer":"A","analysis":"提示：运输减震\n解析：做好减震措施能够减少运输过程中的震动对飞行器造成的损害。固定云台可以防止云台在运输中受到碰撞和损坏，安装云台固定支架能进一步增强稳定性。装箱运输能够提供更好的保护，避免飞行器受到外界的挤压和碰撞。","tags":[],"bankId":"uav-selected"},{"id":"sel-0134","type":"single","difficulty":1,"stem":"关于部分多旋翼飞行器采用机臂上反角设计，下列描述正确的是？","options":[{"key":"A","text":"提高稳定性"},{"key":"B","text":"提高机动性"},{"key":"C","text":"减少电力损耗"}],"answer":"A","analysis":"提示：上反角→提高稳定性\n解析：机臂上反角能够增加飞行器的滚转稳定性。当飞行器受到侧风等干扰产生滚转趋势时，上反角会产生一个反向的力矩，有助于飞行器恢复平衡，从而提高稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0135","type":"single","difficulty":1,"stem":"无人机能获得平飞航程最长的速度是()。","options":[{"key":"A","text":"飞机平飞有利速度"},{"key":"B","text":"飞机平飞最大速度"},{"key":"C","text":"飞机平飞远航速度"}],"answer":"C","analysis":"提示：航程是远航，航时是有利\n解析：能获得平飞航程最长的速度称远航速度。","tags":[],"bankId":"uav-selected"},{"id":"sel-0136","type":"single","difficulty":1,"stem":"无人机能获得平飞航时最长的速度是()。","options":[{"key":"A","text":"飞机平飞所需速度"},{"key":"B","text":"飞机平飞有利速度"},{"key":"C","text":"飞机平飞最大速度"}],"answer":"B","analysis":"提示：航程是远航，航时是有利\n解析：有利速度，就是平飞所需拉力最小、升阻比最大，同时也是平飞需用功率与速度比值最小的速度。飞行器以有利速度平飞，能够达到最佳飞行效率，以最小的阻力产生足够的升力来维持平飞。","tags":[],"bankId":"uav-selected"},{"id":"sel-0137","type":"single","difficulty":1,"stem":"在平衡外载荷的作用下，飞机飞行的轨迹()。","options":[{"key":"A","text":"一定是直线的"},{"key":"B","text":"一定是水平直线的"},{"key":"C","text":"是直线的或是水平曲线的"}],"answer":"A","analysis":"提示：外载荷平衡→一定是直线\n解析：在平衡外载荷的作用下，飞机将保持稳定的飞行状态。这意味着飞机的飞行轨迹将是直线的，因为所有外载荷都被平衡，没有导致飞机偏离直线轨迹的力或力矩。","tags":[],"bankId":"uav-selected"},{"id":"sel-0138","type":"single","difficulty":1,"stem":"飞机的理论升限( )实用升限，","options":[{"key":"A","text":"等于"},{"key":"B","text":"大于"},{"key":"C","text":"小于"}],"answer":"B","analysis":"提示：理论大于实际\n解析：飞机的理论升限是指在标准大气条件下，飞机能维持平飞的最大高度，而实用升限则考虑了实际大气条件、发动机性能等因素，因此理论升限通常大于实用升限。","tags":[],"bankId":"uav-selected"},{"id":"sel-0139","type":"single","difficulty":1,"stem":"在定高直线飞行中，下面关于飞机升力的说法，正确的是()。","options":[{"key":"A","text":"空速小时必须减小迎角，以产生适当的升力来保持高度"},{"key":"B","text":"空速大时必须减小迎角，以产生适当的升力来保持高度"},{"key":"C","text":"空速大时必须增大迎角，以产生适当的升力来保持高度"}],"answer":"B","analysis":"提示：定高，空大，迎小\n解析：定高直线飞行中，为了保持高度，飞机需要产生适当的升力。当空速增大时，为了保持适当的升力，必须减小迎角，以防止升力过大导致飞机爬升。","tags":[],"bankId":"uav-selected"},{"id":"sel-0140","type":"single","difficulty":1,"stem":"在涡阻力等于其他阻力和的地方()。","options":[{"key":"A","text":"阻力达到最小值"},{"key":"B","text":"阻力达到极小值"},{"key":"C","text":"阻力达到极大值"}],"answer":"A","analysis":"提示：涡阻最小值\n解析：从图上可以看出，当黄线代表的涡阻力（也就是诱导阻力）与绿线代表的废阻力的相等的时候，也就是黄绿色两条线相交，数值一样的时候，相交点向上，对应的总阻力值最低，也就是阻力达到最小值。","tags":[],"bankId":"uav-selected"},{"id":"sel-0141","type":"single","difficulty":1,"stem":"某螺旋桨是正桨，是指()。","options":[{"key":"A","text":"从多轴飞行器下方观察，该螺旋桨逆时针旋转"},{"key":"B","text":"从多轴飞行器上方观察，该螺旋桨顺时针旋转"},{"key":"C","text":"从多轴飞行器上方观察，该螺旋桨逆时针旋转"}],"answer":"C","analysis":"提示：上方观察，正逆反顺\n解析：当从多轴飞行器上方观察时，螺旋桨逆时针旋转，这样的螺旋桨被称为正桨。相反如果从同一视角观察，螺旋桨顺时针旋转，则被称为反桨。","tags":[],"bankId":"uav-selected"},{"id":"sel-0142","type":"single","difficulty":1,"stem":"（）主要是由飞行操纵、任务载荷控制、数据链路控制和通信指挥等组成，可完成对无人机机载任务载荷等的操纵控制。","options":[{"key":"A","text":"指挥处理中心"},{"key":"B","text":"无人机控制站"},{"key":"C","text":"载荷控制站"}],"answer":"B","analysis":"提示：有载荷又有指挥，选控制站\n解析：无人机控制站主要是由飞行操纵、任务载荷控制、数据链路控制和通信指挥等组成，可完成对无人机机载任务载荷等的操纵控制。飞行操纵:负责无人机的飞行控制，包括起飞、降落、飞行姿态调整等。无人机通常搭载各种任务载荷，如相机、传感器、探测器等，用于执行特定的任务。数据链路是无人机与地面控制站之间的通信桥梁。通信指挥系统负责无人机与地面控制站之间的指令传递和信息交流。","tags":[],"bankId":"uav-selected"},{"id":"sel-0143","type":"single","difficulty":1,"stem":"关于伞降回收以下正确的是()。","options":[{"key":"A","text":"回收伞均由主伞、减速伞和阻力伞三级伞组成"},{"key":"B","text":"当无人机完成任务后，地面站发遥控指令给无人机或由无人机自主执行，使无人机减速，降高及发动机停车"},{"key":"C","text":"无人机悬挂在主伞下慢慢着陆，机下触地开关接通，使主伞收回无人机内，这是对降落伞回收过程最简单的描述"}],"answer":"B","analysis":"提示：伞降→停车\n解析：伞降回收过程中，当无人机完成任务后会接收地面站的遥控指令或由无人机自主执行，进行减速、降高及发动机停车等操作，以确保安全着陆。","tags":[],"bankId":"uav-selected"},{"id":"sel-0144","type":"single","difficulty":1,"stem":"以下地面链路天线哪一种是定向天线?","options":[{"key":"A","text":"八木天线"},{"key":"B","text":"鞭状天线/蘑菇头天线"},{"key":"C","text":"三叶草天线"}],"answer":"A","analysis":"提示：定向：八木 全向：蘑菇头、鞭状\n解析：八木天线是定向天线。这种天线的设计特点使其具有特定的辐射方向性，能够在特定方向上提供较强的信号传输能力，而在其他方向上的信号则相对较弱。","tags":[],"bankId":"uav-selected"},{"id":"sel-0145","type":"single","difficulty":1,"stem":"对于下滑中的飞机来说，升力和重力关系是( )。","options":[{"key":"A","text":"L=Wgcosɑ"},{"key":"B","text":"L=Wgsinɑ"},{"key":"C","text":"L=Wg"}],"answer":"A","analysis":"提示：cos\n解析：下滑中的飞机，升力L与重力W的关系是L=Wgcosɑ，其中ɑ是下滑角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0146","type":"single","difficulty":1,"stem":"一定质量的气体具有下列特性（）。","options":[{"key":"A","text":"压力不变时，体积和温度成反比"},{"key":"B","text":"体积不变时，压力和温度成正比"},{"key":"C","text":"温度不变时，压力与体积成正比"}],"answer":"B","analysis":"提示：体积不变，压温正\n解析：PV = nRT， 体积不变时，压力和温度成正比 压力不变时，体积与温度成正比 温度不变时，压力与体积成反比","tags":[],"bankId":"uav-selected"},{"id":"sel-0147","type":"single","difficulty":1,"stem":"气体的压力P密度ρ温度T三者之间的变化关系是(R为理想气体常数）（ ）。","options":[{"key":"A","text":"T=PRρ"},{"key":"B","text":"P=Rρ/T"},{"key":"C","text":"P=RρT"}],"answer":"C","analysis":"提示：P=RρT （左边压力，右边三个并列相乘，都与压力成正比）\n解析：根据理想气体状态方程PV=nRT(其中n为物质的量，V为体积)，变形可得P=nRT/V，而密度ρ=n/V，所以P=RρT。","tags":[],"bankId":"uav-selected"},{"id":"sel-0148","type":"single","difficulty":1,"stem":"飞机升力的大小与空速的关系是()。","options":[{"key":"A","text":"与空速成正比"},{"key":"B","text":"与空速无关"},{"key":"C","text":"与空速的平方成正比"}],"answer":"C","analysis":"提示：空速带平方²\n解析：L=1/2ρv²SCL，即:升力L=1/2*空气密度*速度的平方*机翼面积*升力系数。飞机升力的大小与空速的关系是与空速的平方成正比。机翼的升力来自于流过其上下表面气流的速度差，空速决定了这一速度差，从而影响升力的大小。空速越大，升力也随之增大，且增大的比例与空速的平方成正比。","tags":[],"bankId":"uav-selected"},{"id":"sel-0149","type":"single","difficulty":1,"stem":"一定体积的容器中，空气压力()。","options":[{"key":"A","text":"与空气密度和空气温度乘积成正比"},{"key":"B","text":"与空气密度和空气温度乘积成反比"},{"key":"C","text":"与空气密度和空气绝对温度乘积成正比"}],"answer":"C","analysis":"提示：P=RρT （左边压力，右边三个并列相乘，都与压力成正比） T代表绝对温度\n解析：理想气体状态方程P=RρT。其中，P代表压力，ρ代表密度，R是理想气体常数，T代表绝对温度。因此与空气密度和空气绝对温度乘积成正比。","tags":[],"bankId":"uav-selected"},{"id":"sel-0150","type":"single","difficulty":1,"stem":"气温、气压和空气湿度的变化都会对飞机性能和仪表指示造成一定的影响，这种影响主要通过他们对空气密度的影响而实现，下列描述哪个正确？","options":[{"key":"A","text":"空气密度与气压成正比，与气温成反比"},{"key":"B","text":"空气密度与气压成反比，与气温成正比"},{"key":"C","text":"空气密度与气压成正比，与气温也成正比"}],"answer":"A","analysis":"提示：气温高，密度小，气压小（密度 气压正 气温反）\n解析：根据P=ρVg/S，气压与密度成正比，相同温度下，空气密度越大，气压越大。根据PV=nRT，n为摩尔数，R为常量，等质量的气体，压强不变的情况下，温度和密度成反比","tags":[],"bankId":"uav-selected"},{"id":"sel-0151","type":"single","difficulty":1,"stem":"当恒定角速度水平转弯时空速增加，转弯半径()。","options":[{"key":"A","text":"不变"},{"key":"B","text":"减少"},{"key":"C","text":"增加"}],"answer":"C","analysis":"提示：V=Wr，半径跟速度成正（跟汽车转弯一样，开的快弯转的大）\n解析：当恒定角速度水平转弯时空速增加，转弯半径会增加。就像汽车在弯道上速度越快，转弯所需的半径就越大，飞机也是同样的道理，空速增加会导致转弯半径增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0152","type":"single","difficulty":1,"stem":"流管中空气的动压()。","options":[{"key":"A","text":"仅与空气密度成正比"},{"key":"B","text":"与空气速度和空气密度成正比"},{"key":"C","text":"与空气速度平方和空气密度成正比"}],"answer":"C","analysis":"提示：P=1/2ρv²，带平方\n解析：流管中空气的动压与空气速度的平方和空气密度成正比。速度越大、密度越大，动压越大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0153","type":"single","difficulty":1,"stem":"计算动压时需要哪些数据?","options":[{"key":"A","text":"大气压力和速度"},{"key":"B","text":"空气密度和阻力"},{"key":"C","text":"空气密度和速度"}],"answer":"C","analysis":"提示：计算动压，要双度\n解析：计算动压需空气密度和速度。P=1/2ρv²，ρ空气密度v速度，用于衡量流体的动能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0154","type":"single","difficulty":1,"stem":"关于动压和静压的方向，以下哪一个是正确的?","options":[{"key":"A","text":"动压和静压的方向都是与运动的方向一致"},{"key":"B","text":"动压和静压都作用在任意方向"},{"key":"C","text":"动压作用在流体的流动方向，静压作用在任意方向"}],"answer":"C","analysis":"提示：动压流体 静压任意\n解析：动压作用在流体流动方向，青静压作用在任意方向。动压与流体流动相关，静压则不受方向限制。","tags":[],"bankId":"uav-selected"},{"id":"sel-0155","type":"single","difficulty":1,"stem":"下列关于动压的哪种说法是正确的?","options":[{"key":"A","text":"总压与静压之和"},{"key":"B","text":"总压与静压之差"},{"key":"C","text":"动压和速度成正比"}],"answer":"B","analysis":"提示：总压=动压十静压\n解析：在低速、可近似视为不可压缩的气流中，动压＝总压－静压","tags":[],"bankId":"uav-selected"},{"id":"sel-0156","type":"single","difficulty":1,"stem":"无人机系统的超视距驾驶员(机长)是指( )。","options":[{"key":"A","text":"操控无人机的人"},{"key":"B","text":"协助操控无人机的人"},{"key":"C","text":"负责整个无人机系统运行和安全的驾驶员"}],"answer":"C","analysis":"提示：机长负责整个\n解析：无人机系统视距内驾驶员，由运营人指派对无人机的运行负有必不可少职责并在飞行期间适时操纵无人机的人。无人机系统超视距驾驶员(机长)，是指在系统运行时间内负责整个无人机系统运行和安全的驾驶员。","tags":[],"bankId":"uav-selected"},{"id":"sel-0157","type":"single","difficulty":1,"stem":"谁对民用无人机系统运行遵守飞行基本规则负责？","options":[{"key":"A","text":"机长"},{"key":"B","text":"民航局及其地区管理局"},{"key":"C","text":"航空单位负责人"}],"answer":"A","analysis":"提示：机长负责基本规则\n解析：《中华人民共和国飞行基本规则》第五条航空单位的负责人对本单位遵守本规则负责。机长对本空勤组成员遵守本规则负责。","tags":[],"bankId":"uav-selected"},{"id":"sel-0158","type":"single","difficulty":1,"stem":"空域管理的具体办法由（）制定","options":[{"key":"A","text":"民用航空局"},{"key":"B","text":"中央军事委员会"},{"key":"C","text":"国务院和中央军事委员会"}],"answer":"C","analysis":"提示：具体--国+央（除了进出国家领空归空军管，其他有国务院+中央军委，就选国+央）\n解析：《中华人民共和国民用航空法》第七十二条:空域管理的具体办法，由国务院、中央军事委员会制定。","tags":[],"bankId":"uav-selected"},{"id":"sel-0159","type":"single","difficulty":1,"stem":"在一个划定的管制空域内，由（）负责该空域内的航空器的空中交通管制","options":[{"key":"A","text":"军航或民航的一个空中交通管制单位"},{"key":"B","text":"军航和民航的各一个空中交通管制单位"},{"key":"C","text":"军航的一个空中交通管制单位"}],"answer":"A","analysis":"提示：或，谁都行就一个\n解析：本题关注的是管制空域内的空中交通管制责任。在一个划定的管制空域内，为了保障飞行安全和秩序，需要有一个统一的空中交通管制单位来负责。这个单位可以是军航或民航的一个空中交通管制单位。","tags":[],"bankId":"uav-selected"},{"id":"sel-0160","type":"single","difficulty":1,"stem":"无识别标志的航空器因特殊情况需要飞行的（）。","options":[{"key":"A","text":"必须经中国人民解放军空军批准"},{"key":"B","text":"必须经相关管制单位批准"},{"key":"C","text":"必须经中国民用航空总局空中交通管理局批准"}],"answer":"A","analysis":"提示：无识别标志，需空军批准\n解析：《中华人民共和国飞行基本规则》第四十一条:在中华人民共和国领空飞行的航空器，必须标明明显的识别标志，禁止无识别标志的航空器飞行。无识别标志的航空器因特殊情况需要飞行的，必须经中国人民解放军空军批准。航空器的识别标志必须按照国家有关规定获得批准。","tags":[],"bankId":"uav-selected"},{"id":"sel-0161","type":"single","difficulty":1,"stem":"民用航空器的适航管理由（）负责","options":[{"key":"A","text":"国务院"},{"key":"B","text":"中央军委"},{"key":"C","text":"民航局"}],"answer":"C","analysis":"提示：适航-民航局\n解析：《中国民用航空器适航管理条例》第四条民用航空器的适航管理由中国民用航空局(以下简称民航局)负责。","tags":[],"bankId":"uav-selected"},{"id":"sel-0162","type":"single","difficulty":1,"stem":"民用无人机视距内运行是指航空器处于驾驶员或观测员目视视距内半径（）米，人机相对高度低于（）米的区域内","options":[{"key":"A","text":"100、50"},{"key":"B","text":"120、500"},{"key":"C","text":"500、120"}],"answer":"C","analysis":"提示：半径500 m，高度120 m\n解析：《民用无人机驾驶员管理规定》规定，视距内(VLOS:Visual Line of Sight)运行，无人机在驾驶员或观测员与无人机保持直接目视视觉接触的范围内运行，且该范围为目视视距内半径不大于 500 米，人机相对高度不大于 120 米。在本规定中作为驾驶员等级中的一种。","tags":[],"bankId":"uav-selected"},{"id":"sel-0163","type":"single","difficulty":1,"stem":"伯努利方程的使用条件是()。","options":[{"key":"A","text":"只要是理想的不可压缩流体"},{"key":"B","text":"只要是理想的与外界无能量交换的流体"},{"key":"C","text":"必须是理想的、不可压缩、且与外界无能量交换的流体"}],"answer":"C","analysis":"提示：“两者都” C=A+B 伯努利适用条件严格，有5条，选最长的那的。\n解析：严格说来，伯努利定理在下列条件下，才是适用的： 1.气流是连续、稳定的，即流动是定常的； 2.流动的空气与外界没有能量交换，即空气是绝热的； 3.空气没有粘性，即空气为理想流体； 4.空气密度是不变，即空气为不可压流； 5.同一条流线或同一条流管上。","tags":[],"bankId":"uav-selected"},{"id":"sel-0164","type":"single","difficulty":1,"stem":"伯努利方程适用于()。","options":[{"key":"A","text":"低速气流"},{"key":"B","text":"高速气流"},{"key":"C","text":"适用于各种速度的气流"}],"answer":"A","analysis":"提示：伯努利，低速\n解析：伯努利方程主要适用于低速气流的情况。在高速气流中，由于流体的压缩性和粘性等因素的影响，伯努利方程可能不再适用。","tags":[],"bankId":"uav-selected"},{"id":"sel-0165","type":"single","difficulty":1,"stem":"不属于影响机翼升力系数的因素是()。","options":[{"key":"A","text":"翼剖面形状"},{"key":"B","text":"迎角"},{"key":"C","text":"空气密度"}],"answer":"C","analysis":"提示：空气密度影响升力，不是升力系数\n解析：机翼升力系数主要受机翼形状和流体流过机翼时的角度影响。翼剖面形状(也称为翼型)直接影响升力的产生，因为它决定了流体流过机翼时的速度和压力分布。迎角是机翼与来流方向的夹角，它也会影响升力系数，因为迎角的变化会改变流体流过机翼的方式，从而影响升力的产生。","tags":[],"bankId":"uav-selected"},{"id":"sel-0166","type":"single","difficulty":1,"stem":"测量机翼的翼展是从()。","options":[{"key":"A","text":"左翼尖到右翼尖"},{"key":"B","text":"机身中心线到翼尖"},{"key":"C","text":"机翼前缘到后缘"}],"answer":"A","analysis":"提示：弦缘 展尖\n解析：测量机翼的翼展是从左翼尖到右翼尖。翼展是机翼左右两端的最大直线距离，影响飞机的稳定性和机动性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0167","type":"single","difficulty":1,"stem":"层流翼型的特点是()。","options":[{"key":"A","text":"前缘半径大，后部尖的水滴形"},{"key":"B","text":"最大厚度靠后"},{"key":"C","text":"前缘尖的菱形"}],"answer":"B","analysis":"提示：层流翼，最大厚度靠后\n解析：层流翼型的特点是最大厚度靠后。这种设计有助于保持翼面大范围层流，减小阻力，是翼型发展的重要里程碑。","tags":[],"bankId":"uav-selected"},{"id":"sel-0168","type":"single","difficulty":1,"stem":"从原点作极曲线的切线，切点所对应的迎角值是()。","options":[{"key":"A","text":"最大迎角"},{"key":"B","text":"有利迎角"},{"key":"C","text":"最小迎角"}],"answer":"B","analysis":"提示：极曲线，有利迎角\n解析：从原点作极曲线的切线，切点所对应的迎角值是有利迎角。这是因为极曲线表示升力系数随迎角的变化关系，切点处升力系数增加的速度最快，对应的是有利迎角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0169","type":"single","difficulty":1,"stem":"当飞机减小速度水平飞行时()。","options":[{"key":"A","text":"增大迎角以提高升力"},{"key":"B","text":"减小迎角以减小阻力"},{"key":"C","text":"保持迎角不变以防止失速"}],"answer":"A","analysis":"提示：小速度，大迎角\n解析：当飞机减小速度水平飞行时，为了保持升力不变，需要增大迎角以提高升力。这是因为升力与速度的平方成正比，速度减小会导致升力减小，增大迎角可以补偿这-减小，保持升力不变。","tags":[],"bankId":"uav-selected"},{"id":"sel-0170","type":"single","difficulty":1,"stem":"当空气在管道中低速流动时，由伯努利定理可知（）。","options":[{"key":"A","text":"流速大的地方，静压大"},{"key":"B","text":"流速大的地方，静压小"},{"key":"C","text":"流速大的地方，总压大"}],"answer":"B","analysis":"提示：伯努利“流速大静压小”（或者说压强小）\n解析：计算动压的公式为q = 1/2 × ρ × v²根据动压计算公式 q = 1/2 × ρ × v² , 可得出结论：流速大的地方，动压大（v↑ q↑）；根据伯努利定理“动压+静压=总压”，可得出结论：总压不变时，动压大了，静压就小。核心逻辑：低速流动下总压恒定 → 流速↑→动压↑→静压↓核心结论：伯努利“流速大静压小”（或者说压强小）","tags":[],"bankId":"uav-selected"},{"id":"sel-0171","type":"single","difficulty":1,"stem":"当空气在管道中流动时，由伯努利定理可知()。","options":[{"key":"A","text":"凡是流速大的地方，压强就大（指静压）"},{"key":"B","text":"凡是流速小的地方，压强就小（指静压）"},{"key":"C","text":"凡是流速大的地方，压强就小（指静压）"}],"answer":"C","analysis":"提示：伯努利“流速大静压小”（或者说压强小）\n解析：计算动压的公式为q = 1/2 × ρ × v²根据动压计算公式 q = 1/2 × ρ × v² , 可得出结论：流速大的地方，动压大（v↑ q↑）；根据伯努利定理“动压+静压=总压”，可得出结论：总压不变时，动压大了，静压就小。核心逻辑：低速流动下总压恒定 → 流速↑→动压↑→静压↓核心结论：伯努利“流速大静压小”（或者说压强小）","tags":[],"bankId":"uav-selected"},{"id":"sel-0172","type":"single","difficulty":1,"stem":"当迎角达到临界迎角时()。","options":[{"key":"A","text":"升力突然大大增加，而阻力迅速减小"},{"key":"B","text":"升力突然大大降低，而阻力迅速增加"},{"key":"C","text":"升力和阻力同时大大增加"}],"answer":"B","analysis":"提示：临界迎角，升力减小，阻力增加\n解析：当迎角达到临界迎角时，升力会突然大大降低，而阻力会迅速增加。这是因为临界迎角是飞机升力系数最大的迎角，超过这个迎角，升力系数会迅速下降，同时阻力系数会迅速上升，导致飞机的升力突然降低，阻力迅速增加。","tags":[],"bankId":"uav-selected"},{"id":"sel-0173","type":"single","difficulty":1,"stem":"对低速气流，由伯努利方程可以得出()。","options":[{"key":"A","text":"流管内气流速度增加，空气静压也增加"},{"key":"B","text":"流管截面积减小，空气静压增加"},{"key":"C","text":"流管内气流速度增加，空气静压减小"}],"answer":"C","analysis":"提示：伯努利，流速大，压强小\n解析：对低速气流，由伯努利方程可以得出，流管内气流速度增加，空气静压减小。这是因为伯努利方程描述了流体在流动过程中速度、压强和高度之间的关系，对于低速气流，当流速增加时，流体的静压会减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0174","type":"single","difficulty":1,"stem":"对起飞降落安全性造成不利影响的是()。","options":[{"key":"A","text":"稳定的逆风场"},{"key":"B","text":"跑道上的微冲气流"},{"key":"C","text":"稳定的上升气流"}],"answer":"B","analysis":"提示：起飞降落在跑道，微冲\n解析：在飞机的起飞和降落过程中，跑道上的微冲气流可能对飞行安全造成不利影响。微冲气流是指跑道附近由于地形、建筑物等因素造成的局部气流扰动，这些扰动可能使飞机在接地瞬间发生突然跳跃、颠簸或偏离跑道，从而增加事故风险。","tags":[],"bankId":"uav-selected"},{"id":"sel-0175","type":"single","difficulty":1,"stem":"对一般翼型来说，下列说法中哪个是正确的?","options":[{"key":"A","text":"当迎角为零时，升力不为零"},{"key":"B","text":"当翼剖面有一个正迎角时，上翼面处的流线比下翼面处的流线疏"},{"key":"C","text":"当翼剖面有一个正迎角时，上翼面处的流速小于下翼面处的流速"}],"answer":"A","analysis":"提示：迎角为 0，升力不为0\n解析：对于一般翼型，即使迎角为零，由于翼型上下表面的弯曲形状不同，仍然会产生一定的升力。 当翼剖面有一个正迎角时，上翼面处的流线比下翼面处的流线密，因为气流在流经上翼面时需要更快地流动以在相同时间内通过更长的路程。同时，上翼面处的流速大于下翼面处的流速。","tags":[],"bankId":"uav-selected"},{"id":"sel-0176","type":"single","difficulty":1,"stem":"对于非对称翼型的零升迎角是()。","options":[{"key":"A","text":"一个小的正迎角"},{"key":"B","text":"一个小的负迎角"},{"key":"C","text":"失速迎角"}],"answer":"B","analysis":"提示：对称是正，非对称是负\n解析：非对称翼型通常设计为上翼面凸起较大，以便在零迎角或负迎角时产生升力。因此，零升迎角是一个小的负迎角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0177","type":"single","difficulty":1,"stem":"飞机飞行中，机翼升力等于零时的迎角称为()。","options":[{"key":"A","text":"零升迎角"},{"key":"B","text":"失速迎角"},{"key":"C","text":"零迎角"}],"answer":"A","analysis":"提示：升力为 0，升迎角为 0\n解析：零升迎角是指飞机飞行中，机翼升力等于零时的迎角。失速迎角是指飞机超过此迎角后，机翼上的气流将发生严重分离，导致升力急剧下降，飞机可能失控的迎角。零迎角则是指飞机的迎角为零，即飞机机翼与气流方向平行时的状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0178","type":"single","difficulty":1,"stem":"飞机上不同部件的连接处装有整流包皮，它的主要作用是()。","options":[{"key":"A","text":"减小摩擦阻力"},{"key":"B","text":"减小干扰阻力"},{"key":"C","text":"减小诱导阻力"}],"answer":"B","analysis":"提示：整包→减小干扰阻力（包干）\n解析：整流包皮是安装在飞机上不同部件连接处的一种装置，其主要作用是减小由于部件连接处形状不规则而产生的干扰阻力。干扰阻力是由于气流在飞机表面遇到突出物或形状变化时产生的，它会增加飞机的总阻力。整流包皮通过平滑连接处的形状，减少气流分离和涡流的形成，从而降低干扰阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0179","type":"single","difficulty":1,"stem":"飞机上产生的摩擦阻力与大气的哪种物理性质有关?","options":[{"key":"A","text":"可压缩性"},{"key":"B","text":"粘性"},{"key":"C","text":"温度"}],"answer":"B","analysis":"提示：粘性→气流分子间内摩擦力\n解析：摩擦阻力是飞机在飞行过程中与大气之间由于粘性而产生的阻力。大气的粘性是指气流分子之间的内摩擦力，它使得气流在飞机表面产生切向应力，从而形成摩擦阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0180","type":"single","difficulty":1,"stem":"飞机上产生的摩擦阻力与什么因素有关?","options":[{"key":"A","text":"与大气可压缩性有关"},{"key":"B","text":"与大气的粘性、飞机表面状况及周围气流接触的飞机表面面积有关"},{"key":"C","text":"仅与大气的温度有关"}],"answer":"B","analysis":"提示：摩擦阻力→大气粘性+粗糙表面+接触面\n解析：摩擦阻力是飞机在飞行过程中与大气之间由于粘性而产生的阻力。它的大小主要取决于大气的粘性、飞机表面的粗糙度以及飞机与气流接触的表面积。","tags":[],"bankId":"uav-selected"},{"id":"sel-0181","type":"single","difficulty":1,"stem":"飞机升力的大小与（）。","options":[{"key":"A","text":"空气密度成正比"},{"key":"B","text":"空气密度无关"},{"key":"C","text":"空气密度成反比"}],"answer":"A","analysis":"提示：密度大，升力大，成正比\n解析：飞机升力的大小与空气密度有着直接的关系。根据伯努利定理和升力产生的原理，飞机升力是由于机翼上下表面的气流速度差异而产生的。而空气密度越大，相同速度下的气流产生的动压也越大，从而导致升力增加。因此，飞机升力的大小与空气密度成正比。","tags":[],"bankId":"uav-selected"},{"id":"sel-0182","type":"single","difficulty":1,"stem":"飞机升阻比值的大小主要随下列哪项因素变化( )。","options":[{"key":"A","text":"飞行速度"},{"key":"B","text":"飞行迎角"},{"key":"C","text":"机翼面积"}],"answer":"B","analysis":"提示：升阻比→迎角\n解析：定义：升阻比是相同迎角下，升力系数与阻力系数之比。影响因素：影响升力系数主要因素：迎角、翼型等，影响阻力系数主要因素：迎角、外形粗糙度等两者叠加考虑，对升阻比影响最大的因素就是“迎角”","tags":[],"bankId":"uav-selected"},{"id":"sel-0183","type":"single","difficulty":1,"stem":"飞机在飞行时，升力方向是()。","options":[{"key":"A","text":"与相对气流方向垂直"},{"key":"B","text":"与地面垂直"},{"key":"C","text":"与翼弦垂直"}],"answer":"A","analysis":"提示：升力与气流垂直\n解析：因为升力由空气作用产生，不管方向如何，选项只与气流相关，所以直接选与气流相关的选项。另外，根据气动力是合力这个知识点，该合力垂直于相对气流方向的分量就是升力，平行于相对气流的分量是阻力；可总结：升力与气流方向垂直，阻力与气流方向平行","tags":[],"bankId":"uav-selected"},{"id":"sel-0184","type":"single","difficulty":1,"stem":"关于动压和静压的方向，以下哪一个是正确的?","options":[{"key":"A","text":"动压和静压的方向都是与运动的方向一致"},{"key":"B","text":"动压和静压都作用在任意方向"},{"key":"C","text":"动压作用在流体的流动方向，静压作用在任意方向"}],"answer":"C","analysis":"提示：动压流体 静压任意\n解析：动压作用在流体流动方向，青静压作用在任意方向。动压与流体流动相关，静压则不受方向限制。","tags":[],"bankId":"uav-selected"},{"id":"sel-0185","type":"single","difficulty":1,"stem":"关于升阻比下列哪个说法正确?","options":[{"key":"A","text":"在最大升力系数时阻力一定最小"},{"key":"B","text":"最大升阻比时，一定是达到临界攻角"},{"key":"C","text":"升阻比随迎角的改变而改变"}],"answer":"C","analysis":"提示：迎角改变升阻比\n解析：升阻比随迎角改变而改变。不同迎角下升力和阻力变化，从而影响升阻比的大小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0186","type":"single","difficulty":1,"stem":"合理布局飞机结构的位置，是为了减小（）。","options":[{"key":"A","text":"摩擦阻力"},{"key":"B","text":"压差阻力"},{"key":"C","text":"干扰阻力"}],"answer":"C","analysis":"提示：结构合理，抗干扰（散部件整包也为了减少干扰阻力）\n解析：合理布局飞机结构位置主要是为减小干扰阻力。避免部件间气流相互干扰，从而降低阻力，提高飞行效率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0187","type":"single","difficulty":1,"stem":"机翼的安装角是()。","options":[{"key":"A","text":"翼弦与相对气流方向的夹角"},{"key":"B","text":"翼弦与机身纵轴之间所夹锐角"},{"key":"C","text":"翼弦与水平面之间所夹的锐角"}],"answer":"B","analysis":"提示：安装角安在机身上\n解析：机翼安装角指翼弦与机身纵轴之间所夹锐角。合适的安装角可保证飞机的飞行姿态和性能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0188","type":"single","difficulty":1,"stem":"机翼的弦线与相对气流方向之间的夹角称为（）。","options":[{"key":"A","text":"机翼的安装角"},{"key":"B","text":"机翼的上反角"},{"key":"C","text":"迎角"}],"answer":"C","analysis":"提示：线与气流对迎角\n解析：迎角（又称攻角，常用符号α表示）是指机翼翼弦线（机翼剖面前缘与后缘的连线）与相对气流方向（空气相对于机翼的流动方向）之间的夹角。通过图片我们可以看出，迎角定义的是“ 机翼与气流之间的关系”不是飞机机身与水平线的夹角，那个是俯仰角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0189","type":"single","difficulty":1,"stem":"机翼的压力中心()。","options":[{"key":"A","text":"迎角改变时升力增量作用线与翼弦的交点"},{"key":"B","text":"翼弦与机翼空气动力作用线的交点"},{"key":"C","text":"翼弦与最大厚度线的交点"}],"answer":"B","analysis":"提示：翼弦与动力线交点，压力对动力\n解析：机翼的压力中心是翼弦与机翼空气动力作用线的交点。它随迎角等因素变化而改变位置。","tags":[],"bankId":"uav-selected"},{"id":"sel-0190","type":"single","difficulty":1,"stem":"机翼的展弦比是()。","options":[{"key":"A","text":"展长与机翼最大厚度之比"},{"key":"B","text":"展长与翼尖弦长之比"},{"key":"C","text":"展长与平均几何弦长之比"}],"answer":"C","analysis":"提示：展旋比，有几何\n解析：展弦比是展长与平均几何弦长之比。它影响机翼的气动特性，展弦比大，诱导阻力小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0191","type":"single","difficulty":1,"stem":"机翼空气动力受力最大的是()。","options":[{"key":"A","text":"机翼上表面压力"},{"key":"B","text":"机翼下表面压力"},{"key":"C","text":"机翼上表面负压"}],"answer":"C","analysis":"提示：机翼上表面负压（上负）\n解析：机翼上表面负压产生的吸力通常较大，是机翼空气动力受力最大的部分，对产生升力起关键作用。","tags":[],"bankId":"uav-selected"},{"id":"sel-0192","type":"single","difficulty":1,"stem":"机翼升力系数与哪些因素有关?","options":[{"key":"A","text":"仅与翼剖面形状有关"},{"key":"B","text":"与翼剖面形状和攻角有关"},{"key":"C","text":"仅与攻角有关"}],"answer":"B","analysis":"提示：升力系数，形状和攻角有关 （仅是绝对字，不能选）\n解析：机翼升力系数与翼剖面形状和攻角有关。不同翼型、不同攻角都会导致升力系数变化。","tags":[],"bankId":"uav-selected"},{"id":"sel-0193","type":"single","difficulty":1,"stem":"假设其他条件不变，空气湿度大()。","options":[{"key":"A","text":"空气密度大，起飞滑跑距离长"},{"key":"B","text":"空气密度小，起飞滑跑距离长"},{"key":"C","text":"空气密度大，起飞滑跑距离短"}],"answer":"B","analysis":"提示：湿度大，密度小 湿度大，脚滑，起飞距离长\n解析：空气湿度大通常导致空气密度小，飞机获得的升力减小，起飞滑跑距离变长。","tags":[],"bankId":"uav-selected"},{"id":"sel-0194","type":"single","difficulty":1,"stem":"减少飞机摩擦阻力的措施是()。","options":[{"key":"A","text":"保持飞机表面光洁度"},{"key":"B","text":"减小迎风面积"},{"key":"C","text":"增大后掠角"}],"answer":"A","analysis":"提示：摩擦阻力→大气粘性+粗糙表面+接触面\n解析：保持飞机表面光洁度能减小空气与表面的摩擦，从而减少摩擦阻力。减小迎风面积主要影响压差阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0195","type":"single","difficulty":1,"stem":"减小飞机外形的迎风面积，目的是为了减小飞机的（）。","options":[{"key":"A","text":"摩擦阻力"},{"key":"B","text":"压差阻力"},{"key":"C","text":"诱导阻力"}],"answer":"B","analysis":"提示：压差阻力→迎风面积 （面积压差，结构整包干扰）\n解析：减小迎风面积主要是为了减小压差阻力。迎风面积小，前后压力差减小，压差阻力随之减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0196","type":"single","difficulty":1,"stem":"流体的伯努利定理()。","options":[{"key":"A","text":"适用于不可压缩的理想流体"},{"key":"B","text":"适用于粘性的理想流体"},{"key":"C","text":"适用于不可压缩的粘性流体"}],"answer":"A","analysis":"提示：伯努利→理想、不可压缩、与外界无能量变换\n解析：体的伯努利定理适用于不可压缩的理想流体。在这种情况下，可以通过压力、速度和高度的关系来分析流体的流动特性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0197","type":"single","difficulty":1,"stem":"流体的连续性方程()。","options":[{"key":"A","text":"只适用于理想流体"},{"key":"B","text":"适用于可压缩和不可压缩流体的稳定管流"},{"key":"C","text":"只适用于不可压缩流体的稳定管流"}],"answer":"B","analysis":"提示：连续性方程→可压缩+不可压缩\n解析：连续性方程的本质是质量守恒定律在流体流动中的应用。其一般形式既适用于可压缩流体（密度ρ变化），也适用于不可压缩流体（密度ρ为常数）。它不仅适用于稳态流动，也适用于非稳态流动；不仅适用于管流，也适用于任意三维流场。B包含在其中，故B为正确选项。这题关于流体的连续性方程适用于哪种流体，国内教材《工程流体力学》（例如，闻德荪主编，高等教育出版社，普通高等教育 “十一五” 国家级规划教材）为例，书中明确指出：连续性方程是基于质量守恒定律推导的，它适用于任何连续介质流体，无论是理想流体还是实际流体，可压缩流体还是不可压缩流体，只要流动是连续的，连续性方程就成立。对于稳定管流，其表达式可根据流体压缩性进一步简化。国外White、Batchelor 等权威教材均指出，连续性方程是质量守恒对“任何连续介质流体”的普适表述，既不受“不可压缩”限制，也不受“理想（无粘）”限制，只要流动是稳定的管流即可。","tags":[],"bankId":"uav-selected"},{"id":"sel-0198","type":"single","difficulty":1,"stem":"流体在管道中以稳定低度流动时，如果管道由粗变细，则流体的流速（）。","options":[{"key":"A","text":"增大"},{"key":"B","text":"减小"},{"key":"C","text":"保持不变"}],"answer":"A","analysis":"提示：管道截面积↓，速度↑\n解析：根据连续性方程：A1V1=A2V2稳定低速流动时，可将流体近似视为不可压缩流体。管道由粗变细，横截面积减小，为保持单位时间内流过的流量不变，流速就会增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0199","type":"single","difficulty":1,"stem":"气流产生下洗是由于()。","options":[{"key":"A","text":"分离点后出现旋涡的影响"},{"key":"B","text":"转捩点后紊流的影响"},{"key":"C","text":"机翼上下表面存在压力差的影响"}],"answer":"C","analysis":"提示：下洗→上下表面压力差\n解析：气流产生下洗是由于机翼上下表面存在压力差。上表面压力低，下表面压力高，导致气流从下表面绕过翼尖向上表面流动，形成下洗。","tags":[],"bankId":"uav-selected"},{"id":"sel-0200","type":"single","difficulty":1,"stem":"气流沿机翼表面附面层类型的变化是()。","options":[{"key":"A","text":"可由紊流变为层流"},{"key":"B","text":"可由层流变为紊流"},{"key":"C","text":"一般不发生变化"}],"answer":"B","analysis":"提示：层流变紊流\n解析：气流沿机翼表面流动，附面层类型可由层流变为紊流。通常在前端是层流，随着在翼表面流动长度增加，会变为紊流。","tags":[],"bankId":"uav-selected"},{"id":"sel-0201","type":"single","difficulty":1,"stem":"气体的伯努利定理是哪个定律在空气流动过程中的应用?","options":[{"key":"A","text":"能量守恒定律"},{"key":"B","text":"牛顿第一定律"},{"key":"C","text":"质量守恒定律"}],"answer":"A","analysis":"提示：伯努利→能量守恒 连续性方程→质量守恒 （努力能量，连续质量）\n解析：气体的伯努利定理是能量守恒定律在空气流动过程中的应用，表明在流动中，总能量保持不。","tags":[],"bankId":"uav-selected"},{"id":"sel-0202","type":"single","difficulty":1,"stem":"气体的连续性定理是哪个定律在空气流动过程中的应用?","options":[{"key":"A","text":"能量守恒定律"},{"key":"B","text":"牛顿第一定律"},{"key":"C","text":"质量守恒定律"}],"answer":"C","analysis":"提示：伯努利→能量守恒 连续性方程→质量守恒 （努力能量，连续质量）\n解析：气体的连续性定理是质量守恒定律在空气流动过程中的应用，确保流体流动时质量不会凭空产生或消失。","tags":[],"bankId":"uav-selected"},{"id":"sel-0203","type":"single","difficulty":1,"stem":"随着飞行速度的提高下列关于阻力的哪种说法是正确的?","options":[{"key":"A","text":"诱导阻力增大，废阻力增大"},{"key":"B","text":"诱导阻力减小，废阻力减小"},{"key":"C","text":"诱导阻力减小，废阻力增大"}],"answer":"C","analysis":"提示：快飞，诱小，废大\n解析：总阻力=诱导阻力+废阻力（蒙皮摩擦阻力+压差阻力+干扰阻力)增速的时候，不管是低速加速还是高速加速 诱导阻力下降， 废阻力全涨（诱导阻力下降的原因：飞得越快，需要迎角越小，翼尖涡流越弱，诱导阻力越小。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0204","type":"single","difficulty":1,"stem":"为了飞行安全，飞机飞行时的升力系数和迎角一般为()。","options":[{"key":"A","text":"最大升力系数和临界迎角最大"},{"key":"B","text":"最大升力系数和小于临界迎角的迎角限定值"},{"key":"C","text":"小于最大升力系数和临界迎角的两个限定值"}],"answer":"C","analysis":"提示：迎角<小余两个限定值\n解析：为保证飞行安全，飞机飞行时的升力系数和迎角通常小于最大升力系数和临界迎角。超过这两个限定值，飞机可能进入危险状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0205","type":"single","difficulty":1,"stem":"下列关于诱导阻力的哪种说法是正确的?","options":[{"key":"A","text":"增大机翼的展弦比可以减小诱导阻力"},{"key":"B","text":"把暴露在气流中的所有部件和零件都做成流线型，可以减小诱导阻力"},{"key":"C","text":"在飞机各部件之间加装整流包皮，可以减小诱导阻力"}],"answer":"A","analysis":"提示：诱导阻→增大展弦比，减小诱导阻力\n解析：增大机翼的展弦比可以减小诱导阻力。展弦比增大，机翼端部涡的强度减弱，诱导阻力减小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0206","type":"single","difficulty":1,"stem":"下列关于阻力的哪种说法是正确的?","options":[{"key":"A","text":"干扰阻力是由于气流的下洗而引起的"},{"key":"B","text":"在飞机各部件之间加装整流包皮可以减小诱导阻力"},{"key":"C","text":"干扰阻力是飞机各部件之间由于气流相互干扰而产生的一种额外阻力"}],"answer":"C","analysis":"提示：干扰→互相干扰→额外阻力，结构合理，抗干扰（散部件整包也为了减少干扰阻力）\n解析：干扰阻力是飞机各部件之间由于气流相互干扰而产生的一种额外阻力。而诱导阻力是由于机翼产生升力时伴随的下洗现象引起的;在飞机各部件之间加装整流包皮主要是减小干扰阻力，不是诱导阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0207","type":"single","difficulty":1,"stem":"下列哪项对飞机阻力大小影响不大?","options":[{"key":"A","text":"飞行速度、空气密度、机翼面积"},{"key":"B","text":"飞机的翼型和平面形状"},{"key":"C","text":"飞机的安装角和上反角"}],"answer":"C","analysis":"提示：飞机阻力→角没有面的影响大\n解析：飞机的安装角和上反角对飞机阻力大小影响相对较小。飞行速度、空气密度、机翼面积以及飞机的翼型和平面形状等因素对阻力大小的影响更为显著。","tags":[],"bankId":"uav-selected"},{"id":"sel-0208","type":"single","difficulty":1,"stem":"下列哪项与飞机诱导阻力大小无关?","options":[{"key":"A","text":"机翼的平面形状"},{"key":"B","text":"机翼的翼型"},{"key":"C","text":"机翼的根尖比"}],"answer":"B","analysis":"提示：诱导阻→增大展弦比，减小诱导阻力，与翼型无关\n解析：机翼的平面形状和根尖比会影响诱导阻力大小，而机翼的翼型对诱导阻力大小影响不大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0209","type":"single","difficulty":1,"stem":"下列叙述与伯努利定理无关的是()。","options":[{"key":"A","text":"流体流速大的地方压力小，流速小的地方压力大"},{"key":"B","text":"气流沿流管稳定流动过程中，气流的动压和静压之和等于常数"},{"key":"C","text":"气流低速流动时，流速与流管横截面积成正比"}],"answer":"C","analysis":"提示：低速，流速与和横截面积成反比。 选错的。成正比×\n解析：伯努利定理指出，流体流速大的地方压力小，流速小的地方压力大，同时气流沿流管稳定流动过程中，气流的动压和静压之和等于常数。而“气流低速流动时，流速与流管横截面积成正比”这一说法与伯努利定理无关。根据连续性原理，当流体不可压缩时，流速与流管横截面积成反比。","tags":[],"bankId":"uav-selected"},{"id":"sel-0210","type":"single","difficulty":1,"stem":"下列正确的是()。","options":[{"key":"A","text":"飞机的升阻比越大，飞机的空气动力特性越差"},{"key":"B","text":"飞机的升阻比越小，飞机的空气动力特性越好"},{"key":"C","text":"飞机的升阻比越大，飞机的空气动力特性越好"}],"answer":"C","analysis":"提示：升阻比大，动力好（其他两个选项一个意思，排除法选这个）\n解析：飞机的升阻比越大，:表示在产生相同升力的情况下，阻力越小，飞机的空气动力特性就越好。升阻比是衡量飞机空气动力性能的一个重要指标。升阻比大的飞机，在飞行中能够更有效地利用空气动力，提高飞行效率，降低燃油消耗等。","tags":[],"bankId":"uav-selected"},{"id":"sel-0211","type":"single","difficulty":1,"stem":"一个平滑流动或流线型流动里面的空气微团，接近一个低压区时()。","options":[{"key":"A","text":"会加速"},{"key":"B","text":"会减速"},{"key":"C","text":"速度不变"}],"answer":"A","analysis":"提示：高加速流向低\n解析：根据伯努利原理，当空气微团接近低压区时，其速度会增加，因为压力能和动能之和是常数。","tags":[],"bankId":"uav-selected"},{"id":"sel-0212","type":"single","difficulty":1,"stem":"超音速气流经过收缩管道后()。","options":[{"key":"A","text":"速度增加，压强增大"},{"key":"B","text":"速度增加，压强下降"},{"key":"C","text":"速度降低，压强增大"}],"answer":"C","analysis":"提示：亚音速（伯努利√） →速度大压强小（窄处高速低压） 超音速（与伯努利相反） →速度低压强大（窄处低速高压）\n解析：超音速气流经过收缩管道后，其速度会降低，压强则增大。这是由于在超音速流动中，气体的可压缩性成为主导因素。当高速气流进入收缩截面时，流管面积减小，气体分子被剧烈压缩，密度显著增加。这一过程消耗了气流的动能，使其速度下降，同时将动能转化为压力能，导致压强升高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0213","type":"single","difficulty":1,"stem":"通过一个收缩管道的流体，在管道的收缩区，速度的增加必然造成收缩区压力（）。","options":[{"key":"A","text":"增加"},{"key":"B","text":"减少"},{"key":"C","text":"不变"}],"answer":"B","analysis":"提示：窄处高速低压\n解析：本题考的是“连续性定理”+“伯努利定理”的结合。题干问的是收缩区的压力， 默认指静压，是航空题的常规表述。·根据连续性方程：管道收缩→横截面积减小→流速增大 ；·根据伯努利定理：总压恒定→流速增大→动压增大→静压必然减小；推导出：窄处高速低压","tags":[],"bankId":"uav-selected"},{"id":"sel-0214","type":"single","difficulty":1,"stem":"亚音速气流流过收缩管道，气流参数变化为（ ）。","options":[{"key":"A","text":"流速增加，压强增大"},{"key":"B","text":"速度降低，压强下降"},{"key":"C","text":"流速增加，气压下降"}],"answer":"C","analysis":"提示：亚音速（伯努利√） →速度大压强小（窄处高速低压） 超音速（与伯努利相反） →速度低压强大（窄处低速高压）\n解析：低速亚音速气流近似不可压缩，满足流体连续性方程：收缩管道→截面积减小→流速必然增加；同一流管内的低速定常流动，满足经典伯努利定理：总压守恒→流速增加→静压（压强）必然下降；本题答案为：流速增加、压强下降","tags":[],"bankId":"uav-selected"},{"id":"sel-0215","type":"single","difficulty":1,"stem":"飞行时间的含义是指","options":[{"key":"A","text":"自航空器开始起飞滑跑至着陆滑跑终止的时间"},{"key":"B","text":"从航空器起飞进入跑道至着陆脱离跑道的时间"},{"key":"C","text":"从航空器自装载地点开始滑行直到飞行结束到达卸载地点停止运动时为止的时间"}],"answer":"C","analysis":"提示：飞行时间→装载 卸载 相关\n解析：本题为待升级知识点，经本机构考场简单得出得分选项为“从航空器自装载地点开始滑行直到飞行结束到达卸载地点停止运动时为止的时间”，选项以考试得分为准。（其他相关补充：根据中国民用航空局飞行标准司2023年发布的《航线运输驾驶员执照理论考试大纲(飞机)知识点》，1.4.1.1.与飞行人员有关的各种时间的定义，知识点二：飞行时间，是指航空器为准备起飞而借助自身动力开始移动时起，到飞行结束停止移动时止的总时间。）","tags":[],"bankId":"uav-selected"},{"id":"sel-0216","type":"single","difficulty":1,"stem":"无人直升机或多旋翼飞行器飞行时间的含义是指()。","options":[{"key":"A","text":"起飞离地到着陆接地的瞬间"},{"key":"B","text":"起飞滑跑至着陆滑跑终止的瞬间"},{"key":"C","text":"旋翼开始转动至旋翼停止转动的瞬间"}],"answer":"C","analysis":"提示：旋翼--转动至停止\n解析：无人直升机或多旋翼飞行器飞行时间的含义是指旋翼开始转动至旋翼停止转动的瞬间，这是因为飞行时间的计算通常是以飞行器动力系统开始工作(即旋翼开始转动)到动力系统停止工作(即旋翼停止转动)的这段时间来衡量的。","tags":[],"bankId":"uav-selected"},{"id":"sel-0217","type":"single","difficulty":1,"stem":"降落时间的含义是指()。","options":[{"key":"A","text":"航空器接地的瞬间"},{"key":"B","text":"航空器着陆后前轮接地的瞬间"},{"key":"C","text":"航空器着陆滑跑终止的瞬间"}],"answer":"C","analysis":"提示：滑跑终止为降落\n解析：降落时间是指从航空器接触跑道开始滑跑到完全停止的整个过程所需的时间。这个瞬间标志着航空器成功着陆并处于静止状态。","tags":[],"bankId":"uav-selected"},{"id":"sel-0218","type":"single","difficulty":1,"stem":"起飞时间(陆上)的含义是指（）。","options":[{"key":"A","text":"航空器开始起飞滑跑轮子转动的瞬间"},{"key":"B","text":"航空器起飞滑跑抬前轮的瞬间"},{"key":"C","text":"航空器进入跑道对正起飞方向的瞬间"}],"answer":"A","analysis":"提示：起飞轮转，降落终止（只跟轮子转不转相关）\n解析：起飞时间(陆上)通常指的是航空器在跑道上开始滑跑，轮子开始转动的那一瞬间。这是飞机起飞过程的一个重要标志，标志着飞机从静止状态进入动态滑行阶段并准备加速起飞。","tags":[],"bankId":"uav-selected"},{"id":"sel-0219","type":"single","difficulty":1,"stem":"二冲程活塞汽油发动机应使用何种润滑油?","options":[{"key":"A","text":"4T机油"},{"key":"B","text":"2T机油"},{"key":"C","text":"汽车机油"}],"answer":"B","analysis":"提示：二冲对2T\n解析：二冲程活塞汽油发动机应使用2T机油。这种机油专为二冲程发动机设计，能够提供出色的润滑和清洁性能，确保引擎内部部件得到充分保护，并保障顺畅的动力输出。","tags":[],"bankId":"uav-selected"},{"id":"sel-0220","type":"single","difficulty":1,"stem":"（）的功能是向无人机各用电系统或设备提供满足预定设计要求的电能。","options":[{"key":"A","text":"供电系统"},{"key":"B","text":"配电系统"},{"key":"C","text":"电源"}],"answer":"A","analysis":"提示：供电=电源+配电\n解析：在无人机系统中，供电系统的功能是向无人机各用电气系统或设备提供满足预定设计要求的电能。供电系统是无人机电力供应的核心部分，它负责将电源(如电池)的电能有效地分配给无人机的各个用电系统或设备，确保无人机能够正常运行并完成预定任务。","tags":[],"bankId":"uav-selected"},{"id":"sel-0221","type":"single","difficulty":1,"stem":"（）两者组合统称为供电系统。","options":[{"key":"A","text":"电源和电缆"},{"key":"B","text":"电缆和配电系统"},{"key":"C","text":"电源和配电系统"}],"answer":"C","analysis":"提示：供电=电源+配电, 没电缆×\n解析：供电系统=电源+配电系统（电线+保护装置）在无人机上使用的动力、测控、飞行控制与管理、导航、任务设备等系统都与电气系统有关。无人机电气系统一般包括电源、配电系统、用电设备三个部分。电源和配电系统两者的组合统称为供电系统。供电系统的功能是向无人机各用电系统或设备提供满足预定设计要求的电能。配电系统应将电能可靠面有效地输送到各用电系统和设备。配电系统由传输电线和控制与保护装置组成。（鼠鼠老师的话：电线/电缆 归属配电系统，所以不能单独出现，单独出现带电线/电缆的选项就错啦）","tags":[],"bankId":"uav-selected"},{"id":"sel-0222","type":"single","difficulty":1,"stem":"下列哪个因素对多旋翼航拍效果影响最大？","options":[{"key":"A","text":"风速"},{"key":"B","text":"负载体积"},{"key":"C","text":"负载类型"}],"answer":"A","analysis":"提示：航拍→飞行速度&风速\n解析：风速对多旋翼航拍效果影响最大，因为风会引起：机体姿态和位置不断变化；悬停稳定性下降；云台产生修正动作，画面抖动；航线和构图保持困难；电机负荷增大，续航时间缩短。“负载体积”和“负载类型”也会影响飞行，但前提是负载的重量、重心、安装方式等不合理。","tags":[],"bankId":"uav-selected"},{"id":"sel-0223","type":"single","difficulty":1,"stem":"使用多旋翼飞行器作业过程中，必须紧急返航的情况是","options":[{"key":"A","text":"距离过远，高度过高，超出视线范围"},{"key":"B","text":"监视器显示无人机电池电量过低"},{"key":"C","text":"图传监视器有干扰不稳定"}],"answer":"B","analysis":"提示：电低→紧急返航\n解析：电池电量过低可能导致飞行器失去动力而坠落。","tags":[],"bankId":"uav-selected"},{"id":"sel-0224","type":"single","difficulty":1,"stem":"使用多旋翼飞行器在低温及潮湿环境中作业时的注意事项，不包括( )。","options":[{"key":"A","text":"曝光偏差"},{"key":"B","text":"起飞前动力电池的保温"},{"key":"C","text":"飞行器与摄像器材防止冰冻"}],"answer":"A","analysis":"提示：曝光与低温无关\n解析：使用多旋翼飞行器在低温及潮湿环境中作业时，需要注意起飞前动力电池的保温、飞行器与摄像器材防止冰冻等问题，以确保设备正常运作。曝光偏差与这种特定环境无直接关联。","tags":[],"bankId":"uav-selected"},{"id":"sel-0225","type":"single","difficulty":1,"stem":"影响翼型性能的最主要的参数是()。","options":[{"key":"A","text":"前缘和后缘"},{"key":"B","text":"翼型的厚度和弯度"},{"key":"C","text":"弯度和前缘"}],"answer":"B","analysis":"提示：翼型→厚度弯度\n解析：影响翼型性能的最主要参数是翼型的厚度和弯度。厚度影响翼型的阻力和强度，弯度则主要影响升力的产生和分布。","tags":[],"bankId":"uav-selected"},{"id":"sel-0226","type":"single","difficulty":1,"stem":"增大翼型最大升力系数的两个因素是()。","options":[{"key":"A","text":"厚度和机翼面积"},{"key":"B","text":"弯度和翼展"},{"key":"C","text":"厚度和弯度"}],"answer":"C","analysis":"提示：翼型→厚度弯度\n解析：增大翼型的厚度和弯度能增加翼型的最大升力系数。","tags":[],"bankId":"uav-selected"},{"id":"sel-0227","type":"single","difficulty":1,"stem":"翼型的最大厚度与弦长的比值称为（）。","options":[{"key":"A","text":"相对弯度"},{"key":"B","text":"相对厚度"},{"key":"C","text":"最大弯度"}],"answer":"B","analysis":"提示：最大厚度对相对厚度\n解析：翼型的最大厚度与弦长的比值称为相对厚度。相对厚度较大的翼型在低速时能产生较大升力，但高速时阻力也较大;相对厚度较小的翼型则相反。","tags":[],"bankId":"uav-selected"},{"id":"sel-0228","type":"single","difficulty":1,"stem":"翼型的最大弯度与弦长的比值称为（）。","options":[{"key":"A","text":"相对弯度"},{"key":"B","text":"相对厚度"},{"key":"C","text":"最大厚度"}],"answer":"A","analysis":"提示：最大弯度对相对弯度\n解析：翼型的最大弯度与弦长的比值称为相对弯度。相对弯度大的翼型升力系数较大，但阻力也可能相应增加;相对弯度小的翼型则升力系数较小。","tags":[],"bankId":"uav-selected"},{"id":"sel-0229","type":"single","difficulty":1,"stem":"利用增大机翼弯度来提高机翼的升力系数，会导致()。","options":[{"key":"A","text":"机翼上表面最低压力点前移，减小临界迎角"},{"key":"B","text":"机翼上表面最低压力点后移，减小临界迎角"},{"key":"C","text":"机翼上表面最低压力点前移，加大临界迎角"}],"answer":"A","analysis":"提示：弯度→点前移，减小迎角（弯要减前）\n解析：增大机翼弯度，机翼上表面最低压力点前移，使得气流更容易分离，从而减小临界迎角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0230","type":"single","difficulty":1,"stem":"关于平凸翼型的剖面形状，下面说法正确的是()。","options":[{"key":"A","text":"上下翼面的弯度相同"},{"key":"B","text":"机翼上表面的弯度小于下表面的弯度"},{"key":"C","text":"机翼上表面的弯度大于下表面的弯度"}],"answer":"C","analysis":"提示：平凸，上大于下\n解析：平凸翼型的剖面形状特点是机翼上表面的弯度大于下表面的弯度，这种设计有助于产生更大的升力，提高飞机的飞行性能。","tags":[],"bankId":"uav-selected"},{"id":"sel-0231","type":"single","difficulty":1,"stem":"使用机翼后缘襟翼提高升力系数的同时临界迎角减小的主要原因是( )。","options":[{"key":"A","text":"放下后缘襟翼时，增大了机翼的弯度"},{"key":"B","text":"放下后缘襟翼时，增大了机翼的面积"},{"key":"C","text":"放下后缘襟翼时，在上下翼面之间形成了缝隙"}],"answer":"A","analysis":"提示：迎角，弯度\n解析：放下后缘襟翼时，增大了机翼的弯度，这增加了机翼的有效迎角，从而提高了升力系数。然而，由于弯度的增加，机翼上表面的气流更容易分离，导致临界迎角减小。因此，虽然升力系数提高了，但飞机在更高的迎角下更容易失速，","tags":[],"bankId":"uav-selected"},{"id":"sel-0232","type":"single","difficulty":1,"stem":"增大机翼弯度可以增大机翼升力的原理是( )。","options":[{"key":"A","text":"使附面层保持层流状态"},{"key":"B","text":"加快机翼前缘上表面气流的流速"},{"key":"C","text":"加快机翼后缘气流的流速"}],"answer":"B","analysis":"提示：机翼弯度→表面气流\n解析：增大机翼弯度可以改变机翼的气动特性，特别是影响机翼上表面的气流路径。当机翼弯度增大时，机翼上表面的气流路径变长，导致气流速度加快，根据伯努利原理，气流速度加快会导致气压降低，从而产生更大的升力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0233","type":"single","difficulty":1,"stem":"多旋翼飞行器动力系统主要使用()。","options":[{"key":"A","text":"无刷电机"},{"key":"B","text":"有刷电机"},{"key":"C","text":"四冲程发动机"}],"answer":"A","analysis":"提示：外转无刷\n解析：多旋翼飞行器动力系统主要使用无刷电机。无刷电机广泛应用于多旋翼飞行器、无人机和遥控飞机等模型领域。相比于有刷电机无刷电机具有高效、寿命长、噪音小和不易受干扰的优点。","tags":[],"bankId":"uav-selected"},{"id":"sel-0234","type":"single","difficulty":1,"stem":"多旋翼飞行器动力系统主要使用()。","options":[{"key":"A","text":"步进电机"},{"key":"B","text":"内转子电机"},{"key":"C","text":"外转子电机"}],"answer":"C","analysis":"提示：外传无刷\n解析：外转子电机是无刷电机的一种。外转子电机的主要特点是转子在外部，定子在内部。多旋翼飞行器动力系统主要使用外转子电机。","tags":[],"bankId":"uav-selected"},{"id":"sel-0235","type":"single","difficulty":1,"stem":"无刷电机与有刷电机的区别有()。","options":[{"key":"A","text":"无刷电机效率较高"},{"key":"B","text":"有刷电机效率较高"},{"key":"C","text":"两类电机效率差不多"}],"answer":"A","analysis":"提示：有刷转速高，无刷效率高\n解析：无刷电机通过电子控制器来实现定子磁场的旋转，从而驱动转子上的永磁体旋转。由于没有电刷和换向器，减少了机械摩擦和能量损失，因此具有更高的运行效率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0236","type":"single","difficulty":1,"stem":"多旋翼飞行器使用的电调通常被划分为()。","options":[{"key":"A","text":"有刷电调和无刷电调"},{"key":"B","text":"直流电调和交流电调"},{"key":"C","text":"有极电调和无极电调"}],"answer":"A","analysis":"提示：电调有刷无刷\n解析：多旋翼飞行器电调分为有刷和无刷电调。无刷电调因效率高、寿命长而更常用，满足高性能需求。","tags":[],"bankId":"uav-selected"},{"id":"sel-0237","type":"single","difficulty":1,"stem":"机场上吹东风时，飞机起飞着陆的最好方向应是（）。","options":[{"key":"A","text":"由东向西"},{"key":"B","text":"由西向东"},{"key":"C","text":"由北向南"}],"answer":"B","analysis":"提示：自西向东，逆风起降\n解析：机场上吹东风时，飞机起飞着陆的最好方向是由西向东，这样可以利用风的助力，减少起飞和着陆时的地速要求，提高安全性，","tags":[],"bankId":"uav-selected"},{"id":"sel-0238","type":"single","difficulty":1,"stem":"如果在机场中只有一条跑道，其跑道使用方向应保证航空器能够（）。","options":[{"key":"A","text":"逆风起降"},{"key":"B","text":"侧风起降"},{"key":"C","text":"顺风起降"}],"answer":"A","analysis":"提示：逆风起降\n解析：起降都应逆风1.逆风可以减小起降滑跑距离，提升操纵安全性。2.按照国家机场选址要求，跑道走向要考虑当地主导风向进行布置，尽量让飞机能够逆风起飞和降落。3.经济考量，逆风起降跑道短，占地少工程量少","tags":[],"bankId":"uav-selected"},{"id":"sel-0239","type":"single","difficulty":1,"stem":"风向270度，航向90度，这时无人机在（）。","options":[{"key":"A","text":"顺风飞行"},{"key":"B","text":"逆风飞行"},{"key":"C","text":"侧风飞行"}],"answer":"A","analysis":"提示：27090顺风飞行 （风向:风来的方向 航向:飞机前进方向飞机）\n解析：风向270度表示风来自西方，航向90度表示无人机朝东飞行。因此，风的方向与无人机的飞行方向相同，是顺风飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0240","type":"single","difficulty":1,"stem":"地球自转产生的地球自转偏向力对风向产生影响，下列哪个是正确的？","options":[{"key":"A","text":"北半球，地球自转偏向力使得空气向西偏转"},{"key":"B","text":"北半球，地球自转偏向力使得空气向东偏转"},{"key":"C","text":"北半球，地球自转偏向力使得空气先向东再向西偏转"}],"answer":"B","analysis":"提示：北半球：右（东）\n解析：根据蓝皮书 4.3.1 对流产生的原因 的表述： 地球自转产生的地球自转偏向力对风向产生了影响。 以北半球为例, 地球自转偏向力使得空气向右偏转（东）,偏转的程度根据纬度的不同而变化,在极地最大,在赤道降低为零。","tags":[],"bankId":"uav-selected"},{"id":"sel-0241","type":"single","difficulty":1,"stem":"对于具有静稳定性的飞机，向左侧滑时其机头会()。","options":[{"key":"A","text":"保持不变"},{"key":"B","text":"向左转"},{"key":"C","text":"向右转"}],"answer":"B","analysis":"提示：稳定想修正，同向修正，逆向反转\n解析：侧滑角是指相对气流的方向和飞行器对称面之间的夹角，用 β 表示。风从左侧来，叫“左侧滑”。我们从图中可以看出，“左侧滑”时机头偏右，这时候静稳定性想让飞机机头正回来，就向左转。","tags":[],"bankId":"uav-selected"},{"id":"sel-0242","type":"single","difficulty":1,"stem":"无人机左侧风中起飞，侧风有使飞机机头向( )偏转的趋势。","options":[{"key":"A","text":"左"},{"key":"B","text":"右"},{"key":"C","text":"视风速的大小不同可能向左也可能向右"}],"answer":"A","analysis":"提示：左侧风使飞机左偏转\n解析：在左侧风中起飞时，侧风有使飞机机头向左偏转的趋势。这是因为侧风对飞机右侧产生的压力大于左侧，导致飞机有向左偏转的趋势。飞行员需要相应调整操纵以保持飞机稳定。","tags":[],"bankId":"uav-selected"},{"id":"sel-0243","type":"single","difficulty":1,"stem":"增大飞机机翼的展弦比，目的是减小飞机的()。","options":[{"key":"A","text":"摩擦阻力"},{"key":"B","text":"压差阻力"},{"key":"C","text":"诱导阻力"}],"answer":"C","analysis":"提示：诱导阻→增大展弦比，减小诱导阻力\n解析：展弦比增大，翼尖涡强度减弱，诱导阻力减小。增大机翼展弦比可减小诱导阻力提高飞机的飞行效率。","tags":[],"bankId":"uav-selected"},{"id":"sel-0244","type":"single","difficulty":1,"stem":"有些飞机的翼尖部位安装了翼梢小翼，它的功用是()。","options":[{"key":"A","text":"减小摩擦阻力"},{"key":"B","text":"减小压差阻力"},{"key":"C","text":"减小诱导阻力"}],"answer":"C","analysis":"提示：诱导阻→升力和翼展长度和翼尖 干扰阻→ 部件平整度 （诱导阻→增大展弦比，减小诱导阻力，与翼型无关）\n解析：翼尖安装翼梢小翼的功用是减小诱导阻力。它改变了翼尖处的气流流动，减少翼尖涡的强度。翼尖涡导致诱导阻力产生，翼梢小翼通过阻挡上下表面气流的横向流动，降低涡的强度，从而减小诱导阻力。","tags":[],"bankId":"uav-selected"},{"id":"sel-0245","type":"single","difficulty":1,"stem":"下列关于升阻比的哪种说法是不正确的?","options":[{"key":"A","text":"升力系数达到最大时，升阻比也达到最大"},{"key":"B","text":"升力和阻力之比升阻比达到最大之前，随迎角增加"},{"key":"C","text":"升阻比成线性增加"}],"answer":"A","analysis":"提示：选错的。升阻比两个最大×\n解析：升力系数达到最大时，并不意味着升阻比也达到最大。升阻比是升力与阻力的比值它随迎角的增加而增加，但当迎角增加到一定程度后，阻力会迅速增加，导致升阻比下降。因此，升阻比达到最大值时的迎角通常小于升力系数达到最大值时的迎角。","tags":[],"bankId":"uav-selected"},{"id":"sel-0246","type":"single","difficulty":1,"stem":"侧风中着陆，为了修正偏流，可以采用既修正了偏流，又使飞机的升阻比不减小的（）。","options":[{"key":"A","text":"改变航向法"},{"key":"B","text":"改变航向法和侧滑法相结合"},{"key":"C","text":"侧滑法"}],"answer":"A","analysis":"提示：修正偏流改航向（侧风+侧滑会滑倒）\n解析：改变航向法是通过调整飞机的航向，使飞机的机头指向与跑道方向形成一定夹角，从而使飞机在接地瞬间能够对准跑道中心线。这种方法在修正偏流的同时，飞机的机身仍然与气流方向平行，不会改变飞机的升力和阻力特性，升阻比不会减小，能够更好地保持飞机的飞行性能和着陆稳定性。","tags":[],"bankId":"uav-selected"},{"id":"sel-0247","type":"single","difficulty":1,"stem":"根据机翼升力和阻力计算公式可以得出，通过增大机翼面积来增大升力的同时()。","options":[{"key":"A","text":"阻力不变"},{"key":"B","text":"阻力减小"},{"key":"C","text":"阻力也随着增大"}],"answer":"C","analysis":"提示：升力↑阻力↑\n解析：增大机翼面积会增大空气阻力作用面积从而使阻力也随之增大。","tags":[],"bankId":"uav-selected"},{"id":"sel-0248","type":"single","difficulty":1,"stem":"根据机翼的设计特点，其产生的升力来自于( )。","options":[{"key":"A","text":"机翼上下表面的正压强"},{"key":"B","text":"机翼下表面的负压和上表面的正压"},{"key":"C","text":"机翼下表面的正压和上表面的负压"}],"answer":"C","analysis":"提示：下正上负\n解析：机翼的设计特点使其下表面为正压，上表面为负压，这种压力差产生了升力，使飞机能够飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0249","type":"single","difficulty":1,"stem":"目前多旋翼飞行器飞控市场上的APM飞控特点是()。","options":[{"key":"A","text":"可以应用于各种特种飞行器"},{"key":"B","text":"基于Android开发"},{"key":"C","text":"配有地面站软件，代码开源"}],"answer":"C","analysis":"提示：没有便宜就选开源\n解析：APM（ArduPilot Mega）是开源自动驾驶仪项目，通常配套 Mission Planner 等地面站软件，可用于参数设置、任务规划、飞行监控和数据分析。","tags":[],"bankId":"uav-selected"},{"id":"sel-0250","type":"single","difficulty":1,"stem":"目前多旋翼飞行器飞控市场上的KK飞控具有的优点是（）。","options":[{"key":"A","text":"功能强大，可以实现全自主飞行"},{"key":"B","text":"价格便宜，硬件结构简单"},{"key":"C","text":"配有地面站软件，代码开源"}],"answer":"B","analysis":"提示：有便宜选便宜 没有便宜就选代码\n解析：KK飞控属于较早期、入门级的多旋翼飞控，主要用于基本姿态稳定和手动操纵，特点是成本较低、结构简单、设置方便。","tags":[],"bankId":"uav-selected"},{"id":"sel-0251","type":"single","difficulty":1,"stem":"现代民航客机一般巡航的大气层是()。","options":[{"key":"A","text":"对流层顶层、平流层底层"},{"key":"B","text":"平流层顶层"},{"key":"C","text":"对流层底层"}],"answer":"A","analysis":"提示：民航客机，两个之间 （对流顶 平流底）\n解析：现代民航客机一般巡航在对流层顶层、平流层底层。在这个高度范围，大气条件相对稳定，气流较为平稳，气象条件相对较好，有利于飞行的安全和舒适。同时，这个高度的空气阻力较小，能够提高飞行效率，降低燃油消耗。 平流层顶层的高度过高，不适合民航客机常规巡航。对流层底层气象条件复杂，气流不稳定，不利于民航飞行。","tags":[],"bankId":"uav-selected"},{"id":"sel-0252","type":"single","difficulty":1,"stem":"对流层中，按气流和天气现象分布的特点，可分为下、中、上三个层次，代表对流层中层气流的基本趋势是（）。","options":[{"key":"A","text":"气流相对平稳"},{"key":"B","text":"水汽含量很少"},{"key":"C","text":"气流混乱"}],"answer":"A","analysis":"提示：中层稳定\n解析：对流层中层气流相对平稳，这是对流层中层气流的基本趋势。在对流层中，下层气流混乱，上层水汽含量少，而中层则相对平稳。","tags":[],"bankId":"uav-selected"},{"id":"sel-0253","type":"single","difficulty":1,"stem":"对流层的主要特征，哪个正确？","options":[{"key":"A","text":"空气具有强烈的垂直混合"},{"key":"B","text":"气温、湿度的水平分布均匀"},{"key":"C","text":"气温随高度不变"}],"answer":"A","analysis":"提示：垂直\n解析：对流层的主要特征是空气具有强烈的垂直混合。这是因为对流层内气温随高度变化导致空气上升或下沉，形成强烈的对流运动，从而使得空气在垂直方向上充分混合。","tags":[],"bankId":"uav-selected"},{"id":"sel-0254","type":"single","difficulty":1,"stem":"以下选项哪个不是对流层的主要特征（）。","options":[{"key":"A","text":"气温随高度升高而升高"},{"key":"B","text":"空气具有强烈的垂直混合"},{"key":"C","text":"气温、湿度的水平分布很不均匀"}],"answer":"A","analysis":"提示：选错的。温度高而升高错误！\n解析：对流层的主要特征包括气温、湿度的水平分布很不均匀，以及空气具有强烈的垂直混合。而对流层内气温通常是随高度升高而降低的，而不是升高。","tags":[],"bankId":"uav-selected"},{"id":"sel-0255","type":"single","difficulty":1,"stem":"平流层范围从对流层顶到大约55km的高度上，空气热量的主要来源是臭氧吸收太阳紫外辐射，因此( )。","options":[{"key":"A","text":"平流层中气温随高度增高而升高"},{"key":"B","text":"平流层中气温不随高度变化而变化"},{"key":"C","text":"平流层中不含有水汽"}],"answer":"A","analysis":"提示：平流层→臭氧吸收紫外线→高度↑温度↑\n解析：平流层范围从对流层顶到大约55km的高度上，其空气热量的主要来源是臭氧吸收太阳紫外辐射。因此，在平流层中，气温随高度增高而升高，这与对流层的气温随高度降低的特点形成鲜明对比。","tags":[],"bankId":"uav-selected"},{"id":"sel-0256","type":"single","difficulty":1,"stem":"下面大气分层的主要依据哪个是正确的？","options":[{"key":"A","text":"气层中风的垂直变化特点"},{"key":"B","text":"气层气温的垂直分布特点"},{"key":"C","text":"气层气压的垂直分布特点"}],"answer":"B","analysis":"提示：大气分层→气层气温\n解析：大气分层的主要依据是气层气温的垂直分布特点。不同的大气层(如对流层、平流层、中间层等)具有不同的气温垂直分布特征，这是划分它们的主要标准。气压和风的垂直变化也是重要特征，但不是主要分层依据。","tags":[],"bankId":"uav-selected"},{"id":"sel-0257","type":"single","difficulty":1,"stem":"下列叙述不属于平流层的特点是()。","options":[{"key":"A","text":"空气中的风向、风速不变"},{"key":"B","text":"温度大体不变，平均在-56.5℃"},{"key":"C","text":"空气上下对流激烈"}],"answer":"C","analysis":"提示：平流→上下不对流\n解析：平流层中空气上下对流很弱，不是激烈平流层的主要特点是气流平稳。","tags":[],"bankId":"uav-selected"},{"id":"sel-0258","type":"single","difficulty":1,"stem":"飞机在对流层中匀速爬升时，随着飞行高度的增加，飞机飞行马赫数()。","opti
